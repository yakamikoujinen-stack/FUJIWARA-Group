<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>配置スタッフ 月間スケジュール表｜KING</title><style>:root{--text:#102043;--line:#dbe3ed;--blue:#2b78c5}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f5f8fc;color:var(--text)}.wrap{max-width:1200px;margin:auto;padding:14px 14px 90px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:14px 16px;margin-bottom:12px}.head h1{font-size:23px;margin:0}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.back,.add{border:0;border-radius:12px;padding:10px 14px;color:#fff;font-weight:900}.back{background:#17324d}.add{background:#168653}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin-bottom:12px}.controls button{border:1px solid #ccd7e4;background:#fff;border-radius:10px;padding:9px 12px;font-weight:900;color:#17324d}.month{font-size:21px;font-weight:950;min-width:130px;text-align:center}.filter{width:min(280px,100%);padding:10px;border:1px solid #ccd7e4;border-radius:10px;font-weight:900}.cal{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);touch-action:pan-y}.dow,.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.dow{text-align:center;padding:8px;background:#f3f6fa;font-weight:950}.day{min-height:118px;padding:6px}.num{font-weight:950}.entry{margin-top:5px;padding:6px;border-radius:8px;border-left:5px solid var(--b,#2b78c5);background:var(--bg,#eaf4ff);font-size:11px;line-height:1.4;font-weight:800}.entry.manual{cursor:pointer}.staff{margin-top:4px;padding-top:4px;border-top:1px dashed rgba(16,32,67,.18);font-weight:950;color:#17324d}.nostaff{color:#9a3412}.empty{background:#f8fafc}.note{font-size:11px;color:#647188;font-weight:800;margin-top:10px}.legend{margin-top:8px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:9px 12px;font-size:11px;font-weight:800;color:#52657a}.modal{display:none;position:fixed;inset:0;background:rgba(15,35,55,.45);z-index:1000;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{width:min(520px,100%);background:#fff;border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.box h2{margin:0 0 12px;font-size:21px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:900;color:#52657a;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #ccd7e4;border-radius:10px;padding:11px;font:inherit}.field textarea{min-height:75px;resize:vertical}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions button{flex:1;border:0;border-radius:11px;padding:11px;font-weight:900}.save{background:#168653;color:#fff}.cancel{background:#eef2f6;color:#17324d}.delete{background:#fff0f0;color:#b33b3b;border:1px solid #f2b9b9!important}@media(max-width:700px){.day{min-height:88px;padding:4px}.entry{font-size:9px;padding:4px}.head{align-items:flex-start}.head h1{font-size:18px}.head-actions{justify-content:flex-end}.filter{width:100%}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><main class="wrap"><section class="head"><h1>👥 配置スタッフ 月間スケジュール表</h1><div class="head-actions"><button class="add" onclick="openManual()">＋ その他予定</button><button class="back" onclick="goBack()">← 戻る</button></div></section><section class="controls"><button onclick="moveMonth(-1)">‹ 前月</button><div id="monthTitle" class="month"></div><button onclick="moveMonth(1)">次月 ›</button><button onclick="resetMonth()">今月</button><select id="staffFilter" class="filter" onchange="render()"><option value="">すべてのスタッフ</option></select><select id="clientFilter" class="filter" onchange="render()"><option value="">すべての取引先</option></select></section><section id="calendar" class="cal"></section><div class="legend">表示例：取引先［メイン／建設］→イベント名・現場名→👥配置スタッフ。手入力の「その他予定」は緑色で表示し、タップすると編集・削除できます。</div><div class="note">既存の取引先名別カレンダー、メインアプリ、建設アプリの元データは変更しません。手入力予定だけを別保存します。</div></main><div id="manualModal" class="modal"><div class="box"><h2>📝 その他予定</h2><input id="manualId" type="hidden"><div class="field"><label>日付</label><input id="manualDate" type="date"></div><div class="field"><label>予定名</label><input id="manualTitle" placeholder="例：倉庫整理・打合せ・休み"></div><div class="field"><label>場所・メモ</label><textarea id="manualPlace" placeholder="場所や内容"></textarea></div><div class="field"><label>配置スタッフ（「・」または「、」区切り）</label><input id="manualStaff" placeholder="例：藤原・文太・将"></div><div class="modal-actions"><button id="deleteBtn" class="delete" onclick="deleteManual()">削除</button><button class="cancel" onclick="closeManual()">キャンセル</button><button class="save" onclick="saveManual()">保存</button></div></div></div><script>const cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.database(),MANUAL_PATH='fujiwara/staff_schedule_manual';let evs=[],reps=[],manuals={},cur=new Date();cur.setDate(1);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function arr(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);if(typeof v==='object')return Object.keys(v).map(k=>v[k]).filter(Boolean);return[]}function uniq(a){return [...new Set(a.map(v=>String(v||'').trim()).filter(Boolean))]}function clientOf(x,src){return String(x.client||x.clientName||x.customer||x.customerName||(src==='main'?(x.zone||x.orderer||x.supplier):'')||'未設定')}function datesOf(e){let a=String(e.date||e.startDate||'').slice(0,10),b=String(e.dateEnd||e.endDate||'').slice(0,10),out=[];if(!a)return out;let d=new Date(a+'T00:00:00'),z=b?new Date(b+'T00:00:00'):new Date(d);for(let i=0;d<=z&&i<62;i++,d.setDate(d.getDate()+1))out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));return out}function namesFrom(v){let out=[];if(!v)return out;if(typeof v==='string')out=v.split(/[、,，／\/\n・]+/);else if(Array.isArray(v))v.forEach(x=>{if(typeof x==='string')out.push(x);else if(x&&typeof x==='object')out.push(x.name||x.staffName||x.userName||x.person||'')});else if(typeof v==='object')Object.keys(v).forEach(k=>{let x=v[k];if(x===true||x==='○'||x==='⭕'||x==='出勤'||x==='参加'||x===1)out.push(k);else if(typeof x==='string'){if(x==='○'||x==='⭕'||x==='出勤'||x==='参加')out.push(k);else if(k==='name'||k==='staffName'||k==='userName')out.push(x)}else if(x&&typeof x==='object')out.push(x.name||x.staffName||x.userName||x.person||k)});return uniq(out)}function staffForMain(e,ds){let out=[];const dayContainers=[e.staffByDate,e.staffsByDate,e.attendanceByDate,e.assignmentsByDate,e.dailyStaff,e.staffDays,e.attendanceDays,e.days];dayContainers.forEach(c=>{if(c&&typeof c==='object'&&c[ds]){let d=c[ds];out.push(...namesFrom(d.staff||d.staffs||d.members||d.people||d.attendance||d.assignments||d.workers||d))}});if(!out.length){[e.staff,e.staffs,e.members,e.people,e.assignedStaff,e.assignedStaffs,e.staffNames,e.workers,e.attendance,e.assignments,e.cast,e.member].forEach(v=>out.push(...namesFrom(v)))}return uniq(out)}function staffForReport(r){let out=[];[r.staff,r.staffs,r.members,r.people,r.workers,r.worker,r.personnel,r.assignedStaff,r.attendance,r.names,r.member].forEach(v=>out.push(...namesFrom(v)));return uniq(out)}const pal=[['#fff0f0','#e04b4b'],['#eef7ff','#3182ce'],['#f1f9ed','#55a04a'],['#fff6df','#d49a13'],['#f6efff','#8b5cc7'],['#eafaf7','#269b83'],['#fff0f7','#d45b91'],['#f1f1ff','#6565c7'],['#fff3e8','#d9782d'],['#eef8f4','#388d6a']];function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h)}function col(c){const f={'テキヤ':['#fff0f0','#e04b4b'],'ピスタチオ':['#eef7ff','#3182ce'],'コナンプロデュース':['#f6efff','#8b5cc7'],'コナンプロジュース':['#f6efff','#8b5cc7'],'うまいもん屋':['#f1f9ed','#55a04a'],'鳥取案件':['#fff6df','#d49a13'],'優成建設':['#eaf4ff','#2b78c5'],'前田建設':['#eafaf7','#269b83'],'その他':['#edfdf3','#168653']};for(const k in f)if(c.includes(k))return f[k];return pal[hash(c)%pal.length]}function buildRows(){let rows=[];evs.forEach(e=>{let c=clientOf(e,'main');datesOf(e).forEach(ds=>rows.push({date:ds,client:c,title:e.name||'イベント名未入力',place:e.place||'',src:'メイン',staff:staffForMain(e,ds)}))});reps.forEach(r=>{let ds=String(r.date||r.rDate||'').slice(0,10);if(!ds)return;rows.push({date:ds,client:clientOf(r,'construction'),title:r.site||r.siteName||r.place||r.rSite||'現場名未入力',place:r.place||'',src:'建設',staff:staffForReport(r)})});Object.keys(manuals||{}).forEach(id=>{let x=manuals[id]||{};if(x.date)rows.push({id,date:String(x.date).slice(0,10),client:'その他予定',title:x.title||'その他予定',place:x.place||'',src:'手入力',staff:namesFrom(x.staff),manual:true})});return rows}function refreshFilters(){const rows=buildRows(),sf=document.getElementById('staffFilter'),cf=document.getElementById('clientFilter'),oldS=sf.value,oldC=cf.value,ss={},cc={};rows.forEach(r=>{r.staff.forEach(n=>ss[n]=1);cc[r.client]=1});sf.innerHTML='<option value="">すべてのスタッフ</option>'+Object.keys(ss).sort().map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');cf.innerHTML='<option value="">すべての取引先</option>'+Object.keys(cc).sort().map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');if(ss[oldS])sf.value=oldS;if(cc[oldC])cf.value=oldC}function moveMonth(n){cur.setMonth(cur.getMonth()+n);render()}function resetMonth(){cur=new Date();cur.setDate(1);render()}function render(){const y=cur.getFullYear(),m=cur.getMonth(),staffFilter=document.getElementById('staffFilter').value,clientFilter=document.getElementById('clientFilter').value;monthTitle.textContent=y+'年 '+(m+1)+'月';let rows=buildRows().filter(r=>(!staffFilter||r.staff.includes(staffFilter))&&(!clientFilter||r.client===clientFilter));let html=['日','月','火','水','木','金','土'].map(x=>'<div class="dow">'+x+'</div>').join('');let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let inMonth=d.getMonth()===m;let ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let rr=inMonth?rows.filter(r=>r.date===ds):[];html+='<div class="day '+(inMonth?'':'empty')+'"><div class="num">'+(inMonth?d.getDate():'')+'</div>'+rr.map(r=>{let c=col(r.client),staff=r.staff.length?'👥 '+r.staff.map(esc).join('・'):'👥 配置未登録',click=r.manual?' onclick="editManual(\''+esc(r.id)+'\')"':'';return '<div class="entry '+(r.manual?'manual':'')+'"'+click+' style="--bg:'+c[0]+';--b:'+c[1]+'"><b>'+esc(r.client)+'</b> ['+r.src+']<br>'+esc(r.title)+(r.place?'<br>📍'+esc(r.place):'')+'<div class="staff '+(r.staff.length?'':'nostaff')+'">'+staff+'</div></div>'}).join('')+'</div>'}calendar.innerHTML=html}function openManual(){manualId.value='';manualDate.value=new Date().toISOString().slice(0,10);manualTitle.value='';manualPlace.value='';manualStaff.value='';deleteBtn.style.display='none';manualModal.classList.add('show')}function editManual(id){let x=manuals[id];if(!x)return;manualId.value=id;manualDate.value=x.date||'';manualTitle.value=x.title||'';manualPlace.value=x.place||'';manualStaff.value=Array.isArray(x.staff)?x.staff.join('・'):(x.staff||'');deleteBtn.style.display='block';manualModal.classList.add('show')}function closeManual(){manualModal.classList.remove('show')}async function saveManual(){let date=manualDate.value,title=manualTitle.value.trim();if(!date||!title){alert('日付と予定名を入力してください');return}let id=manualId.value||db.ref(MANUAL_PATH).push().key;let data={date,title,place:manualPlace.value.trim(),staff:namesFrom(manualStaff.value),updatedAt:new Date().toISOString()};await db.ref(MANUAL_PATH+'/'+id).set(data);closeManual()}async function deleteManual(){let id=manualId.value;if(!id)return;if(!confirm('この予定を削除しますか？'))return;await db.ref(MANUAL_PATH+'/'+id).remove();closeManual()}function goBack(){if(document.referrer&&document.referrer.includes('manager-app'))location.href='manager-app.html';else location.href='king.html'}db.ref(MANUAL_PATH).on('value',s=>{manuals=s.val()||{};refreshFilters();render()});Promise.all([db.ref('fujiwara/events').once('value'),db.ref('fujiwara/construction/reports').once('value')]).then(([a,b])=>{let v=a.val()||{};evs=(Array.isArray(v)?v:Object.keys(v).map(k=>v[k])).filter(Boolean);let r=b.val()||{};reps=Object.keys(r).map(k=>r[k]||{});refreshFilters();render()}).catch(e=>{calendar.innerHTML='<div style="grid-column:1/-1;padding:30px;background:#fff;color:#b33b3b;font-weight:900">データ読込に失敗しました：'+esc(e.message||e)+'</div>'});let sx=0,sy=0;calendar.addEventListener('touchstart',e=>{let t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});calendar.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2)moveMonth(dx<0?1:-1)},{passive:true});manualModal.addEventListener('click',e=>{if(e.target===manualModal)closeManual()});render();</script></body></html>
