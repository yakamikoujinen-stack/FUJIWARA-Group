<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#102a43">
<title>FUJIWARA Group アプリ管理センター</title>
<style>
:root{--navy:#102a43;--blue:#1976d2;--gold:#d5a021;--green:#17823b;--red:#c62828;--orange:#d97706;--bg:#eef4f8;--card:#fff;--line:#dbe5ec;--text:#162536;--sub:#66788a;--shadow:0 10px 28px rgba(16,42,67,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#e7f2fb,#f8fbfd 45%,#fff8e9);color:var(--text)}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}.wrap{max-width:1180px;margin:auto;padding:16px 14px 100px}.top{position:sticky;top:0;z-index:20;background:rgba(16,42,67,.96);color:#fff;padding:14px 16px;box-shadow:0 4px 16px rgba(0,0,0,.18)}.top-inner{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand small{display:block;color:#d7e9f7;font-weight:800}.brand h1{font-size:22px;margin:2px 0}.version{background:#fff;color:var(--navy);padding:7px 11px;border-radius:999px;font-weight:950;font-size:12px}.card{background:rgba(255,255,255,.96);border:1px solid #fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.hero{background:linear-gradient(135deg,#102a43,#1e5794);color:#fff}.hero h2{margin:0 0 6px;font-size:24px}.hero p{margin:0;color:#d9ebf9;line-height:1.6}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.sum{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px}.sum b{display:block;font-size:26px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}.toolbar h3{margin:0}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:950}.primary{background:var(--blue);color:#fff}.dark{background:var(--navy);color:#fff}.soft{background:#edf3f7;color:#27445d}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.app{border:1px solid var(--line);background:#fff;border-radius:17px;padding:14px}.app-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.app-name{display:flex;gap:10px;align-items:center}.icon{font-size:32px}.app-title{font-size:17px;font-weight:950}.small{font-size:12px;color:var(--sub);line-height:1.55}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:950}.official{background:#dcfce7;color:#166534}.dev{background:#fef3c7;color:#92400e}.old{background:#fee2e2;color:#991b1b}.unknown{background:#e2e8f0;color:#334155}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.meta div{background:#f7fafc;border-radius:11px;padding:9px}.label{font-size:11px;color:var(--sub);font-weight:850}.value{font-size:13px;font-weight:900;word-break:break-all;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions a,.actions button{flex:1;min-width:105px;text-align:center;text-decoration:none}.section{display:none}.section.active{display:block}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:12px;line-height:1.65;font-size:13px}.log{border-left:4px solid #93c5fd;background:#f8fbff;border-radius:10px;padding:10px 12px;margin:9px 0}.log b{display:block}.empty{text-align:center;color:var(--sub);padding:26px 10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--sub);font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:30}.foot-btn{border:0;background:transparent;color:#42576b;font-size:11px;font-weight:950}.foot-btn span{display:block;font-size:23px}.foot-btn.active{color:var(--blue)}
@media(max-width:760px){.summary{grid-template-columns:repeat(2,1fr)}.grid,.form-grid{grid-template-columns:1fr}.top-inner{align-items:flex-start}.brand h1{font-size:19px}.app{padding:12px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><div class="brand"><small>👑 FUJIWARA Group</small><h1>アプリ管理センター</h1></div><div class="version">Ver 1.0</div></div></header>
<main class="wrap">
<section class="card hero"><h2>本番・開発・古い版を一括管理</h2><p>どのアプリが正式版か、HTML名、公開URL、更新状況をここで確認できます。入力内容はこの端末に保存されます。</p><div class="summary"><div class="sum"><small>登録アプリ</small><b id="countAll">0</b></div><div class="sum"><small>正式版</small><b id="countOfficial">0</b></div><div class="sum"><small>要確認</small><b id="countCheck">0</b></div><div class="sum"><small>古い版</small><b id="countOld">0</b></div></div></section>
<section class="card"><div class="tabs"><button class="tab active" data-tab="official">✅ 本番</button><button class="tab" data-tab="dev">🧪 開発</button><button class="tab" data-tab="all">📱 全一覧</button><button class="tab" data-tab="logs">📝 更新履歴</button><button class="tab" data-tab="settings">⚙️ 管理</button></div></section>
<section id="official" class="section active"><div class="card"><div class="toolbar"><h3>✅ 本番アプリ</h3><button class="btn primary" onclick="addApp('official')">＋追加</button></div><div id="officialList" class="grid"></div></div></section>
<section id="dev" class="section"><div class="card"><div class="toolbar"><h3>🧪 開発アプリ</h3><button class="btn primary" onclick="addApp('dev')">＋追加</button></div><div id="devList" class="grid"></div></div></section>
<section id="all" class="section"><div class="card"><div class="toolbar"><h3>📱 全アプリ一覧</h3><button class="btn primary" onclick="addApp('official')">＋追加</button></div><div id="allList" class="grid"></div></div></section>
<section id="logs" class="section"><div class="card"><div class="toolbar"><h3>📝 更新履歴</h3><button class="btn primary" onclick="addLog()">＋記録</button></div><div id="logList"></div></div></section>
<section id="settings" class="section"><div class="card"><h3>⚙️ 管理・バックアップ</h3><div class="notice">ホーム画面からアイコンを消す前に、必ずこの管理センターで正式版のURLとHTML名を確認してください。</div><div class="actions"><button class="btn dark" onclick="exportData()">データを書き出す</button><button class="btn soft" onclick="document.getElementById('importFile').click()">データを読み込む</button><button class="btn danger" onclick="resetData()">初期状態へ戻す</button><input id="importFile" type="file" accept="application/json" hidden></div></div></section>
</main>
<nav class="footer"><button class="foot-btn active" data-tab="official"><span>✅</span>本番</button><button class="foot-btn" data-tab="dev"><span>🧪</span>開発</button><button class="foot-btn" data-tab="logs"><span>📝</span>履歴</button><button class="foot-btn" data-tab="settings"><span>⚙️</span>管理</button></nav>
<script>
const KEY='fujiwara_app_management_center_v1';
const defaults={apps:[
{id:'king',icon:'👑',name:'KINGアプリ',kind:'official',status:'check',file:'king.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/king.html',users:'社長',share:'Firebase',updated:'2026-07-27',note:'社長専用統括。最新版の確認基準'},
{id:'main',icon:'📅',name:'メインアプリ',kind:'official',status:'check',file:'index.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/',users:'リーダー・担当者・一般',share:'Firebase',updated:'',note:'イベント管理の本アプリ'},
{id:'manager',icon:'👨‍💼',name:'担当者アプリ',kind:'official',status:'check',file:'manager-app.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/manager-app.html',users:'担当者・リーダー',share:'Firebase',updated:'',note:'ネタ・準備・車両など'},
{id:'finance',icon:'💰',name:'財務アプリ',kind:'official',status:'check',file:'event-finance.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/event-finance.html',users:'社長・事務員・担当者',share:'メイン連動',updated:'',note:'売上・経費・人件費・損益'},
{id:'construction',icon:'🏗️',name:'建設アプリ',kind:'official',status:'check',file:'construction-main.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/construction-main.html',users:'建設スタッフ・管理者',share:'Firebase',updated:'',note:'日報・現場・取引先管理'},
{id:'partner',icon:'🤝',name:'partnerアプリ',kind:'official',status:'check',file:'partner.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/partner.html',users:'下請け先',share:'指定イベントのみ',updated:'',note:'外部共有用'},
{id:'partnermen',icon:'🦍',name:'partner menアプリ',kind:'official',status:'check',file:'partner-men.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/partner-men.html',users:'下請け先',share:'指定イベントのみ',updated:'',note:'男性向け外部共有版'},
{id:'supplier',icon:'🛒',name:'発注先アプリ',kind:'official',status:'check',file:'未確定',url:'',users:'社長・担当者',share:'Firebase',updated:'',note:'品目・単価・最低ロット'},
{id:'prep',icon:'📦',name:'準備アプリ',kind:'official',status:'check',file:'preparation-app.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/preparation-app.html',users:'担当者・スタッフ',share:'Firebase',updated:'',note:'積込みチェック'},
{id:'vehicle',icon:'🚚',name:'車両管理',kind:'official',status:'check',file:'vehicle-management.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/vehicle-management.html',users:'担当者・スタッフ',share:'Firebase',updated:'',note:'点検・車検・車両情報'},
{id:'office',icon:'⏰',name:'事務員アプリ',kind:'official',status:'check',file:'office-timecard.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/office-timecard.html',users:'事務員・社長',share:'Firebase',updated:'',note:'タイムカード・出勤予定'},
{id:'chat',icon:'💬',name:'LINE風チャット',kind:'official',status:'check',file:'event-talk.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/event-talk.html',users:'全スタッフ',share:'Firebase予定',updated:'',note:'社内連絡'},
{id:'family',icon:'👨‍👩‍👧‍👦',name:'家族アプリ',kind:'official',status:'check',file:'family.html',url:'https://yakamikoujinen-stack.github.io/FUJIWARA-Group/family.html',users:'家族',share:'一部連携',updated:'',note:'仕事機能中心'}
],logs:[]};
let db=load();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');return v&&Array.isArray(v.apps)?v:structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function badge(a){if(a.status==='official')return '<span class="badge official">正式版</span>';if(a.status==='old')return '<span class="badge old">古い版</span>';if(a.kind==='dev')return '<span class="badge dev">開発版</span>';return '<span class="badge unknown">要確認</span>'}
function card(a){return `<article class="app"><div class="app-head"><div class="app-name"><span class="icon">${esc(a.icon)}</span><div><div class="app-title">${esc(a.name)}</div><div class="small">${esc(a.note||'')}</div></div></div>${badge(a)}</div><div class="meta"><div><div class="label">HTML</div><div class="value">${esc(a.file||'未登録')}</div></div><div><div class="label">最終更新</div><div class="value">${esc(a.updated||'未登録')}</div></div><div><div class="label">利用者</div><div class="value">${esc(a.users||'未登録')}</div></div><div><div class="label">データ共有</div><div class="value">${esc(a.share||'未登録')}</div></div></div><div class="actions">${a.url?`<a class="btn primary" href="${esc(a.url)}">開く</a>`:'<button class="btn soft" disabled>URL未登録</button>'}<button class="btn soft" onclick="editApp('${a.id}')">編集</button><button class="btn danger" onclick="removeApp('${a.id}')">削除</button></div></article>`}
function render(){const off=db.apps.filter(a=>a.kind==='official');const dev=db.apps.filter(a=>a.kind==='dev');officialList.innerHTML=off.length?off.map(card).join(''):'<div class="empty">本番アプリはありません</div>';devList.innerHTML=dev.length?dev.map(card).join(''):'<div class="empty">開発アプリはありません</div>';allList.innerHTML=db.apps.length?db.apps.map(card).join(''):'<div class="empty">登録がありません</div>';countAll.textContent=db.apps.length;countOfficial.textContent=db.apps.filter(a=>a.status==='official').length;countCheck.textContent=db.apps.filter(a=>a.status==='check').length;countOld.textContent=db.apps.filter(a=>a.status==='old').length;logList.innerHTML=db.logs.length?db.logs.slice().reverse().map(l=>`<div class="log"><b>${esc(l.date)}｜${esc(l.app)}</b><div class="small">${esc(l.text)}</div></div>`).join(''):'<div class="empty">更新履歴はまだありません</div>'}
function addApp(kind){const name=prompt('アプリ名');if(!name)return;db.apps.push({id:'a'+Date.now(),icon:prompt('アイコン','📱')||'📱',name,kind,status:kind==='dev'?'dev':'check',file:prompt('HTMLファイル名','')||'',url:prompt('公開URL','')||'',users:prompt('利用者','')||'',share:prompt('共有状況','')||'',updated:new Date().toISOString().slice(0,10),note:prompt('用途・メモ','')||''});save()}
function editApp(id){const a=db.apps.find(x=>x.id===id);if(!a)return;a.name=prompt('アプリ名',a.name)??a.name;a.icon=prompt('アイコン',a.icon)??a.icon;a.kind=prompt('区分 official / dev',a.kind)??a.kind;a.status=prompt('状態 official / check / old / dev',a.status)??a.status;a.file=prompt('HTMLファイル名',a.file)??a.file;a.url=prompt('公開URL',a.url)??a.url;a.users=prompt('利用者',a.users)??a.users;a.share=prompt('共有状況',a.share)??a.share;a.updated=prompt('最終更新日 YYYY-MM-DD',a.updated)??a.updated;a.note=prompt('用途・メモ',a.note)??a.note;save()}
function removeApp(id){if(!confirm('この登録を削除しますか？'))return;db.apps=db.apps.filter(a=>a.id!==id);save()}
function addLog(){const app=prompt('対象アプリ');if(!app)return;const text=prompt('更新内容');if(!text)return;db.logs.push({date:new Date().toISOString().slice(0,10),app,text});save()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FUJIWARA-app-center-backup.json';a.click();URL.revokeObjectURL(a.href)}
importFile.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!Array.isArray(v.apps))throw 0;db=v;save();alert('読み込みました')}catch(_){alert('正しいバックアップファイルではありません')}};r.readAsText(f)});
function resetData(){if(!confirm('登録内容を初期状態へ戻しますか？'))return;db=structuredClone(defaults);save()}
function switchTab(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
render();
</script>
</body>
</html>
