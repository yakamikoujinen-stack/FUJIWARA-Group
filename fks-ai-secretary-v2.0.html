<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FKS AI Secretary v2.0</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7;color:#172033}
header{background:linear-gradient(135deg,#14213d,#243b63);color:#fff;text-align:center;padding:18px}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0002}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.avatar{font-size:54px;text-align:center}
.name{font-size:22px;font-weight:900;text-align:center}
.role{text-align:center;color:#666;font-size:13px}
.msg{font-size:16px;line-height:1.8;background:#f5f7fb;border-left:6px solid #243b63;border-radius:12px;padding:14px}
button{background:#14213d;color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:16px;font-weight:bold}
textarea{width:100%;height:110px;font-size:16px;border-radius:10px;padding:10px;border:1px solid #ccd3dd}
a{color:#14213d;font-weight:bold;text-decoration:none}
.warn{color:#b00020;font-weight:bold}.good{color:#0a7a2f;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>🤖 FKS AI Secretary v2.0</h1>
<p>若くて仕事ができる優秀な女性秘書タイプ</p>
</header>

<main>
<div class="card"><a href="fks-portal-v1.0.html">← FKS Portalへ戻る</a></div>

<div class="grid">
<div class="card">
<div class="avatar">👩‍💼</div>
<div class="name">FKS秘書　AIKA</div>
<div class="role">社長専属・経営サポート</div>
</div>
<div class="card">
<h3>本日の一言</h3>
<div class="msg" id="mainMsg"></div>
<button onclick="refresh()">更新</button>
</div>
</div>

<div class="card">
<h3>今日の確認リスト</h3>
<div id="checks"></div>
</div>

<div class="card">
<h3>秘書メモ</h3>
<textarea id="memo" placeholder="AIKAへの指示・メモ"></textarea>
<button onclick="saveMemo()">保存</button>
</div>
</main>

<script>
function yen(n){return "¥"+Number(n||0).toLocaleString()}
function getJSON(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
function build(){
 const acc=getJSON("fks_accounting",{sales:0,expense:0,cash:0})
 const inv=getJSON("fks_invoices",[])
 const pay=getJSON("fks_payments",[])
 const stock=getJSON("fks_inventory",[])
 const con=getJSON("fks_construction_reports",[])
 const works=getJSON("fks_staff_works",[])
 const unpaid=inv.filter(x=>!x.paid).reduce((a,x)=>a+Number(x.amount||0),0)
 const unpaidPay=pay.filter(x=>!x.done).reduce((a,x)=>a+Number(x.amount||0),0)
 const low=stock.filter(x=>Number(x.qty||0)<=Number(x.min||0)).length
 const pending=con.filter(x=>!x.approved).length
 const today=new Date().toLocaleDateString()
 const todayWorks=works.filter(x=>x.date===today).length
 let lines=[]
 if(unpaid>0)lines.push("未入金が "+yen(unpaid)+" あります。入金確認を優先しましょう。")
 if(unpaidPay>0)lines.push("未払いが "+yen(unpaidPay)+" あります。支払予定を確認してください。")
 if(low>0)lines.push("在庫不足注意が "+low+" 件あります。イベント前に補充確認が必要です。")
 if(pending>0)lines.push("建設日報の未承認が "+pending+" 件あります。社長確認をお願いします。")
 if(todayWorks>0)lines.push("本日の出勤記録は "+todayWorks+" 件あります。")
 if(!lines.length)lines.push("本日は大きな警告はありません。資金繰りと予定だけ確認しましょう。")
 checks.innerHTML=lines.map(x=>"・"+x).join("<br>")
 return lines
}
function refresh(){
 const lines=build()
 const comments=[
 "社長、おはようございます。今日も数字と現場を押さえて、無駄なく進めましょう。",
 "社長、今日は未確認項目を先に片付けると一日が楽になります。",
 "社長、利益は売上よりも大事です。経費と在庫を確認しましょう。",
 "社長、FKSの入力を続ければ会社の流れがもっと見えるようになります。"
 ]
 mainMsg.innerHTML=comments[Math.floor(Math.random()*comments.length)]+"<br><br>"+lines[0]
}
function saveMemo(){
 localStorage.setItem("fks_aika_memo",memo.value)
 alert("保存しました")
}
window.onload=()=>{
 memo.value=localStorage.getItem("fks_aika_memo")||""
 refresh()
}
</script>
</body>
</html>
