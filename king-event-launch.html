<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>初動｜KING</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f4f7fb;color:#102043}.wrap{max-width:920px;margin:auto;padding:14px 14px 90px}.head,.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h1{margin:0;font-size:25px}.back{border:0;border-radius:12px;background:#17324d;color:#fff;font-weight:900;padding:11px 14px}.locked{background:#fff8dc;border:1px solid #e5c15b;color:#725000;padding:10px 12px;border-radius:12px;font-weight:900;margin-bottom:12px}.step{font-size:18px;font-weight:950;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:900;color:#52657a;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd7e4;border-radius:11px;padding:11px;font:inherit;background:#fff}.field textarea{min-height:70px}.reflect{border:0;border-radius:12px;background:#1769c2;color:#fff;font-weight:950;padding:12px 18px}.netaRows{display:grid;gap:9px;margin-top:12px}.netaRow{display:grid;grid-template-columns:1fr 190px;gap:8px;align-items:center;background:#f7f9fc;border-radius:12px;padding:9px}.netaName{font-weight:900}.money{position:relative}.money:before{content:"¥";position:absolute;left:11px;top:11px;font-weight:900}.money input{padding-left:28px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #cdd8e6;background:#fff;border-radius:999px;padding:8px 11px;font-weight:850}.chip input{margin-right:5px}.subopts{display:grid;gap:9px;margin-top:12px}.opt{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center}.opt label{font-weight:900}.opt input,.opt select{width:100%;border:1px solid #ccd7e4;border-radius:10px;padding:10px;font:inherit}.staffGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sizeCounts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.sizeCounts label{font-size:12px;font-weight:900;color:#52657a}.sizeCounts input{margin-top:4px;text-align:center}.staffChip{border:1px solid #ccd7e4;border-radius:12px;padding:10px;background:#fff;font-weight:850}.status{border-radius:12px;padding:11px;font-weight:900;background:#edfdf3;color:#166534;margin-top:10px}.status.warn{background:#fff3e8;color:#9a3412}.save{width:100%;border:0;border-radius:14px;padding:15px;background:#168653;color:#fff;font-size:18px;font-weight:950}.note{font-size:12px;color:#647188;font-weight:750;line-height:1.6}@media(max-width:650px){.grid,.netaRow,.opt{grid-template-columns:1fr}.staffGrid{grid-template-columns:1fr 1fr}.head h1{font-size:21px}}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><main class="wrap">
<section class="head"><h1>🚀 初動</h1><button class="back" onclick="location.href='king.html'">👑 KINGへ戻る</button></section><div class="locked">👑 リーダー専用編集画面｜担当者・一般スタッフは今まで通り各アプリを使用</div>
<section class="card"><div class="step">① イベント基本情報</div><div class="grid"><div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>終了日（連日の場合）</label><input id="dateEnd" type="date"></div><div class="field"><label>イベント名</label><input id="name"></div><div class="field"><label>発注先・取引先</label><select id="client"><option value="">選択してください</option></select><input id="clientOther" placeholder="一覧にない場合のみ入力" style="margin-top:7px"></div><div class="field"><label>場所</label><input id="place"></div><div class="field"><label>営業時間</label><input id="hours" placeholder="10:00〜20:00"></div></div></section>
<section class="card"><div class="step">② ネタ入力</div><div class="field"><label>出店ネタ（「・」「、」または改行で区切り）</label><textarea id="neta" placeholder="例：牛串・たん串・チーズハットグ"></textarea></div><button class="reflect" onclick="reflectNeta()">↓ ネタを③へ反映</button></section>
<section class="card"><div class="step">③ ネタ毎の設定金額</div><div id="netaRows" class="netaRows"><div class="note">②でネタを入力して「反映」を押してください。</div></div><div id="totalTarget" style="margin-top:12px;font-size:20px;font-weight:950;color:#0b6b3a">合計目標 ¥0</div></section>
<section class="card"><div class="step">④ 出店形態</div><div class="subopts">
<div class="opt"><label><input type="checkbox" id="tekiya"> テキヤテント</label><div class="sizeCounts"><label>7尺 <input id="tekiya7" type="number" min="0" value="0"> 基</label><label>8尺 <input id="tekiya8" type="number" min="0" value="0"> 基</label><label>9尺 <input id="tekiya9" type="number" min="0" value="0"> 基</label></div></div>
<div class="opt"><label><input type="checkbox" id="tarp"> ターフテント</label><div class="sizeCounts"><label>3m <input id="tarp3" type="number" min="0" value="0"> 基</label><label>2.5m <input id="tarp25" type="number" min="0" value="0"> 基</label><label>2m <input id="tarp2" type="number" min="0" value="0"> 基</label><label>3×2m <input id="tarp32" type="number" min="0" value="0"> 基</label></div></div>
<div class="opt"><label><input type="checkbox" id="localTent"> 現地設営テント</label><div><input id="frontage" type="number" step="0.1" min="0" placeholder="間口 m"></div></div>
<div class="opt"><label><input type="checkbox" id="kitchen"> キッチンカー</label><div><select id="kitchenType"><option>1.5t車</option><option>軽トラ</option></select><input id="kitchenCount" type="number" min="0" placeholder="台" style="margin-top:6px"></div></div>
</div></section>
<section class="card"><div class="step">⑤ 必要人数</div><div class="field"><input id="required" type="number" min="0" value="0"></div><div id="staffStatus" class="status">必要人数を入力してください</div></section>
<section class="card"><div class="step">⑥ 担当者</div><div class="note" style="margin-bottom:10px">メインアプリのスタッフ名から担当者を選択します。</div><div class="chips" id="managerChips"></div></section>
<section class="card"><div class="step">⑦ 一般スタッフ配置</div><div class="note" style="margin-bottom:10px">メインアプリに登録・使用されているスタッフ名を読み込みます。担当者で選択した人は除外します。</div><div id="staffGrid" class="staffGrid"><div class="note">スタッフ読込中…</div></div><div class="field" style="margin-top:12px"><label><input id="recruitOpen" type="checkbox"> 人数不足分を一般スタッフへ募集する</label></div><div class="field" style="margin-top:12px"><label><input id="secret" type="checkbox"> 🔒 シークレットイベントにする</label></div><div class="field"><label>募集メモ</label><textarea id="recruitNote" placeholder="集合時間・仕事内容など"></textarea></div></section>
<section class="card"><button class="save" onclick="saveLaunch()">✅ 初動を保存</button><p class="note">現在はテスト段階です。既存のメイン等を直接上書きせず、初動専用領域に保存します。</p></section></main>
<script>
const cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.database(),PATH="fujiwara/eventLaunches",$=id=>document.getElementById(id);let eventCache={},generalStaff=[],netaMaster=[];
const managers=["藤原","将","文太","繁充"];const MAIN_STAFF_FALLBACK=["藤原","将","文太","繁充","まゆみ","龍来","想良","理紗菜","まりん","拓海","ばんた","スポット(バイト)","friends GP","ゆな","縁笑だるまや","吉見","吉良","岡本","タイミー①","明裕","梶","タイミー②","タイミー③","タイミー④","藤原明裕","しーしー"];function split(v){return [...new Set(String(v||"").split(/[・、,，／\/\s]+/).map(x=>x.trim()).filter(Boolean))]}

function renderManagers(){ $("managerChips").innerHTML=managers.map(n=>'<label class="chip"><input type="checkbox" name="manager" value="'+n+'" onchange="renderStaff()">'+n+'</label>').join("")}
function renderStaff(){let ms=[...document.querySelectorAll('input[name="manager"]:checked')].map(x=>x.value);let list=generalStaff.filter(n=>n&&!ms.includes(n)&&!managers.includes(n));$("staffGrid").innerHTML=list.length?list.map(n=>'<label class="staffChip"><input type="checkbox" name="staff" value="'+n+'" onchange="updateStatus()"> '+n+'</label>').join(""):'<div class="note">メインアプリの登録スタッフを取得できませんでした。</div>';updateStatus()}
async function loadExisting(){
  generalStaff=MAIN_STAFF_FALLBACK.slice();
  renderStaff();
  try{
    let evSnap=await db.ref("fujiwara/events").once("value");
    eventCache=evSnap.val()||{};
    let clients=new Set();
    Object.values(eventCache).forEach(e=>{[e.client,e.clientName,e.customer,e.customerName,e.orderer,e.supplier,e.zone].filter(Boolean).forEach(x=>clients.add(String(x)))});
    ["コナンプロデュース"].forEach(x=>clients.add(x));
    $("client").innerHTML='<option value="">選択してください</option>'+[...clients].sort().map(x=>'<option>'+x+'</option>').join("");
  }catch(e){console.warn("event load",e)}
  try{
    let stSnap=await db.ref("fujiwara/staffList").once("value"),st=stSnap.val();
    let loaded=(Array.isArray(st)?st:Object.values(st||{})).filter(Boolean).map(x=>typeof x==="string"?x:(x.name||x.staffName||"")).filter(Boolean);
    if(loaded.length){generalStaff=[...new Set([...MAIN_STAFF_FALLBACK,...loaded])];renderStaff()}
  }catch(e){console.warn("staff load",e)}
}
function reflectNeta(){let old={};document.querySelectorAll(".netaMoney").forEach(x=>old[x.dataset.name]=x.value);let a=split($("neta").value);$("netaRows").innerHTML=a.length?a.map(n=>'<div class="netaRow"><div class="netaName">'+n+'</div><div class="money"><input class="netaMoney" data-name="'+n+'" type="number" min="0" inputmode="numeric" placeholder="設定金額" value="'+(old[n]||"")+'" oninput="calcTotal()"></div></div>').join(""):'<div class="note">②でネタを入力してください。</div>';calcTotal()}
function calcTotal(){let t=[...document.querySelectorAll(".netaMoney")].reduce((a,x)=>a+Number(x.value||0),0);$("totalTarget").textContent="合計目標 ¥"+t.toLocaleString("ja-JP")}
function updateStatus(){let req=Number($("required").value||0),cnt=document.querySelectorAll('input[name="staff"]:checked').length+document.querySelectorAll('input[name="manager"]:checked').length,short=Math.max(0,req-cnt);$("staffStatus").textContent=req?("必要 "+req+"名 ／ 配置済 "+cnt+"名 ／ 不足 "+short+"名"):"必要人数を入力してください";$("staffStatus").className="status "+(short?"warn":"");$("recruitOpen").checked=short>0}
$("required").addEventListener("input",updateStatus);$("date").value=new Date().toISOString().slice(0,10);renderManagers();loadExisting();
async function saveLaunch(){
  let date=$("date").value,name=$("name").value.trim();
  if(!date||!name){alert("日付とイベント名は必須です");return}
  let managersSelected=[...document.querySelectorAll('input[name="manager"]:checked')].map(x=>x.value);
  let manager=managersSelected[0]||"";
  let general=[...document.querySelectorAll('input[name="staff"]:checked')].map(x=>x.value);
  let staff=[...new Set([...managersSelected,...general].filter(Boolean))];
  let targets={};document.querySelectorAll(".netaMoney").forEach(x=>targets[x.dataset.name]=Number(x.value||0));
  let client=$("clientOther").value.trim()||$("client").value;
  let dateEnd=$("dateEnd").value||date;
  let tekiyaSizes={"7尺":Number($("tekiya7").value||0),"8尺":Number($("tekiya8").value||0),"9尺":Number($("tekiya9").value||0)}, tarpSizesMap={"3m":Number($("tarp3").value||0),"2.5m":Number($("tarp25").value||0),"2m":Number($("tarp2").value||0),"3×2m":Number($("tarp32").value||0)};let setup={tekiya:$("tekiya").checked?{sizes:tekiyaSizes,count:Object.values(tekiyaSizes).reduce((a,b)=>a+b,0)}:null,tarp:$("tarp").checked?{sizes:tarpSizesMap,count:Object.values(tarpSizesMap).reduce((a,b)=>a+b,0)}:null,localTent:$("localTent").checked?{frontage:Number($("frontage").value||0)}:null,kitchen:$("kitchen").checked?{type:$("kitchenType").value,count:Number($("kitchenCount").value||0)}:null};
  let launchRef=db.ref(PATH).push(), now=new Date().toISOString();
  let launchData={id:launchRef.key,status:"saved",leaderOnly:true,date,dateEnd,name,client,place:$("place").value.trim(),hours:$("hours").value.trim(),neta:Object.keys(targets),netaTargets:targets,salesTarget:Object.values(targets).reduce((a,b)=>a+b,0),setup,requiredStaff:Number($("required").value||0),manager,managers:managersSelected,staff:general,recruitOpen:$("recruitOpen").checked,secret:$("secret").checked,recruitNote:$("recruitNote").value.trim(),createdAt:now,updatedAt:now};
  try{
    let snap=await db.ref("fujiwara/events").once("value"), raw=snap.val(), arr=Array.isArray(raw)?raw.slice():Object.values(raw||{}).filter(Boolean);
    let id="launch_"+Date.now();
    let booth=[];
    if(setup.tekiya) booth.push("テキヤテント "+Object.entries(setup.tekiya.sizes).filter(x=>x[1]>0).map(x=>x[0]+"×"+x[1]).join("・")+" 合計"+setup.tekiya.count+"基");
    if(setup.tarp) booth.push("ターフテント "+Object.entries(setup.tarp.sizes).filter(x=>x[1]>0).map(x=>x[0]+"×"+x[1]).join("・")+" 合計"+setup.tarp.count+"基");
    if(setup.localTent) booth.push("現地設営テント 間口"+setup.localTent.frontage+"m");
    if(setup.kitchen) booth.push("キッチンカー "+setup.kitchen.type+" "+setup.kitchen.count+"台");
    let dayAssignments={};dayAssignments[date]={staff:staff.slice(),requiredStaff:Number($("required").value||0)};
    let primaryType=setup.tekiya?"テキヤテント":setup.tarp?"ターフテント":setup.localTent?"現地設営テント":setup.kitchen?"キッチンカー":"";
    let boothCount=setup.tekiya?setup.tekiya.count:setup.tarp?setup.tarp.count:setup.kitchen?setup.kitchen.count:"";
    let tarpSizes=setup.tarp?Object.entries(setup.tarp.sizes).filter(x=>x[1]>0).map(x=>x[0]):[];
    let siteFrontage=setup.localTent?setup.localTent.frontage:"";
    let mainEvent={id,name,date,dateEnd,endDate:dateEnd,toDate:dateEnd,zone:client||"A",client:client||"",place:$("place").value.trim(),status:"planned",boothType:primaryType,tarpSizes,tekiyaSizes:setup.tekiya?setup.tekiya.sizes:{},tarpSizeCounts:setup.tarp?setup.tarp.sizes:{},boothDetails:booth,boothCount,siteFrontage,requiredStaff:Number($("required").value||0),memo:$("hours").value.trim(),itemsText:Object.keys(targets).join("・"),staff:staff,dayAssignments,items:[],secret:$("secret").checked,
      launchId:launchRef.key,launchSource:"KING初動",manager,managers:managersSelected,neta:Object.keys(targets),netaTargets:targets,salesTarget:Object.values(targets).reduce((a,b)=>a+b,0),setup,recruitOpen:$("recruitOpen").checked,recruitNote:$("recruitNote").value.trim(),createdAt:now,updatedAt:now};
    arr.push(mainEvent);
    await db.ref("fujiwara/events").set(arr);
    launchData.mainEventId=id; launchData.mainSyncedAt=now;
    await launchRef.set(launchData);
    alert("初動を保存し、メインアプリへ反映しました。");
  }catch(e){
    console.error(e);
    alert("保存中にエラーが発生しました。メインアプリへの反映は完了していません。\n"+e.message);
  }
}
</script></body></html>
