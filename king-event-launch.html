<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>イベント立上げ｜KING</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f4f7fb;color:#102043}.wrap{max-width:920px;margin:auto;padding:14px 14px 90px}.head,.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin-bottom:12px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.head h1{margin:0;font-size:23px}.back{border:0;border-radius:12px;background:#17324d;color:#fff;font-weight:900;padding:11px 14px}.lead{font-weight:800;color:#52657a;line-height:1.6}.step{font-size:18px;font-weight:950;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:900;color:#52657a;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd7e4;border-radius:11px;padding:11px;font:inherit;background:#fff}.field textarea{min-height:75px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #cdd8e6;background:#fff;border-radius:999px;padding:8px 11px;font-weight:850}.chip input{margin-right:5px}.target{font-size:20px;font-weight:950;color:#0b6b3a}.staffrow{display:grid;grid-template-columns:1fr 120px;gap:8px}.status{border-radius:12px;padding:11px;font-weight:900;background:#edfdf3;color:#166534}.status.warn{background:#fff3e8;color:#9a3412}.save{width:100%;border:0;border-radius:14px;padding:15px;background:#168653;color:#fff;font-size:18px;font-weight:950}.note{font-size:12px;color:#647188;font-weight:750;line-height:1.6}.locked{background:#fff8dc;border:1px solid #e5c15b;color:#725000;padding:10px 12px;border-radius:12px;font-weight:900;margin-bottom:12px}@media(max-width:650px){.grid,.staffrow{grid-template-columns:1fr}.head{align-items:flex-start}.head h1{font-size:19px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head>
<body><main class="wrap"><section class="head"><h1>🚀 イベント立上げ・準備</h1><button class="back" onclick="location.href='king.html'">👑 KINGへ戻る</button></section>
<div class="locked">👑 リーダー専用編集画面｜担当者・一般スタッフは今まで通り各アプリを使用</div>
<section class="card"><div class="step">① イベント基本情報</div><div class="grid">
<div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>終了日（連日の場合）</label><input id="dateEnd" type="date"></div>
<div class="field"><label>イベント名</label><input id="name" placeholder="例：○○まつり"></div><div class="field"><label>取引先</label><input id="client" placeholder="例：コナンプロデュース"></div>
<div class="field"><label>場所</label><input id="place"></div><div class="field"><label>営業時間</label><input id="hours" placeholder="10:00〜20:00"></div></div></section>
<section class="card"><div class="step">② ネタ・売上目標</div><div class="field"><label>出店ネタ（複数は「・」区切り）</label><textarea id="neta" placeholder="焼きそば・串・かき氷"></textarea></div><div class="field"><label>イベント売上目標</label><input id="salesTarget" type="number" inputmode="numeric" placeholder="300000"></div><div id="salesView" class="target">目標 ¥0</div></section>
<section class="card"><div class="step">③ 出店形式</div><div class="chips">
<label class="chip"><input type="checkbox" name="style" value="テント">テント</label><label class="chip"><input type="checkbox" name="style" value="キッチンカー">キッチンカー</label><label class="chip"><input type="checkbox" name="style" value="屋台">屋台</label><label class="chip"><input type="checkbox" name="style" value="その他">その他</label></div><div class="field" style="margin-top:12px"><label>必要台数・備考</label><input id="styleNote" placeholder="例：テント2張・キッチンカー1台"></div></section>
<section class="card"><div class="step">④ 担当・配置スタッフ</div><div class="field"><label>担当者</label><input id="manager" placeholder="例：文太"></div><div class="field"><label>配置スタッフ（「・」区切り）</label><input id="staff" placeholder="藤原・文太・将"></div><div class="staffrow"><div class="field"><label>必要人数</label><input id="required" type="number" min="0" value="0"></div><div class="field"><label>募集人数</label><input id="recruit" type="number" min="0" value="0"></div></div><div id="staffStatus" class="status">配置人数を入力してください</div><div class="field" style="margin-top:12px"><label><input id="recruitOpen" type="checkbox"> 一般スタッフへ募集のお知らせを出す</label></div><div class="field"><label>募集メモ</label><textarea id="recruitNote" placeholder="集合時間・仕事内容など"></textarea></div></section>
<section class="card"><button class="save" onclick="saveLaunch()">✅ イベント立上げを保存</button><p class="note">開発版では既存のメイン・主力ネタ・配置スタッフ等の保存領域を直接書き換えません。立上げ情報を専用領域へ一括保存し、連携確認後に各アプリの表示元として接続します。</p></section>
</main><script>
const cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.database(),PATH="fujiwara/eventLaunches";
const $=id=>document.getElementById(id);function names(v){return [...new Set(String(v||"").split(/[・、,，／\/\n]+/).map(x=>x.trim()).filter(Boolean))]}
function update(){let n=Number($("salesTarget").value||0);$("salesView").textContent="目標 ¥"+n.toLocaleString("ja-JP");let st=names($("staff").value),req=Number($("required").value||0),short=Math.max(0,req-st.length),rec=Number($("recruit").value||0);if(short&&!rec){$("recruit").value=short;rec=short}$("staffStatus").textContent=req?("必要 "+req+"名 ／ 配置済 "+st.length+"名 ／ 募集 "+rec+"名"):"配置人数を入力してください";$("staffStatus").className="status "+((short||rec)?"warn":"")}
["salesTarget","staff","required","recruit"].forEach(id=>$(id).addEventListener("input",update));$("date").value=new Date().toISOString().slice(0,10);
async function saveLaunch(){let date=$("date").value,name=$("name").value.trim();if(!date||!name){alert("日付とイベント名は必須です");return}let ref=db.ref(PATH).push(),data={id:ref.key,status:"draft",leaderOnly:true,date,dateEnd:$("dateEnd").value||date,name,client:$("client").value.trim(),place:$("place").value.trim(),hours:$("hours").value.trim(),neta:names($("neta").value),salesTarget:Number($("salesTarget").value||0),styles:[...document.querySelectorAll('input[name="style"]:checked')].map(x=>x.value),styleNote:$("styleNote").value.trim(),manager:$("manager").value.trim(),staff:names($("staff").value),requiredStaff:Number($("required").value||0),recruitCount:Number($("recruit").value||0),recruitOpen:$("recruitOpen").checked,recruitNote:$("recruitNote").value.trim(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};await ref.set(data);alert("保存しました。\n次は各アプリへの安全な反映テストへ進めます。")}
update();</script></body></html>
