<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f6b57"><title>事務所・会社経費｜FUJIWARA KING</title>
<style>
:root{--green:#42634b;--green2:#5d8067;--bg:#f3f7f3;--card:#fff;--line:#d9e4da;--text:#1f2d22;--sub:#66736a;--red:#b83b3b;--gold:#a77b1f}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#eef6ef,#fff 42%,#f8faf8);color:var(--text)}button,input,select,textarea{font:inherit}.wrap{max-width:1160px;margin:auto;padding:15px 14px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 26px rgba(50,80,55,.09)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px}h1{margin:0;font-size:27px;color:var(--green)}.sub{font-size:12px;color:var(--sub);font-weight:800;margin-top:3px}.back{border:0;border-radius:12px;padding:11px 14px;background:#edf3ee;color:var(--green);font-weight:950}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.kpi{padding:15px;text-align:center}.kpi small{font-weight:850;color:var(--sub)}.kpi b{display:block;font-size:25px;margin-top:5px}.red{color:var(--red)}.green{color:var(--green)}.gold{color:var(--gold)}.form{margin-top:12px;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}.head h2{margin:0;font-size:20px;color:var(--green)}.status{font-size:12px;color:var(--sub);font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:950;color:#536157}input,select,textarea{width:100%;border:1px solid #cfdccf;border-radius:12px;padding:12px;background:#fff;font-size:16px}textarea{min-height:92px;resize:vertical}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:950}.save{background:var(--green);color:#fff}.clear{background:#eef2ee}.delete{background:#ffe7e7;color:#a42828;display:none;margin-right:auto}.filters{margin-top:12px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.table-card{margin-top:12px;padding:15px}.table-wrap{overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:14px}table{width:100%;min-width:1000px;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e7eee8;font-size:13px;white-space:nowrap}th{background:#edf5ee;text-align:left;color:var(--green)}td.money{text-align:right;font-weight:900}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:950}.paid{background:#e7f5ea;color:#26733c}.unpaid{background:#fff0dd;color:#9a6200}.detail{border:1px solid #91a99a;background:#fff;color:var(--green);border-radius:999px;padding:6px 10px;font-weight:900}.note{margin-top:12px;padding:11px;background:#fff8da;border:1px solid #e3cd76;border-radius:12px;font-size:12px;font-weight:850;color:#765c12}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid #dfe8df;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}.bottom button{flex:1;max-width:420px;border:0;border-radius:13px;padding:13px;font-weight:950;font-size:16px}.king{background:#17324d;color:#fff}.new{background:var(--green);color:#fff}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.grid,.filters{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body>
<main class="wrap"><header class="card"><div><h1>🏢 事務所・会社経費</h1><div class="sub">イベント経費とは分けて、会社全体の経費・買掛・未払を管理</div></div><button class="back" onclick="location.href='king-money.html'">← お金管理へ</button></header>
<section class="summary"><div class="card kpi"><small>当月経費</small><b id="monthTotal">¥0</b></div><div class="card kpi"><small>当月支払済</small><b id="monthPaid" class="green">¥0</b></div><div class="card kpi"><small>未払・買掛</small><b id="unpaidTotal" class="red">¥0</b></div><div class="card kpi"><small>当月件数</small><b id="monthCount">0件</b></div></section>
<section class="card form" id="formBox"><div class="head"><h2 id="formTitle">経費を追加</h2><span class="status" id="syncStatus">Firebase共有</span></div><div class="grid">
<div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>経費区分</label><select id="category"><option>電気代</option><option>水道代</option><option>ガス代</option><option>通信費</option><option>家賃</option><option>作業着</option><option>消耗品</option><option>車両関連</option><option>買掛金</option><option>保険</option><option>税金・公租公課</option><option>その他雑費</option></select></div>
<div class="field"><label>支払先</label><input id="payee" placeholder="例：関西電力"></div><div class="field"><label>内容</label><input id="content" placeholder="例：8月分 事務所電気代"></div>
<div class="field"><label>金額</label><input id="amount" type="number" inputmode="numeric" min="0" placeholder="0"></div><div class="field"><label>支払方法</label><select id="paymentMethod"><option>現金</option><option>振込</option><option>口座振替</option><option>クレジット</option><option>その他</option></select></div>
<div class="field"><label>支払状況</label><select id="paymentStatus"><option value="paid">支払済</option><option value="unpaid">未払・買掛</option></select></div><div class="field"><label>支払予定日</label><input id="dueDate" type="date"></div>
<div class="field full"><label>備考</label><textarea id="memo" placeholder="請求書番号、担当者、補足など"></textarea></div></div><div class="actions"><button id="deleteBtn" class="btn delete">削除</button><button id="clearBtn" class="btn clear">入力を消す</button><button id="saveBtn" class="btn save">保存</button></div></section>
<section class="card filters"><div class="field"><label>月</label><input id="monthFilter" type="month"></div><div class="field"><label>区分</label><select id="categoryFilter"><option value="">すべて</option><option>電気代</option><option>水道代</option><option>ガス代</option><option>通信費</option><option>家賃</option><option>作業着</option><option>消耗品</option><option>車両関連</option><option>買掛金</option><option>保険</option><option>税金・公租公課</option><option>その他雑費</option></select></div><div class="field"><label>支払状況</label><select id="statusFilter"><option value="">すべて</option><option value="paid">支払済</option><option value="unpaid">未払・買掛</option></select></div></section>
<section class="card table-card"><div class="head"><h2>経費一覧</h2><span class="status">日付／区分／支払先／内容／金額／状態</span></div><div class="table-wrap"><table><thead><tr><th>日付</th><th>区分</th><th>支払先</th><th>内容</th><th>金額</th><th>支払方法</th><th>状態</th><th>支払予定日</th><th>備考</th></tr></thead><tbody id="rows"></tbody></table></div><div class="note">この画面は会社共通経費専用です。イベント売上・イベント精算・金庫番・タンス預金とは自動連動しません。</div></section></main>
<nav class="bottom"><button class="king" onclick="location.href='king.html'">👑 KINGへ戻る</button><button class="new" id="newBtn">＋ 新規入力</button></nav>
<script>
const config={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};if(!firebase.apps.length)firebase.initializeApp(config);const db=firebase.database(),PATH='fujiwara/king_office_expenses';let data=[],editingId=null;const $=id=>document.getElementById(id),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function currentMonth(){return today().slice(0,7)}function reset(scroll=false){editingId=null;$('formTitle').textContent='経費を追加';$('date').value=today();$('category').value='電気代';$('payee').value='';$('content').value='';$('amount').value='';$('paymentMethod').value='現金';$('paymentStatus').value='paid';$('dueDate').value='';$('memo').value='';$('deleteBtn').style.display='none';if(scroll)$('formBox').scrollIntoView({behavior:'smooth'})}function filtered(){const m=$('monthFilter').value,c=$('categoryFilter').value,s=$('statusFilter').value;return data.filter(r=>(!m||String(r.date||'').startsWith(m))&&(!c||r.category===c)&&(!s||r.paymentStatus===s)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||Number(b.createdAt||0)-Number(a.createdAt||0))}function render(){const list=filtered(),month=$('monthFilter').value||currentMonth(),monthList=data.filter(r=>String(r.date||'').startsWith(month)),paid=monthList.filter(r=>r.paymentStatus==='paid').reduce((s,r)=>s+Number(r.amount||0),0),unpaid=data.filter(r=>r.paymentStatus==='unpaid').reduce((s,r)=>s+Number(r.amount||0),0),total=monthList.reduce((s,r)=>s+Number(r.amount||0),0);$('monthTotal').textContent=yen(total);$('monthPaid').textContent=yen(paid);$('unpaidTotal').textContent=yen(unpaid);$('monthCount').textContent=monthList.length+'件';$('rows').innerHTML=list.length?list.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.category)}</td><td>${esc(r.payee)}</td><td><button class="detail" data-id="${esc(r.id)}">${esc(r.content||'詳細')}</button></td><td class="money">${yen(r.amount)}</td><td>${esc(r.paymentMethod)}</td><td><span class="badge ${r.paymentStatus==='paid'?'paid':'unpaid'}">${r.paymentStatus==='paid'?'支払済':'未払・買掛'}</span></td><td>${esc(r.dueDate||'-')}</td><td>${esc(r.memo||'')}</td></tr>`).join(''):'<tr><td colspan="9" style="text-align:center;padding:28px">該当データがありません</td></tr>'}function edit(id){const r=data.find(x=>String(x.id)===String(id));if(!r)return;editingId=r.id;$('formTitle').textContent='経費の詳細・編集';['date','category','payee','content','amount','paymentMethod','paymentStatus','dueDate','memo'].forEach(k=>$(k).value=r[k]??'');$('deleteBtn').style.display='inline-block';$('formBox').scrollIntoView({behavior:'smooth'})}async function save(){const date=$('date').value,category=$('category').value,payee=$('payee').value.trim(),content=$('content').value.trim(),amount=Number($('amount').value||0),paymentMethod=$('paymentMethod').value,paymentStatus=$('paymentStatus').value,dueDate=$('dueDate').value,memo=$('memo').value.trim();if(!date||!category||!content){alert('日付・経費区分・内容を入力してください');return}if(amount<0){alert('金額を確認してください');return}const id=editingId||('office_'+Date.now()),old=data.find(x=>String(x.id)===String(id));const rec={id,date,category,payee,content,amount,paymentMethod,paymentStatus,dueDate,memo,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};$('syncStatus').textContent='保存中…';try{await db.ref(PATH+'/'+id).set(rec);$('syncStatus').textContent='保存済み';reset()}catch(e){$('syncStatus').textContent='保存失敗';alert('保存に失敗しました')}}async function del(){if(!editingId||!confirm('この経費を削除しますか？'))return;try{await db.ref(PATH+'/'+editingId).remove();reset()}catch(e){alert('削除に失敗しました')}}$('saveBtn').onclick=save;$('clearBtn').onclick=()=>reset();$('deleteBtn').onclick=del;$('newBtn').onclick=()=>reset(true);['monthFilter','categoryFilter','statusFilter'].forEach(id=>$(id).onchange=render);$('rows').onclick=e=>{const b=e.target.closest('[data-id]');if(b)edit(b.dataset.id)};$('monthFilter').value=currentMonth();reset();db.ref(PATH).on('value',s=>{const v=s.val()||{};data=Object.keys(v).map(id=>({id,...v[id]}));render();$('syncStatus').textContent='Firebase共有中'},()=>{$('syncStatus').textContent='読み込み失敗'});
</script></body></html>
