<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4c84d">
<title>FUJIWARA 商品マスター</title>
<style>
:root{
  --gold:#c58d00;
  --gold2:#e4b72d;
  --cream:#fff8e3;
  --cream2:#fff2c7;
  --line:#e0bd62;
  --ink:#2f291c;
  --green:#0b9a59;
  --red:#e04848;
  --white:#fff;
  --shadow:0 10px 30px rgba(90,65,0,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{padding-bottom:100px}
header{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,#fff2b7,#ffe7a0);
  border-bottom:2px solid var(--line);
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-weight:900;letter-spacing:2px;color:#b47b00;font-size:20px}
.badge{background:#fff4c7;border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px}
.header-actions{display:flex;gap:8px}
.icon-btn{
  border:1px solid var(--line);background:#fffdf5;border-radius:12px;
  min-width:42px;height:42px;font-size:18px;cursor:pointer
}
main{max-width:1180px;margin:0 auto;padding:22px 18px}
.hero{
  background:linear-gradient(135deg,#fff7d6,#ffe7a8);
  border:1px solid var(--line);border-radius:24px;padding:22px;
  box-shadow:var(--shadow);margin-bottom:18px
}
.hero h1{margin:0 0 6px;font-size:30px}
.hero p{margin:0;color:#6c5a2c}
.toolbar{
  display:grid;grid-template-columns:1.3fr 1fr auto auto;gap:10px;
  margin:18px 0
}
input,select,textarea{
  width:100%;border:2px solid #dfbd66;border-radius:14px;
  background:white;padding:13px 14px;font-size:16px;color:var(--ink);
  outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,141,0,.12)}
.btn{
  border:none;border-radius:14px;padding:13px 18px;
  font-weight:900;font-size:15px;cursor:pointer;white-space:nowrap
}
.btn.gold{background:linear-gradient(180deg,#d7a714,#be8200);color:white}
.btn.light{background:white;border:2px solid var(--line);color:#8a6200}
.btn.green{background:#dff8e8;color:#06793f;border:1px solid #8ed6ac}
.btn.red{background:#ffe5e5;color:#b42323;border:1px solid #f0aaaa}
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px
}
.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stat small{color:#7b6a3f}
.stat strong{display:block;font-size:26px;margin-top:4px}
.panel{
  background:rgba(255,255,255,.62);border:1px solid var(--line);
  border-radius:22px;overflow:hidden;box-shadow:var(--shadow)
}
.panel-head{
  padding:14px 16px;background:#fff0bd;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.panel-head h2{margin:0;font-size:20px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th,td{padding:13px 12px;border-bottom:1px solid #ead395;text-align:left;vertical-align:middle}
th{background:#fff8dc;font-size:13px;color:#6d5c32;position:sticky;top:72px;z-index:5}
td strong{font-size:15px}
.pill{display:inline-block;background:#fff3c6;color:#9a6800;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
.qty-low{color:var(--red);font-weight:900}
.qty-ok{color:var(--green);font-weight:900}
.actions{display:flex;gap:6px}
.mini{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:white;font-size:17px;cursor:pointer
}
.empty{padding:44px;text-align:center;color:#7b6a3f}
.modal-backdrop{
  display:none;position:fixed;inset:0;background:rgba(36,28,5,.48);
  z-index:100;align-items:center;justify-content:center;padding:18px
}
.modal-backdrop.show{display:flex}
.modal{
  width:min(760px,100%);max-height:92vh;overflow:auto;
  background:var(--cream);border:1px solid var(--line);border-radius:24px;
  box-shadow:0 30px 80px rgba(0,0,0,.25)
}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);background:#fff0bd}
.modal-head h3{margin:0}
.close{border:none;background:transparent;font-size:26px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}
.field label{display:block;font-size:13px;font-weight:800;margin:0 0 6px;color:#6c5a2c}
.field.full{grid-column:1/-1}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:0 18px 18px}
.footerbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:#ffedb3;border-top:2px solid var(--line);
  display:flex;justify-content:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))
}
.footerbar .btn{min-width:140px}
.toast{
  position:fixed;right:18px;bottom:100px;z-index:200;
  background:#2e281d;color:white;padding:12px 16px;border-radius:12px;
  opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none
}
.toast.show{opacity:1;transform:none}
@media(max-width:820px){
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar .btn{width:100%}
  .stats{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
}
@media(max-width:560px){
  .hero h1{font-size:24px}
  .toolbar{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  main{padding:16px 10px}
  header{padding:10px}
  .logo{font-size:17px}
  .badge{display:none}
  .footerbar{display:grid;grid-template-columns:1fr 1fr}
  .footerbar .btn{min-width:0;padding:12px 8px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">FUJIWARA</div>
    <div class="badge">👑 商品マスター</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="exportJson()" title="データを書き出す">💾</button>
    <button class="icon-btn" onclick="document.getElementById('importFile').click()" title="データを読み込む">📥</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<main>
  <section class="hero">
    <h1>📦 FUJIWARA 商品マスター</h1>
    <p>品目・単価・注文先・在庫・保存場所を、この単独アプリで登録・編集できます。</p>
  </section>

  <div class="toolbar">
    <input id="searchInput" placeholder="品目名・注文先・メーカーを検索">
    <select id="categoryFilter"><option value="">すべてのカテゴリ</option></select>
    <button class="btn light" onclick="openCategoryManager()">カテゴリ編集</button>
    <button class="btn gold" onclick="openItemModal()">＋ 品目追加</button>
  </div>

  <section class="stats">
    <div class="stat"><small>登録品目</small><strong id="statItems">0</strong></div>
    <div class="stat"><small>カテゴリ</small><strong id="statCategories">0</strong></div>
    <div class="stat"><small>在庫不足</small><strong id="statLow">0</strong></div>
    <div class="stat"><small>在庫金額</small><strong id="statValue">¥0</strong></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>商品一覧</h2>
      <span id="countLabel">0件</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>品目</th><th>カテゴリ</th><th>在庫</th><th>最低在庫</th>
            <th>単価</th><th>注文先</th><th>保存場所</th><th>更新日</th><th>編集</th>
          </tr>
        </thead>
        <tbody id="itemBody"></tbody>
      </table>
      <div id="emptyState" class="empty" hidden>まだ品目がありません。「＋ 品目追加」から登録してください。</div>
    </div>
  </section>
</main>

<div class="footerbar">
  <button class="btn green" onclick="exportJson()">💾 相棒へ渡すデータ</button>
  <button class="btn light" onclick="exportCsv()">📄 CSV出力</button>
</div>

<div id="itemModalWrap" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="itemModalTitle">品目追加</h3>
      <button class="close" onclick="closeItemModal()">×</button>
    </div>
    <div class="form-grid">
      <div class="field"><label>品目名 *</label><input id="fName"></div>
      <div class="field"><label>カテゴリ *</label><select id="fCategory"></select></div>
      <div class="field"><label>単位</label><input id="fUnit" placeholder="個・本・袋・kg など"></div>
      <div class="field"><label>現在在庫</label><input id="fStock" type="number" inputmode="decimal" step="any"></div>
      <div class="field"><label>最低在庫</label><input id="fMinStock" type="number" inputmode="decimal" step="any"></div>
      <div class="field"><label>単価（税込）</label><input id="fPrice" type="number" inputmode="numeric" step="1"></div>
      <div class="field"><label>注文先</label><input id="fSupplier"></div>
      <div class="field"><label>メーカー</label><input id="fMaker"></div>
      <div class="field"><label>保存場所</label><input id="fLocation" placeholder="冷蔵①・A・倉庫など"></div>
      <div class="field"><label>規格</label><input id="fSpec" placeholder="1kg・500ml・100本入など"></div>
      <div class="field full"><label>備考</label><textarea id="fNote" rows="3"></textarea></div>
    </div>
    <div class="modal-foot">
      <button id="deleteItemBtn" class="btn red" onclick="deleteCurrentItem()" style="margin-right:auto;display:none">削除</button>
      <button class="btn light" onclick="closeItemModal()">キャンセル</button>
      <button class="btn gold" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<div id="categoryModalWrap" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h3>カテゴリ編集</h3>
      <button class="close" onclick="closeCategoryManager()">×</button>
    </div>
    <div style="padding:18px">
      <div style="display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px">
        <input id="newCategoryName" placeholder="新しいカテゴリ名">
        <button class="btn gold" onclick="addCategory()">追加</button>
      </div>
      <div id="categoryList"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const STORAGE_KEY = 'fujiwara_product_master_v1';
const CATEGORY_KEY = 'fujiwara_product_categories_v1';

let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let categories = JSON.parse(localStorage.getItem(CATEGORY_KEY) || '["かすてら","ポテト","いか焼き","かき氷","串","チーズハットグ","肉巻きおにぎり","とんかつスティック","コットンキャンディー","電球ジュース"]');
let editingId = null;

const $ = id => document.getElementById(id);
const yen = n => '¥' + Math.round(Number(n||0)).toLocaleString('ja-JP');
const today = () => new Date().toLocaleDateString('ja-JP');

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  localStorage.setItem(CATEGORY_KEY, JSON.stringify(categories));
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}
function refreshCategorySelects(){
  const opts = categories.slice().sort((a,b)=>a.localeCompare(b,'ja'));
  $('categoryFilter').innerHTML='<option value="">すべてのカテゴリ</option>'+opts.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
  $('fCategory').innerHTML=opts.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
}
function render(){
  refreshCategorySelects();
  const q=$('searchInput').value.trim().toLowerCase();
  const cat=$('categoryFilter').value;
  const filtered=items.filter(x=>{
    const hay=[x.name,x.category,x.supplier,x.maker,x.location].join(' ').toLowerCase();
    return (!q || hay.includes(q)) && (!cat || x.category===cat);
  }).sort((a,b)=>a.category.localeCompare(b.category,'ja') || a.name.localeCompare(b.name,'ja'));

  $('itemBody').innerHTML=filtered.map(x=>{
    const low=Number(x.stock||0)<=Number(x.minStock||0);
    return `<tr>
      <td><strong>${escapeHtml(x.name)}</strong><div style="font-size:12px;color:#7b6a3f">${escapeHtml(x.spec||'')}</div></td>
      <td><span class="pill">${escapeHtml(x.category)}</span></td>
      <td class="${low?'qty-low':'qty-ok'}">${formatNum(x.stock)} ${escapeHtml(x.unit||'')}</td>
      <td>${formatNum(x.minStock)} ${escapeHtml(x.unit||'')}</td>
      <td>${yen(x.price)}</td>
      <td>${escapeHtml(x.supplier||'未設定')}</td>
      <td>${escapeHtml(x.location||'未設定')}</td>
      <td>${escapeHtml(x.updated||'')}</td>
      <td><div class="actions">
        <button class="mini" onclick="openItemModal('${x.id}')">✏️</button>
        <button class="mini" onclick="quickDuplicate('${x.id}')">📄</button>
      </div></td>
    </tr>`;
  }).join('');

  $('emptyState').hidden=filtered.length!==0;
  $('countLabel').textContent=filtered.length+'件';
  $('statItems').textContent=items.length;
  $('statCategories').textContent=categories.length;
  $('statLow').textContent=items.filter(x=>Number(x.stock||0)<=Number(x.minStock||0)).length;
  $('statValue').textContent=yen(items.reduce((s,x)=>s+Number(x.stock||0)*Number(x.price||0),0));
}
function formatNum(n){
  const v=Number(n||0);
  return Number.isInteger(v)?v.toLocaleString('ja-JP'):v.toLocaleString('ja-JP',{maximumFractionDigits:2});
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function openItemModal(id=null){
  editingId=id;
  const x=items.find(i=>i.id===id);
  $('itemModalTitle').textContent=x?'品目編集':'品目追加';
  $('deleteItemBtn').style.display=x?'inline-block':'none';
  $('fName').value=x?.name||'';
  $('fCategory').value=x?.category||categories[0]||'';
  $('fUnit').value=x?.unit||'';
  $('fStock').value=x?.stock??0;
  $('fMinStock').value=x?.minStock??0;
  $('fPrice').value=x?.price??0;
  $('fSupplier').value=x?.supplier||'';
  $('fMaker').value=x?.maker||'';
  $('fLocation').value=x?.location||'';
  $('fSpec').value=x?.spec||'';
  $('fNote').value=x?.note||'';
  $('itemModalWrap').classList.add('show');
  setTimeout(()=>$('fName').focus(),100);
}
function closeItemModal(){$('itemModalWrap').classList.remove('show');editingId=null}
function saveItem(){
  const name=$('fName').value.trim(), category=$('fCategory').value.trim();
  if(!name||!category){alert('品目名とカテゴリは必須です。');return}
  const data={
    id:editingId||crypto.randomUUID(),
    name,category,
    unit:$('fUnit').value.trim(),
    stock:Number($('fStock').value||0),
    minStock:Number($('fMinStock').value||0),
    price:Number($('fPrice').value||0),
    supplier:$('fSupplier').value.trim(),
    maker:$('fMaker').value.trim(),
    location:$('fLocation').value.trim(),
    spec:$('fSpec').value.trim(),
    note:$('fNote').value.trim(),
    updated:today()
  };
  if(editingId){
    items=items.map(x=>x.id===editingId?data:x);
  }else{
    items.push(data);
  }
  persist();closeItemModal();render();toast('保存しました');
}
function deleteCurrentItem(){
  if(!editingId)return;
  const x=items.find(i=>i.id===editingId);
  if(confirm(`「${x.name}」を削除しますか？`)){
    items=items.filter(i=>i.id!==editingId);
    persist();closeItemModal();render();toast('削除しました');
  }
}
function quickDuplicate(id){
  const x=items.find(i=>i.id===id); if(!x)return;
  const copy={...x,id:crypto.randomUUID(),name:x.name+'（コピー）',updated:today()};
  items.push(copy);persist();render();toast('複製しました');
}
function openCategoryManager(){
  renderCategoryList();$('categoryModalWrap').classList.add('show');
}
function closeCategoryManager(){$('categoryModalWrap').classList.remove('show')}
function renderCategoryList(){
  $('categoryList').innerHTML=categories.slice().sort((a,b)=>a.localeCompare(b,'ja')).map(c=>`
    <div style="display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #ead395">
      <strong>${escapeHtml(c)}</strong>
      <button class="btn light" onclick='renameCategory(${JSON.stringify(c)})'>名前変更</button>
      <button class="btn red" onclick='deleteCategory(${JSON.stringify(c)})'>削除</button>
    </div>`).join('');
}
function addCategory(){
  const n=$('newCategoryName').value.trim();
  if(!n)return;
  if(categories.includes(n)){alert('同じカテゴリがあります。');return}
  categories.push(n);$('newCategoryName').value='';persist();renderCategoryList();render();toast('カテゴリを追加しました');
}
function renameCategory(oldName){
  const n=prompt('新しいカテゴリ名',oldName);
  if(!n||n.trim()===oldName)return;
  const name=n.trim();
  if(categories.includes(name)){alert('同じカテゴリがあります。');return}
  categories=categories.map(c=>c===oldName?name:c);
  items=items.map(x=>x.category===oldName?{...x,category:name,updated:today()}:x);
  persist();renderCategoryList();render();toast('カテゴリ名を変更しました');
}
function deleteCategory(name){
  const used=items.some(x=>x.category===name);
  if(used){alert('このカテゴリには品目があります。先に品目を移動または削除してください。');return}
  if(confirm(`カテゴリ「${name}」を削除しますか？`)){
    categories=categories.filter(c=>c!==name);persist();renderCategoryList();render();toast('カテゴリを削除しました');
  }
}
function exportJson(){
  const data={app:'FUJIWARA商品マスター',version:'1.0',exportedAt:new Date().toISOString(),categories,items};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  downloadBlob(blob,`fujiwara-product-master-${new Date().toISOString().slice(0,10)}.json`);
  toast('相棒へ渡すJSONを作りました');
}
function exportCsv(){
  const head=['品目名','カテゴリ','単位','在庫','最低在庫','単価','注文先','メーカー','保存場所','規格','備考','更新日'];
  const rows=items.map(x=>[x.name,x.category,x.unit,x.stock,x.minStock,x.price,x.supplier,x.maker,x.location,x.spec,x.note,x.updated]);
  const csv=[head,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  downloadBlob(blob,`fujiwara-product-master-${new Date().toISOString().slice(0,10)}.csv`);
  toast('CSVを作りました');
}
function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);
}
$('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data.items)||!Array.isArray(data.categories))throw new Error();
    if(confirm('現在のデータを読み込んだデータで置き換えますか？')){
      items=data.items;categories=data.categories;persist();render();toast('データを読み込みました');
    }
  }catch{alert('正しいFUJIWARA商品マスターのJSONではありません。')}
  e.target.value='';
});
$('searchInput').addEventListener('input',render);
$('categoryFilter').addEventListener('change',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeItemModal();closeCategoryManager();}});
refreshCategorySelects();render();
</script>
</body>
</html>
