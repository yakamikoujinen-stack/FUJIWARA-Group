<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f172a">
<title>FUJIWARA Group システム管理室</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#172033;--sub:#667085;--line:#d9e1ea;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--shadow:0 10px 28px rgba(15,23,42,.10);--r:18px}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#eaf2ff,#f8fafc 35%,#fff7e8);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.95);color:#fff;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.15)}.hrow{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand small{display:block;color:#dbeafe;font-weight:700}.brand h1{font-size:22px;margin:2px 0 0}.ver{font-size:12px;background:#fff;color:#0f172a;border-radius:999px;padding:6px 10px;font-weight:900}main{max-width:1100px;margin:auto;padding:16px 14px 100px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:rgba(255,255,255,.96);border:1px solid #fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff}.hero h2{margin:0 0 5px}.hero p{margin:0;color:#dbeafe}.progress{height:14px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;margin-top:14px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#f6c84b,#fff1a8);width:0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.kpi{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px}.kpi b{font-size:24px;display:block}.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sec-title h3{margin:0;font-size:17px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:900}.primary{background:var(--blue);color:#fff}.dark{background:#0f172a;color:#fff}.soft{background:#edf2f7;color:#263245}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.row{display:flex;gap:8px;flex-wrap:wrap}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--sub);font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}textarea{min-height:88px;resize:vertical}.task{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px;background:#fff}.task.done{opacity:.62;background:#f1f5f9}.task-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.task-name{font-weight:900}.meta{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.55}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.p1{background:#fee2e2;color:#991b1b}.p2{background:#ffedd5;color:#9a3412}.p3{background:#e0f2fe;color:#075985}.app-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.app{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff}.app-head{display:flex;justify-content:space-between;gap:8px}.app-title{font-weight:950;font-size:15px}.bar{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa)}.status{font-size:11px;font-weight:900;border-radius:999px;padding:4px 8px}.normal{background:#dcfce7;color:#166534}.working{background:#fef3c7;color:#92400e}.dangerous{background:#fee2e2;color:#991b1b}.log{border-left:4px solid #93c5fd;padding:8px 10px;margin:8px 0;background:#f8fbff;border-radius:8px}.log b{display:block}.empty{text-align:center;color:var(--sub);padding:22px 8px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}.tab{border:0;background:transparent;color:#475569;font-size:11px;font-weight:900;padding:5px 2px}.tab span{display:block;font-size:22px;margin-bottom:2px}.tab.active{color:var(--blue)}.page{display:none}.page.active{display:block}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:12px;color:#9a3412;font-size:13px;line-height:1.6}@media(max-width:780px){.span8,.span6,.span4{grid-column:span 12}.kpis{grid-template-columns:repeat(2,1fr)}.app-list{grid-template-columns:1fr}}
</style>
</head><body>
<header><div class="hrow"><div class="brand"><small>👑 FUJIWARA Group</small><h1>システム管理室</h1></div><div class="ver">Ver 1.0</div></div></header>
<main>
<section id="home" class="page active"><div class="grid">
<div class="card hero span12"><h2 id="greeting">おはよう、相棒！</h2><p id="handoverText">前回の続きと、今日やることを確認しよう。</p><div class="progress"><i id="overallBar"></i></div><div class="kpis"><div class="kpi"><small>全体完成率</small><b id="overallPct">0%</b></div><div class="kpi"><small>作業中</small><b id="workingCount">0</b></div><div class="kpi"><small>未完了</small><b id="todoCount">0</b></div><div class="kpi"><small>不具合</small><b id="bugCount">0</b></div></div></div>
<div class="card span8"><div class="sec-title"><h3>📌 今日の作業</h3><button class="btn primary" onclick="quickTask()">＋追加</button></div><div id="todayTasks"></div></div>
<div class="card span4"><div class="sec-title"><h3>▶ 前回の続き</h3></div><div id="resumeBox" class="empty">引継ぎはまだありません</div><button class="btn dark" style="width:100%;margin-top:10px" onclick="switchPage('handover')">引継ぎを記録</button></div>
<div class="card span12"><div class="sec-title"><h3>📱 アプリ状況</h3><button class="btn soft" onclick="switchPage('apps')">すべて見る</button></div><div class="app-list" id="homeApps"></div></div>
</div></section>
<section id="tasks" class="page"><div class="grid"><div class="card span4"><div class="sec-title"><h3>📝 作業を登録</h3></div><div class="field"><label>対象アプリ</label><select id="taskApp"></select></div><div class="field"><label>作業内容</label><input id="taskTitle" placeholder="例：partner共有の確認"></div><div class="field"><label>優先度</label><select id="taskPriority"><option value="高">高</option><option value="中" selected>中</option><option value="低">低</option></select></div><div class="field"><label>次にすること・メモ</label><textarea id="taskNote"></textarea></div><button class="btn primary" style="width:100%" onclick="addTask()">保存</button></div><div class="card span8"><div class="sec-title"><h3>📋 作業一覧</h3><button class="btn soft" onclick="clearCompleted()">完了分を整理</button></div><div id="allTasks"></div></div></div></section>
<section id="apps" class="page"><div class="grid"><div class="card span12"><div class="sec-title"><h3>📱 アプリ管理</h3><button class="btn primary" onclick="addAppPrompt()">＋アプリ追加</button></div><div class="app-list" id="allApps"></div></div></div></section>
<section id="records" class="page"><div class="grid"><div class="card span6"><div class="sec-title"><h3>📚 更新履歴</h3><button class="btn primary" onclick="addLog('update')">＋記録</button></div><div id="updateLogs"></div></div><div class="card span6"><div class="sec-title"><h3>⚠ 不具合管理</h3><button class="btn danger" onclick="addLog('bug')">＋登録</button></div><div id="bugLogs"></div></div><div class="card span6"><div class="sec-title"><h3>💡 アイデア保管庫</h3><button class="btn soft" onclick="addLog('idea')">＋追加</button></div><div id="ideaLogs"></div></div><div class="card span6"><div class="sec-title"><h3>💾 バックアップ記録</h3><button class="btn success" onclick="addLog('backup')">＋記録</button></div><div id="backupLogs"></div></div></div></section>
<section id="handover" class="page"><div class="grid"><div class="card span6"><div class="sec-title"><h3>⏸ 作業中断・引継ぎ</h3></div><div class="field"><label>現在触っているアプリ</label><select id="handApp"></select></div><div class="field"><label>今日ここまで進んだ内容</label><textarea id="handDone"></textarea></div><div class="field"><label>次にすること</label><textarea id="handNext"></textarea></div><div class="field"><label>注意点</label><textarea id="handWarn"></textarea></div><button class="btn dark" style="width:100%" onclick="saveHandover()">引継ぎを保存</button></div><div class="card span6"><div class="sec-title"><h3>🤖 MIYU引継ぎ表示</h3></div><div id="handoverPreview" class="notice">まだ引継ぎはありません。</div><div class="row" style="margin-top:12px"><button class="btn danger" onclick="deleteHandover()">引継ぎを消す</button><button class="btn soft" onclick="exportData()">管理データを書き出す</button><label class="btn soft">読み込む<input type="file" accept=".json" onchange="importData(event)" hidden></label></div></div></div></section>
</main>
<nav class="tabs"><button class="tab active" data-page="home" onclick="switchPage('home')"><span>🏠</span>ホーム</button><button class="tab" data-page="tasks" onclick="switchPage('tasks')"><span>📋</span>作業</button><button class="tab" data-page="apps" onclick="switchPage('apps')"><span>📱</span>アプリ</button><button class="tab" data-page="records" onclick="switchPage('records')"><span>📚</span>記録</button><button class="tab" data-page="handover" onclick="switchPage('handover')"><span>⏸</span>引継ぎ</button></nav>
<script>
const KEY='fujiwara_system_management_v1';
const defaultApps=[{id:'main',icon:'🛡️',name:'メインアプリ',version:'v5.0',status:'正常',risk:'高',progress:96,updated:'未記録'},{id:'king',icon:'👑',name:'KINGアプリ',version:'v1.0',status:'作業中',risk:'高',progress:84,updated:'未記録'},{id:'partner',icon:'🐩',name:'partner',version:'v5.0',status:'正常',risk:'中',progress:100,updated:'未記録'},{id:'partnermen',icon:'🦍🐷',name:'partner MEN',version:'v1.0',status:'作業中',risk:'中',progress:96,updated:'未記録'},{id:'construction',icon:'🏗️',name:'建設アプリ',version:'v1.0',status:'正常',risk:'高',progress:72,updated:'未記録'},{id:'office',icon:'👥',name:'事務員アプリ',version:'v1.0',status:'正常',risk:'中',progress:86,updated:'未記録'},{id:'miyu',icon:'🤖',name:'MIYU',version:'v1.0',status:'作業中',risk:'低',progress:62,updated:'未記録'},{id:'family',icon:'🏡',name:'家族アプリ',version:'構想中',status:'保留',risk:'低',progress:20,updated:'未記録'}];
let db=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){return seed()}}function seed(){return {apps:defaultApps,tasks:[],logs:[],handover:null}}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function now(){return new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function switchPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===id));window.scrollTo({top:0,behavior:'smooth'})}
function appOptions(){const opts=db.apps.map(a=>`<option value="${a.id}">${a.icon} ${esc(a.name)}</option>`).join('');taskApp.innerHTML=opts;handApp.innerHTML=opts}
function appCard(a){const st=a.status==='正常'?'normal':a.status==='作業中'?'working':'dangerous';return `<div class="app"><div class="app-head"><div><div class="app-title">${a.icon} ${esc(a.name)}</div><div class="meta">${esc(a.version)}・最終更新 ${esc(a.updated)}</div></div><span class="status ${st}">${esc(a.status)}</span></div><div class="bar"><i style="width:${Number(a.progress)||0}%"></i></div><div class="meta">完成率 ${Number(a.progress)||0}% ／ 危険度 ${esc(a.risk)}</div><div class="row" style="margin-top:9px"><button class="btn soft" onclick="editApp('${a.id}')">編集</button></div></div>`}
function renderTasks(target,limit){const rows=db.tasks.filter(t=>!t.archived).sort((a,b)=>Number(a.done)-Number(b.done)||b.created.localeCompare(a.created));const use=limit?rows.slice(0,limit):rows;document.getElementById(target).innerHTML=use.length?use.map(t=>{const app=db.apps.find(a=>a.id===t.appId);const cls=t.priority==='高'?'p1':t.priority==='中'?'p2':'p3';return `<div class="task ${t.done?'done':''}"><div class="task-top"><div><div class="task-name">${t.done?'✅':'⬜'} ${esc(t.title)}</div><div class="meta">${app?app.icon+' '+esc(app.name):''}<br>${esc(t.note||'')}</div></div><span class="badge ${cls}">${esc(t.priority)}</span></div><div class="row" style="margin-top:9px"><button class="btn ${t.done?'soft':'success'}" onclick="toggleTask('${t.id}')">${t.done?'未完了に戻す':'完了'}</button><button class="btn danger" onclick="deleteTask('${t.id}')">削除</button></div></div>`}).join(''):'<div class="empty">登録された作業はありません</div>'}
function renderLogs(type,target){const arr=db.logs.filter(x=>x.type===type).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById(target).innerHTML=arr.length?arr.map(x=>`<div class="log"><b>${esc(x.title)}</b><div class="meta">${esc(x.app||'全体')}・${esc(x.date)}<br>${esc(x.note||'')}</div><button class="btn danger" style="margin-top:6px" onclick="deleteLog('${x.id}')">削除</button></div>`).join(''):'<div class="empty">記録はありません</div>'}
function render(){appOptions();const pct=Math.round(db.apps.reduce((s,a)=>s+(Number(a.progress)||0),0)/Math.max(db.apps.length,1));overallPct.textContent=pct+'%';overallBar.style.width=pct+'%';workingCount.textContent=db.apps.filter(a=>a.status==='作業中').length;todoCount.textContent=db.tasks.filter(t=>!t.done&&!t.archived).length;bugCount.textContent=db.logs.filter(x=>x.type==='bug').length;homeApps.innerHTML=db.apps.slice(0,4).map(appCard).join('');allApps.innerHTML=db.apps.map(appCard).join('');renderTasks('todayTasks',5);renderTasks('allTasks');renderLogs('update','updateLogs');renderLogs('bug','bugLogs');renderLogs('idea','ideaLogs');renderLogs('backup','backupLogs');if(db.handover){const a=db.apps.find(x=>x.id===db.handover.appId);const h=`<b>${a?a.icon+' '+esc(a.name):''}</b><br><br><b>ここまで</b><br>${esc(db.handover.done)}<br><br><b>次にすること</b><br>${esc(db.handover.next)}${db.handover.warn?'<br><br><b>注意</b><br>'+esc(db.handover.warn):''}<br><br><small>${esc(db.handover.date)}</small>`;resumeBox.innerHTML=h;resumeBox.className='notice';handoverPreview.innerHTML=h;handoverText.textContent=`前回は「${a?a.name:'作業'}」の途中です。次は「${db.handover.next}」`}else{resumeBox.innerHTML='引継ぎはまだありません';resumeBox.className='empty';handoverPreview.textContent='まだ引継ぎはありません。';handoverText.textContent='前回の続きと、今日やることを確認しよう。'}}
function quickTask(){switchPage('tasks');setTimeout(()=>taskTitle.focus(),200)}function addTask(){const title=taskTitle.value.trim();if(!title)return alert('作業内容を入力して');db.tasks.push({id:crypto.randomUUID(),appId:taskApp.value,title,priority:taskPriority.value,note:taskNote.value.trim(),done:false,created:new Date().toISOString()});taskTitle.value='';taskNote.value='';save()}function toggleTask(id){const t=db.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save()}function deleteTask(id){if(confirm('この作業を削除する？')){db.tasks=db.tasks.filter(x=>x.id!==id);save()}}function clearCompleted(){db.tasks.forEach(t=>{if(t.done)t.archived=true});save()}
function editApp(id){const a=db.apps.find(x=>x.id===id);if(!a)return;const version=prompt('バージョン',a.version);if(version===null)return;const status=prompt('状態（正常／作業中／要注意／保留）',a.status);if(status===null)return;const progress=prompt('完成率 0〜100',a.progress);if(progress===null)return;const risk=prompt('危険度（高／中／低）',a.risk);if(risk===null)return;a.version=version;a.status=status;a.progress=Math.max(0,Math.min(100,Number(progress)||0));a.risk=risk;a.updated=now();save()}
function addAppPrompt(){const name=prompt('アプリ名');if(!name)return;const icon=prompt('アイコン（絵文字）','📱')||'📱';db.apps.push({id:crypto.randomUUID(),icon,name,version:'v1.0',status:'作業中',risk:'中',progress:0,updated:now()});save()}
function addLog(type){const labels={update:'更新内容',bug:'不具合内容',idea:'アイデア',backup:'バックアップ名'};const title=prompt(labels[type]);if(!title)return;const app=prompt('対象アプリ（空欄可）','');const note=prompt('詳細・メモ','');db.logs.push({id:crypto.randomUUID(),type,title,app:app||'全体',note:note||'',date:now()});save()}function deleteLog(id){if(confirm('この記録を削除する？')){db.logs=db.logs.filter(x=>x.id!==id);save()}}
function saveHandover(){const done=handDone.value.trim(),next=handNext.value.trim();if(!done||!next)return alert('「ここまで」と「次にすること」を入力して');db.handover={appId:handApp.value,done,next,warn:handWarn.value.trim(),date:now()};save();switchPage('home')}function deleteHandover(){if(confirm('引継ぎを消す？')){db.handover=null;save()}}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fujiwara-system-management-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.apps||!d.tasks)throw new Error();db=d;save();alert('読み込み完了')}catch(err){alert('読み込めないファイルです')}};r.readAsText(f)}
(function(){const h=new Date().getHours();greeting.textContent=(h<10?'おはよう':h<18?'こんにちは':'お疲れさま')+'、相棒！'})();render();
</script></body></html>
