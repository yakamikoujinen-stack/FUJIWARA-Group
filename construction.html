<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建設スタッフ安定版</title><meta name="apple-mobile-web-app-title" content="建設スタッフ"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f3a5f"><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7;color:#172033}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{background:#dbe7f7;color:#1f3a5f}.active{background:#1f3a5f!important;color:#fff!important}button,input,select,textarea{width:100%;box-sizing:border-box;font-size:16px;padding:11px;margin-top:8px;border-radius:10px;border:1px solid #ccd3dd}button{background:#1f3a5f;color:#fff;border:0;font-weight:800}.green{background:#0a7a2f}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.head,.day{background:#fff;border:1px solid #d6dde8;border-radius:10px;padding:6px;font-size:13px}.head{background:#1f3a5f;color:#fff;text-align:center;font-weight:800}.day{min-height:72px}.dotrow{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}.dot{font-size:21px;line-height:1}.small{font-size:12px;color:#667085;line-height:1.6}.status{display:inline-block;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;background:#fff4db;color:#9a6700}.ok{background:#e9f9ef;color:#0a7a2f}.ng{background:#ffe4e6;color:#b00020}.saveState{margin-top:10px;padding:11px;border-radius:10px;text-align:center;font-weight:800}.saving{background:#fff4db;color:#9a6700}.saved{background:#e9f9ef;color:#0a7a2f}.waiting{background:#fff0f1;color:#b00020}.header{padding:20px 14px}.title{max-width:900px;margin:auto;background:#fff;border-radius:24px;padding:25px;box-shadow:0 8px 24px #0001}.title h1{margin:0;font-size:29px}.version{display:inline-block;margin-top:10px;background:#0a7a2f;color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px}@media(max-width:700px){.row{grid-template-columns:1fr}.day{min-height:68px}.title h1{font-size:25px}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><header class="header"><div class="title"><h1>FUJIWARA Group</h1><div>― construction ―</div><div class="version">スタッフ安定版 v5.2</div></div></header><main><section class="card"><h3>スタッフ用</h3><p class="small">スタッフは日報を記入して「日報を保存」を押すだけです。通信が一時的に切れても端末に保存し、接続後に自動送信します。</p><span id="cloudStatus" class="status">接続確認中...</span></section><div class="card tabs"><button id="bCal" class="tab active" onclick="showTab('cal')">📅 カレンダー</button><button id="bRep" class="tab" onclick="showTab('rep')">📝 日報入力</button></div><section id="cal"><div class="card row"><button onclick="moveMonth(-1)">← 前月</button><button onclick="moveMonth(1)">翌月 →</button></div><div class="card"><h2 id="monthTitle"></h2><div class="grid" id="calHead"></div><div class="grid" id="calendar"></div></div><div class="card"><h3>選択日の内容</h3><div id="dayList">日付を選択してください</div></div></section><section id="rep" style="display:none"><div class="card"><h3>日報入力</h3><div class="row"><input id="rDate" type="date"><input id="rSite" placeholder="現場名"></div><label class="small"><b>当社の会社名</b></label><select id="rCompany"></select><div class="row"><select id="rReporter"></select><input id="rPeople" type="number" min="1" placeholder="人数"></div><div class="row"><select id="rClient"></select><input id="rClientPerson" placeholder="取引先担当者名"></div><div class="row"><select id="rWorker"></select><select id="rWeather"><option value="">天気</option><option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option></select></div><div class="row"><div><label class="small"><b>現場入場</b></label><input id="rStart" type="time"></div><div><label class="small"><b>現場退場</b></label><input id="rEnd" type="time"></div></div><input id="rBreak" type="number" min="0" placeholder="休憩 分"><textarea id="rWork" placeholder="本日の作業内容"></textarea><textarea id="rMemo" placeholder="連絡事項・問題点・明日の予定"></textarea><button id="saveBtn" class="green" onclick="saveReport()">日報を保存</button><div id="saveState" class="saveState" style="display:none"></div></div><div class="card"><h3>日報一覧</h3><div id="reportList">日報なし</div></div></section></main><script>const firebaseConfig={apiKey:['AI','zaSy','BVu9pdWuJVrCdE8khbzIm3kfenPP4swOA'].join(''),authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:8ff756d645bc0398956a94'};firebase.initializeApp(firebaseConfig);const db=firebase.database(),base='fujiwara/construction',QKEY='fks_construction_pending_v52',BKEY='fks_construction_report_backups';let current=new Date(),reports=[],jobs=[],workers=[],clients=['未登録'];const companies=['藤原一工業合同会社','リコー工業合同会社','株式会社ミライソ'],marks=['🔴','🟢','🟡','🔵','🟣','🟠','⚫','⚪','🟤'];function R(p){return db.ref(base+'/'+p)}function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function arr(v){return v?Object.entries(v).map(([id,x])=>({id,...x})):[]}function uniq(a){return[...new Set((a||[]).map(x=>String(x||'').trim()).filter(Boolean))]}function local(k){try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}}function saveLocal(k,a){localStorage.setItem(k,JSON.stringify(a.slice(-500)))}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function mark(name){const n=String(name||'未登録');const a=uniq(['未登録'].concat(clients));let i=a.indexOf(n);if(i<0)i=0;return marks[i%marks.length]}function uid(){return'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,9)}function setState(t,c){saveState.style.display='block';saveState.textContent=t;saveState.className='saveState '+c}async function send(r){await R('reports/'+r.localId).set(r);const s=await R('reports/'+r.localId).once('value');if(!s.exists())throw Error('保存確認失敗')}async function syncPending(){const q=local(QKEY);if(!q.length)return;const rest=[];for(const r of q){try{await send({...r,syncStatus:'synced',syncedAt:new Date().toISOString()})}catch(e){rest.push(r)}}saveLocal(QKEY,rest)}function backup(r){const a=local(BKEY);a.push(r);saveLocal(BKEY,a)}function clearForm(){rSite.value=rPeople.value=rStart.value=rEnd.value=rBreak.value=rWork.value=rMemo.value=rClientPerson.value='';rReporter.value='';rClient.value='';rWorker.value=''}async function saveReport(){if(!rDate.value||!rSite.value||!rReporter.value||!rPeople.value||!rStart.value||!rEnd.value||!rWork.value)return alert('必須項目を入力してください');const r={localId:uid(),date:rDate.value,site:rSite.value,company:rCompany.value,reporter:rReporter.value,client:rClient.value||'未登録',clientPerson:rClientPerson.value,worker:rWorker.value,people:rPeople.value,start:rStart.value,end:rEnd.value,breakMin:rBreak.value,weather:rWeather.value,work:rWork.value,memo:rMemo.value,approved:false,createdAt:new Date().toISOString(),created:new Date().toLocaleString(),syncStatus:'pending'};backup(r);const q=local(QKEY);q.push(r);saveLocal(QKEY,q);saveBtn.disabled=true;setState('🟡 保存中…','saving');try{await send({...r,syncStatus:'synced',syncedAt:new Date().toISOString()});saveLocal(QKEY,local(QKEY).filter(x=>x.localId!==r.localId));setState('🟢 保存完了','saved');clearForm();alert('日報を保存しました')}catch(e){setState('🔴 端末に保存済み・自動送信待ち','waiting');clearForm();alert('日報は端末に保存しました。通信が戻ると自動送信します。打ち直しは不要です。')}finally{saveBtn.disabled=false}}function renderSelects(){const rc=rClient.value,rr=rReporter.value,rw=rWorker.value;rCompany.innerHTML=companies.map(x=>`<option>${esc(x)}</option>`).join('');rReporter.innerHTML='<option value="">日報入力者を選択</option>'+workers.map(x=>`<option>${esc(x)}</option>`).join('');rWorker.innerHTML='<option value="">作業員を選択</option>'+workers.map(x=>`<option>${esc(x)}</option>`).join('');rClient.innerHTML='<option value="">取引先名を選択</option>'+clients.map(x=>`<option>${esc(x)}</option>`).join('');if(rr)rReporter.value=rr;if(rw)rWorker.value=rw;if(rc)rClient.value=rc}function showTab(t){cal.style.display=t==='cal'?'block':'none';rep.style.display=t==='rep'?'block':'none';bCal.className=t==='cal'?'tab active':'tab';bRep.className=t==='rep'?'tab active':'tab';renderAll()}function moveMonth(n){current.setMonth(current.getMonth()+n);renderCalendar()}function showDay(ds){const rs=reports.filter(x=>x.date===ds),js=jobs.filter(x=>x.date===ds);dayList.innerHTML=(rs.length||js.length)?js.map(j=>`<div class="card"><b>予定：${esc(j.site)}</b><br><span class="dot">${mark(j.client)}</span><br>作業員：${esc(j.workers||'-')}<br>内容：${esc(j.work||'-')}</div>`).join('')+rs.map(r=>`<div class="card"><h3 style="margin:0 0 6px">🏢 ${esc(r.client||'取引先未登録')}</h3><b>${esc(r.site)}</b><br><span class="small">入力者：${esc(r.reporter||'-')}</span><br>作業員：${esc(r.worker||'-')}　人数：${esc(r.people||0)}<br>現場入場：${esc(r.start)}　現場退場：${esc(r.end)}<br>内容：${esc(r.work)}</div>`).join(''):'予定・日報なし'}function renderCalendar(){const y=current.getFullYear(),m=current.getMonth();monthTitle.textContent=y+'年 '+(m+1)+'月';calHead.innerHTML=['日','月','火','水','木','金','土'].map(x=>`<div class="head">${x}</div>`).join('');const first=new Date(y,m,1),last=new Date(y,m+1,0);let h='';for(let i=0;i<first.getDay();i++)h+='<div></div>';for(let d=1;d<=last.getDate();d++){const ds=fmt(new Date(y,m,d)),all=jobs.filter(x=>x.date===ds).concat(reports.filter(x=>x.date===ds));h+=`<div class="day" onclick="showDay('${ds}')"><b>${d}</b><div class="dotrow">${all.slice(0,9).map(x=>`<span class="dot">${mark(x.client)}</span>`).join('')}</div></div>`}calendar.innerHTML=h}function renderReports(){const a=reports.slice().sort((x,y)=>(y.createdAt||'').localeCompare(x.createdAt||''));reportList.innerHTML=a.length?a.map(r=>`<div class="card"><h3 style="margin:0 0 6px">🏢 ${esc(r.client||'取引先未登録')}</h3><b>${esc(r.date)}　${esc(r.site)}</b><br><span class="small">入力者：${esc(r.reporter||'-')} / 天気：${esc(r.weather||'-')}</span><br>担当者：${esc(r.clientPerson||'-')}<br>作業員：${esc(r.worker||'-')}　人数：${esc(r.people||0)}<br>現場入場：${esc(r.start)}　現場退場：${esc(r.end)}　休憩：${esc(r.breakMin||0)}分<br>作業内容：${esc(r.work)}</div>`).join(''):'日報なし'}function renderAll(){renderSelects();renderCalendar();renderReports()}function start(){firebase.database().ref('.info/connected').on('value',s=>{if(s.val()){cloudStatus.textContent='Firebase接続OK / 共有中';cloudStatus.className='status ok';syncPending()}else{cloudStatus.textContent='通信確認中';cloudStatus.className='status ng'}});R('reports').on('value',s=>{reports=arr(s.val());renderAll()});R('jobs').on('value',s=>{jobs=arr(s.val());renderAll()});R('workers').on('value',s=>{workers=uniq(arr(s.val()).map(x=>x.name).concat(local('fks_construction_workers')));renderAll()});R('clients').on('value',s=>{clients=uniq(['未登録'].concat(arr(s.val()).map(x=>x.name)).concat(local('fks_construction_clients')));renderAll()});setInterval(syncPending,30000);window.addEventListener('online',syncPending)}rDate.value=fmt(new Date());renderAll();start();</script></body></html>
