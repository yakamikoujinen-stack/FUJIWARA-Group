<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUJIWARA Group construction Firebase</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7;color:#172033}
main{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tab{background:#dbe7f7;color:#1f3a5f}.active{background:#1f3a5f!important;color:white!important}
button,input,select,textarea{width:100%;font-size:16px;padding:11px;margin-top:8px;border-radius:10px;border:1px solid #ccd3dd}
button{background:#1f3a5f;color:#fff;border:0;font-weight:bold}.green{background:#0a7a2f}.red{background:#b00020}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.head,.day{background:white;border:1px solid #d6dde8;border-radius:10px;padding:6px;font-size:13px}.head{background:#1f3a5f;color:white;text-align:center;font-weight:bold}.day{min-height:82px}
.job{margin-top:4px;background:#e8f1ff;border-left:4px solid #1f3a5f;border-radius:6px;padding:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.report{background:#e9f9ef;border-left-color:#0a7a2f}
.small{font-size:12px;color:#666;line-height:1.6}.status{display:inline-block;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:bold;background:#fff4db;color:#b7791f}.status.ok{background:#e9f9ef;color:#0a7a2f}.status.ng{background:#ffe4e6;color:#b00020}
.fg-header{background:#eef2f7;color:#172033;text-align:left;padding:22px 16px}.fg-title-card{background:#fff;border-radius:26px;padding:30px 28px;box-shadow:0 8px 24px rgba(0,0,0,.08);max-width:1000px;margin:auto}
.fg-main-title{font-size:32px;font-weight:800;color:#172033}.fg-sub-title{font-size:24px;letter-spacing:2px;color:#172033;margin-top:6px}.fg-version{display:inline-block;margin-top:12px;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;color:#fff;background:#0a7a2f}.fg-system-name{margin-top:16px;color:#667085;font-size:14px;letter-spacing:1px}
@media(max-width:720px){.row,.tabs{grid-template-columns:1fr}.day{min-height:70px}.fg-main-title{font-size:26px}.fg-sub-title{font-size:20px}.fg-title-card{padding:24px 22px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<link rel="apple-touch-icon" href="icon-construction-staff.png">
<link rel="icon" type="image/png" href="icon-construction-staff.png">
<meta name="apple-mobile-web-app-title" content="建設スタッフ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f3a5f">

</head>
<body>
<header class="fg-header"><div class="fg-title-card"><div class="fg-main-title">FUJIWARA Group</div><div class="fg-sub-title">- construction -</div><div class="fg-version">正規版 / Firebase共有版</div><div class="fg-system-name">Construction Management System</div></div></header>
<main>
<section class="card"><h3>スタッフ用</h3><p class="small">予定確認と日報入力のみ使用できます。保存データはFirebaseで共有されます。</p><span id="cloudStatus" class="status">Firebase接続中...</span><button class="green" onclick="syncLocalMastersToFirebase()">この端末の作業員・取引先を共有へ反映</button><p class="small">開発版で登録した作業員・取引先が出ない時は、このボタンを1回押してください。</p></section>
<div class="card tabs"><button id="bCal" class="tab active" onclick="showTab('cal')">📅 予定</button><button id="bRep" class="tab" onclick="showTab('rep')">📝 日報</button></div>
<section id="cal">
<div class="card row"><button onclick="moveMonth(-1)">← 前月</button><button onclick="moveMonth(1)">翌月 →</button></div>
<div class="card"><h2 id="monthTitle"></h2><div class="grid" id="calHead"></div><div class="grid" id="calendar"></div></div>
<div class="card"><h3>現場予定を登録</h3><div class="row"><input id="jDate" type="date"><input id="jSite" placeholder="現場名"></div><div class="row"><select id="jClient"></select><input id="jStart" type="time"></div><input id="jWorkers" placeholder="作業員（例：山田、田中）"><textarea id="jWork" placeholder="作業内容・持ち物・注意事項"></textarea><button onclick="addJob()">予定を保存</button></div>
<div class="card"><h3>選択日の予定・日報</h3><div id="dayList">日付を選択してください</div></div>
</section>
<section id="rep" style="display:none">
<div class="card"><h3>日報入力</h3><div class="row"><input id="rDate" type="date"><input id="rSite" placeholder="現場名"></div>
<label class="small"><b>当社の会社名</b></label><select id="rCompany"></select>
<div class="row"><select id="rReporter"></select><input id="rPeople" type="number" placeholder="人数"></div><div class="small">左：当社の日報入力者　右：人数</div>
<div class="row"><select id="rClient"></select><input id="rClientPerson" placeholder="取引先担当者名"></div><div class="small">左：取引先名　右：取引先担当者</div>
<div class="row"><select id="rWorker"></select><select id="rWeather"><option value="">天気</option><option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option></select></div>
<div class="row"><div><label class="small"><b>現場入場</b></label><input id="rStart" type="time"></div><div><label class="small"><b>現場退場</b></label><input id="rEnd" type="time"></div></div>
<input id="rBreak" type="number" placeholder="休憩 分"><textarea id="rWork" placeholder="本日の作業内容"></textarea><textarea id="rMemo" placeholder="連絡事項・問題点・明日の予定"></textarea><button class="green" onclick="addReport()">日報を保存</button></div>
<div class="card"><h3>日報一覧</h3><div id="reportList">日報なし</div></div>
</section>
</main>
<script>
const firebaseConfig={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94",measurementId:"G-1VHX1GQV0C"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database(), base="fujiwara/construction";
let current=new Date(), selectedDate="", jobsData=[], reportsData=[], workersData=unique(readLocal("fks_construction_workers").concat(["藤原","山田","田中","繁充"])), clientsData=unique(readLocal("fks_construction_clients").concat(["未登録","前田建設株式会社"]));
const companiesData=["藤原一工業合同会社","リコー工業合同会社","株式会社ミライソ"];
function R(p){return db.ref(base+"/"+p)}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function unique(a){return [...new Set(a.filter(Boolean))]}
function asArray(v){if(!v)return[];return Object.entries(v).map(([id,val])=>({id,...val}))}
function readLocal(key){try{const v=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
function normalizeNameArray(arr){return unique((arr||[]).map(x=>typeof x==="string"?x:(x&&x.name)||"").filter(Boolean))}
function syncList(path,names){
  const updates={};
  names.forEach(name=>{
    const safe=String(name).replace(/[.#$\[\]/]/g,"_");
    updates[safe]={name:name,updatedAt:new Date().toISOString()};
  });
  return R(path).update(updates);
}
function syncLocalMastersToFirebase(){
  const ws=normalizeNameArray(readLocal("fks_construction_workers").concat(workersData));
  const cs=normalizeNameArray(readLocal("fks_construction_clients").concat(clientsData));
  Promise.all([syncList("workers",ws),syncList("clients",cs)]).then(()=>{
    alert("この端末の作業員・取引先をFirebase共有へ反映しました");
  }).catch(e=>alert("共有エラー: "+e.message));
}
function setStatus(t,c){cloudStatus.textContent=t;cloudStatus.className="status "+(c||"")}
function seed(){
  R("workers").once("value").then(s=>{if(!s.exists())R("workers").set({w1:{name:"藤原"},w2:{name:"山田"},w3:{name:"田中"},w4:{name:"繁充"}})});
  R("clients").once("value").then(s=>{if(!s.exists())R("clients").set({c1:{name:"未登録"},c2:{name:"前田建設株式会社"}})});
  const localW=readLocal("fks_construction_workers");
  const localC=readLocal("fks_construction_clients");
  if(localW.length||localC.length){syncLocalMastersToFirebase();}
}
function startFirebase(){firebase.database().ref(".info/connected").on("value",s=>{s.val()?setStatus("Firebase接続OK / 共有中","ok"):setStatus("Firebase未接続 / 通信確認中","ng")});seed();R("jobs").on("value",s=>{jobsData=asArray(s.val());renderAll()});R("reports").on("value",s=>{reportsData=asArray(s.val());renderAll()});R("workers").on("value",s=>{workersData=unique(asArray(s.val()).map(x=>x.name).concat(readLocal("fks_construction_workers")).concat(["藤原","山田","田中","繁充"]));renderAll()});R("clients").on("value",s=>{clientsData=unique(asArray(s.val()).map(x=>x.name).concat(readLocal("fks_construction_clients")).concat(["未登録","前田建設株式会社"]));renderAll()})}
function showTab(t){cal.style.display=t=="cal"?"block":"none";rep.style.display=t=="rep"?"block":"none";bCal.className=t=="cal"?"tab active":"tab";bRep.className=t=="rep"?"tab active":"tab";renderAll()}
function renderSelects(){jClient.innerHTML='<option value="">取引先名を選択</option>'+clientsData.map(x=>`<option>${x}</option>`).join("");rClient.innerHTML=jClient.innerHTML;rCompany.innerHTML=companiesData.map(x=>`<option>${x}</option>`).join("");rReporter.innerHTML='<option value="">当社の日報入力者を選択</option>'+workersData.map(x=>`<option>${x}</option>`).join("");rWorker.innerHTML='<option value="">作業員を選択</option>'+workersData.map(x=>`<option>${x}</option>`).join("")}
function addJob(){if(!jDate.value||!jSite.value)return alert("日付と現場名を入力してください");R("jobs").push({date:jDate.value,site:jSite.value,client:jClient.value,start:jStart.value,workers:jWorkers.value,work:jWork.value,createdAt:new Date().toISOString()}).then(()=>{jSite.value=jStart.value=jWorkers.value=jWork.value="";alert("予定をFirebaseへ保存しました")}).catch(e=>alert("保存エラー: "+e.message))}
function addReport(){if(!rDate.value||!rSite.value||!rReporter.value||!rPeople.value||!rStart.value||!rEnd.value||!rWork.value)return alert("必須項目を入力してください");R("reports").push({date:rDate.value,site:rSite.value,company:rCompany.value,reporter:rReporter.value,client:rClient.value,clientPerson:rClientPerson.value,worker:rWorker.value,people:rPeople.value,start:rStart.value,end:rEnd.value,breakMin:rBreak.value,weather:rWeather.value,work:rWork.value,memo:rMemo.value,approved:false,createdAt:new Date().toISOString(),created:new Date().toLocaleString()}).then(()=>{rSite.value=rPeople.value=rStart.value=rEnd.value=rBreak.value=rWork.value=rMemo.value=rClientPerson.value="";rReporter.value="";rClient.value="";rWorker.value="";alert("日報をFirebaseへ保存しました")}).catch(e=>alert("保存エラー: "+e.message))}
function delJob(id){if(confirm("予定を削除しますか？"))R("jobs/"+id).remove()} function delReport(id){if(confirm("日報を削除しますか？"))R("reports/"+id).remove()} function approve(id){R("reports/"+id).update({approved:true,approvedAt:new Date().toISOString()})}
function copyJob(j){showTab("rep");rDate.value=j.date;rSite.value=j.site;rClient.value=j.client||"";rStart.value=j.start||"";rWork.value=j.work||"";rPeople.value=(j.workers||"").split(/[、,]/).filter(Boolean).length||""}
function moveMonth(n){current.setMonth(current.getMonth()+n);renderCalendar()}
function showDay(ds){selectedDate=ds;const js=jobsData.filter(x=>x.date==ds),rs=reportsData.filter(x=>x.date==ds);dayList.innerHTML=(js.length||rs.length)?js.map(j=>`<div class="card"><b>予定：${j.site}</b><br><span class="small">${j.start||"-"} / 取引先：${j.client||"-"}</span><br>作業員：${j.workers||"-"}<br>内容：${j.work||"-"}<br><button onclick='copyJob(${JSON.stringify(j).replace(/'/g,"&#39;")})'>この予定から日報作成</button><button class="red" onclick="delJob('${j.id}')">予定削除</button></div>`).join("")+rs.map(r=>`<div class="card"><b>日報：${r.site}</b><br><span class="small">${r.approved?"承認済み":"未承認"} / 当社：${r.company||"-"} / 入力者：${r.reporter||"-"}</span><br>取引先：${r.client||"-"}　担当者：${r.clientPerson||"-"}<br>作業員：${r.worker||"-"}<br>現場入場：${r.start} 現場退場：${r.end}<br>内容：${r.work}<br><button onclick="approve('${r.id}')">承認</button><button class="red" onclick="delReport('${r.id}')">日報削除</button></div>`).join(""):"予定・日報なし"}
function renderCalendar(){let y=current.getFullYear(),m=current.getMonth();monthTitle.textContent=y+"年 "+(m+1)+"月";calHead.innerHTML=["日","月","火","水","木","金","土"].map(x=>`<div class="head">${x}</div>`).join("");let first=new Date(y,m,1),last=new Date(y,m+1,0),html="";for(let i=0;i<first.getDay();i++)html+="<div></div>";for(let d=1;d<=last.getDate();d++){let ds=fmt(new Date(y,m,d)),js=jobsData.filter(x=>x.date==ds),rs=reportsData.filter(x=>x.date==ds);html+=`<div class="day" onclick="showDay('${ds}')"><b>${d}</b>`+js.slice(0,2).map(j=>`<div class="job">${j.start||""} ${j.site}</div>`).join("")+rs.slice(0,3).map(r=>`<div class="job report">${r.site}</div>`).join("")+"</div>"}calendar.innerHTML=html}
function renderReports(){let a=reportsData.slice().reverse();reportList.innerHTML=a.length?a.map(r=>`<div class="card"><b>${r.date} ${r.site}</b><br><span class="small">${r.approved?"✅ 承認済み":"🟡 未承認"} / 当社：${r.company||"-"} / 入力者：${r.reporter||"-"}</span><br>取引先：${r.client||"-"}　担当者：${r.clientPerson||"-"}<br>作業員：${r.worker||"-"}　人数：${r.people}<br>現場入場：${r.start} 現場退場：${r.end} 休憩：${r.breakMin||0}分<br>作業内容：${r.work}<br><button onclick="approve('${r.id}')">承認</button><button class="red" onclick="delReport('${r.id}')">削除</button></div>`).join(""):"日報なし"}
function renderAll(){renderSelects();renderCalendar();renderReports()}
let t=fmt(new Date());jDate.value=t;rDate.value=t;renderAll();startFirebase();
</script>
</body>
</html>
