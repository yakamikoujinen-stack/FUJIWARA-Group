<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>建設スタッフ 安定版</title><meta name="apple-mobile-web-app-title" content="建設スタッフ"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f3a5f">
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7;color:#172033}main{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tab{background:#dbe7f7;color:#1f3a5f}.active{background:#1f3a5f!important;color:white!important}button,input,select,textarea{width:100%;font-size:16px;padding:11px;margin-top:8px;border-radius:10px;border:1px solid #ccd3dd;box-sizing:border-box}button{background:#1f3a5f;color:#fff;border:0;font-weight:bold}.green{background:#0a7a2f}.red{background:#b00020}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.head,.day{background:#fff;border:1px solid #d6dde8;border-radius:10px;padding:6px;font-size:13px}.head{background:#1f3a5f;color:#fff;text-align:center;font-weight:bold}.day{min-height:78px}.dotrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.dot{font-size:22px;line-height:1}.small{font-size:12px;color:#666;line-height:1.6}.status{display:inline-block;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:bold;background:#fff4db;color:#b7791f}.ok{background:#e9f9ef;color:#0a7a2f}.ng{background:#ffe4e6;color:#b00020}.fg-header{padding:22px 16px}.fg-title-card{background:#fff;border-radius:26px;padding:26px 24px;box-shadow:0 8px 24px rgba(0,0,0,.08);max-width:1000px;margin:auto}.fg-main-title{font-size:30px;font-weight:800}.fg-sub-title{font-size:22px;margin-top:6px}.fg-version{display:inline-block;margin-top:12px;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;color:#fff;background:#0a7a2f}@media(max-width:720px){.row,.tabs{grid-template-columns:1fr}.day{min-height:70px}.fg-main-title{font-size:26px}}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body>
<header class="fg-header"><div class="fg-title-card"><div class="fg-main-title">FUJIWARA Group</div><div class="fg-sub-title">- construction -</div><div class="fg-version">スタッフ安定版 v4.0</div></div></header><main>
<section class="card"><h3>スタッフ用</h3><p class="small">予定確認と日報入力。取引先名はカレンダーでは色だけ表示します。</p><span id="cloudStatus" class="status">接続確認中...</span><button class="green" onclick="reloadMasters()">作業員・取引先を最新に更新</button><button onclick="rescueLocalReports()">この端末に残っている日報を復旧</button></section>
<div class="card tabs"><button id="bCal" class="tab active" onclick="showTab('cal')">📅 予定</button><button id="bRep" class="tab" onclick="showTab('rep')">📝 日報</button></div>
<section id="cal"><div class="card row"><button onclick="moveMonth(-1)">← 前月</button><button onclick="moveMonth(1)">翌月 →</button></div><div class="card"><h2 id="monthTitle"></h2><div class="grid" id="calHead"></div><div class="grid" id="calendar"></div></div><div class="card"><h3>選択日の予定・日報</h3><div id="dayList">日付を選択してください</div></div></section>
<section id="rep" style="display:none"><div class="card"><h3>日報入力</h3><div class="row"><input id="rDate" type="date"><input id="rSite" placeholder="現場名"></div><label class="small"><b>当社の会社名</b></label><select id="rCompany"></select><div class="row"><select id="rReporter"></select><input id="rPeople" type="number" placeholder="人数"></div><div class="row"><select id="rClient"></select><input id="rClientPerson" placeholder="取引先担当者名"></div><div class="row"><select id="rWorker"></select><select id="rWeather"><option value="">天気</option><option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option></select></div><div class="row"><div><label class="small"><b>現場入場</b></label><input id="rStart" type="time"></div><div><label class="small"><b>現場退場</b></label><input id="rEnd" type="time"></div></div><input id="rBreak" type="number" placeholder="休憩 分"><textarea id="rWork" placeholder="本日の作業内容"></textarea><textarea id="rMemo" placeholder="連絡事項・問題点・明日の予定"></textarea><button class="green" onclick="addReport()">日報を保存</button></div><div class="card"><h3>日報一覧</h3><div id="reportList">日報なし</div></div></section>
</main><script>
const firebaseConfig={apiKey:['AI','zaSy','BVu9pdWuJVrCdE8khbzIm3kfenPP4swOA'].join(''),authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:8ff756d645bc0398956a94'};
firebase.initializeApp(firebaseConfig);const db=firebase.database(),base='fujiwara/construction';let current=new Date(),jobsData=[],reportsData=[],workersData=[],clientsData=['未登録'];const companiesData=['藤原一工業合同会社','リコー工業合同会社','株式会社ミライソ'],marks=['🔴','🟢','🟡','🔵','🟣','🟠','⚫','⚪','🟤','🔶','🔷','⭐'];
function R(p){return db.ref(base+'/'+p)}function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function unique(a){return [...new Set((a||[]).filter(Boolean))]}function asArray(v){return v?Object.entries(v).map(([id,val])=>({id,...val})):[]}function readLocal(k){try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}function saveLocal(k,a){try{localStorage.setItem(k,JSON.stringify(unique(a)))}catch(e){}}function clientMark(name){const n=String(name||'未登録');const list=unique(['未登録'].concat(clientsData));let i=list.indexOf(n);if(i<0)i=0;return marks[i%marks.length]}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setStatus(t,c){cloudStatus.textContent=t;cloudStatus.className='status '+(c||'')}function reloadMasters(){localStorage.removeItem('fks_construction_workers');localStorage.removeItem('fks_construction_clients');R('workers').once('value').then(s=>{workersData=unique(asArray(s.val()).map(x=>x.name));saveLocal('fks_construction_workers',workersData);renderAll()});R('clients').once('value').then(s=>{clientsData=unique(['未登録'].concat(asArray(s.val()).map(x=>x.name)));saveLocal('fks_construction_clients',clientsData);renderAll();alert('最新に更新しました')})}
function startFirebase(){firebase.database().ref('.info/connected').on('value',s=>{s.val()?(setStatus('Firebase接続OK / 共有中','ok'),syncOfflineQueue()):setStatus('Firebase未接続 / 通信確認中','ng')});R('jobs').on('value',s=>{jobsData=asArray(s.val());renderAll()});R('reports').on('value',s=>{reportsData=asArray(s.val());renderAll()});R('workers').on('value',s=>{workersData=unique(asArray(s.val()).map(x=>x.name));saveLocal('fks_construction_workers',workersData);renderAll()});R('clients').on('value',s=>{clientsData=unique(['未登録'].concat(asArray(s.val()).map(x=>x.name)));saveLocal('fks_construction_clients',clientsData);renderAll()})}
function renderSelects(){rCompany.innerHTML=companiesData.map(x=>`<option>${esc(x)}</option>`).join('');rReporter.innerHTML='<option value="">日報入力者を選択</option>'+workersData.map(x=>`<option>${esc(x)}</option>`).join('');rWorker.innerHTML='<option value="">作業員を選択</option>'+workersData.map(x=>`<option>${esc(x)}</option>`).join('');const old=rClient.value;rClient.innerHTML='<option value="">取引先名を選択</option>'+clientsData.map(x=>`<option>${esc(x)}</option>`).join('');if(old)rClient.value=old}
function showTab(t){cal.style.display=t=='cal'?'block':'none';rep.style.display=t=='rep'?'block':'none';bCal.className=t=='cal'?'tab active':'tab';bRep.className=t=='rep'?'tab active':'tab';renderAll()}function moveMonth(n){current.setMonth(current.getMonth()+n);renderCalendar()}
function saveLocalReportBackup(r){try{const k='fks_construction_report_backups';const a=readLocal(k);a.push(r);localStorage.setItem(k,JSON.stringify(a.slice(-500)))}catch(e){}}function sig(r){return [r.date,r.site,r.reporter,r.start,r.end,r.work].join('|')}function queueReport(r){const a=readLocal('fks_construction_offline_queue');a.push({kind:'report',data:r});localStorage.setItem('fks_construction_offline_queue',JSON.stringify(a.slice(-500)))}function syncOfflineQueue(){const a=readLocal('fks_construction_offline_queue');if(!a.length)return;const rest=[];Promise.all(a.map(x=>x.kind==='report'?R('reports').push(x.data).catch(()=>rest.push(x)):Promise.resolve())).then(()=>localStorage.setItem('fks_construction_offline_queue',JSON.stringify(rest)))}
function addReport(){if(!rDate.value||!rSite.value||!rReporter.value||!rPeople.value||!rStart.value||!rEnd.value||!rWork.value)return alert('必須項目を入力してください');const r={date:rDate.value,site:rSite.value,company:rCompany.value,reporter:rReporter.value,client:rClient.value||'未登録',mark:clientMark(rClient.value||'未登録'),clientPerson:rClientPerson.value,worker:rWorker.value,people:rPeople.value,start:rStart.value,end:rEnd.value,breakMin:rBreak.value,weather:rWeather.value,work:rWork.value,memo:rMemo.value,approved:false,createdAt:new Date().toISOString(),created:new Date().toLocaleString()};saveLocalReportBackup(r);R('reports').push(r).then(()=>{rSite.value=rPeople.value=rStart.value=rEnd.value=rBreak.value=rWork.value=rMemo.value=rClientPerson.value='';rReporter.value='';rClient.value='';rWorker.value='';alert('日報を保存しました')}).catch(e=>{queueReport(r);alert('通信エラーのため端末に保存しました。復旧ボタンで戻せます。')})}
function delReport(id){if(confirm('日報を削除しますか？'))R('reports/'+id).remove().catch(e=>alert('削除エラー: '+e.message))}function approve(id){R('reports/'+id).update({approved:true,approvedAt:new Date().toISOString()})}
function rescueLocalReports(){const locals=readLocal('fks_construction_report_backups');if(!locals.length)return alert('端末内に復旧できる日報がありません');const ex=new Set(reportsData.map(sig));const targets=locals.filter(r=>!ex.has(sig(r)));if(!targets.length)return alert('この端末の日報はすでにFirebaseにあります');if(!confirm(targets.length+'件を復旧しますか？'))return;const updates={};targets.forEach(r=>updates[R('reports').push().key]=r);R('reports').update(updates).then(()=>alert('復旧しました'))}
function showDay(ds){const js=jobsData.filter(x=>x.date==ds),rs=reportsData.filter(x=>x.date==ds);dayList.innerHTML=(js.length||rs.length)?js.map(j=>`<div class="card"><b>予定：<span class="dot">${clientMark(j.client)}</span> ${esc(j.site)}</b><br><span class="small">${esc(j.start||'-')} / 取引先名は非表示</span><br>作業員：${esc(j.workers||'-')}<br>内容：${esc(j.work||'-')}</div>`).join('')+rs.map(r=>`<div class="card"><b>日報：<span class="dot">${clientMark(r.client)}</span> ${esc(r.site)}</b><br><span class="small">${r.approved?'承認済み':'未承認'} / 入力者：${esc(r.reporter||'-')}</span><br>作業員：${esc(r.worker||'-')}　人数：${esc(r.people||0)}<br>現場入場：${esc(r.start)} 現場退場：${esc(r.end)}<br>内容：${esc(r.work)}<br><button onclick="approve('${r.id}')">承認</button><button class="red" onclick="delReport('${r.id}')">🗑️ 日報削除</button></div>`).join(''):'予定・日報なし'}
function renderCalendar(){let y=current.getFullYear(),m=current.getMonth();monthTitle.textContent=y+'年 '+(m+1)+'月';calHead.innerHTML=['日','月','火','水','木','金','土'].map(x=>`<div class="head">${x}</div>`).join('');let first=new Date(y,m,1),last=new Date(y,m+1,0),html='';for(let i=0;i<first.getDay();i++)html+='<div></div>';for(let d=1;d<=last.getDate();d++){let ds=fmt(new Date(y,m,d));let js=jobsData.filter(x=>x.date==ds),rs=reportsData.filter(x=>x.date==ds);let dots=js.slice(0,8).map(j=>`<span class="dot">${clientMark(j.client)}</span>`).join('')+rs.slice(0,8).map(r=>`<span class="dot">${clientMark(r.client)}</span>`).join('');html+=`<div class="day" onclick="showDay('${ds}')"><b>${d}</b><div class="dotrow">${dots}</div></div>`}calendar.innerHTML=html}
function renderReports(){let a=reportsData.slice().reverse();reportList.innerHTML=a.length?a.map(r=>`<div class="card"><b>${esc(r.date)} <span class="dot">${clientMark(r.client)}</span> ${esc(r.site)}</b><br><span class="small">${r.approved?'✅ 承認済み':'🟡 未承認'} / 入力者：${esc(r.reporter||'-')}</span><br>取引先：<span class="dot">${clientMark(r.client)}</span>（名称非表示） 担当者：${esc(r.clientPerson||'-')}<br>作業員：${esc(r.worker||'-')} 人数：${esc(r.people||0)}<br>現場入場：${esc(r.start)} 現場退場：${esc(r.end)} 休憩：${esc(r.breakMin||0)}分<br>作業内容：${esc(r.work)}<br><button onclick="approve('${r.id}')">承認</button><button class="red" onclick="delReport('${r.id}')">🗑️ 日報削除</button></div>`).join(''):'日報なし'}
function renderAll(){renderSelects();renderCalendar();renderReports()}let today=fmt(new Date());rDate.value=today;renderAll();startFirebase();
</script></body></html>
