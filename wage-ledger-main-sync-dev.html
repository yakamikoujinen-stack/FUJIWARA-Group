<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>賃金台帳｜KING APP</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#eef6ff;color:#102043}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:12px 16px;background:#fff;border-bottom:1px solid #dfe7ef;box-shadow:0 4px 14px rgba(20,40,70,.1)}
.back{border:0;border-radius:12px;background:#17324d;color:#fff;padding:12px 16px;font-size:15px;font-weight:950;text-decoration:none}
.title{font-size:22px;font-weight:950}
.wrap{max-width:1180px;margin:auto;padding:16px 16px 60px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.summary>div,.section{background:#fff;border:1px solid #dfe6ef;border-radius:16px;padding:14px}
.summary small{display:block;color:#64748b;font-weight:850}
.summary b{display:block;margin-top:5px;font-size:25px}
.section{margin-bottom:14px}.section h2{margin:0 0 6px;color:#0b5cab;font-size:19px}.note{margin:0 0 12px;color:#64748b;font-size:12px;font-weight:750}
.events{display:grid;gap:9px}.event{border:1px solid #dbe3ec;border-radius:14px;overflow:hidden}
.toggle{width:100%;border:0;background:#fff;padding:14px;display:grid;grid-template-columns:100px minmax(0,1fr) auto auto;gap:10px;align-items:center;text-align:left;font:inherit;color:#102043}
.date{color:#0b5cab;font-weight:950}.name{font-weight:950;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.total{font-weight:950;color:#8a6400}.arrow{transition:.2s}.event.open .arrow{transform:rotate(180deg)}
.detail{display:none;border-top:1px solid #e8edf3;background:#fbfdff;padding:10px 12px}.event.open .detail{display:block}.place{font-size:12px;color:#64748b;font-weight:800;margin-bottom:7px}
.staff{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 4px;border-bottom:1px solid #edf1f5}.staff:last-child{border-bottom:0}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:420px}th,td{padding:10px 8px;border-bottom:1px solid #edf1f5;text-align:left}th{background:#f5f8fc;color:#475569}.num{text-align:right}.empty{text-align:center;padding:20px;color:#64748b;font-weight:800}
@media(max-width:650px){.summary{grid-template-columns:repeat(2,1fr);gap:8px}.summary b{font-size:21px}.toggle{grid-template-columns:84px minmax(0,1fr) auto}.total{grid-column:2}.arrow{grid-column:3;grid-row:1 / span 2}.wrap{padding:12px 10px 40px}.title{font-size:18px}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<header class="top">
<a class="back" href="king-wage-ledger-link-dev.html">← KINGへ戻る</a>
<div class="title">💴 賃金台帳 <small id="syncLabel" style="font-size:11px;color:#64748b">メイン連動</small></div>
</header>
<main class="wrap" id="app"><div class="empty">読み込み中…</div></main>
<script>
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function amount(p){for(const v of [p.amount,p.pay,p.laborCost,p.cost,p.total,p.rate]){const n=Number(String(v??'').replace(/,/g,''));if(Number.isFinite(n))return n}return 0}
function staffName(p){return p.staffName||p.staff||p.name||p.workerName||'スタッフ未設定'}
function normDate(v){if(!v)return'';const s=String(v).trim(),m=s.match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;const d=new Date(s);return Number.isNaN(d.getTime())?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function showDate(v){const n=normDate(v);if(!n)return'日付未設定';const p=n.split('-');return `${p[0]}/${Number(p[1])}/${Number(p[2])}`}
function scanLocalMainState(){
  const candidates=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    try{
      const parsed=JSON.parse(localStorage.getItem(key));
      if(parsed&&Array.isArray(parsed.events))candidates.push(parsed.events);
      else if(parsed&&parsed.state&&Array.isArray(parsed.state.events))candidates.push(parsed.state.events);
    }catch(e){}
  }
  candidates.sort((a,b)=>scoreEvents(b)-scoreEvents(a));
  return candidates[0]||[];
}
function scoreEvents(events){
  let score=0;
  (events||[]).forEach(ev=>{
    if(ev&&ev.sales&&ev.sales.days)score+=20;
    if(ev&&ev.sales&&ev.sales.simple&&ev.sales.simple.settlement)score+=5;
  });
  return score+(events||[]).length;
}
function paymentsForDay(ev,ds){
  const sales=ev&&ev.sales||{};
  const days=sales.days&&typeof sales.days==='object'?sales.days:{};
  const rec=days[ds]||{};
  const simple=rec.simple||rec||{};
  const settlement=simple.settlement||{};
  if(Array.isArray(settlement.staffPayments))return settlement.staffPayments;
  return [];
}
function extractMainLaborEvents(events){
  const out=[];
  (events||[]).forEach(ev=>{
    const sales=ev&&ev.sales||{};
    const days=sales.days&&typeof sales.days==='object'?sales.days:{};
    const dayKeys=Object.keys(days).sort();

    if(dayKeys.length){
      dayKeys.forEach(ds=>{
        out.push({
          id:String(ev.id||'')+'_'+ds,
          name:ev.name||'イベント',
          date:ds,
          place:ev.place||'',
          payments:paymentsForDay(ev,ds)
        });
      });
      return;
    }

    const agg=sales.simple||{};
    const aggPayments=agg.settlement&&Array.isArray(agg.settlement.staffPayments)
      ? agg.settlement.staffPayments : [];
    if(aggPayments.length){
      const byDate={};
      aggPayments.forEach(p=>{
        const ds=normDate(p.date||agg.date||ev.date||'');
        if(!byDate[ds])byDate[ds]=[];
        byDate[ds].push(p);
      });
      Object.keys(byDate).forEach(ds=>out.push({
        id:String(ev.id||'')+'_'+ds,
        name:ev.name||'イベント',
        date:ds,
        place:ev.place||'',
        payments:byDate[ds]
      }));
      return;
    }

    // 旧形式も読み込み
    if(sales.labor&&typeof sales.labor==='object'){
      const payments=Object.keys(sales.labor).map(name=>({name,amount:Number(sales.labor[name]||0)}));
      out.push({id:String(ev.id||''),name:ev.name||'イベント',date:ev.date||'',place:ev.place||'',payments});
    }
  });
  return out;
}
function loadLocalFallback(){
  const main=scanLocalMainState();
  if(main.length)return extractMainLaborEvents(main);
  for(const key of ['fg_labor_db_v1','fg_labor_db','labor_db','event_labor_db']){
    try{
      const raw=localStorage.getItem(key);
      if(!raw)continue;
      const p=JSON.parse(raw);
      if(Array.isArray(p))return p;
      if(p&&Array.isArray(p.events))return p.events;
    }catch(e){}
  }
  return [];
}
let currentEvents=[];

function render(events){
 events=Array.isArray(events)?events:currentEvents;
 const app=document.getElementById('app');
 if(!events.length){app.innerHTML='<div class="empty">労務費データがありません。メインアプリで保存後に開き直してください。</div>';return}
 const grouped={},people={},months={},unpaid=[];let total=0,count=0;
 events.forEach((ev,i)=>{const name=ev.name||ev.eventName||ev.title||`イベント ${i+1}`,date=normDate(ev.date||ev.eventDate||ev.startDate||''),place=ev.place||ev.location||ev.venue||'',month=date?date.slice(0,7):'未設定',pays=Array.isArray(ev.payments)?ev.payments:Array.isArray(ev.staffPayments)?ev.staffPayments:Array.isArray(ev.labor)?ev.labor:[],key=name+'__'+date;
 if(!grouped[key])grouped[key]={name,date,place,staff:{},total:0};
 pays.forEach(p=>{const a=amount(p),s=staffName(p);total+=a;count++;grouped[key].total+=a;grouped[key].staff[s]=(grouped[key].staff[s]||0)+a;people[s]=(people[s]||0)+a;months[month]=(months[month]||0)+a;if(p.paid===false||p.paymentStatus==='unpaid'||p.status==='未払い')unpaid.push({date,event:name,staff:s,amount:a})})});
 const list=Object.values(grouped).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||a.name.localeCompare(b.name,'ja'));
 const cards=list.map(ev=>`<div class="event"><button class="toggle"><span class="date">${showDate(ev.date)}</span><span class="name">${esc(ev.name)}</span><span class="total">${yen(ev.total)}</span><span class="arrow">▼</span></button><div class="detail">${ev.place?`<div class="place">場所：${esc(ev.place)}</div>`:''}${Object.entries(ev.staff).sort((a,b)=>b[1]-a[1]).map(r=>`<div class="staff"><span>${esc(r[0])}</span><b>${yen(r[1])}</b></div>`).join('')||'<div class="empty">スタッフ労務費の登録がありません</div>'}</div></div>`).join('');
 const peopleRows=Object.entries(people).sort((a,b)=>b[1]-a[1]).map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${yen(r[1])}</td></tr>`).join('');
 const monthRows=Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${yen(r[1])}</td></tr>`).join('');
 const unpaidRows=unpaid.length?unpaid.sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${showDate(r.date)}</td><td>${esc(r.event)}</td><td>${esc(r.staff)}</td><td class="num">${yen(r.amount)}</td></tr>`).join(''):'<tr><td colspan="4" style="text-align:center">未払いはありません</td></tr>';
 app.innerHTML=`<div class="summary"><div><small>総労務費</small><b>${yen(total)}</b></div><div><small>イベント数</small><b>${list.length}件</b></div><div><small>支払件数</small><b>${count}件</b></div><div><small>未払い</small><b>${unpaid.length}件</b></div></div><section class="section"><h2>🎪 イベント別労務費</h2><p class="note">日付の新しい順です。イベント名をタップするとスタッフ別の内容が開きます。</p><div class="events">${cards}</div></section><section class="section"><h2>👤 個人別給与台帳</h2><div class="scroll"><table><thead><tr><th>スタッフ名</th><th class="num">合計</th></tr></thead><tbody>${peopleRows}</tbody></table></div></section><section class="section"><h2>📅 月別集計</h2><div class="scroll"><table><thead><tr><th>年月</th><th class="num">合計</th></tr></thead><tbody>${monthRows}</tbody></table></div></section><section class="section"><h2>⚠️ 未払い一覧</h2><div class="scroll"><table><thead><tr><th>日付</th><th>イベント</th><th>スタッフ</th><th class="num">金額</th></tr></thead><tbody>${unpaidRows}</tbody></table></div></section>`;
 document.querySelectorAll('.toggle').forEach(btn=>btn.addEventListener('click',()=>btn.closest('.event').classList.toggle('open')));
}
function startFirebase(){
  const app=document.getElementById('app');
  const fallback=loadLocalFallback();
  if(fallback.length){
    currentEvents=fallback;
    render(currentEvents);
  }

  const config={
    apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",
    authDomain:"fujiwara-group-3a600.firebaseapp.com",
    databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",
    projectId:"fujiwara-group-3a600",
    storageBucket:"fujiwara-group-3a600.firebasestorage.app",
    messagingSenderId:"709887362301",
    appId:"1:709887362301:web:5ec6b7e2a2165066956a94"
  };

  try{
    if(!firebase.apps.length)firebase.initializeApp(config);
    firebase.database().ref('fujiwara/events').on('value',snap=>{
      const raw=snap.val();
      const mainEvents=raw?(Array.isArray(raw)?raw:Object.values(raw)).filter(Boolean):[];
      currentEvents=extractMainLaborEvents(mainEvents);
      const label=document.getElementById('syncLabel'); if(label)label.textContent='同期済み';
      render(currentEvents);
    },err=>{
      console.warn(err);
      if(!currentEvents.length){
        app.innerHTML='<div class="empty">Firebaseから読み込めませんでした。メインアプリと同じ通信環境で開き直してください。</div>';
      }
    });
  }catch(e){
    console.warn(e);
    if(!currentEvents.length){
      app.innerHTML='<div class="empty">データ接続に失敗しました。ページを更新してください。</div>';
    }
  }
}
startFirebase();
</script>
</body>
</html>
