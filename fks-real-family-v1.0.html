<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FKS Real Family v1.0</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0}
header{background:#1f3a5f;color:#fff;padding:16px;text-align:center}
main{max-width:700px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}
input,button{width:100%;padding:12px;margin:8px 0;font-size:16px}
.card{display:none;border:1px solid #ddd;padding:15px;border-radius:10px;margin-top:15px}
</style>
</head>
<body>
<header><h1>🔒 FKS Real Family v1.0</h1></header>
<main>
<p>家族専用エリア</p>
<input type="password" id="pw" placeholder="パスワード">
<button onclick="login()">ログイン</button>

<div class="card" id="home">
<h2>👨‍👩‍👧 Real Family</h2>
<p>ようこそ。</p>
<label>家族メモ</label>
<textarea id="memo" style="width:100%;height:120px"></textarea>
<button onclick="save()">保存</button>
</div>
</main>

<script>
const PASSWORD="FUJIWARA";
function login(){
 if(document.getElementById('pw').value===PASSWORD){
   document.getElementById('home').style.display='block';
   document.getElementById('memo').value=localStorage.getItem('rf_memo')||'';
   alert('ログインしました');
 }else{
   alert('パスワードが違います');
 }
}
function save(){
 localStorage.setItem('rf_memo',document.getElementById('memo').value);
 alert('保存しました');
}
</script>
</body>
</html>
