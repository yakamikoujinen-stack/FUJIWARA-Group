<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>発注先・購入先管理｜FUJIWARA Group</title>
<style>
:root{--navy:#17324d;--blue:#2f6fa7;--sky:#eaf4ff;--gold:#f4b942;--green:#2e8b57;--red:#c94545;--text:#1c2733;--muted:#66788a;--line:#dbe5ee;--white:#fff;--shadow:0 10px 28px rgba(18,46,72,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#f6fbff,#eef6fb);min-height:100vh}button,input,select,textarea{font:inherit}.app{max-width:1180px;margin:auto;padding:env(safe-area-inset-top) 14px calc(30px + env(safe-area-inset-bottom))}
header{margin:0 -14px 16px;padding:20px 18px;background:linear-gradient(135deg,var(--navy),#285f8c);color:#fff;border-radius:0 0 24px 24px;box-shadow:var(--shadow)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}h1{margin:0;font-size:clamp(23px,5vw,34px)}.sub{margin:7px 0 0;color:#dcecff}.back{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:10px 13px;font-weight:900}
.notice{background:#fff8df;border:1px solid #f0d77e;border-radius:15px;padding:12px 14px;margin-bottom:14px;font-weight:750;color:#655015;line-height:1.6}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900;min-height:46px;cursor:pointer}.primary{background:var(--navy);color:#fff}.green{background:var(--green);color:#fff}.gold{background:var(--gold);color:#2d2100}.light{background:#eaf0f5;color:#294055}.danger{background:#fee8e8;color:#a72626}.btn:disabled{opacity:.45;cursor:not-allowed}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:var(--shadow)}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:13px;font-weight:800}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow);margin-bottom:15px}.panel h2{margin:0 0 12px;font-size:21px}.formgrid{display:grid;grid-template-columns:1fr;gap:10px}.field label{display:block;font-size:13px;font-weight:900;color:#425568;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd8e3;border-radius:11px;padding:11px 12px;background:#fff;min-height:44px}.field textarea{min-height:72px;resize:vertical}
.search{display:flex;gap:8px;margin-bottom:10px}.search input{flex:1;border:1px solid #cbd8e3;border-radius:12px;padding:11px 12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:15px}table{border-collapse:collapse;width:100%;min-width:920px;background:#fff}th,td{border-bottom:1px solid #e8eef3;padding:9px 8px;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#edf5fc;color:#2c4861;font-size:13px;z-index:1}td input,td select{width:100%;min-width:100px;border:1px solid #d4dee7;border-radius:9px;padding:8px;background:#fff}.num{width:80px;min-width:80px!important}.check{width:22px;height:22px}.row-actions{display:flex;gap:6px}.iconbtn{border:0;border-radius:9px;padding:8px 10px;font-size:18px;cursor:pointer}.del{background:#fee8e8}.copy{background:#eaf4ff}.dup{background:#fff3cd!important}.empty{text-align:center;color:var(--muted);padding:28px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{border:0;border-radius:999px;padding:10px 14px;font-weight:900;background:#e9eff4;color:#41566a}.tab.active{background:var(--navy);color:#fff}
@media(min-width:760px){.summary{grid-template-columns:repeat(4,1fr)}.formgrid{grid-template-columns:repeat(4,1fr)}.span2{grid-column:span 2}}
</style>
</head>
<body><div class="app">
<header><div class="top"><div><h1>発注先・購入先管理</h1><p class="sub">会社別・店舗別に在庫品目を仕分け</p></div><button class="back" onclick="goBack()">← 戻る</button></div></header>
<div class="notice">同じ端末・同じ公開URL内で使うと、メインアプリ側の保存データ候補から品目名を読み込めます。読み込めない品目は「＋項目追加」で登録できます。</div>
<div class="summary"><div class="stat"><b id="itemCount">0</b><span>登録品目</span></div><div class="stat"><b id="supplierCount">0</b><span>発注先・購入先</span></div><div class="stat"><b id="unassignedCount">0</b><span>未仕分け</span></div><div class="stat"><b id="duplicateCount">0</b><span>重複候補</span></div></div>
<section class="panel">
<h2>発注先・購入先マスター</h2>
<div class="formgrid"><div class="field"><label>区分</label><select id="vendorType"><option>発注先</option><option>購入先</option><option>両方</option></select></div><div class="field"><label>会社名・店舗名</label><input id="vendorName" placeholder="例：〇〇食品、業務スーパー"></div><div class="field"><label>電話番号</label><input id="vendorPhone" inputmode="tel"></div><div class="field"><label>担当者・メモ</label><input id="vendorMemo"></div></div>
<div class="toolbar" style="margin-top:11px"><button class="btn green" onclick="addVendor()">＋ 発注先・購入先を追加</button></div>
<div id="vendorList"></div>
</section>
<section class="panel">
<div class="tabs"><button class="tab active" id="tabItems" onclick="setTab('items')">在庫品目表</button><button class="tab" id="tabDup" onclick="setTab('dup')">重複整理</button></div>
<div class="toolbar"><button class="btn primary" onclick="addItem()">＋ 項目追加</button><button class="btn gold" onclick="importInventory()">📥 在庫データ読込</button><button class="btn light" onclick="saveAll(true)">💾 保存</button><button class="btn danger" onclick="deleteChecked()">🗑 選択項目を削除</button></div>
<div class="search"><input id="searchInput" placeholder="品目名・カテゴリー・発注先で検索" oninput="renderItems()"><button class="btn light" onclick="clearSearch()">クリア</button></div>
<div class="tablewrap"><table><thead><tr><th>選択</th><th>カテゴリー</th><th>品目名</th><th>規格・単位</th><th>在庫数</th><th>発注点</th><th>発注先・購入先</th><th>区分</th><th>備考</th><th>操作</th></tr></thead><tbody id="itemBody"></tbody></table></div>
</section>
</div>
<script>
const STORE='fujiwara_order_supplier_v1';
const state={vendors:[],items:[],tab:'items'};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function norm(s=''){return String(s).trim().replace(/[\s　]+/g,'').toLowerCase()}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&Array.isArray(x.items)){state.items=x.items;state.vendors=Array.isArray(x.vendors)?x.vendors:[]}}catch(e){};renderAll()}
function saveAll(show=false){localStorage.setItem(STORE,JSON.stringify({vendors:state.vendors,items:state.items,updatedAt:new Date().toISOString()}));if(show)alert('保存しました')}
function addVendor(){const name=document.getElementById('vendorName').value.trim();if(!name)return alert('会社名・店舗名を入力してください');if(state.vendors.some(v=>norm(v.name)===norm(name)))return alert('同じ名前が登録されています');state.vendors.push({id:uid(),type:document.getElementById('vendorType').value,name,phone:document.getElementById('vendorPhone').value.trim(),memo:document.getElementById('vendorMemo').value.trim()});['vendorName','vendorPhone','vendorMemo'].forEach(id=>document.getElementById(id).value='');saveAll();renderAll()}
function deleteVendor(id){const v=state.vendors.find(x=>x.id===id);if(!v||!confirm(`${v.name}を削除しますか？\n品目の仕分けは「未設定」に戻ります。`))return;state.vendors=state.vendors.filter(x=>x.id!==id);state.items.forEach(x=>{if(x.vendorId===id)x.vendorId=''});saveAll();renderAll()}
function renderVendors(){const el=document.getElementById('vendorList');if(!state.vendors.length){el.innerHTML='<div class="empty">まだ登録されていません</div>';return}el.innerHTML='<div class="tablewrap"><table style="min-width:650px"><thead><tr><th>区分</th><th>会社名・店舗名</th><th>電話</th><th>担当者・メモ</th><th>操作</th></tr></thead><tbody>'+state.vendors.map(v=>`<tr><td>${esc(v.type)}</td><td><b>${esc(v.name)}</b></td><td>${esc(v.phone)}</td><td>${esc(v.memo)}</td><td><button class="iconbtn del" onclick="deleteVendor('${v.id}')">🗑</button></td></tr>`).join('')+'</tbody></table></div>'}
function addItem(seed={}){state.items.unshift({id:uid(),category:seed.category||'',name:seed.name||'',spec:seed.spec||'',stock:seed.stock??'',reorder:seed.reorder??'',vendorId:seed.vendorId||'',route:seed.route||'発注',memo:seed.memo||'',checked:false});saveAll();renderItems();setTimeout(()=>document.querySelector('#itemBody tr input[data-field="name"]')?.focus(),50)}
function updateItem(id,field,value){const x=state.items.find(i=>i.id===id);if(!x)return;x[field]=(field==='checked')?!!value:value;saveAll();renderStats();if(field==='name'||field==='category')renderItems()}
function deleteItem(id){const x=state.items.find(i=>i.id===id);if(x&&confirm(`「${x.name||'名称未入力'}」を削除しますか？`)){state.items=state.items.filter(i=>i.id!==id);saveAll();renderItems()}}
function copyItem(id){const x=state.items.find(i=>i.id===id);if(!x)return;addItem({...x,name:x.name+' コピー',stock:''})}
function duplicates(){const map={};state.items.forEach(i=>{const k=norm(i.name);if(k)(map[k]??=[]).push(i)});return Object.values(map).filter(a=>a.length>1).flat()}
function renderItems(){const q=norm(document.getElementById('searchInput')?.value||'');const dupIds=new Set(duplicates().map(x=>x.id));let arr=state.items.filter(x=>!q||norm([x.category,x.name,x.spec,state.vendors.find(v=>v.id===x.vendorId)?.name,x.memo].join(' ')).includes(q));if(state.tab==='dup')arr=arr.filter(x=>dupIds.has(x.id));const opts='<option value="">未設定</option>'+state.vendors.map(v=>`<option value="${v.id}">${esc(v.name)}（${esc(v.type)}）</option>`).join('');const body=document.getElementById('itemBody');if(!arr.length){body.innerHTML='<tr><td colspan="10" class="empty">表示する項目がありません</td></tr>';renderStats();return}body.innerHTML=arr.map(x=>`<tr class="${dupIds.has(x.id)?'dup':''}"><td><input class="check" type="checkbox" ${x.checked?'checked':''} onchange="updateItem('${x.id}','checked',this.checked)"></td><td><input value="${esc(x.category)}" onchange="updateItem('${x.id}','category',this.value)"></td><td><input data-field="name" value="${esc(x.name)}" placeholder="品目名" onchange="updateItem('${x.id}','name',this.value)"></td><td><input value="${esc(x.spec)}" placeholder="kg・本・箱" onchange="updateItem('${x.id}','spec',this.value)"></td><td><input class="num" inputmode="decimal" value="${esc(x.stock)}" onchange="updateItem('${x.id}','stock',this.value)"></td><td><input class="num" inputmode="decimal" value="${esc(x.reorder)}" onchange="updateItem('${x.id}','reorder',this.value)"></td><td><select onchange="updateItem('${x.id}','vendorId',this.value)">${opts.replace(`value="${x.vendorId}"`,`value="${x.vendorId}" selected`)}</select></td><td><select onchange="updateItem('${x.id}','route',this.value)"><option ${x.route==='発注'?'selected':''}>発注</option><option ${x.route==='店頭購入'?'selected':''}>店頭購入</option><option ${x.route==='どちらでも'?'selected':''}>どちらでも</option></select></td><td><input value="${esc(x.memo)}" onchange="updateItem('${x.id}','memo',this.value)"></td><td><div class="row-actions"><button class="iconbtn copy" title="複製" onclick="copyItem('${x.id}')">＋</button><button class="iconbtn del" title="削除" onclick="deleteItem('${x.id}')">🗑</button></div></td></tr>`).join('');renderStats()}
function deleteChecked(){const n=state.items.filter(x=>x.checked).length;if(!n)return alert('削除する項目にチェックを入れてください');if(confirm(`${n}件を削除しますか？`)){state.items=state.items.filter(x=>!x.checked);saveAll();renderItems()}}
function setTab(t){state.tab=t;document.getElementById('tabItems').classList.toggle('active',t==='items');document.getElementById('tabDup').classList.toggle('active',t==='dup');renderItems()}
function clearSearch(){document.getElementById('searchInput').value='';renderItems()}
function extractItems(obj,out,depth=0){if(depth>5||obj==null)return;if(Array.isArray(obj)){obj.forEach(x=>extractItems(x,out,depth+1));return}if(typeof obj!=='object')return;const name=obj.name||obj.itemName||obj.productName||obj.label||obj.title||obj.netaName||obj.ingredientName;const category=obj.category||obj.group||obj.type||obj.neta||'';if(typeof name==='string'&&name.trim()&&name.length<80){out.push({name:name.trim(),category:typeof category==='string'?category:'',stock:obj.stock??obj.quantity??obj.inventory??'',spec:obj.unit||obj.spec||''})}Object.values(obj).forEach(v=>extractItems(v,out,depth+1))}
function importInventory(){const candidates=['fujiwara_inventory','fujiwara_inventory_v1','inventoryData','inventory_data','stockData','fujiwara_main_data','fujiwara_events_v1','fujiwara_neta_master','fujiwara_product_master'];let found=[];candidates.forEach(k=>{try{const raw=localStorage.getItem(k);if(raw)extractItems(JSON.parse(raw),found)}catch(e){}});for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(/inventory|stock|product|neta|item|zaiko/i.test(k)&&!candidates.includes(k)){try{extractItems(JSON.parse(localStorage.getItem(k)),found)}catch(e){}}}const existing=new Set(state.items.map(x=>norm(x.name)));const unique=[];found.forEach(x=>{const n=norm(x.name);if(n&&!existing.has(n)&&!unique.some(y=>norm(y.name)===n))unique.push(x)});if(!unique.length)return alert('読み込める在庫品目が見つかりませんでした。\n「＋項目追加」から登録してください。');unique.forEach(x=>state.items.push({id:uid(),category:x.category||'',name:x.name,spec:x.spec||'',stock:x.stock??'',reorder:'',vendorId:'',route:'発注',memo:'在庫管理から読込',checked:false}));saveAll();renderAll();alert(`${unique.length}件の品目を読み込みました`)}
function renderStats(){const dups=new Set(duplicates().map(x=>x.id));document.getElementById('itemCount').textContent=state.items.length;document.getElementById('supplierCount').textContent=state.vendors.length;document.getElementById('unassignedCount').textContent=state.items.filter(x=>!x.vendorId).length;document.getElementById('duplicateCount').textContent=dups.size}
function renderAll(){renderVendors();renderItems();renderStats()}
function goBack(){if(history.length>1)history.back();else location.href='manager-app.html'}
load();
</script></body></html>
