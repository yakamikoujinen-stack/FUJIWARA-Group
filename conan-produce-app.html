<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="コナン管理">
<meta name="theme-color" content="#17324d">
<title>コナンプロデュース管理アプリ</title>
<style>
:root{--navy:#17324d;--blue:#1677e8;--gold:#d9a928;--bg:#f4f6f8;--line:#d8dde5;--text:#172033;--sub:#667085;--private:#fff8e8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1500px;margin:auto;padding:14px 12px 90px}.hero{background:linear-gradient(135deg,#17324d,#2c6495);color:#fff;border-radius:22px;padding:18px}
.hero h1{margin:0;font-size:clamp(25px,4vw,40px)}.hero p{margin:7px 0 0;color:#dbeafe;font-weight:800}
.panel{margin-top:15px;background:#fff;border:1px solid #e7ebf0;border-radius:18px;padding:14px;box-shadow:0 7px 20px rgba(20,40,70,.06)}
.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.head h2{margin:0;color:#173b61}
.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:10px 13px;font-weight:900;background:#e7edf5;color:#1f2937}
button.primary{background:var(--blue);color:#fff}button.danger{background:#feecec;color:#b42318}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sheet{border:1px solid #e2e7ed;border-radius:16px;padding:14px;background:#fff}
.sheet h3{margin:0 0 6px;font-size:18px}.meta{font-size:12px;color:var(--sub)}.sheet .actions{margin-top:10px}
#editor{display:none}#editor.show{display:block}#sheetTitle{width:100%;font-size:24px;font-weight:950;border:1px solid #cfd7e2;border-radius:12px;padding:10px 12px}
.note{font-size:12px;color:var(--sub);margin:8px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;min-width:1200px;border-collapse:collapse}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;background:#fff}
th{background:#edf2f7;padding:11px 8px;text-align:center;position:sticky;top:0}td input,td textarea{width:100%;border:0;outline:0;padding:10px;font:inherit;background:transparent}
td textarea{min-height:46px;resize:vertical}.chk{width:65px;text-align:center}.chk input{width:28px;height:28px}
.private{background:var(--private)!important}.pb{font-size:10px;background:#f59e0b;color:#fff;border-radius:999px;padding:2px 5px;margin-left:4px}
.sun{color:#d32f2f!important;font-weight:900}.sat{color:#1565c0!important;font-weight:900}.money{text-align:right;font-weight:900}
.conflict-badge{display:inline-block;margin:0 8px 7px;padding:4px 7px;border-radius:999px;background:#fff0f0;color:#c62828;font-size:11px;font-weight:950;border:1px solid #ffc7c7;white-space:nowrap}
.custom-head{min-width:150px}.custom-head-wrap{display:flex;align-items:center;justify-content:center;gap:5px}
.custom-head-wrap button{padding:3px 7px;font-size:11px;border-radius:7px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bottom button{background:transparent}.bottom b{display:block;font-size:22px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}}
@media print{
  .hero,#top,#handover,#list,.editor-actions,.bottom,.private,.delcol,.note,.conflict-badge,.custom-head-wrap button{display:none!important}
  .wrap{padding:0}.panel{border:0;box-shadow:none;padding:0;margin:0}#editor{display:block!important}
  #sheetTitle{border:0;padding:0 0 12px;font-size:20pt}.tablewrap{overflow:visible;border:0}
  table{min-width:0;font-size:10pt}th{position:static}
}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>📋 コナンプロデュース管理</h1><p>一覧表を何枚でも作成・保存・印刷できます</p></section>

<section class="panel" id="top">
  <div class="head"><h2>新しい一覧表</h2><button class="primary" onclick="createSheet()">＋ 新しい表を作る</button></div>
  <div class="note">タイトルは自由に変更できます。例：2026年度 秋イベント予定、2027年度 出店予定。</div>
</section>

<section class="panel" id="handover">
  <div class="head">
    <h2>旧表から引き継ぐ</h2>
    <div class="actions">
      <label style="display:inline-block">
        <input id="handoverFile" type="file" accept=".json,application/json" style="display:none" onchange="importHandoverFile(this.files[0])">
        <span style="display:inline-block;background:#fff3c4;color:#6a4b00;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer">📦 引継ぎデータを選ぶ</span>
      </label>
    </div>
  </div>
  <div class="note">旧表の引継ぎJSONを選ぶと、旧表を消さずコピーとして追加します。</div>
</section>

<section class="panel" id="list">
  <div class="head"><h2>保存済み一覧表</h2></div>
  <div id="sheetGrid" class="grid"></div>
</section>

<section class="panel" id="editor">
  <input id="sheetTitle" oninput="saveTitle(this.value)">
  <div class="actions editor-actions" style="margin:10px 0">
    <button class="primary" onclick="addRow()">＋ 行を追加</button>
    <button class="primary" onclick="addColumn()">＋ 列を追加</button>
    <button onclick="sortRows()">↕ 日付順</button>
    <button onclick="window.print()">🖨 外部向け印刷 / PDF</button>
    <button onclick="exportCSV()">⬇ 内部保存CSV</button>
    <button onclick="duplicateCurrent()">複製</button>
    <button class="danger" onclick="deleteCurrent()">この表を削除</button>
  </div>
  <div class="note">同じ日付に複数イベントがある場合は「⚠ 同日○件」を画面だけに表示します。外部向け印刷/PDFには表示されません。「去年のアイテム」「去年売上」も外部印刷では非表示です。</div>
  <div class="tablewrap">
    <table>
      <thead><tr id="tableHead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>
</div>

<nav class="bottom">
<button onclick="showHome()"><b>📚</b>一覧</button>
<button onclick="createSheet()"><b>＋</b>新規</button>
<button onclick="currentId&&openSheet(currentId)"><b>📋</b>開いている表</button>
</nav>

<script>
const APP_KEY='fujiwara_conan_produce_app_v1';
const OLD_KEY='fujiwara_event_schedule_2026_v1';
const OLD_TITLE='fujiwara_event_schedule_2026_title';
let currentId=null;

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dc(v){v=String(v||'');if(/[（(]土[）)]/.test(v))return'sat';if(/[（(]日[）)]/.test(v)||/祝/.test(v))return'sun';return''}
function uid(){return 's_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}
function now(){return new Date().toLocaleString('ja-JP')}
function getApp(){
  try{
    const d=JSON.parse(localStorage.getItem(APP_KEY)||'null');
    if(d&&Array.isArray(d.sheets)){
      d.sheets.forEach(s=>{
        if(!Array.isArray(s.columns))s.columns=[];
        (s.rows||[]).forEach(r=>{if(!r.custom||typeof r.custom!=='object')r.custom={}})
      });
      return d
    }
  }catch(e){}
  return{sheets:[]}
}
function saveApp(a){localStorage.setItem(APP_KEY,JSON.stringify(a))}

function importHandoverFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d || d.type!=='fujiwara_conan_handover_v1' || !Array.isArray(d.rows)){
        alert('引継ぎデータとして認識できませんでした。');return;
      }
      const app=getApp(),id=uid();
      const rows=d.rows.map(r=>({ok:!!r.ok,date:r.date||'',event:r.event||'',place:r.place||'',item:r.item||'',lastItem:r.lastItem||'',lastSales:r.lastSales||'',custom:{}}));
      app.sheets.push({id,title:(d.title||'2026年度 イベント予定')+'（引継ぎ）',updated:now(),columns:[],rows});
      saveApp(app);renderList();openSheet(id);alert('旧表をコピーして引き継ぎました。旧表はそのまま残っています。');
    }catch(e){alert('引継ぎファイルを読み込めませんでした。')}
    finally{const input=document.getElementById('handoverFile');if(input)input.value=''}
  };
  reader.readAsText(file,'utf-8');
}

function migrate(){
  const a=getApp();if(a.sheets.length)return;
  let raw=null;try{raw=JSON.parse(localStorage.getItem(OLD_KEY)||'null')}catch(e){}
  if(!Array.isArray(raw)||!raw.length)return;
  const rows=raw.map(r=>{const x=[...(r||[])];
    if(x.length>=7&&typeof x[0]==='boolean')return{ok:!!x[0],date:x[1]||'',event:x[2]||'',place:x[3]||'',item:x[4]||'',lastItem:x[5]||'',lastSales:x[6]||'',custom:{}};
    if(x.length===5&&typeof x[0]==='boolean')return{ok:!!x[0],date:x[1]||'',event:x[2]||'',place:x[3]||'',item:x[4]||'',lastItem:'',lastSales:'',custom:{}};
    return{ok:false,date:x[0]||'',event:x[1]||'',place:x[2]||'',item:x[3]||'',lastItem:'',lastSales:'',custom:{}}
  });
  a.sheets.push({id:uid(),title:localStorage.getItem(OLD_TITLE)||'2026年度 イベント予定',updated:now(),columns:[],rows});saveApp(a)
}
function renderList(){const a=getApp(),g=document.getElementById('sheetGrid');g.innerHTML=a.sheets.length?a.sheets.slice().reverse().map(s=>`<div class="sheet"><h3>${esc(s.title||'無題')}</h3><div class="meta">${(s.rows||[]).length}件<br>更新：${esc(s.updated||'')}</div><div class="actions"><button class="primary" onclick="openSheet('${s.id}')">開く</button><button onclick="duplicateSheet('${s.id}')">複製</button><button class="danger" onclick="deleteSheet('${s.id}')">削除</button></div></div>`).join(''):'<div class="note">まだ一覧表がありません。</div>'}
function createSheet(){const t=prompt('表のタイトルを入力してください','新しいイベント予定表');if(t===null)return;const a=getApp(),id=uid();a.sheets.push({id,title:t.trim()||'新しいイベント予定表',updated:now(),columns:[],rows:[]});saveApp(a);openSheet(id)}
function current(){const a=getApp();return{a,s:a.sheets.find(x=>x.id===currentId)}}
function openSheet(id){currentId=id;const {s}=current();if(!s)return;document.getElementById('sheetTitle').value=s.title||'';document.getElementById('editor').classList.add('show');renderRows();renderList();setTimeout(()=>document.getElementById('editor').scrollIntoView({behavior:'smooth'}),50)}
function showHome(){currentId=null;document.getElementById('editor').classList.remove('show');renderList();window.scrollTo({top:0,behavior:'smooth'})}
function saveTitle(v){const {a,s}=current();if(!s)return;s.title=v;s.updated=now();saveApp(a);renderList()}

function dateKey(v){
  const m=String(v||'').trim().match(/(\d{1,2})\/(\d{1,2})/);
  return m?(Number(m[1])+'/'+Number(m[2])):'';
}
function conflictCounts(rows){
  const c={};
  (rows||[]).forEach(r=>{const k=dateKey(r.date);if(k)c[k]=(c[k]||0)+1});
  return c;
}
function renderHeader(s){
  const h=document.getElementById('tableHead');
  const custom=(s.columns||[]).map((c,i)=>`<th class="custom-head"><div class="custom-head-wrap"><span>${esc(c.name||'追加列')}</span><button class="delcol" onclick="renameColumn(${i})">✏️</button><button class="danger delcol" onclick="deleteColumn(${i})">×</button></div></th>`).join('');
  h.innerHTML='<th>✅</th><th>日付</th><th>イベント名</th><th>場所</th><th>出店アイテム</th>'+custom+
    '<th class="private">去年のアイテム<span class="pb">内部用</span></th><th class="private">去年売上<span class="pb">内部用</span></th><th class="delcol">削除</th>';
}
function renderRows(){
  const {s}=current(),tb=document.getElementById('tbody');if(!s){tb.innerHTML='';return}
  renderHeader(s);
  const counts=conflictCounts(s.rows||[]);
  tb.innerHTML=(s.rows||[]).map((r,i)=>{
    if(!r.custom||typeof r.custom!=='object')r.custom={};
    const key=dateKey(r.date),n=key?(counts[key]||0):0;
    const badge=n>1?`<span class="conflict-badge">⚠ 同日${n}件</span>`:'';
    const custom=(s.columns||[]).map(c=>`<td><textarea oninput="editCustom(${i},'${c.id}',this.value)">${esc(r.custom[c.id]||'')}</textarea></td>`).join('');
    return `<tr>
      <td class="chk"><input type="checkbox" ${r.ok?'checked':''} onchange="edit(${i},'ok',this.checked)"></td>
      <td><input class="${dc(r.date)}" value="${esc(r.date||'')}" oninput="this.className=dc(this.value);edit(${i},'date',this.value);renderRows()">${badge}</td>
      <td><textarea oninput="edit(${i},'event',this.value)">${esc(r.event||'')}</textarea></td>
      <td><textarea oninput="edit(${i},'place',this.value)">${esc(r.place||'')}</textarea></td>
      <td><textarea oninput="edit(${i},'item',this.value)">${esc(r.item||'')}</textarea></td>
      ${custom}
      <td class="private"><textarea oninput="edit(${i},'lastItem',this.value)">${esc(r.lastItem||'')}</textarea></td>
      <td class="private"><input class="money" inputmode="numeric" value="${esc(r.lastSales||'')}" oninput="this.value=this.value.replace(/[^0-9]/g,'');edit(${i},'lastSales',this.value)"></td>
      <td class="delcol"><button class="danger" onclick="deleteRow(${i})">削除</button></td>
    </tr>`
  }).join('')
}
function edit(i,k,v){const {a,s}=current();if(!s||!s.rows[i])return;s.rows[i][k]=v;s.updated=now();saveApp(a)}
function editCustom(i,id,v){const {a,s}=current();if(!s||!s.rows[i])return;if(!s.rows[i].custom)s.rows[i].custom={};s.rows[i].custom[id]=v;s.updated=now();saveApp(a)}
function addRow(){const {a,s}=current();if(!s)return;s.rows.push({ok:false,date:'',event:'',place:'',item:'',lastItem:'',lastSales:'',custom:{}});s.updated=now();saveApp(a);renderRows()}

function addColumn(){
  const name=prompt('追加する列の名前を入力してください','備考');
  if(name===null)return;
  const clean=name.trim();if(!clean){alert('列名を入力してください。');return}
  const {a,s}=current();if(!s)return;
  const id='c_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
  if(!Array.isArray(s.columns))s.columns=[];
  s.columns.push({id,name:clean});
  (s.rows||[]).forEach(r=>{if(!r.custom)r.custom={};r.custom[id]=''});
  s.updated=now();saveApp(a);renderRows()
}
function renameColumn(i){
  const {a,s}=current();if(!s||!s.columns[i])return;
  const name=prompt('列名を変更してください',s.columns[i].name||'');
  if(name===null)return;
  const clean=name.trim();if(!clean)return;
  s.columns[i].name=clean;s.updated=now();saveApp(a);renderRows()
}
function deleteColumn(i){
  const {a,s}=current();if(!s||!s.columns[i])return;
  const col=s.columns[i];
  if(!confirm('「'+col.name+'」列を削除しますか？\nこの列に入力した内容も削除されます。'))return;
  s.columns.splice(i,1);
  (s.rows||[]).forEach(r=>{if(r.custom)delete r.custom[col.id]});
  s.updated=now();saveApp(a);renderRows()
}

function deleteRow(i){if(!confirm('この行を削除しますか？'))return;const {a,s}=current();s.rows.splice(i,1);s.updated=now();saveApp(a);renderRows()}
function pd(s){const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})/);return m?+m[1]*100 + +m[2]:99999}
function sortRows(){const {a,s}=current();if(!s)return;s.rows.sort((x,y)=>pd(x.date)-pd(y.date));s.updated=now();saveApp(a);renderRows()}
function duplicateSheet(id){const a=getApp(),s=a.sheets.find(x=>x.id===id);if(!s)return;const c=JSON.parse(JSON.stringify(s));c.id=uid();c.title=(s.title||'無題')+' コピー';c.updated=now();a.sheets.push(c);saveApp(a);renderList()}
function duplicateCurrent(){if(currentId)duplicateSheet(currentId)}
function deleteSheet(id){const a=getApp(),s=a.sheets.find(x=>x.id===id);if(!s||!confirm('この表を削除しますか？'))return;a.sheets=a.sheets.filter(x=>x.id!==id);saveApp(a);if(currentId===id)showHome();else renderList()}
function deleteCurrent(){if(currentId)deleteSheet(currentId)}
function exportCSV(){
  const {s}=current();if(!s)return;
  const cols=s.columns||[];
  const header=['✅','日付','イベント名','場所','出店アイテム',...cols.map(c=>c.name),'去年のアイテム','去年売上'];
  const d=[header,...(s.rows||[]).map(r=>[r.ok?'✅':'',r.date,r.event,r.place,r.item,...cols.map(c=>(r.custom||{})[c.id]||''),r.lastItem,r.lastSales])];
  const csv='\ufeff'+d.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=(s.title||'コナン一覧表')+'.csv';a.click();URL.revokeObjectURL(a.href)
}
migrate();renderList();
</script>
</body>
</html>
