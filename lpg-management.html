<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565a8">
<title>松笠商店（LPG）管理</title>
<style>
:root{--blue:#1565a8;--blue2:#2f8bd0;--bg:#eef7fc;--card:#fff;--line:#cfe0ec;--text:#183044;--sub:#637b8d;--green:#168957;--red:#cc4050;--gold:#c68a09;--shadow:0 8px 24px rgba(23,72,105,.12)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f6fbff,#eaf4fa);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:16px 14px;box-shadow:0 4px 16px rgba(10,65,100,.25)}
.top{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}.sub{font-size:12px;opacity:.9;margin-top:4px}.back{background:rgba(255,255,255,.18);color:#fff}
.wrap{max-width:1050px;margin:auto;padding:14px 12px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}h2{font-size:17px;margin:0 0 12px}
.grid2,.grid3,.grid4{display:grid;gap:9px}.grid2{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-size:12px;font-weight:900;color:var(--sub);margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #bdd1df;border-radius:11px;padding:11px;background:#fff;font-size:16px;color:var(--text)}textarea{min-height:65px;resize:vertical}
.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.ghost{background:#eaf1f6;color:#36566d}.danger{background:#fde8eb;color:var(--red)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.site{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fbfdff}.site h3{margin:0 0 9px;font-size:16px}.gasgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.gas{border-radius:12px;padding:10px;text-align:center;background:#eef7fc}.gas .type{font-size:12px;color:var(--sub);font-weight:900}.gas .stock{font-size:25px;font-weight:1000;margin-top:3px}.gas .order{font-size:11px;color:var(--gold);font-weight:900;margin-top:3px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px 8px;border-bottom:1px solid #dfebf2;text-align:left;font-size:13px}th{background:#edf6fb;color:#375b73;font-size:12px;position:sticky;top:0}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900}.in{background:#e3f5eb;color:var(--green)}.out{background:#fde8eb;color:var(--red)}
.empty{text-align:center;padding:18px;color:var(--sub)}.summary{font-size:12px;color:var(--sub);line-height:1.6}
@media(max-width:700px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="top"><div><h1>🔥 松笠商店（LPG）管理</h1><div class="sub">仕入・返却・発注・在庫累計</div></div><button class="back" onclick="goBack()">← 戻る</button></div></header>
<div class="wrap">
<section class="card">
<h2>現在庫・今回発注数量</h2>
<div id="stockCards" class="kpis"></div>
<div class="summary" style="margin-top:10px">現在庫 ＝ 仕入合計 − 返却合計。管理先・ガス種類ごとに自動計算します。</div>
</section>

<section class="card">
<h2>仕入・返却を登録</h2>
<div class="grid4">
<div><label>日付</label><input id="date" type="date"></div>
<div><label>管理先</label><select id="site"><option>FUJIWARA Group</option><option>尼崎</option></select></div>
<div><label>区分</label><select id="kind"><option>仕入</option><option>返却</option></select></div>
<div><label>ガスの種類</label><select id="gas"><option>20kg</option><option>10kg</option><option>8kg</option></select></div>
</div>
<div class="grid2" style="margin-top:9px">
<div><label>仕入・返却数量（本）</label><input id="qty" type="number" min="1" value="1"></div>
<div><label>今回発注数量（本）</label><input id="orderQty" type="number" min="0" value="0"></div>
</div>
<div style="margin-top:9px"><label>備考</label><textarea id="memo" placeholder="担当者名・伝票番号・注意事項など"></textarea></div>
<div class="toolbar"><button class="primary" onclick="saveEntry()">登録する</button><button class="ghost" onclick="resetForm()">入力を戻す</button></div>
</section>

<section class="card">
<h2>履歴</h2>
<div class="grid3">
<div><label>管理先で絞る</label><select id="filterSite" onchange="render()"><option value="">すべて</option><option>FUJIWARA Group</option><option>尼崎</option></select></div>
<div><label>ガス種類で絞る</label><select id="filterGas" onchange="render()"><option value="">すべて</option><option>20kg</option><option>10kg</option><option>8kg</option></select></div>
<div><label>区分で絞る</label><select id="filterKind" onchange="render()"><option value="">すべて</option><option>仕入</option><option>返却</option></select></div>
</div>
<div id="history" class="tablewrap" style="margin-top:10px"></div>
</section>
</div>
<script>
const KEY="fujiwara_lpg_matsukasa_v1";
let rows=[];
function uid(){return Date.now()+"_"+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(v))rows=v}catch(e){}}
function persist(){localStorage.setItem(KEY,JSON.stringify(rows))}
function resetForm(){document.getElementById("date").value=today();document.getElementById("site").value="FUJIWARA Group";document.getElementById("kind").value="仕入";document.getElementById("gas").value="20kg";document.getElementById("qty").value=1;document.getElementById("orderQty").value=0;document.getElementById("memo").value=""}
function saveEntry(){
 const qty=Number(document.getElementById("qty").value||0),orderQty=Number(document.getElementById("orderQty").value||0);
 if(qty<1){alert("仕入・返却数量を入力してください");return}
 rows.push({id:uid(),date:document.getElementById("date").value||today(),site:document.getElementById("site").value,kind:document.getElementById("kind").value,gas:document.getElementById("gas").value,qty,orderQty,memo:document.getElementById("memo").value.trim(),createdAt:Date.now()});
 persist();resetForm();render()
}
function del(id){if(!confirm("この履歴を削除しますか？"))return;rows=rows.filter(x=>x.id!==id);persist();render()}
function calc(site,gas){
 const list=rows.filter(x=>x.site===site&&x.gas===gas);
 const incoming=list.filter(x=>x.kind==="仕入").reduce((a,b)=>a+Number(b.qty||0),0);
 const outgoing=list.filter(x=>x.kind==="返却").reduce((a,b)=>a+Number(b.qty||0),0);
 const order=list.reduce((a,b)=>a+Number(b.orderQty||0),0);
 return {stock:incoming-outgoing,order}
}
function renderStocks(){
 const sites=["FUJIWARA Group","尼崎"],gases=["20kg","10kg","8kg"];
 document.getElementById("stockCards").innerHTML=sites.map(s=>`<div class="site"><h3>${s}</h3><div class="gasgrid">${gases.map(g=>{const c=calc(s,g);return `<div class="gas"><div class="type">${g}</div><div class="stock">${c.stock}<small style="font-size:12px">本</small></div><div class="order">今回発注累計 ${c.order}本</div></div>`}).join("")}</div></div>`).join("")
}
function render(){
 renderStocks();
 const fs=document.getElementById("filterSite").value,fg=document.getElementById("filterGas").value,fk=document.getElementById("filterKind").value;
 let list=[...rows].filter(x=>(!fs||x.site===fs)&&(!fg||x.gas===fg)&&(!fk||x.kind===fk)).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
 document.getElementById("history").innerHTML=list.length?`<table><thead><tr><th>日付</th><th>管理先</th><th>区分</th><th>種類</th><th>数量</th><th>今回発注</th><th>備考</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.site)}</td><td><span class="badge ${x.kind==="仕入"?"in":"out"}">${esc(x.kind)}</span></td><td>${esc(x.gas)}</td><td>${Number(x.qty)}本</td><td>${Number(x.orderQty||0)}本</td><td>${esc(x.memo)}</td><td><button class="danger" onclick="del('${x.id}')">削除</button></td></tr>`).join("")}</tbody></table>`:'<div class="empty">まだ履歴がありません。</div>'
}
function goBack(){if(history.length>1)history.back();else location.href="manager-app.html"}
load();resetForm();render();
</script>
</body>
</html>
