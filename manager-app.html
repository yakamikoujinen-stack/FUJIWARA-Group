<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>担当者専用アプリ v5.7｜在庫履歴表示対応版</title>
<style>
:root{--navy:#17324d;--blue:#2f6fa7;--sky:#eaf4ff;--gold:#f4b942;--green:#2e8b57;--text:#1c2733;--muted:#66788a;--line:#dbe5ee;--white:#fff;--shadow:0 10px 28px rgba(18,46,72,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#f6fbff,#eef6fb)}
button,input{font:inherit}.app{max-width:1000px;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--navy),#285f8c);color:#fff;border-radius:0 0 24px 24px;padding:22px 18px 20px;box-shadow:var(--shadow);margin:0 -14px 18px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(23px,5vw,34px);margin:0;font-weight:900}.subtitle{margin:8px 0 0;color:#dcecff}.back{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:10px 13px;font-weight:800}
.notice{background:#fff8df;border:1px solid #f6dc8c;border-radius:16px;padding:13px 15px;margin-bottom:15px;font-weight:700;color:#6d5411}
.main-app-card{background:linear-gradient(135deg,#fffdf5,#fff6d7);border:2px solid #e1b84f;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}.main-app-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--gold)}
.main-app-icon{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:39px;background:linear-gradient(135deg,#17324d,#2f6fa7);color:#ffd76a;flex:0 0 auto}.main-app-info{flex:1}.main-app-title{margin:0;font-size:25px;font-weight:900}.main-app-text{margin:6px 0 12px;color:#5a4b23;line-height:1.6}.main-app-btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;background:linear-gradient(135deg,#d5a62c,#f3c95e);color:#2d2100;cursor:pointer;min-height:48px}
.grid{display:grid;grid-template-columns:1fr;gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--blue)}.card:nth-child(2):before{background:var(--gold)}.card:nth-child(3):before{background:#d55a32}.card:nth-child(4):before{background:var(--green)}
.card-head{display:flex;align-items:center;gap:13px;margin-bottom:10px}.icon{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:31px;background:var(--sky);flex:0 0 auto}.title{margin:0;font-size:23px;font-weight:900}.owner{font-size:16px;color:var(--muted);margin-top:4px}.owner strong{color:var(--text);font-size:18px}.desc{margin:10px 0 15px;line-height:1.7;color:#425568}.actions{display:flex;gap:10px;flex-wrap:wrap}.open-btn,.edit-btn,.save-btn,.cancel-btn,.locked-btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;min-height:48px}.open-btn{background:var(--navy);color:#fff;flex:1;cursor:pointer}.edit-btn{background:#eef3f7;color:#294055;cursor:pointer}.locked-btn{background:#e8e8e8;color:#777;cursor:not-allowed;flex:1}.leader-badge{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:999px;background:#fff0c7;color:#765300;font-size:12px;font-weight:900}
.settings{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.settings summary{cursor:pointer;font-weight:900;font-size:18px}.setting-row{display:grid;gap:10px;padding:14px 0;border-bottom:1px solid #edf1f5}label{font-weight:800;font-size:14px;color:#425568}input{width:100%;border:1px solid #cfdbe6;border-radius:12px;padding:12px 13px;background:#fff;font-size:17px}.settings-actions{display:flex;gap:10px;margin-top:14px}.save-btn{background:var(--green);color:#fff;flex:1;cursor:pointer}.cancel-btn{background:#eef3f7;color:#33485c;cursor:pointer}footer{text-align:center;color:#7b8d9e;font-size:12px;margin-top:20px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.card{display:flex;flex-direction:column}.desc{flex:1}.actions{flex-direction:column}}
</style></head>
<body><div class="app">
<header><div class="topline"><div><h1>担当者専用アプリ v5.7</h1><p class="subtitle">在庫・仕入・車両・運行・準備・LPGをここから管理</p></div><button class="back" onclick="goBack()">← 戻る</button></div></header>
<div class="notice">運行記録を追加しました。出発・帰社距離、行先、高速料金、給油記録をFirebaseで共有します。
<div style="margin-top:9px"><button onclick="forceLatest()" style="border:0;border-radius:10px;padding:9px 12px;background:#17324d;color:#fff;font-weight:900">🔄 最新版へ更新</button></div></div>
<section class="main-app-card"><div class="main-app-icon">🏠</div><div class="main-app-info"><h2 class="main-app-title">メインアプリ</h2><p class="main-app-text">イベント管理・カレンダー・売上・出勤など、メインアプリへ移動します。</p><button class="main-app-btn" onclick="location.href='index.html'">メインアプリを開く</button></div></section>

<main class="grid" id="cards"></main>

<details class="settings" id="settings"><summary>⚙️ 担当者・リンク設定</summary><div id="settingRows"></div><div class="settings-actions"><button class="cancel-btn" onclick="loadSettingsForm()">元に戻す</button><button class="save-btn" onclick="saveSettings()">設定を保存</button></div></details>
<footer>FUJIWARA Group 担当者専用</footer></div>
<script>

const APP_VERSION="5.7";
async function clearOldAppCache(){
 try{
  if("serviceWorker" in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if("caches" in window){
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
  }
 }catch(e){console.warn("cache clear skipped",e)}
}
async function forceLatest(){
 await clearOldAppCache();
 const base=location.pathname;
 location.replace(base+"?v=57&t="+Date.now());
}
(async()=>{
 const p=new URLSearchParams(location.search);
 if(p.get("v")!=="57"){
  await clearOldAppCache();
  location.replace(location.pathname+"?v=57");
 }
})();

const DEFAULTS=[
{key:"inventory",icon:"📦",title:"在庫管理",owner:"担当者",desc:"前回在庫・今回在庫・差額・保存場所・更新日・入力者を確認",url:"index.html?open=inventory&manager=1"},
{key:"eventPurchase",icon:"🛒",title:"イベント別 仕入管理",owner:"文太",desc:"イベントごとの品目・在庫数・必要目安・追加数量・購入済みを確認",url:"event-purchase.html"},
{key:"vehicle",icon:"🚚",title:"車両管理アプリ",owner:"将",desc:"車両点検・車検・保険・洗車・修理記録",url:"vehicle-management.html"},
{key:"prepare",icon:"📦",title:"準備アプリ",owner:"繁充",desc:"積込チェック・準備確認・シート記入・完了報告",url:"preparation-app.html"},
{key:"lpg",icon:"🔥",title:"松笠商店（LPG）管理",owner:"将",desc:"20kg・10kg・8kgの仕入、返却、今回発注数量、在庫累計",url:"lpg-management.html"},
{key:"operationLog",icon:"🚐",title:"運行記録",owner:"将",desc:"出発・帰社時走行距離、行先、高速料金、給油記録を管理",url:"vehicle-operation-log.html"}
];

function clone(v){return JSON.parse(JSON.stringify(v))}

function getData(){
  try{
    const saved=JSON.parse(localStorage.getItem("fujiwara_manager_apps_v8"));
    if(Array.isArray(saved)){
      const out=clone(DEFAULTS);
      saved.forEach(s=>{
        const i=out.findIndex(x=>x.key===s.key);
        // 担当者名だけ引継ぎ、URLは最新版へ固定
        if(i>=0&&s.owner) out[i].owner=s.owner;
      });

      // 現在のDEFAULTSだけを保存するため、削除した仕入登録は復活しない
      localStorage.setItem("fujiwara_manager_apps_v8",JSON.stringify(out));
      return out;
    }
  }catch(e){}
  return clone(DEFAULTS);
}

try{
  localStorage.removeItem("fujiwara_manager_apps_v1");
  localStorage.removeItem("fujiwara_manager_apps_v2");
  localStorage.removeItem("fujiwara_manager_apps_v3");
  localStorage.removeItem("fujiwara_manager_apps_v4");
  localStorage.removeItem("fujiwara_manager_apps_v5");
  localStorage.removeItem("fujiwara_manager_apps_v6");
  localStorage.removeItem("fujiwara_manager_apps_v7");
}catch(e){}
let data=getData();

function esc(s=""){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function renderCards(){
 document.getElementById("cards").innerHTML=data.map((x,i)=>{
  const action=`<button class="open-btn" onclick="openApp(${i})">アプリを開く</button><button class="edit-btn" onclick="editItem(${i})">担当者を変更</button>`;
  const badge='';
  return `<section class="card"><div class="card-head"><div class="icon">${x.icon}</div><div><h2 class="title">${esc(x.title)}</h2><div class="owner">担当：<strong>${esc(x.owner||"未設定")}</strong></div>${badge}</div></div><p class="desc">${esc(x.desc)}</p><div class="actions">${action}</div></section>`;
 }).join("");
}

function renderSettings(){
 document.getElementById("settingRows").innerHTML=data.map((x,i)=>{
  return `<div class="setting-row"><label>${esc(x.title)}の担当者名</label><input id="owner-${i}" value="${esc(x.owner)}"><label>使用ファイル</label><input value="${esc(x.url)}" readonly style="background:#eef3f7"></div>`;
 }).join("");
}

function saveSettings(){
  data=data.map((x,i)=>{
    return {...x,owner:document.getElementById(`owner-${i}`).value.trim()||"未設定"};
  });
  localStorage.setItem("fujiwara_manager_apps_v8",JSON.stringify(data));
  renderCards();
  alert("設定を保存しました");
}

function loadSettingsForm(){data=getData();renderCards();renderSettings()}
function editItem(i){document.getElementById("settings").open=true;setTimeout(()=>document.getElementById(`owner-${i}`).focus(),80)}
function openApp(i){
  const u=(data[i].url||"").trim();
  if(!u) return alert("URLを設定してください");
  location.href=u;
}
function goBack(){if(history.length>1)history.back();else location.href="index.html"}

renderCards();
renderSettings();
</script></body></html>
