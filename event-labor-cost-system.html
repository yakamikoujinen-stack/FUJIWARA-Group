<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>イベント専用 労務費管理</title>
<style>
:root{--bg:#f5f1e8;--card:#fff;--ink:#241d13;--muted:#766b5d;--gold:#9a6a17;--line:#e6dccb;--green:#247a47;--red:#b23b32;--nav:#201a13}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:86px}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#1e1812,#4b371d);color:white;padding:16px 16px 14px;box-shadow:0 3px 14px #0002}.top h1{font-size:20px;margin:0 0 4px}.top p{margin:0;font-size:12px;opacity:.82}.wrap{max-width:1000px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 16px #4a32100d}.kpi{padding:12px}.kpi small{color:var(--muted);display:block}.kpi b{display:block;font-size:21px;margin-top:4px}.card{padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-size:17px;font-weight:900}.sub{font-size:12px;color:var(--muted)}label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px}.field{flex:1;min-width:150px}input,select,textarea{width:100%;border:1px solid #d8ccb8;border-radius:11px;padding:11px;background:white;color:var(--ink)}textarea{min-height:70px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:var(--gold);color:white}.dark{background:var(--nav);color:white}.outline{background:white;border:1px solid #ccb994;color:var(--ink)}.danger{background:#fff0ef;color:var(--red);border:1px solid #f0c5c1}.green{background:#eaf7ef;color:var(--green);border:1px solid #bfe0ca}.full{width:100%}.tabs{display:flex;overflow:auto;gap:7px;margin-bottom:12px}.tab{white-space:nowrap;background:white;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-weight:800}.tab.active{background:var(--nav);color:white}.page{display:none}.page.active{display:block}.event{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fffdf9}.payrow{display:grid;grid-template-columns:1.3fr .9fr .8fr .8fr .9fr .8fr auto;gap:7px;align-items:end;padding:10px 0;border-top:1px dashed var(--line)}.payrow:first-child{border-top:0}.mini{font-size:11px}.money{font-variant-numeric:tabular-nums}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;background:#f0e7d7}.paid{background:#e7f5eb;color:var(--green)}.unpaid{background:#fff0ef;color:var(--red)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left}th{background:#f7f2e9;position:sticky;top:85px}.right{text-align:right}.scroll{overflow:auto}.empty{text-align:center;color:var(--muted);padding:28px 8px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:20}.bottom button{border:0;background:white;padding:10px 2px;font-size:10px;font-weight:900}.bottom button span{display:block;font-size:20px;margin-bottom:2px}.bottom button.active{color:var(--gold)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.payrow{grid-template-columns:1fr 1fr}.payrow .wide{grid-column:1/-1}.desktop{display:none}th{top:84px}}
</style>
</head><body>
<header class="top"><h1>👥 イベント専用 労務費管理</h1><p>個人別・イベント別・月別・年間を自動集計</p></header>
<main class="wrap">
<div class="grid" id="kpis"></div>
<div style="height:12px"></div>
<div class="tabs" id="tabs"></div>
<section id="dashboard" class="page active"></section>
<section id="events" class="page"></section>
<section id="people" class="page"></section>
<section id="summary" class="page"></section>
<section id="settings" class="page"></section>
</main>
<nav class="bottom" id="bottom"></nav>
<script>
const KEY='fujiwara_event_labor_v1';
let db=load(); let current='dashboard';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.events&&x.staff)return x}catch(e){}return {staff:[{id:id(),name:'藤原',defaultType:'日当',defaultRate:0},{id:id(),name:'まゆみ',defaultType:'日当',defaultRate:0},{id:id(),name:'将',defaultType:'日当',defaultRate:0},{id:id(),name:'文太',defaultType:'日当',defaultRate:0}],events:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function monthNow(){return today().slice(0,7)}
function amount(p){if(p.type==='時給')return Math.round((+p.hours||0)*(+p.rate||0));if(p.type==='売上歩合')return Math.round((+p.salesBase||0)*(+p.rate||0)/100);return +p.rate||0}
function allPays(){return db.events.flatMap(e=>(e.payments||[]).map(p=>({...p,eventId:e.id,eventName:e.name,date:e.date,place:e.place,amount:amount(p)})))}
function renderNav(){const items=[['dashboard','🏠','トップ'],['events','🎪','イベント'],['people','👤','個人別'],['summary','📊','集計'],['settings','⚙️','設定']];tabs.innerHTML=items.map(x=>`<button class="tab ${current===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('');bottom.innerHTML=items.map(x=>`<button class="${current===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function go(p){current=p;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');renderNav();scrollTo(0,0)}
function renderKpis(){const ps=allPays(),m=monthNow(),mp=ps.filter(x=>x.date.startsWith(m));kpis.innerHTML=`<div class="kpi"><small>今月の労務費</small><b>${yen(mp.reduce((a,x)=>a+x.amount,0))}</b></div><div class="kpi"><small>今月の出勤人数</small><b>${new Set(mp.map(x=>x.staffId)).size}人</b></div><div class="kpi"><small>未払い</small><b>${yen(ps.filter(x=>!x.paid).reduce((a,x)=>a+x.amount,0))}</b></div><div class="kpi"><small>登録イベント</small><b>${db.events.length}件</b></div>`}
function renderDashboard(){const ps=allPays(),m=monthNow(),mp=ps.filter(x=>x.date.startsWith(m));const by={};mp.forEach(x=>{by[x.staffName]=(by[x.staffName]||0)+x.amount});dashboard.innerHTML=`<div class="card"><div class="between"><div><div class="title">今月の個人別支払予定</div><div class="sub">${m.replace('-','年')}月</div></div><button class="btn primary" onclick="go('events')">＋イベント登録</button></div>${Object.keys(by).length?`<div class="scroll"><table><thead><tr><th>スタッフ</th><th class="right">労務費</th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(x=>`<tr><td><b>${esc(x[0])}</b></td><td class="right money"><b>${yen(x[1])}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">今月の労務費データはまだありません</div>`}</div><div class="card"><div class="title">未払い一覧</div>${ps.filter(x=>!x.paid).length?ps.filter(x=>!x.paid).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="event between"><div><b>${esc(x.staffName)}</b> <span class="badge unpaid">未払い</span><div class="sub">${x.date}　${esc(x.eventName)}</div></div><b>${yen(x.amount)}</b></div>`).join(''):`<div class="empty">未払いはありません</div>`}</div>`}
function renderEvents(){events.innerHTML=`<div class="card"><div class="title">イベント登録</div><div class="row" style="margin-top:10px"><div class="field"><label>開催日</label><input id="eDate" type="date" value="${today()}"></div><div class="field"><label>イベント名</label><input id="eName" placeholder="例：柳まつり"></div><div class="field"><label>場所</label><input id="ePlace" placeholder="会場名"></div></div><button class="btn primary full" style="margin-top:9px" onclick="addEvent()">イベントを追加</button></div><div class="card"><div class="between"><div class="title">イベント別 労務費</div><select id="eventMonth" onchange="renderEvents()" style="max-width:170px"><option value="all">すべて</option>${months().map(m=>`<option ${window._em===m?'selected':''}>${m}</option>`).join('')}</select></div><div id="eventList"></div></div>`;document.getElementById('eventMonth').value=window._em||'all';document.getElementById('eventMonth').onchange=e=>{window._em=e.target.value;renderEvents()};let list=db.events.slice().sort((a,b)=>b.date.localeCompare(a.date));if(window._em&&window._em!=='all')list=list.filter(e=>e.date.startsWith(window._em));eventList.innerHTML=list.length?list.map(eventHtml).join(''):`<div class="empty">イベントはまだありません</div>`}
function months(){return [...new Set(db.events.map(e=>e.date.slice(0,7)))].sort().reverse()}
function addEvent(){const name=eName.value.trim();if(!name)return alert('イベント名を入力してください');db.events.push({id:id(),date:eDate.value||today(),name,place:ePlace.value.trim(),memo:'',payments:[]});save();go('events')}
function eventHtml(e){const total=(e.payments||[]).reduce((a,p)=>a+amount(p),0);return `<div class="event"><div class="between"><div><b>${e.date}　${esc(e.name)}</b><div class="sub">${esc(e.place||'場所未入力')}</div></div><div class="right"><b>${yen(total)}</b><div><button class="btn danger mini" onclick="delEvent('${e.id}')">削除</button></div></div></div><div id="pays-${e.id}">${(e.payments||[]).map(p=>payHtml(e,p)).join('')}</div><button class="btn outline full" onclick="addPay('${e.id}')">＋ スタッフを追加</button></div>`}
function payHtml(e,p){return `<div class="payrow"><div class="field wide"><label>スタッフ</label><select onchange="updPay('${e.id}','${p.id}','staffId',this.value)">${db.staff.map(s=>`<option value="${s.id}" ${s.id===p.staffId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div><label>計算方法</label><select onchange="updPay('${e.id}','${p.id}','type',this.value)">${['日当','時給','固定額','売上歩合'].map(x=>`<option ${x===p.type?'selected':''}>${x}</option>`).join('')}</select></div><div><label>${p.type==='売上歩合'?'歩合率％':'単価・金額'}</label><input type="number" value="${p.rate||''}" oninput="updPay('${e.id}','${p.id}','rate',this.value,false)" onchange="renderAll()"></div><div><label>時間</label><input type="number" step="0.25" value="${p.hours||''}" ${p.type==='時給'?'':'disabled'} oninput="updPay('${e.id}','${p.id}','hours',this.value,false)" onchange="renderAll()"></div><div><label>支払予定日</label><input type="date" value="${p.dueDate||''}" onchange="updPay('${e.id}','${p.id}','dueDate',this.value)"></div><div><label>状態</label><select onchange="updPay('${e.id}','${p.id}','paid',this.value==='1')"><option value="0" ${!p.paid?'selected':''}>未払い</option><option value="1" ${p.paid?'selected':''}>支払済</option></select></div><div><label>金額</label><b class="money">${yen(amount(p))}</b><button class="btn danger mini" onclick="delPay('${e.id}','${p.id}')">×</button></div></div>`}
function addPay(eid){const e=db.events.find(x=>x.id===eid);if(!db.staff.length)return alert('先にスタッフを登録してください');const s=db.staff[0];e.payments.push({id:id(),staffId:s.id,staffName:s.name,type:s.defaultType||'日当',rate:+s.defaultRate||0,hours:0,salesBase:0,dueDate:'',paid:false,paidDate:''});save()}
function updPay(eid,pid,k,v,rerender=true){const e=db.events.find(x=>x.id===eid),p=e.payments.find(x=>x.id===pid);p[k]=['rate','hours','salesBase'].includes(k)?+v:v;if(k==='staffId'){const s=db.staff.find(x=>x.id===v);p.staffName=s?s.name:'';p.type=s?.defaultType||p.type;p.rate=+s?.defaultRate||p.rate}localStorage.setItem(KEY,JSON.stringify(db));if(rerender)renderAll();else renderKpis()}
function delPay(eid,pid){const e=db.events.find(x=>x.id===eid);e.payments=e.payments.filter(x=>x.id!==pid);save()}
function delEvent(eid){if(confirm('このイベントを削除しますか？')){db.events=db.events.filter(x=>x.id!==eid);save()}}
function renderPeople(){const ps=allPays();people.innerHTML=`<div class="card"><div class="between"><div><div class="title">個人別 労務費集計</div><div class="sub">全イベントをスタッフごとに集計</div></div><select id="peopleMonth" onchange="window._pm=this.value;renderPeople()" style="max-width:170px"><option value="all">全期間</option>${months().map(m=>`<option ${window._pm===m?'selected':''}>${m}</option>`).join('')}</select></div>${db.staff.map(s=>{let a=ps.filter(x=>x.staffId===s.id);if(window._pm&&window._pm!=='all')a=a.filter(x=>x.date.startsWith(window._pm));return `<div class="event"><div class="between"><div><b>${esc(s.name)}</b><div class="sub">出勤 ${a.length}回　未払い ${a.filter(x=>!x.paid).length}件</div></div><b>${yen(a.reduce((z,x)=>z+x.amount,0))}</b></div>${a.length?`<div class="scroll"><table><tbody>${a.sort((x,y)=>y.date.localeCompare(x.date)).map(x=>`<tr><td>${x.date}<br><span class="sub">${esc(x.eventName)}</span></td><td>${esc(x.type)}</td><td class="right">${yen(x.amount)}<br><span class="badge ${x.paid?'paid':'unpaid'}">${x.paid?'支払済':'未払い'}</span></td></tr>`).join('')}</tbody></table></div>`:''}</div>`}).join('')}</div>`}
function renderSummary(){const ps=allPays();summary.innerHTML=`<div class="card"><div class="between"><div class="title">月別集計</div><button class="btn green" onclick="exportCsv()">CSV出力</button></div><div class="scroll"><table><thead><tr><th>月</th><th>イベント数</th><th>延べ人数</th><th class="right">労務費</th><th class="right">未払い</th></tr></thead><tbody>${months().map(m=>{const a=ps.filter(x=>x.date.startsWith(m));return `<tr><td><b>${m}</b></td><td>${db.events.filter(e=>e.date.startsWith(m)).length}</td><td>${a.length}</td><td class="right"><b>${yen(a.reduce((z,x)=>z+x.amount,0))}</b></td><td class="right">${yen(a.filter(x=>!x.paid).reduce((z,x)=>z+x.amount,0))}</td></tr>`}).join('')}</tbody></table></div></div><div class="card"><div class="title">年間集計</div><div class="scroll"><table><thead><tr><th>年</th><th>イベント数</th><th>延べ人数</th><th class="right">年間労務費</th></tr></thead><tbody>${[...new Set(db.events.map(e=>e.date.slice(0,4)))].sort().reverse().map(y=>{const a=ps.filter(x=>x.date.startsWith(y));return `<tr><td><b>${y}年</b></td><td>${db.events.filter(e=>e.date.startsWith(y)).length}</td><td>${a.length}</td><td class="right"><b>${yen(a.reduce((z,x)=>z+x.amount,0))}</b></td></tr>`}).join('')}</tbody></table></div></div>`}
function renderSettings(){settings.innerHTML=`<div class="card"><div class="title">スタッフマスタ</div><div id="staffList">${db.staff.map(s=>`<div class="event row"><div class="field"><label>名前</label><input value="${esc(s.name)}" onchange="updStaff('${s.id}','name',this.value)"></div><div class="field"><label>標準計算</label><select onchange="updStaff('${s.id}','defaultType',this.value)">${['日当','時給','固定額','売上歩合'].map(x=>`<option ${x===s.defaultType?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>標準単価</label><input type="number" value="${s.defaultRate||''}" onchange="updStaff('${s.id}','defaultRate',this.value)"></div><button class="btn danger" onclick="delStaff('${s.id}')">削除</button></div>`).join('')}</div><div class="row" style="margin-top:10px"><div class="field"><input id="newStaff" placeholder="スタッフ名"></div><button class="btn primary" onclick="addStaff()">＋追加</button></div></div><div class="card"><div class="title">バックアップ</div><div class="row" style="margin-top:10px"><button class="btn dark" onclick="backup()">💾 保存</button><label class="btn outline" style="margin:0">📂 復元<input type="file" accept="application/json" onchange="restore(this.files[0])" style="display:none"></label><button class="btn danger" onclick="resetAll()">全データ初期化</button></div></div>`}
function addStaff(){const n=newStaff.value.trim();if(!n)return;db.staff.push({id:id(),name:n,defaultType:'日当',defaultRate:0});save()}
function updStaff(sid,k,v){const s=db.staff.find(x=>x.id===sid);s[k]=k==='defaultRate'?+v:v;if(k==='name')db.events.forEach(e=>(e.payments||[]).forEach(p=>{if(p.staffId===sid)p.staffName=v}));save()}
function delStaff(sid){if(allPays().some(x=>x.staffId===sid))return alert('このスタッフは労務費データで使用中です');db.staff=db.staff.filter(x=>x.id!==sid);save()}
function exportCsv(){const rows=[['日付','イベント名','場所','スタッフ','計算方法','金額','支払状態','支払予定日'],...allPays().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.eventName,x.place,x.staffName,x.type,x.amount,x.paid?'支払済':'未払い',x.dueDate||''])];download('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'イベント労務費.csv','text/csv')}
function backup(){download(JSON.stringify(db,null,2),'イベント労務費バックアップ.json','application/json')}
function download(data,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.staff||!x.events)throw 0;db=x;save();alert('復元しました')}catch(e){alert('復元できないファイルです')}};r.readAsText(f)}
function resetAll(){if(confirm('登録データをすべて削除しますか？')){localStorage.removeItem(KEY);db=load();renderAll()}}
function renderAll(){renderNav();renderKpis();renderDashboard();renderEvents();renderPeople();renderSummary();renderSettings()}
renderAll();
</script></body></html>
