<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建設スタッフ日報</title>
<link rel="apple-touch-icon" sizes="180x180" href="https://yakamikoujinen-stack.github.io/FUJIWARA-Group/icon-construction-staff.png?v=20260820">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://yakamikoujinen-stack.github.io/FUJIWARA-Group/icon-construction-staff.png?v=20260820">
<meta name="apple-mobile-web-app-title" content="建設日報">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f3a5f">
<style>
:root{--navy:#1f3a5f;--green:#0a7a2f;--bg:#eef2f7;--line:#d7dee8;--text:#172033}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 14px 4px}
.hero{max-width:820px;margin:auto;background:#fff;border-radius:24px;padding:24px 22px;box-shadow:0 6px 20px #00000010}
.title{font-size:28px;font-weight:900}.sub{margin-top:4px;font-size:16px;color:#617083}.badge{display:inline-block;margin-top:12px;padding:6px 12px;border-radius:999px;background:#e9f9ef;color:var(--green);font-size:13px;font-weight:900}
main{max-width:820px;margin:auto;padding:14px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
h2{margin:0 0 8px;font-size:22px}.small{font-size:13px;color:#667085;line-height:1.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;margin-top:10px;font-size:13px;font-weight:800;color:#46536a}
input,select,textarea,button{width:100%;font-size:16px;padding:12px;border-radius:11px;border:1px solid var(--line);margin-top:6px;background:#fff}
textarea{min-height:105px;resize:vertical}
button{background:var(--green);color:#fff;border:0;font-weight:900;min-height:52px;margin-top:16px}
button:disabled{opacity:.55}
.status{display:inline-block;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;background:#fff4db;color:#9a6700}.status.ok{background:#e9f9ef;color:var(--green)}.status.ng{background:#ffe4e6;color:#b00020}
.notice{background:#f8fafc;border:1px solid #e8edf3;border-radius:12px;padding:12px;margin-top:12px}
.done{display:none;background:#ecfdf5;border:1px solid #bbf7d0;color:#166534;border-radius:13px;padding:14px;font-weight:800;line-height:1.6;margin-top:14px}
.required{color:#b00020}
@media(max-width:680px){.row{grid-template-columns:1fr}.title{font-size:24px}.hero{padding:20px 18px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body>
<header>
  <div class="hero">
    <div class="title">🏗️ 建設スタッフ 日報</div>
    <div class="sub">FUJIWARA Group</div>
    <div class="badge">スタッフ専用・日報入力のみ</div>
  </div>
</header>

<main>
  <section class="card">
    <div><span id="cloudStatus" class="status">Firebase接続中...</span></div>
    <div class="notice small">
      この画面では日報入力だけできます。予定・集計・取引先管理・削除・承認・請求書機能は表示しません。
    </div>
  </section>

  <section class="card">
    <h2>📝 日報入力</h2>
    <p class="small"><span class="required">＊</span> は必須項目です。保存した内容は管理者の建設管理へ即時共有されます。</p>

    <div class="row">
      <div><label>日付 <span class="required">＊</span></label><input id="rDate" type="date"></div>
      <div><label>現場名 <span class="required">＊</span></label><input id="rSite" placeholder="現場名"></div>
    </div>

    <label>当社の会社名</label>
    <select id="rCompany"></select>

    <div class="row">
      <div><label>日報入力者 <span class="required">＊</span></label><select id="rReporter"></select></div>
      <div><label>人数 <span class="required">＊</span></label><input id="rPeople" type="number" min="1" inputmode="numeric" placeholder="人数"></div>
    </div>

    <div class="row">
      <div><label>取引先名</label><select id="rClient"></select></div>
      <div><label>取引先担当者</label><input id="rClientPerson" placeholder="担当者名"></div>
    </div>

    <div class="row">
      <div><label>作業員</label><select id="rWorker"></select></div>
      <div><label>天気</label>
        <select id="rWeather">
          <option value="">天気を選択</option>
          <option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div><label>現場入場 <span class="required">＊</span></label><input id="rStart" type="time"></div>
      <div><label>現場退場 <span class="required">＊</span></label><input id="rEnd" type="time"></div>
    </div>

    <label>休憩（分）</label>
    <input id="rBreak" type="number" min="0" inputmode="numeric" placeholder="例：60">

    <label>本日の作業内容 <span class="required">＊</span></label>
    <textarea id="rWork" placeholder="本日の作業内容"></textarea>

    <label>連絡事項・問題点・明日の予定</label>
    <textarea id="rMemo" placeholder="連絡事項など"></textarea>

    <button id="saveBtn" onclick="saveReport()">日報を保存</button>
    <div id="done" class="done"></div>
  </section>
</main>

<script>
const firebaseConfig={
  apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",
  authDomain:"fujiwara-group-3a600.firebaseapp.com",
  databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",
  projectId:"fujiwara-group-3a600",
  storageBucket:"fujiwara-group-3a600.firebasestorage.app",
  messagingSenderId:"709887362301",
  appId:"1:709887362301:web:8ff756d645bc0398956a94",
  measurementId:"G-1VHX1GQV0C"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const base="fujiwara/construction";
const companiesData=["藤原一工業合同会社","リコー工業合同会社","株式会社ミライソ"];
let workersData=[],clientsData=[];

function R(p){return db.ref(base+"/"+p)}
function unique(a){return [...new Set((a||[]).filter(Boolean))]}
function asArray(v){if(!v)return[];return Object.entries(v).map(([id,val])=>({id,...val}))}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function setStatus(text,cls){cloudStatus.textContent=text;cloudStatus.className="status "+(cls||"")}

function renderSelects(){
  const oldReporter=rReporter.value,oldClient=rClient.value,oldWorker=rWorker.value;
  rCompany.innerHTML=companiesData.map(x=>`<option>${x}</option>`).join("");
  rReporter.innerHTML='<option value="">入力者を選択</option>'+workersData.map(x=>`<option>${x}</option>`).join("");
  rClient.innerHTML='<option value="">取引先名を選択</option>'+clientsData.map(x=>`<option>${x}</option>`).join("");
  rWorker.innerHTML='<option value="">作業員を選択</option>'+workersData.map(x=>`<option>${x}</option>`).join("");
  if(workersData.includes(oldReporter))rReporter.value=oldReporter;
  if(clientsData.includes(oldClient))rClient.value=oldClient;
  if(workersData.includes(oldWorker))rWorker.value=oldWorker;
}

function start(){
  firebase.database().ref(".info/connected").on("value",s=>{
    s.val()?setStatus("Firebase接続OK / 共有中","ok"):setStatus("Firebase未接続 / 通信確認中","ng");
  });
  R("workers").on("value",s=>{
    workersData=unique(asArray(s.val()).map(x=>x.name).concat(["藤原","山田","田中","繁充"]));
    renderSelects();
  });
  R("clients").on("value",s=>{
    clientsData=unique(asArray(s.val()).map(x=>x.name).concat(["未登録","前田建設株式会社"]));
    renderSelects();
  });
}

function saveReport(){
  const required=[
    [rDate.value,"日付"],[rSite.value.trim(),"現場名"],[rReporter.value,"日報入力者"],
    [rPeople.value,"人数"],[rStart.value,"現場入場"],[rEnd.value,"現場退場"],[rWork.value.trim(),"作業内容"]
  ];
  const miss=required.find(x=>!x[0]);
  if(miss)return alert(miss[1]+"を入力してください");

  saveBtn.disabled=true;
  saveBtn.textContent="保存中...";

  const now=new Date();
  const data={
    date:rDate.value,
    site:rSite.value.trim(),
    company:rCompany.value,
    reporter:rReporter.value,
    client:rClient.value,
    clientPerson:rClientPerson.value.trim(),
    worker:rWorker.value,
    people:rPeople.value,
    start:rStart.value,
    end:rEnd.value,
    breakMin:rBreak.value,
    weather:rWeather.value,
    work:rWork.value.trim(),
    memo:rMemo.value.trim(),
    approved:false,
    createdAt:now.toISOString(),
    created:now.toLocaleString()
  };

  R("reports").push(data).then(()=>{
    done.style.display="block";
    done.textContent="✅ 日報を保存しました。管理者の建設管理へ共有されています。";
    rSite.value="";
    rPeople.value="";
    rClientPerson.value="";
    rWorker.value="";
    rStart.value="";
    rEnd.value="";
    rBreak.value="";
    rWeather.value="";
    rWork.value="";
    rMemo.value="";
    window.scrollTo({top:0,behavior:"smooth"});
  }).catch(e=>{
    alert("保存エラー: "+e.message);
  }).finally(()=>{
    saveBtn.disabled=false;
    saveBtn.textContent="日報を保存";
  });
}

rDate.value=fmt(new Date());
renderSelects();
start();
</script>
</body>
</html>
