<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>建設 出欠予定表（スタッフ閲覧）</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f3a5f">
<style>
:root{--navy:#1f3a5f;--bg:#eef2f7;--red:#d13232;--blue:#2457a7;--sun:#f7ece5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:#172033}
main{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
select{width:100%;font-size:16px;padding:12px;border:1px solid #cfd7e3;border-radius:10px}.title{text-align:center;font-size:26px;font-weight:900;margin:8px 0}.month{border:2px solid #333}.mt{text-align:center;font-size:22px;font-weight:900;padding:10px;border-bottom:1px solid #333}.cal{display:grid;grid-template-columns:repeat(7,1fr)}.week{min-height:45px;display:flex;align-items:center;justify-content:center;border-right:1px solid #333;border-bottom:1px dotted #555}.week.sun{color:var(--red);background:var(--sun)}.week.sat{color:var(--blue)}.day{min-height:115px;padding:6px;border-top:1px dotted #555;border-right:1px solid #333}.day.sun,.day.hol{background:var(--sun)}.day:nth-child(7n){border-right:0}.date{text-align:right}.date.sun,.date.hol{color:var(--red)}.date.sat{color:var(--blue)}.mark{text-align:center;color:var(--red);font-size:28px;font-weight:900;margin-top:12px}.note{text-align:center;color:var(--red);font-weight:700;white-space:pre-wrap}.small{font-size:13px;color:#667085}
@media(max-width:700px){.day{min-height:95px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body><main>
<section class="card"><h2>👷 スタッフ閲覧用・出欠予定表</h2><div class="small">閲覧専用です。編集・削除はできません。</div><select id="planSelect" onchange="render()"></select></section>
<section class="card"><div id="title" class="title"></div><div class="month"><div id="mt" class="mt"></div><div id="cal" class="cal"></div></div></section>
</main>
<script>
const firebaseConfig={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};
firebase.initializeApp(firebaseConfig);const db=firebase.database(),ROOT="fujiwara/construction/attendancePlans";let plans={};
function pad(n){return String(n).padStart(2,"0")}function nthMonday(y,m,n){const d=new Date(y,m-1,1);let c=0;while(d.getMonth()===m-1){if(d.getDay()===1&&++c===n)return d.getDate();d.setDate(d.getDate()+1)}}function vernal(y){return Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4))}function autumn(y){return Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4))}
function baseHoliday(y,m,d){const f={"1-1":1,"2-11":1,"2-23":1,"4-29":1,"5-3":1,"5-4":1,"5-5":1,"8-11":1,"11-3":1,"11-23":1};if(f[m+"-"+d])return true;if(m===1&&d===nthMonday(y,1,2))return true;if(m===7&&d===nthMonday(y,7,3))return true;if(m===9&&d===nthMonday(y,9,3))return true;if(m===10&&d===nthMonday(y,10,2))return true;if(m===3&&d===vernal(y))return true;if(m===9&&d===autumn(y))return true;return false}
function isHoliday(date){const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();if(baseHoliday(y,m,d))return true;const p=new Date(y,m-1,d-1),n=new Date(y,m-1,d+1);if(date.getDay()===1&&p.getDay()===0&&baseHoliday(p.getFullYear(),p.getMonth()+1,p.getDate()))return true;if(baseHoliday(p.getFullYear(),p.getMonth()+1,p.getDate())&&baseHoliday(n.getFullYear(),n.getMonth()+1,n.getDate()))return true;return false}
function cls(date){if(isHoliday(date))return"hol";if(date.getDay()===0)return"sun";if(date.getDay()===6)return"sat";return""}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){const id=planSelect.value,p=plans[id];if(!p)return;title.textContent=p.title||"";const [y,m]=p.month.split("-").map(Number);mt.textContent=y+"年 "+m+"月";cal.innerHTML=["日","月","火","水","木","金","土"].map((x,i)=>`<div class="week ${i===0?"sun":i===6?"sat":""}">${x}</div>`).join("");const f=new Date(y,m-1,1),l=new Date(y,m,0);for(let i=0;i<f.getDay();i++)cal.insertAdjacentHTML("beforeend",'<div class="day"></div>');for(let d=1;d<=l.getDate();d++){const date=new Date(y,m-1,d),c=cls(date),ds=`${y}-${pad(m)}-${pad(d)}`,v=(p.days||{})[ds]||{};cal.insertAdjacentHTML("beforeend",`<div class="day ${c}"><div class="date ${c}">${d}</div><div class="note">${esc(v.note||"")}</div><div class="mark">${esc(v.mark||"")}</div></div>`)}}
db.ref(ROOT).on("value",s=>{plans=s.val()||{};const arr=Object.entries(plans).sort((a,b)=>String((b[1]||{}).updatedAt||"").localeCompare(String((a[1]||{}).updatedAt||"")));planSelect.innerHTML=arr.map(([id,p])=>`<option value="${id}">${esc((p.title||"")+" / "+(p.month||""))}</option>`).join("");render()});
</script></body></html>
