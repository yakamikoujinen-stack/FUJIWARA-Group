<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>建設 出欠予定表（管理者・単独開発版 v6）</title>
<meta name="theme-color" content="#1f3a5f">
<style>
:root{--navy:#1f3a5f;--bg:#eef2f7;--card:#fff;--line:#cfd7e3;--red:#d13232;--sun:#f7ece5;--muted:#667085;--green:#0a7a2f;--blue:#2457a7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:#172033}
main{max-width:1300px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1,h2{margin-top:0}.small{font-size:13px;color:var(--muted);line-height:1.6}
input,button{width:100%;font-size:16px;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff}button{background:var(--navy);color:#fff;border:0;font-weight:800}.green{background:var(--green)}.gray{background:#60758f}.redbtn{background:#b42318}
.row{display:grid;grid-template-columns:1.3fr .8fr .7fr;gap:10px}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.list{display:grid;gap:10px}.item{border:1px solid #dfe6ef;border-radius:14px;padding:12px;background:#fbfdff}.item-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.status{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;background:#fff4db;color:#9a6700}.status.ok{background:#e9f9ef;color:#0a7a2f}
.hidden{display:none!important}.title{text-align:center;font-size:26px;font-weight:900;margin:8px 0 10px}.month{border:2px solid #333}.mt{text-align:center;font-size:22px;font-weight:900;padding:10px;border-bottom:1px solid #333}
.cal{display:grid;grid-template-columns:repeat(7,1fr)}.week{min-height:45px;display:flex;align-items:center;justify-content:center;border-right:1px solid #333;border-bottom:1px dotted #555}.week.sun{color:var(--red);background:var(--sun)}.week.sat{color:var(--blue)}
.day{min-height:115px;padding:6px;border-top:1px dotted #555;border-right:1px solid #333;cursor:pointer}.day.sun,.day.hol{background:var(--sun)}.day:nth-child(7n){border-right:0}.date{text-align:right}.date.sun,.date.hol{color:var(--red)}.date.sat{color:var(--blue)}.event-chip{display:block;font-size:11px;font-weight:800;color:#2457a7;background:#edf4ff;border-radius:6px;padding:3px 4px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mark{text-align:center;color:var(--red);font-size:28px;font-weight:900;margin-top:12px}.note{text-align:center;color:var(--red);font-weight:700;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{width:min(520px,100%);background:#fff;border-radius:18px;padding:18px}.mark-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.mark-btn{background:#fff;color:var(--red);border:1px solid var(--line);font-size:24px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(max-width:800px){.row,.toolbar,.item-actions{grid-template-columns:1fr 1fr}.day{min-height:95px}}
@media print{body{background:#fff}main{max-width:none;padding:0}.no-print,.screen-only-event,.modal,#listSection,#newSection{display:none!important}.card{box-shadow:none;padding:0;margin:0}.title{font-size:18pt;margin:0 0 6mm}.mt{font-size:22pt;padding:3mm 0}.week{min-height:10mm;font-size:10.5pt}.day{height:28mm;min-height:28mm;padding:2.4mm}.date{font-size:10.5pt}.mark{font-size:24pt;margin-top:5mm}.note{font-size:10pt}@page{size:A4 landscape;margin:8mm}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body><main>
<section class="card no-print"><h1>🏗️ 出欠予定表（管理者・単独開発版 v6）</h1><div class="small">同じ月でも取引先ごとに複数作成できます。旧単独版の保存内容も自動引継ぎします。</div><span id="status" class="status">Firebase接続中...</span></section>
<section id="listSection" class="card no-print"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2>📚 保存一覧</h2><div class="small">取引先別・月別</div></div><div style="width:220px"><button class="green" onclick="showNew()">＋ 新規作成</button></div></div><div id="savedList" class="list"></div></section>
<section id="newSection" class="card no-print hidden"><h2>＋ 新規作成</h2><div class="row"><div><div class="small"><b>取引先／題名</b></div><input id="newTitle" placeholder="例：優成建設へ"></div><div><div class="small"><b>対象月</b></div><input id="newMonth" type="month"></div><div style="align-self:end"><button class="green" onclick="createPlan()">作成</button></div></div><div style="margin-top:8px"><button class="gray" onclick="cancelNew()">キャンセル</button></div></section>
<section id="editorSection" class="card hidden"><div class="no-print row"><div><div class="small"><b>取引先／題名</b></div><input id="titleInput"></div><div><div class="small"><b>対象月</b></div><input id="editMonth" type="month"></div><div style="align-self:end"><button class="green" onclick="savePlan()">保存</button></div></div><div class="small no-print" style="margin:10px 0">青文字はメインアプリ予定。PDF/印刷時は消えます。</div><div id="title" class="title"></div><div class="month"><div id="mt" class="mt"></div><div id="cal" class="cal"></div></div><div class="toolbar no-print" style="margin-top:12px"><button onclick="moveMonth(-1)">← 前月</button><button onclick="moveMonth(1)">翌月 →</button><button class="gray" onclick="syncMainEvents()">メイン予定再読込</button><button class="green" onclick="window.print()">PDF / 印刷</button></div><div class="no-print" style="margin-top:8px"><button class="gray" onclick="backList()">← 保存一覧へ</button></div></section>
</main>
<div id="modal" class="modal"><div class="dialog"><h3 id="editDateTitle"></h3><div id="modalEvents" class="small screen-only-event"></div><div class="mark-grid"><button class="mark-btn" onclick="setMark('○')">○</button><button class="mark-btn" onclick="setMark('△')">△</button><button class="mark-btn" onclick="setMark('×')">×</button><button class="mark-btn" onclick="setMark('')">空白</button></div><div class="small"><b>メモ</b></div><input id="noteInput" placeholder="例：鳥取 / 滋賀 / お盆休暇"><div class="actions"><button class="gray" onclick="closeModal()">キャンセル</button><button class="green" onclick="saveDay()">この日を保存</button></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};
firebase.initializeApp(firebaseConfig);const db=firebase.database(),ROOT="fujiwara/construction/attendancePlans",OLD="fujiwara/construction/attendancePlanDev";let plans={},currentId="",current={title:"",month:"",days:{}},editingDate="",tempMark="",mainEvents=[];
function pad(n){return String(n).padStart(2,"0")}function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}function addMonth(s,n){const [y,m]=s.split("-").map(Number);return ym(new Date(y,m-1+n,1))}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function asArray(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);return Object.values(v)}
function normalizeEvent(e){const title=e.title||e.name||e.eventName||e.event||e.placeName||"";const start=String(e.date||e.startDate||e.start||e.eventDate||e.from||"").slice(0,10);const end=String(e.dateEnd||e.endDate||e.end||e.to||start).slice(0,10);if(!title||!/^\d{4}-\d{2}-\d{2}$/.test(start))return null;return{title,start,end:/^\d{4}-\d{2}-\d{2}$/.test(end)?end:start}}
function mergeEvents(arr){const m={};mainEvents.concat(arr||[]).map(normalizeEvent).filter(Boolean).forEach(e=>m[e.start+"|"+e.end+"|"+e.title]=e);mainEvents=Object.values(m)}function eventsOn(ds){return mainEvents.filter(e=>e.start<=ds&&e.end>=ds).map(e=>e.title)}
function syncMainEvents(){mainEvents=[];const paths=["fujiwara/events","fujiwara/main/events","fujiwara/main_app/events","events"];let n=0;paths.forEach(p=>db.ref(p).once("value").then(s=>mergeEvents(asArray(s.val()))).finally(()=>{if(++n===paths.length)renderCal()}))}
function showNew(){listSection.classList.add("hidden");newSection.classList.remove("hidden");newTitle.value="";newMonth.value=ym(new Date())}function cancelNew(){newSection.classList.add("hidden");listSection.classList.remove("hidden")}
function createPlan(){const t=newTitle.value.trim(),m=newMonth.value;if(!t||!m)return alert("取引先／題名と対象月を入力してください");const r=db.ref(ROOT).push();r.set({title:t,month:m,days:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}).then(()=>openPlan(r.key))}
function openPlan(id){currentId=id;current=JSON.parse(JSON.stringify(plans[id]||{}));current.days=current.days||{};titleInput.value=current.title||"";editMonth.value=current.month||ym(new Date());listSection.classList.add("hidden");newSection.classList.add("hidden");editorSection.classList.remove("hidden");renderCal()}
function backList(){editorSection.classList.add("hidden");listSection.classList.remove("hidden");currentId=""}
function savePlan(){current.title=titleInput.value.trim()||"出欠予定表";current.month=editMonth.value;current.updatedAt=new Date().toISOString();db.ref(ROOT+"/"+currentId).set(current).then(()=>alert("保存しました"))}
function delPlan(id){if(confirm("削除しますか？"))db.ref(ROOT+"/"+id).remove()}
function printPlan(id){openPlan(id);setTimeout(()=>window.print(),120)}
function renderList(){const a=Object.entries(plans).map(([id,v])=>({id,...v})).sort((a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));savedList.innerHTML=a.length?a.map(x=>`<div class="item"><b>${esc(x.title||"")}</b><div class="small">${esc(x.month||"")}　最終更新：${esc(String(x.updatedAt||"").replace("T"," ").slice(0,16))}</div><div class="item-actions"><button onclick="openPlan('${x.id}')">開く</button><button onclick="openPlan('${x.id}')">編集</button><button onclick="printPlan('${x.id}')">PDF</button><button class="redbtn" onclick="delPlan('${x.id}')">削除</button></div></div>`).join(""):'<div class="small">保存一覧はまだありません。</div>'}
function moveMonth(n){editMonth.value=addMonth(editMonth.value,n);current.month=editMonth.value;renderCal()}
function editDay(ds){editingDate=ds;tempMark=(current.days[ds]||{}).mark||"";noteInput.value=(current.days[ds]||{}).note||"";editDateTitle.textContent=ds+" の出欠予定";modalEvents.textContent=eventsOn(ds).length?"メイン予定："+eventsOn(ds).join(" / "):"メイン予定：なし";modal.classList.add("open")}function setMark(m){tempMark=m}function closeModal(){modal.classList.remove("open")}function saveDay(){const note=noteInput.value.trim();if(!tempMark&&!note)delete current.days[editingDate];else current.days[editingDate]={mark:tempMark,note};closeModal();renderCal()}
function nthMonday(y,m,n){const d=new Date(y,m-1,1);let c=0;while(d.getMonth()===m-1){if(d.getDay()===1&&++c===n)return d.getDate();d.setDate(d.getDate()+1)}}function vernal(y){return Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4))}function autumn(y){return Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4))}
function baseHol(y,m,d){const f={"1-1":1,"2-11":1,"2-23":1,"4-29":1,"5-3":1,"5-4":1,"5-5":1,"8-11":1,"11-3":1,"11-23":1};if(f[m+"-"+d])return true;if(m===1&&d===nthMonday(y,1,2))return true;if(m===7&&d===nthMonday(y,7,3))return true;if(m===9&&d===nthMonday(y,9,3))return true;if(m===10&&d===nthMonday(y,10,2))return true;if(m===3&&d===vernal(y))return true;if(m===9&&d===autumn(y))return true;return false}
function isHol(date){const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();if(baseHol(y,m,d))return true;const p=new Date(y,m-1,d-1),n=new Date(y,m-1,d+1);if(date.getDay()===1&&p.getDay()===0&&baseHol(p.getFullYear(),p.getMonth()+1,p.getDate()))return true;if(baseHol(p.getFullYear(),p.getMonth()+1,p.getDate())&&baseHol(n.getFullYear(),n.getMonth()+1,n.getDate()))return true;return false}
function cls(d){if(isHol(d))return"hol";if(d.getDay()===0)return"sun";if(d.getDay()===6)return"sat";return""}
function renderCal(){if(!currentId)return;current.title=titleInput.value||current.title;current.month=editMonth.value||current.month;title.textContent=current.title;const [y,m]=current.month.split("-").map(Number);mt.textContent=y+"年 "+m+"月";cal.innerHTML=["日","月","火","水","木","金","土"].map((x,i)=>`<div class="week ${i===0?"sun":i===6?"sat":""}">${x}</div>`).join("");const f=new Date(y,m-1,1),l=new Date(y,m,0);for(let i=0;i<f.getDay();i++)cal.insertAdjacentHTML("beforeend",'<div class="day"></div>');for(let d=1;d<=l.getDate();d++){const date=new Date(y,m-1,d),c=cls(date),ds=`${y}-${pad(m)}-${pad(d)}`,v=current.days[ds]||{},ev=eventsOn(ds);cal.insertAdjacentHTML("beforeend",`<div class="day ${c}" onclick="editDay('${ds}')"><div class="date ${c}">${d}</div>${ev.length?`<div class="screen-only-event">${ev.slice(0,3).map(e=>`<span class="event-chip">${esc(e)}</span>`).join("")}</div>`:""}<div class="note">${esc(v.note||"")}</div><div class="mark">${esc(v.mark||"")}</div></div>`)}}
async function migrateOld(){const list=await db.ref(ROOT).once("value");if(list.exists())return;const old=await db.ref(OLD).once("value");if(!old.exists())return;const x=old.val(),r=db.ref(ROOT).push();await r.set({title:x.title||"旧出欠予定表",month:x.editMonth||ym(new Date()),days:x.days||{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),migratedFrom:"attendancePlanDev"})}
titleInput.addEventListener("input",renderCal);editMonth.addEventListener("change",renderCal);firebase.database().ref(".info/connected").on("value",s=>{status.textContent=s.val()?"Firebase接続OK / 共有中":"通信確認中...";status.className="status "+(s.val()?"ok":"")});
migrateOld().finally(()=>{db.ref(ROOT).on("value",s=>{plans=s.val()||{};renderList()});syncMainEvents()});
</script></body></html>
