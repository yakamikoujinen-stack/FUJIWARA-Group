<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FKS Test Center v1.0</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7}
header{background:#111827;color:#fff;padding:20px;text-align:center}
main{max-width:1100px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:10px}
th{background:#f3f4f6}
button{background:#111827;color:#fff;border:0;padding:10px 16px;border-radius:10px}
textarea{width:100%;height:120px}
</style>
</head>
<body>
<header><h1>🧪 FKS Test Center v1.0</h1><p>相棒との総合動作チェック</p></header>
<main>
<div class="card">
<h2>テスト項目</h2>
<table>
<tr><th>項目</th><th>状態</th></tr>
<tr><td>Command Center</td><td><input type="checkbox"></td></tr>
<tr><td>Dashboard</td><td><input type="checkbox"></td></tr>
<tr><td>Daily Brief</td><td><input type="checkbox"></td></tr>
<tr><td>Analytics</td><td><input type="checkbox"></td></tr>
<tr><td>会計</td><td><input type="checkbox"></td></tr>
<tr><td>建設</td><td><input type="checkbox"></td></tr>
<tr><td>イベント</td><td><input type="checkbox"></td></tr>
<tr><td>在庫</td><td><input type="checkbox"></td></tr>
<tr><td>車両・工具</td><td><input type="checkbox"></td></tr>
<tr><td>権限管理</td><td><input type="checkbox"></td></tr>
</table>
</div>

<div class="card">
<h2>修正メモ</h2>
<p>動作確認しながら気付いたことを書き残します。</p>
<textarea id="memo"></textarea><br><br>
<button onclick="save()">メモ保存</button>
<button onclick="load()">読込</button>
</div>

<div class="card">
<h2>進捗</h2>
<p id="status">総合テスト開始前</p>
</div>
</main>
<script>
function save(){
 localStorage.setItem("fks_test_memo",memo.value);
 status.textContent="保存しました："+new Date().toLocaleString();
}
function load(){
 memo.value=localStorage.getItem("fks_test_memo")||"";
 status.textContent="メモを読み込みました";
}
load();
</script>
</body></html>
