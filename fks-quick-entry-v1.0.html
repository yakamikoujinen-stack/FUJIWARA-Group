<!DOCTYPE html><html lang='ja'><head><meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>FKS Quick Entry v1.0</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1220;color:#fff}
header{background:#111827;padding:18px;text-align:center}
main{max-width:760px;margin:auto;padding:16px}
.card{background:#1f2937;border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #555}
button{padding:12px 18px;border:0;border-radius:10px;font-weight:bold}
.save{background:#d4af37}
</style></head><body>
<header><h1>⚡ FKS Quick Entry v1.0</h1><p>30秒入力画面</p></header>
<main>
<div class='card'>
<div class='grid'>
<div><label>🎪 イベント売上</label><input id='eventSales' type='number'></div>
<div><label>💰 入金</label><input id='cashIn' type='number'></div>
<div><label>💸 支払</label><input id='cashOut' type='number'></div>
<div><label>📦 在庫増減（±）</label><input id='stockMove' type='number' value='0'></div>
<div><label>⛽ 給油メモ</label><input id='fuel'></div>
<div><label>📝 今日のメモ</label><input id='memo'></div>
</div>
<br><button class='save' onclick='saveAll()'>💾 一括保存</button>
<p id='msg'></p>
</div>
<div class='card'>
<h3>保存先</h3>
<ul>
<li>イベント売上 → fks_event</li>
<li>入金 → fks_accounting.cash</li>
<li>支払 → fks_payments</li>
<li>メモ → fks_quick_entry_log</li>
</ul>
</div>
</main>
<script>
function g(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
function s(k,v){localStorage.setItem(k,JSON.stringify(v));localStorage.setItem("fks_last_saved",new Date().toLocaleString())}
function saveAll(){
 let ev=g("fks_event",{sales:0,expense:0,profit:0});
 ev.sales=Number(ev.sales||0)+Number(eventSales.value||0);
 s("fks_event",ev);
 let ac=g("fks_accounting",{sales:0,expense:0,cash:0});
 ac.cash=Number(ac.cash||0)+Number(cashIn.value||0)-Number(cashOut.value||0);
 s("fks_accounting",ac);
 let pay=g("fks_payments",[]);
 if(Number(cashOut.value||0)>0) pay.push({amount:Number(cashOut.value),done:true,date:new Date().toLocaleDateString()});
 s("fks_payments",pay);
 let log=g("fks_quick_entry_log",[]);
 log.unshift({date:new Date().toLocaleString(),eventSales:eventSales.value,cashIn:cashIn.value,cashOut:cashOut.value,stockMove:stockMove.value,fuel:fuel.value,memo:memo.value});
 s("fks_quick_entry_log",log);
 msg.textContent="✅ 保存しました";
}
</script></body></html>
