:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#16273a;background:#eef3f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#1769a6;color:white;font-weight:750}button.secondary{background:#e7edf4;color:#203954}button.danger{background:#fce9e9;color:#a52424}button:disabled{opacity:.4}input,select,textarea{border:1px solid #c8d5e3;border-radius:8px;padding:9px;max-width:100%;background:white;width:100%}textarea{min-height:76px;resize:vertical}label{display:block;font-size:13px;font-weight:750;color:#405873;margin:10px 0 4px}header{padding:18px 20px;background:linear-gradient(115deg,#0d3159,#175c97);color:white}header h1{margin:0;font-size:clamp(19px,3vw,28px)}header p{margin:5px 0 0;color:#d5e5f6;font-size:13px}.shell{max-width:1280px;margin:auto;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar .push{margin-left:auto}.cols{display:grid;grid-template-columns:280px 1fr;gap:15px}.panel{background:white;border:1px solid #d9e2eb;border-radius:15px;padding:15px;box-shadow:0 3px 14px #1f456712}.panel h2{font-size:17px;margin:0 0 10px}.project{display:block;text-align:left;width:100%;margin:7px 0;background:#f3f7fc;color:#244564;border:1px solid transparent}.project.active{background:#dfeeff;border-color:#548bc4}.project small{font-weight:400;display:block;margin-top:3px}.topgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.badge{border-radius:15px;padding:5px 9px;font-size:12px;background:#e7f2fd;color:#10518a;display:inline-block}.status{background:#f0f4f9;padding:12px;border-radius:12px;margin-bottom:14px}.board{display:grid;gap:12px}.step{position:relative;border-radius:13px;border:2px solid #c8dcf0;background:#f9fcff;padding:15px;break-inside:avoid}.step:after{content:'↓';position:absolute;left:50%;bottom:-25px;color:#337cb3;font-weight:900;font-size:23px;z-index:1}.step:last-child:after{display:none}.step.start{border-color:#64a1da;background:#eff7ff}.step.decision{border-color:#e8ad59;background:#fff8eb}.step.goal{border-color:#6dbb87;background:#eefbf2}.step h3{margin:5px 0 10px;font-size:17px}.step p{margin:5px 0;font-size:14px;white-space:pre-wrap}.k{font-size:12px;color:#4a6078;font-weight:bold}.stephead{display:flex;align-items:center;gap:9px;justify-content:space-between;flex-wrap:wrap}.stepactions{display:flex;gap:5px;flex-wrap:wrap}.stepactions button{font-size:12px;padding:6px 8px}.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:11px 0}.branch{background:#fff;border:1px dashed #e1ad55;padding:10px;border-radius:9px;white-space:pre-wrap;font-size:13px}.branch b{display:block;color:#9d6313;margin-bottom:5px}.pic{width:100%;height:auto;max-height:240px;object-fit:contain;border-radius:9px;margin-top:9px;background:#f4f6f8}.stepicon{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #d7e1ec;padding:8px 10px;border-radius:12px;margin:8px 0 10px;width:max-content;max-width:100%}.stepicon .emoji{font-size:28px;line-height:1}.stepicon .txt b{display:block;font-size:13px;color:#173858}.stepicon .txt small{display:block;font-size:11px;color:#5c738c}.iconpicker{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:6px}.iconbtn{background:#f6f9fc;color:#173858;border:1px solid #d9e2eb;border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;line-height:1.2}.iconbtn .emoji{display:block;font-size:24px;margin-bottom:5px}.iconbtn.active{background:#dff0ff;border-color:#5495d2;box-shadow:inset 0 0 0 2px #7cb4e6}.iconcurrent{margin-top:6px;font-size:12px;color:#5e748d}.iconcurrent b{color:#163553}.quicklegend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.legendpill{display:inline-flex;align-items:center;gap:5px;background:#eef4fa;border:1px solid #d7e1ec;border-radius:999px;padding:5px 8px;font-size:12px;color:#29445f}.legendpill span{font-size:16px}dialog{border:0;border-radius:17px;padding:20px;width:min(650px,94vw);max-height:90vh;overflow:auto;box-shadow:0 12px 80px #162b4966}dialog::backdrop{background:#08192caa}dialog h2{margin:0 0 12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.hint{color:#59718b;font-size:12px}.empty{padding:28px;text-align:center;color:#71859b}.progress{height:9px;background:#dae5ef;border-radius:9px;overflow:hidden}.progress span{display:block;background:#42aa78;height:100%;transition:width .2s}.mini{font-size:13px}.footnote{font-size:12px;color:#64748b}.controls{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:15px}.photoadd{max-width:230px}.check{display:flex;align-items:center;gap:8px;font-size:13px}.check input{width:auto}.printhead{display:none}@media(max-width:750px){.cols,.topgrid,.formgrid{grid-template-columns:1fr}.shell{padding:10px}.panel{padding:11px}.toolbar .push{margin-left:0}}@media print{body{background:white}.hideprint,.sidebar,dialog,button{display:none!important}.cols{display:block}.shell{padding:0;max-width:none}.panel{border:0;box-shadow:none}.step{page-break-inside:avoid;print-color-adjust:exact;-webkit-print-color-adjust:exact;margin-bottom:15px}.step:after{display:none}.printhead{display:block}header{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><header><h1>👑 FUJIWARA 段取り・作戦ボード</h1><p>まず何をする？ なぜ？ 誰が？ できないときは？ 最後のOKまで一枚で。</p><div class="quicklegend" style="padding:10px 20px 0;max-width:1280px;margin:auto"><span class="legendpill"><span>🚚</span>車両</span><span class="legendpill"><span>👤</span>担当者</span><span class="legendpill"><span>📦</span>荷物</span><span class="legendpill"><span>📍</span>場所</span><span class="legendpill"><span>📞</span>問い合わせ</span><span class="legendpill"><span>⚠️</span>トラブル</span><span class="legendpill"><span>✅</span>完了</span><span class="legendpill"><span>🏯</span>会場</span></div></header><div class="shell"><div class="toolbar hideprint"><button id="newProject">＋ 新しい作戦</button><button class="secondary" id="addStep">＋ 段取り追加</button><button class="secondary" id="loadDemo">10/3〜11の見本</button><span class="push"></span><button class="secondary" id="export">バックアップ保存</button><button class="secondary" id="importBtn">読込</button><button class="secondary" onclick="window.print()">🖨 印刷／PDF</button><input id="importFile" type="file" accept="application/json" hidden></div><div class="cols"><aside class="panel sidebar"><h2>📁 作戦一覧</h2><div id="projects"></div><div class="footnote">この試作版は、この端末・ブラウザ内に保存します。別端末との自動同期はまだありません。バックアップで移行できます。</div></aside><main class="panel"><div id="main"></div></main></div></div>
<dialog id="projectDialog"><h2>作戦の設定</h2><form id="projectForm"><label>作戦名</label><input name="title" required placeholder="例：10/4 鳥取城の出店段取り"><div class="formgrid"><div><label>開始日</label><input type="date" name="date"></div><div><label>場所・イベント</label><input name="place" placeholder="鳥取城"></div></div><label>達成すべき最終目標</label><textarea name="goal" placeholder="例：2台で出店し、全車両の移動を完了"></textarea><label>全体のメモ</label><textarea name="memo" placeholder="共有する注意事項、決定待ち事項など"></textarea><div class="controls"><button type="button" class="secondary" onclick="projectDialog.close()">キャンセル</button><button type="submit">保存する</button></div></form></dialog>
<dialog id="stepDialog"><h2 id="stepDialogTitle">段取り追加</h2><form id="stepForm"><div class="formgrid"><div><label>種類</label><select name="type"><option value="start">🟦 段取り・実行</option><option value="decision">🟨 判断・打合せ・代替案</option><option value="goal">🟩 最終完了</option></select></div><div><label>日付／時刻</label><input name="when" placeholder="例：10/4 8:15"></div><div class="full"><label>何をする？</label><input name="title" required placeholder="例：ホテルをキャラバンで出発"></div><div><label>誰が？</label><input name="who" placeholder="例：藤原、スタッフA"></div><div><label>どこで？</label><input name="where" placeholder="例：コンセプト"></div><div class="full"><label>なぜ？ 目的・理由</label><textarea name="why"></textarea></div><div class="full"><label>実施内容・持ち物・確認事項</label><textarea name="details"></textarea></div><div class="full"><label>簡単イラスト（選ぶだけ）</label><input type="hidden" name="icon"><div id="iconPicker" class="iconpicker"></div><div id="iconCurrent" class="iconcurrent">未選択</div><p class="hint">車両・担当者・荷物・トラブルなど、段取りに合うイラストを1つ選べます。</p></div><div class="full"><label>A案（通常の進め方）</label><textarea name="planA"></textarea></div><div class="full"><label>B案（できないときの代替案）</label><textarea name="planB"></textarea></div><div><label>打合せ・問い合わせ先</label><input name="contact" placeholder="例：現地責任者"></div><div><label>判断する人・期限</label><input name="deadline" placeholder="例：藤原・前日まで"></div><div class="full"><label>参考写真・出店形態のイメージ（端末から）</label><input name="image" type="file" accept="image/*"><p class="hint">写真は小さくして端末内に保存。重要な原本は別途保管してください。</p><div id="imageExisting"></div></div></div><label class="check"><input type="checkbox" name="done"> この段取りは完了済み</label><div class="controls"><button type="button" class="secondary" onclick="stepDialog.close()">キャンセル</button><button type="submit">保存する</button></div></form></dialog>
<script>
const KEY='fujiwara_sakusen_board_v2';const $=id=>document.getElementById(id);const ILLUSTRATIONS=[{id:'truck',emoji:'🚚',label:'車両'},{id:'van',emoji:'🚐',label:'キャラバン'},{id:'person',emoji:'👤',label:'担当者'},{id:'group',emoji:'👥',label:'スタッフ'},{id:'box',emoji:'📦',label:'荷物'},{id:'map',emoji:'📍',label:'場所'},{id:'phone',emoji:'📞',label:'問い合わせ'},{id:'warn',emoji:'⚠️',label:'トラブル'},{id:'ok',emoji:'✅',label:'完了'},{id:'food',emoji:'🍟',label:'出店ネタ'},{id:'tent',emoji:'⛺',label:'テント'},{id:'castle',emoji:'🏯',label:'会場'},{id:'hotel',emoji:'🏨',label:'ホテル'},{id:'repair',emoji:'🔧',label:'修理'},{id:'idea',emoji:'💡',label:'打合せ'}];let data={projects:[],selected:null};let editingProject=null,editingStep=null;function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('端末の保存容量が不足しています。写真を減らすか、バックアップしてください。')}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.projects))data=x}catch(e){}if(!data.projects.length){data.projects=[{id:uid(),title:'はじめての作戦',date:'',place:'',goal:'最後のOKを決める',memo:'「10/3〜11の見本」で実際の段取りを取り込めます。',steps:[]}];data.selected=data.projects[0].id;save()}if(!data.projects.some(p=>p.id===data.selected))data.selected=data.projects[0].id}const current=()=>data.projects.find(p=>p.id===data.selected);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function multiline(s){return esc(s).replace(/\n/g,'<br>')}function iconMeta(id){return ILLUSTRATIONS.find(x=>x.id===id)||null}function guessIcon(step){const t=[step.title,step.where,step.why,step.details].join(' ');if(/ホテル/.test(t))return 'hotel';if(/キャラバン/.test(t))return 'van';if(/軽キッチンカー|レコアズ|幸甚縁|キッチンカー/.test(t))return 'truck';if(/鳥取城|諸寄|会場/.test(t))return 'castle';if(/修理/.test(t))return 'repair';if(/打合せ|相談|確認/.test(t))return 'idea';if(/問い合わせ|連絡/.test(t))return 'phone';if(/荷物|積み替え|積替え/.test(t))return 'box';if(/トラブル|代替/.test(t))return 'warn';if(/出店|メニュー|販売/.test(t))return 'food';if(step.type==='goal')return 'ok';if(step.type==='decision')return 'idea';return ''}function iconHtml(id,step){let m=iconMeta(id||guessIcon(step||{}));return m?`<div class="stepicon"><div class="emoji">${m.emoji}</div><div class="txt"><b>${m.label}</b><small>簡単イラスト</small></div></div>`:''}function renderIconPicker(selected=''){const box=$('iconPicker');if(!box)return;box.innerHTML=ILLUSTRATIONS.map(x=>`<button type="button" class="iconbtn ${selected===x.id?'active':''}" data-icon="${x.id}"><span class="emoji">${x.emoji}</span>${x.label}</button>`).join('')+`<button type="button" class="iconbtn ${!selected?'active':''}" data-icon=""><span class="emoji">✖️</span>なし</button>`;box.querySelectorAll('.iconbtn').forEach(btn=>btn.onclick=()=>setIcon(btn.dataset.icon));setIcon(selected,false)}function setIcon(id,refresh=true){const input=$('stepForm').elements.icon;input.value=id||'';if(refresh){$('iconPicker').querySelectorAll('.iconbtn').forEach(b=>b.classList.toggle('active',b.dataset.icon===input.value || (!input.value && b.dataset.icon==='')))}const cur=$('iconCurrent');const m=iconMeta(input.value);cur.innerHTML=m?`選択中：<b>${m.emoji} ${m.label}</b>`:'未選択'}function render(){let p=current();$('projects').innerHTML=data.projects.map(x=>`<button class="project ${x.id===data.selected?'active':''}" data-id="${x.id}">${esc(x.title)}<small>${esc(x.date)} ${esc(x.place)} · ${(x.steps||[]).length}工程</small></button>`).join('');document.querySelectorAll('.project').forEach(b=>b.onclick=()=>{data.selected=b.dataset.id;save();render()});if(!p){$('main').innerHTML='<div class="empty">「新しい作戦」を追加してください</div>';return}let steps=p.steps||[],done=steps.filter(s=>s.done).length;let cards=steps.map((s,i)=>{let cls=s.type==='decision'?'decision':s.type==='goal'?'goal':'start';let lines=[['日時',s.when],['担当',s.who],['場所',s.where],['目的',s.why],['作業・確認',s.details],['打合せ・問い合わせ',s.contact],['判断者・期限',s.deadline]].filter(a=>a[1]).map(a=>`<p><span class="k">${a[0]}：</span>${multiline(a[1])}</p>`).join('');let branches=(s.planA||s.planB)?`<div class="branches">${s.planA?`<div class="branch"><b>✅ A案・通常</b>${multiline(s.planA)}</div>`:''}${s.planB?`<div class="branch"><b>🔄 B案・代替</b>${multiline(s.planB)}</div>`:''}</div>`:'';return `<article class="step ${cls}"><div class="stephead"><span class="badge">${i+1} ${s.type==='decision'?'判断・代替案':s.type==='goal'?'最終OK':'実施'}</span><span class="stepactions hideprint"><button class="secondary" data-act="up" data-id="${s.id}" ${i===0?'disabled':''}>↑</button><button class="secondary" data-act="down" data-id="${s.id}" ${i===steps.length-1?'disabled':''}>↓</button><button data-act="edit" data-id="${s.id}">編集</button><button class="danger" data-act="del" data-id="${s.id}">削除</button></span></div><h3>${s.done?'✅':'⬜'} ${esc(s.title)}</h3>${iconHtml(s.icon,s)}${lines}${branches}${s.image?`<img class="pic" src="${s.image}" alt="${esc(s.title)}の写真">`:''}<label class="check hideprint"><input type="checkbox" data-act="done" data-id="${s.id}" ${s.done?'checked':''}> 完了</label></article>`}).join('');$('main').innerHTML=`<div class="status"><div class="stephead"><div><span class="badge">${esc(p.date||'日程未設定')}</span> <span class="badge">${esc(p.place||'場所未設定')}</span><h2 style="margin:10px 0">${esc(p.title)}</h2></div><span class="stepactions hideprint"><button class="secondary" id="editProject">作戦編集</button><button class="danger" id="deleteProject">削除</button></span></div><p><b>🎯 最終目標：</b>${multiline(p.goal||'未設定')}</p>${p.memo?`<p class="mini">📝 ${multiline(p.memo)}</p>`:''}<div class="progress"><span style="width:${steps.length?100*done/steps.length:0}%"></span></div><p class="mini">完了 ${done} / ${steps.length} 工程</p></div><h2>🧭 段取りフロー</h2><div class="board">${cards||'<div class="empty">「＋ 段取り追加」から開始しましょう。</div>'}</div>`;$('editProject').onclick=()=>openProject(p.id);$('deleteProject').onclick=()=>{if(!confirm('この作戦を削除しますか？'))return;data.projects=data.projects.filter(x=>x.id!==p.id);data.selected=data.projects[0]?.id||null;save();render()};$('main').querySelectorAll('[data-act]').forEach(el=>{let act=el.dataset.act,id=el.dataset.id;if(act==='done')el.onchange=e=>{p.steps.find(s=>s.id===id).done=e.target.checked;save();render()};else el.onclick=()=>{let i=p.steps.findIndex(s=>s.id===id);if(act==='edit')openStep(id);if(act==='del'&&confirm('この工程を削除しますか？'))p.steps.splice(i,1);if(act==='up'&&i>0)[p.steps[i-1],p.steps[i]]=[p.steps[i],p.steps[i-1]];if(act==='down'&&i<p.steps.length-1)[p.steps[i+1],p.steps[i]]=[p.steps[i],p.steps[i+1]];save();render()}})}
function fill(form,obj){Array.from(form.elements).forEach(e=>{if(!e.name||e.type==='file')return;if(e.type==='checkbox')e.checked=!!obj[e.name];else e.value=obj[e.name]??''})}function getFields(form){let o={};Array.from(form.elements).forEach(e=>{if(!e.name||e.type==='file')return;o[e.name]=e.type==='checkbox'?e.checked:e.value.trim()});return o}function openProject(id){editingProject=id||null;fill($('projectForm'),id?data.projects.find(p=>p.id===id):{});$('projectDialog').showModal()}$('newProject').onclick=()=>openProject();$('projectForm').onsubmit=e=>{e.preventDefault();let o=getFields(e.target);if(editingProject)Object.assign(data.projects.find(p=>p.id===editingProject),o);else{let p={id:uid(),...o,steps:[]};data.projects.unshift(p);data.selected=p.id}save();render();$('projectDialog').close()};function openStep(id){editingStep=id||null;let p=current();let s=id?p.steps.find(x=>x.id===id):{};fill($('stepForm'),s);renderIconPicker(s.icon||'');$('stepForm').elements.image.value='';$('imageExisting').innerHTML=s.image?'<small>写真登録済み（新しい写真を選ぶと差し替え）</small>':'';$('stepDialogTitle').textContent=id?'段取りを編集':'段取りを追加';$('stepDialog').showModal()}$('addStep').onclick=()=>openStep();async function shrink(file){return new Promise((resolve,reject)=>{let image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{let ratio=Math.min(1,1200/image.width,900/image.height);let canvas=document.createElement('canvas');canvas.width=Math.round(image.width*ratio);canvas.height=Math.round(image.height*ratio);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.72))};image.onerror=reject;image.src=url})}$('stepForm').onsubmit=async e=>{e.preventDefault();let o=getFields(e.target);let p=current();if(editingStep){let old=p.steps.find(x=>x.id===editingStep);o.image=old.image||null;Object.assign(old,o)}else{let s={id:uid(),...o,image:null};p.steps.push(s)}let target=editingStep?p.steps.find(x=>x.id===editingStep):p.steps[p.steps.length-1];let f=e.target.elements.image.files[0];if(f)try{target.image=await shrink(f)}catch(err){alert('画像を読み込めませんでした')}save();render();$('stepDialog').close()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FUJIWARA-作戦ボード-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.projects)||!x.projects.every(p=>p.id&&Array.isArray(p.steps)))throw Error('形式が違います');if(!confirm('現在の作戦一覧をバックアップファイルで置き換えますか？'))return;data={projects:x.projects,selected:x.selected};if(!data.projects.some(p=>p.id===data.selected))data.selected=data.projects[0]?.id||null;save();render()}catch(err){alert('読み込みに失敗しました：'+err.message)}e.target.value=''};
