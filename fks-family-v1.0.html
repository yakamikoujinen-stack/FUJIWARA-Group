<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>FKS Family v1.0</title><style>body{margin:0;font-family:-apple-system,sans-serif;background:#f5f7fb}header{background:#6d28d9;color:#fff;padding:16px}h1{margin:0;font-size:22px}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}textarea{min-height:70px}button{width:100%;padding:12px;border:0;border-radius:12px;background:#6d28d9;color:#fff;font-weight:700}.item{border:1px solid #ddd;border-radius:10px;padding:10px;margin-top:8px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><header><h1>👨‍👩‍👧 FKS Family v1.0</h1></header><div class='wrap'><div class='card'><h3>家族予定</h3><div class='row'><input id='d' type='date'><input id='t' placeholder='予定タイトル'></div><textarea id='m' placeholder='内容'></textarea><button onclick='add()'>保存</button></div><div class='card'><h3>買い物リスト</h3><input id='buy' placeholder='追加'><button onclick='addBuy()'>追加</button><div id='buylist'></div></div><div class='card'><h3>家族共有</h3><div id='list'></div></div></div><script>let db=JSON.parse(localStorage.getItem('fks_family_v1')||'{"plans":[],"buy":[]}');d.valueAsDate=new Date();function save(){localStorage.setItem('fks_family_v1',JSON.stringify(db));render()}function add(){if(!t.value)return;db.plans.unshift({d:d.value,t:t.value,m:m.value});t.value='';m.value='';save()}function addBuy(){if(!buy.value)return;db.buy.push(buy.value);buy.value='';save()}function del(i){db.plans.splice(i,1);save()}function delBuy(i){db.buy.splice(i,1);save()}function render(){list.innerHTML=db.plans.map((x,i)=>`<div class=item><b>${x.d} ${x.t}</b><p>${x.m}</p><button onclick='del(${i})'>削除</button></div>`).join('')||'予定なし';buylist.innerHTML=db.buy.map((x,i)=>`<div class=item>${x}<button onclick='delBuy(${i})'>削除</button></div>`).join('')||'買い物なし'}render();</script></body></html>
