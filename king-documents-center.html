<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>見積書・請求書</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#17324d,#2c6495);color:#fff;border-radius:22px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{background:#fff;border-radius:18px;padding:16px;border:1px solid #e2e8f0}.btn{display:inline-block;background:#1f6feb;color:#fff;text-decoration:none;padding:10px 13px;border-radius:10px;font-weight:900}.item{padding:10px 0;border-top:1px solid #e2e8f0}.meta{font-size:12px;color:#64748b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="hero"><h1>📄 見積書・請求書</h1><p>KING用 書類管理</p></section><div class="grid"><section class="card"><h2>🧾 見積書</h2><a class="btn" href="conan_purchase_quote.html">新しい見積書</a><div id="quotes"></div></section><section class="card"><h2>📑 請求書</h2><a class="btn" href="fujiwara_invoice.html">新しい請求書</a><div id="invoices"></div></section></div></div><script>
function e(v){return String(v??'').replace(/[&<>"]/g,'')}function r(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(x){return[]}}function render(){const q=r('fujiwara_quote_archive_v1'),i=r('fujiwara_invoice_archive_v1');quotes.innerHTML=q.length?q.map(x=>`<div class="item"><b>${e(x.project||x.subject||'見積書')}</b><div>${e(x.totalText||'')}</div><div class="meta">${e(x.recipient||'')} / ${new Date(x.savedAt).toLocaleString('ja-JP')}</div></div>`).join(''):'<p class="meta">保存済み見積なし</p>';invoices.innerHTML=i.length?i.map(x=>`<div class="item"><b>${e(x.project||x.subject||'請求書')}</b><div>${e(x.totalText||'')}</div><div class="meta">${e(x.recipient||'')} / ${new Date(x.savedAt).toLocaleString('ja-JP')}</div></div>`).join(''):'<p class="meta">保存済み請求書なし</p>'}render();
</script></body></html>
