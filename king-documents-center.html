<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>見積・請求管理｜FUJIWARA KING</title>
<style>
:root{--navy:#17324d;--gold:#c99a16;--blue:#1f6feb;--green:#3f7650;--bg:#f5f8fb;--line:#dfe6ee;--text:#15233f;--sub:#667085}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#eef5ff,#fff 50%,#fff8ea);color:var(--text)}
.wrap{max-width:980px;margin:auto;padding:16px 14px 90px}.head{background:linear-gradient(135deg,#17324d,#2b5d86);color:#fff;border-radius:24px;padding:20px;display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{margin:0;font-size:30px}.sub{margin-top:6px;color:#dcecff;font-weight:800}.back{border:0;border-radius:12px;padding:11px 14px;background:rgba(255,255,255,.16);color:#fff;font-weight:950}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;text-decoration:none;color:var(--text);box-shadow:0 12px 30px rgba(34,54,80,.1);display:flex;flex-direction:column;min-height:250px}
.card.estimate{border:2px solid #73a987;background:linear-gradient(135deg,#f7fff9,#edf8f0)}.card.invoice{border:2px solid #6fa5d8;background:linear-gradient(135deg,#f7fbff,#edf5ff)}
.icon{font-size:44px}.card h2{font-size:26px;margin:14px 0 8px}.card p{margin:0;color:var(--sub);line-height:1.7;font-weight:750;flex:1}.open{margin-top:18px;border-radius:14px;padding:14px;text-align:center;color:#fff;font-weight:950}.estimate .open{background:#3f7650}.invoice .open{background:#1f6feb}
.note{margin-top:16px;background:#fff8dd;border:1px solid #ead17d;border-radius:16px;padding:14px;font-weight:800;color:#705611}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<section class="head"><div><h1>📄 見積・請求管理</h1><div class="sub">見積書と請求書をここにまとめて管理</div></div><button class="back" onclick="location.href='king-money-center.html'">← お金・労務へ</button></section>
<section class="grid">
<a class="card estimate" href="fujiwara-estimate.html?new=1"><div class="icon">📝</div><h2>見積書</h2><p>品名・単位・数量・単価・金額・備考を入力し、印刷/PDF・保存・共有します。</p><div class="open">新しい見積書を作る ›</div></a>
<a class="card invoice" href="fujiwara-invoice.html?new=1"><div class="icon">🧾</div><h2>請求書</h2><p>既存のFUJIWARA請求書を正規版として使用。明細・消費税・合計・印刷/PDF・Firebase保存に対応。</p><div class="open">新しい請求書を作る ›</div></a>
</section>
<div class="note">元の請求書アプリのFirebase保存先・入力機能を残し、見積書は別保存領域に分離しています。</div>
</main></body></html>
