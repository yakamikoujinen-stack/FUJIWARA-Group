<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>見積書・請求書</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#17324d,#2c6495);color:#fff;border-radius:22px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{background:#fff;border-radius:18px;padding:16px;border:1px solid #e2e8f0}.btn{display:inline-block;background:#1f6feb;color:#fff;text-decoration:none;padding:10px 13px;border-radius:10px;font-weight:900}.item{padding:10px 0;border-top:1px solid #e2e8f0}.meta{font-size:12px;color:#64748b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head><body><div class="wrap"><section class="hero"><h1>📄 見積書・請求書</h1><p>KING用 書類管理</p><button onclick="render()" style="border:0;border-radius:10px;padding:9px 12px;font-weight:900">🔄 保存一覧を更新</button></section><div class="grid"><section class="card"><h2>🧾 見積書</h2><a class="btn" href="conan_purchase_quote.html?new=1">新しい見積書</a><div id="quotes"></div></section><section class="card"><h2>📑 請求書</h2><a class="btn" href="fujiwara_invoice.html?new=1">新しい請求書</a><div id="invoices"></div></section></div><section class="card" style="margin-top:14px"><h2>🏗 建設 月次請求</h2><p class="meta">建設アプリのFirebase日報から、取引先・月別の請求書下書きを作ります。</p><a class="btn" href="construction-monthly-invoice.html">建設の月次請求を作る</a></section></div><script>
const firebaseConfig={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94",measurementId:"G-1VHX1GQV0C"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.database(), DOC_BASE='fujiwara/documents';

function e(v){return String(v??'').replace(/[&<>"]/g,'')}
function readLocal(k){try{const a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch(x){return[]}}
function vals(v){return v?Object.values(v):[]}
function sortSaved(a){return a.sort((x,y)=>String(y.savedAt||'').localeCompare(String(x.savedAt||'')))}
function fmtDate(v){try{return new Date(v).toLocaleString('ja-JP')}catch(e){return v||''}}

function renderLists(q,i,shared){
  quotes.innerHTML=q.length?q.map(x=>`<div class="item"><b>${e(x.project||x.subject||'見積書')}</b><div>${e(x.totalText||'')}</div><div class="meta">${e(x.recipient||'')} / 保存 ${fmtDate(x.savedAt)} ${shared?'☁️共有':''}</div></div>`).join(''):'<p class="meta">保存済み見積なし</p>';
  invoices.innerHTML=i.length?i.map(x=>`<div class="item"><b>${e(x.project||x.subject||'請求書')}</b><div>${e(x.totalText||'')}</div><div class="meta">${e(x.recipient||'')} / 保存 ${fmtDate(x.savedAt)} ${shared?'☁️共有':''}</div></div>`).join(''):'<p class="meta">保存済み請求書なし</p>';
}

function render(){
  Promise.all([
    db.ref(DOC_BASE+'/quotes').once('value'),
    db.ref(DOC_BASE+'/invoices').once('value')
  ]).then(([qs,is])=>{
    const q=sortSaved(vals(qs.val()));
    const i=sortSaved(vals(is.val()));
    renderLists(q,i,true);
  }).catch(()=>{
    renderLists(
      sortSaved(readLocal('fujiwara_quote_archive_v1')),
      sortSaved(readLocal('fujiwara_invoice_archive_v1')),
      false
    );
  });
}
db.ref(DOC_BASE+'/quotes').on('value',()=>render());
db.ref(DOC_BASE+'/invoices').on('value',()=>render());
render();
</script></body></html>
