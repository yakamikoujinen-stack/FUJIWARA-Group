</style></head><body><div class="wrap"><section class="hero"><h1>📋 コナンプロデュース様 発注（2026年度 秋）</h1><p>印刷された2枚の一覧表を元に復旧</p></section><section class="panel">
<div class="actions"><button class="primary" onclick="addRow()">＋ 行を追加</button><button onclick="sortRows()">↕ 日付順</button><button onclick="window.print()">🖨 印刷 / PDF</button><button onclick="csv()">⬇ CSV</button><button onclick="backup()">📦 バックアップ</button><label class="filebtn">📥 復元<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0]);this.value=''"></label></div>
<div id="status" class="status">自動保存ON</div><div class="note">写真から読めた印刷内容を復旧しています。手書きの売上・訂正は「内部メモ」に入力できます。内部メモは印刷時には非表示です。</div>
<div class="tablewrap"><table><thead><tr><th>✅</th><th>日付</th><th>イベント名</th><th>場所</th><th>出店アイテム</th><th class="internal">内部メモ</th><th class="del">削除</th></tr></thead><tbody id="tbody"></tbody></table></div></section></div>

<script>
const KEY='fujiwara_conan_order_2026_autumn_v1';const DEF=[["8/23(日)", "神鍋高原スイカ祭", "神鍋高原 道の駅", "チーズハットグ\n焼鳥", true], ["8/29(土)", "コムスエルムプラザ夏祭り", "三田市", "", false], ["9/12(土)", "JAパスカル三田初収穫祭", "三田市", "からあげ・ポテト\n？・蟹棒", true], ["9/19(土)", "香住ガニ祭り", "香住漁港西港上屋4号", "からあげ・ポテト・チーズハットグ・かに棒", true], ["10/4(日)", "伊賀市国際交流フェスタ", "伊賀ひぞっこPにて", "", false], ["10/10(土)", "日本製鉄(株)関西製鉄所", "尼崎市", "焼鳥　からあげ\nとんかつ", true], ["10/11(日)", "長尾熊野神社", "神戸市長田区", "たこ焼き　牛串　たん串\nポテト", true], ["10/17(土)", "JAパスカル三田 秋本裕収穫祭", "三田市", "", false], ["10/17(土)", "JA丹波ひかみ春日感謝祭", "丹波市春日IC", "からあげ・ハットグ\nチョコバナナ・いか焼", true], ["10/18(日)", "熊野神社秋祭り", "兵庫県仁川", "からあげ・ポテト・りんご飴", true], ["10/24(土)〜10/25(日)", "JAいがひぞっこ収穫祭", "三重県伊賀市", "", false], ["10/24(土)", "JA丹波ひかみ市島感謝祭", "丹波市春日IC", "からあげ・ポテト\nチョコバナナ・いか焼", true], ["10/25(日)", "コスムエルムプラザ秋祭り", "三田市", "", false], ["10/31(土)", "JA丹波ひかみ青垣感謝祭", "丹波市青垣IC", "からあげ・ポテト\nチョコバナナ・いか焼", true], ["10/25(日)", "神鍋高原マロニエ祭", "神鍋高原 道の駅", "", false], ["11/3(火)", "JA丹波ひかみ本店感謝祭", "丹波市氷上本店", "からあげ・ポテト\nチョコバナナ・いか焼", true], ["11/7(土)", "JAたじま和田山感謝祭", "朝来市", "からあげ　とんかつ", true], ["11/7(土)", "JA丹波ひかみ柏原感謝祭", "丹波市柏原IC", "からあげ・ポテト\nチョコバナナ・いか焼", true], ["11/?", "JAパスカル三田農業祭", "三田市", "", false], ["11/13(金)〜11/14(土)", "JA兵庫六甲 農機展示会", "神戸市北区八多町", "カステラ　たこ焼き", true], ["未定", "神鍋高原 ネギ祭り", "神鍋高原 道の駅", "", false], ["11/14(土)", "JA丹波ひかみ山南感謝祭", "丹波市山南支店", "からあげ・ポテト\nチョコバナナ・いか焼", true], ["11/14(土)", "JA兵庫西しそう", "宍粟市", "うどん　からあげ　ポテト", true], ["11/15(日)", "香住松葉ガニ祭り", "香住漁港西港上屋4号", "牛串　からあげ　ポテト\nりんご飴", true], ["11/21(土)", "JA兵庫西 佐用感謝祭", "姫路市", "①とんかつ　からあげ\n②フルーツ飴", true], ["11/21(土)", "JA兵庫六甲 道の駅淡河ふるさと祭", "神戸市北区淡河町", "たこ焼き　カステラ", true], ["12/2(水)〜12/3(木)", "全農兵庫 クボタアグリフェア", "三木市メッセ三木", "たこ焼き　カステラ", true], ["12/17(木)", "JA丹波ひかみ山南 年末感謝祭", "丹波市", "たこ焼き　だんご串\nカステラ", true], ["12/18(金)〜12/19(土)", "JAパスカル 三田感謝祭", "三田市", "からあげ　ポテト\nりんご飴", true], ["12/19(土)〜12/20(日)", "JAいがひぞっこ 周年祭", "三重県伊賀市", "りんご飴　カステラ\nからあげ　ポテト　豚焼き", true], ["なし？", "サンパレス六甲物産展", "西宮市山口町", "", false]];let rows=[];
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dc(v){v=String(v||'');if(/[（(]土[）)]/.test(v))return'sat';if(/[（(]日[）)]/.test(v))return'sun';return''}
function save(){localStorage.setItem(KEY,JSON.stringify({version:1,rows,updatedAt:new Date().toISOString()}));status.textContent='保存済み：'+new Date().toLocaleString('ja-JP')}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.rows)){rows=d.rows;return}}catch(x){}rows=DEF.map(r=>({date:r[0],event:r[1],place:r[2],item:r[3],ok:r[4],memo:''}));save()}
function render(){tbody.innerHTML=rows.map((r,i)=>`<tr><td class="chk"><input type="checkbox" ${r.ok?'checked':''} onchange="edit(${i},'ok',this.checked)"></td><td><input class="${dc(r.date)}" value="${e(r.date)}" oninput="this.className=dc(this.value);edit(${i},'date',this.value)"></td><td><textarea oninput="edit(${i},'event',this.value)">${e(r.event)}</textarea></td><td><textarea oninput="edit(${i},'place',this.value)">${e(r.place)}</textarea></td><td><textarea oninput="edit(${i},'item',this.value)">${e(r.item)}</textarea></td><td class="internal"><textarea placeholder="売上・訂正・メモ" oninput="edit(${i},'memo',this.value)">${e(r.memo||'')}</textarea></td><td class="del"><button class="danger" onclick="delRow(${i})">削除</button></td></tr>`).join('')}
function edit(i,k,v){rows[i][k]=v;save()}function addRow(){rows.push({date:'',event:'',place:'',item:'',ok:false,memo:''});save();render()}function delRow(i){if(!confirm('この行を削除しますか？'))return;rows.splice(i,1);save();render()}
function pd(s){const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})/);return m?+m[1]*100 + +m[2]:99999}function sortRows(){rows.sort((a,b)=>pd(a.date)-pd(b.date));save();render()}
function csv(){const d=[['✅','日付','イベント名','場所','出店アイテム','内部メモ'],...rows.map(r=>[r.ok?'✅':'',r.date,r.event,r.place,r.item,r.memo||''])];const s='\ufeff'+d.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const b=new Blob([s],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='コナンプロデュース発注2026秋.csv';a.click();URL.revokeObjectURL(a.href)}
function backup(){save();const b=new Blob([JSON.stringify({type:'fujiwara_conan_order_2026_autumn',rows},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='コナン発注2026秋バックアップ.json';a.click();URL.revokeObjectURL(a.href)}
function restore(f){if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!Array.isArray(d.rows))throw 0;const sig=x=>[x.date,x.event,x.place,x.item].join('|'),ex=new Set(rows.map(sig));let n=0;d.rows.forEach(r=>{if(!ex.has(sig(r))){rows.push(r);ex.add(sig(r));n++}});save();render();alert(n+'件を追加復元しました。現在のデータは残しています。')}catch(x){alert('復元できないファイルです。')}};fr.readAsText(f,'utf-8')}
load();render();
</script></body></html>
