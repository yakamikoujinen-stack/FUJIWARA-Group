<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>主力ネタ・サブネタ｜KING</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#eff9ff,#fff9ed);color:#102043}.wrap{max-width:1100px;margin:auto;padding:16px 16px 80px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:1px solid #d6a21c;background:#fff;border-radius:12px;padding:10px 14px;font-weight:900;color:#714e00}.primary{background:#d6a21c;color:#fff}.card{background:#fff;border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 10px 26px #38506b18}.note{font-size:12px;color:#66758a;font-weight:700;line-height:1.7}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input{border:1px solid #ccd8e6;border-radius:10px;padding:10px;font-size:15px;min-width:180px}.status{padding:10px;border-radius:10px;background:#eef8ff;font-weight:800;font-size:12px;margin-top:10px}.invstatus{padding:9px 10px;border-radius:10px;background:#f5fff5;border:1px solid #cfe8cf;font-weight:800;font-size:12px;margin-top:8px}.sectionTitle{font-size:20px;font-weight:950;margin:4px 0 10px}.mainGrid,.subGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.item{border:1px solid #dfe7ef;border-radius:15px;padding:12px;background:#fff}.mainItem{background:#fff8dc}.itemName{font-size:17px;font-weight:950}.subItem{background:#f7fbff;border-color:#bdd6ee}.stock{font-size:12px;color:#24602f;margin-top:5px}.meta{font-size:10px;color:#65758a;margin-top:3px;line-height:1.5}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.mini{border:1px solid #ccd8e6;background:#fff;border-radius:9px;padding:6px 8px;font-weight:800}.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:900;margin-bottom:6px}.bmain{background:#ffe7a2;color:#654800}.bsub{background:#dff0ff;color:#15517c}@media(max-width:600px){.head h1{font-size:21px}.mainGrid,.subGrid{grid-template-columns:1fr}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><div class="wrap"><div class="head"><button class="btn" onclick="location.href='king.html'">‹ KINGへ戻る</button><h1>🍳 主力ネタ・サブネタ</h1><span></span></div><div class="card"><b>👑 KING専用 主力ネタ管理</b><div class="note"><b>主力ネタ</b>はKINGで追加・名称変更・削除・並び替えします。<br><b>サブネタ</b>は担当者アプリの在庫管理に登録されている品目のうち、主力ネタと同名の品目を除いたものを自動表示します。サブネタはここでは編集しません。</div><div class="toolbar"><input id="newMain" placeholder="新しい主力ネタ"><button class="btn primary" onclick="addMain()">＋ 主力ネタ追加</button></div><div id="status" class="status">主力ネタ読込中...</div><div id="invstatus" class="invstatus">📦 在庫管理読込中...</div></div><div class="card"><div class="sectionTitle">🟥 主力ネタ</div><div id="mainList" class="mainGrid"></div></div><div class="card"><div class="sectionTitle">🟦 サブネタ <span id="subCount" style="font-size:12px;color:#66758a"></span></div><div class="note">担当者アプリの在庫管理から自動反映。主力ネタと同名の在庫品目は、この一覧から自動的に除外します。</div><div id="subList" class="subGrid"></div></div></div><script>
var cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:5ec6b7e2a2165066956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);var db=firebase.database(),ref=db.ref('fujiwara/netaMaster'),data=[],invItems=[];
var mainDefaults=['焼きそば・ホルそば','串','かき氷','チーズハットグ','かまぼこ','いか焼き','ポテト','かすてら','コットンキャンディ','だんご','肉巻きおにぎり','らーめん','チョコバナナ','とんかつスティック','からあげ','10円パン'];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[c]))}function key(s){return String(s||'').normalize('NFKC').replace(/[\s　・]/g,'').replace(/[（）]/g,c=>c==='（'?'(':')').toLowerCase()}function normalizeMaster(v){if(!v)return[];var a=Array.isArray(v)?v:Object.values(v);return a.filter(Boolean).map(function(x,i){return{id:x.id||('m'+i),name:x.name||String(x)}})}function save(){return ref.set({updatedAt:Date.now(),items:data.map(x=>({id:x.id,name:x.name}))})}function mainKeys(){return new Set(data.map(x=>key(x.name)))}function subItems(){var mk=mainKeys(),map={};invItems.forEach(function(x){if(!x||!x.name||mk.has(key(x.name)))return;var k=key(x.name);if(!map[k])map[k]={name:x.name,stock:0,units:new Set(),locs:new Set(),cats:new Set(),rows:0};var o=map[k];o.stock+=Number(x.stock)||0;o.rows++;if(x.unit)o.units.add(x.unit);if(x.loc)o.locs.add(x.loc);if(x.cat)o.cats.add(x.cat)});return Object.values(map)}function render(){document.getElementById('mainList').innerHTML=data.map(function(m,i){return '<div class="item mainItem"><span class="badge bmain">主力ネタ</span><div class="itemName">'+(i+1)+'. '+esc(m.name)+'</div><div class="actions"><button class="mini" onclick="renameMain('+i+')">名称変更</button><button class="mini" onclick="moveMain('+i+',-1)">↑</button><button class="mini" onclick="moveMain('+i+',1)">↓</button><button class="mini" onclick="delMain('+i+')">削除</button></div></div>'}).join('');var subs=subItems();document.getElementById('subCount').textContent='在庫管理から '+subs.length+'品目';document.getElementById('subList').innerHTML=subs.length?subs.map(function(x){var u=[...x.units],l=[...x.locs],c=[...x.cats];return '<div class="item subItem"><span class="badge bsub">サブネタ</span><div class="itemName">'+esc(x.name)+'</div><div class="stock">📦 現在庫 <b>'+x.stock+'</b>'+(u.length===1?' '+esc(u[0]):'')+'</div><div class="meta">'+(c.length?'分類 '+c.map(esc).join('・')+'　':'')+(l.length?'📍 '+l.map(esc).join('・'):'')+(x.rows>1?'　同名'+x.rows+'件合算':'')+'</div></div>'}).join(''):'<div class="note">サブネタがありません。在庫管理に品目を登録すると自動表示されます。</div>'}function addMain(){var e=document.getElementById('newMain'),n=e.value.trim();if(!n)return;if(data.some(x=>key(x.name)===key(n)))return alert('同じ主力ネタがあります');data.push({id:'m'+Date.now(),name:n});e.value='';save()}function renameMain(i){var n=prompt('主力ネタ名',data[i].name);if(n&&n.trim()){data[i].name=n.trim();save()}}function moveMain(i,d){var n=i+d;if(n<0||n>=data.length)return;var x=data.splice(i,1)[0];data.splice(n,0,x);save()}function delMain(i){if(confirm('「'+data[i].name+'」を主力ネタから削除しますか？\n在庫データは削除されません。')){data.splice(i,1);save()}}
ref.on('value',function(s){var v=s.val();if(!v){data=mainDefaults.map((n,i)=>({id:'m'+(i+1),name:n}));save();return}data=normalizeMaster(v.items||v);render();document.getElementById('status').textContent='✓ KING主力ネタをFirebase共有中　'+data.length+'種類'},e=>document.getElementById('status').textContent='主力ネタ読込エラー：'+e.message);db.ref('fujiwara/invItems').on('value',function(s){var v=s.val();invItems=Array.isArray(v)?v.filter(Boolean):Object.values(v||{}).filter(Boolean);document.getElementById('invstatus').textContent='✓ 担当者アプリ在庫とリアルタイム連携中　'+invItems.length+'品目';render()},e=>document.getElementById('invstatus').textContent='在庫読込エラー：'+e.message);
</script></body></html>
