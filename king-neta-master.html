<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>主力ネタ・サブネタマスター｜KING</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#eff9ff,#fff9ed);color:#102043}.wrap{max-width:1100px;margin:auto;padding:16px 16px 80px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:1px solid #d6a21c;background:#fff;border-radius:12px;padding:10px 14px;font-weight:900;color:#714e00}.primary{background:#d6a21c;color:#fff}.card{background:#fff;border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 10px 26px #38506b18}.note{font-size:12px;color:#66758a;font-weight:700;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input{border:1px solid #ccd8e6;border-radius:10px;padding:10px;font-size:15px;min-width:180px}.main{border:1px solid #dfe7ef;border-radius:16px;margin:12px 0;overflow:hidden}.mainhead{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff8dc;padding:12px}.maintitle{font-size:19px;font-weight:950}.subs{padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.sub{background:#f7fbff;border:1px solid #bdd6ee;border-radius:14px;padding:9px 10px;font-weight:800;font-size:13px;cursor:pointer}.subname{font-weight:950}.stockline{font-size:12px;color:#245c2b;margin-top:5px}.stocknone{font-size:11px;color:#9b6b00;margin-top:5px}.meta{font-size:10px;color:#65758a;margin-top:3px;line-height:1.45}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{border:1px solid #ccd8e6;background:#fff;border-radius:9px;padding:6px 8px;font-weight:800}.status{padding:10px;border-radius:10px;background:#eef8ff;font-weight:800;font-size:12px;margin-top:10px}.invstatus{padding:9px 10px;border-radius:10px;background:#f5fff5;border:1px solid #cfe8cf;font-weight:800;font-size:12px;margin-top:8px}@media(max-width:600px){.head h1{font-size:22px}.mainhead{align-items:flex-start;flex-direction:column}.actions{width:100%}.subs{grid-template-columns:1fr}}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><div class="wrap">
<div class="head"><button class="btn" onclick="location.href='king.html'">‹ KINGへ戻る</button><h1>🍳 主力ネタ・サブネタ</h1><span></span></div>
<div class="card"><b>👑 KING専用マスター編集</b><div class="note">主力ネタ・サブネタの構成をKINGで管理します。在庫は担当者アプリの既存在庫管理 <b>fujiwara/invItems</b> をリアルタイム参照し、KINGでは変更しません。</div><div class="toolbar"><input id="newMain" placeholder="新しい主力ネタ"><button class="btn primary" onclick="addMain()">＋ 主力ネタ追加</button></div><div id="status" class="status">Firebaseへ接続中...</div><div id="invstatus" class="invstatus">📦 在庫データ読込中...</div></div>
<div id="list"></div></div>
<script>
var cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:5ec6b7e2a2165066956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);var db=firebase.database(),ref=db.ref('fujiwara/netaMaster'),data=[],invItems=[];
var defaults=[['焼きそば・ホルそば',['麺','豚肉']],['串',['牛串','牛たん串','豚タン串','ねぎま','鶏皮','砂ずり','ぼんじり','ホルモン']],['かき氷',['ブロック氷','フラワーカップ']],['チーズハットグ',['チーズハットグ']],['かまぼこ',['ネギ生姜','とり軟骨','ベーコンチーズ','たこネギ','えだまめ','ごぼう','かに']],['いか焼き',['姿','ゲソ']],['ポテト',['ポテト','のり塩','醤油マヨ','えび塩','カレー','コンソメ','チーズ','明太マヨ','ガーリック','バーベキュー']],['かすてら',['バイオレット','三温糖','上白糖','たまご']],['コットンキャンディ',['カップ','ざらめ(白)','ざらめ(ピンク)','ざらめ(青)','ざらめ(緑)','ざらめ(紫)','ざらめ(オレンジ)','ざらめ(黄)']],['だんご',['だんご(白)','だんご(草)','だんご(桜)','だんご(かぼちゃ)','みたらしあん']],['肉巻きおにぎり',['肉巻き']],['らーめん',['麺','焼豚','鶏ガラ','どんぶり']],['チョコバナナ',['バナナ','チョコレート(茶)','チョコレート(白)','カラースプレー']],['とんかつスティック',['豚肉']],['からあげ',['鶏肉']],['10円パン',['ミックス粉','三温糖','たまご']]].map(function(x,i){return{id:'m'+(i+1),name:x[0],subs:x[1].map(function(n,j){return{id:'s'+(j+1),name:n}})}});
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function save(){return ref.set({updatedAt:Date.now(),items:data})}function norm(v){if(!v)return[];var a=Array.isArray(v)?v:Object.values(v);return a.filter(Boolean).map(function(m){m.subs=m.subs?(Array.isArray(m.subs)?m.subs:Object.values(m.subs).filter(Boolean)):[];return m})}
function keyName(s){return String(s||'').normalize('NFKC').replace(/[\s　]/g,'').replace(/[（）]/g,function(c){return c==='（'?'(':')'}).toLowerCase()}
function invFor(name){var k=keyName(name);return invItems.filter(function(x){return keyName(x.name)===k})}
function num(v){var n=Number(v);return isFinite(n)?n:0}
function priceOf(x){return x.unitPrice!=null?x.unitPrice:(x.price!=null?x.price:(x.purchasePrice!=null?x.purchasePrice:(x.cost!=null?x.cost:null)))}
function supplierOf(x){return x.supplier||x.vendor||x.orderTo||x.purchaseFrom||''}
function invHtml(name){var rows=invFor(name);if(!rows.length)return '<div class="stocknone">⚠ 在庫管理に同名品目なし</div>';var total=rows.reduce(function(a,x){return a+num(x.stock)},0);var units=[...new Set(rows.map(function(x){return x.unit||''}).filter(Boolean))];var locs=[...new Set(rows.map(function(x){return x.loc||''}).filter(Boolean))];var prices=[...new Set(rows.map(priceOf).filter(function(v){return v!==null&&v!==''}))];var suppliers=[...new Set(rows.map(supplierOf).filter(Boolean))];var unit=units.length===1?' '+esc(units[0]):'';var h='<div class="stockline">📦 現在庫 <b>'+total+'</b>'+unit+'</div>';var meta=[];if(locs.length)meta.push('場所 '+locs.map(esc).join('・'));if(prices.length)meta.push('単価 ¥'+prices.map(function(v){return Number(v).toLocaleString()}).join(' / ¥'));if(suppliers.length)meta.push('発注先 '+suppliers.map(esc).join('・'));if(rows.length>1)meta.push('同名 '+rows.length+'件合算');if(meta.length)h+='<div class="meta">'+meta.join('　｜　')+'</div>';return h}
function render(){var box=document.getElementById('list');box.innerHTML=data.map(function(m,i){return '<div class="card main"><div class="mainhead"><div class="maintitle">'+(i+1)+'. '+esc(m.name)+'</div><div class="actions"><button class="mini" onclick="renameMain('+i+')">名称変更</button><button class="mini" onclick="addSub('+i+')">＋サブネタ</button><button class="mini" onclick="moveMain('+i+',-1)">↑</button><button class="mini" onclick="moveMain('+i+',1)">↓</button><button class="mini" onclick="delMain('+i+')">削除</button></div></div><div class="subs">'+m.subs.map(function(s,j){return '<div class="sub" onclick="editSub('+i+','+j+')"><div class="subname">'+esc(s.name)+'</div>'+invHtml(s.name)+'</div>'}).join('')+'</div></div>'}).join('')}
function addMain(){var e=document.getElementById('newMain'),n=e.value.trim();if(!n)return;data.push({id:'m'+Date.now(),name:n,subs:[]});e.value='';save()}function renameMain(i){var n=prompt('主力ネタ名',data[i].name);if(n&&n.trim()){data[i].name=n.trim();save()}}function addSub(i){var n=prompt('追加するサブネタ名');if(n&&n.trim()){data[i].subs.push({id:'s'+Date.now(),name:n.trim()});save()}}function editSub(i,j){var s=data[i].subs[j],n=prompt('サブネタ名（空欄で削除）',s.name);if(n===null)return;if(!n.trim()){if(confirm('削除しますか？'))data[i].subs.splice(j,1)}else s.name=n.trim();save()}function moveMain(i,d){var n=i+d;if(n<0||n>=data.length)return;var x=data.splice(i,1)[0];data.splice(n,0,x);save()}function delMain(i){if(confirm('「'+data[i].name+'」を削除しますか？')){data.splice(i,1);save()}}
ref.on('value',function(s){var v=s.val();if(!v){data=JSON.parse(JSON.stringify(defaults));save();return}data=norm(v.items||v);render();document.getElementById('status').textContent='✓ KINGマスターをFirebase共有中　主力ネタ '+data.length+'種類'},function(e){document.getElementById('status').textContent='Firebaseエラー：'+e.message});
db.ref('fujiwara/invItems').on('value',function(s){var v=s.val();invItems=Array.isArray(v)?v.filter(Boolean):Object.values(v||{}).filter(Boolean);document.getElementById('invstatus').textContent='✓ 担当者アプリ在庫とリアルタイム連携中　品目 '+invItems.length+'件';render()},function(e){document.getElementById('invstatus').textContent='在庫読込エラー：'+e.message});
</script></body></html>
