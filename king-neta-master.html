<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>主力ネタ・サブネタマスター｜KING</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(#eff9ff,#fff9ed);color:#102043}.wrap{max-width:1100px;margin:auto;padding:16px 16px 80px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:1px solid #d6a21c;background:#fff;border-radius:12px;padding:10px 14px;font-weight:900;color:#714e00}.primary{background:#d6a21c;color:#fff}.card{background:#fff;border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 10px 26px #38506b18}.note{font-size:12px;color:#66758a;font-weight:700;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input{border:1px solid #ccd8e6;border-radius:10px;padding:10px;font-size:15px;min-width:180px}.main{border:1px solid #dfe7ef;border-radius:16px;margin:12px 0;overflow:hidden}.mainhead{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff8dc;padding:12px}.maintitle{font-size:19px;font-weight:950}.subs{padding:10px;display:flex;flex-wrap:wrap;gap:7px}.sub{background:#f3f8ff;border:1px solid #bdd6ee;border-radius:999px;padding:7px 10px;font-weight:800;font-size:13px}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{border:1px solid #ccd8e6;background:#fff;border-radius:9px;padding:6px 8px;font-weight:800}.stock{font-size:11px;color:#5d6c80;margin-left:4px}.status{padding:10px;border-radius:10px;background:#eef8ff;font-weight:800;font-size:12px;margin-top:10px}@media(max-width:600px){.head h1{font-size:22px}.mainhead{align-items:flex-start;flex-direction:column}.actions{width:100%}}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><div class="wrap">
<div class="head"><button class="btn" onclick="location.href='king.html'">‹ KINGへ戻る</button><h1>🍳 主力ネタ・サブネタ</h1><span></span></div>
<div class="card"><b>👑 KING専用マスター編集</b><div class="note">主力ネタ・サブネタの構成をKINGで管理します。在庫数・単価・発注先は担当者アプリの既存在庫管理を元データとして、ここでは閲覧反映する設計です。</div><div class="toolbar"><input id="newMain" placeholder="新しい主力ネタ"><button class="btn primary" onclick="addMain()">＋ 主力ネタ追加</button></div><div id="status" class="status">Firebaseへ接続中...</div></div>
<div id="list"></div></div>
<script>
var cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:5ec6b7e2a2165066956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);var db=firebase.database(),ref=db.ref('fujiwara/netaMaster'),data=[];
var defaults=[['焼きそば・ホルそば',['麺','豚肉']],['串',['牛串','牛たん串','豚タン串','ねぎま','鶏皮','砂ずり','ぼんじり','ホルモン']],['かき氷',['ブロック氷','フラワーカップ']],['チーズハットグ',['チーズハットグ']],['かまぼこ',['ネギ生姜','とり軟骨','ベーコンチーズ','たこネギ','えだまめ','ごぼう','かに']],['いか焼き',['姿','ゲソ']],['ポテト',['ポテト','のり塩','醤油マヨ','えび塩','カレー','コンソメ','チーズ','明太マヨ','ガーリック','バーベキュー']],['かすてら',['バイオレット','三温糖','上白糖','たまご']],['コットンキャンディ',['カップ','ざらめ(白)','ざらめ(ピンク)','ざらめ(青)','ざらめ(緑)','ざらめ(紫)','ざらめ(オレンジ)','ざらめ(黄)']],['だんご',['だんご(白)','だんご(草)','だんご(桜)','だんご(かぼちゃ)','みたらしあん']],['肉巻きおにぎり',['肉巻き']],['らーめん',['麺','焼豚','鶏ガラ','どんぶり']],['チョコバナナ',['バナナ','チョコレート(茶)','チョコレート(白)','カラースプレー']],['とんかつスティック',['豚肉']],['からあげ',['鶏肉']],['10円パン',['ミックス粉','三温糖','たまご']]].map(function(x,i){return{id:'m'+(i+1),name:x[0],subs:x[1].map(function(n,j){return{id:'s'+(j+1),name:n}})}});
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}function save(){return ref.set({updatedAt:Date.now(),items:data})}function norm(v){if(!v)return[];var a=Array.isArray(v)?v:Object.values(v);return a.filter(Boolean).map(function(m){m.subs=m.subs?(Array.isArray(m.subs)?m.subs:Object.values(m.subs).filter(Boolean)):[];return m})}
function render(){var box=document.getElementById('list');box.innerHTML=data.map(function(m,i){return '<div class="card main"><div class="mainhead"><div class="maintitle">'+(i+1)+'. '+esc(m.name)+'</div><div class="actions"><button class="mini" onclick="renameMain('+i+')">名称変更</button><button class="mini" onclick="addSub('+i+')">＋サブネタ</button><button class="mini" onclick="moveMain('+i+',-1)">↑</button><button class="mini" onclick="moveMain('+i+',1)">↓</button><button class="mini" onclick="delMain('+i+')">削除</button></div></div><div class="subs">'+m.subs.map(function(s,j){return '<span class="sub" onclick="editSub('+i+','+j+')">'+esc(s.name)+' <span class="stock">在庫連携</span></span>'}).join('')+'</div></div>'}).join('')}
function addMain(){var e=document.getElementById('newMain'),n=e.value.trim();if(!n)return;data.push({id:'m'+Date.now(),name:n,subs:[]});e.value='';save()}function renameMain(i){var n=prompt('主力ネタ名',data[i].name);if(n&&n.trim()){data[i].name=n.trim();save()}}function addSub(i){var n=prompt('追加するサブネタ名');if(n&&n.trim()){data[i].subs.push({id:'s'+Date.now(),name:n.trim()});save()}}function editSub(i,j){var s=data[i].subs[j],n=prompt('サブネタ名（空欄で削除）',s.name);if(n===null)return;if(!n.trim()){if(confirm('削除しますか？'))data[i].subs.splice(j,1)}else s.name=n.trim();save()}function moveMain(i,d){var n=i+d;if(n<0||n>=data.length)return;var x=data.splice(i,1)[0];data.splice(n,0,x);save()}function delMain(i){if(confirm('「'+data[i].name+'」を削除しますか？')){data.splice(i,1);save()}}
ref.on('value',function(s){var v=s.val();if(!v){data=JSON.parse(JSON.stringify(defaults));save();return}data=norm(v.items||v);render();document.getElementById('status').textContent='✓ KINGマスターをFirebase共有中　主力ネタ '+data.length+'種類'},function(e){document.getElementById('status').textContent='Firebaseエラー：'+e.message});
</script></body></html>
