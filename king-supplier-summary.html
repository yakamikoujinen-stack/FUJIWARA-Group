<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>発注先別集計｜FUJIWARA KING</title><meta name="theme-color" content="#17324d">
<style>
:root{--navy:#17324d;--blue:#1769c2;--green:#168a58;--gold:#b8860b;--red:#c43b3b;--ink:#14213d;--sub:#667085;--line:#dce4ee;--bg:#f5f8fc;--card:#fff;--shadow:0 12px 30px rgba(24,50,77,.11)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(180deg,#eef5ff,#fff 48%,#f6fbf7);min-height:100vh}button,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:16px 14px 100px}.card{background:rgba(255,255,255,.97);border:1px solid #e2e9f1;border-radius:22px;box-shadow:var(--shadow)}.head{padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px}.icon{width:60px;height:60px;border-radius:18px;background:#eaf2ff;display:grid;place-items:center;font-size:32px}h1{margin:0;font-size:29px}.sub{font-size:13px;color:var(--sub);font-weight:800;margin-top:4px}.back{border:0;border-radius:12px;background:#eef3f8;color:var(--navy);padding:11px 14px;font-weight:950}.controls{margin-top:14px;padding:15px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.mode-switch{display:flex;gap:8px;align-items:center}.mode-btn{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);padding:11px 15px;font-weight:950}.mode-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}.field{display:flex;flex-direction:column;gap:6px;min-width:190px}.field label{font-size:13px;color:var(--sub);font-weight:900}.field select{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;font-size:16px}.refresh{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:12px 16px;font-weight:950}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:14px}.kpi{padding:16px;text-align:center}.kpi small{color:var(--sub);font-weight:850}.kpi b{display:block;font-size:26px;margin-top:6px}.panel{margin-top:14px;padding:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:21px}.status{font-size:13px;color:var(--sub);font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.supplier{border:1px solid var(--line);border-radius:17px;padding:15px;background:#fff}.supplier-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.supplier h3{margin:0;font-size:19px}.count{font-size:12px;color:var(--sub);font-weight:900;background:#f2f5f9;border-radius:999px;padding:5px 9px}.money-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.money{background:#f7f9fc;border-radius:11px;padding:10px;text-align:center}.money small{display:block;color:var(--sub);font-weight:800}.money b{display:block;margin-top:4px;font-size:16px}.profit-pos{color:var(--green)}.profit-neg{color:var(--red)}.events{margin-top:12px;border-top:1px solid var(--line);padding-top:9px}.month-breakdown{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.month-row{display:grid;grid-template-columns:90px 70px repeat(3,1fr);gap:8px;padding:8px 0;border-bottom:1px dashed #e4e9ef;font-size:12px;align-items:center}.month-row:last-child{border-bottom:0}.month-row span{font-weight:850}.event{display:grid;grid-template-columns:90px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px dashed #e4e9ef;font-size:13px;align-items:center}.event:last-child{border-bottom:0}.event-date{color:var(--sub);font-weight:800}.event-name{font-weight:900}.event-profit{font-weight:950}.empty{text-align:center;padding:34px;color:var(--sub);font-weight:850}.note{margin-top:12px;padding:11px 13px;border-radius:12px;background:#fff9df;border:1px solid #eed88d;color:#765b00;font-size:13px;font-weight:800}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid #e5eaf0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}.bottom button{border:0;border-radius:13px;padding:13px 18px;font-size:16px;font-weight:950}.king{background:var(--navy);color:white}.money-btn{background:#eaf2ff;color:#174f78}@media(max-width:760px){.month-row{grid-template-columns:70px 55px 1fr}.month-row .m-expense,.month-row .m-profit{grid-column:3}.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.head{align-items:flex-start}.money-grid{grid-template-columns:1fr 1fr}.event{grid-template-columns:78px 1fr}.event-profit{grid-column:2}.controls{align-items:stretch}.field{min-width:0;flex:1}.refresh{width:100%}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head>
<body><main class="wrap"><section class="card head"><div class="brand"><div class="icon">📦</div><div><h1>発注先別集計</h1><div class="sub">メインアプリのイベントを発注先ごとに経営集計</div></div></div><button class="back" onclick="location.href='king.html'">← KINGへ戻る</button></section>
<section class="card controls">
<div class="mode-switch" aria-label="集計単位">
  <button id="monthlyBtn" class="mode-btn active" type="button" onclick="setMode('month')">月間</button>
  <button id="yearlyBtn" class="mode-btn" type="button" onclick="setMode('year')">年間</button>
</div>
<div class="field" id="monthField"><label>集計月</label><select id="monthSelect" onchange="render()"></select></div>
<div class="field" id="yearField" style="display:none"><label>集計年</label><select id="yearSelect" onchange="render()"></select></div>
<button class="refresh" onclick="connect(true)">🔄 最新データを読み込む</button>
<span class="status" id="status">Firebase接続中...</span>
</section>
<section class="summary"><div class="card kpi"><small>イベント数</small><b id="eventCount">0件</b></div><div class="card kpi"><small>売上合計</small><b id="salesTotal">¥0</b></div><div class="card kpi"><small>経費合計</small><b id="expenseTotal">¥0</b></div><div class="card kpi"><small>利益合計</small><b id="profitTotal">¥0</b></div></section>
<section class="card panel"><div class="panel-head"><h2>発注先別一覧</h2><span class="status">発注先を選んだイベントのみ集計</span></div><div id="supplierGrid" class="grid"></div><div class="note">発注先はメインアプリのイベント編集にある「発注先」を使用します。売上・経費は保存済みのイベント精算データから計算します。</div></section></main>
<nav class="bottom"><button class="king" onclick="location.href='king.html'">👑 KINGへ戻る</button><button class="money-btn" onclick="location.href='king-money.html'">💰 お金・労務へ</button></nav>
<script>
const config={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};
if(!firebase.apps.length)firebase.initializeApp(config);

let events=[];
let viewMode='month';

const monthSelect=document.getElementById('monthSelect');
const yearSelect=document.getElementById('yearSelect');
const monthField=document.getElementById('monthField');
const yearField=document.getElementById('yearField');
const monthlyBtn=document.getElementById('monthlyBtn');
const yearlyBtn=document.getElementById('yearlyBtn');
const statusEl=document.getElementById('status');
const eventCount=document.getElementById('eventCount');
const salesTotal=document.getElementById('salesTotal');
const expenseTotal=document.getElementById('expenseTotal');
const profitTotal=document.getElementById('profitTotal');
const supplierGrid=document.getElementById('supplierGrid');

const yen=n=>Number(n||0).toLocaleString('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function n(v){return Number(String(v??0).replace(/[^0-9.-]/g,''))||0}
function profitRate(sales,profit){return sales?((profit/sales)*100).toFixed(1)+'%':'0.0%'}
function simpleTotals(simple){
  if(!simple)return{sales:0,expense:0,profit:0};
  let sales=0,expense=0;
  if(simple.items)Object.values(simple.items).forEach(v=>sales+=n(v));
  if(simple.salesTotal!=null)sales=n(simple.salesTotal);
  const ex=simple.expenses||{};
  expense+=n(ex.basho)+n(ex.shiire)+n(ex.kotsu)+n(ex.other);
  if(ex.labor)expense+=n(ex.labor.total);
  if(simple.expenseTotal!=null)expense=n(simple.expenseTotal);
  return{sales,expense,profit:sales-expense};
}
function eventTotals(ev){
  let sales=0,expense=0;
  const s=ev.sales||{};
  if(s.days){
    Object.values(s.days).forEach(d=>{
      const t=simpleTotals((d||{}).simple||d);
      sales+=t.sales; expense+=t.expense;
    });
  }else if(s.simple){
    const t=simpleTotals(s.simple); sales=t.sales; expense=t.expense;
  }else{
    sales=n(s.totalSales||s.salesTotal||s.total||0);
    expense=n(s.totalExpense||s.expenseTotal||s.expensesTotal||0);
  }
  return{sales,expense,profit:sales-expense};
}
function monthOf(ev){return String(ev.date||'').slice(0,7)}
function yearOf(ev){return String(ev.date||'').slice(0,4)}
function currentMonth(){
  const now=new Date();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
}
function currentYear(){return String(new Date().getFullYear())}

function buildFilters(){
  const months=new Set(events.map(monthOf).filter(Boolean));
  months.add(currentMonth());
  const monthVals=[...months].sort().reverse();
  monthSelect.innerHTML=monthVals.map(m=>`<option value="${m}">${m.replace('-','年')}月</option>`).join('');
  monthSelect.value=currentMonth();

  const years=new Set(events.map(yearOf).filter(Boolean));
  years.add(currentYear());
  const yearVals=[...years].sort().reverse();
  yearSelect.innerHTML=yearVals.map(y=>`<option value="${y}">${y}年</option>`).join('');
  yearSelect.value=currentYear();
}

function setMode(mode){
  viewMode=mode;
  const monthly=mode==='month';
  monthField.style.display=monthly?'flex':'none';
  yearField.style.display=monthly?'none':'flex';
  monthlyBtn.classList.toggle('active',monthly);
  yearlyBtn.classList.toggle('active',!monthly);
  render();
}

function makeMonthBreakdown(groupEvents){
  const months={};
  groupEvents.forEach(ev=>{
    const m=monthOf(ev)||'未設定';
    const t=ev._t||eventTotals(ev);
    if(!months[m])months[m]={count:0,sales:0,expense:0,profit:0};
    months[m].count++;
    months[m].sales+=t.sales;
    months[m].expense+=t.expense;
    months[m].profit+=t.profit;
  });
  return Object.entries(months).sort((a,b)=>a[0].localeCompare(b[0])).map(([m,t])=>`
    <div class="month-row">
      <span>${esc(m==='未設定'?m:m.replace('-','年')+'月')}</span>
      <span>${t.count}件</span>
      <span class="m-sales">売上 ${yen(t.sales)}</span>
      <span class="m-expense">経費 ${yen(t.expense)}</span>
      <span class="m-profit ${t.profit<0?'profit-neg':'profit-pos'}">利益 ${yen(t.profit)}</span>
    </div>`).join('');
}

function render(){
  const selected=viewMode==='month'?monthSelect.value:yearSelect.value;
  const list=events.filter(e=>viewMode==='month'?monthOf(e)===selected:yearOf(e)===selected);

  const groups={};
  let ts=0,te=0,tp=0;
  list.forEach(ev=>{
    const supplier=String(ev.zone||'未設定').trim()||'未設定';
    const t=eventTotals(ev);
    ts+=t.sales; te+=t.expense; tp+=t.profit;
    if(!groups[supplier])groups[supplier]={name:supplier,events:[],sales:0,expense:0,profit:0};
    groups[supplier].events.push({...ev,_t:t});
    groups[supplier].sales+=t.sales;
    groups[supplier].expense+=t.expense;
    groups[supplier].profit+=t.profit;
  });

  eventCount.textContent=list.length+'件';
  salesTotal.textContent=yen(ts);
  expenseTotal.textContent=yen(te);
  profitTotal.textContent=yen(tp);
  profitTotal.className=tp<0?'profit-neg':'profit-pos';

  const arr=Object.values(groups).sort((a,b)=>b.sales-a.sales);
  supplierGrid.innerHTML=arr.length?arr.map(g=>`
    <article class="supplier">
      <div class="supplier-top">
        <h3>${esc(g.name)}</h3>
        <span class="count">${g.events.length}件</span>
      </div>
      <div class="money-grid">
        <div class="money"><small>売上</small><b>${yen(g.sales)}</b></div>
        <div class="money"><small>経費</small><b>${yen(g.expense)}</b></div>
        <div class="money"><small>利益</small><b class="${g.profit<0?'profit-neg':'profit-pos'}">${yen(g.profit)}</b></div>
        <div class="money"><small>利益率</small><b class="${g.profit<0?'profit-neg':'profit-pos'}">${profitRate(g.sales,g.profit)}</b></div>
      </div>
      ${viewMode==='year'?`<div class="month-breakdown">${makeMonthBreakdown(g.events)}</div>`:''}
      <div class="events">
        ${g.events.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(e=>`
          <div class="event">
            <span class="event-date">${esc(e.date||'-')}</span>
            <span class="event-name">${esc(e.name||'名称未設定')}</span>
            <span class="event-profit ${e._t.profit<0?'profit-neg':'profit-pos'}">${yen(e._t.profit)}</span>
          </div>`).join('')}
      </div>
    </article>`).join(''):'<div class="empty">対象イベントがありません</div>';
}

function connect(force){
  statusEl.textContent='Firebase読み込み中...';
  firebase.database().ref('fujiwara/events').once('value').then(s=>{
    const v=s.val()||{};
    events=(Array.isArray(v)?v:Object.values(v)).filter(Boolean);
    buildFilters();
    render();
    statusEl.textContent='Firebase共有中｜'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  }).catch(e=>{
    console.error(e);
    statusEl.textContent='読み込み失敗';
  });
}
connect();
</script></body></html>
