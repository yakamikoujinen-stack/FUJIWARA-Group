<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>御礼金管理｜FUJIWARA KING</title><meta name="theme-color" content="#17324d"><style>:root{--navy:#17324d;--gold:#d6a21c;--green:#168a58;--red:#c43b3b;--ink:#14213d;--sub:#667085;--line:#dce4ee;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#eef5ff,#fff 50%,#fff8e9);color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:14px 12px 95px}.card{background:#fff;border:1px solid #e2e9f1;border-radius:20px;box-shadow:0 10px 26px rgba(24,50,77,.09)}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px}.head h1{margin:0;font-size:28px}.sub{font-size:13px;color:var(--sub);font-weight:800;margin-top:5px}.back,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:950}.back{background:#eef3f8;color:var(--navy)}.controls{display:flex;gap:9px;align-items:end;flex-wrap:wrap;padding:14px;margin-top:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--sub);font-weight:900}.field select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}.refresh{background:var(--navy);color:#fff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.kpi{padding:15px;text-align:center}.kpi small{color:var(--sub);font-weight:850}.kpi b{display:block;font-size:24px;margin-top:5px}.panel{margin-top:12px;padding:15px}.panel h2{margin:0 0 12px;font-size:21px}.table-wrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:900px}.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid #e7ecf2;font-size:13px;text-align:left}.tbl th{background:#f6f8fb;position:sticky;top:0}.money{text-align:right!important;font-variant-numeric:tabular-nums;font-weight:900}.thanks{color:#a56d00}.paid{color:var(--green);font-weight:950}.unpaid{color:var(--red);font-weight:950}.status-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-weight:900}.date-in,.memo-in{border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit}.date-in{width:135px}.memo-in{width:170px}.note{margin-top:12px;padding:11px;border:1px solid #ecd27c;background:#fff8df;border-radius:12px;color:#6d5411;font-size:12px;font-weight:800;line-height:1.6}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid #e3e8ef;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}.bottom button{min-width:150px}.save{background:var(--green);color:#fff}@media(max-width:720px){.summary{grid-template-columns:1fr 1fr}.head{align-items:flex-start}.head h1{font-size:23px}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><main class="wrap"><section class="card head"><div><h1>🎁 テキヤ 御礼金管理</h1><div class="sub">FUJIWARAグループ売上 × 10% を自動計算</div></div><button class="back" onclick="location.href='king-supplier-summary.html'">← 発注先別集計</button></section><section class="card controls"><div class="field"><label>対象月</label><select id="monthSel" onchange="render()"></select></div><button class="btn refresh" onclick="loadAll()">🔄 最新データ</button><span id="status" class="sub">読込中...</span></section><section class="summary"><div class="card kpi"><small>対象イベント</small><b id="cnt">0件</b></div><div class="card kpi"><small>FUJIWARA売上</small><b id="sales">¥0</b></div><div class="card kpi"><small>御礼予定 10%</small><b id="thanks">¥0</b></div><div class="card kpi"><small>未払い</small><b id="unpaid">¥0</b></div></section><section class="card panel"><h2>テキヤ区分・御礼金一覧</h2><div class="table-wrap"><table class="tbl"><thead><tr><th>日付</th><th>イベント名</th><th>発注先</th><th class="money">FUJIWARA売上</th><th>御礼率</th><th class="money">御礼金</th><th>支払状況</th><th>支払日</th><th>備考</th></tr></thead><tbody id="body"></tbody></table></div><div class="note">対象はメインアプリの発注先が「テキヤ」のイベントのみです。FUJIWARA売上はイベント早見精算の「FUJIWARAグループ」振り分けを読み取り、10%を御礼予定額として計算します。支払状況・支払日・備考だけを別保存し、メインアプリの売上や精算データは変更しません。</div></section></main><nav class="bottom"><button class="btn refresh" onclick="location.href='king.html'">👑 KINGへ</button><button class="btn save" onclick="saveStates()">💾 支払状況を保存</button></nav><script>const cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.database(),EVENT='fujiwara/events',ALLOC='fujiwara/event_settlement_allocations',STATE='fujiwara/thankyou_payments';let events=[],alloc={},states={};const $=id=>document.getElementById(id),num=v=>{let x=Number(String(v??0).replace(/[^0-9.-]/g,''));return Number.isFinite(x)?x:0},yen=v=>'¥'+Math.round(num(v)).toLocaleString('ja-JP'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function arr(v){return !v?[]:Array.isArray(v)?v.filter(Boolean):Object.values(v).filter(Boolean)}function safe(v){return String(v||'').replace(/[.#$\[\]\/]/g,'_')}function eid(ev,i){return String(ev.id||ev.eventId||ev.mainId||('event_'+i))}function date(ev){return String(ev.date||ev.startDate||ev.eventDate||'').slice(0,10)}function name(ev,i){return ev.name||ev.eventName||ev.title||('イベント '+(i+1))}function supplier(ev){return String(ev.zone||ev.client||ev.supplier||'').trim()}function fujiSales(ev,i){let id=eid(ev,i),e=alloc[safe(id)]||alloc[id]||{},ct=e.companyTotals||{},f=ct.fujiwara||{};let total=num(f.sales);if(total)return total;let items=e.items||{};Object.values(items).forEach(r=>{if(r&&r.company==='fujiwara')total+=num(r.sales)});return total}function currentMonth(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function buildMonths(){let ms=[...new Set(events.map(e=>date(e).slice(0,7)).filter(Boolean))];if(!ms.includes(currentMonth()))ms.push(currentMonth());ms.sort().reverse();monthSel.innerHTML=ms.map(m=>'<option value="'+m+'">'+m.replace('-','年')+'月</option>').join('');monthSel.value=currentMonth()}function render(){let m=monthSel.value,rows=events.map((ev,i)=>({ev,i})).filter(x=>date(x.ev).slice(0,7)===m&&supplier(x.ev).includes('テキヤ'));let ts=0,tt=0,tu=0;body.innerHTML=rows.map(({ev,i})=>{let id=eid(ev,i),fs=fujiSales(ev,i),th=Math.round(fs*.10),st=states[safe(id)]||{},paid=!!st.paid;ts+=fs;tt+=th;if(!paid)tu+=th;return '<tr data-id="'+esc(id)+'"><td>'+esc(date(ev))+'</td><td><b>'+esc(name(ev,i))+'</b></td><td>'+esc(supplier(ev))+'</td><td class="money">'+yen(fs)+'</td><td>10%</td><td class="money thanks">'+yen(th)+'</td><td><button type="button" class="status-btn '+(paid?'paid':'unpaid')+'" onclick="togglePaid(this)">'+(paid?'支払済':'未払い')+'</button></td><td><input class="date-in" type="date" value="'+esc(st.paidDate||'')+'"></td><td><input class="memo-in" value="'+esc(st.memo||'')+'" placeholder="備考"></td></tr>'}).join('')||'<tr><td colspan="9" style="text-align:center;padding:30px;color:#667085">対象データなし</td></tr>';cnt.textContent=rows.length+'件';sales.textContent=yen(ts);thanks.textContent=yen(tt);unpaid.textContent=yen(tu)}function togglePaid(btn){let paid=btn.textContent==='支払済';btn.textContent=paid?'未払い':'支払済';btn.classList.toggle('paid',!paid);btn.classList.toggle('unpaid',paid);renderTotalsOnly()}function renderTotalsOnly(){let total=0;document.querySelectorAll('#body tr[data-id]').forEach(tr=>{if(tr.querySelector('.status-btn').textContent!=='支払済'){let v=tr.querySelector('.thanks').textContent;total+=num(v)}});unpaid.textContent=yen(total)}async function saveStates(){let up={};document.querySelectorAll('#body tr[data-id]').forEach(tr=>{let id=tr.dataset.id;up[safe(id)]={paid:tr.querySelector('.status-btn').textContent==='支払済',paidDate:tr.querySelector('.date-in').value||'',memo:tr.querySelector('.memo-in').value||'',updatedAt:new Date().toISOString()}});try{await db.ref(STATE).update(up);status.textContent='保存済み';await loadAll()}catch(e){status.textContent='保存失敗 '+e.message}}async function loadAll(){status.textContent='読込中...';try{let [a,b,c]=await Promise.all([db.ref(EVENT).once('value'),db.ref(ALLOC).once('value'),db.ref(STATE).once('value')]);events=arr(a.val());alloc=b.val()||{};states=c.val()||{};buildMonths();render();status.textContent='最新データ読込済み'}catch(e){status.textContent='読込失敗 '+e.message}}loadAll();</script></body></html>
