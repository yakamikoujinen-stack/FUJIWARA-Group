<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>主力ネタ管理｜KING v3</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#eef7fb;color:#102043}.wrap{max-width:1100px;margin:auto;padding:16px 16px 80px}.top{display:flex;align-items:center;gap:14px}.btn,.mini{border:1px solid #c9d8e7;background:#fff;border-radius:11px;padding:9px 12px;font-weight:900;color:#174e7c}.gold{background:#dda514;color:#fff;border-color:#dda514}.card{background:#fff;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 8px 24px #17324d14}.note{font-size:12px;color:#65758a;font-weight:750;line-height:1.7}.status{margin-top:9px;padding:9px 11px;border-radius:10px;background:#eef8ff;font-size:12px;font-weight:850}.main{background:#fff;border-radius:20px;margin:15px 0;overflow:hidden;box-shadow:0 8px 24px #17324d14}.mh{background:#fff5ce;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}.name{font-size:21px;font-weight:950}.actions{display:flex;gap:5px;flex-wrap:wrap}.body{padding:14px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{border-radius:16px;padding:12px}.core{background:#fff8e8;border:1px solid #e8c76d}.sub{background:#f1f8ff;border:1px solid #acd1ef}.boxtitle{font-weight:950;font-size:16px;margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#fff;border:1px solid #d2deea;border-radius:12px;padding:8px 10px;font-weight:850;font-size:13px}.stock{display:block;font-size:10px;color:#2b6b35;margin-top:3px}.empty{font-size:12px;color:#7d8793}.version{font-size:11px;color:#8d6b00;font-weight:900}@media(max-width:650px){.cols{grid-template-columns:1fr}.mh{align-items:flex-start;flex-direction:column}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><div class="wrap"><div class="top"><button class="btn" onclick="location.href='king.html'">‹ KINGへ戻る</button><div><h2 style="margin:0">🍳 主力ネタ管理</h2><div class="version">新版 v3・主力材料／サブネタ方式</div></div></div><div class="card"><b>👑 KINGで構成を管理</b><div class="note">例：焼きそば・ホルそば → <b>主力材料：麺・豚肉</b> ／ <b>サブネタ：キャベツ・ソース等</b>。在庫数は担当者アプリの既存在庫管理から読み取ります。在庫データ自体は変更しません。</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="newMain" placeholder="新しい主力ネタ" style="padding:10px;border:1px solid #ccd8e6;border-radius:10px"><button class="btn gold" onclick="addMain()">＋主力ネタ追加</button></div><div id="status" class="status">読込中...</div></div><div id="list"></div></div><script>
var cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:5ec6b7e2a2165066956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);var db=firebase.database(),ref=db.ref('fujiwara/netaMasterV3'),items=[],inv=[];
var defs=[['焼きそば・ホルそば',['麺','豚肉']],['串',['牛串','牛たん串','豚タン串','ねぎま','鶏皮','砂ずり','ぼんじり','ホルモン']],['かき氷',['ブロック氷','フラワーカップ']],['チーズハットグ',['チーズハットグ']],['かまぼこ',['ネギ生姜','とり軟骨','ベーコンチーズ','たこネギ','えだまめ','ごぼう','かに']],['いか焼き',['姿','ゲソ']],['ポテト',['ポテト','のり塩','醤油マヨ','えび塩','カレー','コンソメ','チーズ','明太マヨ','ガーリック','バーベキュー']],['かすてら',['バイオレット','三温糖','上白糖','たまご']],['コットンキャンディ',['カップ','ざらめ(白)','ざらめ(ピンク)','ざらめ(青)','ざらめ(緑)','ざらめ(紫)','ざらめ(オレンジ)','ざらめ(黄)']],['だんご',['だんご(白)','だんご(草)','だんご(桜)','だんご(かぼちゃ)','みたらしあん']],['肉巻きおにぎり',['肉巻き']],['らーめん',['麺','焼豚','鶏ガラ','どんぶり']],['チョコバナナ',['バナナ','チョコレート(茶)','チョコレート(白)','カラースプレー']],['とんかつスティック',['豚肉']],['からあげ',['鶏肉']],['10円パン',['ミックス粉','三温糖','たまご']]].map((x,i)=>({id:'m'+(i+1),name:x[0],core:x[1],subs:[]}));
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function key(s){return String(s||'').normalize('NFKC').replace(/[\s　]/g,'').toLowerCase()}function rows(n){var k=key(n);return inv.filter(x=>key(x.name)===k)}function stock(n){var r=rows(n),t=r.reduce((a,x)=>a+(Number(x.stock)||0),0),u=[...new Set(r.map(x=>x.unit).filter(Boolean))];return r.length?'<span class="stock">📦 '+t+(u.length===1?' '+esc(u[0]):'')+'</span>':'<span class="stock" style="color:#9b6b00">在庫未登録</span>'}function chip(n){return '<span class="chip">'+esc(n)+stock(n)+'</span>'}function save(){return ref.set({updatedAt:Date.now(),items:items})}function render(){document.getElementById('list').innerHTML=items.map((m,i)=>'<section class="main"><div class="mh"><div class="name">'+(i+1)+'. '+esc(m.name)+'</div><div class="actions"><button class="mini" onclick="renameMain('+i+')">名称変更</button><button class="mini" onclick="addCore('+i+')">＋主力材料</button><button class="mini" onclick="addSub('+i+')">＋サブネタ</button><button class="mini" onclick="move('+i+',-1)">↑</button><button class="mini" onclick="move('+i+',1)">↓</button></div></div><div class="body"><div class="cols"><div class="box core"><div class="boxtitle">🟥 主力材料</div><div class="chips">'+((m.core||[]).length?(m.core||[]).map((n,j)=>'<span onclick="editCore('+i+','+j+')">'+chip(n)+'</span>').join(''):'<span class="empty">未登録</span>')+'</div></div><div class="box sub"><div class="boxtitle">🟦 サブネタ</div><div class="chips">'+((m.subs||[]).length?(m.subs||[]).map((n,j)=>'<span onclick="editSub('+i+','+j+')">'+chip(n)+'</span>').join(''):'<span class="empty">KINGで「＋サブネタ」から登録（在庫管理にある品目名を使用）</span>')+'</div></div></div></div></section>').join('')}
function addMain(){var n=document.getElementById('newMain').value.trim();if(!n)return;items.push({id:'m'+Date.now(),name:n,core:[],subs:[]});document.getElementById('newMain').value='';save()}function renameMain(i){var n=prompt('主力ネタ名',items[i].name);if(n&&n.trim()){items[i].name=n.trim();save()}}function addCore(i){var n=prompt('主力材料名（在庫管理と同じ品目名）');if(n&&n.trim()){items[i].core=items[i].core||[];items[i].core.push(n.trim());save()}}function addSub(i){var n=prompt('サブネタ名（例：キャベツ、ソース）\n在庫管理と同じ品目名を入力');if(n&&n.trim()){items[i].subs=items[i].subs||[];items[i].subs.push(n.trim());save()}}function editCore(i,j){var n=prompt('主力材料名（空欄で削除）',items[i].core[j]);if(n===null)return;if(!n.trim())items[i].core.splice(j,1);else items[i].core[j]=n.trim();save()}function editSub(i,j){var n=prompt('サブネタ名（空欄で削除）',items[i].subs[j]);if(n===null)return;if(!n.trim())items[i].subs.splice(j,1);else items[i].subs[j]=n.trim();save()}function move(i,d){var n=i+d;if(n<0||n>=items.length)return;var x=items.splice(i,1)[0];items.splice(n,0,x);save()}
ref.on('value',s=>{var v=s.val();if(!v){items=JSON.parse(JSON.stringify(defs));save();return}var a=v.items||v;items=(Array.isArray(a)?a:Object.values(a)).filter(Boolean).map(x=>({id:x.id||('m'+Date.now()),name:x.name||'',core:Array.isArray(x.core)?x.core:Object.values(x.core||{}),subs:Array.isArray(x.subs)?x.subs:Object.values(x.subs||{})}));render();document.getElementById('status').textContent='✓ KING構成マスター共有中　主力ネタ '+items.length+'種類'},e=>document.getElementById('status').textContent='エラー '+e.message);db.ref('fujiwara/invItems').on('value',s=>{var v=s.val();inv=Array.isArray(v)?v.filter(Boolean):Object.values(v||{}).filter(Boolean);render();document.getElementById('status').textContent='✓ KING構成マスター＋担当者在庫 '+inv.length+'品目と連携中'});
</script></body></html>
