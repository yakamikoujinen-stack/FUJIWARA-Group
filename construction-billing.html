<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建設 請求書・集計表（復元版）</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--line:#cfd7e3;--nav:#233f6d;--tab:#dce7f7;--green:#0a7a2f;--blue:#15a8de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;color:#172033}
.wrap{max-width:1100px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
.top-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
button{width:100%;border:0;border-radius:13px;padding:16px;font-size:16px;font-weight:800;color:#fff;background:var(--nav)}
button.gray{background:#7286a7}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tab{background:var(--tab);color:#20395f}.tab.active{background:var(--nav);color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form-grid .full{grid-column:1/-1}
label{font-size:15px;font-weight:800;display:block;margin-bottom:5px}
input{width:100%;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fff}
.small{font-size:12px;color:#667085}
.print-area{background:#fff;border:1px solid #cfd7e3;padding:28px}
.invoice-top{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
.recipient{font-size:27px;font-weight:900;border-bottom:4px solid #333;display:inline-block;padding:0 16px 8px 16px}
.issue{text-align:right;font-size:19px;font-weight:700;margin:0 0 8px}
.blue-title{background:var(--blue);font-size:48px;font-weight:900;text-align:center;letter-spacing:.28em;padding:12px 0;margin:8px 0 18px}
.company{text-align:right;font-size:20px;font-weight:900;margin-bottom:8px}
.info-table,.detail{width:100%;border-collapse:collapse}
.info-table th,.info-table td,.detail th,.detail td{border:1.8px solid #333;padding:8px 10px}
.info-table th{width:42%;background:#fafafa}
.summary-box{border:3px solid #333;padding:12px 16px}
.summary-title{font-size:17px;font-weight:900}
.summary-amount{font-size:52px;font-weight:900;text-align:center;margin:14px 0}
.detail{margin-top:24px}
.detail th{background:#fafafa;text-align:center}
.detail td.center{text-align:center}
.detail td.right{text-align:right}
.total-row td{font-weight:900}
.bank-box{border:3px solid #333;margin-top:24px;padding:14px 18px;font-size:20px;font-weight:800;min-height:56px}
.blank-space{height:180px}
.hidden{display:none}
@media(max-width:760px){
 .top-actions,.form-grid,.invoice-top{grid-template-columns:1fr}
 .form-grid .full{grid-column:auto}
 .blue-title{font-size:38px}
 .summary-amount{font-size:44px}
 .print-area{overflow:auto}
}
@media print{
 body{background:#fff}.no-print{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border-radius:0;margin:0;padding:0}
 .print-area{border:0;padding:10mm;width:190mm;min-height:277mm}
 @page{size:A4 portrait;margin:8mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card no-print">
    <div class="top-actions">
      <button id="saveBtn">💾 保存</button>
      <button class="gray" id="printBtn">🖨 集計表＋請求書 PDF/印刷</button>
      <button class="gray" onclick="location.href='construction-main.html'">← 建設管理へ戻る</button>
    </div>
  </div>

  <div class="card no-print">
    <div class="tabs">
      <button class="tab active" id="summaryTab">📊 集計表</button>
      <button class="tab" id="invoiceTab">🧾 請求書</button>
    </div>
  </div>

  <div class="card no-print">
    <div class="form-grid">
      <div class="full"><label>宛名</label><input id="recipient" value="前田建設株式会社 御中"></div>
      <div><label>請求日</label><input id="issueDate" type="date"></div>
      <div><label>締切日</label><input id="deadline" type="date"></div>
      <div><label>工事名</label><input id="workName" value="常用工事"></div>
      <div><label>工事場所</label><input id="workPlace" value="丹波市　他"></div>
      <div><label>消費税率 %</label><input id="taxRate" type="number" value="10"></div>
      <div><label>請求元会社名</label><input id="billingCompany" value="リコー工業　合同会社"></div>
      <div><label>振込先</label><input id="bankInfo" placeholder="銀行名・支店・口座番号"></div>
      <div><label>オペレーター人数（藤原）</label><input id="opQty" type="number" value="8"></div>
      <div><label>オペレーター単価（税別）</label><input id="opPrice" type="number" value="15000"></div>
      <div><label>普通作業員人数（藤原以外）</label><input id="genQty" type="number" value="24"></div>
      <div><label>普通作業員単価（税込）</label><input id="genPrice" type="number" value="15000"></div>
    </div>
    <div class="small" style="margin-top:10px">この復元版は、写真1・2枚目の見た目と入力項目を基準に戻しています。自動集計で勝手に工事名・現場名・人数を変更しません。</div>
  </div>

  <div class="card">
    <div class="print-area">
      <div class="invoice-top">
        <div>
          <div class="recipient" id="pvRecipient"></div>
          <table class="info-table" style="margin-top:120px">
            <tr><th>工事名</th><td id="pvWorkName"></td></tr>
            <tr><th>工事場所</th><td id="pvWorkPlace"></td></tr>
            <tr><th>締切日</th><td id="pvDeadline"></td></tr>
          </table>
        </div>
        <div>
          <div class="issue">請求日　<span id="pvIssueDate"></span></div>
          <div class="blue-title">請 求 書</div>
          <div class="company" id="pvBillingCompany"></div>
          <div class="summary-box">
            <div class="summary-title">今回御請求金額</div>
            <div class="summary-amount">¥<span id="pvGrand"></span></div>
            <div style="font-size:18px;line-height:1.5">うち取引に係る消費税<br>¥<span id="pvTax"></span></div>
          </div>
        </div>
      </div>

      <table class="detail">
        <thead>
          <tr>
            <th style="width:60px">番号</th>
            <th>項目</th>
            <th style="width:95px">詳細</th>
            <th style="width:58px">単位</th>
            <th style="width:68px">数量</th>
            <th style="width:90px">単価</th>
            <th style="width:110px">金額</th>
            <th style="width:150px">備考</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="center">1</td>
            <td>オペレーター常用工事費</td>
            <td class="center">藤原</td>
            <td class="center">人</td>
            <td class="center" id="pvOpQty"></td>
            <td class="right" id="pvOpPrice"></td>
            <td class="right" id="pvOpAmt"></td>
            <td>15,000円（税別）</td>
          </tr>
          <tr>
            <td class="center">2</td>
            <td>普通作業員 常用工事費</td>
            <td class="center">藤原以外</td>
            <td class="center">人</td>
            <td class="center" id="pvGenQty"></td>
            <td class="right" id="pvGenPrice"></td>
            <td class="right" id="pvGenAmt"></td>
            <td>15,000円（税込）</td>
          </tr>
          <tr class="total-row"><td colspan="6" class="right">小計</td><td class="right" id="pvSub"></td><td></td></tr>
          <tr class="total-row"><td colspan="5" class="right">消費税</td><td class="center" id="pvTaxRate"></td><td class="right" id="pvTax2"></td><td></td></tr>
          <tr class="total-row"><td colspan="6" class="right">総計</td><td class="right" id="pvGrand2"></td><td></td></tr>
        </tbody>
      </table>
      <div class="bank-box">振込先　<span id="pvBank"></span></div>
      <div class="blank-space"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const ids=["recipient","issueDate","deadline","workName","workPlace","taxRate","billingCompany","bankInfo","opQty","opPrice","genQty","genPrice"];
const fmt=n=>Number(n||0).toLocaleString("ja-JP");
function ymd(v){if(!v)return"";const d=new Date(v);return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`}
function saveData(){const o={};ids.forEach(id=>o[id]=$(id).value);localStorage.setItem("construction_billing_restored_v1",JSON.stringify(o))}
function loadData(){
  const raw=localStorage.getItem("construction_billing_restored_v1");
  if(raw){try{const o=JSON.parse(raw);ids.forEach(id=>{if(o[id]!=null)$(id).value=o[id]})}catch(e){}}
  if(!$("issueDate").value)$("issueDate").value=new Date().toISOString().slice(0,10);
  if(!$("deadline").value){const d=new Date();d.setDate(0);$("deadline").value=d.toISOString().slice(0,10)}
}
function calc(){
  const oq=+$("opQty").value||0,op=+$("opPrice").value||0,gq=+$("genQty").value||0,gp=+$("genPrice").value||0,rate=(+$("taxRate").value||10)/100;
  const oa=oq*op,ga=gq*gp;
  const opTax=Math.round(oa*rate);
  const embedded=Math.round(ga-ga/(1+rate));
  return {oq,op,gq,gp,oa,ga,sub:oa+ga,tax:opTax+embedded,grand:oa+ga+opTax,rate};
}
function render(){
  saveData(); const c=calc();
  $("pvRecipient").textContent=$("recipient").value;
  $("pvWorkName").textContent=$("workName").value;
  $("pvWorkPlace").textContent=$("workPlace").value;
  $("pvDeadline").textContent=ymd($("deadline").value);
  $("pvIssueDate").textContent=ymd($("issueDate").value);
  $("pvBillingCompany").textContent=$("billingCompany").value;
  $("pvGrand").textContent=fmt(c.grand);
  $("pvTax").textContent=fmt(c.tax);
  $("pvOpQty").textContent=c.oq;$("pvOpPrice").textContent=fmt(c.op);$("pvOpAmt").textContent=fmt(c.oa);
  $("pvGenQty").textContent=c.gq;$("pvGenPrice").textContent=fmt(c.gp);$("pvGenAmt").textContent=fmt(c.ga);
  $("pvSub").textContent=fmt(c.sub);$("pvTaxRate").textContent=(+$("taxRate").value||10)+"%";$("pvTax2").textContent=fmt(c.tax);$("pvGrand2").textContent=fmt(c.grand);$("pvBank").textContent=$("bankInfo").value;
}
ids.forEach(id=>$(id).addEventListener("input",render));
$("saveBtn").onclick=()=>{saveData();alert("保存しました")};
$("printBtn").onclick=()=>window.print();
$("summaryTab").onclick=()=>{$("summaryTab").classList.add("active");$("invoiceTab").classList.remove("active")};
$("invoiceTab").onclick=()=>{$("invoiceTab").classList.add("active");$("summaryTab").classList.remove("active")};
loadData();render();
</script>
</body>
</html>
