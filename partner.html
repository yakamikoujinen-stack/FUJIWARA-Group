<script>
(function(){
  var p=new URLSearchParams(location.search);
  // メインアプリから「partnerを開く」時だけ ?from=main を付ける。
  // 下請けが partner.html を単独で開いた時は、メインの存在を一切出さない。
  var fromMain=p.get('from')==='main';
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.getElementById('backMainBtn');
    var f=document.getElementById('footerMainBtn');
    var nav=document.getElementById('footerNav');
    if(fromMain){
      if(b) b.style.display='block';
      if(f) f.style.display='block';
      if(nav) nav.classList.add('fromMain');
    }else{
      if(b) b.remove();
      if(f) f.remove();
      if(nav) nav.classList.remove('fromMain');
    }

function renderCalendar(){calendar.innerHTML='';for(let i=-1;i<=4;i++)calendar.innerHTML+=buildMonth(new Date(),i)}function selectDate(ds){selectedDate=ds;renderCalendar();renderEvents();go('eventsSec')}function todaySelect(){selectDate(new Date().toISOString().slice(0,10))}
function profit(e){return +e.sales-+e.fee-+e.cost-+e.labor-+e.other}function expense(e){return +e.fee+ +e.cost+ +e.labor+ +e.other}
function renderEvents(){selectedTitle.textContent=selectedDate+' の予定・イベント';let ds=events.filter(e=>dateInEvent(e,selectedDate));let ps=plans.filter(p=>p.date===selectedDate);let html='';if(!ds.length){html+='<div class="muted" style="padding:10px 4px">この日の共有イベントはありません。</div>'}else{html+=ds.map(e=>`<div class="event"><div class="between"><h3>${esc(e.title)}</h3><span class="pill">共有</span></div><div class="kv"><b>イベント名</b><span>${esc(e.title||'イベント')}</span><b>場所</b><span>${esc(e.place||'未入力')}</span><b>日程</b><span>${esc(dateRangeText(e))}</span>${e.time?`<b>時間</b><span>${esc(e.time)}</span>`:''}${e.memo?`<b>メモ</b><span>${esc(e.memo)}</span>`:''}</div><button class="btn full" onclick="toggleCalc('${e.id}')">損益計算書を記入</button><div class="calc" id="calc_${e.id}"><hr><div class="calc-grid">${input(e,'sales','売上')}${input(e,'fee','場所代')}${input(e,'cost','仕入・材料')}${input(e,'labor','人件費')}${input(e,'other','その他')}<div><label>利益</label><div class="total ${profit(e)>=0?'profit':'loss'}" id="profit_${e.id}">${yen(profit(e))}</div></div></div><button class="btn full green" onclick="saveAllMoney('${e.id}')">✅ 入力完了・保存</button><button class="btn full red" onclick="deleteEvent('${e.id}')">このイベントを削除</button></div></div>`).join('')}
eventList.innerHTML=html;if(ps.length){personalList.innerHTML='<div class="miniTitle">📝 自分の予定</div>'+ps.map(p=>`<div class="event personal"><div class="between"><h3>${esc(p.title)}</h3><div><button class="btn light" onclick="editPersonalPlan('${p.id}')">編集</button> <button class="btn red" onclick="deletePersonalPlan('${p.id}')">削除</button></div></div><div class="kv"><b>時間</b><span>${esc(p.time||'未入力')}</span><b>メモ</b><span>${esc(p.memo||'')}</span></div></div>`).join('')}else{personalList.innerHTML=''} }
function updatePersonalTypeUI(){const type=(document.getElementById('pType')||{}).value||'private';const note=document.getElementById('pTypeNote'),btn=document.getElementById('pAddBtn');if(note)note.textContent=type==='event'?'イベントとして登録し、損益計算書・月間集計の対象になります。':'プライベート予定は損益計算の対象外です。';if(btn)btn.textContent=type==='event'?'この日にイベントを追加':'この日に予定を追加'}
function addPersonalPlan(){
  const type=(document.getElementById('pType')||{}).value||'private';
  const title=(pTitle.value||(type==='event'?'イベント':'自分の予定')).trim();
  if(type==='event'){
    const id=uid();
    const e={id:id,mainId:id,date:selectedDate,dateEnd:'',title:title||'イベント',place:'',time:pTime.value||'',memo:pMemo.value||'',sales:0,fee:0,cost:0,labor:0,other:0,secret:false,updatedAt:Date.now(),src:'partner_manual'};
    events=uniqById((events||[]).concat([e]));
    saveOwn();
    saveEventFirebase(e).then(function(){
      pTitle.value=pTime.value=pMemo.value='';
      if(document.getElementById('pType'))document.getElementById('pType').value='private';
      updatePersonalTypeUI();
      renderAll();
      alert('イベントとして保存しました');
    }).catch(function(){
      alert('イベント保存に失敗しました。通信を確認してください。');
    });
    return;
  }
  const p=safePlanPayload({id:uid(),date:selectedDate,title:title,time:pTime.value,memo:pMemo.value,updatedAt:Date.now()});
  plans=mergePlans((plans||[]).concat([p]));
  savePlans();
  pushPlanFirebase(p).then(function(){
    pTitle.value=pTime.value=pMemo.value='';
    renderAll();
  }).catch(function(){
    alert('予定保存に失敗しました。通信を確認してください。');
  });
}
function editPersonalPlan(id){const p=plans.find(function(x){return x.id===id});if(!p)return;const title=prompt('予定名',p.title||'');if(title===null)return;const time=prompt('時間',p.time||'');if(time===null)return;const memo=prompt('メモ',p.memo||'');if(memo===null)return;p.title=title.trim()||'自分の予定';p.time=time;p.memo=memo;p.updatedAt=Date.now();plans=mergePlans(plans);savePlans();pushPlanFirebase(p);renderAll()}
function deletePersonalPlan(id){if(!confirm('この予定を削除しますか？'))return;plans=plans.filter(function(p){return p.id!==id});savePlans();deletePlanFirebase(id);renderAll()}
function input(e,k,l){return `<div><label>${l}</label><input data-money-event="${e.id}" data-money-key="${k}" type="text" inputmode="numeric" pattern="[0-9]*" value="${e[k]||0}" onfocus="moneyInputActive=true;this.select()" onblur="moneyInputActive=false" oninput="updateMoney('${e.id}','${k}',this.value)"></div>`}
function toggleCalc(id){document.getElementById('calc_'+id).classList.toggle('open')}
function cleanMoney(v){return String(v||'').replace(/[^0-9]/g,'')}function updateMoney(id,k,v){const e=events.find(x=>x.id===id);if(!e)return;const n=cleanMoney(v);e[k]=Number(n||0);const p=document.getElementById('profit_'+id);if(p){p.textContent=yen(profit(e));p.className='total '+(profit(e)>=0?'profit':'loss')}}function saveAllMoney(id){const e=events.find(x=>x.id===id);if(!e)return;document.querySelectorAll('[data-money-event="'+id+'"]').forEach(function(inp){const k=inp.getAttribute('data-money-key');if(k)e[k]=Number(cleanMoney(inp.value)||0)});saveOwn();saveEventFirebase(e).then(function(){alert('保存しました');renderSummaries()}).catch(function(){alert('保存に失敗しました。通信を確認してもう一度押してください。')})}function commitMoney(id,k,v){const e=events.find(x=>x.id===id);if(!e)return;clearTimeout(moneySaveTimers[id+'_'+k]);e[k]=Number(cleanMoney(v)||0);e.updatedAt=Date.now();saveOwn();const key=e.mainId||String(e.id||'').replace(/^main_/,'');const payload={sales:+e.sales||0,fee:+e.fee||0,cost:+e.cost||0,labor:+e.labor||0,other:+e.other||0,updatedAt:e.updatedAt};const r=fbRef(key);if(r)r.update(payload);const c=centerRef(key);if(c)c.update(payload);renderSummaries()}
function addEvent(){const e={id:uid(),date:fDate.value||selectedDate,title:fTitle.value||'イベント',place:fPlace.value,client:fClient.value,detail:fDetail.value,sales:0,fee:0,cost:0,labor:0,other:0,secret:false};events.push(e);saveOwn();selectedDate=e.date;fTitle.value=fPlace.value=fClient.value=fDetail.value='';renderAll();alert('登録しました')}
function deleteEvent(id){if(!confirm('このイベントをpartnerから削除しますか？'))return;const e=events.find(x=>x.id===id);if(!e)return;const key=eventKey(e);events=events.filter(x=>x.id!==id);saveOwn();const jobs=[];const r=fbRef(key),c=centerRef(key);if(r)jobs.push(r.remove());if(c)jobs.push(c.remove());Promise.all(jobs).finally(function(){renderAll()})}
function sum(list){return list.reduce((a,e)=>(moneyKeys.forEach(k=>a[k]+=+e[k]||0),a.profit+=profit(e),a),{sales:0,fee:0,cost:0,labor:0,other:0,profit:0})}
function boxes(s){return `<div class="summaryGrid"><div class="sumBox"><b>売上</b><span>${yen(s.sales)}</span></div><div class="sumBox"><b>経費合計</b><span>${yen(s.fee+s.cost+s.labor+s.other)}</span></div><div class="sumBox"><b>仕入</b><span>${yen(s.cost)}</span></div><div class="sumBox"><b>場所代</b><span>${yen(s.fee)}</span></div><div class="sumBox"><b>人件費</b><span>${yen(s.labor)}</span></div><div class="sumBox"><b>その他</b><span>${yen(s.other)}</span></div><div class="sumBox"><b>利益</b><span class="${s.profit>=0?'profit':'loss'}">${yen(s.profit)}</span></div></div>`}
function renderSummaries(){if(!monthPick.value)monthPick.value=selectedDate.slice(0,7);let mlist=events.filter(e=>e.date.slice(0,7)===monthPick.value),ms=sum(mlist);monthSummary.innerHTML=boxes(ms)+`<table class="table"><tr><th>日付</th><th>イベント</th><th>売上</th><th>利益</th></tr>${mlist.map(e=>`<tr><td>${e.date.slice(5)}</td><td>${esc(e.title)}</td><td>${yen(e.sales)}</td><td>${yen(profit(e))}</td></tr>`).join('')}</table>`;let y=yearPick.value||new Date().getFullYear();let rows='';for(let i=1;i<=12;i++){let ym=y+'-'+String(i).padStart(2,'0'),ss=sum(events.filter(e=>e.date.slice(0,7)===ym));rows+=`<tr><td>${i}月</td><td>${yen(ss.sales)}</td><td>${yen(ss.fee+ss.cost+ss.labor+ss.other)}</td><td>${yen(ss.profit)}</td></tr>`}yearSummary.innerHTML=`<table class="table"><tr><th>月</th><th>売上</th><th>経費</th><th>利益</th></tr>${rows}</table>`}

function recoverNow(){const log=[];const beforeE=events.length,beforeP=plans.length;const c=findLocalCandidates();events=uniqById((events||[]).concat(c.events||[]));plans=uniqById((plans||[]).concat(c.plans||[]));localStorage.setItem(STORE_KEY,JSON.stringify(events));localStorage.setItem(PLAN_KEY,JSON.stringify(plans));autoBackup('手動復旧');if(c.log.length)log.push('見つかった保存先\n・'+c.log.join('\n・'));log.push('復旧前：イベント '+beforeE+'件 / 予定 '+beforeP+'件');log.push('復旧後：イベント '+events.length+'件 / 予定 '+plans.length+'件');backupLog.textContent=log.join('\n\n');renderAll();recoverFromFirebasePaths()}
function manualBackup(){autoBackup('手動バックアップ');backupLog.textContent='今の状態を保存しました。\nイベント '+events.length+'件 / 予定 '+plans.length+'件'}
function showBackupList(){const hist=readArr(BACKUP_KEY);if(!hist.length){backupLog.textContent='バックアップはまだありません。';return}backupLog.innerHTML=hist.map((b,i)=>`<div style="margin-bottom:10px"><b>${i+1}. ${esc(b.time||'')}</b> ${esc(b.reason||'')}<br>イベント ${(b.events||[]).length}件 / 予定 ${(b.plans||[]).length}件 <button class="btn light" style="padding:6px 10px" onclick="restoreBackup(${i})">復元</button></div>`).join('')}
function restoreBackup(i){const hist=readArr(BACKUP_KEY);const b=hist[i];if(!b)return;if(!confirm('このバックアップを復元しますか？'))return;events=(b.events||[]).map(x=>normalizeEvent(x,'backup')).filter(Boolean);plans=b.plans||[];localStorage.setItem(STORE_KEY,JSON.stringify(events));localStorage.setItem(PLAN_KEY,JSON.stringify(plans));autoBackup('バックアップ復元直後');backupLog.textContent='復元しました。イベント '+events.length+'件 / 予定 '+plans.length+'件';renderAll()}
function exportBackupText(){const data={time:new Date().toISOString(),events,plans,backups:readArr(BACKUP_KEY)};backupText.style.display='block';backupText.value=JSON.stringify(data);backupText.select();try{document.execCommand('copy');backupLog.textContent='バックアップ文字を表示してコピーしました。メモなどに保存できます。'}catch(e){backupLog.textContent='バックアップ文字を表示しました。長押しでコピーしてください。'}}
function setupYears(){let y=new Date().getFullYear();yearPick.innerHTML='';for(let i=y-2;i<=y+2;i++)yearPick.innerHTML+=`<option ${i==y?'selected':''}>${i}</option>`;monthPick.value=selectedDate.slice(0,7)}
function go(id,btn){document.querySelectorAll('.page').forEach(s=>s.classList.remove('activePage'));document.getElementById(id).classList.add('activePage');window.scrollTo({top:0,behavior:'smooth'});if(btn){document.querySelectorAll('.footerNav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}}function renderAll(){renderCalendar();renderEvents();renderSummaries()}loadEvents();setupYears();renderAll();updatePersonalTypeUI();
</script></body></html>
