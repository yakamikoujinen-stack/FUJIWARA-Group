<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>partner｜FUJIWARA Group</title>
<link rel="manifest" href="partner-manifest.webmanifest">
<meta name="theme-color" content="#f6b6c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="partner">
<style>
:root{--pink:#f6b6c8;--pink2:#ffe8ef;--cream:#fffaf3;--brown:#6b3f2a;--ink:#2b1d18;--muted:#8a6b5d;--card:rgba(255,255,255,.92);--line:#f2d8cf;--gold:#d59a37;--green:#12a15e;--red:#db3b42;--blue:#5f7cff;}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff7fb 0%,#fffaf3 45%,#fff0d8 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 15% 12%,rgba(246,182,200,.55) 0 11%,transparent 12%),radial-gradient(circle at 92% 8%,rgba(255,222,137,.50) 0 10%,transparent 11%),radial-gradient(circle at 82% 82%,rgba(246,182,200,.42) 0 15%,transparent 16%)}
body:after{content:"🐩  🐾  🐩  🐾  🐩  🐾";position:fixed;left:-25px;right:-25px;top:170px;z-index:-1;font-size:54px;line-height:1.9;opacity:.075;transform:rotate(-16deg);white-space:pre-wrap;word-spacing:38px;pointer-events:none}
header{position:sticky;top:0;z-index:10;padding:18px 14px 16px;border-bottom-left-radius:30px;border-bottom-right-radius:30px;background:linear-gradient(135deg,#ffcad8,#fff3c8);box-shadow:0 10px 28px rgba(107,63,42,.18);border-bottom:1px solid rgba(255,255,255,.8)}
.logo{display:flex;align-items:center;gap:12px}.mark{width:58px;height:58px;border-radius:22px;background:#fff;display:grid;place-items:center;font-size:34px;box-shadow:0 8px 18px rgba(107,63,42,.16),inset 0 -5px 0 rgba(246,182,200,.25)}h1{font-size:30px;margin:0;letter-spacing:.03em}.sub{font-size:13px;color:#6b3f2a;font-weight:800}.tag{display:inline-flex;margin-top:5px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:4px 10px;font-size:12px;color:#7a4d39;font-weight:900}.rolebar{display:flex;gap:8px;margin-top:14px}.rolebar button{flex:1;border:0;background:rgba(255,255,255,.65);color:#6b3f2a;border-radius:999px;padding:11px;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}.rolebar button.active{background:#6b3f2a;color:#fff}
main{padding:14px 12px 96px}.card{background:var(--card);border-radius:24px;padding:15px;margin:13px 0;box-shadow:0 8px 22px rgba(107,63,42,.10);border:1px solid rgba(242,216,207,.85);backdrop-filter:blur(10px)}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:13px}.pill{border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900;background:#ffe8ef;color:#9f3155}.secret{background:#fff1bf;color:#8a5b00}.btn{border:0;border-radius:16px;padding:12px 13px;font-weight:900;background:#6b3f2a;color:#fff}.btn.light{background:#fff7fb;color:#6b3f2a;border:1px solid var(--line)}.btn.gold{background:linear-gradient(135deg,#ffd76d,#d59a37);color:#3b2600}.btn.red{background:#ffe4e6;color:#9f1d28}.btn.full{width:100%;margin-top:10px}.small{font-size:12px}
.calendar-wrap{overflow-x:auto;scroll-snap-type:x mandatory;display:flex;gap:12px;padding:4px 0 9px}.month{min-width:100%;scroll-snap-align:start}.month-title{text-align:center;font-weight:1000;font-size:18px;margin-bottom:10px;color:#6b3f2a}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:12px;color:var(--muted);font-weight:900}.day{min-height:64px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;text-align:left;color:var(--ink);box-shadow:0 2px 8px rgba(107,63,42,.04)}.day.today{outline:2px solid var(--pink)}.day.has{background:#fff5f8;border-color:#f7a9c0}.day .num{font-weight:1000;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#f08baa;margin-right:2px}.selected{background:#6b3f2a!important;color:#fff!important}.selected .dot{background:#fff}.event{border:1px solid var(--line);border-radius:20px;padding:13px;margin:10px 0;background:#fff}.event h3{margin:0 0 7px;font-size:18px}.kv{display:grid;grid-template-columns:92px 1fr;gap:7px;font-size:14px}.kv b{color:#7a4d39}.detail{white-space:pre-wrap;background:#fff7fb;border-radius:15px;padding:10px;margin-top:8px;font-size:14px}.calc{display:none}.leader .calc{display:none}.partnerOnly .leaderOnly{display:none!important}.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.calc-grid label{font-size:12px;color:var(--muted);font-weight:900}.calc-grid input{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;font-size:16px;background:#fff}.total{font-size:22px;font-weight:1000}.profit{color:var(--green)}.loss{color:var(--red)}textarea,input,select{font-family:inherit}.form input,.form textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;font-size:16px;margin:6px 0 10px;background:#fff}.form textarea{min-height:82px}.footerNav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 10px env(safe-area-inset-bottom);border-top:1px solid var(--line)}.footerNav button{border:0;background:#fff1f6;color:#6b3f2a;border-radius:16px;padding:11px;font-weight:900}.footerNav button.active{background:#6b3f2a;color:#fff}.poodleCard{display:flex;gap:12px;align-items:center}.poodleFace{font-size:42px;width:58px;height:58px;background:#fff;border-radius:22px;display:grid;place-items:center;box-shadow:inset 0 -5px 0 rgba(246,182,200,.25)}
@media(min-width:760px){main{max-width:760px;margin:auto}.month{min-width:720px}.calendar-wrap{scroll-snap-type:none}}
.calEventName{margin-top:4px;font-size:11px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#6b3f2a}.selected .calEventName{color:#fff}.day{overflow:hidden}.eventHead{cursor:pointer}
</style>
</head>
<body class="partnerOnly">
<header>
  <div class="logo"><div class="mark">🐩</div><div><h1>partner</h1><span class="tag">FUJIWARA Group</span></div></div>
  <div class="rolebar"><button id="partnerBtn" class="active" onclick="setRole('partner')">業者表示</button></div>
</header>
<main>
  <section id="calendarSec" class="card"><div class="between"><b>スライド式カレンダー</b><span class="muted" id="sourceNote">メインアプリ登録イベントのみ</span></div><div class="calendar-wrap" id="calendar"></div></section>
  <section id="eventsSec" class="card"><div class="between"><b id="selectedTitle">日にちを選択</b><button class="btn light small" onclick="todaySelect()">今日</button></div><div id="eventList" class="muted" style="padding:16px 4px">カレンダーの日にちをタップしてください。</div></section>
  <section class="card leaderOnly"><div class="between"><b>リーダー専用：イベント登録</b><span class="pill secret">内密</span></div><div class="form"><input id="fDate" type="date"><input id="fTitle" placeholder="イベント名"><input id="fPlace" placeholder="場所"><input id="fClient" placeholder="下請け業者・取引先（任意）"><textarea id="fDetail" placeholder="集合時間・搬入・注意事項など"></textarea><label class="muted"><input id="fSecret" type="checkbox"> 下請け業者には非表示にする</label><button class="btn gold full" onclick="addEvent()">このイベントを登録</button></div></section>
</main>
<nav class="footerNav"><button class="active" onclick="scrollToSec('calendarSec')">カレンダー</button><button onclick="scrollToSec('eventsSec')">詳細</button><button onclick="exportData()">保存確認</button></nav>
<script>
const STORE_KEY='partner_events_v2';let role='partner';let selectedDate=new Date().toISOString().slice(0,10);let allEvents=[];let events=[];
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}function uid(){return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function loadEvents(){const own=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');const candidates=['fujiwara_events','fujiwaraEvents','events','mainEvents','leaderEvents','king_events','fujiwara_calendar_events','partner_events_v1'];let imported=[];for(const k of candidates){try{const v=JSON.parse(localStorage.getItem(k)||'null');if(Array.isArray(v)){imported=imported.concat(v.map(x=>normalizeEvent(x,k)).filter(Boolean));}}catch(e){}}allEvents=[...imported,...own];if(!allEvents.length){allEvents=sampleEvents();localStorage.setItem(STORE_KEY,JSON.stringify(allEvents));}events=allEvents.filter(e=>role==='leader'?true:(!e.secret&&e.share!==false));}
function normalizeEvent(x,src){const date=x.date||x.eventDate||x.day||x.startDate||x.start||'';if(!date)return null;return{id:x.id||uid(),date:String(date).slice(0,10),title:x.title||x.name||x.eventName||'イベント',place:x.place||x.location||x.address||'',client:x.client||x.customer||x.partner||'',detail:x.detail||x.memo||x.note||'',sales:Number(x.sales||0),fee:Number(x.fee||x.placeFee||0),cost:Number(x.cost||x.expense||0),labor:Number(x.labor||0),other:Number(x.other||0),secret:!!x.secret,share:x.share,src};}
function sampleEvents(){return[{id:uid(),date:selectedDate,title:'サンプルイベント',place:'会場名',client:'下請け業者共有用',detail:'集合 8:00\n搬入 8:30\n終了後に片付け確認',sales:0,fee:0,cost:0,labor:0,other:0,secret:false,share:true}];}
function saveOwn(){localStorage.setItem(STORE_KEY,JSON.stringify(allEvents.filter(e=>!e.src)));}
function setRole(r){role=r;document.body.className=r==='leader'?'leader':'partnerOnly';partnerBtn.classList.toggle('active',r==='partner');leaderBtn.classList.toggle('active',r==='leader');loadEvents();renderCalendar();renderEvents();}
function openLeader(){const pass=prompt('リーダーパスワードを入力');if(pass==='1111'||pass==='fujiwara'){setRole('leader')}else{alert('パスワードが違います')}}
function buildMonth(base,offset){const d=new Date(base.getFullYear(),base.getMonth()+offset,1);const y=d.getFullYear(),m=d.getMonth();const first=new Date(y,m,1).getDay();const last=new Date(y,m+1,0).getDate();let html=`<div class="month"><div class="month-title">🐩 ${y}年 ${m+1}月 🐾</div><div class="grid">`;['日','月','火','水','木','金','土'].forEach(w=>html+=`<div class="dow">${w}</div>`);for(let i=0;i<first;i++)html+='<div></div>';for(let day=1;day<=last;day++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const dayEvents=events.filter(e=>e.date===ds);
const cnt=dayEvents.length;
const today=new Date().toISOString().slice(0,10)===ds;
const titles=dayEvents.slice(0,2).map(e=>`<div class="calEventName">${esc(e.title)}</div>`).join('');
html+=`<button class="day ${cnt?'has':''} ${today?'today':''} ${selectedDate===ds?'selected':''}" onclick="selectDate('${ds}')"><div class="num">${day}</div>${cnt?'<div>'+Array(Math.min(cnt,4)).fill('<span class="dot"></span>').join('')+'</div>'+titles:''}</button>`}return html+'</div></div>'}
function renderCalendar(){calendar.innerHTML='';const base=new Date();for(let i=-1;i<=4;i++)calendar.innerHTML+=buildMonth(base,i)}function selectDate(ds){selectedDate=ds;renderCalendar();renderEvents();scrollToSec('eventsSec')}function todaySelect(){selectDate(new Date().toISOString().slice(0,10))}
function renderEvents(){selectedTitle.textContent=selectedDate+' のイベント';const dayEvents=events.filter(e=>e.date===selectedDate);if(!dayEvents.length){eventList.innerHTML='<div class="muted">この日の表示イベントはありません。</div>';return}eventList.innerHTML=dayEvents.map(e=>{const profit=(Number(e.sales)-Number(e.fee)-Number(e.cost)-Number(e.labor)-Number(e.other));return `<div class="event"><div class="between eventHead" onclick="toggleCalc('${e.id}')"><h3>🐩 ${esc(e.title)}</h3>${e.secret?'<span class="pill secret">内密</span>':'<span class="pill">共有</span>'}</div><div class="kv"><b>場所</b><span>${esc(e.place||'未入力')}</span><b>取引先</b><span>${role==='leader'?esc(e.client||'未入力'):'共有先'}</span><b>詳細</b><span>${esc(e.detail||'未入力')}</span></div><button class="btn full" onclick="toggleCalc('${e.id}')">損益計算書を開く</button><div class="calc" id="calc_${e.id}"><hr><div class="calc-grid"><div><label>売上</label><input type="number" value="${e.sales||0}" onchange="updateMoney('${e.id}','sales',this.value)"></div><div><label>場所代</label><input type="number" value="${e.fee||0}" onchange="updateMoney('${e.id}','fee',this.value)"></div><div><label>仕入・材料</label><input type="number" value="${e.cost||0}" onchange="updateMoney('${e.id}','cost',this.value)"></div><div><label>人件費</label><input type="number" value="${e.labor||0}" onchange="updateMoney('${e.id}','labor',this.value)"></div><div><label>その他</label><input type="number" value="${e.other||0}" onchange="updateMoney('${e.id}','other',this.value)"></div><div><label>利益</label><div class="total ${profit>=0?'profit':'loss'}">${yen(profit)}</div></div></div><button class="btn red full" onclick="deleteEvent('${e.id}')">削除</button></div></div>`}).join('')}
function toggleCalc(id){const el=document.getElementById('calc_'+id);el.style.display=el.style.display==='block'?'none':'block'}
function updateMoney(id,key,val){const e=allEvents.find(x=>x.id===id);if(!e)return;e[key]=Number(val||0);saveOwn();loadEvents();renderEvents()}function addEvent(){const e={id:uid(),date:fDate.value||selectedDate,title:fTitle.value||'イベント',place:fPlace.value,client:fClient.value,detail:fDetail.value,sales:0,fee:0,cost:0,labor:0,other:0,secret:fSecret.checked,share:!fSecret.checked};allEvents.push(e);saveOwn();selectedDate=e.date;fTitle.value=fPlace.value=fClient.value=fDetail.value='';fSecret.checked=false;loadEvents();renderCalendar();renderEvents();alert('登録しました')}
function deleteEvent(id){if(!confirm('削除しますか？'))return;allEvents=allEvents.filter(e=>e.id!==id);saveOwn();loadEvents();renderCalendar();renderEvents()}function exportData(){alert('表示中イベント：'+events.length+'件\n保存イベント合計：'+allEvents.length+'件\nリーダーパスワード初期値：1111')}function scrollToSec(id){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
loadEvents();renderCalendar();renderEvents();
</script>
</body>
</html>
