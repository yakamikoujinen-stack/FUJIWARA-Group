<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>partner｜FUJIWARA Group</title><link rel="manifest" href="partner-manifest.webmanifest"><meta name="theme-color" content="#ffd6e3"><style>
:root{--bg:#fff7ef;--card:#fff;--ink:#2b1d19;--muted:#8a6b5d;--main:#7b432b;--pink:#ffe1eb;--line:#f0d7cf;--green:#15915b;--red:#b4233c;--gold:#f7d985}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#ffd6e3,transparent 32%),radial-gradient(circle at 90% 0,#fff3bd,transparent 35%),linear-gradient(135deg,#fff7ef,#ffe4ea)}body:before{content:"🐩 🐾 🐩 🐾 🐩 🐾";position:fixed;inset:0;z-index:-1;opacity:.09;font-size:34px;line-height:92px;letter-spacing:26px;transform:rotate(-12deg);white-space:pre-wrap}header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#ffcbd9,#fff0b9);padding:18px 16px 22px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;box-shadow:0 6px 22px rgba(123,67,43,.18)}.logo{display:flex;align-items:center;gap:13px}.mark{width:58px;height:58px;border-radius:22px;background:#fff;display:grid;place-items:center;font-size:32px;box-shadow:0 7px 20px rgba(123,67,43,.18)}h1{font-size:34px;margin:0}.sub{display:inline-block;margin-top:4px;background:rgba(255,255,255,.75);border-radius:999px;padding:5px 16px;font-weight:900;color:#704432}.rolebar{display:flex;gap:8px;margin-top:16px}.rolebar button,.btn{border:0;border-radius:999px;padding:12px 14px;font-weight:900;background:var(--main);color:#fff}.rolebar button{flex:1}.rolebar button.active{background:#fff;color:var(--main)}main{padding:14px 12px 96px;max-width:880px;margin:auto}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:26px;padding:16px;margin:14px 0;box-shadow:0 8px 24px rgba(123,67,43,.10)}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:13px}.pill{border-radius:999px;padding:6px 12px;font-size:12px;font-weight:900;background:var(--pink);color:#a43464}.btn.light{background:#fff7fa;color:var(--main);border:1px solid var(--line)}.btn.red{background:#ffe1e7;color:#981b36}.btn.full{width:100%;margin-top:10px}.calendar-wrap{overflow-x:auto;scroll-snap-type:x mandatory;display:flex;gap:12px}.month{min-width:100%;scroll-snap-align:start}.month-title{text-align:center;font-weight:900;font-size:18px;margin:6px 0 10px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{text-align:center;font-size:12px;color:var(--muted);font-weight:900}.day{min-height:62px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:7px;text-align:left;color:var(--ink)}.day.today{outline:2px solid var(--gold)}.day.has{background:#fff8df}.day.selected{background:var(--main);color:#fff}.num{font-weight:900}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#d993a0;margin-right:2px}.event{border:1px solid var(--line);border-radius:22px;padding:14px;margin:12px 0;background:#fff}.event h3{margin:0 0 8px;font-size:20px}.kv{display:grid;grid-template-columns:92px 1fr;gap:8px;color:#765244}.calc{display:none}.calc.open{display:block}.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.calc-grid label{font-size:13px;color:#7d5749;font-weight:900}.calc-grid input{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;font-size:18px}.total{font-size:26px;font-weight:900}.profit{color:var(--green)}.loss{color:var(--red)}.form input,.form textarea,.form select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;font-size:16px;margin:6px 0 10px}.form textarea{min-height:80px}.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sumBox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}.sumBox b{display:block;color:#7b432b}.sumBox span{font-size:23px;font-weight:900}.table{width:100%;border-collapse:separate;border-spacing:0 8px}.table th{text-align:left;color:#7d5749;font-size:12px}.table td{background:#fff;padding:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.table td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}.table td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}.footerNav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 10px env(safe-area-inset-bottom);border-top:1px solid var(--line)}.footerNav button{border:0;background:#fff1f6;border-radius:16px;padding:12px 4px;font-weight:900;color:#6d3d2c}.footerNav button.active{background:var(--main);color:#fff}.hide{display:none!important}@media(max-width:520px){.calc-grid,.summaryGrid{grid-template-columns:1fr}h1{font-size:30px}.month{min-width:100%}}
</style></head><body><header><div class="logo"><div class="mark">🐩</div><div><h1>partner</h1><div class="sub">FUJIWARA Group</div></div></div><div class="rolebar"><button class="active">partner</button></div></header><main>
<section id="calendarSec" class="card"><div class="between"><b>🐾 スライド式カレンダー</b><span class="muted">リーダー登録イベントのみ</span></div><div class="calendar-wrap" id="calendar"></div></section>
<section id="eventsSec" class="card"><div class="between"><b id="selectedTitle">日にちを選択</b><button class="btn light" onclick="todaySelect()">今日</button></div><div id="eventList" class="muted" style="padding:14px 4px">日にちをタップしてください。</div></section>
<section id="monthSec" class="card"><div class="between"><b>⭕ 月間 集計一覧</b><input id="monthPick" type="month" onchange="renderSummaries()" style="padding:9px;border-radius:12px;border:1px solid var(--line)"></div><div id="monthSummary"></div></section>
<section id="yearSec" class="card"><div class="between"><b>⭕ 年間 月別集計</b><select id="yearPick" onchange="renderSummaries()" style="padding:9px;border-radius:12px;border:1px solid var(--line)"></select></div><div id="yearSummary"></div></section>

</main><nav class="footerNav"><button class="active" onclick="go('calendarSec',this)">カレンダー</button><button onclick="go('eventsSec',this)">詳細</button><button onclick="go('monthSec',this)">月間集計</button><button onclick="go('yearSec',this)">年間集計</button></nav>
<script>
const STORE_KEY='partner_events_v4';let selectedDate=new Date().toISOString().slice(0,10),events=[];const moneyKeys=['sales','fee','cost','labor','other'];
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}function uid(){return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sampleEvents(){return[{id:uid(),date:selectedDate,title:'🐩 サンプルイベント',place:'会場名',client:'共有先',detail:'集合 8:00\n搬入 8:30\n終了後に片付け確認',sales:100000,fee:50000,cost:23000,labor:14000,other:0,secret:false}]}
function normalizeEvent(x,src){const d=x.date||x.eventDate||x.day||x.startDate||x.start;if(!d)return null;return{id:x.id||uid(),date:String(d).slice(0,10),title:x.title||x.name||x.eventName||'イベント',place:x.place||x.location||'',client:x.client||x.customer||'',detail:x.detail||x.memo||x.note||'',sales:+(x.sales||0),fee:+(x.fee||x.placeFee||0),cost:+(x.cost||x.expense||0),labor:+(x.labor||0),other:+(x.other||0),secret:!!x.secret,src}}
function loadEvents(){const own=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');let imported=[];['fujiwara_events','fujiwaraEvents','events','mainEvents','leaderEvents','king_events','fujiwara_calendar_events'].forEach(k=>{try{let v=JSON.parse(localStorage.getItem(k)||'null');if(Array.isArray(v))imported=imported.concat(v.map(x=>normalizeEvent(x,k)).filter(Boolean))}catch(e){}});events=[...imported,...own].filter(e=>!e.secret);if(!events.length){events=sampleEvents();localStorage.setItem(STORE_KEY,JSON.stringify(events))}}
function saveOwn(){localStorage.setItem(STORE_KEY,JSON.stringify(events.filter(e=>!e.src)))}
function buildMonth(base,off){const d=new Date(base.getFullYear(),base.getMonth()+off,1),y=d.getFullYear(),m=d.getMonth(),first=d.getDay(),last=new Date(y,m+1,0).getDate();let h=`<div class="month"><div class="month-title">${y}年 ${m+1}月</div><div class="grid">`;['日','月','火','水','木','金','土'].forEach(w=>h+=`<div class="dow">${w}</div>`);for(let i=0;i<first;i++)h+='<div></div>';for(let day=1;day<=last;day++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,cnt=events.filter(e=>e.date===ds).length,today=new Date().toISOString().slice(0,10)===ds;h+=`<button class="day ${cnt?'has':''} ${today?'today':''} ${selectedDate===ds?'selected':''}" onclick="selectDate('${ds}')"><div class="num">${day}</div>${cnt?'<div>'+Array(Math.min(cnt,4)).fill('<span class="dot"></span>').join('')+'</div><small>'+cnt+'件</small>':''}</button>`}return h+'</div></div>'}
function renderCalendar(){calendar.innerHTML='';for(let i=-1;i<=4;i++)calendar.innerHTML+=buildMonth(new Date(),i)}function selectDate(ds){selectedDate=ds;renderCalendar();renderEvents();go('eventsSec')}function todaySelect(){selectDate(new Date().toISOString().slice(0,10))}
function profit(e){return +e.sales-+e.fee-+e.cost-+e.labor-+e.other}function expense(e){return +e.fee+ +e.cost+ +e.labor+ +e.other}
function renderEvents(){selectedTitle.textContent=selectedDate+' のイベント';let ds=events.filter(e=>e.date===selectedDate);if(!ds.length){eventList.innerHTML='<div class="muted">この日の表示イベントはありません。</div>';return}eventList.innerHTML=ds.map(e=>`<div class="event"><div class="between"><h3>${esc(e.title)}</h3><span class="pill">共有</span></div><div class="kv"><b>場所</b><span>${esc(e.place||'未入力')}</span><b>取引先</b><span>${esc(e.client||'未入力')}</span><b>詳細</b><span>${esc(e.detail||'未入力')}</span></div><button class="btn full" onclick="toggleCalc('${e.id}')">損益計算書を記入</button><div class="calc" id="calc_${e.id}"><hr><div class="calc-grid">${input(e,'sales','売上')}${input(e,'fee','場所代')}${input(e,'cost','仕入・材料')}${input(e,'labor','人件費')}${input(e,'other','その他')}<div><label>利益</label><div class="total ${profit(e)>=0?'profit':'loss'}" id="profit_${e.id}">${yen(profit(e))}</div></div></div></div></div>`).join('')}
function input(e,k,l){return `<div><label>${l}</label><input type="number" inputmode="numeric" value="${e[k]||0}" oninput="updateMoney('${e.id}','${k}',this.value)"></div>`}
function toggleCalc(id){document.getElementById('calc_'+id).classList.toggle('open')}
function updateMoney(id,k,v){const e=events.find(x=>x.id===id);if(!e)return;e[k]=Number(v||0);saveOwn();const p=document.getElementById('profit_'+id);if(p){p.textContent=yen(profit(e));p.className='total '+(profit(e)>=0?'profit':'loss')}renderSummaries()}
function addEvent(){const e={id:uid(),date:fDate.value||selectedDate,title:fTitle.value||'イベント',place:fPlace.value,client:fClient.value,detail:fDetail.value,sales:0,fee:0,cost:0,labor:0,other:0,secret:false};events.push(e);saveOwn();selectedDate=e.date;fTitle.value=fPlace.value=fClient.value=fDetail.value='';renderAll();alert('登録しました')}
function deleteEvent(id){if(!confirm('削除しますか？'))return;events=events.filter(e=>e.id!==id);saveOwn();renderAll()}
function sum(list){return list.reduce((a,e)=>(moneyKeys.forEach(k=>a[k]+=+e[k]||0),a.profit+=profit(e),a),{sales:0,fee:0,cost:0,labor:0,other:0,profit:0})}
function boxes(s){return `<div class="summaryGrid"><div class="sumBox"><b>売上</b><span>${yen(s.sales)}</span></div><div class="sumBox"><b>経費合計</b><span>${yen(s.fee+s.cost+s.labor+s.other)}</span></div><div class="sumBox"><b>仕入</b><span>${yen(s.cost)}</span></div><div class="sumBox"><b>場所代</b><span>${yen(s.fee)}</span></div><div class="sumBox"><b>人件費</b><span>${yen(s.labor)}</span></div><div class="sumBox"><b>その他</b><span>${yen(s.other)}</span></div><div class="sumBox"><b>利益</b><span class="${s.profit>=0?'profit':'loss'}">${yen(s.profit)}</span></div></div>`}
function renderSummaries(){if(!monthPick.value)monthPick.value=selectedDate.slice(0,7);let mlist=events.filter(e=>e.date.slice(0,7)===monthPick.value),ms=sum(mlist);monthSummary.innerHTML=boxes(ms)+`<table class="table"><tr><th>日付</th><th>イベント</th><th>売上</th><th>利益</th></tr>${mlist.map(e=>`<tr><td>${e.date.slice(5)}</td><td>${esc(e.title)}</td><td>${yen(e.sales)}</td><td>${yen(profit(e))}</td></tr>`).join('')}</table>`;let y=yearPick.value||new Date().getFullYear();let rows='';for(let i=1;i<=12;i++){let ym=y+'-'+String(i).padStart(2,'0'),ss=sum(events.filter(e=>e.date.slice(0,7)===ym));rows+=`<tr><td>${i}月</td><td>${yen(ss.sales)}</td><td>${yen(ss.fee+ss.cost+ss.labor+ss.other)}</td><td>${yen(ss.profit)}</td></tr>`}yearSummary.innerHTML=`<table class="table"><tr><th>月</th><th>売上</th><th>経費</th><th>利益</th></tr>${rows}</table>`}
function setupYears(){let y=new Date().getFullYear();yearPick.innerHTML='';for(let i=y-2;i<=y+2;i++)yearPick.innerHTML+=`<option ${i==y?'selected':''}>${i}</option>`;monthPick.value=selectedDate.slice(0,7)}
function go(id,btn){document.getElementById(id).scrollIntoView({behavior:'smooth'});if(btn){document.querySelectorAll('.footerNav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}}function renderAll(){renderCalendar();renderEvents();renderSummaries()}loadEvents();setupYears();renderAll();
</script></body></html>
