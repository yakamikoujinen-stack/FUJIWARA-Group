<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>コナン請負｜本人専用 開発版</title>
<meta name="theme-color" content="#7c3aed">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#f5f0ff,#fff 45%,#fffaf1);color:#242033}.wrap{max-width:920px;margin:auto;padding:16px 14px 96px}.hero{background:linear-gradient(135deg,#6d28d9,#a855f7);color:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 30px #6d28d933}.hero h1{margin:0;font-size:25px}.hero p{margin:7px 0 0;line-height:1.6}.dev{display:inline-block;margin-top:9px;background:#ffffff24;border:1px solid #ffffff55;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900}.card{background:#fff;border:1px solid #e8e2ef;border-radius:19px;padding:16px;margin-top:14px;box-shadow:0 7px 22px #0000000d}h2{margin:0 0 12px;font-size:19px}.login-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.person{border:2px solid #eee;background:#fff;border-radius:14px;padding:13px 8px;font-weight:950;font-size:15px}.person.sel{border-color:#7c3aed;background:#f4efff;color:#6d28d9}.pwrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.pwrow input{width:100%;padding:12px;border:1px solid #d9d3e0;border-radius:11px;font-size:17px}.pwrow button{border:0;background:#7c3aed;color:#fff;border-radius:11px;padding:0 20px;font-weight:950}.err{color:#b42318;font-size:12px;font-weight:900;margin-top:8px}.hidden{display:none!important}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.logout{border:0;background:#fff0f1;color:#b42318;border-radius:10px;padding:9px 12px;font-weight:900}.notice{background:#fff9e9;border:1px solid #ead99e;border-radius:12px;padding:10px;color:#695f4e;font-size:12px;line-height:1.65}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{background:#faf8ff;border:1px solid #e1d7f1;border-radius:14px;padding:12px}.stat span{display:block;font-size:10px;color:#746d80;font-weight:850}.stat b{display:block;font-size:20px;margin-top:4px}.stat.red b{color:#bd342b}.stat.green b{color:#187347}.item{border:1px solid #e7dfed;border-radius:16px;padding:14px;margin-bottom:10px;background:#fff}.item-head{display:flex;justify-content:space-between;gap:10px}.title{font-size:17px;font-weight:950}.meta{font-size:12px;color:#6e6776;line-height:1.55;margin-top:4px}.money{font-size:18px;font-weight:950;text-align:right}.badge{display:inline-block;margin-top:6px;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:950;background:#fff3d7;color:#8a5b00}.badge.paid{background:#e9f8ef;color:#167444}.edit{margin-top:12px;border-top:1px solid #eee;padding-top:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fg label{display:block;font-size:11px;color:#6d6675;font-weight:850;margin-bottom:5px}.fg input,.fg select,.fg textarea{width:100%;padding:10px 11px;border:1px solid #d8d1de;border-radius:10px;font-size:14px}.fg textarea{min-height:68px}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.cbox{background:#faf8ff;border-radius:11px;padding:9px;border:1px solid #e5dcef}.cbox span{display:block;font-size:9px;color:#776f80;font-weight:800}.cbox b{display:block;font-size:14px;margin-top:3px}.save{margin-top:11px;border:0;background:#7c3aed;color:#fff;border-radius:11px;padding:11px 15px;font-weight:950}.empty{padding:22px;text-align:center;color:#746d78;border:1px dashed #d9d1df;border-radius:14px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;border-top:1px solid #eee;padding:9px 14px calc(9px + env(safe-area-inset-bottom))}.back{display:block;max-width:920px;margin:auto;text-align:center;text-decoration:none;background:#4f46e5;color:#fff;border-radius:12px;padding:12px;font-weight:950}@media(max-width:650px){.grid,.summary{grid-template-columns:1fr 1fr}.calc{grid-template-columns:repeat(2,1fr)}.item-head{display:block}.money{text-align:left;margin-top:6px}.login-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>🤝 コナン請負｜本人専用</h1><p>自分に振り分けられた請負だけを確認・編集する開発画面です。</p><span class="dev">単独開発版｜家族アプリにはまだ融合しません</span></section>

<section class="card" id="loginCard">
<h2>本人ログイン</h2>
<div class="login-grid" id="people"></div>
<div id="loginBox" class="hidden"><div class="pwrow"><input type="password" id="pw" placeholder="パスワード"><button onclick="login()">入場</button></div><div id="err" class="err hidden">パスワードが違います</div></div>
</section>

<section id="main" class="hidden">
<div class="card"><div class="topbar"><h2 id="ownerTitle">本人の請負</h2><button class="logout" onclick="logout()">ログアウト</button></div><div class="notice">表示されるのはログイン本人に振り分けられた案件だけです。請負先そのものの変更はリーダー画面で行います。</div><div class="summary"><div class="stat"><span>売上合計</span><b id="sumGross">¥0</b></div><div class="stat green"><span>本人利益 合計</span><b id="sumNet">¥0</b></div><div class="stat red"><span>売掛未入金</span><b id="sumUnpaid">¥0</b></div></div></div>
<div class="card"><h2>自分の請負一覧</h2><div id="list"><div class="empty">読み込み中...</div></div></div>
</section>
</div>
<div class="bottom"><a class="back" href="family-conan-contract-dev.html">← リーダー振分開発版へ戻る</a></div>
<script>
const cfg={apiKey:'AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA',authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:5ec6b7e2a2165066956a94'};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.database();const PATH='fujiwara/dev/familyConanContracts';
const USERS=[{id:'mayumi',name:'まゆみ',hash:'a777e09fefa1c39b972e657277e12a562ae60b74e9eae129d2f367b3de1f67df'},{id:'ryuki',name:'龍来',hash:'3d587ef006444e43ed4a0e71d027a9e82db9bfd6b9941cb45a879536932f1298'},{id:'sora',name:'想良',hash:'a664d8a49a838f445fa520284f94891a86ac57cfccdd35df2b8defe278342934'}];
let current=null,data={};const $=id=>document.getElementById(id),yen=n=>'¥'+(Number(n)||0).toLocaleString('ja-JP'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
$('people').innerHTML=USERS.map(u=>`<button class="person" data-id="${u.id}" onclick="selectUser('${u.id}')">${u.name}</button>`).join('');
function selectUser(id){current=USERS.find(x=>x.id===id);document.querySelectorAll('.person').forEach(b=>b.classList.toggle('sel',b.dataset.id===id));$('loginBox').classList.remove('hidden');$('pw').value='';$('err').classList.add('hidden');setTimeout(()=>$('pw').focus(),50)}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){if(!current)return;const h=await sha256($('pw').value);if(h!==current.hash){$('err').classList.remove('hidden');return}sessionStorage.setItem('fujiwara_conan_personal_login',current.id);showMain()}
function showMain(){if(!current)return;$('loginCard').classList.add('hidden');$('main').classList.remove('hidden');$('ownerTitle').textContent=current.name+' の請負';render()}
function logout(){sessionStorage.removeItem('fujiwara_conan_personal_login');current=null;$('main').classList.add('hidden');$('loginCard').classList.remove('hidden');$('loginBox').classList.add('hidden');document.querySelectorAll('.person').forEach(b=>b.classList.remove('sel'))}
function num(v){return parseInt(v)||0}function calcVals(r){const p=num(r.purchase),c=num(r.cash),cr=num(r.credit),g=c+cr,cf=Math.round(cr*.2),ff=Math.round(g*.1),net=g-p-cf-ff,later=net-c;return{purchase:p,cash:c,credit:cr,gross:g,conanFee:cf,fujiFee:ff,net,later}}
function ownRows(){if(!current)return[];return Object.values(data||{}).filter(r=>r&&r.person===current.name).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function render(){if(!current)return;const arr=ownRows();const gross=arr.reduce((s,r)=>s+num(r.gross),0),net=arr.reduce((s,r)=>s+num(r.net),0),unpaid=arr.filter(r=>!r.paid).reduce((s,r)=>s+num(r.credit),0);$('sumGross').textContent=yen(gross);$('sumNet').textContent=yen(net);$('sumUnpaid').textContent=yen(unpaid);$('list').innerHTML=arr.length?arr.map(r=>card(r)).join(''):'<div class="empty">現在、自分に振り分けられた請負はありません。</div>'}
function card(r){return `<div class="item"><div class="item-head"><div><div class="title">${esc(r.date)}｜${esc(r.event)}</div><div class="meta">🍴 ${esc(r.item)}<br>請負先：${esc(r.person)}</div><span class="badge ${r.paid?'paid':''}">${r.paid?'✅ 売掛入金済 '+esc(r.paidDate||''):'⏳ 売掛未入金'}</span></div><div class="money">本人利益 ${yen(r.net)}</div></div><div class="edit"><div class="grid"><div class="fg"><label>仕入（円）</label><input type="number" id="p-${r.id}" value="${num(r.purchase)}" oninput="preview('${r.id}')"></div><div class="fg"><label>現金売上（円）</label><input type="number" id="c-${r.id}" value="${num(r.cash)}" oninput="preview('${r.id}')"></div><div class="fg"><label>売掛売上（円）</label><input type="number" id="cr-${r.id}" value="${num(r.credit)}" oninput="preview('${r.id}')"></div><div class="fg"><label>売掛 入金状況</label><select id="pd-${r.id}"><option value="0" ${!r.paid?'selected':''}>未入金</option><option value="1" ${r.paid?'selected':''}>入金済</option></select></div></div><div class="calc"><div class="cbox"><span>売上合計</span><b id="g-${r.id}">${yen(r.gross)}</b></div><div class="cbox"><span>コナン20%</span><b id="cf-${r.id}">${yen(r.conanFee)}</b></div><div class="cbox"><span>FUJIWARA10%</span><b id="ff-${r.id}">${yen(r.fujiFee)}</b></div><div class="cbox"><span>本人利益</span><b id="n-${r.id}">${yen(r.net)}</b></div></div><div class="grid" style="margin-top:9px"><div class="fg"><label>入金日</label><input type="date" id="dt-${r.id}" value="${esc(r.paidDate||'')}"></div><div class="fg"><label>メモ</label><textarea id="m-${r.id}">${esc(r.memo||'')}</textarea></div></div><button class="save" onclick="save('${r.id}')">この請負を保存</button></div></div>`}
function preview(id){const vals=calcVals({purchase:$('p-'+id).value,cash:$('c-'+id).value,credit:$('cr-'+id).value});$('g-'+id).textContent=yen(vals.gross);$('cf-'+id).textContent=yen(vals.conanFee);$('ff-'+id).textContent=yen(vals.fujiFee);$('n-'+id).textContent=yen(vals.net)}
function save(id){const old=data[id];if(!old||!current||old.person!==current.name){alert('この請負は編集できません');return}const vals=calcVals({purchase:$('p-'+id).value,cash:$('c-'+id).value,credit:$('cr-'+id).value});const next=Object.assign({},old,vals,{paid:$('pd-'+id).value==='1',paidDate:$('dt-'+id).value||'',memo:$('m-'+id).value||'',updatedAt:new Date().toISOString(),updatedBy:current.name});db.ref(PATH+'/'+id).set(next).then(()=>alert('保存しました')).catch(e=>alert('保存エラー：'+e.message))}
db.ref(PATH).on('value',s=>{data=s.val()||{};render()});$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});const saved=sessionStorage.getItem('fujiwara_conan_personal_login');if(saved){current=USERS.find(x=>x.id===saved)||null;if(current)showMain()}
</script>
</body>
</html>
