<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>主力ネタ一覧 v1.3｜担当者アプリ</title>
<style>
:root{--navy:#17324d;--blue:#2f6fa7;--gold:#d8a62a;--green:#23845a;--red:#c84545;--bg:#f3f8fc;--card:#fff;--text:#172432;--muted:#687b8e;--line:#d9e4ed;--shadow:0 9px 25px rgba(23,50,77,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,#f8fcff,#edf5fa);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:0 12px 110px}header{position:sticky;top:0;z-index:20;margin:0 -12px 14px;padding:15px 14px;background:linear-gradient(135deg,var(--navy),#2c6799);color:#fff;box-shadow:0 5px 18px rgba(23,50,77,.23)}.top{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:23px;margin:0}.sub{font-size:12px;color:#d9ebfa;margin-top:4px}.back{border:0;border-radius:12px;padding:10px 13px;background:rgba(255,255,255,.16);color:#fff;font-weight:900}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;font-size:12px;font-weight:900;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid #c8d6e1;border-radius:11px;padding:11px 12px;background:#fff;color:var(--text);font-size:16px}.field textarea{min-height:72px;resize:vertical}.span2{grid-column:span 2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900}.primary{background:var(--navy);color:#fff}.green{background:var(--green);color:#fff}.gold{background:var(--gold);color:#231800}.ghost{background:#edf3f7;color:#32495c}.danger{background:#fde7e7;color:var(--red)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.sum{background:#f7fbfe;border:1px solid var(--line);border-radius:14px;padding:12px}.sum .k{font-size:11px;color:var(--muted);font-weight:800}.sum .v{font-size:22px;font-weight:950;margin-top:4px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:980px;background:#fff}th,td{padding:10px 8px;border-bottom:1px solid #e8eef3;text-align:left;font-size:13px;white-space:nowrap}th{position:sticky;top:0;background:#eef5fa;color:#27445e;font-size:12px;z-index:1}td.num{text-align:right;font-variant-numeric:tabular-nums}.mini{padding:7px 9px;border:0;border-radius:9px;font-weight:900}.edit{background:#e8f2fb;color:#225b87}.del{background:#fdeaea;color:#b33d3d}.empty{text-align:center;color:var(--muted);padding:24px}.rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rank{border:1px solid var(--line);border-radius:14px;overflow:hidden}.rank-row{display:grid;grid-template-columns:40px 1fr auto;gap:8px;padding:10px 12px;border-bottom:1px solid #edf1f5;align-items:center}.rank-row:last-child{border-bottom:0}.rank-no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900}.notice{background:#fff8dc;border:1px solid #efd67f;border-radius:14px;padding:11px 13px;color:#735812;font-size:12px;line-height:1.7;margin-bottom:12px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:7px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(23,50,77,.08)}.bottom button{flex:1}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#182635;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.rank-grid{grid-template-columns:1fr}.span2{grid-column:span 2}}@media(max-width:440px){.grid{grid-template-columns:1fr}.span2{grid-column:span 1}.summary{grid-template-columns:1fr 1fr}}

.event-sync{margin-top:10px;padding:12px;border:1px solid #cfe0ec;border-radius:14px;background:#f7fbfe}.sync-status{font-size:12px;font-weight:900;color:#466176;margin-bottom:9px}.event-options,.item-chips{display:flex;gap:8px;flex-wrap:wrap}.event-choice{border:1.5px solid #b9ccda;background:#fff;border-radius:12px;padding:10px 12px;text-align:left;min-width:190px;color:var(--text)}.event-choice.active{border-color:var(--navy);background:#eaf4ff;box-shadow:0 0 0 2px rgba(23,50,77,.1)}.event-choice strong{display:block;font-size:15px}.event-choice small{display:block;color:var(--muted);margin-top:4px}.item-chip{border:1.5px solid #d5b452;background:#fff9df;color:#563f00;border-radius:999px;padding:9px 13px;font-weight:900}.item-chip.active{background:var(--gold);color:#241800;border-color:#a97b08}.sync-empty{padding:10px;border-radius:10px;background:#fff;color:var(--muted);font-size:12px}.sync-heading{font-size:13px;font-weight:950;margin:12px 0 7px}.event-count{display:inline-block;border-radius:999px;background:var(--navy);color:#fff;padding:3px 8px;font-size:11px;margin-left:5px}

.category-board{grid-column:1/-1;margin-top:4px}.category-section{border:1.5px solid #cfe0ec;border-radius:16px;background:#fbfdff;margin-top:12px;overflow:hidden}.category-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:#eaf4ff}.category-title{font-size:17px;font-weight:950}.category-count{font-size:11px;font-weight:900;background:var(--navy);color:#fff;border-radius:999px;padding:4px 9px}.subitem-table{width:100%;min-width:760px;border-collapse:collapse}.subitem-table th{position:static;background:#f5f9fc}.subitem-table input{width:100%;min-width:92px;border:1px solid #c8d6e1;border-radius:9px;padding:9px 10px;font-size:15px}.subitem-table input[readonly]{background:#edf4f8;font-weight:900}.subitem-name{font-weight:950;min-width:130px}.unit-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff4c7;color:#614700;font-size:12px;font-weight:900}.save-event-btn{width:100%;margin-top:12px;font-size:16px}.legacy-note{grid-column:1/-1;background:#f7fbfe;border:1px dashed #b9ccda;border-radius:12px;padding:10px 12px;color:#526b7e;font-size:12px;line-height:1.7}.event-summary-card{border:1px solid var(--line);border-radius:15px;margin-bottom:12px;overflow:hidden}.event-summary-head{padding:11px 13px;background:#eef5fa;font-weight:950}.event-summary-body{overflow:auto}.event-summary-body table{min-width:850px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f2fb;color:#225b87;font-size:11px;font-weight:900}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script></head>
<body>
<header><div class="top"><div><h1>📈 主力ネタ一覧 v1.3</h1><div class="sub">イベント別の売上・販売数・単価を記録</div></div><button class="back" onclick="goBack()">← 戻る</button></div></header>
<div class="wrap">
<div class="notice">日付を選ぶと、メインアプリからその日の全イベントと全出店ネタを読み込みます。売上金額 ÷ 販売単価で販売数（本数）を自動計算します。</div>
<section class="card">
<h2>① イベント別・主力品目一覧を登録</h2>
<div class="grid">
<div class="field"><label>開催日</label><input type="date" id="date" onchange="syncEventsForDate()"></div>
<div class="event-sync span2" style="grid-column:1/-1"><div id="syncStatus" class="sync-status">メインアプリのイベントを確認中...</div><div id="eventOptions" class="event-options"></div></div>
<div class="field span2"><label>選択イベント</label><input id="eventName" readonly placeholder="日付からイベントを選択"></div>
<div class="field span2"><label>会場・場所</label><input id="place" readonly placeholder="メインアプリから反映"></div>
<div class="legacy-note">イベントを選ぶと、そのイベントの出店ネタごとに主力品目の表が自動で開きます。売上金額 ÷ 販売単価で数量を自動計算します。</div>
<div id="categoryBoard" class="category-board"><div class="sync-empty">日付とイベントを選択してください。</div></div>
</div>
<button class="btn green save-event-btn" onclick="saveEventRows()">💾 このイベントの一覧表を保存</button>
</section>
<section class="card">
<h2>② 集計条件</h2>
<div class="grid">
<div class="field"><label>表示月</label><input type="month" id="filterMonth" onchange="renderAll()"></div>
<div class="field"><label>ネタで絞込み</label><select id="filterItem" onchange="renderAll()"><option value="">すべて</option></select></div>
<div class="field span2"><label>イベント名検索</label><input id="search" placeholder="イベント名を入力" oninput="renderAll()"></div>
</div>
</section>
<section class="card"><h2>③ 月間集計</h2><div id="summary" class="summary"></div></section>
<section class="card"><h2>④ 主力品目ランキング</h2><div class="rank-grid"><div><h3 style="font-size:15px">売上ランキング</h3><div id="salesRank" class="rank"></div></div><div><h3 style="font-size:15px">販売数ランキング</h3><div id="qtyRank" class="rank"></div></div></div></section>
<section class="card"><h2>⑤ イベント別一覧表</h2><div id="eventTables"></div></section>
</div>
<div class="bottom"><button class="btn ghost" onclick="goBack()">担当者アプリ</button><button class="btn gold" onclick="exportCsv()">CSV出力</button><button class="btn primary" onclick="scrollTo({top:0,behavior:'smooth'})">＋ 登録</button></div><div class="toast" id="toast"></div>
<script>
const KEY='fujiwara_main_neta_sales_v1';
let records=[];let mainEvents=[];let selectedMainEvent=null;
const $=id=>document.getElementById(id);
const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(n)||0);
const num=n=>new Intl.NumberFormat('ja-JP').format(Number(n)||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MASTER={
 'いか焼き':[{name:'姿',unit:'尾'},{name:'ゲソ',unit:'袋'}],
 'イカ焼き':[{name:'姿',unit:'尾'},{name:'ゲソ',unit:'袋'}],
 'チーズハットグ':[{name:'ハットグ',unit:'本'}],
 'ハットグ':[{name:'ハットグ',unit:'本'}],
 '牛串':[{name:'牛串',unit:'本'},{name:'たん串',unit:'本'}],
 '電球ジュース':[{name:'本体',unit:'個'},{name:'サイダー',unit:'本'}],
 '電球':[{name:'本体',unit:'個'},{name:'サイダー',unit:'本'}],
 'ポテト':[{name:'ポテト',unit:'袋'}],
 'からあげ':[{name:'からあげ',unit:'個'}],
 '唐揚げ':[{name:'からあげ',unit:'個'}],
 'かき氷':[{name:'かき氷',unit:'杯'}],
 'カステラ':[{name:'カステラ',unit:'袋'}],
 'りんご飴':[{name:'りんご飴',unit:'本'}],
 'チョコバナナ':[{name:'チョコバナナ',unit:'本'}],
 '肉巻き':[{name:'肉巻き',unit:'本'}],
 '肉巻きおにぎり':[{name:'肉巻きおにぎり',unit:'本'}]
};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function value(id){return $(id)?.value?.trim?.()||''}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function persist(){localStorage.setItem(KEY,JSON.stringify(records))}
function splitNeta(raw){return String(raw||'').split(/\r?\n|、|,|・|／|\/|　/).map(s=>s.trim()).filter((s,i,a)=>s&&a.indexOf(s)===i)}
function eventDates(ev){let out=[];if(Array.isArray(ev.dates))out=out.concat(ev.dates);if(Array.isArray(ev.eventDates))out=out.concat(ev.eventDates);const start=ev.date||'';const end=ev.dateEnd||ev.endDate||ev.toDate||'';if(start&&!out.includes(start))out.push(start);if(start&&end&&/^\d{4}-\d{2}-\d{2}$/.test(start)&&/^\d{4}-\d{2}-\d{2}$/.test(end)){let d=new Date(start+'T00:00:00'),e=new Date(end+'T00:00:00'),guard=0;while(d<=e&&guard++<60){const ds=d.toISOString().slice(0,10);if(!out.includes(ds))out.push(ds);d.setDate(d.getDate()+1)}}return [...new Set(out.filter(Boolean))]}
function normalizeRecords(raw){return (Array.isArray(raw)?raw:[]).map(r=>({...r,category:r.category||r.itemName||'',subItem:r.subItem||r.itemName||'',unit:r.unit||'個'}))}
function load(){try{records=normalizeRecords(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){records=[]}const d=new Date();$('date').value=d.toISOString().slice(0,10);$('filterMonth').value=d.toISOString().slice(0,7);renderAll();initMainEventSync()}
function initMainEventSync(){try{const config={apiKey:'AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA',authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:5ec6b7e2a2165066956a94'};if(!firebase.apps.length)firebase.initializeApp(config);firebase.database().ref('fujiwara/events').on('value',snap=>{const v=snap.val();mainEvents=(Array.isArray(v)?v:Object.values(v||{})).filter(Boolean);$('syncStatus').textContent='✅ メインアプリ連携済み';syncEventsForDate()},()=>{$('syncStatus').textContent='⚠️ メインアプリを読み込めません'})}catch(e){$('syncStatus').textContent='⚠️ メインアプリ連携エラー'}}
function syncEventsForDate(){const ds=value('date');selectedMainEvent=null;$('eventName').value='';$('place').value='';$('categoryBoard').innerHTML='<div class="sync-empty">イベントを選択してください。</div>';const list=mainEvents.filter(ev=>eventDates(ev).includes(ds));window._dateEvents=list;$('syncStatus').innerHTML=list.length?'この日のイベントを選択してください <span class="event-count">'+list.length+'件</span>':'この日にはメインアプリのイベントがありません。';$('eventOptions').innerHTML=list.length?list.map((ev,i)=>`<button type="button" class="event-choice" id="eventChoice${i}" onclick="selectMainEvent(${i})"><strong>${esc(ev.name||'名称未設定')}</strong><small>${esc(ev.place||'会場未設定')}｜${esc(splitNeta(ev.itemsText||ev.items||ev.neta).join('・')||'ネタ未設定')}</small></button>`).join(''):'<div class="sync-empty">イベントがありません。</div>'}
function subitemsFor(category){return MASTER[category]||[{name:category,unit:'個'}]}
function recordKey(date,eventName,category,subItem){return [date,eventName,category,subItem].join('||')}
function selectMainEvent(i){const ev=(window._dateEvents||[])[i];if(!ev)return;selectedMainEvent=ev;document.querySelectorAll('.event-choice').forEach(x=>x.classList.remove('active'));$('eventChoice'+i)?.classList.add('active');$('eventName').value=ev.name||'';$('place').value=ev.place||'';const categories=splitNeta(ev.itemsText||ev.items||ev.neta);renderCategoryBoard(categories)}
function renderCategoryBoard(categories){const date=value('date'),eventName=value('eventName');if(!categories.length){$('categoryBoard').innerHTML='<div class="sync-empty">このイベントには出店ネタが未登録です。</div>';return}$('categoryBoard').innerHTML=categories.map((cat,ci)=>{const rows=subitemsFor(cat);return `<section class="category-section"><div class="category-head"><div class="category-title">${esc(cat)}</div><span class="category-count">${rows.length}品目</span></div><div class="table-wrap" style="border:0;border-radius:0"><table class="subitem-table"><thead><tr><th>主力品目</th><th>単位</th><th>売上金額</th><th>販売単価</th><th>数量（自動）</th><th>原価</th><th>備考</th></tr></thead><tbody>${rows.map((row,ri)=>{const old=records.find(r=>recordKey(r.date,r.eventName,r.category,r.subItem)===recordKey(date,eventName,cat,row.name))||{};return `<tr data-category="${esc(cat)}" data-subitem="${esc(row.name)}" data-unit="${esc(row.unit)}"><td class="subitem-name">${esc(row.name)}</td><td><span class="unit-badge">${esc(row.unit)}</span></td><td><input class="row-sales" type="number" min="0" inputmode="numeric" value="${old.sales||''}" oninput="calcRow(this)"></td><td><input class="row-price" type="number" min="1" inputmode="numeric" value="${old.unitPrice||''}" oninput="calcRow(this)"></td><td><input class="row-qty" type="number" readonly value="${old.qty||''}"></td><td><input class="row-cost" type="number" min="0" inputmode="numeric" value="${old.cost||''}"></td><td><input class="row-memo" value="${esc(old.memo||'')}"></td></tr>`}).join('')}</tbody></table></div></section>`}).join('')}
function calcRow(el){const tr=el.closest('tr');const sales=Number(tr.querySelector('.row-sales').value||0),price=Number(tr.querySelector('.row-price').value||0);tr.querySelector('.row-qty').value=sales>0&&price>0?Math.round(sales/price):''}
function saveEventRows(){if(!selectedMainEvent)return alert('イベントを選択してください');const date=value('date'),eventName=value('eventName'),place=value('place');const trs=[...document.querySelectorAll('#categoryBoard tbody tr')];if(!trs.length)return alert('保存する主力品目がありません');let saved=0;trs.forEach(tr=>{const sales=Number(tr.querySelector('.row-sales').value||0),unitPrice=Number(tr.querySelector('.row-price').value||0),qty=Number(tr.querySelector('.row-qty').value||0),cost=Number(tr.querySelector('.row-cost').value||0),memo=tr.querySelector('.row-memo').value.trim();if(!sales&&!unitPrice&&!qty&&!cost&&!memo)return;const category=tr.dataset.category,subItem=tr.dataset.subitem,unit=tr.dataset.unit;const key=recordKey(date,eventName,category,subItem);const i=records.findIndex(r=>recordKey(r.date,r.eventName,r.category,r.subItem)===key);const rec={id:i>=0?records[i].id:uid(),date,eventName,place,category,subItem,unit,itemName:subItem,sales,unitPrice,qty:sales>0&&unitPrice>0?Math.round(sales/unitPrice):qty,cost,memo,updatedAt:Date.now()};if(i>=0)records[i]=rec;else records.push(rec);saved++});persist();renderAll();toast(saved+'品目を保存しました')}
function filtered(){const m=value('filterMonth'),it=value('filterItem'),q=value('search').toLowerCase();return records.filter(r=>(!m||String(r.date).startsWith(m))&&(!it||r.subItem===it||r.category===it)&&(!q||String(r.eventName).toLowerCase().includes(q))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(a.eventName||'').localeCompare(b.eventName||'','ja'))}
function refreshItems(){const cur=value('filterItem');const items=[...new Set(records.flatMap(r=>[r.category,r.subItem]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));$('filterItem').innerHTML='<option value="">すべて</option>'+items.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('')}
function renderAll(){refreshItems();const list=filtered();const sales=list.reduce((s,r)=>s+Number(r.sales||0),0),qty=list.reduce((s,r)=>s+Number(r.qty||0),0),cost=list.reduce((s,r)=>s+Number(r.cost||0),0),profit=sales-cost;$('summary').innerHTML=`<div class="sum"><div class="k">売上合計</div><div class="v">${yen(sales)}</div></div><div class="sum"><div class="k">数量合計</div><div class="v">${num(qty)}</div></div><div class="sum"><div class="k">原価合計</div><div class="v">${yen(cost)}</div></div><div class="sum"><div class="k">粗利益</div><div class="v">${yen(profit)}</div></div>`;renderRank(list,'sales','salesRank');renderRank(list,'qty','qtyRank');renderEventTables(list)}
function renderRank(list,key,id){const map={};list.forEach(r=>map[r.subItem]=(map[r.subItem]||0)+Number(r[key]||0));const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);$(id).innerHTML=arr.length?arr.slice(0,10).map((x,i)=>`<div class="rank-row"><div class="rank-no">${i+1}</div><strong>${esc(x[0])}</strong><b>${key==='sales'?yen(x[1]):num(x[1])}</b></div>`).join(''):'<div class="empty">集計データなし</div>'}
function renderEventTables(list){const groups={};list.forEach(r=>{const k=r.date+'||'+r.eventName;(groups[k]??=[]).push(r)});const html=Object.entries(groups).map(([k,rows])=>{const [date,eventName]=k.split('||');return `<div class="event-summary-card"><div class="event-summary-head">${esc(date)}　${esc(eventName)} <span class="pill">${rows.length}品目</span></div><div class="event-summary-body"><table><thead><tr><th>出店ネタ</th><th>主力品目</th><th>単位</th><th>売上</th><th>単価</th><th>数量</th><th>原価</th><th>粗利益</th><th>備考</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.category)}</td><td><strong>${esc(r.subItem)}</strong></td><td>${esc(r.unit)}</td><td class="num">${yen(r.sales)}</td><td class="num">${yen(r.unitPrice)}</td><td class="num">${num(r.qty)} ${esc(r.unit)}</td><td class="num">${yen(r.cost)}</td><td class="num">${yen(Number(r.sales||0)-Number(r.cost||0))}</td><td>${esc(r.memo)}</td><td><button class="mini del" onclick="deleteRecord('${r.id}')">削除</button></td></tr>`).join('')}</tbody></table></div></div>`}).join('');$('eventTables').innerHTML=html||'<div class="empty">まだ記録がありません</div>'}
function deleteRecord(id){if(!confirm('この品目記録を削除しますか？'))return;records=records.filter(x=>x.id!==id);persist();renderAll();if(selectedMainEvent)selectMainEvent((window._dateEvents||[]).indexOf(selectedMainEvent));toast('削除しました')}
function exportCsv(){const list=filtered();if(!list.length)return alert('出力するデータがありません');const rows=[['日付','イベント名','会場','出店ネタ','主力品目','単位','売上','販売単価','数量','原価','粗利益','備考'],...list.map(r=>[r.date,r.eventName,r.place,r.category,r.subItem,r.unit,r.sales,r.unitPrice,r.qty,r.cost,Number(r.sales||0)-Number(r.cost||0),r.memo])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`主力品目一覧_${value('filterMonth')||'全期間'}.csv`;a.click();URL.revokeObjectURL(a.href)}
function goBack(){if(history.length>1)history.back();else location.href='manager-app.html'}
load();
</script>
</body></html>
