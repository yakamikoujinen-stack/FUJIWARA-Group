<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>主力ネタ一覧 v1.2｜担当者アプリ</title>
<style>
:root{--navy:#17324d;--blue:#2f6fa7;--gold:#d8a62a;--green:#23845a;--red:#c84545;--bg:#f3f8fc;--card:#fff;--text:#172432;--muted:#687b8e;--line:#d9e4ed;--shadow:0 9px 25px rgba(23,50,77,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,#f8fcff,#edf5fa);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:0 12px 110px}header{position:sticky;top:0;z-index:20;margin:0 -12px 14px;padding:15px 14px;background:linear-gradient(135deg,var(--navy),#2c6799);color:#fff;box-shadow:0 5px 18px rgba(23,50,77,.23)}.top{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:23px;margin:0}.sub{font-size:12px;color:#d9ebfa;margin-top:4px}.back{border:0;border-radius:12px;padding:10px 13px;background:rgba(255,255,255,.16);color:#fff;font-weight:900}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field label{display:block;font-size:12px;font-weight:900;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid #c8d6e1;border-radius:11px;padding:11px 12px;background:#fff;color:var(--text);font-size:16px}.field textarea{min-height:72px;resize:vertical}.span2{grid-column:span 2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900}.primary{background:var(--navy);color:#fff}.green{background:var(--green);color:#fff}.gold{background:var(--gold);color:#231800}.ghost{background:#edf3f7;color:#32495c}.danger{background:#fde7e7;color:var(--red)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.sum{background:#f7fbfe;border:1px solid var(--line);border-radius:14px;padding:12px}.sum .k{font-size:11px;color:var(--muted);font-weight:800}.sum .v{font-size:22px;font-weight:950;margin-top:4px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:980px;background:#fff}th,td{padding:10px 8px;border-bottom:1px solid #e8eef3;text-align:left;font-size:13px;white-space:nowrap}th{position:sticky;top:0;background:#eef5fa;color:#27445e;font-size:12px;z-index:1}td.num{text-align:right;font-variant-numeric:tabular-nums}.mini{padding:7px 9px;border:0;border-radius:9px;font-weight:900}.edit{background:#e8f2fb;color:#225b87}.del{background:#fdeaea;color:#b33d3d}.empty{text-align:center;color:var(--muted);padding:24px}.rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rank{border:1px solid var(--line);border-radius:14px;overflow:hidden}.rank-row{display:grid;grid-template-columns:40px 1fr auto;gap:8px;padding:10px 12px;border-bottom:1px solid #edf1f5;align-items:center}.rank-row:last-child{border-bottom:0}.rank-no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900}.notice{background:#fff8dc;border:1px solid #efd67f;border-radius:14px;padding:11px 13px;color:#735812;font-size:12px;line-height:1.7;margin-bottom:12px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:7px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(23,50,77,.08)}.bottom button{flex:1}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#182635;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.rank-grid{grid-template-columns:1fr}.span2{grid-column:span 2}}@media(max-width:440px){.grid{grid-template-columns:1fr}.span2{grid-column:span 1}.summary{grid-template-columns:1fr 1fr}}

.event-sync{margin-top:10px;padding:12px;border:1px solid #cfe0ec;border-radius:14px;background:#f7fbfe}.sync-status{font-size:12px;font-weight:900;color:#466176;margin-bottom:9px}.event-options,.item-chips{display:flex;gap:8px;flex-wrap:wrap}.event-choice{border:1.5px solid #b9ccda;background:#fff;border-radius:12px;padding:10px 12px;text-align:left;min-width:190px;color:var(--text)}.event-choice.active{border-color:var(--navy);background:#eaf4ff;box-shadow:0 0 0 2px rgba(23,50,77,.1)}.event-choice strong{display:block;font-size:15px}.event-choice small{display:block;color:var(--muted);margin-top:4px}.item-chip{border:1.5px solid #d5b452;background:#fff9df;color:#563f00;border-radius:999px;padding:9px 13px;font-weight:900}.item-chip.active{background:var(--gold);color:#241800;border-color:#a97b08}.sync-empty{padding:10px;border-radius:10px;background:#fff;color:var(--muted);font-size:12px}.sync-heading{font-size:13px;font-weight:950;margin:12px 0 7px}.event-count{display:inline-block;border-radius:999px;background:var(--navy);color:#fff;padding:3px 8px;font-size:11px;margin-left:5px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script></head>
<body>
<header><div class="top"><div><h1>📈 主力ネタ一覧 v1.2</h1><div class="sub">イベント別の売上・販売数・単価を記録</div></div><button class="back" onclick="goBack()">← 戻る</button></div></header>
<div class="wrap">
<div class="notice">日付を選ぶと、メインアプリからその日の全イベントと全出店ネタを読み込みます。売上金額 ÷ 販売単価で販売数（本数）を自動計算します。</div>
<section class="card">
<h2>① 主力ネタを登録</h2>
<input type="hidden" id="editId">
<div class="grid">
<div class="field"><label>開催日</label><input type="date" id="date" onchange="syncEventsForDate()"></div>
<div class="field span2"><label>イベント名</label><input id="eventName" placeholder="例：柳まつり"></div>
<div class="field"><label>主力ネタ</label><input id="itemName" list="itemOptions" placeholder="例：牛串"></div>
<datalist id="itemOptions"><option>牛串</option><option>からあげ</option><option>ポテト</option><option>チーズハットグ</option><option>肉巻き</option><option>かき氷</option><option>いか焼き</option><option>カステラ</option><option>りんご飴</option><option>チョコバナナ</option></datalist>
<div class="event-sync span2" style="grid-column:1/-1"><div id="syncStatus" class="sync-status">メインアプリのイベントを確認中...</div><div id="eventOptions" class="event-options"></div><div id="netaHeading" class="sync-heading" style="display:none">出店ネタを選択</div><div id="itemChips" class="item-chips"></div></div>
<div class="field"><label>売上金額</label><input type="number" min="0" inputmode="numeric" id="sales" placeholder="100000" oninput="calculateQty()"></div>
<div class="field"><label>販売単価</label><input type="number" min="1" inputmode="numeric" id="unitPrice" placeholder="例：600" oninput="calculateQty()"></div>
<div class="field"><label>販売数（自動計算）</label><input type="number" min="0" inputmode="numeric" id="qty" placeholder="売上金額÷販売単価" readonly style="background:#eef5fa;font-weight:900"></div>
<div class="field"><label>原価合計（任意）</label><input type="number" min="0" inputmode="numeric" id="cost" placeholder="例：40000"></div>
<div class="field span2"><label>会場・場所</label><input id="place" placeholder="例：駅前広場"></div>
<div class="field span2"><label>備考</label><textarea id="memo" placeholder="天候、売れ方、改善点など"></textarea></div>
</div>
<div class="actions"><button class="btn green" onclick="saveRecord()">💾 保存</button><button class="btn ghost" onclick="resetForm()">入力をクリア</button></div>
</section>
<section class="card">
<h2>② 集計条件</h2>
<div class="grid">
<div class="field"><label>表示月</label><input type="month" id="filterMonth" onchange="renderAll()"></div>
<div class="field"><label>ネタで絞込み</label><select id="filterItem" onchange="renderAll()"><option value="">すべて</option></select></div>
<div class="field span2"><label>イベント名検索</label><input id="search" placeholder="イベント名を入力" oninput="renderAll()"></div>
</div>
</section>
<section class="card"><h2>③ 月間集計</h2><div id="summary" class="summary"></div></section>
<section class="card"><h2>④ 主力ネタランキング</h2><div class="rank-grid"><div><h3 style="font-size:15px">売上ランキング</h3><div id="salesRank" class="rank"></div></div><div><h3 style="font-size:15px">販売数ランキング</h3><div id="qtyRank" class="rank"></div></div></div></section>
<section class="card"><h2>⑤ イベント別一覧</h2><div class="table-wrap"><table><thead><tr><th>日付</th><th>イベント名</th><th>主力ネタ</th><th>売上</th><th>販売数</th><th>販売単価</th><th>実績平均単価</th><th>原価</th><th>粗利益</th><th>場所</th><th>備考</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</div>
<div class="bottom"><button class="btn ghost" onclick="goBack()">担当者アプリ</button><button class="btn gold" onclick="exportCsv()">CSV出力</button><button class="btn primary" onclick="scrollTo({top:0,behavior:'smooth'})">＋ 登録</button></div><div class="toast" id="toast"></div>
<script>
const KEY='fujiwara_main_neta_sales_v1';let records=[];let mainEvents=[];let selectedMainEvent=null;
const $=id=>document.getElementById(id);const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(n)||0);const num=n=>new Intl.NumberFormat('ja-JP').format(Number(n)||0);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function load(){try{records=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(records))records=[]}catch(e){records=[]}const d=new Date();$('date').value=d.toISOString().slice(0,10);$('filterMonth').value=d.toISOString().slice(0,7);renderAll();initMainEventSync()}
function persist(){localStorage.setItem(KEY,JSON.stringify(records))}

function splitNeta(raw){return String(raw||'').split(/\r?\n|、|,|・|／|\/|　/).map(s=>s.trim()).filter((s,i,a)=>s&&a.indexOf(s)===i)}
function eventDates(ev){let out=[];if(Array.isArray(ev.dates))out=out.concat(ev.dates);if(Array.isArray(ev.eventDates))out=out.concat(ev.eventDates);const start=ev.date||'';const end=ev.dateEnd||ev.endDate||ev.toDate||'';if(start&&!out.includes(start))out.push(start);if(start&&end&&/^\d{4}-\d{2}-\d{2}$/.test(start)&&/^\d{4}-\d{2}-\d{2}$/.test(end)){let d=new Date(start+'T00:00:00'),e=new Date(end+'T00:00:00'),guard=0;while(d<=e&&guard++<60){let ds=d.toISOString().slice(0,10);if(!out.includes(ds))out.push(ds);d.setDate(d.getDate()+1)}}return [...new Set(out.filter(Boolean))]}
function initMainEventSync(){
 try{
  const config={apiKey:'AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA',authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:5ec6b7e2a2165066956a94'};
  if(!firebase.apps.length)firebase.initializeApp(config);firebase.database().ref('fujiwara/events').on('value',snap=>{const v=snap.val();mainEvents=(Array.isArray(v)?v:Object.values(v||{})).filter(Boolean);$('syncStatus').textContent='✅ メインアプリ連携済み';syncEventsForDate()},err=>{$('syncStatus').textContent='⚠️ メインアプリを読み込めません';syncEventsForDate()})
 }catch(e){$('syncStatus').textContent='⚠️ メインアプリ連携エラー'}
}
function syncEventsForDate(){
 const ds=value('date');selectedMainEvent=null;$('eventName').value='';$('itemName').value='';$('place').value='';$('itemChips').innerHTML='';$('netaHeading').style.display='none';
 const list=mainEvents.filter(ev=>eventDates(ev).includes(ds));
 $('syncStatus').innerHTML=list.length?'この日のイベントを選択してください <span class="event-count">'+list.length+'件</span>':'この日にはメインアプリのイベントがありません。手入力もできます。';
 $('eventOptions').innerHTML=list.length?list.map((ev,i)=>`<button type="button" class="event-choice" id="eventChoice${i}" onclick="selectMainEvent(${i})"><strong>${esc(ev.name||'名称未設定')}</strong><small>${esc(ev.place||'会場未設定')}｜${esc(splitNeta(ev.itemsText).join('・')||'ネタ未設定')}</small></button>`).join(''):'<div class="sync-empty">イベントがない場合は、イベント名と主力ネタを手入力できます。</div>';
 window._dateEvents=list
}
function selectMainEvent(i){
 const ev=(window._dateEvents||[])[i];if(!ev)return;selectedMainEvent=ev;
 document.querySelectorAll('.event-choice').forEach(x=>x.classList.remove('active'));const b=$('eventChoice'+i);if(b)b.classList.add('active');
 $('eventName').value=ev.name||'';$('place').value=ev.place||'';
 const items=splitNeta(ev.itemsText);$('netaHeading').style.display='block';
 $('itemChips').innerHTML=items.length?items.map((x,j)=>`<button type="button" class="item-chip" id="itemChip${j}" onclick="selectNeta(${j},'${encodeURIComponent(x)}')">${esc(x)}</button>`).join(''):'<div class="sync-empty">このイベントには出店ネタが未登録です。</div>';
 if(items.length===1)selectNeta(0,encodeURIComponent(items[0]));else $('itemName').value=''
}
function selectNeta(i,encoded){document.querySelectorAll('.item-chip').forEach(x=>x.classList.remove('active'));const b=$('itemChip'+i);if(b)b.classList.add('active');$('itemName').value=decodeURIComponent(encoded)}

function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function value(id){return $(id).value.trim()}
function calculateQty(){const sales=Number(value('sales')||0),unit=Number(value('unitPrice')||0);$('qty').value=sales>0&&unit>0?Math.round(sales/unit):''}
function saveRecord(){calculateQty();const r={id:value('editId')||uid(),date:value('date'),eventName:value('eventName'),itemName:value('itemName'),sales:Number(value('sales')||0),qty:Number(value('qty')||0),unitPrice:Number(value('unitPrice')||0),cost:Number(value('cost')||0),place:value('place'),memo:value('memo'),updatedAt:Date.now()};if(!r.date||!r.eventName||!r.itemName)return alert('開催日・イベント名・主力ネタを入力してください');if(r.sales>0&&r.unitPrice<=0)return alert('販売単価を入力してください');const i=records.findIndex(x=>x.id===r.id);if(i>=0)records[i]=r;else records.push(r);persist();resetForm(false);renderAll();toast(i>=0?'修正を保存しました':'登録しました')}
function resetForm(setDate=true){['editId','eventName','itemName','sales','qty','unitPrice','cost','place','memo'].forEach(id=>$(id).value='');if(setDate)$('date').value=new Date().toISOString().slice(0,10);syncEventsForDate()}
function editRecord(id){const r=records.find(x=>x.id===id);if(!r)return;Object.entries({editId:r.id,date:r.date,eventName:r.eventName,itemName:r.itemName,sales:r.sales,qty:r.qty,unitPrice:r.unitPrice,cost:r.cost,place:r.place,memo:r.memo}).forEach(([k,v])=>$(k).value=v??'');calculateQty();scrollTo({top:0,behavior:'smooth'})}
function deleteRecord(id){if(!confirm('この記録を削除しますか？'))return;records=records.filter(x=>x.id!==id);persist();renderAll();toast('削除しました')}
function filtered(){const m=value('filterMonth'),it=value('filterItem'),q=value('search').toLowerCase();return records.filter(r=>(!m||String(r.date).startsWith(m))&&(!it||r.itemName===it)&&(!q||String(r.eventName).toLowerCase().includes(q))).sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.updatedAt||0)-(a.updatedAt||0))}
function refreshItems(){const cur=value('filterItem');const items=[...new Set(records.map(r=>r.itemName).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));$('filterItem').innerHTML='<option value="">すべて</option>'+items.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderAll(){refreshItems();const list=filtered();const sales=list.reduce((s,r)=>s+r.sales,0),qty=list.reduce((s,r)=>s+r.qty,0),cost=list.reduce((s,r)=>s+r.cost,0),profit=sales-cost;$('summary').innerHTML=`<div class="sum"><div class="k">売上合計</div><div class="v">${yen(sales)}</div></div><div class="sum"><div class="k">販売数合計</div><div class="v">${num(qty)}</div></div><div class="sum"><div class="k">原価合計</div><div class="v">${yen(cost)}</div></div><div class="sum"><div class="k">粗利益</div><div class="v">${yen(profit)}</div></div>`;renderRank(list,'sales','salesRank');renderRank(list,'qty','qtyRank');$('tbody').innerHTML=list.length?list.map(r=>{const avg=r.qty?Math.round(r.sales/r.qty):0;return `<tr><td>${esc(r.date)}</td><td>${esc(r.eventName)}</td><td>${esc(r.itemName)}</td><td class="num">${yen(r.sales)}</td><td class="num">${num(r.qty)}</td><td class="num">${yen(r.unitPrice)}</td><td class="num">${yen(avg)}</td><td class="num">${yen(r.cost)}</td><td class="num">${yen(r.sales-r.cost)}</td><td>${esc(r.place)}</td><td>${esc(r.memo)}</td><td><button class="mini edit" onclick="editRecord('${r.id}')">修正</button> <button class="mini del" onclick="deleteRecord('${r.id}')">削除</button></td></tr>`}).join(''):'<tr><td colspan="12" class="empty">まだ記録がありません</td></tr>'}
function renderRank(list,key,id){const map={};list.forEach(r=>map[r.itemName]=(map[r.itemName]||0)+Number(r[key]||0));const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);$(id).innerHTML=arr.length?arr.slice(0,10).map((x,i)=>`<div class="rank-row"><div class="rank-no">${i+1}</div><strong>${esc(x[0])}</strong><b>${key==='sales'?yen(x[1]):num(x[1])}</b></div>`).join(''):'<div class="empty">集計データなし</div>'}
function exportCsv(){const list=filtered();if(!list.length)return alert('出力するデータがありません');const rows=[['日付','イベント名','主力ネタ','売上','販売数','販売単価','実績平均単価','原価','粗利益','場所','備考'],...list.map(r=>[r.date,r.eventName,r.itemName,r.sales,r.qty,r.unitPrice,r.qty?Math.round(r.sales/r.qty):0,r.cost,r.sales-r.cost,r.place,r.memo])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`主力ネタ一覧_${value('filterMonth')||'全期間'}.csv`;a.click();URL.revokeObjectURL(a.href)}
function goBack(){if(history.length>1)history.back();else location.href='manager-app.html'}load();
</script>
</body></html>
