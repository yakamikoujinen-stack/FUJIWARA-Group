<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUJIWARA共有</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:18px;border-bottom:4px solid #facc15}main{max-width:900px;margin:auto;padding:14px}.welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff,#f3f4f6);padding:24px;box-sizing:border-box}.welcome-card{width:100%;max-width:520px;text-align:center;background:white;border:1px solid #e5e7eb;border-radius:28px;padding:32px 22px;box-shadow:0 14px 40px rgba(0,0,0,.08)}.welcome-title{font-size:32px;font-weight:900;letter-spacing:.04em;margin:0 0 12px}.welcome-sub{font-size:13px;font-weight:900;letter-spacing:.08em;color:#374151;margin-bottom:22px}.crest{width:170px;height:170px;border:8px solid #111827;border-radius:50%;margin:10px auto 18px;display:flex;align-items:center;justify-content:center;position:relative}.crest:before,.crest:after{content:'◇ ◇ ◇ ◇ ◇';position:absolute;font-size:20px;font-weight:900;color:#374151;top:46px}.crest:before{transform:rotate(-55deg);left:5px}.crest:after{transform:rotate(55deg);right:5px}.crest-core{font-size:72px;font-weight:900;color:#111827}.login-main{width:100%;font-size:20px;border-radius:18px;padding:16px 18px;background:#b7791f}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-bottom:14px}.title{font-size:22px;font-weight:900}.muted,.sub{font-size:13px;color:#6b7280}.sub{color:#e5e7eb}input,textarea{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:12px;padding:11px;margin:5px 0 10px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:900;background:#111827;color:white}.gold{background:#b7791f}.green{background:#16a34a}.gray{background:#6b7280}.red{background:#dc2626}.hide{display:none!important}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{background:#e5e7eb;color:#111827}.tab.active{background:#111827;color:white}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:12px;color:#6b7280;font-weight:900}.day{min-height:70px;border:1px solid #e5e7eb;border-radius:12px;padding:6px;background:white}.today{border:2px solid #b7791f}.list{display:grid;gap:8px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:10px}.pill{display:inline-block;background:#f3f4f6;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.row{display:flex;gap:10px}.row>*{flex:1}.editbox{background:#f9fafb;border:2px solid #d1d5db;border-radius:14px;padding:12px;margin:10px 0 14px}@media(max-width:600px){.welcome-title{font-size:28px}.crest{width:140px;height:140px}.crest-core{font-size:58px}.row{display:block}.actions button{min-width:100%}}</style></head><body><section id="welcome" class="welcome"><div class="welcome-card"><div class="welcome-title">Welcome everyone</div><div class="crest"><div class="crest-core">一</div></div><div class="welcome-sub">FUJIWARA HAJIME INDUSTRY LLC GROUP</div><button class="login-main" onclick="enterApp()">ログイン</button><p class="muted" style="margin-top:14px">共有カレンダー・在庫確認</p></div></section><div id="appShell" style="display:none"><header><div class="title">FUJIWARA Group</div><div class="sub">共有カレンダー・在庫確認</div></header><main><section class="card"><b>共有ページ</b><div class="muted">本アプリの予定メモに「共有✅」が入った予定だけ表示します。シークレット予定は表示しません。</div><div class="row"><div><label>管理者コード</label><input id="adminCode" type="password"></div><div><label>在庫編集コード</label><input id="stockCode" type="password"></div></div><div class="actions"><button class="gold" onclick="adminOn()">管理者編集ON</button><button class="green" onclick="stockOn()">在庫編集ON</button></div><div id="sync" class="muted">読み込み中...</div></section><div class="tabs"><button id="tcal" class="tab active" onclick="tab('cal')">カレンダー</button><button id="tstock" class="tab" onclick="tab('stock')">在庫</button></div><br><section id="calbox" class="card"><div style="display:flex;justify-content:space-between;align-items:center"><button class="gray" onclick="moveMonth(-1)">前月</button><b id="month"></b><button class="gray" onclick="moveMonth(1)">次月</button></div><br><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="days" class="days"></div></section><section id="detail" class="card"><h3 id="detailTitle">日付を選んでください</h3><div id="events" class="list"></div><div id="eventForm" class="hide editbox"><h3>サブアプリ予定を追加・編集</h3><label>日付</label><input id="evDate" type="date"><label>会場名</label><input id="evPlace"><label>内容</label><textarea id="evMemo"></textarea><div class="actions"><button class="green" onclick="saveEvent()">保存</button><button class="gray" onclick="clearEvent()">入力を消す</button></div><p class="muted">※サブアプリ専用予定です。本アプリへは戻しません。</p></div></section><section id="stockbox" class="card hide"><h2>在庫</h2><p class="muted">売上・経費は表示しません。</p><div id="stockForm" class="hide editbox"><h3 id="stockFormTitle">在庫を追加・編集</h3><div class="row"><div><label>商品名</label><input id="stName"></div><div><label>数量</label><input id="stQty" type="number"></div></div><div class="row"><div><label>単位</label><input id="stUnit"></div><div><label>注意数量</label><input id="stMin" type="number"></div></div><label>メモ</label><input id="stMemo"><div class="actions"><button class="green" onclick="saveStock()">保存</button><button class="gray" onclick="clearStock()">入力を消す</button></div></div><div id="stocks" class="list"></div></section></main></div><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script>function enterApp(){document.getElementById('welcome').style.display='none';document.getElementById('appShell').style.display='block'}const A='boss2026',S='staff2026';let admin=false,stok=false,cal=new Date(),sel='',mainEvents=[];let ev=JSON.parse(localStorage.getItem('share_events_v2')||'[]');let st=JSON.parse(localStorage.getItem('share_stocks_v2')||'[]');if(!st.length){st=[{name:'カステラ材料',qty:10,unit:'袋',min:3,memo:''},{name:'牛串',qty:80,unit:'本',min:20,memo:''},{name:'からあげ材料',qty:6,unit:'kg',min:2,memo:''},{name:'りんご飴材料',qty:30,unit:'個分',min:10,memo:''}];saveAll()}function saveAll(){localStorage.setItem('share_events_v2',JSON.stringify(ev));localStorage.setItem('share_stocks_v2',JSON.stringify(st))}function hasShare(e){if(!e||e.secret===true)return false;let m=String(e.memo||'');return m.indexOf('共有✅')>=0||m.indexOf('共有OK')>=0||e.share===true||e.shared===true}function clean(m){return String(m||'').replace(/共有✅/g,'').replace(/共有OK/g,'').trim()}function allEvents(){return mainEvents.filter(hasShare).map(e=>({id:'m_'+e.id,date:e.date,place:e.name||e.place||'予定',memo:(e.place?'場所：'+e.place+'\n':'')+clean(e.memo)})).concat(ev)}function adminOn(){if(adminCode.value===A){admin=true;stok=true;eventForm.classList.remove('hide');stockForm.classList.remove('hide');renderCal();renderStock();alert('管理者編集ON')}else alert('コードが違います')}function stockOn(){if(stockCode.value===S){stok=true;stockForm.classList.remove('hide');renderStock();alert('在庫編集ON')}else alert('コードが違います')}function tab(x){calbox.classList.toggle('hide',x!=='cal');detail.classList.toggle('hide',x!=='cal');stockbox.classList.toggle('hide',x!=='stock');tcal.classList.toggle('active',x==='cal');tstock.classList.toggle('active',x==='stock')}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function moveMonth(n){cal.setMonth(cal.getMonth()+n);renderCal()}function renderCal(){let a=allEvents(),y=cal.getFullYear(),m=cal.getMonth();month.textContent=y+'年 '+(m+1)+'月';let first=new Date(y,m,1).getDay();days.innerHTML='';let today=ymd(new Date());for(let i=0;i<42;i++){let d=new Date(y,m,i-first+1),date=ymd(d),es=a.filter(e=>e.date===date),div=document.createElement('div');div.className='day'+(date===today?' today':'');div.onclick=()=>selectDate(date);div.innerHTML='<b>'+d.getDate()+'</b>'+(es.length?'<div class="muted">'+es.map(e=>esc(e.place)).join(' / ')+'</div>':'');days.appendChild(div)}}function selectDate(date){sel=date;detailTitle.textContent=date+' の予定';evDate.value=date;let es=allEvents().filter(e=>e.date===date);events.innerHTML=es.length?es.map(e=>'<div class="item"><b>'+esc(e.place)+'</b><div>'+nl(e.memo)+'</div>'+(admin&&String(e.id).indexOf('m_')!==0?'<div class="actions"><button class="gray" onclick="editEvent(\''+e.id+'\')">編集</button><button class="red" onclick="delEvent(\''+e.id+'\')">削除</button></div>':'')+'</div>').join(''):'<div class="muted">予定はありません。</div>'}function saveEvent(){if(!admin)return;let date=evDate.value,place=evPlace.value.trim(),memo=evMemo.value.trim();if(!date||!place){alert('日付と会場名を入力してください');return}let id=evDate.dataset.id||String(Date.now()),i=ev.findIndex(e=>e.id===id),o={id,date,place,memo};if(i>=0)ev[i]=o;else ev.push(o);saveAll();clearEvent();renderCal();selectDate(date)}function editEvent(id){let e=ev.find(x=>x.id===id);if(!e)return;evDate.value=e.date;evPlace.value=e.place;evMemo.value=e.memo;evDate.dataset.id=id;eventForm.scrollIntoView({behavior:'smooth'})}function delEvent(id){if(confirm('削除しますか？')){ev=ev.filter(e=>e.id!==id);saveAll();renderCal();selectDate(sel)}}function clearEvent(){evDate.value=sel||'';evPlace.value='';evMemo.value='';delete evDate.dataset.id}function renderStock(){stocks.innerHTML=st.map((s,i)=>'<div class="item"><b>'+esc(s.name)+'</b><span class="pill">数量：'+s.qty+' '+esc(s.unit)+'</span><div class="muted">注意数量：'+s.min+' '+esc(s.unit)+'</div>'+(s.memo?'<div>'+esc(s.memo)+'</div>':'')+(stok?'<div class="actions"><button class="gray" onclick="editStock('+i+')">編集</button><button class="red" onclick="delStock('+i+')">削除</button></div>':'')+'</div>').join('')}function saveStock(){if(!stok)return;let o={name:stName.value.trim(),qty:Number(stQty.value||0),unit:stUnit.value.trim(),min:Number(stMin.value||0),memo:stMemo.value.trim()};if(!o.name){alert('商品名を入力してください');return}let i=stName.dataset.i;if(i!==undefined)st[Number(i)]=o;else st.push(o);saveAll();clearStock();renderStock();alert('在庫を保存しました')}function editStock(i){let s=st[i];stName.value=s.name;stQty.value=s.qty;stUnit.value=s.unit;stMin.value=s.min;stMemo.value=s.memo;stName.dataset.i=i;stockForm.classList.remove('hide');stockForm.scrollIntoView({behavior:'smooth'});setTimeout(()=>stQty.focus(),300)}function delStock(i){if(confirm('削除しますか？')){st.splice(i,1);saveAll();renderStock()}}function clearStock(){stockFormTitle.textContent='在庫を追加・編集';stName.value='';stQty.value='';stUnit.value='';stMin.value='';stMemo.value='';delete stName.dataset.i}function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function nl(s){return esc(s).replace(/\n/g,'<br>')}function startFirebase(){try{firebase.initializeApp({apiKey:'AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA',authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:5ec6b7e2a2165066956a94'});firebase.database().ref('fujiwara/events').on('value',snap=>{let v=snap.val();mainEvents=(Array.isArray(v)?v:Object.values(v||{})).filter(Boolean);sync.textContent='本アプリ共有予定：'+mainEvents.filter(hasShare).length+'件';renderCal();if(sel)selectDate(sel)})}catch(e){sync.textContent='読み込みエラー：'+e.message}}window.onload=()=>{renderCal();renderStock();startFirebase()}</script></body></html>
