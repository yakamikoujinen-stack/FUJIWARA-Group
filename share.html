<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUJIWARA Group｜共有カレンダー</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:18px;border-bottom:4px solid #facc15}main{max-width:900px;margin:auto;padding:14px}.title{font-size:22px;font-weight:900}.sub{font-size:13px;color:#e5e7eb}.card{background:white;border-radius:16px;padding:14px;margin-bottom:14px;border:1px solid #e5e7eb;box-shadow:0 6px 18px rgba(0,0,0,.05)}input,textarea,button{font:inherit}input,textarea{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:12px;padding:11px;margin:5px 0 10px}textarea{min-height:70px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:900;background:#111827;color:white}.gold{background:#b7791f}.gray{background:#6b7280}.red{background:#dc2626}.green{background:#16a34a}.hide{display:none!important}.muted{color:#6b7280;font-size:13px}.danger{color:#dc2626;font-weight:900}.ok{color:#16a34a;font-weight:900}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{background:#e5e7eb;color:#111827}.tab.active{background:#111827;color:white}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.calhead{display:flex;justify-content:space-between;align-items:center}.month{font-size:20px;font-weight:900}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:12px;color:#6b7280;font-weight:900}.day{min-height:72px;border:1px solid #e5e7eb;border-radius:12px;padding:6px;background:white;position:relative}.today{border:2px solid #b7791f}.dot{width:8px;height:8px;background:#b7791f;border-radius:50%;position:absolute;right:8px;top:8px}.small{font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list{display:grid;gap:8px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:10px}.pill{display:inline-block;background:#f3f4f6;border-radius:999px;padding:4px 8px;font-size:12px;margin:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.row{display:flex;gap:10px}.row>*{flex:1}@media(max-width:600px){.day{min-height:58px}.small{display:none}.row{display:block}}
</style>
</head>
<body>
<header><div class="title">FUJIWARA Group</div><div class="sub">共有カレンダー・在庫確認</div></header>
<main>
<section id="loginBox" class="card"><h2>ログイン</h2><p class="muted">名前とパスワードを入力してください。</p><label>名前</label><input id="loginName" placeholder="例：山田 太郎"><label>パスワード</label><input id="loginPass" type="password"><button class="gold" onclick="login()">入る</button><p id="msg" class="danger"></p></section>
<section id="app" class="hide">
<div class="card top"><div><b id="hello"></b><div class="muted">予定と在庫を確認できます</div></div><button class="gray" onclick="logout()">ログアウト</button></div>
<div class="tabs"><button id="tcal" class="tab active" onclick="tab('cal')">カレンダー</button><button id="tstock" class="tab" onclick="tab('stock')">在庫</button></div><br>
<section id="calbox" class="card"><div class="calhead"><button class="gray" onclick="moveMonth(-1)">前月</button><div id="month" class="month"></div><button class="gray" onclick="moveMonth(1)">次月</button></div><br><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="days" class="days"></div></section>
<section id="detail" class="card"><h3 id="detailTitle">日付を選んでください</h3><div id="events" class="list"></div><div id="adminEvent" class="hide"><hr><h3>予定を追加・編集</h3><label>日付</label><input id="evDate" type="date"><label>会場名</label><input id="evPlace" placeholder="例：A会場"><label>内容</label><textarea id="evMemo" placeholder="例：カステラ、牛串、からあげ"></textarea><div class="actions"><button class="green" onclick="saveEvent()">保存</button><button class="gray" onclick="clearEvent()">入力を消す</button></div></div></section>
<section id="stockbox" class="card hide"><h2>在庫</h2><div id="stocks" class="list"></div><div id="adminStock" class="hide"><hr><h3>在庫を追加・編集</h3><div class="row"><div><label>商品名</label><input id="stName"></div><div><label>数量</label><input id="stQty" type="number"></div></div><div class="row"><div><label>単位</label><input id="stUnit"></div><div><label>注意数量</label><input id="stMin" type="number"></div></div><label>メモ</label><input id="stMemo"><div class="actions"><button class="green" onclick="saveStock()">保存</button><button class="gray" onclick="clearStock()">入力を消す</button></div></div></section>
<div class="card"><b>連絡</b><br><span class="muted">予定や在庫の変更が必要な場合は、管理者へ連絡してください。</span></div>
</section>
</main>
<script>
const STAFF_PASS='staff2026',ADMIN_PASS='boss2026';let role='',user='',cal=new Date(),sel='';let ev=JSON.parse(localStorage.share_events||'[]');let st=JSON.parse(localStorage.share_stocks||'[]');if(!st.length){st=[{name:'カステラ材料',qty:10,unit:'袋',min:3,memo:''},{name:'牛串',qty:80,unit:'本',min:20,memo:''},{name:'からあげ材料',qty:6,unit:'kg',min:2,memo:''},{name:'りんご飴材料',qty:30,unit:'個分',min:10,memo:''}];saveAll()}function saveAll(){localStorage.share_events=JSON.stringify(ev);localStorage.share_stocks=JSON.stringify(st)}function login(){user=loginName.value.trim();let p=loginPass.value.trim();if(!user){msg.textContent='名前を入力してください';return}if(p===ADMIN_PASS)role='admin';else if(p===STAFF_PASS)role='staff';else{msg.textContent='パスワードが違います';return}sessionStorage.share_user=user;sessionStorage.share_role=role;boot()}function boot(){loginBox.classList.add('hide');app.classList.remove('hide');hello.textContent=user+' さん';adminEvent.classList.toggle('hide',role!=='admin');adminStock.classList.toggle('hide',role!=='admin');renderCal();renderStock()}function logout(){sessionStorage.clear();location.reload()}function tab(x){calbox.classList.toggle('hide',x!=='cal');detail.classList.toggle('hide',x!=='cal');stockbox.classList.toggle('hide',x!=='stock');tcal.classList.toggle('active',x==='cal');tstock.classList.toggle('active',x==='stock')}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function moveMonth(n){cal.setMonth(cal.getMonth()+n);renderCal()}function renderCal(){let y=cal.getFullYear(),m=cal.getMonth();month.textContent=y+'年 '+(m+1)+'月';let first=new Date(y,m,1).getDay();days.innerHTML='';let today=ymd(new Date());for(let i=0;i<42;i++){let day=i-first+1;let d=new Date(y,m,day);let date=ymd(d);let es=ev.filter(e=>e.date===date);let div=document.createElement('div');div.className='day'+(date===today?' today':'');div.onclick=()=>selectDate(date);div.innerHTML='<b>'+d.getDate()+'</b>'+(es.length?'<span class="dot"></span><div class="small">'+es.map(e=>esc(e.place)).join(' / ')+'</div>':'');days.appendChild(div)}}function selectDate(date){sel=date;detailTitle.textContent=date+' の予定';evDate.value=date;let es=ev.filter(e=>e.date===date);events.innerHTML=es.length?es.map(e=>'<div class="item"><b>'+esc(e.place)+'</b><div>'+nl(e.memo)+'</div>'+(role==='admin'?'<div class="actions"><button class="gray" onclick="editEvent(\''+e.id+'\')">編集</button><button class="red" onclick="delEvent(\''+e.id+'\')">削除</button></div>':'')+'</div>').join(''):'<div class="muted">予定はありません。</div>'}function saveEvent(){if(role!=='admin')return;let date=evDate.value,place=evPlace.value.trim(),memo=evMemo.value.trim();if(!date||!place){alert('日付と会場名を入力してください');return}let id=evDate.dataset.id||String(Date.now()),i=ev.findIndex(e=>e.id===id),o={id,date,place,memo};if(i>=0)ev[i]=o;else ev.push(o);saveAll();clearEvent();renderCal();selectDate(date)}function editEvent(id){let e=ev.find(x=>x.id===id);evDate.value=e.date;evPlace.value=e.place;evMemo.value=e.memo;evDate.dataset.id=id}function delEvent(id){if(confirm('削除しますか？')){ev=ev.filter(e=>e.id!==id);saveAll();renderCal();selectDate(sel)}}function clearEvent(){evPlace.value='';evMemo.value='';delete evDate.dataset.id}function renderStock(){stocks.innerHTML=st.map((s,i)=>'<div class="item"><b>'+esc(s.name)+'</b><span class="pill">数量：'+s.qty+' '+esc(s.unit)+'</span> '+(Number(s.qty)<=Number(s.min)?'<span class="danger">少なめ</span>':'<span class="ok">OK</span>')+'<div class="muted">注意数量：'+s.min+' '+esc(s.unit)+'</div>'+(s.memo?'<div>'+esc(s.memo)+'</div>':'')+(role==='admin'?'<div class="actions"><button class="gray" onclick="editStock('+i+')">編集</button><button class="red" onclick="delStock('+i+')">削除</button></div>':'')+'</div>').join('')}function saveStock(){if(role!=='admin')return;let o={name:stName.value.trim(),qty:Number(stQty.value||0),unit:stUnit.value.trim(),min:Number(stMin.value||0),memo:stMemo.value.trim()};if(!o.name){alert('商品名を入力してください');return}let i=stName.dataset.i;if(i!==undefined)st[Number(i)]=o;else st.push(o);saveAll();clearStock();renderStock()}function editStock(i){let s=st[i];stName.value=s.name;stQty.value=s.qty;stUnit.value=s.unit;stMin.value=s.min;stMemo.value=s.memo;stName.dataset.i=i}function delStock(i){if(confirm('削除しますか？')){st.splice(i,1);saveAll();renderStock()}}function clearStock(){stName.value='';stQty.value='';stUnit.value='';stMin.value='';stMemo.value='';delete stName.dataset.i}function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function nl(s){return esc(s).replace(/\n/g,'<br>')}window.onload=()=>{user=sessionStorage.share_user||'';role=sessionStorage.share_role||'';if(user&&role)boot()}
</script>
</body>
</html>
