<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FKS AI Secretary v1.0</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7}
header{background:#1b2a41;color:#fff;padding:18px;text-align:center}
main{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.item{padding:10px;border-bottom:1px solid #eee}
button{padding:10px 16px;border:0;border-radius:8px;background:#1b2a41;color:#fff}
</style>
</head>
<body>
<header>
<h1>🤖 FKS AI Secretary v1.0</h1>
<p>社長専用 AI秘書</p>
</header>

<main>
<div class="card">
<h2>本日の経営コメント</h2>
<div id="comment"></div>
<button onclick="refresh()">更新</button>
</div>

<div class="card">
<h2>確認事項</h2>
<div class="item">📋 建設日報の入力状況を確認してください。</div>
<div class="item">💰 会計入力が完了しているか確認してください。</div>
<div class="item">🎪 イベント売上を確認してください。</div>
<div class="item">👷 スタッフ連絡事項を確認してください。</div>
</div>

<div class="card">
<h2>AIメモ</h2>
<textarea id="memo" style="width:100%;height:120px"></textarea><br><br>
<button onclick="save()">保存</button>
</div>
</main>

<script>
const msgs=[
"今日も安全第一で進めましょう。",
"利益率を確認して原価を見直しましょう。",
"未入力データがないか確認してください。",
"今週の予定をスタッフと共有しましょう。"
];

function refresh(){
 document.getElementById("comment").textContent=msgs[Math.floor(Math.random()*msgs.length)];
}
function save(){
 localStorage.setItem("fks_ai_memo",document.getElementById("memo").value);
 alert("保存しました");
}
window.onload=()=>{
 document.getElementById("memo").value=localStorage.getItem("fks_ai_memo")||"";
 refresh();
}
</script>
</body>
</html>
