<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUJIWARA 建設アプリ 正式版</title><style>
:root{--blue:#1f3a5f;--bg:#eef2f7;--card:#fff;--line:#d6dde8;--green:#0a7a2f;--gray:#777;--red:#b00020}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#172033}header{background:linear-gradient(135deg,var(--blue),#10243f);color:#fff;text-align:center;padding:18px}main{max-width:1100px;margin:auto;padding:16px}.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tab{background:#dbe7f7;color:var(--blue)}.active{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day,.head{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:88px;padding:6px;font-size:13px}.head{min-height:auto;text-align:center;font-weight:bold;background:var(--blue);color:#fff}.num{font-weight:900}.job{margin-top:4px;background:#e8f1ff;border-left:4px solid var(--blue);border-radius:6px;padding:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.report{background:#e9f9ef;border-left-color:var(--green)}input,textarea,button,select{width:100%;font-size:16px;padding:11px;margin-top:8px;border-radius:10px;border:1px solid #ccd3dd}button{background:var(--blue);color:#fff;border:0;font-weight:bold}.btn2{background:var(--green)}.btn3{background:var(--gray)}.btnDanger{background:var(--red)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{display:flex;gap:8px;align-items:center;justify-content:space-between}.small{font-size:12px;color:#666}.req{color:#b00020;font-weight:bold}.pill{display:inline-flex;align-items:center;gap:6px;background:#e8f1ff;color:var(--blue);padding:5px 9px;border-radius:999px;margin:3px;font-size:12px;font-weight:bold}.pill button{width:auto;margin:0;padding:2px 7px;border-radius:999px;background:var(--red);font-size:11px}@media(max-width:720px){.row{grid-template-columns:1fr}.grid{gap:4px}.day{min-height:76px;font-size:12px}}
</style></head><body><header><h1>🏗 FUJIWARA 建設アプリ</h1><p>現場予定・日報管理 正式版</p></header><main>
<div class="card tabs"><button id="tabCal" class="tab active" onclick="mode='calendar';switchMode()">📅 予定</button><button id="tabRep" class="tab" onclick="mode='report';switchMode()">📝 日報</button></div>
<section id="calendarMode"><div class="card nav"><button onclick="moveMonth(-1)">← 前月</button><h2 id="monthTitle"></h2><button onclick="moveMonth(1)">翌月 →</button></div>
<div class="card"><h3>現場予定を登録</h3><div class="row"><input id="date" type="date"><input id="site" placeholder="現場名"></div><select id="clientSelect"></select><div id="newClientBox" style="display:none"><input id="clientNew" placeholder="新規取引先名"><button class="btn2" type="button" onclick="addClient('job')">取引先を登録</button></div><div class="row"><input id="start" type="time"><input id="workers" placeholder="作業員（例：山田、田中）"></div><textarea id="work" placeholder="作業内容・持ち物・注意事項"></textarea><button onclick="addJob()">予定を保存</button></div>
<div class="card"><h3>取引先管理</h3><div id="clientList" class="small"></div></div>
<div class="card"><div class="grid" id="calendarHead"></div><div class="grid" id="calendar"></div></div><div class="card"><h3>選択日の予定・日報</h3><div id="selectedList">日付を選択してください</div></div></section>
<section id="reportMode" style="display:none"><div class="card"><h3>日報入力</h3><p class="small"><span class="req">*</span> は必須。作業員名・取引先は登録リストから選択、または新規登録できます。</p><div class="row"><div><label>日付 <span class="req">*</span></label><input id="rDate" type="date"></div><div><label>現場名 <span class="req">*</span></label><input id="rSite" placeholder="現場名"></div></div>
<div class="row"><div><label>取引先名</label><select id="rClientSelect"></select><div id="rNewClientBox" style="display:none"><input id="rClientNew" placeholder="新規取引先名"><button type="button" class="btn2" onclick="addClient('report')">取引先を登録</button></div></div><div><label>人数 <span class="req">*</span></label><input id="rPeople" type="number" placeholder="人数"></div></div>
<div class="row"><div><label>作業員名 <span class="req">*</span></label><select id="rWorkerSelect" onchange="selectWorker()"></select><input id="rWorkerNew" placeholder="新規作業員名" style="display:none"><button id="addWorkerBtn" type="button" class="btn2" style="display:none" onclick="addWorker()">作業員を登録</button></div><div><label>天気</label><select id="rWeather"><option value="">選択</option><option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option><option>強風</option></select></div></div>
<div class="row"><div><label>出勤時間 <span class="req">*</span></label><input id="rStart" type="time"></div><div><label>退場時間 <span class="req">*</span></label><input id="rEnd" type="time"></div></div><div class="row"><div><label>休憩（分）</label><input id="rBreak" type="number" placeholder="休憩 分"></div><div></div></div><label>本日の作業内容 <span class="req">*</span></label><textarea id="rWork" placeholder="例：基礎工事、配筋、コンクリート打設など"></textarea><label>連絡事項・問題点・明日の予定</label><textarea id="rMemo" placeholder="自由入力"></textarea><button class="btn2" onclick="addReport()">日報を保存</button></div>
<div class="card"><h3>登録済み作業員</h3><div id="workerList" class="small"></div></div><div class="card"><h3>日報一覧</h3><div id="reportList">日報なし</div></div></section></main>
<script>
let current=new Date(),selectedDate="",mode="calendar";
function loadJobs(){return JSON.parse(localStorage.getItem("fks_construction_calendar")||"[]")}function saveJobs(v){localStorage.setItem("fks_construction_calendar",JSON.stringify(v));localStorage.setItem("fks_last_saved",new Date().toLocaleString())}
function loadReports(){return JSON.parse(localStorage.getItem("fks_construction_reports")||"[]")}function saveReports(v){localStorage.setItem("fks_construction_reports",JSON.stringify(v));localStorage.setItem("fks_last_saved",new Date().toLocaleString())}
function loadWorkers(){return JSON.parse(localStorage.getItem("fks_construction_workers")||'["藤原","山田","田中"]')}function saveWorkers(v){localStorage.setItem("fks_construction_workers",JSON.stringify(v))}
function loadClients(){return JSON.parse(localStorage.getItem("fks_construction_clients")||'["未登録","藤原一工業合同会社","リコー工業合同会社","株式会社ミライソ"]')}function saveClients(v){localStorage.setItem("fks_construction_clients",JSON.stringify(v))}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s||"").replace(/'/g,"&#39;")}
function renderClients(){const clients=loadClients(),opts='<option value="">取引先を選択</option>'+clients.map(c=>'<option>'+c+'</option>').join("")+'<option value="__new__">＋ 新規取引先を登録</option>';clientSelect.innerHTML=opts;rClientSelect.innerHTML=opts;clientList.innerHTML=clients.map(c=>'<span class="pill">'+c+' <button onclick="deleteClient(\\''+esc(c)+'\\')">×</button></span>').join("");clientSelect.onchange=()=>newClientBox.style.display=clientSelect.value==="__new__"?"block":"none";rClientSelect.onchange=()=>rNewClientBox.style.display=rClientSelect.value==="__new__"?"block":"none"}
function addClient(where){const inp=where==="report"?rClientNew:clientNew,name=inp.value.trim();if(!name){alert("取引先名を入力してください");return}const clients=loadClients();if(!clients.includes(name))clients.push(name);saveClients(clients);renderClients();if(where==="report"){rClientSelect.value=name;rNewClientBox.style.display="none"}else{clientSelect.value=name;newClientBox.style.display="none"}inp.value="";alert("取引先を登録しました")}
function deleteClient(name){if(!confirm(name+" を削除しますか？"))return;saveClients(loadClients().filter(c=>c!==name));renderClients()}
function renderWorkers(){const workers=loadWorkers();rWorkerSelect.innerHTML='<option value="">作業員を選択</option>'+workers.map(w=>'<option>'+w+'</option>').join("")+'<option value="__new__">＋ 新規作業員を登録</option>';workerList.innerHTML=workers.map(w=>'<span class="pill">'+w+' <button onclick="deleteWorker(\\''+esc(w)+'\\')">×</button></span>').join("")}
function selectWorker(){const n=rWorkerSelect.value==="__new__";rWorkerNew.style.display=n?"block":"none";addWorkerBtn.style.display=n?"block":"none"}
function addWorker(){const name=rWorkerNew.value.trim();if(!name){alert("作業員名を入力してください");return}const workers=loadWorkers();if(!workers.includes(name))workers.push(name);saveWorkers(workers);renderWorkers();rWorkerSelect.value=name;rWorkerNew.value="";selectWorker();alert("作業員を登録しました")}
function deleteWorker(name){if(!confirm(name+" を削除しますか？"))return;saveWorkers(loadWorkers().filter(w=>w!==name));renderWorkers()}
function switchMode(){calendarMode.style.display=mode==="calendar"?"block":"none";reportMode.style.display=mode==="report"?"block":"none";tabCal.className=mode==="calendar"?"tab active":"tab";tabRep.className=mode==="report"?"tab active":"tab";if(mode==="report"){renderReports();renderWorkers();renderClients()}}
function addJob(){const client=clientSelect.value==="__new__"?clientNew.value:clientSelect.value;if(!date.value||!site.value){alert("日付と現場名を入力してください");return}const jobs=loadJobs();jobs.push({id:Date.now(),date:date.value,site:site.value,client,start:start.value,workers:workers.value,work:work.value});saveJobs(jobs);site.value=start.value=workers.value=work.value="";clientSelect.value="";render();alert("予定を保存しました")}
function addReport(){const worker=rWorkerSelect.value==="__new__"?rWorkerNew.value:rWorkerSelect.value,client=rClientSelect.value==="__new__"?rClientNew.value:rClientSelect.value;if(!rDate.value||!rSite.value||!worker||!rPeople.value||!rStart.value||!rEnd.value||!rWork.value){alert("必須項目を入力してください");return}const reps=loadReports();reps.push({id:Date.now(),date:rDate.value,site:rSite.value,client,worker,people:rPeople.value,start:rStart.value,end:rEnd.value,breakMin:rBreak.value,weather:rWeather.value,work:rWork.value,memo:rMemo.value,approved:false,created:new Date().toLocaleString()});saveReports(reps);rSite.value=rPeople.value=rStart.value=rEnd.value=rBreak.value=rWeather.value=rWork.value=rMemo.value="";rWorkerSelect.value="";rClientSelect.value="";renderReports();render();alert("日報を保存しました")}
function delJob(id){if(confirm("予定を削除しますか？")){saveJobs(loadJobs().filter(x=>x.id!==id));render();showDay(selectedDate)}}function delReport(id){if(confirm("日報を削除しますか？")){saveReports(loadReports().filter(x=>x.id!==id));renderReports();render();showDay(selectedDate)}}function approveReport(id){saveReports(loadReports().map(x=>x.id===id?{...x,approved:true}:x));renderReports();render();showDay(selectedDate)}
function copyToReport(j){mode="report";switchMode();rDate.value=j.date;rSite.value=j.site;rClientSelect.value=j.client||"";rPeople.value=(j.workers||"").split(/[、,]/).filter(Boolean).length||"";rStart.value=j.start;rWork.value=j.work;scrollTo({top:0,behavior:"smooth"})}
function moveMonth(n){current.setMonth(current.getMonth()+n);render()}
function showDay(ds){selectedDate=ds;const jobs=loadJobs().filter(x=>x.date===ds),reps=loadReports().filter(x=>x.date===ds);selectedList.innerHTML=(jobs.length||reps.length)?jobs.map(j=>'<div class="card"><b>予定：'+j.site+'</b><br><span class="small">'+(j.start||"-")+' / 取引先：'+(j.client||"-")+'</span><br>作業員：'+(j.workers||"-")+'<br>内容：'+(j.work||"-")+'<br><button onclick=\\'copyToReport('+JSON.stringify(j).replace(/'/g,"&#39;")+')\\'>この予定から日報作成</button><button class="btn3" onclick="delJob('+j.id+')">予定削除</button></div>').join("")+reps.map(r=>'<div class="card"><b>日報：'+r.site+'</b><br><span class="small">'+(r.approved?"承認済み":"未承認")+' / 取引先：'+(r.client||"-")+'</span><br>作業員：'+r.worker+'<br>出勤：'+r.start+'　退場：'+r.end+'<br>内容：'+r.work+'<br><button onclick="approveReport('+r.id+')">承認</button><button class="btn3" onclick="delReport('+r.id+')">日報削除</button></div>').join(""):"予定・日報なし"}
function renderReports(){const reps=loadReports().slice().reverse();reportList.innerHTML=reps.length?reps.map(r=>'<div class="card"><b>'+r.date+'　'+r.site+'</b><br><span class="small">'+(r.approved?"✅ 承認済み":"🟡 未承認")+' / 取引先：'+(r.client||"-")+' / 登録 '+(r.created||"-")+'</span><br>作業員：'+r.worker+'　人数：'+r.people+'<br>出勤：'+r.start+'　退場：'+r.end+'　休憩：'+(r.breakMin||"0")+'分　天気：'+(r.weather||"-")+'<br>作業内容：'+r.work+'<br>連絡事項：'+(r.memo||"-")+'<br><button onclick="approveReport('+r.id+')">承認</button><button class="btn3" onclick="delReport('+r.id+')">削除</button></div>').join(""):"日報なし"}
function render(){const y=current.getFullYear(),m=current.getMonth();monthTitle.textContent=y+"年 "+(m+1)+"月";calendarHead.innerHTML=["日","月","火","水","木","金","土"].map(x=>'<div class="head">'+x+'</div>').join("");const first=new Date(y,m,1),last=new Date(y,m+1,0),jobs=loadJobs(),reps=loadReports();let html="";for(let i=0;i<first.getDay();i++)html+="<div></div>";for(let d=1;d<=last.getDate();d++){const ds=fmt(new Date(y,m,d)),dayJobs=jobs.filter(x=>x.date===ds),dayReports=reps.filter(x=>x.date===ds);html+='<div class="day" onclick="showDay(\\''+ds+'\\')"><div class="num">'+d+'</div>'+dayJobs.slice(0,2).map(j=>'<div class="job">'+(j.start||"")+" "+j.site+'</div>').join("")+dayReports.slice(0,3).map(r=>'<div class="job report">'+r.site+'</div>').join("")+'</div>'}calendar.innerHTML=html}
const today=fmt(new Date());date.value=today;rDate.value=today;renderWorkers();renderClients();render();renderReports();
</script></body></html>
