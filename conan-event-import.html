<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17324d">
<title>コナンプロデュース予定表</title>
<style>
:root{--navy:#17324d;--blue:#1677e8;--bg:#f4f6f8;--line:#d8dde5;--text:#172033;--sub:#667085;--internal:#fff8e8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1450px;margin:auto;padding:14px 12px 105px}
.hero{background:linear-gradient(135deg,#17324d,#2c6495);color:#fff;border-radius:22px;padding:18px}
.hero h1{margin:0;font-size:clamp(25px,4vw,40px)}.hero p{margin:7px 0 0;color:#dbeafe;font-weight:800}
.panel{margin-top:15px;background:#fff;border:1px solid #e7ebf0;border-radius:18px;padding:14px;box-shadow:0 7px 20px rgba(20,40,70,.06)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.head h2{margin:0;color:#173b61}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.filebtn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;background:#e7edf5;color:#1f2937}
button.primary{background:var(--blue);color:#fff}button.danger{background:#feecec;color:#b42318}button.good{background:#e9f7ef;color:#126b36}
.note{font-size:12px;color:var(--sub);margin:8px 0}.status{font-size:12px;font-weight:900;color:#176b3a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.sheet{border:1px solid #e1e7ef;border-radius:18px;padding:16px;background:#fff}
.sheet-icon{font-size:38px}.sheet h3{margin:6px 0 4px;font-size:21px}.meta{color:var(--sub);font-size:12px}.sheet .actions{margin-top:12px}
#editor{display:none}#editor.show{display:block}
#sheetTitle{width:100%;font-size:25px;font-weight:950;border:1px solid #cfd7e2;border-radius:12px;padding:10px 12px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:10px}
table{width:100%;min-width:1100px;border-collapse:collapse}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;background:#fff;vertical-align:middle}
th{background:#edf2f7;padding:11px 8px;text-align:center;position:sticky;top:0}
td input,td textarea{width:100%;border:0;outline:0;padding:10px;font:inherit;background:transparent}td textarea{min-height:52px;resize:vertical}
.chk{width:65px;text-align:center}.chk input{width:28px;height:28px}.sun{color:#d32f2f!important;font-weight:900}.sat{color:#1565c0!important;font-weight:900}.internal{background:var(--internal)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.bottom button{background:transparent}.bottom b{display:block;font-size:22px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}}
@media print{
  .hero,#home,.editor-actions,.note,.status,.bottom,.internal,.del{display:none!important}
  body{background:#fff}.wrap{padding:0}.panel{border:0;box-shadow:none;margin:0;padding:0}#editor{display:block!important}
  #sheetTitle{border:0;padding:0 0 12px;font-size:20pt}.tablewrap{overflow:visible;border:0}table{min-width:0;font-size:9.5pt}th{position:static}
}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
  <h1>📋 コナンプロデュース予定表</h1>
  <p>年度・季節ごとに予定表を保存。追加予定は自動で日付順に並びます。</p>
</section>

<section class="panel" id="home">
  <div class="head">
    <h2>予定表一覧</h2>
    <button class="primary" onclick="createSheet()">＋ 新規予定表</button>
  </div>
  <div class="note">「📄 質疑応答表」と、年度・季節ごとの予定表をここから開けます。例：「2026秋」「2027春」。</div>
  <div class="grid" style="margin-bottom:12px">
  <div class="sheet" style="border:2px solid #cfe0f3;background:#f8fbff">
    <div class="sheet-icon">📄</div>
    <h3>質疑応答表</h3>
    <div class="meta">コナンプロデュース様との質疑・応答・結果回答を整理<br>PDF送付用</div>
    <div class="actions">
      <button class="primary" onclick="location.href='./conan-qa.html'">開く</button>
    </div>
  </div>
</div>
<div id="sheetGrid" class="grid"></div>
</section>

<section class="panel" id="editor">
  <input id="sheetTitle" oninput="renameSheet(this.value)">
  <div class="actions editor-actions" style="margin:10px 0">
    <button class="primary" onclick="addRow()">＋ 行を追加</button>
    <button onclick="sortRows()">↕ 日付順</button>
    <button class="good" id="autoSortBtn" onclick="toggleAutoSort()">🔄 自動日付順 ON</button>
    <button onclick="window.print()">🖨 印刷 / PDF</button>
    <button onclick="exportCSV()">⬇ CSV</button>
    <button onclick="backupCurrent()">📦 バックアップ</button>
    <label class="filebtn">📥 復元<input type="file" accept=".json" style="display:none" onchange="restoreCurrent(this.files[0]);this.value=''"></label>
    <button onclick="duplicateCurrent()">複製</button>
    <button class="danger" onclick="deleteCurrent()">この予定表を削除</button>
  </div>
  <div id="status" class="status">自動保存ON</div>
  <div class="note">新しい予定を追加・編集したあと、日付欄から離れると自動で日付順に並び替えます。「未定」「なし？」などは最後に残します。内部メモは印刷時には非表示です。</div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>✅</th><th>日付</th><th>イベント名</th><th>場所</th><th>出店アイテム</th><th class="internal">内部メモ</th><th class="del">削除</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>
</div>

<nav class="bottom">
  <button onclick="showHome()"><b>📚</b>予定表一覧</button>
  <button onclick="createSheet()"><b>＋</b>新規</button>
  <button onclick="location.href='./index.html'"><b>👑</b>KINGへ戻る</button>
</nav>

<script>
const BOOK_KEY='fujiwara_conan_order_books_v1';
const LEGACY_KEY='fujiwara_conan_order_2026_autumn_v1';
const DEFAULT_2026_AUTUMN=[["8/23(日)", "神鍋高原スイカ祭", "神鍋高原 道の駅", "チーズハットグ\n焼鳥", true], ["8/29(土)", "コムスエルムプラザ夏祭り", "三田市", "", false], ["9/12(土)", "JAパスカル三田初収穫祭", "三田市", "からあげ・ポテト\n？・蟹棒", true], ["9/19(土)", "香住ガニ祭り", "香住漁港西港上屋4号", "からあげ・ポテト・チーズハットグ・かに棒", true], ["10/4(日)", "伊賀市国際交流フェスタ", "伊賀ひぞっこPにて", "", false], ["10/10(土)", "日本製鉄(株)関西製鉄所", "尼崎市", "焼鳥　からあげ\nとんかつ", true], ["10/11(日)", "長尾熊野神社", "神戸市長田区", "たこ焼き　牛串　たん串\nポテト", true], ["10/17(土)", "JAパスカル三田 秋本裕収穫祭", "三田市", "", false], ["10/17(土)", "JA丹波ひかみ春日感謝祭", "丹波市春日IC", "からあげ・ハットグ\nチョコバナナ・いか焼", true], ["10/18(日)", "熊野神社秋祭り", "兵庫県仁川", "からあげ・ポテト・りんご飴", true], ["10/24(土)〜10/25(日)", "JAいがひぞっこ収穫祭", "三重県伊賀市", "", false], ["10/24(土)", "JA丹波ひかみ市島感謝祭", "丹波市春日IC", "からあげ・ポテト\nチョコバナナ・いか焼", true], ["10/25(日)", "コスムエルムプラザ秋祭り", "三田市", "", false], ["10/31(土)", "JA丹波ひかみ青垣感謝祭", "丹波市青垣IC", "からあげ・ポテト\nチョコバナナ・いか焼", true], ["10/25(日)", "神鍋高原マロニエ祭", "神鍋高原 道の駅", "", false], ["11/3(火)", "JA丹波ひかみ本店感謝祭", "丹波市氷上本店", "からあげ・ポテト\nチョコバナナ・いか焼", true], ["11/7(土)", "JAたじま和田山感謝祭", "朝来市", "からあげ　とんかつ", true], ["11/7(土)", "JA丹波ひかみ柏原感謝祭", "丹波市柏原IC", "からあげ・ポテト\nチョコバナナ・いか焼", true], ["11/?", "JAパスカル三田農業祭", "三田市", "", false], ["11/13(金)〜11/14(土)", "JA兵庫六甲 農機展示会", "神戸市北区八多町", "カステラ　たこ焼き", true], ["未定", "神鍋高原 ネギ祭り", "神鍋高原 道の駅", "", false], ["11/14(土)", "JA丹波ひかみ山南感謝祭", "丹波市山南支店", "からあげ・ポテト\nチョコバナナ・いか焼", true], ["11/14(土)", "JA兵庫西しそう", "宍粟市", "うどん　からあげ　ポテト", true], ["11/15(日)", "香住松葉ガニ祭り", "香住漁港西港上屋4号", "牛串　からあげ　ポテト\nりんご飴", true], ["11/21(土)", "JA兵庫西 佐用感謝祭", "姫路市", "①とんかつ　からあげ\n②フルーツ飴", true], ["11/21(土)", "JA兵庫六甲 道の駅淡河ふるさと祭", "神戸市北区淡河町", "たこ焼き　カステラ", true], ["12/2(水)〜12/3(木)", "全農兵庫 クボタアグリフェア", "三木市メッセ三木", "たこ焼き　カステラ", true], ["12/17(木)", "JA丹波ひかみ山南 年末感謝祭", "丹波市", "たこ焼き　だんご串\nカステラ", true], ["12/18(金)〜12/19(土)", "JAパスカル 三田感謝祭", "三田市", "からあげ　ポテト\nりんご飴", true], ["12/19(土)〜12/20(日)", "JAいがひぞっこ 周年祭", "三重県伊賀市", "りんご飴　カステラ\nからあげ　ポテト　豚焼き", true], ["なし？", "サンパレス六甲物産展", "西宮市山口町", "", false]];
let currentId=null;

function uid(){return 'book_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function now(){return new Date().toLocaleString('ja-JP')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dc(v){v=String(v||'');if(/[（(]土[）)]/.test(v))return'sat';if(/[（(]日[）)]/.test(v))return'sun';return''}
function normRow(r){r=r||{};return{ok:!!r.ok,date:String(r.date||''),event:String(r.event||''),place:String(r.place||''),item:String(r.item||''),memo:String(r.memo||'')}}
function getBooks(){try{const d=JSON.parse(localStorage.getItem(BOOK_KEY)||'null');if(d&&Array.isArray(d.books))return d}catch(e){}return{books:[]}}
function saveBooks(d){localStorage.setItem(BOOK_KEY,JSON.stringify(d));const s=document.getElementById('status');if(s)s.textContent='保存済み：'+now()}
function current(){const d=getBooks();return{d,b:d.books.find(x=>x.id===currentId)}}

function migrateLegacy(){
  const d=getBooks();
  if(d.books.length)return;
  let legacyRows=null;
  try{
    const v=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null');
    if(v&&Array.isArray(v.rows))legacyRows=v.rows.map(normRow);
  }catch(e){}
  if(!legacyRows||!legacyRows.length){
    legacyRows=DEFAULT_2026_AUTUMN.map(r=>({date:r[0],event:r[1],place:r[2],item:r[3],ok:!!r[4],memo:''}));
  }
  d.books.push({id:uid(),title:'2026秋',icon:'🍁',updated:now(),autoSort:true,rows:legacyRows});
  saveBooks(d);
}
function renderList(){
  const d=getBooks(),g=document.getElementById('sheetGrid');
  g.innerHTML=d.books.length?d.books.map(b=>`<div class="sheet">
    <div class="sheet-icon">${esc(b.icon||'📋')}</div>
    <h3>${esc(b.title||'無題')}</h3>
    <div class="meta">${(b.rows||[]).length}件<br>更新：${esc(b.updated||'')}</div>
    <div class="actions"><button class="primary" onclick="openSheet('${b.id}')">開く</button><button onclick="duplicateSheet('${b.id}')">複製</button><button class="danger" onclick="deleteSheet('${b.id}')">削除</button></div>
  </div>`).join(''):'<div class="note">予定表がありません。</div>'
}
function createSheet(){
  const title=prompt('予定表の名前を入力してください','2027春');if(title===null)return;
  const icon=prompt('アイコンを入力してください（例：🍁🌸🎪📋）','📋');if(icon===null)return;
  const d=getBooks(),id=uid();
  d.books.push({id,title:title.trim()||'新しい予定表',icon:(icon.trim()||'📋'),updated:now(),autoSort:true,rows:[]});
  saveBooks(d);renderList();openSheet(id)
}
function openSheet(id){
  currentId=id;const {b}=current();if(!b)return;
  document.getElementById('sheetTitle').value=b.title||'';
  document.getElementById('editor').classList.add('show');
  updateAutoSortButton();renderRows();setTimeout(()=>document.getElementById('editor').scrollIntoView({behavior:'smooth'}),50)
}
function showHome(){currentId=null;document.getElementById('editor').classList.remove('show');renderList();window.scrollTo({top:0,behavior:'smooth'})}
function renameSheet(v){const {d,b}=current();if(!b)return;b.title=v;b.updated=now();saveBooks(d);renderList()}
function edit(i,k,v){const {d,b}=current();if(!b||!b.rows[i])return;b.rows[i][k]=v;b.updated=now();saveBooks(d)}
function addRow(){
  const {d,b}=current();if(!b)return;
  b.rows.push({ok:false,date:'',event:'',place:'',item:'',memo:''});b.updated=now();saveBooks(d);renderRows();
  setTimeout(()=>{const els=document.querySelectorAll('td.date input');if(els.length)els[els.length-1].focus()},30)
}
function dateRank(v){
  const s=String(v||'').trim();
  let m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m)return +m[1]*10000 + +m[2]*100 + +m[3];
  m=s.match(/(\d{1,2})\/(\d{1,2})/);if(m)return 20260000 + +m[1]*100 + +m[2];
  return 99999999;
}
function stableSort(list){
  return list.map((r,i)=>({r,i,k:dateRank(r.date)})).sort((a,b)=>a.k-b.k||a.i-b.i).map(x=>x.r)
}
function sortRows(){
  const {d,b}=current();if(!b)return;b.rows=stableSort(b.rows||[]);b.updated=now();saveBooks(d);renderRows()
}
function autoSortAfterDate(i){
  const {d,b}=current();if(!b||!b.autoSort)return;
  b.rows=stableSort(b.rows||[]);b.updated=now();saveBooks(d);renderRows()
}
function toggleAutoSort(){
  const {d,b}=current();if(!b)return;b.autoSort=!b.autoSort;b.updated=now();saveBooks(d);updateAutoSortButton();if(b.autoSort)sortRows()
}
function updateAutoSortButton(){
  const {b}=current(),btn=document.getElementById('autoSortBtn');if(!b||!btn)return;
  btn.textContent=b.autoSort?'🔄 自動日付順 ON':'⏸ 自動日付順 OFF';
  btn.className=b.autoSort?'good':''
}
function renderRows(){
  const {b}=current(),tb=document.getElementById('tbody');if(!b){tb.innerHTML='';return}
  tb.innerHTML=(b.rows||[]).map((r,i)=>`<tr>
    <td class="chk"><input type="checkbox" ${r.ok?'checked':''} onchange="edit(${i},'ok',this.checked)"></td>
    <td class="date"><input class="${dc(r.date)}" value="${esc(r.date)}" oninput="this.className=dc(this.value);edit(${i},'date',this.value)" onblur="autoSortAfterDate(${i})"></td>
    <td><textarea oninput="edit(${i},'event',this.value)">${esc(r.event)}</textarea></td>
    <td><textarea oninput="edit(${i},'place',this.value)">${esc(r.place)}</textarea></td>
    <td><textarea oninput="edit(${i},'item',this.value)">${esc(r.item)}</textarea></td>
    <td class="internal"><textarea placeholder="売上・訂正・メモ" oninput="edit(${i},'memo',this.value)">${esc(r.memo||'')}</textarea></td>
    <td class="del"><button class="danger" onclick="deleteRow(${i})">削除</button></td>
  </tr>`).join('')
}
function deleteRow(i){if(!confirm('この行を削除しますか？'))return;const {d,b}=current();b.rows.splice(i,1);b.updated=now();saveBooks(d);renderRows()}
function duplicateSheet(id){const d=getBooks(),b=d.books.find(x=>x.id===id);if(!b)return;const c=JSON.parse(JSON.stringify(b));c.id=uid();c.title=(b.title||'無題')+' コピー';c.updated=now();d.books.push(c);saveBooks(d);renderList()}
function duplicateCurrent(){if(currentId)duplicateSheet(currentId)}
function deleteSheet(id){const d=getBooks(),b=d.books.find(x=>x.id===id);if(!b||!confirm('「'+b.title+'」を削除しますか？'))return;d.books=d.books.filter(x=>x.id!==id);saveBooks(d);if(currentId===id)showHome();else renderList()}
function deleteCurrent(){if(currentId)deleteSheet(currentId)}
function exportCSV(){
  const {b}=current();if(!b)return;
  const data=[['✅','日付','イベント名','場所','出店アイテム','内部メモ'],...(b.rows||[]).map(r=>[r.ok?'✅':'',r.date,r.event,r.place,r.item,r.memo||''])];
  const csv='\ufeff'+data.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(b.title||'コナン予定表')+'.csv';a.click();URL.revokeObjectURL(a.href)
}
function backupCurrent(){
  const {b}=current();if(!b)return;const blob=new Blob([JSON.stringify({type:'fujiwara_conan_order_book',version:1,book:b},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(b.title||'コナン予定表')+'バックアップ.json';a.click();URL.revokeObjectURL(a.href)
}
function restoreCurrent(file){
  if(!file)return;const fr=new FileReader();fr.onload=()=>{try{
    const x=JSON.parse(fr.result),src=x.book||x;if(!src||!Array.isArray(src.rows))throw 0;
    const {d,b}=current();if(!b)return;const sig=r=>[r.date,r.event,r.place,r.item].join('|'),ex=new Set(b.rows.map(sig));let n=0;
    src.rows.map(normRow).forEach(r=>{if(!ex.has(sig(r))){b.rows.push(r);ex.add(sig(r));n++}});
    if(b.autoSort)b.rows=stableSort(b.rows);b.updated=now();saveBooks(d);renderRows();alert(n+'件を追加復元しました。現在のデータは残しています。')
  }catch(e){alert('復元できないファイルです。')}};fr.readAsText(file,'utf-8')
}
migrateLegacy();renderList();
</script>
</body>
</html>
