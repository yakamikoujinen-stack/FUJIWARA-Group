<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#153a5b">
<title>コナンプロデュース予定取込</title>
<style>
:root{--navy:#163c5e;--navy2:#2d6d9e;--blue:#1677e8;--bg:#f2f5f9;--line:#d5dde8;--text:#192536;--muted:#667085}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:24px 20px 110px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:28px;padding:28px 30px}
.hero h1{margin:0;font-size:clamp(30px,4vw,48px);font-weight:950}.hero p{margin:10px 0 0;font-size:17px;font-weight:800;color:#dcecff}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:24px;margin-top:22px}
h2{margin:0 0 16px;color:#173f63;font-size:28px}
#pasteBox{width:100%;min-height:250px;border:1px solid #cfd8e4;border-radius:18px;padding:18px;font-size:18px;line-height:1.65;outline:none;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{border:0;border-radius:13px;padding:12px 18px;font-weight:900;font-size:16px;background:#e7edf5;color:#1f2937}
button.primary{background:var(--blue);color:#fff}button.danger{background:#feecec;color:#b42318}button.good{background:#e9f7ef;color:#126b36}
.note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}.status{font-size:13px;color:#0f6b3e;font-weight:900;margin-top:8px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:18px}
table{width:100%;min-width:1100px;border-collapse:collapse}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;background:#fff;vertical-align:middle}
th{background:#edf2f7;text-align:center;padding:14px 9px;font-size:18px}
td input,td textarea{width:100%;border:0;outline:0;background:transparent;padding:12px;font-size:16px}td textarea{min-height:54px;resize:vertical}
.check{text-align:center;width:70px}.check input{width:30px;height:30px}.dateCell{min-width:165px}.eventCell{min-width:280px}.placeCell{min-width:230px}.itemCell{min-width:260px}
.sun input{color:#cc2a2a;font-weight:900}.sat input{color:#1268b3;font-weight:900}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d8dee8;padding:13px 15px calc(13px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.bottom button{background:var(--navy);color:#fff;min-width:190px}
@media(max-width:700px){.wrap{padding:14px 10px 100px}.hero{padding:20px 18px;border-radius:20px}.card{padding:16px;border-radius:18px}h2{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
  <h1>📋 コナンプロデュース予定取込</h1>
  <p>相手から届いた予定を貼り付け → 一覧表に変換 → 修正・保存</p>
</section>

<section class="card">
  <h2>① 届いた内容を貼り付け</h2>
  <textarea id="pasteBox" placeholder="例：
8/23(日)　神鍋高原スイカ祭　神鍋高原 道の駅
8/29(土)　○○夏祭り　三田市
…"></textarea>
  <div class="actions">
    <button class="primary" onclick="convertPaste()">一覧表に変換</button>
    <button onclick="addRow()">＋ 空白行を追加</button>
    <button class="good" onclick="saveNow()">💾 保存</button>
    <button onclick="sortRows()">↕ 日付順</button>
    <button onclick="exportCSV()">⬇ CSV</button>
    <button onclick="exportBackup()">📦 バックアップ</button>
    <button class="good" onclick="recoverAllLegacy()">🛟 旧データを復旧</button>
    <label style="display:inline-block">
      <input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this.files[0]);this.value=''">
      <span style="display:inline-block;background:#e7edf5;border-radius:13px;padding:12px 18px;font-weight:900;cursor:pointer">📥 復元</span>
    </label>
    <button class="danger" onclick="clearAll()">全件クリア</button>
  </div>
  <div class="status" id="status">自動保存ON</div>
  <div class="note">「🛟 旧データを復旧」は、現在の一覧を消さずに、この端末に残っている旧コナンデータだけを追加します。重複は追加しません。</div>
</section>

<section class="card">
  <h2>② 一覧表</h2>
  <div class="tablewrap">
    <table>
      <thead><tr><th>✅</th><th>日付</th><th>イベント名</th><th>場所</th><th>出店アイテム</th><th>削除</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</section>
</div>

<div class="bottom"><button onclick="goKing()">← KINGへ戻る</button></div>

<script>
const STORAGE_KEY='fujiwara_conan_event_import_v2';
let rows=[];

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stamp(){return new Date().toLocaleString('ja-JP')}
function setStatus(t){document.getElementById('status').textContent=t}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({version:2,updatedAt:new Date().toISOString(),rows}));setStatus('保存済み：'+stamp())}
function saveNow(){save();alert('保存しました。')}
function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');rows=d&&Array.isArray(d.rows)?d.rows:[]}catch(e){rows=[]}}

function normalizeAnyRow(r){
  if(Array.isArray(r)){
    const x=[...r];
    if(x.length>=7&&typeof x[0]==='boolean')return{ok:!!x[0],date:x[1]||'',event:x[2]||'',place:x[3]||'',item:x[4]||''};
    if(x.length>=5&&typeof x[0]==='boolean')return{ok:!!x[0],date:x[1]||'',event:x[2]||'',place:x[3]||'',item:x[4]||''};
    return{ok:false,date:x[0]||'',event:x[1]||'',place:x[2]||'',item:x[3]||''};
  }
  r=r||{};
  return{
    ok:!!r.ok,
    date:String(r.date||r.startDate||r.day||''),
    event:String(r.event||r.eventName||r.name||r.title||''),
    place:String(r.place||r.location||''),
    item:String(r.item||r.items||r.neta||'')
  };
}
function rowSig(r){return[String(r.date||'').trim(),String(r.event||'').trim(),String(r.place||'').trim(),String(r.item||'').trim()].join('|')}

function collectLegacyRows(){
  const found=[];
  const add=(list,source)=>{
    if(!Array.isArray(list))return;
    list.forEach(x=>{
      const r=normalizeAnyRow(x);
      if(r.date||r.event||r.place||r.item)found.push({row:r,source});
    });
  };

  const keys=['fujiwara_conan_event_import_v1','conan_event_import','conanProduceImport','conan-produce-import','fujiwara_event_schedule_2026_v1'];
  keys.forEach(k=>{
    try{
      const v=JSON.parse(localStorage.getItem(k)||'null');
      if(Array.isArray(v))add(v,k);
      else if(v&&Array.isArray(v.rows))add(v.rows,k);
    }catch(e){}
  });

  try{
    const app=JSON.parse(localStorage.getItem('fujiwara_conan_produce_app_v1')||'null');
    if(app&&Array.isArray(app.sheets)){
      app.sheets.forEach((s,i)=>add(s.rows||[],'fujiwara_conan_produce_app_v1#'+(s.title||i)));
    }
  }catch(e){}

  return found;
}

function recoverAllLegacy(){
  const found=collectLegacyRows();
  if(!found.length){
    alert('この端末・このブラウザ内に復旧できる旧データが見つかりませんでした。別URL・別ブラウザに保存されている場合は、その画面を開いてから復旧してください。');
    return;
  }
  const existing=new Set(rows.map(rowSig));
  const additions=[];
  found.forEach(({row})=>{
    const s=rowSig(row);
    if(!s||existing.has(s))return;
    existing.add(s);
    additions.push(row);
  });

  if(!additions.length){
    alert('復旧対象の旧データは、すでに現在の一覧に入っています。何も削除していません。');
    return;
  }

  if(!confirm(additions.length+'件の旧データが見つかりました。\\n現在のデータは残したまま、追加復旧します。よろしいですか？'))return;
  rows.push(...additions);
  save();
  render();
  alert(additions.length+'件を追加復旧しました。\\n現在のデータは削除していません。');
}

function rowClass(date){const s=String(date||'');if(/[（(]日[）)]/.test(s))return'sun';if(/[（(]土[）)]/.test(s))return'sat';return''}
function render(){
  const tb=document.getElementById('tbody');
  tb.innerHTML=rows.map((r,i)=>`<tr>
    <td class="check"><input type="checkbox" ${r.ok?'checked':''} onchange="edit(${i},'ok',this.checked)"></td>
    <td class="dateCell ${rowClass(r.date)}"><input value="${esc(r.date)}" oninput="edit(${i},'date',this.value);this.parentElement.className='dateCell '+rowClass(this.value)"></td>
    <td class="eventCell"><textarea oninput="edit(${i},'event',this.value)">${esc(r.event)}</textarea></td>
    <td class="placeCell"><textarea oninput="edit(${i},'place',this.value)">${esc(r.place)}</textarea></td>
    <td class="itemCell"><textarea oninput="edit(${i},'item',this.value)">${esc(r.item)}</textarea></td>
    <td><button class="danger" onclick="delRow(${i})">削除</button></td>
  </tr>`).join('');
}
function edit(i,k,v){rows[i][k]=v;save()}
function addRow(){rows.push({ok:false,date:'',event:'',place:'',item:''});save();render()}
function delRow(i){if(!confirm('この行を削除しますか？'))return;rows.splice(i,1);save();render()}
function clearAll(){if(!confirm('本当に全件クリアしますか？'))return;rows=[];save();render()}

function tokenizeLine(line){
  const clean=line.replace(/\u3000/g,' ').replace(/\t+/g,' ').trim();
  if(!clean)return null;
  const dm=clean.match(/(\d{1,2}\/\d{1,2}(?:\([^)]+\)|（[^）]+）)?(?:\s*[〜~～\-]\s*\d{1,2}\/\d{1,2}(?:\([^)]+\)|（[^）]+）)?)?)/);
  if(!dm)return{date:'',event:clean,place:'',item:''};
  const date=dm[1].trim();
  const rest=clean.replace(dm[0],'').trim();
  let parts=rest.split(/\s{2,}|\t+/).map(x=>x.trim()).filter(Boolean);
  if(parts.length<2)parts=rest.split(/\s+/).map(x=>x.trim()).filter(Boolean);
  return{date,event:parts[0]||'',place:parts[1]||'',item:parts.slice(2).join(' ')||''};
}
function convertPaste(){
  const lines=document.getElementById('pasteBox').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length){alert('貼り付け内容を入力してください。');return}
  rows.push(...lines.map(tokenizeLine).filter(Boolean).map(normalizeAnyRow));
  save();render();document.getElementById('pasteBox').value='';
}
function parseSort(date){const m=String(date||'').match(/(\d{1,2})\/(\d{1,2})/);return m?(Number(m[1])*100+Number(m[2])):99999}
function sortRows(){rows.sort((a,b)=>parseSort(a.date)-parseSort(b.date));save();render()}
function exportCSV(){
  const data=[['✅','日付','イベント名','場所','出店アイテム'],...rows.map(r=>[r.ok?'✅':'',r.date,r.event,r.place,r.item])];
  const csv='\ufeff'+data.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='コナンプロデュース予定.csv';a.click();URL.revokeObjectURL(a.href);
}
function exportBackup(){
  save();
  const blob=new Blob([JSON.stringify({type:'fujiwara_conan_event_import_backup',version:2,createdAt:new Date().toISOString(),rows},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='コナン予定バックアップ.json';a.click();URL.revokeObjectURL(a.href);
}
function importBackup(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);const list=Array.isArray(d)?d:d.rows;if(!Array.isArray(list))throw new Error();
      const existing=new Set(rows.map(rowSig));
      let added=0;
      list.map(normalizeAnyRow).forEach(r=>{const s=rowSig(r);if(s&&!existing.has(s)){existing.add(s);rows.push(r);added++}});
      save();render();alert(added+'件を追加復元しました。現在のデータは残しています。');
    }catch(e){alert('このファイルは復元できません。')}
  };
  fr.readAsText(file,'utf-8');
}
function goKing(){if(history.length>1)history.back();else location.href='./index.html'}

load();rows=rows.map(normalizeAnyRow);render();save();
</script>
</body>
</html>
