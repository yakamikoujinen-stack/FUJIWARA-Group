<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUJIWARA 在庫ライブモニター</title><style>
:root{font-family:'Yu Gothic',Meiryo,system-ui,sans-serif;color:#f4f7ff;background:#0a1424}*{box-sizing:border-box}body{margin:0;padding:16px}header{position:sticky;top:0;background:#0a1424f2;z-index:2;padding:8px 0 14px;border-bottom:1px solid #344660}h1{font-size:clamp(22px,3vw,36px);margin:0;color:#f4cf78}.sub{color:#a9bed3;font-size:13px;margin:6px 0}.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}.pill{border:1px solid #425774;border-radius:30px;padding:7px 11px;background:#18283e;font-size:13px}.ok{color:#7cf2b0}.bad{color:#ff9e9e}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.metric{background:#17273b;border:1px solid #314864;border-radius:12px;padding:12px}.metric b{display:block;font-size:clamp(24px,4vw,40px);margin-top:5px}.metric small{color:#b3c4d7}input,select,button{font:inherit;color:#f7faff;background:#182b42;border:1px solid #526b87;border-radius:9px;padding:10px;min-width:0}button{cursor:pointer}input{flex:2;min-width:120px}select{flex:1}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.group{margin:14px 0 22px;background:#111f31;border:1px solid #31465f;border-radius:12px;overflow:hidden}.group h2{margin:0;padding:12px 14px;background:#21344c;font-size:19px;display:flex;justify-content:space-between}.group h2 span{color:#bed1e4;font-size:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #2a3c53;font-size:clamp(13px,1.7vw,18px)}th{color:#a7c1dc;font-size:13px}tr:last-child td{border:0}.qty{font-weight:800;font-size:clamp(18px,2.7vw,28px);white-space:nowrap}.zero{color:#ff8080}.name{font-weight:700}.muted{color:#b3c2d4;font-size:13px}.empty{padding:36px 15px;text-align:center;color:#bed0e4}.foot{font-size:12px;color:#9cafc3;padding:20px 0}@media(max-width:650px){body{padding:9px}.metrics{gap:6px}.metric{padding:9px}th,td{padding:9px 6px}.hide-small{display:none}.tools{gap:6px}.group h2{font-size:17px}}
 .auto-panel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 12px;padding:10px;background:#1a3048;border:1px solid #496481;border-radius:10px}.auto-panel strong{color:#f4cf78}.auto-panel select{flex:0 0 auto}.auto-panel button{padding:9px 12px}.auto-panel .grow{flex:1}.auto-panel .small{font-size:13px;color:#c3d5e6}.progress{height:5px;background:#30435c;border-radius:4px;overflow:hidden;margin:5px 0 12px}.progress>div{height:100%;background:#f4cf78;width:0;transition:width .5s linear}body.auto .group h2{font-size:clamp(20px,2.8vw,30px)}body.auto td{font-size:clamp(16px,2.2vw,24px);padding:13px 10px}body.auto .qty{font-size:clamp(22px,3vw,34px)}@media(max-width:650px){.auto-panel{gap:6px}.auto-panel select{padding:8px}} </style></head><body><header><h1>📦 FUJIWARA 在庫ライブモニター</h1><div class="sub">閲覧専用｜KING・メイン・担当者の在庫データを変更しません</div><div class="status"><span class="pill" id="connection">● 接続準備中</span><span class="pill" id="updated">最終受信：―</span><span class="pill" id="clock">―</span></div></header><section class="metrics"><div class="metric"><small>登録品目</small><b id="total">―</b></div><div class="metric"><small>在庫ゼロ</small><b id="zero">―</b></div><div class="metric"><small>カテゴリー</small><b id="cats">―</b></div></section><div class="tools"><input id="search" placeholder="🔎 品目・保管場所を検索" aria-label="検索"><select id="category" aria-label="カテゴリー"><option value="">全カテゴリー</option></select><button id="fullscreen">⛶ 全画面</button></div><div class="auto-panel"><strong>📺 カテゴリー自動切替</strong><button id="toggleAuto">⏸ 一時停止</button><label class="small" for="interval">切替時間</label><select id="interval"><option value="10">10秒</option><option value="15" selected>15秒</option><option value="20">20秒</option><option value="30">30秒</option><option value="60">60秒</option></select><button id="prev">◀ 前へ</button><button id="next">次へ ▶</button><span class="small grow" id="pageInfo">接続待ち</span></div><div class="progress"><div id="progressFill"></div></div><main id="content"><div class="empty">Firebaseに接続しています…</div></main><div class="foot">※在庫ゼロは数量0の品目です。最低在庫基準による不足判定ではありません。<br>※Firebaseの読み取り権限がない場合は接続できません。公開画面として利用する前に認証・閲覧権限を確認してください。</div><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script>
'use strict';
const firebaseConfig={apiKey:'AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA',authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:5ec6b7e2a2165066956a94'};
const $=id=>document.getElementById(id);let items=[],meta={},loaded=false;let autoMode=true,slideIndex=0,slideStarted=Date.now();const pageSize=9;const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.entries(v).map(([id,x])=>x&&typeof x==='object'?{id,...x}:null).filter(Boolean):[]);const number=v=>Number(v)||0;
function stamp(v){if(!v)return '―';const n=Number(v);if(Number.isFinite(n)&&n>1e11)return new Date(n).toLocaleString('ja-JP');if(Number.isFinite(n)&&n>1e9)return new Date(n*1000).toLocaleString('ja-JP');return String(v)}
function categories(){return [...new Set(items.map(x=>String(x.cat||'未分類')))].sort((a,b)=>a.localeCompare(b,'ja'))}
function slides(){const result=[];for(const cat of categories()){const list=items.filter(x=>String(x.cat||'未分類')===cat).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja'));for(let i=0;i<list.length;i+=pageSize)result.push({cat,list:list.slice(i,i+pageSize),page:Math.floor(i/pageSize)+1,pages:Math.ceil(list.length/pageSize),total:list.length})}return result}
function table(cat,list,total,part){return `<section class="group"><h2>${safe(cat)}<span>${total} 品目${part?'｜'+part:''}</span></h2><table><thead><tr><th>品目</th><th>現在庫</th><th class="hide-small">保管場所</th><th class="hide-small">更新者・更新日時</th></tr></thead><tbody>${list.map(x=>`<tr><td class="name">${safe(x.name||'名称未設定')}</td><td class="qty ${number(x.stock)===0?'zero':''}">${safe(x.stock??0)} <span class="muted">${safe(x.unit||'')}</span></td><td class="hide-small">${safe(x.loc||'―')}</td><td class="hide-small muted">${safe(x.inventoryUpdatedBy||meta.updatedBy||'―')}<br>${safe(stamp(x.inventoryUpdatedAt||meta.updatedAt))}</td></tr>`).join('')}</tbody></table></section>`}
function render(){const q=$('search').value.trim().toLowerCase(),c=$('category').value;const cats=categories();$('total').textContent=items.length;$('zero').textContent=items.filter(x=>number(x.stock)===0).length;$('cats').textContent=cats.length;const old=c;$('category').innerHTML='<option value="">全カテゴリー</option>'+cats.map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join('');$('category').value=cats.includes(old)?old:'';document.body.classList.toggle('auto',autoMode);$('toggleAuto').textContent=autoMode?'⏸ 一時停止':'▶ 自動再開';$('prev').disabled=!autoMode;$('next').disabled=!autoMode;
if(!loaded){$('content').innerHTML='<div class="empty">接続中…</div>';return}
if(autoMode){const ss=slides();if(!ss.length){$('content').innerHTML='<div class="empty">登録された在庫がありません</div>';return}slideIndex=((slideIndex%ss.length)+ss.length)%ss.length;const x=ss[slideIndex];$('pageInfo').textContent=`${slideIndex+1} / ${ss.length} 画面 ｜ ${x.cat}（${x.page}/${x.pages}）`;$('content').innerHTML=table(x.cat,x.list,x.total,x.pages>1?`${x.page}/${x.pages}ページ`:'');window.scrollTo(0,0)}else{const filtered=items.filter(x=>(!c||String(x.cat||'未分類')===c)&&(!q||[x.name,x.cat,x.loc].some(y=>String(y||'').toLowerCase().includes(q))));const groups=new Map();filtered.forEach(x=>{const k=String(x.cat||'未分類');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});$('pageInfo').textContent='手動閲覧中';$('progressFill').style.width='0%';$('content').innerHTML=!filtered.length?'<div class="empty">該当する在庫がありません</div>':[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([cat,list])=>table(cat,list.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja')),list.length,'')).join('')}}
function move(n){slideIndex+=n;slideStarted=Date.now();render()}
$('toggleAuto').addEventListener('click',()=>{autoMode=!autoMode;slideStarted=Date.now();render()});$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('interval').addEventListener('change',()=>{slideStarted=Date.now()});setInterval(()=>{if(!autoMode||!loaded)return;const elapsed=Date.now()-slideStarted,delay=Number($('interval').value)*1000;$('progressFill').style.width=Math.min(100,elapsed/delay*100)+'%';if(elapsed>=delay)move(1)},500);
function status(t,good){$('connection').textContent='● '+t;$('connection').className='pill '+(good?'ok':'bad')}
$('search').addEventListener('input',()=>{autoMode=false;render()});$('category').addEventListener('change',()=>{autoMode=false;render()});$('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()});setInterval(()=>$('clock').textContent=new Date().toLocaleString('ja-JP'),1000);$('clock').textContent=new Date().toLocaleString('ja-JP');
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.database();db.ref('.info/connected').on('value',s=>{if(!s.val())status('通信待機中',false);else if(loaded)status('ライブ接続中',true);else status('接続中',true)});db.ref('fujiwara/invItems').on('value',s=>{items=arr(s.val());loaded=true;$('updated').textContent='最終受信：'+new Date().toLocaleTimeString('ja-JP');status('ライブ接続中',true);render()},e=>{status('在庫の読込失敗',false);$('content').innerHTML='<div class="empty">在庫を読み込めません。Firebaseの権限と通信状態を確認してください。<br>'+safe(e.message)+'</div>'});db.ref('fujiwara/inventoryMeta').on('value',s=>{meta=s.val()||{};render()},e=>console.warn('inventoryMeta:',e.message))}catch(e){status('接続エラー',false);$('content').innerHTML='<div class="empty">'+safe(e.message)+'</div>'}
</script></body></html>
