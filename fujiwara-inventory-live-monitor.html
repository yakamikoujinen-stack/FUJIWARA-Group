<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUJIWARA 在庫ライブモニター</title><style>
:root{font-family:'Yu Gothic',Meiryo,system-ui,sans-serif;color:#f4f7ff;background:#0a1424}*{box-sizing:border-box}body{margin:0;padding:16px}header{position:sticky;top:0;background:#0a1424f2;z-index:2;padding:8px 0 14px;border-bottom:1px solid #344660}h1{font-size:clamp(22px,3vw,36px);margin:0;color:#f4cf78}.sub{color:#a9bed3;font-size:13px;margin:6px 0}.status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}.pill{border:1px solid #425774;border-radius:30px;padding:7px 11px;background:#18283e;font-size:13px}.ok{color:#7cf2b0}.bad{color:#ff9e9e}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.metric{background:#17273b;border:1px solid #314864;border-radius:12px;padding:12px}.metric b{display:block;font-size:clamp(24px,4vw,40px);margin-top:5px}.metric small{color:#b3c4d7}input,select,button{font:inherit;color:#f7faff;background:#182b42;border:1px solid #526b87;border-radius:9px;padding:10px;min-width:0}button{cursor:pointer}input{flex:2;min-width:120px}select{flex:1}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.group{margin:14px 0 22px;background:#111f31;border:1px solid #31465f;border-radius:12px;overflow:hidden}.group h2{margin:0;padding:12px 14px;background:#21344c;font-size:19px;display:flex;justify-content:space-between}.group h2 span{color:#bed1e4;font-size:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #2a3c53;font-size:clamp(13px,1.7vw,18px)}th{color:#a7c1dc;font-size:13px}tr:last-child td{border:0}.qty{font-weight:800;font-size:clamp(18px,2.7vw,28px);white-space:nowrap}.zero{color:#ff8080}.name{font-weight:700}.muted{color:#b3c2d4;font-size:13px}.empty{padding:36px 15px;text-align:center;color:#bed0e4}.foot{font-size:12px;color:#9cafc3;padding:20px 0}@media(max-width:650px){body{padding:9px}.metrics{gap:6px}.metric{padding:9px}th,td{padding:9px 6px}.hide-small{display:none}.tools{gap:6px}.group h2{font-size:17px}}
</style></head><body><header><h1>📦 FUJIWARA 在庫ライブモニター</h1><div class="sub">閲覧専用｜KING・メイン・担当者の在庫データを変更しません</div><div class="status"><span class="pill" id="connection">● 接続準備中</span><span class="pill" id="updated">最終受信：―</span><span class="pill" id="clock">―</span></div></header><section class="metrics"><div class="metric"><small>登録品目</small><b id="total">―</b></div><div class="metric"><small>在庫ゼロ</small><b id="zero">―</b></div><div class="metric"><small>カテゴリー</small><b id="cats">―</b></div></section><div class="tools"><input id="search" placeholder="🔎 品目・保管場所を検索" aria-label="検索"><select id="category" aria-label="カテゴリー"><option value="">全カテゴリー</option></select><button id="fullscreen">⛶ 全画面</button></div><main id="content"><div class="empty">Firebaseに接続しています…</div></main><div class="foot">※在庫ゼロは数量0の品目です。最低在庫基準による不足判定ではありません。<br>※Firebaseの読み取り権限がない場合は接続できません。公開画面として利用する前に認証・閲覧権限を確認してください。</div><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script>
'use strict';
const firebaseConfig={apiKey:'AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA',authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:5ec6b7e2a2165066956a94'};
const $=id=>document.getElementById(id);let items=[],meta={},loaded=false;const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.entries(v).map(([id,x])=>x&&typeof x==='object'?{id,...x}:null).filter(Boolean):[]);const number=v=>Number(v)||0;
function stamp(v){if(!v)return '―';const n=Number(v);if(Number.isFinite(n)&&n>1e11)return new Date(n).toLocaleString('ja-JP');if(Number.isFinite(n)&&n>1e9)return new Date(n*1000).toLocaleString('ja-JP');return String(v)}
function render(){const q=$('search').value.trim().toLowerCase(),c=$('category').value;const categories=[...new Set(items.map(x=>String(x.cat||'未分類')))].sort((a,b)=>a.localeCompare(b,'ja'));$('total').textContent=items.length;$('zero').textContent=items.filter(x=>number(x.stock)===0).length;$('cats').textContent=categories.length;const old=c;$('category').innerHTML='<option value="">全カテゴリー</option>'+categories.map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join('');$('category').value=categories.includes(old)?old:'';const filtered=items.filter(x=>(!c||String(x.cat||'未分類')===c)&&(!q||[x.name,x.cat,x.loc].some(y=>String(y||'').toLowerCase().includes(q))));const groups=new Map();filtered.forEach(x=>{const k=String(x.cat||'未分類');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});$('content').innerHTML=!loaded?'<div class="empty">接続中…</div>':!filtered.length?'<div class="empty">該当する在庫がありません</div>':[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([cat,list])=>`<section class="group"><h2>${safe(cat)}<span>${list.length} 品目</span></h2><table><thead><tr><th>品目</th><th>現在庫</th><th class="hide-small">保管場所</th><th class="hide-small">更新者・更新日時</th></tr></thead><tbody>${list.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja')).map(x=>`<tr><td class="name">${safe(x.name||'名称未設定')}</td><td class="qty ${number(x.stock)===0?'zero':''}">${safe(x.stock??0)} <span class="muted">${safe(x.unit||'')}</span></td><td class="hide-small">${safe(x.loc||'―')}</td><td class="hide-small muted">${safe(x.inventoryUpdatedBy||meta.updatedBy||'―')}<br>${safe(stamp(x.inventoryUpdatedAt||meta.updatedAt))}</td></tr>`).join('')}</tbody></table></section>`).join('')}
function status(t,good){$('connection').textContent='● '+t;$('connection').className='pill '+(good?'ok':'bad')}
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()});setInterval(()=>$('clock').textContent=new Date().toLocaleString('ja-JP'),1000);$('clock').textContent=new Date().toLocaleString('ja-JP');
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.database();db.ref('.info/connected').on('value',s=>{if(!s.val())status('通信待機中',false);else if(loaded)status('ライブ接続中',true);else status('接続中',true)});db.ref('fujiwara/invItems').on('value',s=>{items=arr(s.val());loaded=true;$('updated').textContent='最終受信：'+new Date().toLocaleTimeString('ja-JP');status('ライブ接続中',true);render()},e=>{status('在庫の読込失敗',false);$('content').innerHTML='<div class="empty">在庫を読み込めません。Firebaseの権限と通信状態を確認してください。<br>'+safe(e.message)+'</div>'});db.ref('fujiwara/inventoryMeta').on('value',s=>{meta=s.val()||{};render()},e=>console.warn('inventoryMeta:',e.message))}catch(e){status('接続エラー',false);$('content').innerHTML='<div class="empty">'+safe(e.message)+'</div>'}
</script></body></html>
