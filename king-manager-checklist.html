<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KING 担当者チェック一覧</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;background:#f1f7fc;color:#17324d;margin:0;padding:18px}.wrap{max-width:950px;margin:auto}.card{background:white;border:1px solid #dce7ef;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #17324d12}h1{font-size:27px}h2{font-size:21px;color:#17324d}label{display:block;font-weight:750;margin:12px 0}.task{display:flex;gap:13px;align-items:flex-start;border-bottom:1px solid #e7eef3;padding:15px 0;line-height:1.6}.task input{width:25px;height:25px;flex-shrink:0}select,input[type=date]{font-size:17px;padding:12px;border:1px solid #b7cbdb;border-radius:10px;max-width:100%}button,a.btn{display:inline-block;border:0;border-radius:12px;padding:13px 18px;background:#173f68;color:white;text-decoration:none;font-weight:800;font-size:16px;cursor:pointer;margin:5px}button:disabled{opacity:.5}.status{font-weight:750;padding:12px;background:#fff8db;border-radius:10px}.small{color:#63788a;font-size:13px}.grid{display:flex;gap:12px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:11px;border-bottom:1px solid #dbe5ee;text-align:left}th{background:#eaf3fa} .scroll{overflow:auto} .ok{color:#117447;font-weight:800}.bad{color:#b82c2c;font-weight:800}</style></head><body><main class="wrap"><a href="king.html">← KINGに戻る</a><div class="card"><h1>👑 担当者チェック一覧</h1><p>担当者がいつ、どの項目を確認したかを一覧表示します。</p><div class="grid"><label>確認日<br><input id="day" type="date"></label><label>担当者<br><select id="person"><option value="">全員</option><option>将</option><option>文太</option><option>繁充</option></select></label></div><button onclick="load()">🔄 最新を表示</button><button onclick="window.print()">🖨️ 印刷</button><p class="status" id="status">読込待ち</p><div class="scroll"><table><thead><tr><th>確認日</th><th>担当者</th><th>最終記録日時</th><th>確認済</th><th>未確認</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>選択した担当者の詳細</h2><div id="details">一覧の担当者名を押してください。</div></div></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.database();const ROOT='fujiwara/manager_daily_checklist_v1';const TASKS=["メインアプリ→新規イベントは無いか？変更は無いか？", "イベント別振分→積み込む前にチェック", "配置スケジュール→自分自身の行先の変更は無いか？", "在庫管理→来週のネタの早期発注を管理者に伝えたか？", "車両管理→異常、車検日時を入力したか？", "準備アプリ→積込んだ物をチェックしたか？", "LPG管理→返却は無かったか？次回のLPG発注数は？", "運行管理→運行状況を記録したか？"];const day=document.getElementById('day'),person=document.getElementById('person'),status=document.getElementById('status');day.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);let records=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){status.textContent='読込中…';try{const snap=await db.ref(ROOT+'/'+day.value).once('value');records=Object.values(snap.val()||{}).filter(r=>!person.value||r.person===person.value);document.getElementById('rows').innerHTML=records.length?records.map((r,i)=>`<tr><td>${esc(r.date)}</td><td><button onclick="detail(${i})">${esc(r.person)}</button></td><td>${r.updatedAt?new Date(r.updatedAt).toLocaleString('ja-JP'):'—'}</td><td class="ok">${(r.checks||[]).filter(Boolean).length}/8</td><td class="bad">${8-(r.checks||[]).filter(Boolean).length}件</td></tr>`).join(''):'<tr><td colspan="5">該当する記録はありません</td></tr>';status.textContent=records.length+'人分を表示';document.getElementById('details').textContent='一覧の担当者名を押してください';}catch(e){status.textContent='読込失敗。通信・Firebase権限を確認してください';}}function detail(i){const r=records[i];document.getElementById('details').innerHTML='<h2>'+esc(r.person)+'　'+esc(r.date)+'</h2>'+TASKS.map((t,j)=>'<p class="'+(r.checks?.[j]?'ok':'bad')+'">'+(r.checks?.[j]?'☑':'□')+' '+esc(t)+'</p>').join('');}person.addEventListener('change',load);day.addEventListener('change',load);load();</script></body></html>
