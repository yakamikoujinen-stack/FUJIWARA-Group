<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>取引先名別 月間スケジュール表｜KING</title><style>:root{--text:#102043;--line:#dbe3ed;--blue:#2b78c5}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f5f8fc;color:var(--text)}.wrap{max-width:1200px;margin:auto;padding:14px 14px 90px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:14px 16px;margin-bottom:12px}.head h1{font-size:23px;margin:0}.back{border:0;border-radius:12px;padding:10px 14px;background:#17324d;color:#fff;font-weight:900}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin-bottom:12px}.controls button{border:1px solid #ccd7e4;background:#fff;border-radius:10px;padding:9px 12px;font-weight:900;color:#17324d}.month{font-size:21px;font-weight:950;min-width:130px;text-align:center}.filter{width:min(360px,100%);padding:10px;border:1px solid #ccd7e4;border-radius:10px;font-weight:900}.cal{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);touch-action:pan-y}.dow,.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.dow{text-align:center;padding:8px;background:#f3f6fa;font-weight:950}.day{min-height:105px;padding:6px}.num{font-weight:950}.entry{margin-top:5px;padding:6px;border-radius:8px;border-left:5px solid var(--b,#2b78c5);background:var(--bg,#eaf4ff);font-size:11px;line-height:1.35;font-weight:800}.empty{background:#f8fafc}.note{font-size:11px;color:#647188;font-weight:800;margin-top:10px}@media(max-width:700px){.day{min-height:78px;padding:4px}.entry{font-size:9px;padding:4px}.head h1{font-size:18px}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><main class="wrap"><section class="head"><h1>📅 取引先名別 月間スケジュール表</h1><button class="back" onclick="location.href='king.html'">👑 KINGへ戻る</button></section><section class="controls"><button onclick="moveMonth(-1)">‹ 前月</button><div id="monthTitle" class="month"></div><button onclick="moveMonth(1)">次月 ›</button><button onclick="resetMonth()">今月</button><select id="clientFilter" class="filter" onchange="render()"><option value="">すべての取引先</option></select></section><section id="calendar" class="cal"></section><div class="note">当月分だけ表示。左右スワイプでも月変更できます。メインアプリ＋建設アプリの元データは変更しません。</div></main><script>const cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.database();let evs=[],reps=[],cur=new Date();cur.setDate(1);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function clientOf(x,src){return String(x.client||x.clientName||x.customer||x.customerName||(src==='main'?(x.zone||x.orderer||x.supplier):'')||'未設定')}function datesOf(e){let a=String(e.date||'').slice(0,10),b=String(e.dateEnd||'').slice(0,10),out=[];if(!a)return out;let d=new Date(a+'T00:00:00'),z=b?new Date(b+'T00:00:00'):new Date(d);for(let i=0;d<=z&&i<62;i++,d.setDate(d.getDate()+1))out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));return out}const pal=[['#fff0f0','#e04b4b'],['#eef7ff','#3182ce'],['#f1f9ed','#55a04a'],['#fff6df','#d49a13'],['#f6efff','#8b5cc7'],['#eafaf7','#269b83'],['#fff0f7','#d45b91'],['#f1f1ff','#6565c7'],['#fff3e8','#d9782d'],['#eef8f4','#388d6a']];function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h)}function col(c){const f={'テキヤ':['#fff0f0','#e04b4b'],'ピスタチオ':['#eef7ff','#3182ce'],'コナンプロデュース':['#f6efff','#8b5cc7'],'コナンプロジュース':['#f6efff','#8b5cc7'],'うまいもん屋':['#f1f9ed','#55a04a'],'鳥取案件':['#fff6df','#d49a13'],'優成建設':['#eaf4ff','#2b78c5'],'前田建設':['#eafaf7','#269b83'],'その他':['#f1f1f1','#777']};for(const k in f)if(c.includes(k))return f[k];return pal[hash(c)%pal.length]}function refreshFilter(){const el=document.getElementById('clientFilter'),old=el.value,n={};evs.forEach(x=>n[clientOf(x,'main')]=1);reps.forEach(x=>n[clientOf(x,'construction')]=1);el.innerHTML='<option value="">すべての取引先</option>'+Object.keys(n).filter(x=>x!=='未設定').sort().map(x=>'<option>'+esc(x)+'</option>').join('');if(n[old])el.value=old}function moveMonth(n){cur.setMonth(cur.getMonth()+n);render()}function resetMonth(){cur=new Date();cur.setDate(1);render()}function render(){const y=cur.getFullYear(),m=cur.getMonth(),filter=document.getElementById('clientFilter').value;monthTitle.textContent=y+'年 '+(m+1)+'月';let rows=[];evs.forEach(e=>{let c=clientOf(e,'main');if(filter&&c!==filter)return;datesOf(e).forEach(ds=>rows.push({date:ds,client:c,title:e.name||'イベント名未入力',place:e.place||'',src:'メイン'}))});reps.forEach(r=>{let c=clientOf(r,'construction');if(filter&&c!==filter)return;rows.push({date:String(r.date||r.rDate||'').slice(0,10),client:c,title:r.site||r.siteName||r.place||r.rSite||'現場名未入力',src:'建設'})});let html=['日','月','火','水','木','金','土'].map(x=>'<div class="dow">'+x+'</div>').join('');let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let inMonth=d.getMonth()===m;let ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let rr=inMonth?rows.filter(r=>r.date===ds):[];html+='<div class="day '+(inMonth?'':'empty')+'"><div class="num">'+(inMonth?d.getDate():'')+'</div>'+rr.map(r=>{let c=col(r.client);return '<div class="entry" style="--bg:'+c[0]+';--b:'+c[1]+'"><b>'+esc(r.client)+'</b> ['+r.src+']<br>'+esc(r.title)+(r.place?'<br>📍'+esc(r.place):'')+'</div>'}).join('')+'</div>'}calendar.innerHTML=html}Promise.all([db.ref('fujiwara/events').once('value'),db.ref('fujiwara/construction/reports').once('value')]).then(([a,b])=>{let v=a.val()||{};evs=(Array.isArray(v)?v:Object.keys(v).map(k=>v[k])).filter(Boolean);let r=b.val()||{};reps=Object.keys(r).map(k=>r[k]||{});refreshFilter();render()});let sx=0,sy=0;calendar.addEventListener('touchstart',e=>{let t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});calendar.addEventListener('touchend',e=>{let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2)moveMonth(dx<0?1:-1)},{passive:true});render();</script></body></html>
