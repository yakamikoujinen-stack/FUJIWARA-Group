<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUJIWARA KING</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f4f6;color:#172033}header{background:linear-gradient(135deg,#111827,#000);color:white;padding:24px}main{max-width:1100px;margin:auto;padding:14px}.hero{max-width:1100px;margin:auto}.hero h1{margin:0;font-size:34px}.sub{color:#d4af37;font-size:22px;margin-top:6px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.kpi{background:#fff9e6;border:1px solid #f3df94;border-radius:16px;padding:16px;text-align:center}.big{font-size:30px;font-weight:900}.label{font-size:13px;color:#667085}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid #eef2f7;padding:8px;text-align:left}.table th{background:#111827;color:white}.badge{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:900;font-size:12px;background:#fff4db;color:#9a7200}.ok{background:#e9f9ef;color:#0a7a2f}.ng{background:#ffe4e6;color:#b00020}textarea,button{width:100%;font-size:16px;padding:12px;margin-top:8px;border-radius:12px;border:1px solid #d1d5db}button{background:#111827;color:white;border:0;font-weight:900}.small{font-size:12px;color:#667085}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head><body>
<header><div class="hero"><h1>👑 FUJIWARA Group</h1><div class="sub">- KING -</div><p>社長専用 / 建設・事務をつなぐ司令塔</p><span id="cloudStatus" class="badge">Firebase接続中...</span></div></header>
<main>
<section class="card"><h2>🤖 MIYU 今日の確認</h2><div id="miyuText">読み込み中...</div></section>
<section class="grid"><div class="kpi"><div class="big" id="todayJobs">0</div><div class="label">今日の建設予定</div></div><div class="kpi"><div class="big" id="todayReports">0</div><div class="label">今日の日報</div></div><div class="kpi"><div class="big" id="todayPeople">0</div><div class="label">本日延べ人数</div></div><div class="kpi"><div class="big" id="monthReports">0</div><div class="label">今月の日報</div></div></section>
<section class="card"><h2>🏗 今日の建設予定</h2><div style="overflow:auto"><table class="table"><thead><tr><th>時間</th><th>現場名</th><th>取引先</th><th>作業員</th><th>内容</th></tr></thead><tbody id="jobBody"></tbody></table></div></section>
<section class="card"><h2>📝 今日の日報</h2><div style="overflow:auto"><table class="table"><thead><tr><th>現場</th><th>入力者</th><th>取引先</th><th>担当者</th><th>人数</th><th>入場</th><th>退場</th></tr></thead><tbody id="reportBody"></tbody></table></div></section>
<section class="card"><h2>📊 取引先別 今月集計</h2><div style="overflow:auto"><table class="table"><thead><tr><th>取引先</th><th>件数</th><th>延べ人数</th><th>現場時間</th></tr></thead><tbody id="clientSummaryBody"></tbody></table></div></section>
<section class="card"><h2>🌸 事務員タイムカード</h2><p class="small">今は同じ端末のタイムカード保存分を表示。次にFirebase共有化します。</p><section class="grid"><div class="kpi"><div class="big" id="officeDays">0</div><div class="label">今月勤務日</div></div><div class="kpi"><div class="big" id="officeHours">0.0h</div><div class="label">今月勤務時間</div></div></section></section>
<section class="card"><h2>📢 社長メモ</h2><textarea id="bossMemo" placeholder="今日のメモ"></textarea><button onclick="saveMemo()">保存</button></section>
</main>
<script>
const firebaseConfig={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94",measurementId:"G-1VHX1GQV0C"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const base="fujiwara/construction";let jobs=[],reports=[];
function R(p){return db.ref(base+"/"+p)}function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function month(){return today().slice(0,7)}function arr(v){if(!v)return[];return Object.entries(v).map(([id,val])=>({id,...val}))}function min(t){if(!t)return null;const p=String(t).split(":").map(Number);return p[0]*60+p[1]}function hours(r){const s=min(r.start),e=min(r.end);if(s==null||e==null)return 0;return Math.max(0,(e-s-Number(r.breakMin||0))/60)}function setStatus(t,c){cloudStatus.textContent=t;cloudStatus.className="badge "+(c||"")}
firebase.database().ref(".info/connected").on("value",s=>{s.val()?setStatus("Firebase接続OK","ok"):setStatus("Firebase未接続","ng")});R("jobs").on("value",s=>{jobs=arr(s.val());render()});R("reports").on("value",s=>{reports=arr(s.val());render()});
function render(){const t=today(),m=month(),tj=jobs.filter(x=>x.date===t),tr=reports.filter(x=>x.date===t),mr=reports.filter(x=>(x.date||"").startsWith(m));let people=tr.reduce((a,r)=>a+Number(r.people||0),0);todayJobs.textContent=tj.length;todayReports.textContent=tr.length;todayPeople.textContent=people;monthReports.textContent=mr.length;jobBody.innerHTML=tj.length?tj.map(j=>`<tr><td>${j.start||"-"}</td><td>${j.site||"-"}</td><td>${j.client||"-"}</td><td>${j.workers||"-"}</td><td>${j.work||"-"}</td></tr>`).join(""):'<tr><td colspan="5">今日の予定なし</td></tr>';reportBody.innerHTML=tr.length?tr.map(r=>`<tr><td>${r.site||"-"}</td><td>${r.reporter||"-"}</td><td>${r.client||"-"}</td><td>${r.clientPerson||"-"}</td><td>${r.people||0}</td><td>${r.start||"-"}</td><td>${r.end||"-"}</td></tr>`).join(""):'<tr><td colspan="7">今日の日報なし</td></tr>';const map={};mr.forEach(r=>{const c=r.client||"未登録";if(!map[c])map[c]={count:0,people:0,h:0};map[c].count++;map[c].people+=Number(r.people||0);map[c].h+=hours(r)});clientSummaryBody.innerHTML=Object.keys(map).length?Object.entries(map).map(([c,v])=>`<tr><td>${c}</td><td>${v.count}</td><td>${v.people}</td><td>${v.h.toFixed(1)}h</td></tr>`).join(""):'<tr><td colspan="4">今月データなし</td></tr>';let msg=[];if(tj.length)msg.push(`本日の建設予定は${tj.length}件です。`);if(tr.length)msg.push(`本日の日報は${tr.length}件、延べ人数は${people}人です。`);if(!tj.length&&!tr.length)msg.push("本日の建設データはまだありません。");const unapproved=reports.filter(r=>!r.approved).length;if(unapproved)msg.push(`未承認の日報が${unapproved}件あります。`);miyuText.innerHTML=msg.map(x=>"・"+x).join("<br>");renderOffice()}
function getOffice(){try{return JSON.parse(localStorage.getItem("office_timecard")||"[]")}catch(e){return[]}}function renderOffice(){const m=month();const data=getOffice().filter(x=>(x.date||"").startsWith(m));const days=new Set(data.map(x=>x.date));let h=0;data.forEach(r=>{const a=min(r.inTime),b=min(r.outTime);if(a!=null&&b!=null)h+=Math.max(0,(b-a-Number(r.breakMin||0))/60)});officeDays.textContent=days.size;officeHours.textContent=h.toFixed(1)+"h"}function saveMemo(){localStorage.setItem("king_boss_memo",bossMemo.value);alert("保存しました")}bossMemo.value=localStorage.getItem("king_boss_memo")||"";render();
</script></body></html>
