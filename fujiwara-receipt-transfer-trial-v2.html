<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUJIWARA Group レシート経費申請（試験）</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf6f6;color:#30252a;font:17px/1.55 system-ui,sans-serif}header{background:#821c38;color:white;padding:28px 20px}header div,main{max-width:760px;margin:auto}main{padding:20px 14px}h1,h2,p{margin:0 0 14px}h1{font-size:1.6rem}section,article{background:white;border:1px solid #e8d7dd;border-radius:15px;padding:18px;margin-bottom:14px}nav{display:flex;gap:10px;margin-bottom:16px}label{display:block;margin-bottom:13px;font-weight:600}input,select,textarea,button{font:inherit;border-radius:9px;padding:10px;min-height:44px}input,select,textarea{display:block;width:100%;border:1px solid #b78f9c;background:white;color:inherit}button{background:#821c38;color:white;border:0;cursor:pointer}button:disabled{opacity:.55}button[aria-pressed=false]{background:#f0e3e8;color:#68132c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}img{display:block;max-width:100%;max-height:420px;margin:12px 0;object-fit:contain}.status{color:#245944}.error{color:#8c1735}.actions{display:flex;flex-wrap:wrap;gap:8px}.note{font-size:.92rem}@media(max-width:540px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>レシート経費申請</h1><p>FUJIWARA Group ・ 端末間受け渡し試験版 v2.0</p></div></header>
<main>
<p class="note">架空の申請と試験写真を使ってください。申請ファイルをスタッフ端末から社長端末に渡して試せます。</p>
<nav aria-label="画面切替"><button id="staffTab" type="button" aria-pressed="true">スタッフ申請</button><button id="ceoTab" type="button" aria-pressed="false">社長確認</button></nav>
<p id="status" role="status"></p>
<section id="staff">
<h2>レシートを申請する</h2>
<form id="application">
<label>レシート写真（必須）<input name="photo" type="file" accept="image/*" capture="environment" required></label>
<div class="grid">
<label>申請者<input name="staffName" maxlength="60" required></label>
<label>購入日<input name="date" type="date" required></label>
<label>仕入先・取引先<input name="supplier" maxlength="100" required></label>
<label>税込金額（円）<input name="amount" type="number" inputmode="numeric" min="1" max="999999999" step="1" required></label>
<label>支払区分<select name="payment" required><option value="">選択してください</option><option>会社のお金で購入</option><option>スタッフ立替</option></select></label>
<label>イベント名（任意）<input name="event" maxlength="100"></label>
</div>
<label>購入内容・メモ<textarea name="note" maxlength="500"></textarea></label>
<button type="submit">試験申請を保存</button>
</form><hr><h2>この端末で作った申請</h2><label>社長からの確認結果を取り込む<input id="resultFile" type="file" accept=".json,application/json"></label><div id="outbox"></div></section>
<section id="ceo" hidden><h2>受け取った申請</h2><label>スタッフからの申請を取り込む<input id="requestFile" type="file" accept=".json,application/json"></label><div id="requests"></div></section>
</main>
<script>
'use strict';
const key = 'fujiwara.receiptTransferTrial.v2';
const get = id => document.getElementById(id);
const form = get('application');
const status = get('status');
const yen = new Intl.NumberFormat('ja-JP', {style:'currency', currency:'JPY'});

function message(text, error = false) {
  status.textContent = text;
  status.className = error ? 'error' : 'status';
}
const database = new Promise((resolve, reject) => {
  const request = indexedDB.open(key, 1);
  request.onupgradeneeded = () => request.result.createObjectStore('applications', {keyPath:'id'});
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
database.catch(() => {});

function legacyEntries() {
  const entries = JSON.parse(localStorage.getItem(key) ?? '[]');
  if (!Array.isArray(entries)) throw new Error('以前の試験データを読み取れませんでした。');
  return entries;
}
async function read() {
  const existing = legacyEntries();
  const db = await database;
  const current = await new Promise((resolve, reject) => {
    const request = db.transaction('applications').objectStore('applications').getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  const entries = new Map(existing.map(entry => [entry.id, entry]));
  for (const entry of current) entries.set(entry.id, entry);
  return [...entries.values()].sort((a,b) => (b.createdAt ?? 0) - (a.createdAt ?? 0));
}
async function save(entry, expectedStatus) {
  const db = await database;
  const previous = expectedStatus === undefined ? null : legacyEntries().find(item => item.id === entry.id);
  await new Promise((resolve, reject) => {
    const transaction = db.transaction('applications', 'readwrite');
    const records = transaction.objectStore('applications');
    let conflict = false;
    transaction.oncomplete = resolve;
    transaction.onabort = () => reject(new Error(conflict
      ? '申請の状態が更新されました。社長確認を開き直してください。'
      : '試験データの保存に失敗しました。入力内容を確認して再試行してください。'));
    if (expectedStatus === undefined) {
      records.add(entry);
      return;
    }
    const request = records.get(entry.id);
    request.onsuccess = () => {
      const current = request.result ?? previous;
      if (!current || current.status !== expectedStatus) {
        conflict = true;
        transaction.abort();
        return;
      }
      records.put({...current, status:entry.status, reason:entry.reason});
    };
  });
}
function add(parent, tag, text) {
  const element = document.createElement(tag);
  element.textContent = text;
  parent.append(element);
  return element;
}
async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error('写真を開けませんでした。JPEGまたはPNGでお試しください。'));
      image.src = url;
    });
    const canvas = document.createElement('canvas');
    const ratio = Math.min(1, 1400 / Math.max(image.naturalWidth, image.naturalHeight));
    canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio));
    const context = canvas.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.72);
  } finally {
    URL.revokeObjectURL(url);
  }
}
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = event.submitter;
  if (button.disabled) return;
  button.disabled = true;
  try {
    const fields = new FormData(form);
    const value = name => String(fields.get(name)).trim();
    const staffName = value('staffName');
    const supplier = value('supplier');
    if (!staffName || !supplier) throw new Error('申請者と仕入先を入力してください。');
    const photo = await compress(fields.get('photo'));
    const entry = {
      id: crypto.randomUUID(), createdAt: Date.now(), staffName, supplier, photo, date: value('date'),
      amount: Number(value('amount')), payment: value('payment'),
      event: value('event'), note: value('note'), status:'確認待ち', source:'staff'
    };
    await save(entry);
    form.reset();
    await renderOutbox();
    message('試験申請を保存しました。下の一覧から申請ファイルを保存できます。');
  } catch (error) {
    message(error.message, true);
  } finally {
    button.disabled = false;
  }
});
let renderVersion = 0;
async function render() {
  const version = ++renderVersion;
  const list = get('requests');
  list.replaceChildren();
  try {
    const entries = (await read()).filter(entry => entry.source === 'ceo');
    if (version !== renderVersion || get('ceo').hidden) return;
    if (!entries.length) add(list, 'p', '試験申請はまだありません。');
    for (const entry of entries) {
      const card = add(list, 'article', '');
      add(card, 'h3', entry.supplier + ' ・ ' + yen.format(entry.amount));
      add(card, 'p', entry.date + ' ／ ' + entry.staffName + ' ／ ' + entry.payment);
      if (entry.event) add(card, 'p', 'イベント　' + entry.event);
      if (entry.note) add(card, 'p', entry.note);
      add(card, 'strong', entry.status);
      if (entry.reason) add(card, 'p', entry.reason);
      const photo = add(card, 'details', '');
      add(photo, 'summary', 'レシート写真を表示');
      const image = add(photo, 'img', '');
      image.alt = '申請に添付されたレシート';
      image.src = entry.photo;
      if (entry.status !== '確認待ち') {
        const download = add(card, 'button', '確認結果ファイルを保存');
        download.onclick = () => exportFile('result', {id:entry.id, status:entry.status, reason:entry.reason});
      }
      if (entry.status === '確認済み（試験）') continue;
      const reason = add(card, 'label', '確認メモ');
      const input = add(reason, 'textarea', '');
      input.maxLength = 500;
      const actions = add(card, 'div', '');
      actions.className = 'actions';
      for (const next of ['確認済み（試験）', '保留（試験）']) {
        const button = add(actions, 'button', next);
        button.type = 'button';
        button.onclick = async () => {
          if (button.disabled) return;
          button.disabled = true;
          try {
            const memo = input.value.trim();
            if (next === '保留（試験）' && !memo) {
              throw new Error('保留の理由を入力してください。');
            }
            await save({...entry, status:next, reason:memo}, entry.status);
            render();
            message(next + 'として記録しました。');
          } catch (error) {
            message(error.message, true);
          } finally {
            button.disabled = false;
          }
        };
      }
    }
  } catch (error) {
    message(error.message, true);
  }
}
function show(ceo) {
  get('staff').hidden = ceo;
  get('ceo').hidden = !ceo;
  get('staffTab').setAttribute('aria-pressed', String(!ceo));
  get('ceoTab').setAttribute('aria-pressed', String(ceo));
  message('');
  if (ceo) render();
  else renderOutbox();
}
get('staffTab').onclick = () => show(false);
get('ceoTab').onclick = () => show(true);

const format = 'fujiwara-receipt-transfer-v2';
const decisions = ['保留（試験）', '確認済み（試験）'];
function exportFile(type, entry) {
  const blob = new Blob([JSON.stringify({format, type, entry})], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = 'receipt-' + type + '-' + entry.id + '.json';
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
async function renderOutbox() {
  try {
    const entries = (await read()).filter(entry => entry.source === 'staff');
    const list = get('outbox');
    list.replaceChildren();
    if (!entries.length) add(list, 'p', '試験申請はまだありません。');
    for (const entry of entries) {
      const card = add(list, 'article', '');
      add(card, 'h3', entry.supplier + ' ・ ' + yen.format(entry.amount));
      add(card, 'p', entry.date + ' ／ ' + entry.payment + ' ／ ' + entry.status);
      if (entry.reason) add(card, 'p', entry.reason);
      const download = add(card, 'button', '申請ファイルを保存');
      download.onclick = () => exportFile('request', entry);
    }
  } catch (error) {
    message(error.message, true);
  }
}
function checkedRequest(entry) {
  const validText = (value, max, required = false) =>
    typeof value === 'string' && value.length <= max && (!required || !!value.trim());
  if (!validText(entry.staffName, 60, true) || !validText(entry.supplier, 100, true)
    || !validText(entry.date, 10) || !/^\d{4}-\d{2}-\d{2}$/.test(entry.date)
    || !Number.isSafeInteger(entry.amount) || entry.amount < 1 || entry.amount > 999999999
    || !['会社のお金で購入','スタッフ立替'].includes(entry.payment)
    || !validText(entry.note, 500) || !validText(entry.event, 100)
    || !validText(entry.photo, 2800000) || !/^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/.test(entry.photo)) {
    throw new Error('申請ファイルの内容を確認できませんでした。');
  }
  const {id, staffName, supplier, date, amount, payment, event, note, photo} = entry;
  return {id:'ceo:' + id, staffName, supplier, date, amount, payment, event, note, photo,
    createdAt:Date.now(), source:'ceo', status:'確認待ち'};
}
async function receive(input, type) {
  const file = input.files[0];
  if (!file) return;
  input.disabled = true;
  try {
    if (file.size > 4200000) throw new Error('ファイルが大きすぎます。');
    const packet = JSON.parse(await file.text());
    const entry = packet?.entry;
    const id = type === 'result' && typeof entry?.id === 'string' && entry.id.startsWith('ceo:')
      ? entry.id.slice(4) : entry?.id;
    if (packet?.format !== format || packet.type !== type
      || typeof id !== 'string' || !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(id)) {
      throw new Error('選んだファイルの種類が違います。');
    }
    const entries = await read();
    if (type === 'request') {
      const incoming = checkedRequest(entry);
      if (entries.some(item => item.id === incoming.id)) throw new Error('この申請は取り込み済みです。');
      await save(incoming);
      await render();
      message('申請を取り込みました。写真と申請内容を確認できます。');
    } else {
      const target = entries.find(item => item.id === id && item.source === 'staff');
      if (!target || !decisions.includes(entry.status) || typeof entry.reason !== 'string' || entry.reason.length > 500) {
        throw new Error('この端末の申請に対応する確認結果を選んでください。');
      }
      if (target.status === '確認済み（試験）') throw new Error('この申請は確認済みです。');
      await save({...target, status:entry.status, reason:entry.reason}, target.status);
      await renderOutbox();
      message('社長の確認結果を取り込みました。');
    }
  } catch (error) {
    message(error instanceof SyntaxError ? 'ファイルを読み取れませんでした。' : error.message, true);
  } finally {
    input.value = '';
    input.disabled = false;
  }
}
get('requestFile').onchange = event => receive(event.target, 'request');
get('resultFile').onchange = event => receive(event.target, 'result');
renderOutbox();
</script>
</body>
</html>
