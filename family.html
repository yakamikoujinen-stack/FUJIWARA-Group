<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="apple-mobile-web-app-capable" content="yes"><title>家族アプリ</title><style>
:root{--bg:#fff8e8;--card:#fffdf6;--gold:#b8860b;--gold2:#d6a634;--text:#1d1400;--muted:#6d5a2b;--border:#d8bf75;--green:#168a58;--red:#d64242;--blue:#2f6fbd}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,#fff8e8,#f4ead0);color:var(--text)}header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#fff4d7,#ffe8a8,#fff4d7);border-bottom:2px solid rgba(184,134,11,.45);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900}.sub{font-size:12px;color:var(--muted)}main{padding:14px 12px 80px;max-width:860px;margin:0 auto}.card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 3px 14px rgba(80,55,0,.1)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900;font-size:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.ghost{background:#fffaf0;color:var(--muted);border:1.5px solid var(--border)}.btn.blue{background:#eaf2ff;color:var(--blue);border:1px solid #a9c4ea}.btn.full{width:100%;margin-top:8px}input,textarea{width:100%;padding:11px;border:1.5px solid var(--border);border-radius:10px;background:white;font-size:15px}textarea{min-height:80px}label{font-size:12px;color:var(--muted);font-weight:800;display:block;margin:8px 0 4px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.list .item{border-top:1px solid #ead8a8;padding:11px 0}.list .item:first-child{border-top:0}.title{font-weight:900;font-size:18px}.muted{color:var(--muted);font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff4d7;border-top:2px solid rgba(184,134,11,.35);padding:8px;display:flex;gap:8px;justify-content:center}.bottom button{flex:1;max-width:180px}.big{font-size:22px;font-weight:900}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{max-width:380px;width:100%}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.dow{text-align:center;font-size:12px;font-weight:900;color:#5f4a16}.day{min-height:70px;background:white;border:1.5px solid var(--border);border-radius:10px;padding:6px;font-weight:900}.day.today{background:#ffe9a8;border:2.5px solid var(--gold)}.dot{display:block;font-size:10px;color:#6d5a2b;background:#fff4d7;border:1px solid #d8bf75;border-radius:6px;padding:1px 3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shared{border-left:4px solid var(--gold);padding-left:10px}.private{border-left:4px solid var(--blue);padding-left:10px}@media(max-width:520px){.grid{grid-template-columns:1fr}.day{min-height:56px;font-size:12px}}
</style></head><body><div id="login" class="login"><div class="card"><div class="big">🏠 家族アプリ</div><div class="muted">家族予定・伝言板</div><label>名前</label><input id="name" placeholder="名前"><button class="btn full" onclick="login()">ログイン</button></div></div><div id="app" class="hidden"><header><div><div class="brand">🏠 家族アプリ</div><div class="sub" id="who"></div></div><div class="row"><button class="btn ghost" onclick="logout()">ログアウト</button></div></header><main><div class="card"><div class="title">家族メニュー</div><div class="grid"><button class="btn" onclick="show('schedule')">📅 家族予定</button><button class="btn blue" onclick="show('memo')">📝 伝言板</button></div></div><section id="schedule" class="card page"><div class="title">家族予定</div><div class="muted">メインアプリで共有チェックされたイベントだけ表示します。</div><div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn ghost" onclick="moveMonth(-1)">‹ 前月</button><div class="big" id="monthLabel"></div><button class="btn ghost" onclick="moveMonth(1)">次月 ›</button></div><div class="cal" id="calendar"></div><div class="title" style="margin-top:16px">予定一覧</div><div id="eventList" class="list"></div><label>家族予定を追加</label><input type="date" id="date"><input id="event" placeholder="病院・学校・買い物など" style="margin-top:6px"><button class="btn full" onclick="saveEvent()">保存 家族予定</button></section><section id="memo" class="card page hidden"><div class="title">伝言板</div><textarea id="memoText" placeholder="家族への伝言"></textarea><button class="btn full" onclick="saveメモ()">投稿する</button><div id="memoList" class="list"></div></section></main><div class="bottom"><button class="btn" onclick="show('schedule')">📅 予定</button><button class="btn blue" onclick="show('memo')">📝 伝言板</button></div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script>
const LS='fujiwara_family_v2_';let user='',sharedEvents=[],y=new Date().getFullYear(),m=new Date().getMonth();function $(id){return document.getElementById(id)}function get(k,d){try{return JSON.parse(localStorage.getItem(LS+k))??d}catch(e){return d}}function set(k,v){localStorage.setItem(LS+k,JSON.stringify(v))}function today(){return new Date().toISOString().slice(0,10)}function login(){user=$('name').value.trim();if(!user)return alert('名前を入れて');localStorage.setItem(LS+'user',user);start()}function logout(){localStorage.removeItem(LS+'user');location.reload()}function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user+' logged in';$('date').value=today();show('schedule');initFirebase();render()}function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));$(id).classList.remove('hidden')}function saveEvent(){let text=$('event').value.trim();if(!text)return;let a=get('events',[]);a.push({id:Date.now(),date:$('date').value,text:text,by:user});set('events',a);$('event').value='';render()}function saveメモ(){let text=$('memoText').value.trim();if(!text)return;let a=get('memos',[]);a.push({id:Date.now(),time:new Date().toLocaleString('ja-JP'),text:text,by:user});set('memos',a);$('memoText').value='';render()}function moveMonth(n){m+=n;if(m<0){m=11;y--}if(m>11){m=0;y++}render()}function dateKey(d){return String(d||'').slice(0,10)}function render(){renderCalendar();renderList();$('memoList').innerHTML=get('memos',[]).slice().reverse().map(x=>`<div class="item"><b>${x.by}</b><div>${x.text}</div><div class="muted">${x.time}</div></div>`).join('')||'<div class="muted">No messages</div>'}function renderCalendar(){let first=new Date(y,m,1),last=new Date(y,m+1,0);$('monthLabel').textContent=y+'年 '+(m+1)+'月';let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('');for(let i=0;i<first.getDay();i++)html+='<div></div>';let t=today();let all=allEvents();for(let d=1;d<=last.getDate();d++){let ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');let evs=all.filter(e=>dateKey(e.date)===ds);html+=`<div class="day ${ds===t?'today':''}">${d}${evs.slice(0,2).map(e=>`<span class="dot">${e.source==='main'?'🔴':'🏠'} ${e.text}</span>`).join('')}</div>`}$('calendar').innerHTML=html}function allEvents(){let own=get('events',[]).map(e=>({date:e.date,text:e.text,by:e.by,source:'family',place:''}));let shared=sharedEvents.map(e=>({date:e.date,text:e.name||'',by:'Main App',source:'main',place:e.place||'',items:e.itemsText||''}));return shared.concat(own).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}function renderList(){let all=allEvents();$('eventList').innerHTML=all.map(x=>`<div class="item ${x.source==='main'?'shared':'private'}"><b>${x.date}</b> ${x.source==='main'?'🔴':''} ${x.text}<div class="muted">${x.place?('場所：'+x.place+'　'):''}${x.items?('内容：'+x.items):''}</div></div>`).join('')||'<div class="muted">No schedule</div>'}function initFirebase(){try{if(firebase.apps.length)return;firebase.initializeApp({apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:5ec6b7e2a2165066956a94"});firebase.database().ref('fujiwara/events').on('value',snap=>{let v=snap.val();let arr=Array.isArray(v)?v:Object.values(v||{});sharedEvents=arr.filter(e=>e&&e.familyShare).map(e=>({id:String(e.id||''),name:e.name||'',date:e.date||'',dateEnd:e.dateEnd||'',place:e.place||'',itemsText:e.itemsText||'',zone:e.zone||''}));render()})}catch(e){console.log(e)}}if(new URLSearchParams(location.search).get('from')==='leader'||new URLSearchParams(location.search).get('auto')==='1'){user='藤原';localStorage.setItem(LS+'user',user);start()}else{let u=localStorage.getItem(LS+'user');if(u){user=u;start()}}
</script></body></html>
