<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="apple-mobile-web-app-capable" content="yes"><title>Family App</title><style>
:root{--bg:#fff8e8;--card:#fffdf6;--gold:#b8860b;--gold2:#d6a634;--text:#1d1400;--muted:#6d5a2b;--border:#d8bf75;--green:#168a58;--red:#d64242;--blue:#2f6fbd}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,#fff8e8,#f4ead0);color:var(--text)}header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#fff4d7,#ffe8a8,#fff4d7);border-bottom:2px solid rgba(184,134,11,.45);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900}.sub{font-size:12px;color:var(--muted)}main{padding:14px 12px 80px;max-width:760px;margin:0 auto}.card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 3px 14px rgba(80,55,0,.1)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900;font-size:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.ghost{background:#fffaf0;color:var(--muted);border:1.5px solid var(--border)}.btn.green{background:#e1f5eb;color:var(--green);border:1px solid #9bd8bb}.btn.red{background:#ffe8e8;color:var(--red);border:1px solid #efb0b0}.btn.blue{background:#eaf2ff;color:var(--blue);border:1px solid #a9c4ea}.btn.full{width:100%;margin-top:8px}input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--border);border-radius:10px;background:white;font-size:15px}textarea{min-height:80px}label{font-size:12px;color:var(--muted);font-weight:800;display:block;margin:8px 0 4px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{font-size:12px;border-radius:999px;padding:4px 9px;background:#fff4d7;color:var(--muted);font-weight:900}.hidden{display:none!important}.list .item{border-top:1px solid #ead8a8;padding:11px 0}.list .item:first-child{border-top:0}.title{font-weight:900;font-size:18px}.muted{color:var(--muted);font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff4d7;border-top:2px solid rgba(184,134,11,.35);padding:8px;display:flex;gap:8px;justify-content:center}.bottom a{flex:1;max-width:180px}.big{font-size:22px;font-weight:900}.table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}.table th,.table td{border:1px solid #ead8a8;padding:8px;font-size:12px;text-align:left}.table th{background:#fff4d7;color:#5f4a16}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{max-width:380px;width:100%}.danger{color:var(--red);font-size:12px;font-weight:800}.ok{color:var(--green);font-size:12px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.row .btn{flex:1}.table{min-width:620px}.scroll{overflow-x:auto}}
</style></head><body><div id="login" class="login"><div class="card"><div class="big">🏠 Family App</div><div class="muted">Family Schedule ・ Message Board</div><label>名前</label><input id="name" placeholder="名前"><button class="btn full" onclick="login()">ログイン</button></div></div><div id="app" class="hidden"><header><div><div class="brand">🏠 Family App</div><div class="sub" id="who"></div></div><div class="row"><button class="btn ghost" onclick="logout()">ログアウト</button></div></header><main><div class="card"><div class="title">Family Menu</div><div class="grid"><button class="btn" onclick="show('schedule')">📅 Schedule</button><button class="btn blue" onclick="show('memo')">📝 Message</button></div></div><section id="schedule" class="card page"><div class="title">Family Schedule</div><label>日付</label><input type="date" id="date"><label>内容</label><input id="event" placeholder="Hospital, school, shopping"><button class="btn full" onclick="saveEvent()">Save Schedule</button><div id="eventList" class="list"></div></section><section id="memo" class="card page hidden"><div class="title">Message Board</div><textarea id="memoText" placeholder="Message for family"></textarea><button class="btn full" onclick="saveMemo()">Post</button><div id="memoList" class="list"></div></section></main><div class="bottom"><a class="btn" href="family.html">🏠 Family</a></div></div><script>const LS='fujiwara_family_v1_';let user='';function $(id){return document.getElementById(id)}function get(k,d){try{return JSON.parse(localStorage.getItem(LS+k))??d}catch(e){return d}}function set(k,v){localStorage.setItem(LS+k,JSON.stringify(v))}function today(){return new Date().toISOString().slice(0,10)}function login(){user=$('name').value.trim();if(!user)return alert('名前を入れて');localStorage.setItem(LS+'user',user);start()}function logout(){localStorage.removeItem(LS+'user');location.reload()}function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user+' logged in';$('date').value=today();show('schedule');render()}function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));$(id).classList.remove('hidden')}function saveEvent(){let a=get('events',[]);a.push({id:Date.now(),date:$('date').value,text:$('event').value,by:user});set('events',a);$('event').value='';render()}function saveMemo(){let a=get('memos',[]);a.push({id:Date.now(),time:new Date().toLocaleString('ja-JP'),text:$('memoText').value,by:user});set('memos',a);$('memoText').value='';render()}function render(){$('eventList').innerHTML=get('events',[]).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="item"><b>${x.date}</b> ${x.text}<div class="muted">${x.by}</div></div>`).join('')||'<div class="muted">No schedule</div>';$('memoList').innerHTML=get('memos',[]).slice().reverse().map(x=>`<div class="item"><b>${x.by}</b><div>${x.text}</div><div class="muted">${x.time}</div></div>`).join('')||'<div class="muted">No messages</div>'}function isLeaderEntry(){return new URLSearchParams(location.search).get('from')==='leader'||new URLSearchParams(location.search).get('auto')==='1'}
if(isLeaderEntry()){
  user='藤原';
  localStorage.setItem(LS+'user',user);
  start();
}else{
  let u=localStorage.getItem(LS+'user');
  if(u){user=u;start()}
}</script></body></html>
