<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>家族サブアプリ</title><style>
:root{--bg:#fff8e8;--card:#fffef9;--gold:#c99513;--border:#dec47a;--text:#1f1a10;--muted:#77633e;--red:#d94343}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff8e8,#fff2cf);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:var(--text);padding-bottom:72px}.top{height:58px;background:linear-gradient(90deg,#fff3ca,#ffe28a,#fff3ca);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border)}.brand{font-weight:900}.wrap{padding:16px;max-width:900px;margin:auto}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 20px rgba(80,55,0,.1)}button,input{font:inherit}input{width:100%;padding:13px;border:1.5px solid var(--border);border-radius:12px}.btn{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(135deg,#c69211,#e3b937);font-weight:900;color:#171002}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{width:100%;max-width:420px}.muted{color:var(--muted);font-size:13px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.w{text-align:center;font-weight:900}.day{min-height:78px;background:white;border:1px solid var(--border);border-radius:10px;padding:6px}.today{background:#fff0a4;border:3px solid var(--gold)}.selected{outline:3px solid #a06a00}.num{font-size:22px;font-weight:900}.dot{width:7px;height:7px;background:var(--red);border-radius:50%;display:block;margin:4px auto}.event{border:1px solid var(--border);background:white;border-radius:14px;padding:13px;margin:9px 0}.event h3{margin:0 0 8px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff0bd;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{background:transparent;border:0;padding:9px 2px;font-size:12px;font-weight:800}.ico{font-size:21px;display:block}.page{display:none}.page.on{display:block}.sync{font-size:11px;color:var(--muted);text-align:right}
.creator-table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;margin-top:10px}
.creator-table th,.creator-table td{border:1px solid var(--border);padding:9px 8px;font-size:13px;text-align:left}
.creator-table th{background:#fff0bd;font-weight:900}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#fff0bd;border:1px solid var(--border);font-size:11px;font-weight:900}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}
.day-hint{font-size:10px;color:var(--muted);margin-top:4px}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.creator-table{font-size:12px}}
</style></head><body>
<div id="login" class="login"><div class="card"><h1>🏠 家族サブアプリ</h1><p class="muted">家族予定・伝言板。メインアプリへの入口は表示しません。</p><label>名前</label><input id="name" placeholder="名前"><button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">ログイン</button></div></div>
<div id="app" style="display:none"><div class="top"><div><div class="brand">🏠 家族サブアプリ</div><div id="sync" class="sync">読み込み中...</div></div><button class="btn" onclick="logout()">ログアウト</button></div><div class="wrap"><section id="schedule" class="page on">
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center"><button class="btn" onclick="mv(-1)">‹ 前月</button><h2 id="ym"></h2><button class="btn" onclick="mv(1)">次月 ›</button></div>
  <div id="cal" class="cal"></div>
</div>
<div class="card">
  <h2>予定を追加</h2>
  <div class="form-grid">
    <div><label>日付</label><input id="famDate" type="date"></div>
    <div><label>予定名</label><input id="famTitle" placeholder="例：病院・学校・予定"></div>
    <div class="full"><label>内容・場所</label><input id="famMemo" placeholder="内容や場所"></div>
  </div>
  <button class="btn" onclick="addFamilySchedule()" style="width:100%;margin-top:12px">予定を保存</button>
  <p class="muted">ログイン中の名前が「入力者」として自動で記録されます。</p>
</div>
<h2>選択日の予定</h2>
<div id="list"></div>
<div class="card"><h2>誰が予定を入れたか</h2><div id="creatorTable"></div></div>
</section><section id="message" class="page"><div class="card"><h2>💬 伝言板</h2><input id="msg" placeholder="伝言を書く"><button class="btn" onclick="addMsg()" style="margin-top:10px">追加</button><div id="msgs"></div></div></section><section id="album" class="page"><div class="card"><h2>🖼 アルバム</h2><p class="muted">次回、写真保存機能を追加します。</p></div></section><section id="setting" class="page"><div class="card"><h2>⚙️ 設定</h2><p class="muted">このアプリからメインアプリには入れません。</p></div></section></div><nav class="nav"><button onclick="pg('schedule')"><span class="ico">📅</span>予定</button><button onclick="pg('message')"><span class="ico">💬</span>伝言</button><button onclick="pg('album')"><span class="ico">🖼</span>写真</button><button onclick="pg('setting')"><span class="ico">⚙️</span>設定</button></nav></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
let cur=new Date(),sel=new Date(),user='',sharedEvents=[],familySchedules=[];
function doLogin(){user=document.getElementById('name').value.trim()||'家族';sessionStorage.setItem('family_user',user);start()}
function logout(){sessionStorage.removeItem('family_user');location.reload()}
function start(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadLocal();initFirebase();render();renderMsgs()}
(function(){let u=sessionStorage.getItem('family_user');if(u){user=u;start()}})();
function ymd(d){let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function loadLocal(){try{sharedEvents=JSON.parse(localStorage.getItem('fujiwara_shared_family_events')||'[]');familySchedules=JSON.parse(localStorage.getItem('family_schedules')||'[]')}catch(e){sharedEvents=[];familySchedules=[]}}
function events(){return [...(sharedEvents||[]).map(e=>({...e,type:'メイン共有',creator:e.creator||e.createdBy||'リーダー'})),...(familySchedules||[]).map(e=>({...e,type:'家族予定'}))]}
function mv(n){cur.setMonth(cur.getMonth()+n);render()}
function render(){let fd=document.getElementById('famDate');if(fd&&!fd.value)fd.value=ymd(sel);document.getElementById('ym').textContent=cur.getFullYear()+'年 '+(cur.getMonth()+1)+'月';let cal=document.getElementById('cal');cal.innerHTML='';['日','月','火','水','木','金','土'].forEach(w=>cal.innerHTML+='<div class="w">'+w+'</div>');let first=new Date(cur.getFullYear(),cur.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());let today=ymd(new Date()),selected=ymd(sel);for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=ymd(d);let has=events().some(e=>e.start<=ds&&e.end>=ds);cal.innerHTML+='<div class="day '+(ds===today?'today ':'')+(ds===selected?'selected':'')+'" onclick="sel=new Date(\''+ds+'T00:00:00\');render()"><div class="num">'+d.getDate()+'</div>'+(has?'<span class="dot"></span>':'')+'</div>'}renderList()}
function renderList(){let ds=ymd(sel);let evs=events().filter(e=>e.start<=ds&&e.end>=ds);let fd=document.getElementById('famDate');if(fd)fd.value=ds;document.getElementById('list').innerHTML=evs.map(e=>'<div class="event"><h3>📍 '+esc(e.name)+'</h3><p>内容・場所：'+esc(e.place||e.memo||'')+'</p><p>出店：'+esc(e.items||'')+'</p><p><span class="badge">入力者：'+esc(e.creator||'')+'</span> <span class="badge">'+esc(e.type||'予定')+'</span></p><p class="muted">'+e.start+' ～ '+e.end+'</p></div>').join('')||'<div class="card muted">予定なし</div>';renderCreatorTable(evs)}
function renderCreatorTable(evs){let box=document.getElementById('creatorTable');if(!box)return;if(!evs.length){box.innerHTML='<p class="muted">この日の予定はありません。</p>';return}box.innerHTML='<table class="creator-table"><thead><tr><th>予定</th><th>入力者</th><th>区分</th><th>内容・場所</th></tr></thead><tbody>'+evs.map(e=>'<tr><td>'+esc(e.name)+'</td><td>'+esc(e.creator||'')+'</td><td>'+esc(e.type||'予定')+'</td><td>'+esc(e.place||e.memo||e.items||'')+'</td></tr>').join('')+'</tbody></table>'}
function addFamilySchedule(){let date=document.getElementById('famDate').value||ymd(sel);let title=document.getElementById('famTitle').value.trim();let memo=document.getElementById('famMemo').value.trim();if(!title){alert('予定名を入力して');return}familySchedules.unshift({id:'fam_'+Date.now(),name:title,start:date,end:date,memo:memo,place:memo,creator:user||'家族',createdAt:new Date().toLocaleString(),type:'家族予定'});localStorage.setItem('family_schedules',JSON.stringify(familySchedules));document.getElementById('famTitle').value='';document.getElementById('famMemo').value='';render()}
function pg(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on')}
function addMsg(){let v=document.getElementById('msg').value.trim();if(!v)return;let a=JSON.parse(localStorage.getItem('family_msgs')||'[]');a.unshift({u:user,t:v,d:new Date().toLocaleString()});localStorage.setItem('family_msgs',JSON.stringify(a));document.getElementById('msg').value='';renderMsgs()}
function renderMsgs(){document.getElementById('msgs').innerHTML=(JSON.parse(localStorage.getItem('family_msgs')||'[]')).map(m=>'<div class="event"><b>'+esc(m.u)+'</b><p>'+esc(m.t)+'</p><p class="muted">'+m.d+'</p></div>').join('')}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function initFirebase(){try{if(!window.firebase)return;let config={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:5ec6b7e2a2165066956a94"};if(!firebase.apps.length)firebase.initializeApp(config);firebase.database().ref('fujiwara/events').on('value',snap=>{let data=snap.val();let arr=Array.isArray(data)?data:Object.values(data||{});sharedEvents=arr.filter(e=>e&&e.familyShare&&!e.secret).map(e=>({id:String(e.id||''),name:e.name||'',start:e.date||'',end:e.dateEnd||e.date||'',place:e.place||'',items:e.itemsText||'',zone:e.zone||'',memo:e.memo||'',creator:e.createdBy||e.creator||e.leader||'リーダー'}));localStorage.setItem('fujiwara_shared_family_events',JSON.stringify(sharedEvents));document.getElementById('sync').textContent='共有予定 '+sharedEvents.length+'件';render();});}catch(e){document.getElementById('sync').textContent='ローカル表示';}}
</script></body></html>
