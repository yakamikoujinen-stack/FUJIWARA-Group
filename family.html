<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"><meta name="apple-mobile-web-app-capable" content="yes"><title>家族サブアプリ</title><style>:root{--gold:#b8860b;--line:#d8bf75;--txt:#1d1400;--muted:#6d5a2b;--blue:#1684e8;--green:#18a85a;--red:#df3333;--yellow:#d7a400}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,#fff8e8,#f4ead0);color:var(--txt);padding-bottom:72px}header{height:56px;background:linear-gradient(90deg,#fff4d7,#ffe8a8,#fff4d7);border-bottom:2px solid rgba(184,134,11,.45);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}.brand{font-weight:900;letter-spacing:2px;color:#9b6b00}.badge{font-size:12px;font-weight:900;padding:5px 12px;border:1px solid var(--line);border-radius:20px;background:#fffaf0}.wrap{max-width:920px;margin:auto;padding:14px}.card{background:#fffdf6;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:13px 0;box-shadow:0 3px 14px rgba(80,55,0,.10)}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{width:100%;max-width:420px}.muted{color:var(--muted);font-size:13px;line-height:1.6}label{display:block;font-size:13px;color:var(--muted);font-weight:900;margin:12px 0 6px}input,textarea{width:100%;padding:13px;background:#fff;border:1.5px solid var(--line);border-radius:12px;color:var(--txt);font-size:16px;font-family:inherit}textarea{min-height:78px}.btn{border:1.5px solid var(--line);background:#fffaf0;border-radius:12px;padding:12px 16px;font-weight:900;font-size:15px}.gold{background:linear-gradient(135deg,var(--gold),#e9c947);border:0;color:#1d1400}.redbtn{background:#fff1f1;color:#c22;border-color:#e8a2a2}.full{width:100%}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.person{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;text-align:center;font-weight:900}.person.active{outline:4px solid rgba(184,134,11,.25)}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:2px 4px 0 0;vertical-align:middle}.yellow{background:var(--yellow)}.blue{background:var(--blue)}.green{background:var(--green)}.red{background:var(--red)}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cal-title{font-size:24px;font-weight:900}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-weight:900;color:#4d3a00;padding:4px}.day{min-height:82px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:7px;cursor:pointer}.day.today{background:#fff0a8;border:3px solid var(--gold)}.day.sel{outline:4px solid #8a6200}.day.other{opacity:.38;background:#f5ead0}.num{font-size:24px;font-weight:900}.item{background:#fff;border:1px solid #ead8a8;border-radius:12px;padding:12px;margin:8px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(90deg,#fff4d7,#ffe8a8,#fff4d7);border-top:2px solid rgba(184,134,11,.45);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav button{border:0;background:transparent;padding:9px 2px;font-weight:900;color:#6d5a2b}.nav .ico{font-size:22px;display:block}.page{display:none}.page.active{display:block}@media(max-width:720px){.day{min-height:72px}.num{font-size:22px}.grid2{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><div class="card"><h1>🏠 家族サブアプリ</h1><p class="muted">家族予定・伝言板</p><div class="tabs"><div class="person active" data-name="明裕"><span class="dot blue"></span>明裕</div><div class="person" data-name="友絵"><span class="dot green"></span>友絵</div><div class="person" data-name="光"><span class="dot red"></span>光</div></div><button class="btn gold full" onclick="familyLogin()">ログイン</button></div></div><div id="app" style="display:none"><header><div class="brand">Family</div><span id="who" class="badge"></span></header><main class="wrap"><section id="page-cal" class="page active"><div class="card"><h2>家族予定</h2><p class="muted">🟡共有イベント　🔵明裕　🟢友絵　🔴光</p><div class="cal-head"><button class="btn" onclick="moveMonth(-1)">‹ 前月</button><div id="monthLabel" class="cal-title"></div><button class="btn" onclick="moveMonth(1)">次月 ›</button></div><div id="calendar" class="cal"></div></div><div class="card"><h2 id="dayTitle">予定</h2><div id="dayList"></div></div><div class="card"><h2 id="formTitle">予定を追加</h2><input type="hidden" id="editId"><label>日付</label><input id="date" type="date"><label>予定名</label><input id="title" placeholder="例：病院、学校、買い物"><label>時間</label><input id="time" placeholder="例：9:00"><label>場所</label><input id="place" placeholder="場所"><label>メモ</label><textarea id="memo" placeholder="内容"></textarea><div class="grid2"><button class="btn gold" onclick="savePlan()">予定を保存</button><button class="btn" onclick="clearForm()">新規に戻す</button></div></div></section><section id="page-msg" class="page"><div class="card"><h2>💬 伝言</h2><textarea id="msgText" placeholder="家族への伝言"></textarea><button class="btn gold" onclick="addMsg()">投稿</button><div id="msgList"></div></div></section><section id="page-photo" class="page"><div class="card"><h2>🖼️ 写真</h2><p class="muted">写真アルバムは次の段階で追加。</p></div></section><section id="page-set" class="page"><div class="card"><h2>⚙ 設定</h2><p class="muted">家族専用。外部アプリへの入口は表示しません。</p></div></section></main><nav class="nav"><button onclick="showPage('cal')"><span class="ico">📅</span>予定</button><button onclick="showPage('msg')"><span class="ico">💬</span>伝言</button><button onclick="showPage('photo')"><span class="ico">🖼️</span>写真</button><button onclick="showPage('set')"><span class="ico">⚙</span>設定</button></nav></div><script>const LS='family_plans_v4',MSG='family_msgs_v1',SHARED='family_shared_events_v1';let user='明裕',cur=new Date(),sel=new Date().toISOString().slice(0,10);let plans=JSON.parse(localStorage.getItem(LS)||'[]'),msgs=JSON.parse(localStorage.getItem(MSG)||'[]');document.querySelectorAll('.person').forEach(p=>p.onclick=()=>{document.querySelectorAll('.person').forEach(x=>x.classList.remove('active'));p.classList.add('active');user=p.dataset.name});function familyLogin(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('who').innerHTML=colorDot(user)+user;document.getElementById('date').value=sel;localStorage.setItem('family_current_user_v1',user);render()}function colorOf(n){return n==='明裕'?'blue':n==='友絵'?'green':n==='光'?'red':'yellow'}function colorDot(n){return '<span class="dot '+colorOf(n)+'"></span>'}function shared(){try{return JSON.parse(localStorage.getItem(SHARED)||'[]')}catch(e){return[]}}function allPlans(){return [...shared().map(x=>({...x,date:x.date||x.start,end:x.end||x.date||x.start,title:x.title||x.name,person:'共有イベント',color:'yellow',shared:true})),...plans]}function render(){renderCal();renderDay()}function renderCal(){let y=cur.getFullYear(),m=cur.getMonth();document.getElementById('monthLabel').textContent=`${y}年 ${m+1}月`;let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let html=['日','月','火','水','木','金','土'].map(d=>`<div class="dow">${d}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=fmt(d);let items=allPlans().filter(p=>ds>=(p.date||ds)&&ds<=(p.end||p.date||ds));html+=`<div class="day ${ds===fmt(new Date())?'today':''} ${ds===sel?'sel':''} ${d.getMonth()===m?'':'other'}" onclick="sel='${ds}';document.getElementById('date').value=sel;render()"><div class="num">${d.getDate()}</div>${items.map(p=>`<span class="dot ${p.color||colorOf(p.person)}"></span>`).join('')}</div>`}document.getElementById('calendar').innerHTML=html}function renderDay(){document.getElementById('dayTitle').textContent=sel+' の予定';let arr=allPlans().filter(p=>sel>=(p.date||sel)&&sel<=(p.end||p.date||sel));document.getElementById('dayList').innerHTML=arr.length?arr.map(p=>`<div class="item"><h3><span class="dot ${p.color||colorOf(p.person)}"></span>${esc(p.title)}</h3><div>${p.person||''} ${p.time||''}</div><div>${esc(p.place||'')}</div><div class="muted">${esc(p.memo||p.items||'')}</div>${p.shared?'':`<button class="btn" onclick="editPlan('${p.id}')">編集</button> <button class="btn redbtn" onclick="delPlan('${p.id}')">削除</button>`}</div>`).join(''):'予定はありません'}function savePlan(){let id=document.getElementById('editId').value||String(Date.now());let p={id,date:val('date'),title:val('title')||'予定',time:val('time'),place:val('place'),memo:val('memo'),person:user,color:colorOf(user)};let idx=plans.findIndex(x=>x.id===id);if(idx>=0)plans[idx]=p;else plans.push(p);localStorage.setItem(LS,JSON.stringify(plans));sel=p.date;clearForm();render();alert('保存しました')}function editPlan(id){let p=plans.find(x=>x.id===id);if(!p)return;['date','title','time','place','memo'].forEach(k=>document.getElementById(k).value=p[k]||'');document.getElementById('editId').value=p.id;document.getElementById('formTitle').textContent='予定を修正'}function delPlan(id){if(confirm('削除しますか？')){plans=plans.filter(p=>p.id!==id);localStorage.setItem(LS,JSON.stringify(plans));render()}}function clearForm(){document.getElementById('editId').value='';['title','time','place','memo'].forEach(k=>document.getElementById(k).value='');document.getElementById('date').value=sel;document.getElementById('formTitle').textContent='予定を追加'}function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');if(p==='msg')renderMsg()}function addMsg(){let t=val('msgText');if(!t)return;msgs.unshift({user,text:t,time:new Date().toLocaleString('ja-JP')});localStorage.setItem(MSG,JSON.stringify(msgs));document.getElementById('msgText').value='';renderMsg()}function renderMsg(){document.getElementById('msgList').innerHTML=msgs.map(m=>`<div class="item"><b>${colorDot(m.user)}${esc(m.user)}</b><div class="muted">${m.time}</div>${esc(m.text)}</div>`).join('')}function moveMonth(n){cur.setMonth(cur.getMonth()+n);render()}function fmt(d){return d.toISOString().slice(0,10)}function val(id){return document.getElementById(id).value}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
