<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"><meta name="apple-mobile-web-app-capable" content="yes"><title>家族サブアプリ</title><style>
:root{--gold:#c79500;--card:#fffef8;--line:#d7b95b;--txt:#171717;--blue:#1684e8;--green:#22b35b;--red:#e23a3a;--yellow:#d7a400}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:linear-gradient(180deg,#fff8df,#f8edc9);color:var(--txt);padding-bottom:70px}header{height:58px;background:linear-gradient(90deg,#fff4bd,#ffe28a,#fff4bd);border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-weight:900;color:#9b6b00}.badge{border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:#fff9df;font-weight:800}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 18px rgba(130,90,0,.08)}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{width:100%;max-width:420px}input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;background:#fff;font-size:16px;font-family:inherit}textarea{min-height:70px}label{font-size:13px;color:#6b5b28;font-weight:800;display:block;margin:12px 0 6px}.btn{border:1.5px solid var(--line);background:#fffaf0;border-radius:12px;padding:12px 16px;font-weight:900;font-size:15px}.gold{background:linear-gradient(135deg,#d39a00,#f4cf47);border:0}.full{width:100%}.app{display:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cal-head{display:flex;align-items:center;justify-content:space-between}.cal-title{font-size:24px;font-weight:900}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{text-align:center;font-weight:900;padding:5px}.day{min-height:88px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px;position:relative}.day.today{background:#fff0a8;border:3px solid #b8860b}.day.sel{outline:4px solid #8a6200}.num{font-size:25px;font-weight:900}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:3px}.yellow{background:var(--yellow)}.blue{background:var(--blue)}.green{background:var(--green)}.red{background:var(--red)}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:#fff}.muted{color:#6b5b28;font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(90deg,#fff4bd,#ffe28a,#fff4bd);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;padding:9px;font-weight:900}.ico{font-size:21px;display:block}.page{display:none}.page.active{display:block}@media(max-width:720px){.grid2{grid-template-columns:1fr}.day{min-height:72px}.num{font-size:22px}}
</style></head><body><div id="login" class="login"><div class="card"><h1>🏠 家族サブアプリ</h1><p class="muted">家族予定・伝言板</p><label>名前</label><select id="loginName"><option>明裕</option><option>友絵</option><option>光</option></select><button class="btn gold full" onclick="login()">ログイン</button></div></div>
<div id="app" class="app"><header><div class="brand">Family</div><div><span id="who" class="badge"></span></div></header><main class="wrap"><section id="p-cal" class="page active"><div class="card"><div class="cal-head"><button class="btn" onclick="moveMonth(-1)">‹ 前月</button><div id="monthLabel" class="cal-title"></div><button class="btn" onclick="moveMonth(1)">次月 ›</button></div><div id="calendar" class="cal"></div></div><div class="card"><h2 id="dayTitle">予定</h2><div id="dayList"></div></div><div class="card"><h2 id="formTitle">予定を追加</h2><input type="hidden" id="editId"><label>日付</label><input id="date" type="date"><label>予定名</label><input id="title" placeholder="例：病院、学校、買い物"><label>時間</label><input id="time" placeholder="例：9:00"><label>場所</label><input id="place" placeholder="場所"><label>メモ</label><textarea id="memo" placeholder="内容"></textarea><div class="grid2"><button class="btn gold" onclick="savePlan()">予定を保存</button><button class="btn" onclick="clearForm()">新規に戻す</button></div></div></section><section id="p-msg" class="page"><div class="card"><h2>💬 伝言</h2><textarea id="msgText" placeholder="家族への伝言"></textarea><button class="btn gold" onclick="addMsg()">投稿</button><div id="msgList"></div></div></section><section id="p-photo" class="page"><div class="card"><h2>🖼️ 写真</h2><p class="muted">写真アルバムは次の段階で追加。</p></div></section><section id="p-set" class="page"><div class="card"><h2>⚙ 設定</h2><p class="muted">色の認識：🟡共有イベント / 🔵明裕 / 🟢友絵 / 🔴光</p></div></section></main><nav class="nav"><button onclick="show('cal')"><span class="ico">📅</span>予定</button><button onclick="show('msg')"><span class="ico">💬</span>伝言</button><button onclick="show('photo')"><span class="ico">🖼️</span>写真</button><button onclick="show('set')"><span class="ico">⚙</span>設定</button></nav></div>
<script>
const LS='family_plans_v3',MSG='family_msgs_v1';let user='',cur=new Date(),sel=new Date().toISOString().slice(0,10);let plans=JSON.parse(localStorage.getItem(LS)||'[]'),msgs=JSON.parse(localStorage.getItem(MSG)||'[]');function shared(){return JSON.parse(localStorage.getItem('family_shared_events_v1')||'[]')}function colorOf(n){return n==='明裕'?'blue':n==='友絵'?'green':n==='光'?'red':'yellow'}function login(){user=loginName.value;login.style.display='none';app.style.display='block';who.textContent=user;date.value=sel;render()}function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+p).classList.add('active');if(p==='msg')renderMsg()}function allPlans(){return [...shared().map(x=>({...x,person:'共有イベント',color:'yellow',shared:true,title:x.title||x.name,date:x.date||x.start})),...plans]}function render(){renderCal();renderDay()}function renderCal(){let y=cur.getFullYear(),m=cur.getMonth();monthLabel.textContent=`${y}年 ${m+1}月`;let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let html=['日','月','火','水','木','金','土'].map(d=>`<div class="dow">${d}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=fmt(d),items=allPlans().filter(p=>dateIn(ds,p.date,p.end||p.date));html+=`<div class="day ${ds===fmt(new Date())?'today':''} ${ds===sel?'sel':''}" onclick="sel='${ds}';date.value=sel;render()"><div class="num" style="${d.getMonth()===m?'':'opacity:.35'}">${d.getDate()}</div>${items.map(p=>`<span class="dot ${p.color||colorOf(p.person)}"></span>`).join('')}</div>`}calendar.innerHTML=html}function renderDay(){dayTitle.textContent=sel+' の予定';let arr=allPlans().filter(p=>dateIn(sel,p.date,p.end||p.date));dayList.innerHTML=arr.length?arr.map(p=>`<div class="item"><b><span class="dot ${p.color||colorOf(p.person)}"></span>${esc(p.title)}</b><div>${p.person||p.creator||''} ${p.time||''}</div><div>${esc(p.place||'')}</div><div class="muted">${esc(p.memo||p.items||'')}</div>${p.shared?'':`<button class="btn" onclick="editPlan('${p.id}')">編集</button> <button class="btn" onclick="delPlan('${p.id}')">削除</button>`}</div>`).join(''):'予定はありません'}function savePlan(){let id=editId.value||String(Date.now());let p={id,date:date.value,title:title.value||'予定',time:time.value,place:place.value,memo:memo.value,person:user,color:colorOf(user)};let idx=plans.findIndex(x=>x.id===id);if(idx>=0)plans[idx]=p;else plans.push(p);localStorage.setItem(LS,JSON.stringify(plans));clearForm();sel=p.date;render()}function editPlan(id){let p=plans.find(x=>x.id===id);if(!p)return;editId.value=p.id;date.value=p.date;title.value=p.title;time.value=p.time||'';place.value=p.place||'';memo.value=p.memo||'';formTitle.textContent='予定を修正'}function delPlan(id){if(confirm('削除しますか？')){plans=plans.filter(p=>p.id!==id);localStorage.setItem(LS,JSON.stringify(plans));render()}}function clearForm(){editId.value='';title.value='';time.value='';place.value='';memo.value='';date.value=sel;formTitle.textContent='予定を追加'}function addMsg(){let t=msgText.value.trim();if(!t)return;msgs.unshift({user,text:t,time:new Date().toLocaleString('ja-JP')});localStorage.setItem(MSG,JSON.stringify(msgs));msgText.value='';renderMsg()}function renderMsg(){msgList.innerHTML=msgs.map(m=>`<div class="item"><b>${esc(m.user)}</b><div class="muted">${m.time}</div>${esc(m.text)}</div>`).join('')}function moveMonth(n){cur.setMonth(cur.getMonth()+n);render()}function dateIn(d,s,e){return d>=s&&d<=(e||s)}function fmt(d){return d.toISOString().slice(0,10)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
