<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FUJIWARA 家族サブアプリ</title>
<style>
:root{--main:#7c3aed;--sub:#0f766e;--bg:#f6f5ff;--card:#fff;--line:#ddd6fe;--red:#dc2626;--green:#16a34a;--orange:#f59e0b;--navy:#334155}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:var(--bg);color:#1f2937;font-size:16px}header{background:linear-gradient(120deg,var(--main),var(--sub));color:white;text-align:center;padding:18px 10px;font-size:20px;font-weight:900;position:sticky;top:0;z-index:10}main{max-width:1000px;margin:auto;padding:10px 10px 90px}.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 18px #0001}.hidden{display:none!important}h2{margin:0 0 12px;border-left:6px solid var(--main);padding-left:10px;font-size:20px}label{display:block;font-weight:900;margin:10px 0 5px}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;background:white}textarea{min-height:88px}button{width:100%;border:0;border-radius:12px;padding:13px 8px;font-size:16px;font-weight:900;background:var(--navy);color:white;min-height:48px}button.primary{background:var(--main)}button.green{background:var(--green)}button.red{background:var(--red)}button.orange{background:var(--orange)}button.light{background:#ede9fe;color:#4c1d95}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.tabs button{font-size:13px;padding:8px 3px}.cal-head{display:flex;gap:8px;align-items:center;justify-content:space-between}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:white;border:1px solid var(--line);border-radius:12px;min-height:80px;padding:6px;font-size:13px}.day strong{display:block}.day.has{border:2px solid var(--main);background:#f3e8ff}.day.today{outline:3px solid #facc15}.day small{display:block;color:#7c3aed;font-weight:900}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;margin:8px 0}.pill{display:inline-block;border-radius:999px;background:#ede9fe;color:#5b21b6;font-weight:900;padding:5px 10px;margin:3px}.footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.footer button{font-size:11px;min-height:42px;padding:7px 2px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e5e7eb;padding:10px;text-align:left;vertical-align:top}th{background:#f3e8ff}.muted{color:#64748b;font-size:13px}.large{font-size:18px;font-weight:900}.photo-preview{display:flex;gap:8px;flex-wrap:wrap}.photo-preview img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid #ddd}@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr}.day{min-height:65px}}
</style>
</head>
<body>
<header>🏠 FUJIWARA 家族サブアプリ</header>
<main>
<section id="login" class="card" style="max-width:430px;margin:40px auto">
<h2>ログイン</h2>
<label>名前</label><select id="loginName"></select>
<label>権限</label><select id="loginRole"><option value="family">家族</option><option value="admin">管理者</option></select>
<label>管理者パスワード</label><input id="loginPass" type="password" placeholder="管理者は 1111 / 家族は空でOK">
<button class="primary" onclick="login()">ログイン</button>
<p class="muted">家族用：予定・連絡・買い物・メモを共有。イベント在庫や売上は表示しません。</p>
</section>
<section id="app" class="hidden">
<div class="card"><div class="large">ログイン中：<span id="userLabel"></span></div><div class="muted">サブアプリは家族仕様。メインアプリ・建設アプリとは別管理です。</div></div>
<div class="tabs"><button class="primary" onclick="show('calendar')">📅 カレンダー</button><button onclick="show('notice')">📢 連絡</button><button onclick="show('memo')">🛒 メモ</button><button onclick="show('settings')">⚙️ 設定</button></div>
<section id="page-calendar" class="card page"><h2>家族カレンダー</h2><div class="cal-head"><button class="light" onclick="moveMonth(-1)">前月</button><div id="monthLabel" class="large"></div><button class="light" onclick="moveMonth(1)">次月</button></div><div class="cal" style="margin:12px 0 6px;text-align:center;font-weight:900"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="calendarGrid" class="cal"></div><div id="dayDetail" class="notice"></div><h2>予定追加</h2><div class="grid"><div><label>日付</label><input id="eDate" type="date"></div><div><label>種類</label><select id="eType"><option>家族予定</option><option>学校</option><option>病院</option><option>仕事連絡</option><option>買い物</option><option>その他</option></select></div></div><label>タイトル</label><input id="eTitle" placeholder="例：病院、買い物、迎え">
<label>内容</label><textarea id="eBody" placeholder="時間・場所・持ち物など"></textarea><button class="green" onclick="addEvent()">予定を保存</button></section>
<section id="page-notice" class="card page hidden"><h2>家族への連絡事項</h2><label>重要度</label><select id="nLevel"><option>通常</option><option>重要</option><option>至急</option></select><label>連絡内容</label><textarea id="nText" placeholder="例：今日は帰りが遅くなります"></textarea><button class="green" onclick="addNotice()">連絡を追加</button><div id="noticeList"></div></section>
<section id="page-memo" class="card page hidden"><h2>買い物・家族メモ</h2><div class="grid"><div><label>項目</label><input id="mText" placeholder="例：牛乳、米、薬"></div><div><label>担当</label><input id="mWho" placeholder="例：お父さん"></div></div><button class="green" onclick="addMemo()">メモ追加</button><div id="memoList"></div><h2>写真メモ</h2><input id="photoInput" type="file" accept="image/*" multiple onchange="addPhotos()"><div id="photoList" class="photo-preview"></div></section>
<section id="page-settings" class="card page hidden"><h2>設定</h2><div id="adminOnly"><div class="grid"><div><label>家族メンバー追加</label><input id="newMember" placeholder="名前"><button class="green" onclick="addMember()">追加</button></div><div><label>管理者パスワード</label><input id="adminPass" type="password"><button onclick="savePass()">変更</button></div></div><h2>家族メンバー</h2><div id="memberList"></div></div><div class="grid"><button onclick="backup()">バックアップ保存</button><button onclick="restoreClick()">バックアップ読込</button></div><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="restore(event)"><button class="red" onclick="logout()">ログアウト</button></section>
</section>
</main>
<div id="footer" class="footer hidden"><button onclick="show('calendar')">📅<br>予定</button><button onclick="show('notice')">📢<br>連絡</button><button onclick="show('memo')">🛒<br>メモ</button><button onclick="show('settings')">⚙️<br>設定</button></div>
<script>
const KEY='fujiwara_family_sub_v1'; const blank={members:['藤原 明広'],adminPass:'1111',events:[],notices:[],memos:[],photos:[]};let state=JSON.parse(localStorage.getItem(KEY)||JSON.stringify(blank));state={...blank,...state};let user=null,current=new Date();const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function today(){return new Date().toISOString().slice(0,10)}function refreshMembers(){$('loginName').innerHTML=state.members.map(x=>`<option>${x}</option>`).join('')||'<option>家族</option>'}function login(){const name=$('loginName').value,role=$('loginRole').value,pass=$('loginPass').value;if(role==='admin'&&pass!==state.adminPass)return alert('管理者パスワードが違います');user={name,role};$('login').classList.add('hidden');$('app').classList.remove('hidden');$('footer').classList.remove('hidden');$('userLabel').textContent=name+(role==='admin'?'（管理者）':'');$('eDate').value=today();$('adminPass').value=state.adminPass;renderAll();show('calendar')}function logout(){location.reload()}function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$('page-'+p).classList.remove('hidden');renderAll()}function moveMonth(n){current.setMonth(current.getMonth()+n);renderCalendar()}function renderCalendar(){$('monthLabel').textContent=current.getFullYear()+'年 '+(current.getMonth()+1)+'月';const grid=$('calendarGrid');grid.innerHTML='';const first=new Date(current.getFullYear(),current.getMonth(),1),start=first.getDay(),last=new Date(current.getFullYear(),current.getMonth()+1,0).getDate();for(let i=0;i<start;i++)grid.appendChild(document.createElement('div'));for(let d=1;d<=last;d++){const date=`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const ev=state.events.filter(e=>e.date===date);const el=document.createElement('div');el.className='day '+(ev.length?'has ':'')+(date===today()?'today':'');el.innerHTML=`<strong>${d}</strong>${ev.length?`<small>${ev.length}件</small>`:''}`;el.onclick=()=>selectDay(date);grid.appendChild(el)}selectDay($('eDate').value||today(),true)}function selectDay(date,silent){$('eDate').value=date;const ev=state.events.filter(e=>e.date===date);$('dayDetail').innerHTML='<b>'+date+'</b><br>'+(ev.length?ev.map(e=>`<span class="pill">${e.type}</span> ${e.title}<br>${e.body||''}<br><button class="red" onclick="delEvent(${e.id})">削除</button>`).join('<hr>'):'予定はありません');if(!silent)show('calendar')}function addEvent(){const e={id:Date.now(),date:$('eDate').value,type:$('eType').value,title:$('eTitle').value.trim(),body:$('eBody').value.trim(),by:user.name};if(!e.date||!e.title)return alert('日付とタイトルを入れてください');state.events.push(e);save();$('eTitle').value='';$('eBody').value='';renderCalendar()}function delEvent(id){state.events=state.events.filter(e=>e.id!==id);save();renderCalendar()}function addNotice(){const n={id:Date.now(),level:$('nLevel').value,text:$('nText').value.trim(),by:user.name,at:new Date().toLocaleString()};if(!n.text)return;state.notices.unshift(n);save();$('nText').value='';renderNotices()}function renderNotices(){$('noticeList').innerHTML=state.notices.map(n=>`<div class="notice"><span class="pill">${n.level}</span><b>${n.by}</b> ${n.at}<br>${n.text}<br><button class="red" onclick="delNotice(${n.id})">削除</button></div>`).join('')||'<p class="muted">連絡はありません</p>'}function delNotice(id){state.notices=state.notices.filter(n=>n.id!==id);save();renderNotices()}function addMemo(){const m={id:Date.now(),text:$('mText').value.trim(),who:$('mWho').value.trim(),done:false};if(!m.text)return;state.memos.push(m);save();$('mText').value='';renderMemos()}function renderMemos(){$('memoList').innerHTML='<table><tr><th>済</th><th>項目</th><th>担当</th><th>操作</th></tr>'+state.memos.map(m=>`<tr><td><input type="checkbox" ${m.done?'checked':''} onchange="toggleMemo(${m.id})"></td><td>${m.text}</td><td>${m.who||''}</td><td><button class="red" onclick="delMemo(${m.id})">削除</button></td></tr>`).join('')+'</table>'}function toggleMemo(id){let m=state.memos.find(x=>x.id===id);if(m)m.done=!m.done;save();renderMemos()}function delMemo(id){state.memos=state.memos.filter(m=>m.id!==id);save();renderMemos()}function addPhotos(){[...$('photoInput').files].slice(0,6).forEach(f=>{const r=new FileReader();r.onload=e=>{state.photos.unshift({id:Date.now()+Math.random(),src:e.target.result,at:new Date().toLocaleString(),by:user.name});save();renderPhotos()};r.readAsDataURL(f)})}function renderPhotos(){$('photoList').innerHTML=state.photos.slice(0,20).map(p=>`<div><img src="${p.src}"><div class="muted">${p.by}<br>${p.at}</div><button class="red" onclick="delPhoto(${p.id})">削除</button></div>`).join('')}function delPhoto(id){state.photos=state.photos.filter(p=>p.id!=id);save();renderPhotos()}function addMember(){const v=$('newMember').value.trim();if(v&&!state.members.includes(v)){state.members.push(v);save();$('newMember').value='';refreshMembers();renderMembers()}}function renderMembers(){$('memberList').innerHTML='<table>'+state.members.map(m=>`<tr><td>${m}</td><td>${user&&user.role==='admin'?`<button class="red" onclick="delMember('${m}')">削除</button>`:''}</td></tr>`).join('')+'</table>';$('adminOnly').style.display=(user&&user.role==='admin')?'block':'none'}function delMember(m){state.members=state.members.filter(x=>x!==m);save();refreshMembers();renderMembers()}function savePass(){state.adminPass=$('adminPass').value||'1111';save();alert('保存しました')}function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='家族サブアプリ_backup.json';a.click()}function restoreClick(){$('restoreFile').click()}function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state={...blank,...JSON.parse(r.result)};save();refreshMembers();renderAll();alert('読込完了')};r.readAsText(f)}function renderAll(){renderCalendar();renderNotices();renderMemos();renderPhotos();renderMembers()}refreshMembers();
</script>
</body></html>
