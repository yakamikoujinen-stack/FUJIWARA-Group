<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>建設日報 ログイン修正版</title><style>body{margin:0;background:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:#152033}header{background:linear-gradient(90deg,#1766b1,#07846f);color:white;padding:18px;text-align:center;font-size:22px;font-weight:900}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 20px rgba(0,0,0,.08)}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #cfd8e3;border-radius:12px}.btn{border:0;border-radius:12px;padding:12px 16px;background:#20344c;color:white;font-weight:900}.blue{background:#1766b1}.green{background:#149456}.grid{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}@media(max-width:800px){.grid{grid-template-columns:1fr}}nav{display:flex;gap:10px;flex-wrap:wrap}.page{display:none}.on{display:block}</style></head><body><header>👷 建設会社 工事日報・請求・給与</header><div class="wrap"><div id="login" class="card"><h2>ログイン</h2><input id="name" placeholder="名前"><select id="role"><option>作業員</option><option>管理者</option></select><input id="pass" type="password" placeholder="管理者は 1111"><button class="btn blue" onclick="login()" style="width:100%;margin-top:10px">ログイン</button></div><div id="app" style="display:none"><div class="card"><nav><button class="btn blue" onclick="pg('daily')">📝 日報</button><button class="btn" onclick="pg('admin')">📊 管理者</button><button class="btn" onclick="pg('master')">👷 マスター</button><button class="btn green" onclick="location.href='index.html'">🏠 メインへ戻る</button><button class="btn" onclick="logout()">ログアウト</button></nav></div><section id="daily" class="page on card"><h2>工事日報</h2><div class="grid"><div><label>日付</label><input id="d" type="date"></div><div><label>取引先</label><input id="client"></div><div><label>現場</label><input id="site"></div></div><label>作業内容</label><textarea id="work"></textarea><div class="grid"><input placeholder="開始 8:00"><input placeholder="終了 17:00"><input placeholder="人工 1"></div><label>写真</label><input type="file" accept="image/*"><button class="btn blue" style="margin-top:12px">保存</button></section><section id="admin" class="page card"><h2>管理者集計</h2><p>請求集計・給与集計の土台。次回ここを本格化。</p></section><section id="master" class="page card"><h2>マスター管理</h2><div class="grid"><input placeholder="作業員追加"><input placeholder="取引先追加"><input placeholder="現場追加"></div></section></div></div><script>function login(){let n=name.value.trim();if(!n)return alert('名前を入力');if(role.value==='管理者'&&pass.value!=='1111')return alert('管理者パスワード違い');document.getElementById('login').style.display='none';app.style.display='block'}function logout(){location.reload()}function pg(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on')}d.value=new Date().toISOString().slice(0,10);(function(){
  try{
    var q=new URLSearchParams(location.search);
    var auth=null;
    try{ auth=JSON.parse(localStorage.getItem('fg_portal_auth')||'null'); }catch(e){}
    var fromMain = q.get('from')==='main' || (auth && auth.from==='main' && auth.target==='kensetsu');
    if(fromMain){
      name.value=(auth&&auth.name)||'藤原';
      role.value='管理者';
      pass.value='1111';
      login();
      return;
    }
  }catch(e){}
})();</script></body></html>
