<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="apple-mobile-web-app-capable" content="yes"><title>建設日報</title><style>
:root{--bg:#fff8e8;--card:#fffdf6;--gold:#b8860b;--gold2:#d6a634;--text:#1d1400;--muted:#6d5a2b;--border:#d8bf75;--green:#168a58;--red:#d64242;--blue:#2f6fbd}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,#fff8e8,#f4ead0);color:var(--text)}header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#fff4d7,#ffe8a8,#fff4d7);border-bottom:2px solid rgba(184,134,11,.45);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900}.sub{font-size:12px;color:var(--muted)}main{padding:14px 12px 24px;max-width:760px;margin:0 auto}.card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 3px 14px rgba(80,55,0,.1)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900;font-size:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.ghost{background:#fffaf0;color:var(--muted);border:1.5px solid var(--border)}.btn.green{background:#e1f5eb;color:var(--green);border:1px solid #9bd8bb}.btn.red{background:#ffe8e8;color:var(--red);border:1px solid #efb0b0}.btn.blue{background:#eaf2ff;color:var(--blue);border:1px solid #a9c4ea}.btn.full{width:100%;margin-top:8px}input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--border);border-radius:10px;background:white;font-size:15px}textarea{min-height:80px}label{font-size:12px;color:var(--muted);font-weight:800;display:block;margin:8px 0 4px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{font-size:12px;border-radius:999px;padding:4px 9px;background:#fff4d7;color:var(--muted);font-weight:900}.hidden{display:none!important}.list .item{border-top:1px solid #ead8a8;padding:11px 0}.list .item:first-child{border-top:0}.title{font-weight:900;font-size:18px}.muted{color:var(--muted);font-size:12px}.big{font-size:22px;font-weight:900}.table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}.table th,.table td{border:1px solid #ead8a8;padding:8px;font-size:12px;text-align:left}.table th{background:#fff4d7;color:#5f4a16}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{max-width:380px;width:100%}.danger{color:var(--red);font-size:12px;font-weight:800}.ok{color:var(--green);font-size:12px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.row .btn{flex:1}.table{min-width:620px}.scroll{overflow-x:auto}}
</style></head><body>
<div id="login" class="login"><div class="card"><div class="big">🏗 建設日報</div><div class="muted">管理者・作業員専用</div><label>名前</label><input id="loginName" placeholder="名前"><label>区分</label><select id="loginRole"><option value="worker">作業員</option><option value="admin">管理者</option></select><label>パスワード</label><input id="loginPw" type="password" placeholder="管理者のみ入力"><button class="btn full" onclick="login()">ログイン</button><button class="btn ghost full" onclick="location.href='index.html'">🏠 メインへ戻る</button><div id="err" class="danger"></div></div></div>
<div id="app" class="hidden"><header><div><div class="brand">🏗 建設日報 v3</div><div class="sub" id="userInfo"></div></div><div class="row"><button class="btn ghost" onclick="location.href='index.html'">🏠 メインへ</button><button class="btn ghost" onclick="logout()">ログアウト</button></div></header><main>
<div class="card"><div class="title">メニュー</div><div class="muted">下メニューを削除して、上のボタンだけで操作します。</div><div class="grid"><button class="btn" onclick="show('daily')">📝 日報入力</button><button class="btn blue adminOnly" onclick="show('billing')">📋 請求集計</button><button class="btn green adminOnly" onclick="show('payroll')">💰 給与集計</button><button class="btn ghost adminOnly" onclick="show('masters')">⚙ マスター</button><button class="btn blue adminOnly" onclick="location.href='attendance-list.html'">📋 出勤一覧</button></div></div>
<section id="daily" class="card page"><div class="title">工事日報</div><label>日付</label><input type="date" id="dDate"><label>取引先名</label><input id="client" list="clients"><datalist id="clients"></datalist><label>現場名</label><input id="site"><div class="grid"><div><label>出勤</label><input type="time" id="start"></div><div><label>退勤</label><input type="time" id="end"></div></div><label>作業内容</label><textarea id="work"></textarea><label>写真</label><input type="file" id="photo" accept="image/*"><button class="btn full" onclick="saveDaily()">保存</button></section>
<section id="billing" class="card page hidden"><div class="title">請求用：取引先別集計</div><div class="row"><input type="month" id="billMonth"><button class="btn" onclick="renderBilling()">表示</button><button class="btn ghost" onclick="window.print()">印刷</button></div><div id="billingOut" class="scroll"></div></section>
<section id="payroll" class="card page hidden"><div class="title">給料用：作業員別集計</div><div class="row"><input type="month" id="payMonth"><button class="btn" onclick="renderPayroll()">表示</button><button class="btn ghost" onclick="window.print()">印刷</button></div><div id="payOut" class="scroll"></div></section>
<section id="masters" class="card page hidden"><div class="title">マスター編集</div><label>取引先名（改行で追加）</label><textarea id="clientMaster"></textarea><label>作業員名（改行で追加）</label><textarea id="workerMaster"></textarea><button class="btn full" onclick="saveMasters()">保存</button></section>
<div class="card"><div class="title">保存済み日報</div><div id="dailyList" class="list"></div></div>
</main></div>
<script>
const LS='fujiwara_kensetsu_v2_';let user={name:'',role:''};function $(id){return document.getElementById(id)}function today(){return new Date().toISOString().slice(0,10)}function month(){return new Date().toISOString().slice(0,7)}function get(k,d){try{return JSON.parse(localStorage.getItem(LS+k))??d}catch(e){return d}}function set(k,v){localStorage.setItem(LS+k,JSON.stringify(v))}function login(){let n=$('loginName').value.trim();let r=$('loginRole').value;let p=$('loginPw').value;if(!n)return $('err').textContent='名前を入れてください';if(r==='admin'&&p!=='1111')return $('err').textContent='管理者パスワードが違います';user={name:n,role:r};localStorage.setItem(LS+'lastUser',JSON.stringify(user));startApp()}function logout(){localStorage.removeItem(LS+'lastUser');location.reload()}function startApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('userInfo').textContent=user.name+' / '+(user.role==='admin'?'管理者':'作業員');document.querySelectorAll('.adminOnly').forEach(e=>e.style.display=user.role==='admin'?'inline-flex':'none');$('dDate').value=today();$('billMonth').value=month();$('payMonth').value=month();loadMasters();renderList();show('daily')}function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));$(id).classList.remove('hidden')}function loadMasters(){let c=get('clients',['藤原一工業合同会社']);let w=get('workers',[]);$('clients').innerHTML=c.map(x=>`<option value="${x}">`).join('');$('clientMaster').value=c.join('
');$('workerMaster').value=w.join('
')}function saveMasters(){set('clients',$('clientMaster').value.split('
').map(x=>x.trim()).filter(Boolean));set('workers',$('workerMaster').value.split('
').map(x=>x.trim()).filter(Boolean));loadMasters();alert('保存しました')}function diff(st,en){if(!st||!en)return 0;let [sh,sm]=st.split(':').map(Number),[eh,em]=en.split(':').map(Number);let m=(eh*60+em)-(sh*60+sm);if(m<0)m+=1440;return Math.round(m/60*10)/10}function saveDaily(){let arr=get('daily',[]);arr.push({id:Date.now(),date:$('dDate').value,worker:user.name,client:$('client').value,site:$('site').value,start:$('start').value,end:$('end').value,hours:diff($('start').value,$('end').value),work:$('work').value});set('daily',arr);alert('日報を保存しました');renderList()}function renderList(){let arr=get('daily',[]).slice().reverse();$('dailyList').innerHTML=arr.length?arr.map(x=>`<div class="item"><b>${x.date} ${x.worker}</b><div class="muted">${x.client} / ${x.site} / ${x.hours}h</div><div>${x.work||''}</div></div>`).join(''):'<div class="muted">まだ日報がありません</div>'}function renderBilling(){let m=$('billMonth').value,arr=get('daily',[]).filter(x=>x.date&&x.date.startsWith(m));let map={};arr.forEach(x=>{let k=x.client||'未入力';map[k]=(map[k]||0)+Number(x.hours||0)});$('billingOut').innerHTML='<table class="table"><tr><th>取引先名</th><th>合計時間</th><th>日報件数</th></tr>'+Object.keys(map).map(k=>`<tr><td>${k}</td><td>${map[k].toFixed(1)} h</td><td>${arr.filter(x=>(x.client||'未入力')===k).length}</td></tr>`).join('')+'</table>'}function renderPayroll(){let m=$('payMonth').value,arr=get('daily',[]).filter(x=>x.date&&x.date.startsWith(m));let map={};arr.forEach(x=>{let k=x.worker||'未入力';map[k]=(map[k]||0)+Number(x.hours||0)});$('payOut').innerHTML='<table class="table"><tr><th>作業員名</th><th>合計時間</th><th>日数</th></tr>'+Object.keys(map).map(k=>`<tr><td>${k}</td><td>${map[k].toFixed(1)} h</td><td>${arr.filter(x=>(x.worker||'未入力')===k).length}</td></tr>`).join('')+'</table>'}let last=localStorage.getItem(LS+'lastUser');if(last){user=JSON.parse(last);startApp()}
</script></body></html>
