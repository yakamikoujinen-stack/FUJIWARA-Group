<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>建設会社 工事日報</title><style>
:root{--blue:#1766b1;--green:#07846f;--navy:#20344c;--bg:#eef3f8;--card:#fff;--border:#cfd8e3;--text:#152033}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:var(--text)}header{background:linear-gradient(90deg,var(--blue),var(--green));color:white;padding:18px;text-align:center;font-size:22px;font-weight:900}.wrap{max-width:1080px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 20px rgba(0,0,0,.08)}input,select,textarea,button{font:inherit}label{font-weight:800;font-size:13px;display:block;margin:8px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:white}textarea{min-height:90px}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--navy);color:white;font-weight:900}.blue{background:var(--blue)}.green{background:#149456}.gray{background:#617080}.grid{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}@media(max-width:800px){.grid{grid-template-columns:1fr}}nav{display:flex;gap:10px;flex-wrap:wrap}.page{display:none}.on{display:block}.login{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center}.login .card{width:100%;max-width:480px}.small{color:#607086;font-size:13px}.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{border:1px solid var(--border);padding:9px;font-size:13px;text-align:left}.table th{background:#eef5ff}.err{display:none;color:#d94343;font-weight:900;margin-top:8px}</style></head><body><header>👷 建設会社 工事日報・請求・給与</header><div class="wrap">
<div id="login" class="login"><div class="card"><h2>ログイン</h2><p class="small">メインアプリのリーダー入口から入ると自動で管理者ログインします。</p><label>名前</label><input id="name" placeholder="例：藤原"><label>区分</label><select id="role"><option>作業員</option><option>管理者</option></select><label>パスワード</label><input id="pass" type="password" placeholder="管理者は 1111 / 作業員は空でOK"><button class="btn blue" onclick="login()" style="width:100%;margin-top:12px">ログイン</button><button class="btn gray" onclick="location.href='index.html'" style="width:100%;margin-top:10px">🏠 戻る</button><div id="err" class="err"></div></div></div>
<div id="app" style="display:none"><div class="card"><b id="who"></b><nav style="margin-top:12px"><button class="btn blue" onclick="pg('daily')">📝 日報</button><button class="btn" onclick="pg('admin')">📊 管理者</button><button class="btn" onclick="pg('master')">👷 マスター</button><button class="btn green" onclick="location.href='index.html'">🏠 メインへ戻る</button><button class="btn gray" onclick="logout()">ログアウト</button></nav></div>
<section id="daily" class="page on card"><h2>工事日報</h2><div class="grid"><div><label>日付</label><input id="d" type="date"></div><div><label>作業員名</label><input id="worker"></div><div><label>取引先</label><input id="client"></div></div><div class="grid"><div><label>現場</label><input id="site"></div><div><label>開始</label><input id="start" value="8:00"></div><div><label>終了</label><input id="end" value="17:00"></div></div><label>作業内容</label><textarea id="work"></textarea><div class="grid"><div><label>休憩</label><input id="break" value="1"></div><div><label>残業</label><input id="ot" value="0"></div><div><label>人工</label><input id="nin" value="1"></div></div><label>写真</label><input type="file" accept="image/*"><button class="btn blue" onclick="saveDaily()" style="margin-top:12px;width:100%">保存</button></section>
<section id="admin" class="page card"><h2>管理者集計</h2><div id="dailyList"></div></section>
<section id="master" class="page card"><h2>マスター管理</h2><div class="grid"><input placeholder="作業員追加"><input placeholder="取引先追加"><input placeholder="現場追加"></div><p class="small">次回、ここを本格保存にします。</p></section></div></div>
<script>
var currentRole='作業員', currentName='';
function qs(k){return new URLSearchParams(location.search).get(k)}
function showErr(t){var e=document.getElementById('err');e.textContent=t;e.style.display='block'}
function login(){var n=document.getElementById('name').value.trim();var r=document.getElementById('role').value;var p=document.getElementById('pass').value;document.getElementById('err').style.display='none';if(!n)return showErr('名前を入力してください');if(r==='管理者'&&p!=='1111')return showErr('管理者パスワードが違います');currentName=n;currentRole=r;startApp()}
function startApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('who').textContent='ログイン中：'+currentName+'（'+currentRole+'）';document.getElementById('worker').value=currentName;renderDailyList()}
function logout(){sessionStorage.removeItem('kensetsu_auto');location.href='kensetsu.html'}
function pg(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');if(id==='admin')renderDailyList()}
function ymd(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}
document.getElementById('d').value=ymd();
function saveDaily(){var arr=JSON.parse(localStorage.getItem('kensetsu_daily_reports')||'[]');arr.unshift({id:Date.now(),date:d.value,worker:worker.value,client:client.value,site:site.value,work:work.value,start:start.value,end:end.value,break:document.getElementById('break').value,ot:ot.value,nin:nin.value,createdBy:currentName,createdAt:new Date().toLocaleString()});localStorage.setItem('kensetsu_daily_reports',JSON.stringify(arr));alert('保存しました');renderDailyList()}
function renderDailyList(){var arr=JSON.parse(localStorage.getItem('kensetsu_daily_reports')||'[]');var box=document.getElementById('dailyList');if(!box)return;if(!arr.length){box.innerHTML='<p class="small">日報はまだありません。</p>';return}box.innerHTML='<table class="table"><tr><th>日付</th><th>作業員</th><th>取引先</th><th>現場</th><th>人工</th><th>作業内容</th></tr>'+arr.map(x=>'<tr><td>'+x.date+'</td><td>'+x.worker+'</td><td>'+x.client+'</td><td>'+x.site+'</td><td>'+x.nin+'</td><td>'+x.work+'</td></tr>').join('')+'</table>'}
(function(){try{var auth=JSON.parse(localStorage.getItem('fg_portal_auth')||'null');var fromMain=qs('from')==='main'||(auth&&auth.from==='main'&&auth.target==='kensetsu');if(fromMain){currentName=(auth&&auth.name)||'藤原';currentRole='管理者';document.getElementById('name').value=currentName;document.getElementById('role').value='管理者';document.getElementById('pass').value='1111';startApp();}}catch(e){}})();
</script></body></html>
