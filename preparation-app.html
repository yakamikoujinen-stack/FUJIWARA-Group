<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6f3d8f">
<title>準備アプリ｜イベント別チェックリスト v1.1</title>
<style>
:root{
  --main:#6f3d8f;--main2:#9b65b7;--pale:#f5eef9;--gold:#b88418;
  --text:#2c2430;--sub:#75677c;--line:#dfd2e5;--ok:#16864b;--danger:#c83d4c;
  --shadow:0 8px 24px rgba(62,36,73,.10)
}
*{box-sizing:border-box}
body{margin:0;background:#f7f4f8;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;padding:14px 14px 12px;box-shadow:0 4px 14px rgba(50,20,65,.22)}
.top{max-width:1000px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}
h1{font-size:21px;margin:0}.sub{font-size:12px;opacity:.9;margin-top:3px}.back{background:rgba(255,255,255,.18);color:#fff}
.wrap{max-width:1000px;margin:auto;padding:14px 12px 100px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid #cfc1d6;border-radius:11px;padding:11px;background:#fff;color:var(--text);font-size:16px}
textarea{min-height:70px;resize:vertical}
.grid2,.grid3,.grid4{display:grid;gap:9px}.grid2{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(4,1fr)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.primary{background:var(--main);color:#fff}.gold{background:var(--gold);color:#fff}.ghost{background:#eee8f1;color:#5f4a6d}.danger{background:#fbe7ea;color:var(--danger)}.ok{background:#e2f5ea;color:var(--ok)}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.event-list{display:grid;gap:9px}
.event-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.event-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.event-title{font-size:16px;font-weight:900}.event-meta{font-size:12px;color:var(--sub);line-height:1.6;margin-top:4px}
.progress{height:9px;border-radius:99px;background:#eee7f1;overflow:hidden;margin-top:8px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--main),#c294d8)}
.category-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.category{border:1px solid var(--line);background:#fff;color:#5c4668}
.category.active{background:var(--main);color:#fff;border-color:var(--main)}
.category.linked{background:#e2f5ea;color:#126d40;border:2px solid #16864b;box-shadow:0 0 0 2px rgba(22,134,75,.08) inset}
.category.linked::after{content:"  ✓ メイン反映";font-size:10px;font-weight:900}
.item-row{display:grid;grid-template-columns:42px minmax(135px,1fr) 82px minmax(100px,1fr) 48px;gap:7px;align-items:center;border-bottom:1px solid #eee7f1;padding:9px 0}
.item-row.done .item-name{text-decoration:line-through;color:#8a7d90}
.check{width:28px;height:28px;accent-color:var(--ok)}
.item-name{font-weight:800}.small-input{padding:9px;font-size:15px}
.delete{background:#f8e4e7;color:var(--danger);padding:9px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sum{background:#faf7fc;border:1px solid var(--line);border-radius:13px;padding:12px}.sum .k{font-size:12px;color:var(--sub)}.sum .v{font-size:21px;font-weight:900;margin-top:4px}
.empty{text-align:center;color:var(--sub);padding:18px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#efe5f6;color:#5b2a86;font-size:12px;font-weight:900;margin:3px}
.hidden{display:none!important}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:5px;background:#fff;border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom))}
.footer button{flex:1;font-size:12px;padding:10px 5px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#241b28;color:#fff;padding:10px 15px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1}
@media(max-width:700px){
 .grid2,.grid3,.grid4{grid-template-columns:1fr}
 .item-row{grid-template-columns:38px 1fr 70px 45px}
 .item-row .checker{grid-column:2/4}
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
<header><div class="top"><div><h1>📦 準備アプリ</h1><div class="sub">担当：繁充｜イベント別・積込みチェックリスト v1.1</div></div><button class="back" onclick="goBack()">← 戻る</button></div></header>

<div class="wrap">
<section class="card" id="eventListSec">
  <h2>イベント別チェックリスト</h2>
  <div class="note">イベントごとに内容とチェック状態を別々に保存します。</div>
  <div class="toolbar">
    <button class="primary" onclick="newEvent()">＋ 新しいイベントを作る</button>
  </div>
  <div id="eventList" class="event-list" style="margin-top:12px"></div>
  <h2 style="margin-top:18px">メインアプリから共有されたイベント</h2>
  <div id="sharedEventList" class="event-list"></div>
</section>

<div id="editor" class="hidden">
<section class="card">
<h2>① イベント情報</h2>
<input type="hidden" id="eventId">
<div class="grid3">
<div><label>イベント名</label><input id="eventName" placeholder="例：柳まつり"></div>
<div><label>日付</label><input id="eventDate" type="date"></div>
<div><label>積込み担当</label><input id="staffName" value="繁充"></div>
</div>
<div class="grid2" style="margin-top:10px">
<div><label>会場</label><input id="place" placeholder="例：柳まつり会場"></div>
<div><label>車両</label><input id="vehicle" placeholder="例：2号車"></div>
</div>
<div style="margin-top:10px"><label>メモ</label><textarea id="eventMemo" placeholder="集合時間・注意事項など"></textarea></div>
<div class="toolbar">
<button class="primary" onclick="saveCurrentEvent()">イベント情報を保存</button>
<button class="ghost" onclick="closeEditor()">イベント一覧へ戻る</button>
<button class="danger" onclick="deleteCurrentEvent()">このイベントを削除</button>
</div>
</section>

<section class="card">
<h2>② 出店カテゴリー</h2>
<div class="note">メインアプリの出店ネタは「✓ メイン反映」で自動表示されます。必要に応じて手動カテゴリーも追加できます。</div>
<div class="category-grid" id="categoryGrid"></div>
<div class="toolbar">
<button class="gold" onclick="addSelectedCategories()">選択カテゴリーを追加</button>
<button class="ghost" onclick="clearCategorySelection()">選択を外す</button>
</div>
</section>

<section class="card">
<h2>③ 共通備品</h2>
<div id="commonBadges"></div>
<div class="toolbar">
<button class="ghost" onclick="addAllCommon()">共通備品をこのイベントへ追加</button>
</div>
</section>

<section class="card">
<h2>④ 項目を手動追加</h2>
<div class="grid4">
<div><label>項目名</label><input id="manualName" placeholder="例：予備トング"></div>
<div><label>数量</label><input id="manualQty" type="number" min="0" value="1"></div>
<div><label>確認者</label><input id="manualChecker" placeholder="例：繁充"></div>
<div><label>分類</label><input id="manualCategory" placeholder="例：共通"></div>
</div>
<div class="toolbar"><button class="primary" onclick="addManualItem()">＋ 項目追加</button></div>
</section>

<section class="card">
<h2>⑤ 積込みチェックリスト</h2>
<div id="summary" class="summary"></div>
<div id="items"></div>
<div class="toolbar">
<button class="ok" onclick="checkAll()">すべてチェック</button>
<button class="ghost" onclick="uncheckAll()">チェックを全部外す</button>
</div>
</section>
</div>
</div>

<div class="footer">
<button class="ghost" onclick="showEventList()">📅 イベント一覧</button>
<button class="primary" onclick="saveCurrentEvent()">💾 保存</button>
<button class="gold" onclick="newEvent()">＋ 新規</button>
</div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY="fujiwara_preparation_events_v2";
const OLD_KEY="fujiwara_preparation_app_v1";

const CATEGORY_ITEMS={
"チーズハットグ":[["ガス台",1],["ガスボンベ",2],["油",1],["チーズ",1],["ソーセージ",1],["ミックス粉",1],["パン粉",1],["ケチャップ",1],["マスタード",1],["串",1],["袋",1]],
"ポテト":[["フライヤー",1],["ガス台",1],["ガスボンベ",2],["油",1],["冷凍ポテト",1],["塩",1],["カップ",1],["トング",2]],
"牛串":[["焼き台",1],["ガスボンベ",2],["牛串",1],["タレ",1],["塩こしょう",1],["トング",2],["容器",1]],
"からあげ":[["フライヤー",1],["ガス台",1],["ガスボンベ",2],["油",1],["鶏肉",1],["唐揚げ粉",1],["トング",2],["容器",1]],
"かき氷":[["かき氷機",1],["ブロック氷",1],["シロップ",1],["カップ",1],["スプーン",1],["練乳",1],["延長コード",1]],
"いか焼き":[["焼き台",1],["ガスボンベ",2],["いか",1],["タレ",1],["串",1],["トング",2],["容器",1]],
"カステラ":[["カステラ機",1],["ガスボンベ",2],["カステラ粉",1],["卵",1],["砂糖",1],["油",1],["袋",1],["ピック",1]],
"りんご飴":[["りんご",1],["砂糖",1],["水あめ",1],["食紅",1],["串",1],["袋",1],["鍋",1],["温度計",1]]
};
const COMMON=[["テント",1],["机",2],["イス",2],["発電機",1],["延長コード",2],["消火器",1],["ゴミ袋",1],["手袋",1],["キッチンペーパー",1],["看板",1],["釣銭",1]];

let db={events:[]};
let selectedCategories=new Set();
let currentId=null;

function uid(){return "ev_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function get(id){return document.getElementById(id)}
function val(id){return get(id)?.value??""}
function toast(msg){const t=get("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}

function loadDB(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(saved&&Array.isArray(saved.events)) db=saved;
  }catch(e){}
  migrateOldData();
}
function migrateOldData(){
  if(db.events.length) return;
  try{
    const old=JSON.parse(localStorage.getItem(OLD_KEY)||"null");
    if(!old) return;
    const source=Array.isArray(old.history)?old.history:[];
    source.forEach((r,i)=>{
      db.events.push({
        id:uid(),name:r.eventName||r.name||("旧イベント "+(i+1)),date:r.eventDate||r.date||"",
        staff:r.staffName||r.staff||"繁充",place:r.place||"",vehicle:r.vehicle||"",
        memo:r.memo||"",items:Array.isArray(r.items)?r.items:[],updatedAt:Date.now()-i
      })
    });
    if(source.length){persist();toast("以前の保存履歴を引き継ぎました")}
  }catch(e){}
}

function blankEvent(){
 return {id:uid(),name:"",date:today(),staff:"繁充",place:"",vehicle:"",memo:"",items:[],updatedAt:Date.now()}
}
function currentEvent(){return db.events.find(e=>e.id===currentId)}

function renderEventList(){
 const box=get("eventList");
 const list=[...db.events].sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.updatedAt||0)-(a.updatedAt||0));
 if(!list.length){box.innerHTML='<div class="empty">まだイベントがありません。<br>「新しいイベントを作る」から始めてください。</div>';return}
 box.innerHTML=list.map(e=>{
   const total=e.items?.length||0,done=(e.items||[]).filter(x=>x.done).length,pct=total?Math.round(done/total*100):0;
   return `<div class="event-card">
    <div class="event-head">
      <div><div class="event-title">${esc(e.name||"名称未入力")}</div>
      <div class="event-meta">${esc(e.date||"日付未入力")}｜${esc(e.place||"会場未入力")}</div></div>
      <button class="primary" onclick="openEvent('${e.id}')">開く</button>
    </div>
    <div class="event-meta">進捗 ${done}/${total}（${pct}%）</div><div class="progress"><span style="width:${pct}%"></span></div>
   </div>`
 }).join("")
}
function linkedCategoriesForCurrentEvent(){
 const e=currentEvent(); if(!e)return new Set();
 const saved=Array.isArray(e.sharedCategories)?e.sharedCategories:[];
 const itemCats=(e.items||[]).filter(x=>x.fromMainCategory).map(x=>x.category).filter(Boolean);
 return new Set([...saved,...itemCats]);
}
function renderCategories(){
 const linked=linkedCategoriesForCurrentEvent();
 get("categoryGrid").innerHTML=Object.keys(CATEGORY_ITEMS).map(c=>{
   const cls=["category",selectedCategories.has(c)?"active":"",linked.has(c)?"linked":""].filter(Boolean).join(" ");
   return `<button class="${cls}" onclick="toggleCategory('${c}')">${esc(c)}</button>`;
 }).join("");
 get("commonBadges").innerHTML=COMMON.map(x=>`<span class="badge">${esc(x[0])} × ${x[1]}</span>`).join("");
}
function toggleCategory(c){selectedCategories.has(c)?selectedCategories.delete(c):selectedCategories.add(c);renderCategories()}
function clearCategorySelection(){selectedCategories.clear();renderCategories()}

function newEvent(){
 const e=blankEvent();db.events.push(e);currentId=e.id;persist();openEvent(e.id);toast("新しいイベントを作りました")
}
function openEvent(id){
 currentId=id;const e=currentEvent();if(!e)return;
 get("eventId").value=e.id;get("eventName").value=e.name||"";get("eventDate").value=e.date||"";
 get("staffName").value=e.staff||"繁充";get("place").value=e.place||"";get("vehicle").value=e.vehicle||"";get("eventMemo").value=e.memo||"";
 get("eventListSec").classList.add("hidden");get("editor").classList.remove("hidden");
 selectedCategories.clear();renderCategories();renderItems();window.scrollTo({top:0,behavior:"smooth"})
}
function closeEditor(){saveCurrentEvent(false);showEventList()}
function showEventList(){get("editor").classList.add("hidden");get("eventListSec").classList.remove("hidden");renderEventList();window.scrollTo({top:0,behavior:"smooth"})}
function saveCurrentEvent(show=true){
 const e=currentEvent();if(!e){if(show)toast("先にイベントを作ってください");return}
 e.name=val("eventName").trim();e.date=val("eventDate");e.staff=val("staffName").trim();e.place=val("place").trim();e.vehicle=val("vehicle").trim();e.memo=val("eventMemo").trim();e.updatedAt=Date.now();
 persist();renderEventList();if(show)toast("このイベントを保存しました")
}
function deleteCurrentEvent(){
 const e=currentEvent();if(!e)return;
 if(!confirm(`「${e.name||"名称未入力"}」を削除しますか？`))return;
 db.events=db.events.filter(x=>x.id!==e.id);persist();currentId=null;showEventList();toast("イベントを削除しました")
}

function addItem(name,qty,category,checker=""){
 const e=currentEvent();if(!e)return;
 const exists=e.items.find(x=>x.name===name&&x.category===category);
 if(exists){exists.qty=Number(exists.qty||0)+Number(qty||0)}
 else e.items.push({id:uid(),name,qty:Number(qty||1),category,checker,done:false});
 e.updatedAt=Date.now()
}
function addSelectedCategories(){
 if(!selectedCategories.size){toast("カテゴリーを選んでください");return}
 selectedCategories.forEach(c=>CATEGORY_ITEMS[c].forEach(x=>addItem(x[0],x[1],c)));
 selectedCategories.clear();persist();renderCategories();renderItems();toast("カテゴリーの準備品を追加しました")
}
function addAllCommon(){COMMON.forEach(x=>addItem(x[0],x[1],"共通備品"));persist();renderItems();toast("共通備品を追加しました")}
function addManualItem(){
 const name=val("manualName").trim();if(!name){toast("項目名を入力してください");return}
 addItem(name,Number(val("manualQty")||1),val("manualCategory").trim()||"手動追加",val("manualChecker").trim());
 persist();get("manualName").value="";get("manualQty").value=1;renderItems();toast("項目を追加しました")
}
function updateItem(id,field,value){
 const e=currentEvent(),it=e?.items.find(x=>x.id===id);if(!it)return;
 it[field]=field==="qty"?Number(value||0):field==="done"?Boolean(value):value;e.updatedAt=Date.now();persist();renderItems()
}
function deleteItem(id){const e=currentEvent();if(!e)return;e.items=e.items.filter(x=>x.id!==id);persist();renderItems()}
function checkAll(){const e=currentEvent();if(!e)return;e.items.forEach(x=>x.done=true);persist();renderItems()}
function uncheckAll(){const e=currentEvent();if(!e)return;e.items.forEach(x=>x.done=false);persist();renderItems()}

function renderItems(){
 const e=currentEvent();const box=get("items");if(!e)return;
 const items=e.items||[],done=items.filter(x=>x.done).length,pct=items.length?Math.round(done/items.length*100):0;
 get("summary").innerHTML=`<div class="sum"><div class="k">全項目</div><div class="v">${items.length}</div></div><div class="sum"><div class="k">積込み済み</div><div class="v">${done}</div></div><div class="sum"><div class="k">残り</div><div class="v">${items.length-done}</div></div><div class="sum"><div class="k">進捗</div><div class="v">${pct}%</div></div>`;
 if(!items.length){box.innerHTML='<div class="empty">カテゴリー・共通備品・手動追加から項目を入れてください。</div>';return}
 const groups={};items.forEach(x=>(groups[x.category||"その他"]??=[]).push(x));
 box.innerHTML=Object.entries(groups).map(([cat,rows])=>`<div style="margin-top:15px"><h3 style="font-size:15px;margin:0 0 4px">${esc(cat)}</h3>${rows.map(it=>`
 <div class="item-row ${it.done?"done":""}">
  <input class="check" type="checkbox" ${it.done?"checked":""} onchange="updateItem('${it.id}','done',this.checked)">
  <div class="item-name">${esc(it.name)}</div>
  <input class="small-input" type="number" min="0" value="${Number(it.qty||0)}" onchange="updateItem('${it.id}','qty',this.value)">
  <input class="small-input checker" value="${esc(it.checker||"")}" placeholder="確認者" onchange="updateItem('${it.id}','checker',this.value)">
  <button class="delete" onclick="deleteItem('${it.id}')">×</button>
 </div>`).join("")}</div>`).join("")
}
function goBack(){if(!get("editor").classList.contains("hidden"))showEventList();else if(history.length>1)history.back();else location.href="manager-app.html"}


const PREPARATION_FB_PATH="fujiwara/preparation_shared_events";
let sharedEvents={};
function splitMenus(text){ return String(text||'').split(/[・、,\/\n]+/).map(x=>x.trim()).filter(Boolean); }
const CATEGORY_ALIASES={
 'チーズハットグ':['チーズハットグ','ハットグ'],
 'ポテト':['ポテト','フライドポテト'],
 '牛串':['牛串','牛肉串'],
 'からあげ':['からあげ','唐揚げ','唐揚'],
 'かき氷':['かき氷','カキ氷','かきごおり'],
 'いか焼き':['いか焼き','イカ焼き','いか焼','イカ焼'],
 'カステラ':['カステラ','ベビーカステラ'],
 'りんご飴':['りんご飴','リンゴ飴','りんごあめ']
};
function categoryFromMenu(name){
 const raw=String(name||'').replace(/[\s　]+/g,'');
 return Object.keys(CATEGORY_ITEMS).find(k=>(CATEGORY_ALIASES[k]||[k]).some(a=>raw.includes(String(a).replace(/[\s　]+/g,''))))||null;
}
function categoriesFromShared(src){
 const direct=Array.isArray(src.categories)?src.categories.filter(c=>CATEGORY_ITEMS[c]):[];
 if(direct.length)return [...new Set(direct)];
 return [...new Set(splitMenus(src.itemsText).map(categoryFromMenu).filter(Boolean))];
}
function renderSharedEvents(){
 const box=get("sharedEventList"); if(!box)return;
 const importedIds=new Set((db.events||[]).map(e=>String(e.sourceMainId||'')).filter(Boolean));
 const list=Object.values(sharedEvents||{}).filter(e=>!importedIds.has(String(e.mainId||e.id||''))).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
 if(!list.length){box.innerHTML='<div class="empty">新しく共有されたイベントはありません。</div>';return;}
 box.innerHTML=list.map(e=>{const cats=categoriesFromShared(e);return `<div class="event-card"><div class="event-head"><div><div class="event-title">${esc(e.name||'名称未入力')}</div><div class="event-meta">${esc(e.date||'日付未入力')}｜${esc(e.place||'会場未入力')}<br>出店ネタ：${esc(e.itemsText||'未設定')}<br>準備カテゴリー：${esc(cats.join('・')||'該当なし')}</div></div><button class="gold" onclick="importSharedEvent('${esc(String(e.mainId||e.id))}')">準備表を作る</button></div></div>`}).join('');
}
function importSharedEvent(mainId){
 const src=Object.values(sharedEvents).find(x=>String(x.mainId||x.id)===String(mainId)); if(!src)return;
 let e=db.events.find(x=>String(x.sourceMainId||'')===String(mainId));
 if(!e){ e=blankEvent(); e.sourceMainId=String(mainId); db.events.push(e); }
 e.name=src.name||e.name; e.date=src.date||e.date; e.place=src.place||e.place; e.vehicle=src.vehicle||e.vehicle; e.memo=src.memo||e.memo; e.staff=(Array.isArray(src.staff)&&src.staff.length?src.staff.join('・'):'繁充');
 const cats=categoriesFromShared(src);
 // メインアプリ由来のカテゴリーだけを最新状態へ同期し、手動追加・共通備品・チェック状態は残します。
 const oldByKey={}; (e.items||[]).forEach(it=>{oldByKey[(it.category||'')+'||'+(it.name||'')]=it;});
 e.items=(e.items||[]).filter(it=>!it.fromMainCategory);
 cats.forEach(c=>CATEGORY_ITEMS[c].forEach(x=>{
   const key=c+'||'+x[0], old=oldByKey[key];
   e.items.push({id:(old&&old.id)||uid(),name:x[0],qty:Number((old&&old.qty)||x[1]||1),category:c,checker:(old&&old.checker)||'',done:!!(old&&old.done),fromMainCategory:true});
 }));
 e.sharedCategories=cats; e.updatedAt=Date.now(); persist(); renderSharedEvents(); openEvent(e.id); toast('出店ネタをカテゴリーと準備品へ反映しました');
}
function addItemToEvent(e,name,qty,category){
 const exists=(e.items||[]).find(x=>x.name===name&&x.category===category);
 if(exists)return; e.items=e.items||[]; e.items.push({id:uid(),name,qty:Number(qty||1),category,checker:'',done:false});
}
function toArray(v){
 if(Array.isArray(v))return v.filter(Boolean);
 if(v&&typeof v==='object')return Object.values(v).filter(Boolean);
 return [];
}
function mainEventCategories(ev,invItems){
 const found=[];
 const add=(name)=>{
  const c=categoryFromMenu(name);
  if(c&&!found.includes(c))found.push(c);
 };
 splitMenus(ev.itemsText||ev.netaText||ev.menuText||'').forEach(add);
 toArray(ev.categories||ev.netas||ev.menuCategories).forEach(add);
 toArray(ev.items).forEach(id=>{
  const it=invItems.find(x=>String(x.id)===String(id));
  if(it){add(it.cat);add(it.name);}
  else if(typeof id==='string')add(id);
 });
 return found;
}
function normalizeMainEvents(root){
 const events=toArray(root.events);
 const invItems=toArray(root.invItems);
 const out={};
 events.forEach((ev,index)=>{
  const id=String(ev.id||ev.eventId||('main_'+index));
  const cats=mainEventCategories(ev,invItems);
  out[id]={
   id,mainId:id,
   name:ev.name||ev.eventName||'',
   date:ev.date||ev.startDate||'',
   place:ev.place||ev.location||'',
   vehicle:ev.vehicle||'',
   memo:ev.memo||ev.note||'',
   staff:ev.staff||ev.staffs||[],
   categories:cats,
   itemsText:cats.join('・') || ev.itemsText || ''
  };
 });
 return out;
}
