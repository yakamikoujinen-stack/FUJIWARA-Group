<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手書きメモ">
<title>FUJIWARA 手書きメモ</title>
<style>
:root{
  --gold:#c89519;
  --gold2:#f3c44f;
  --ink:#14213d;
  --sub:#68738a;
  --line:#dfe5ef;
  --bg:#f4f7fb;
  --card:#ffffff;
  --danger:#d83a4e;
  --green:#1f9d66;
  --blue:#1677d2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
header{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;
  background:linear-gradient(135deg,#fffaf0,#ffffff);
  border-bottom:1px solid #eadcb7;
  box-shadow:0 5px 18px rgba(43,55,80,.08)
}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#fff;box-shadow:0 6px 14px rgba(200,149,25,.3)}
h1{font-size:22px;margin:0;color:#8b6200}
.sub{font-size:12px;color:var(--sub);margin-top:3px}
.status{font-size:12px;font-weight:800;color:var(--green);white-space:nowrap}

.wrap{max-width:1180px;margin:0 auto;padding:14px}
.toolbar,.sheet-card{
  background:var(--card);border:1px solid #e9edf4;border-radius:20px;
  box-shadow:0 10px 28px rgba(48,61,89,.08)
}
.toolbar{padding:12px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;margin-bottom:12px}
.tool{
  min-height:58px;border:1px solid var(--line);background:#fff;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:12px;font-weight:900;color:var(--ink)
}
.tool span{font-size:22px}
.tool.active{outline:3px solid #ffe7a7;background:#fff9e8;border-color:#e5b83d}
.tool.danger{color:var(--danger)}
.tool.green{color:var(--green)}
.tool.blue{color:var(--blue)}

.controls{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
  padding:12px;margin-bottom:12px;background:#fff;border:1px solid #e9edf4;border-radius:18px
}
.control label{display:block;font-size:12px;font-weight:900;color:var(--sub);margin-bottom:6px}
.control input,.control select{
  width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:16px
}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.color{
  width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #cfd6e1;
}
.color.selected{box-shadow:0 0 0 3px #f0ba2b}

.sheet-card{padding:10px}
.canvas-wrap{
  position:relative;width:100%;height:min(68vh,820px);min-height:460px;
  border-radius:16px;overflow:hidden;border:1px solid #dfe5ef;
  background:
    linear-gradient(to right,rgba(69,118,170,.08) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(69,118,170,.08) 1px,transparent 1px),
    #fff;
  background-size:28px 28px;
  touch-action:none
}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.empty{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  color:#9aa5b7;font-weight:800;text-align:center;line-height:1.8
}
.note-title{
  display:flex;gap:10px;align-items:center;margin:0 0 10px
}
.note-title input{
  flex:1;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:17px;font-weight:800
}
.note-title button{
  height:46px;border:0;border-radius:12px;padding:0 16px;background:var(--gold);color:#fff;font-weight:900
}
.footer-note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.7}

.share-card{margin-top:12px;padding:14px;background:#fff;border:1px solid #e9edf4;border-radius:20px;box-shadow:0 10px 28px rgba(48,61,89,.08)}.share-title{font-size:18px;font-weight:950;color:#7b4b8f;margin-bottom:8px}.share-note{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:12px}.share-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.share-btn{min-height:58px;border:0;border-radius:15px;font-size:16px;font-weight:950}.share-main{background:linear-gradient(90deg,#ee7aa2,#b76ae6);color:#fff}.share-copy{background:#eef5ff;color:#145ca8;border:1px solid #cfe0f6}
@media(max-width:800px){
  .toolbar{grid-template-columns:repeat(4,1fr)}
  .controls{grid-template-columns:1fr}
  .share-actions{grid-template-columns:1fr}.canvas-wrap{height:62vh;min-height:430px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">✍️</div>
    <div>
      <h1>FUJIWARA 手書きメモ</h1>
      <div class="sub">iPad・iPhone対応／自動保存</div>
    </div>
  </div>
  <div class="status" id="saveStatus">保存済み</div>
</header>

<main class="wrap">
  <div class="note-title">
    <input id="titleInput" placeholder="メモのタイトル">
    <button onclick="saveNow()">保存</button>
  </div>

  <section class="toolbar">
    <button class="tool active" id="penBtn" onclick="setMode('pen')"><span>✒️</span>ペン</button>
    <button class="tool" id="markerBtn" onclick="setMode('marker')"><span>🖍️</span>マーカー</button>
    <button class="tool" id="eraserBtn" onclick="setMode('eraser')"><span>🧽</span>消しゴム</button>
    <button class="tool blue" onclick="undo()"><span>↩️</span>元に戻す</button>
    <button class="tool blue" onclick="redo()"><span>↪️</span>やり直し</button>
    <button class="tool green" onclick="downloadPNG()"><span>🖼️</span>画像保存</button>
    <button class="tool green" onclick="printMemo()"><span>🖨️</span>印刷</button>
    <button class="tool danger" onclick="clearCanvas()"><span>🗑️</span>全消去</button>
  </section>

  <section class="controls">
    <div class="control">
      <label>ペンの太さ</label>
      <input id="sizeRange" type="range" min="1" max="40" value="5">
    </div>
    <div class="control">
      <label>ペンの色</label>
      <div class="colors" id="colorList">
        <button class="color selected" data-color="#111111" style="background:#111111"></button>
        <button class="color" data-color="#e53935" style="background:#e53935"></button>
        <button class="color" data-color="#1565c0" style="background:#1565c0"></button>
        <button class="color" data-color="#2e7d32" style="background:#2e7d32"></button>
        <button class="color" data-color="#8e24aa" style="background:#8e24aa"></button>
        <button class="color" data-color="#ef6c00" style="background:#ef6c00"></button>
      </div>
    </div>
    <div class="control">
      <label>背景</label>
      <select id="paperStyle" onchange="changePaper()">
        <option value="grid">方眼</option>
        <option value="line">横罫線</option>
        <option value="plain">白紙</option>
      </select>
    </div>
  </section>

  <section class="sheet-card">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div class="empty" id="emptyHint">ここに指やApple Pencilで<br>手書きできます</div>
    </div>
  </section>

  <section class="share-card">
    <div class="share-title">🤖 相棒へ送る</div>
    <div class="share-note">「相棒へ送る」を押すとiPadの共有画面が開きます。そこでChatGPTを選ぶと、手書きメモ画像を添付して送れます。</div>
    <div class="share-actions">
      <button class="share-btn share-main" onclick="shareToPartner()">🤖 相棒へ送る</button>
      <button class="share-btn share-copy" onclick="copyMessage()">📋 相談文をコピー</button>
    </div>
  </section>

  <div class="footer-note">
    書いた内容はこの端末に自動保存されます。<br>
    「相棒へ送る」からChatGPTへ共有できます。
  </div>
</main>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const hint = document.getElementById('emptyHint');
const titleInput = document.getElementById('titleInput');
const sizeRange = document.getElementById('sizeRange');
const saveStatus = document.getElementById('saveStatus');

let mode = 'pen';
let color = '#111111';
let drawing = false;
let last = null;
let undoStack = [];
let redoStack = [];
let saveTimer = null;
const STORAGE_KEY = 'fujiwara_handwrite_memo_v1';

function resizeCanvas(){
  const old = canvas.toDataURL();
  const rect = wrap.getBoundingClientRect();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(old && old !== 'data:,'){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img,0,0,rect.width,rect.height);
    img.src = old;
  }
}

function getPoint(e){
  const rect = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return {x:p.clientX-rect.left,y:p.clientY-rect.top};
}

function pointerDown(e){
  e.preventDefault();
  drawing = true;
  last = getPoint(e);
  pushUndo();
  ctx.beginPath();
  ctx.moveTo(last.x,last.y);
}

function pointerMove(e){
  if(!drawing) return;
  e.preventDefault();
  const p = getPoint(e);
  ctx.lineCap='round';
  ctx.lineJoin='round';
  if(mode==='eraser'){
    ctx.globalCompositeOperation='destination-out';
    ctx.globalAlpha=1;
    ctx.lineWidth=Math.max(12,Number(sizeRange.value)*2.2);
  }else{
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=mode==='marker'?0.28:1;
    ctx.strokeStyle=color;
    ctx.lineWidth=mode==='marker'?Math.max(12,Number(sizeRange.value)*2.8):Number(sizeRange.value);
  }
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
  last=p;
  hint.style.display='none';
  markDirty();
}

function pointerUp(e){
  if(!drawing) return;
  drawing=false;
  ctx.closePath();
  ctx.globalAlpha=1;
  scheduleSave();
}

function setMode(next){
  mode=next;
  ['pen','marker','eraser'].forEach(n=>document.getElementById(n+'Btn').classList.toggle('active',n===next));
}

document.querySelectorAll('.color').forEach(btn=>{
  btn.addEventListener('click',()=>{
    color=btn.dataset.color;
    document.querySelectorAll('.color').forEach(x=>x.classList.remove('selected'));
    btn.classList.add('selected');
    setMode('pen');
  });
});

function snapshot(){
  return canvas.toDataURL('image/png');
}
function restore(data){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!data) return;
  const img=new Image();
  img.onload=()=>{
    const rect=canvas.getBoundingClientRect();
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    ctx.drawImage(img,0,0,rect.width,rect.height);
    hint.style.display='none';
  };
  img.src=data;
}
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length>30) undoStack.shift();
  redoStack=[];
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(snapshot());
  restore(undoStack.pop());
  scheduleSave();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
  scheduleSave();
}
function clearCanvas(){
  if(!confirm('手書きを全部消しますか？')) return;
  pushUndo();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  hint.style.display='grid';
  scheduleSave();
}
function markDirty(){
  saveStatus.textContent='編集中…';
  saveStatus.style.color='#d67b00';
}
function scheduleSave(){
  clearTimeout(saveTimer);
  markDirty();
  saveTimer=setTimeout(saveNow,500);
}
function saveNow(){
  const data={
    title:titleInput.value,
    image:snapshot(),
    paper:document.getElementById('paperStyle').value,
    updatedAt:new Date().toISOString()
  };
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  saveStatus.textContent='保存済み';
  saveStatus.style.color='#1f9d66';
}
function load(){
  try{
    const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(!data) return;
    titleInput.value=data.title||'';
    document.getElementById('paperStyle').value=data.paper||'grid';
    changePaper();
    if(data.image) restore(data.image);
  }catch(e){}
}
function changePaper(){
  const v=document.getElementById('paperStyle').value;
  if(v==='plain'){
    wrap.style.background='#fff';
  }else if(v==='line'){
    wrap.style.background='linear-gradient(to bottom,rgba(69,118,170,.12) 1px,transparent 1px),#fff';
    wrap.style.backgroundSize='100% 32px';
  }else{
    wrap.style.background='linear-gradient(to right,rgba(69,118,170,.08) 1px,transparent 1px),linear-gradient(to bottom,rgba(69,118,170,.08) 1px,transparent 1px),#fff';
    wrap.style.backgroundSize='28px 28px';
  }
  scheduleSave();
}
function downloadPNG(){
  const out=document.createElement('canvas');
  const rect=canvas.getBoundingClientRect();
  out.width=Math.round(rect.width*2);
  out.height=Math.round(rect.height*2);
  const o=out.getContext('2d');
  o.scale(2,2);
  o.fillStyle='#fff';
  o.fillRect(0,0,rect.width,rect.height);
  o.drawImage(canvas,0,0,rect.width,rect.height);
  const a=document.createElement('a');
  const title=(titleInput.value||'手書きメモ').replace(/[\\/:*?"<>|]/g,'_');
  a.download=title+'.png';
  a.href=out.toDataURL('image/png');
  a.click();
}
function exportBlob(){
  return new Promise(resolve=>{
    const out=document.createElement('canvas');
    const rect=canvas.getBoundingClientRect();
    out.width=Math.round(rect.width*2);out.height=Math.round(rect.height*2);
    const o=out.getContext('2d');o.scale(2,2);o.fillStyle='#fff';o.fillRect(0,0,rect.width,rect.height);o.drawImage(canvas,0,0,rect.width,rect.height);
    out.toBlob(resolve,'image/png',1);
  });
}
async function shareToPartner(){
  saveNow();
  const blob=await exportBlob();
  const title=(titleInput.value||'手書きメモ').replace(/[\\/:*?"<>|]/g,'_');
  const file=new File([blob],title+'.png',{type:'image/png'});
  const text=`相棒、この手書きメモを見て相談に乗って。タイトル：${titleInput.value||'手書きメモ'}`;
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:'FUJIWARA 手書きメモ',text,files:[file]});
    }else if(navigator.share){
      await navigator.share({title:'FUJIWARA 手書きメモ',text});
      downloadPNG();
      alert('画像も保存しました。ChatGPTで添付してください。');
    }else{
      downloadPNG();
      await navigator.clipboard.writeText(text);
      alert('画像を保存し、相談文をコピーしました。ChatGPTを開いて画像を添付してください。');
    }
  }catch(e){if(e.name!=='AbortError')alert('共有できませんでした。画像保存を使って送ってください。');}
}
async function copyMessage(){
  const text=`相棒、この手書きメモを見て相談に乗って。タイトル：${titleInput.value||'手書きメモ'}`;
  try{await navigator.clipboard.writeText(text);alert('相談文をコピーしました');}catch(e){alert(text);}
}
function printMemo(){
  const img=snapshot();
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>${titleInput.value||'手書きメモ'}</title><style>body{margin:20px;font-family:sans-serif}h1{font-size:20px}img{max-width:100%;border:1px solid #ddd}</style></head><body><h1>${titleInput.value||'手書きメモ'}</h1><img src="${img}" onload="window.print()"></body></html>`);
  w.document.close();
}

canvas.addEventListener('pointerdown',pointerDown);
canvas.addEventListener('pointermove',pointerMove);
canvas.addEventListener('pointerup',pointerUp);
canvas.addEventListener('pointercancel',pointerUp);
canvas.addEventListener('pointerleave',pointerUp);
titleInput.addEventListener('input',scheduleSave);
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(resizeCanvas,150)});

resizeCanvas();
load();
</script>
</body>
</html>
