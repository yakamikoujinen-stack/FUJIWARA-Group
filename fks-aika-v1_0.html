<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIKA — 経営秘書</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface2: #f7f8fa;
  --border: #e0e4ea;
  --kon: #2c3e6b;
  --kon-lt: #4a62a0;
  --kon-bg: #e8eef8;
  --gold: #b8860b;
  --gold-lt: #d4af37;
  --gold-bg: #fdf8ec;
  --shu: #c8392b;
  --green: #1e8f55;
  --green-bg: #e6f7ef;
  --text: #1a1e24;
  --text-sub: #6a7280;
  --text-dim: #aab0bc;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.app-header {
  background: linear-gradient(135deg, var(--kon) 0%, #1a2848 100%);
  padding: 16px 16px 0;
  position: sticky; top: 0; z-index: 100;
}
.header-top { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; }
.back-btn { background: none; border: none; color: rgba(255,255,255,0.7); font-size: 20px; cursor: pointer; }
.aika-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #4a62a0, #2c3e6b);
  border: 2px solid var(--gold-lt);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 12px rgba(212,175,55,0.3);
}
.header-info { flex: 1; }
.header-name { font-family: 'Noto Serif JP', serif; font-size: 16px; font-weight: 700; color: #fff; }
.header-status { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3eb87a; margin-right: 4px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Tab */
.tab-nav { display: flex; }
.tab-btn {
  flex: 1; padding: 11px 6px; background: none; border: none;
  border-bottom: 2px solid transparent;
  color: rgba(255,255,255,0.45); font-size: 11px;
  font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: all 0.2s;
}
.tab-btn.active { color: var(--gold-lt); border-bottom-color: var(--gold-lt); }
.tab-btn .ti { display: block; font-size: 17px; margin-bottom: 3px; }

/* Pages */
.page { display: none; flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 30px; }
.page.active { display: block; }

/* Section label */
.sec-label { font-size: 10px; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; margin: 18px 0 10px; }
.sec-label:first-child { margin-top: 4px; }

/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }

/* Morning brief */
.brief-card {
  background: linear-gradient(135deg, #1a2848 0%, #2c3e6b 100%);
  border: 1px solid rgba(212,175,55,0.3);
  border-radius: 14px; padding: 18px; margin-bottom: 12px;
}
.brief-greeting { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 6px; letter-spacing: 0.1em; }
.brief-main { font-family: 'Noto Serif JP', serif; font-size: 15px; color: #fff; line-height: 1.7; margin-bottom: 14px; }
.brief-main b { color: var(--gold-lt); }
.brief-loading { color: rgba(255,255,255,0.4); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.dots span { animation: blink 1.4s infinite; display: inline-block; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

/* Analysis cards */
.analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.a-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.a-num { font-size: 20px; font-weight: 900; }
.a-label { font-size: 10px; color: var(--text-sub); margin-top: 3px; }
.a-trend { font-size: 10px; margin-top: 5px; }
.c-green { color: var(--green); }
.c-red { color: var(--shu); }
.c-gold { color: var(--gold); }
.c-kon { color: var(--kon-lt); }

/* Todo list */
.todo-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.todo-item:last-child { border-bottom: none; }
.todo-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border); flex-shrink: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; margin-top: 1px;
}
.todo-check.done { background: var(--green); border-color: var(--green); color: #fff; font-size: 12px; }
.todo-text { flex: 1; font-size: 13px; line-height: 1.5; }
.todo-text.done { color: var(--text-dim); text-decoration: line-through; }
.todo-tag {
  font-size: 9px; padding: 2px 7px; border-radius: 10px;
  display: inline-block; margin-top: 4px;
}
.tag-urgent { background: #fdecea; color: var(--shu); border: 1px solid #f0b0b4; }
.tag-normal { background: var(--kon-bg); color: var(--kon-lt); border: 1px solid #b0c8f0; }
.tag-check  { background: var(--gold-bg); color: var(--gold); border: 1px solid #e0c870; }
.todo-priority { font-size: 16px; flex-shrink: 0; }

/* Chat */
.chat-wrap { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.bubble {
  max-width: 85%; padding: 12px 14px; border-radius: 14px;
  font-size: 13px; line-height: 1.7;
}
.bubble-aika {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px 14px 14px 4px; align-self: flex-start;
}
.bubble-aika-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.bubble-aika-icon { font-size: 16px; }
.bubble-aika-name { font-size: 10px; color: var(--kon-lt); font-weight: 700; }
.bubble-user {
  background: var(--kon); color: #fff;
  border-radius: 14px 14px 4px 14px; align-self: flex-end;
}
.bubble-time { font-size: 10px; color: var(--text-dim); margin-top: 4px; }

/* Quick questions */
.quick-q-wrap { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.quick-q {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 7px 14px; font-size: 12px;
  cursor: pointer; color: var(--kon); transition: all 0.2s;
}
.quick-q:hover { border-color: var(--kon-lt); background: var(--kon-bg); }

/* Chat input */
.chat-input-wrap {
  position: sticky; bottom: 0;
  background: var(--bg); padding: 12px 16px 20px;
  border-top: 1px solid var(--border);
  display: flex; gap: 10px; align-items: flex-end;
}
.chat-input {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 22px; padding: 10px 16px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 14px;
  color: var(--text); outline: none; resize: none;
  min-height: 44px; max-height: 120px; line-height: 1.5;
  transition: border-color 0.2s;
}
.chat-input:focus { border-color: var(--kon-lt); }
.send-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--kon); color: #fff; border: none;
  font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.2s;
}
.send-btn:active { transform: scale(0.92); }

/* Insight chips */
.insight-chip {
  background: var(--gold-bg); border: 1px solid #e0c870;
  border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
  display: flex; gap: 10px; align-items: flex-start; font-size: 12px;
}
.insight-icon { font-size: 18px; flex-shrink: 0; }
.insight-text { color: var(--text); line-height: 1.6; }
.insight-text b { color: var(--gold); }

/* Btn */
.btn { padding: 11px 20px; border-radius: 8px; border: none; font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
.btn-primary { background: var(--kon); color: #fff; }
.btn-primary:active { opacity: 0.85; }

/* Loading spinner */
.typing { display: flex; gap: 4px; padding: 4px 0; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: blink 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
</style>
</head>
<body>

<!-- Header -->
<div class="app-header">
  <div class="header-top">
    <button class="back-btn" onclick="history.back()">←</button>
    <div class="aika-avatar">👩‍💼</div>
    <div class="header-info">
      <div class="header-name">AIKA — 経営秘書</div>
      <div class="header-status"><span class="status-dot"></span>稼働中 / 藤原グループ専任</div>
    </div>
  </div>
  <div class="tab-nav">
    <button class="tab-btn active" onclick="showTab('brief',this)"><span class="ti">🌅</span>朝の報告</button>
    <button class="tab-btn" onclick="showTab('analysis',this)"><span class="ti">📊</span>数字分析</button>
    <button class="tab-btn" onclick="showTab('todo',this)"><span class="ti">✅</span>今日の指令</button>
    <button class="tab-btn" onclick="showTab('chat',this)"><span class="ti">💬</span>相談</button>
  </div>
</div>

<!-- ===== 朝の報告 ===== -->
<div id="page-brief" class="page active">
  <div class="brief-card" id="brief-card">
    <div class="brief-greeting" id="brief-greeting">読み込み中...</div>
    <div class="brief-loading" id="brief-loading">
      <span>AIKAが状況を分析しています</span>
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
    <div class="brief-main" id="brief-main" style="display:none;"></div>
  </div>

  <div class="sec-label">本日の重点事項</div>
  <div id="brief-insights"></div>

  <button class="btn btn-primary" onclick="refreshBrief()" style="margin-top:8px;">🔄 最新情報で再分析</button>
</div>

<!-- ===== 数字分析 ===== -->
<div id="page-analysis" class="page">
  <div class="sec-label">今月のサマリー</div>
  <div class="analysis-grid">
    <div class="a-card">
      <div class="a-num c-green" id="an-rev">―</div>
      <div class="a-label">売上合計</div>
      <div class="a-trend" id="an-rev-t"></div>
    </div>
    <div class="a-card">
      <div class="a-num c-kon" id="an-profit">―</div>
      <div class="a-label">純利益</div>
      <div class="a-trend" id="an-profit-t"></div>
    </div>
    <div class="a-card">
      <div class="a-num c-red" id="an-cost">―</div>
      <div class="a-label">経費合計</div>
      <div class="a-trend" id="an-cost-t"></div>
    </div>
    <div class="a-card">
      <div class="a-num c-gold" id="an-margin">―</div>
      <div class="a-label">粗利率</div>
      <div class="a-trend" id="an-margin-t"></div>
    </div>
  </div>

  <div class="sec-label">AIKAの分析コメント</div>
  <div id="analysis-comment-wrap"></div>

  <button class="btn btn-primary" onclick="runAnalysis()">📊 今すぐ数字を分析する</button>
</div>

<!-- ===== 今日の指令 ===== -->
<div id="page-todo" class="page">
  <div class="sec-label">AIKAからの指令</div>
  <div class="card">
    <div id="todo-list"></div>
  </div>
  <button class="btn btn-primary" onclick="refreshTodo()" style="margin-top:4px;">🔄 指令を更新する</button>
</div>

<!-- ===== 相談チャット ===== -->
<div id="page-chat" class="page" style="padding-bottom: 80px;">
  <div class="sec-label">よく聞かれる質問</div>
  <div class="quick-q-wrap" id="quick-questions">
    <div class="quick-q" onclick="sendQuick('今月の利益はどうですか？')">今月の利益は？</div>
    <div class="quick-q" onclick="sendQuick('経費を削減するにはどうすれば良いですか？')">経費削減のアドバイス</div>
    <div class="quick-q" onclick="sendQuick('建設とイベント、どちらの事業が好調ですか？')">どちらの事業が好調？</div>
    <div class="quick-q" onclick="sendQuick('資金繰りで気をつけることを教えてください')">資金繰りの注意点</div>
    <div class="quick-q" onclick="sendQuick('今月の入金待ちはいくらですか？')">入金待ちの状況</div>
    <div class="quick-q" onclick="sendQuick('来月の見通しを教えてください')">来月の見通し</div>
  </div>
  <div class="chat-wrap" id="chat-messages"></div>
</div>

<!-- Chat input (chatタブのみ表示) -->
<div class="chat-input-wrap" id="chat-input-area" style="display:none;">
  <textarea class="chat-input" id="chat-input" placeholder="AIKAに相談する..." rows="1"
    oninput="autoResize(this)"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
  <button class="send-btn" onclick="sendChat()">↑</button>
</div>

<script>
// ── Storage ──
const getD = k => JSON.parse(localStorage.getItem(k) || (k==='fks_v11_revenue'?'{}':'[]'));

// ── Tab ──
function showTab(tab, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  btn.classList.add('active');
  document.getElementById('chat-input-area').style.display = tab==='chat' ? 'flex' : 'none';
  if(tab==='brief' && !briefLoaded) loadBrief();
  if(tab==='analysis') loadAnalysis();
  if(tab==='todo' && !todoLoaded) loadTodo();
  if(tab==='chat' && chatMessages.length===0) initChat();
}

// ── Data helpers ──
function getMonthKey() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
}
function getFinancialData() {
  const mk = getMonthKey();
  const rv = getD('fks_v11_revenue')[mk] || {fj:0, rk:0};
  const exps = getD('fks_v11_expenses').filter(e=>e.month===mk);
  const pays = getD('fks_v11_payments').filter(p=>p.month===mk);
  const logs = getD('fks_construction_logs');
  const sites = getD('fks_construction_sites').filter(s=>s.status==='active');

  const revFj = rv.fj||0, revRk = rv.rk||0;
  const revTotal = revFj + revRk;
  const costFj = exps.filter(e=>e.co==='fj').reduce((s,e)=>s+e.amount,0);
  const costRk = exps.filter(e=>e.co==='rk').reduce((s,e)=>s+e.amount,0);
  const costGroup = exps.filter(e=>e.co==='group').reduce((s,e)=>s+e.amount,0);
  const costTotal = costFj+costRk+costGroup;
  const profit = revTotal-costTotal;
  const margin = revTotal>0?Math.round(profit/revTotal*100):0;
  const unpaidTotal = pays.filter(p=>!p.paid).reduce((s,p)=>s+p.amount,0);

  return { revFj, revRk, revTotal, costFj, costRk, costGroup, costTotal, profit, margin, unpaidTotal, activeSites: sites.length, recentLogs: logs.slice(0,3) };
}

function fmt(n) { return Math.abs(n).toLocaleString(); }
function now() {
  const d = new Date();
  const h = d.getHours();
  return { h, greeting: h<12?'おはようございます':h<18?'お疲れ様です':'お疲れ様です', date: `${d.getMonth()+1}月${d.getDate()}日` };
}

// ── API call ──
async function askAIKA(prompt) {
  const fd = getFinancialData();
  const context = `あなたはAIKA（経営秘書AI）です。藤原グループ（藤原一工業＝建設、リコー工業＝イベント）の経営秘書として、あきひろ社長を補佐します。
口調は丁寧で簡潔、武将の参謀のように的確な助言をしてください。絵文字を適度に使い、読みやすくしてください。

【現在の財務データ】
・売上合計：${fmt(fd.revTotal)}円（建設${fmt(fd.revFj)}円、イベント${fmt(fd.revRk)}円）
・経費合計：${fmt(fd.costTotal)}円
・純利益：${fmt(fd.profit)}円
・粗利率：${fd.margin}%
・支払待ち：${fmt(fd.unpaidTotal)}円
・進行中の現場：${fd.activeSites}件`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: context,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  const data = await res.json();
  return data.content?.[0]?.text || '申し訳ありません、分析に失敗しました。';
}

// ── 朝の報告 ──
let briefLoaded = false;
async function loadBrief() {
  briefLoaded = true;
  const t = now();
  document.getElementById('brief-greeting').textContent = `${t.date} — ${t.greeting}、あきひろ社長`;
  document.getElementById('brief-loading').style.display = 'flex';
  document.getElementById('brief-main').style.display = 'none';

  const fd = getFinancialData();
  const prompt = `${t.greeting}。本日${t.date}の朝の報告をお願いします。現在の財務状況を踏まえて、今日の重点事項と経営判断のポイントを3〜4文で簡潔に報告してください。`;

  try {
    const res = await askAIKA(prompt);
    document.getElementById('brief-loading').style.display = 'none';
    document.getElementById('brief-main').style.display = 'block';
    document.getElementById('brief-main').innerHTML = res.replace(/\n/g,'<br>');

    // インサイト
    const insights = [
      fd.unpaidTotal > 0 ? `💰 入金待ち <b>${fmt(fd.unpaidTotal)}円</b> の回収を確認してください` : null,
      fd.activeSites > 0 ? `🏗 進行中の現場が <b>${fd.activeSites}件</b> あります` : null,
      fd.margin < 30 ? `⚠️ 粗利率が <b>${fd.margin}%</b> と低めです。経費を見直してください` : null,
      fd.margin >= 30 ? `✅ 粗利率 <b>${fd.margin}%</b> は良好な水準です` : null,
    ].filter(Boolean);

    document.getElementById('brief-insights').innerHTML = insights.map(i=>
      `<div class="insight-chip"><span class="insight-icon">📌</span><span class="insight-text">${i}</span></div>`
    ).join('');
  } catch(e) {
    document.getElementById('brief-loading').innerHTML = '⚠️ 通信エラー。再度お試しください。';
  }
}

function refreshBrief() { briefLoaded = false; loadBrief(); }

// ── 数字分析 ──
async function loadAnalysis() {
  const fd = getFinancialData();
  document.getElementById('an-rev').textContent = fmt(fd.revTotal)+'円';
  document.getElementById('an-profit').textContent = fmt(fd.profit)+'円';
  document.getElementById('an-cost').textContent = fmt(fd.costTotal)+'円';
  document.getElementById('an-margin').textContent = fd.margin+'%';
  document.getElementById('an-rev-t').innerHTML = `<span class="c-green">建設 ${fmt(fd.revFj)}円</span> / イベント ${fmt(fd.revRk)}円`;
  document.getElementById('an-profit-t').innerHTML = fd.profit>=0?'<span class="c-green">黒字</span>':'<span class="c-red">赤字</span>';
  document.getElementById('an-margin-t').innerHTML = fd.margin>=30?'<span class="c-green">✓ 良好</span>':'<span class="c-red">↓ 要改善</span>';
}

async function runAnalysis() {
  const wrap = document.getElementById('analysis-comment-wrap');
  wrap.innerHTML = '<div class="card"><div class="typing"><span></span><span></span><span></span></div></div>';
  const prompt = '現在の財務データを詳しく分析してください。良い点、改善点、今後の注意点を箇条書きで教えてください。';
  try {
    const res = await askAIKA(prompt);
    wrap.innerHTML = `<div class="card" style="font-size:13px;line-height:1.8;">${res.replace(/\n/g,'<br>')}</div>`;
  } catch(e) {
    wrap.innerHTML = '<div class="card">⚠️ 分析に失敗しました</div>';
  }
}

// ── 今日の指令 ──
let todoLoaded = false;
async function loadTodo() {
  todoLoaded = true;
  const fd = getFinancialData();
  const list = document.getElementById('todo-list');
  list.innerHTML = '<div class="typing" style="padding:12px 0;"><span></span><span></span><span></span></div>';

  const prompt = '今日あきひろ社長がやるべきことを、優先順位をつけて5項目リストアップしてください。緊急度（緊急/通常/確認）も付けてください。JSON形式で返してください。{"todos":[{"text":"...","priority":"緊急|通常|確認"}]}';

  try {
    const res = await askAIKA(prompt);
    const clean = res.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    todos = parsed.todos || [];
    renderTodos();
  } catch(e) {
    // フォールバック
    todos = [
      {text:'今月の売上・経費データを事務アプリで確認する', priority:'緊急'},
      {text:'進行中の現場の進捗を建設アプリで確認する', priority:'通常'},
      {text:'入金待ちの請求先に連絡する', priority:'緊急'},
      {text:'来月のイベント予定を確認する', priority:'通常'},
      {text:'スタッフへの連絡事項を確認する', priority:'確認'},
    ];
    renderTodos();
  }
}

let todos = [];
let todoDone = new Set();

function renderTodos() {
  const icons = {緊急:'🔴', 通常:'🔵', 確認:'🟡'};
  const tags  = {緊急:'tag-urgent', 通常:'tag-normal', 確認:'tag-check'};
  document.getElementById('todo-list').innerHTML = todos.map((t,i)=>`
    <div class="todo-item">
      <div class="todo-priority">${icons[t.priority]||'🔵'}</div>
      <div class="todo-check ${todoDone.has(i)?'done':''}" onclick="toggleTodo(${i})">${todoDone.has(i)?'✓':''}</div>
      <div class="flex-1">
        <div class="todo-text ${todoDone.has(i)?'done':''}">${t.text}</div>
        <span class="todo-tag ${tags[t.priority]||'tag-normal'}">${t.priority}</span>
      </div>
    </div>`).join('');
}

function toggleTodo(i) {
  if(todoDone.has(i)) todoDone.delete(i); else todoDone.add(i);
  renderTodos();
}

function refreshTodo() { todoLoaded = false; loadTodo(); }

// ── Chat ──
let chatMessages = [];

function initChat() {
  chatMessages = [{
    role:'aika',
    text:'こんにちは、あきひろ社長。私AIKAです。\n経営に関することなら何でもご相談ください。数字の分析、経費の見直し、判断のサポートをいたします。👩‍💼',
    time: timeStr()
  }];
  renderChat();
}

function timeStr() {
  const d = new Date();
  return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function renderChat() {
  const el = document.getElementById('chat-messages');
  el.innerHTML = chatMessages.map(m => m.role==='aika'
    ? `<div class="bubble bubble-aika">
        <div class="bubble-aika-header"><span class="bubble-aika-icon">👩‍💼</span><span class="bubble-aika-name">AIKA</span></div>
        ${m.text.replace(/\n/g,'<br>')}
        <div class="bubble-time">${m.time}</div>
      </div>`
    : `<div class="bubble bubble-user">${m.text}<div class="bubble-time" style="color:rgba(255,255,255,0.5)">${m.time}</div></div>`
  ).join('');
  el.scrollTop = el.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  input.style.height = '';

  chatMessages.push({role:'user', text, time: timeStr()});

  // typing indicator
  chatMessages.push({role:'aika', text:'<span class="typing"><span></span><span></span><span></span></span>', time:''});
  renderChat();

  try {
    const res = await askAIKA(text);
    chatMessages.pop();
    chatMessages.push({role:'aika', text:res, time:timeStr()});
    renderChat();
  } catch(e) {
    chatMessages.pop();
    chatMessages.push({role:'aika', text:'⚠️ 通信エラーが発生しました。もう一度お試しください。', time:timeStr()});
    renderChat();
  }
}

function sendQuick(text) {
  document.getElementById('chat-input').value = text;
  sendChat();
  // chatタブへ切り替え
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{ if(i===3){b.click();} });
}

function autoResize(el) {
  el.style.height = '';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  loadAnalysis();
  loadBrief();
});
</script>
