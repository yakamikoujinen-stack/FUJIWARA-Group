<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUJIWARA 見積書｜KING</title>
<style>
:root{--b:#1f6feb;--bg:#f5f7fa;--line:#cfd6df;--t:#172033;--s:#667085}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--t)}.wrap{max-width:1200px;margin:auto;padding:16px 14px 90px}.toolbar{position:sticky;top:0;background:rgba(245,247,250,.96);padding:10px 0;z-index:10}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 14px;font-weight:900;background:#e4eaf1}.primary{background:var(--b);color:#fff}.sheet{background:#fff;border:1px solid #e3e7ec;border-radius:14px;padding:28px}.title{text-align:center;font-size:30px;font-weight:950;margin-bottom:20px}.topgrid,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:1px solid var(--line);border-radius:10px;padding:14px}label{display:block;font-size:12px;color:var(--s);font-weight:800;margin-bottom:4px}input,textarea{width:100%;border:1px solid #d4dae2;border-radius:8px;padding:9px;font:inherit}textarea{min-height:56px}.recipient input{font-size:22px;font-weight:950;border:0;border-bottom:2px solid #222;border-radius:0}.totalbox{margin:18px 0;border:2px solid #1f2937;border-radius:10px;padding:14px;display:flex;justify-content:space-between}.amount{font-size:30px;font-weight:950}table{width:100%;border-collapse:collapse}th,td{border:1px solid #bfc6cf;padding:6px}th{background:#edf1f5}td input,td textarea{border:0;border-radius:0;padding:6px}.num{text-align:right}.negative{color:#d32f2f!important;font-weight:900}.memo,.company{margin-top:18px}.company{border-top:2px solid #1f2937;padding-top:14px}@media(max-width:700px){.topgrid,.grid2{grid-template-columns:1fr}.tablewrap{overflow:auto}table{min-width:900px}}@media print{.toolbar{display:none}.wrap{padding:0}.sheet{border:0;padding:0}input,textarea{border:0!important;padding:0!important}@page{size:A4;margin:12mm}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head><body><div class="wrap"><div class="toolbar"><div class="actions"><button class="primary" onclick="addRow()">＋ 明細追加</button><button onclick="save()">💾 保存</button><button class="primary" onclick="archiveEstimate()">📚 この見積書を保存</button><button onclick="window.print()">🖨 印刷/PDF</button></div></div>
<section class="sheet"><div class="title">見 積 書</div><div class="topgrid"><div><div class="recipient"><input id="recipient" value="コナンプロデュース 御中"></div><div style="margin-top:14px"><label>件名</label><input id="subject" value="買取案件 お見積"></div><div style="margin-top:10px"><label>案件名 / イベント名</label><input id="project"></div></div><div class="box"><div class="grid2"><div><label>見積番号</label><input id="estimateNo"></div><div><label>見積日</label><input id="estimateDate" type="date"></div><div><label>有効期限</label><input id="dueDate" type="date"></div><div><label>担当者</label><input id="contact"></div></div></div></div>
<div class="totalbox"><b>お見積金額（税込）</b><div class="amount" id="grandTotal">¥0</div></div><div class="tablewrap"><table><thead><tr><th>品名・内容</th><th>単位</th><th>数量</th><th>単価</th><th>金額</th><th>備考</th></tr></thead><tbody id="tbody"></tbody><tfoot><tr><th colspan="4">小計</th><td class="num" id="subtotal">¥0</td><td></td></tr><tr><th colspan="4">消費税</th><td class="num" id="tax">¥0</td><td><input id="taxRate" value="10" inputmode="numeric" style="width:55px;text-align:right"> %</td></tr><tr><th colspan="4">合計</th><td class="num" id="total">¥0</td><td></td></tr></tfoot></table></div>
<div class="memo"><label>備考</label><textarea id="memo"></textarea></div><div class="company"><div class="grid2"><div><label>見積元</label><input id="companyName" value="藤原一工業合同会社"></div><div><label>担当</label><input id="companyContact"></div><div><label>住所</label><input id="address"></div><div><label>電話</label><input id="phone"></div></div></div></section></div>
<script>

const firebaseConfig={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94",measurementId:"G-1VHX1GQV0C"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const sharedDb=firebase.database();
const DOC_BASE='fujiwara/documents';

const KEY='fujiwara_estimate_current_v1';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function parseNum(v){return Number(String(v??'').replace(/,/g,''))||0}function yen(n){return '¥'+Math.round(Number(n)||0).toLocaleString('ja-JP')}function rowHtml(r={}){return `<tr><td><textarea data-r="name">${esc(r.name||'')}</textarea></td><td><input data-r="unit" value="${esc(r.unit||'')}"></td><td><input data-r="qty" class="num" value="${esc(r.qty||'')}"></td><td><input data-r="price" class="num" value="${esc(r.price||'')}"></td><td class="num line"></td><td><textarea data-r="note">${esc(r.note||'')}</textarea></td></tr>`}function addRow(r){tbody.insertAdjacentHTML('beforeend',rowHtml(r));calc()}function collect(){return [...tbody.querySelectorAll('tr')].map(tr=>({name:tr.querySelector('[data-r=name]').value,unit:tr.querySelector('[data-r=unit]').value,qty:tr.querySelector('[data-r=qty]').value,price:tr.querySelector('[data-r=price]').value,note:tr.querySelector('[data-r=note]').value}))}function calc(){let s=0;[...tbody.querySelectorAll('tr')].forEach(tr=>{const q=tr.querySelector('[data-r=qty]').value,p=tr.querySelector('[data-r=price]').value,c=tr.querySelector('.line');if(!q||!p){c.textContent='';return}const v=parseNum(q)*parseNum(p);c.textContent=yen(v);c.classList.toggle('negative',v<0);s+=v});const t=Math.round(s*(parseFloat(taxRate.value)||0)/100),g=s+t;subtotal.textContent=yen(s);tax.textContent=yen(t);total.textContent=yen(g);grandTotal.textContent=yen(g)}function fields(){return['recipient','subject','project','estimateNo','estimateDate','dueDate','contact','taxRate','memo','companyName','companyContact','address','phone']}function save(){const d={rows:collect()};fields().forEach(id=>d[id]=document.getElementById(id).value);localStorage.setItem(KEY,JSON.stringify(d))}async function archiveEstimate(){
  save();
  let a=[];
  try{a=JSON.parse(localStorage.getItem('fujiwara_estimate_archive_v1')||'[]')}catch(e){a=[]}
  if(!Array.isArray(a))a=[];
  const d={
    id:'I'+Date.now(),
    savedAt:new Date().toISOString(),
    rows:collect(),
    totalText:total.textContent,
    source:'estimate',
    shared:true
  };
  fields().forEach(id=>d[id]=document.getElementById(id).value);

  // 端末にもバックアップ
  a.unshift(d);
  localStorage.setItem('fujiwara_estimate_archive_v1',JSON.stringify(a));

  try{
    await sharedDb.ref(DOC_BASE+'/estimates/'+d.id).set(d);
    alert('見積書を保存・共有しました。別のiPad・PCからも確認できます。');
  }catch(e){
    alert('端末には保存しましたが、共有に失敗しました：'+e.message);
  }
}
function nextEstimateNo(){
  let a=[];
  try{a=JSON.parse(localStorage.getItem('fujiwara_estimate_archive_v1')||'[]')}catch(e){}
  if(!Array.isArray(a))a=[];
  const n=new Date(),ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
  let max=0;
  a.forEach(x=>{
    const m=String(x.estimateNo||'').match(/(\d{4})-(\d{2})-(\d+)$/);
    if(m&&(m[1]+'-'+m[2])===ym)max=Math.max(max,Number(m[3])||0);
  });
  return ym+'-'+String(max+1).padStart(3,'0');
}
function consumeConstructionEstimatePrefill(){
  let p=null;
  try{p=JSON.parse(localStorage.getItem('fujiwara_construction_estimate_prefill_v1')||'null')}catch(e){}
  if(!p)return null;
  localStorage.removeItem('fujiwara_construction_estimate_prefill_v1');
  return p;
}
function applyEstimateModes(){
  const sp=new URLSearchParams(location.search);
  const isNew=sp.get('new')==='1';
  if(isNew)localStorage.removeItem(KEY);
  sp.delete('new');
  history.replaceState(null,'',location.pathname+(sp.toString()?'?'+sp.toString():''));
  return {isNew,prefill:consumeConstructionEstimatePrefill()};
}

function load(){const mode=applyEstimateModes();let d={};try{d=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}fields().forEach(id=>{if(d[id]!=null)document.getElementById(id).value=d[id]});if(!estimateDate.value)estimateDate.value=new Date().toISOString().slice(0,10);
if(mode.isNew||!estimateNo.value)estimateNo.value=nextEstimateNo();
tbody.innerHTML='';
(d.rows?.length?d.rows:[{}]).forEach(addRow);
if(mode.prefill){
  const p=mode.prefill;
  recipient.value=(p.client||'')+(p.client?' 御中':'');
  project.value=p.project||'';
  subject.value=p.subject||'建設 月次お見積';
  memo.value=p.memo||'';
  tbody.innerHTML='';
  (Array.isArray(p.rows)&&p.rows.length?p.rows:[{}]).forEach(addRow);
}
calc();save()}document.addEventListener('input',()=>{calc();save()});load();
</script></body></html>
