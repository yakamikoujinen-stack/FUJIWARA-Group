<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>担当者チェックリスト</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;background:#f1f7fc;color:#17324d;margin:0;padding:18px}.wrap{max-width:950px;margin:auto}.card{background:white;border:1px solid #dce7ef;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 18px #17324d12}h1{font-size:27px}h2{font-size:21px;color:#17324d}label{display:block;font-weight:750;margin:12px 0}.task{display:flex;gap:13px;align-items:flex-start;border-bottom:1px solid #e7eef3;padding:15px 0;line-height:1.6}.task input{width:25px;height:25px;flex-shrink:0}select,input[type=date]{font-size:17px;padding:12px;border:1px solid #b7cbdb;border-radius:10px;max-width:100%}button,a.btn{display:inline-block;border:0;border-radius:12px;padding:13px 18px;background:#173f68;color:white;text-decoration:none;font-weight:800;font-size:16px;cursor:pointer;margin:5px}button:disabled{opacity:.5}.status{font-weight:750;padding:12px;background:#fff8db;border-radius:10px}.small{color:#63788a;font-size:13px}.grid{display:flex;gap:12px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:11px;border-bottom:1px solid #dbe5ee;text-align:left}th{background:#eaf3fa} .scroll{overflow:auto} .ok{color:#117447;font-weight:800}.bad{color:#b82c2c;font-weight:800}</style></head><body><main class="wrap"><a href="manager-app.html">← 担当者アプリに戻る</a><div class="card"><h1>☑️ チェックリスト</h1><h2>必ずココを見ろ！</h2><p class="small">確認した項目をチェックし、最後に「確認を記録」を押してください。未確認の項目は空欄のままで保存できます。</p><div class="grid"><label>担当者<br><select id="person"><option value="">選択してください</option><option>将</option><option>文太</option><option>繁充</option></select></label><label>確認日<br><input type="date" id="day"></label></div><div id="tasks"></div><button id="save" onclick="saveRecord()">💾 確認を記録</button><div id="status" class="status">担当者を選択してください</div></div></main><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.database();const ROOT='fujiwara/manager_daily_checklist_v1';
const TASKS=["メインアプリ→新規イベントは無いか？変更は無いか？", "イベント別振分→積み込む前にチェック", "配置スケジュール→自分自身の行先の変更は無いか？", "在庫管理→来週のネタの早期発注を管理者に伝えたか？", "車両管理→異常、車検日時を入力したか？", "準備アプリ→積込んだ物をチェックしたか？", "LPG管理→返却は無かったか？次回のLPG発注数は？", "運行管理→運行状況を記録したか？"];const person=document.getElementById('person'),day=document.getElementById('day'),status=document.getElementById('status');day.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));document.getElementById('tasks').innerHTML=TASKS.map((t,i)=>`<label class="task"><input type="checkbox" id="t${i}"><span>${esc(t)}</span></label>`).join('');try{const profile=JSON.parse(localStorage.getItem('fg_login_profile_v15')||'null');if(profile&&['将','文太','繁充'].includes(profile.name))person.value=profile.name;}catch(e){}
function ref(){return db.ref(ROOT+'/'+day.value+'/'+encodeURIComponent(person.value));}async function loadRecord(){if(!person.value||!day.value)return;status.textContent='保存済みの確認を読み込み中…';try{const snap=await ref().once('value'),v=snap.val();TASKS.forEach((_,i)=>document.getElementById('t'+i).checked=!!v?.checks?.[i]);status.textContent=v?'前回の確認：'+new Date(v.updatedAt).toLocaleString('ja-JP'):'この日の確認はまだありません';}catch(e){status.textContent='読み込み失敗。通信を確認してください';}}person.addEventListener('change',loadRecord);day.addEventListener('change',loadRecord);if(person.value)loadRecord();async function saveRecord(){if(!person.value||!day.value)return alert('担当者と日付を選択してください');const checks=TASKS.map((_,i)=>document.getElementById('t'+i).checked),btn=document.getElementById('save');btn.disabled=true;status.textContent='保存中…';try{await ref().set({person:person.value,date:day.value,checks,updatedAt:firebase.database.ServerValue.TIMESTAMP});status.textContent='✅ Firebaseに保存しました：'+checks.filter(Boolean).length+'/8項目';}catch(e){status.textContent='❌ 保存できませんでした。通信・Firebase権限を確認してください';}finally{btn.disabled=false;}}</script></body></html>
