<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イベント予定表 配布版</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#faf7ef;margin:0;color:#222}
.wrap{max-width:1100px;margin:auto;padding:18px}
.header{background:#fff;border:2px solid #caa54a;border-radius:18px;padding:16px;margin-bottom:14px}
.titleInput{width:100%;font-size:26px;font-weight:900;color:#9b6c00;border:1px dashed #caa54a;border-radius:10px;padding:8px;background:#fffdf5}
.descInput{width:100%;font-size:15px;border:1px dashed #caa54a;border-radius:10px;padding:8px;margin-top:8px;background:#fffdf5}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{padding:10px 14px;border:none;border-radius:10px;background:#c99718;color:#fff;font-weight:900}
button.gray{background:#666}
button.red{background:#b9472f}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #caa54a;padding:8px;vertical-align:middle}
th{background:#f3df9a}
input,textarea,select{width:100%;border:1px solid #ead28b;border-radius:8px;background:#fff;font-size:15px;padding:8px}
textarea{min-height:42px;resize:vertical}
.noPrint{white-space:nowrap;text-align:center}
.hiddenRow{background:#eee;color:#777}
.hiddenRow input,.hiddenRow textarea{color:#777;background:#f7f7f7}
.small{font-size:13px;color:#6b5a24}
@media(max-width:760px){
.wrap{padding:10px}
table,thead,tbody,tr,th,td{display:block}
thead{display:none}
tr{margin-bottom:12px;border:2px solid #caa54a;border-radius:14px;overflow:hidden;background:#fff}
td{border:none;border-bottom:1px solid #ead28b}
td:before{content:attr(data-label);display:block;font-weight:900;color:#7b5600;margin-bottom:4px}
.noPrint{text-align:left}
}
@media print{
body{background:#fff}
button,.noPrint,.small{display:none!important}
.header{border:none}
.titleInput,.descInput,input,textarea,select{border:none;background:transparent;padding:0}
tr.hiddenRow{display:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <input id="sheetTitle" class="titleInput" value="2026年7・8月 イベント予定表（第三者配布版）" oninput="saveData()">
    <input id="sheetDesc" class="descInput" value="※イベント名・場所・備考は自由に編集できます。非公開にした行は印刷/PDFに出ません。" oninput="saveData()">
    <div class="small">入力内容はこの端末に自動保存されます。</div>
  </div>

  <div class="btns">
    <button onclick="addRow()">＋ 行を追加</button>
    <button onclick="saveData()">保存</button>
    <button onclick="window.print()">印刷 / PDF保存</button>
    <button class="gray" onclick="resetSample()">初期データに戻す</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>公開</th><th>日付</th><th>イベント名</th><th>場所</th><th>備考</th><th class="noPrint">操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const KEY='fujiwara_event_share_2026_07_08_v2';

const sampleRows = [
["公開","7/4","サンドーム福井","福井県越前市",""],
["公開","7/4","清心夜市","",""],
["公開","7/5","サンドーム福井","",""],
["公開","7/5","JAたんご","",""],
["公開","7/11","清心夜市","",""],
["公開","7/11","きちゃりーな","",""],
["公開","7/12","きちゃりーな","",""],
["公開","7/12","神戸敏馬神社","",""],
["公開","7/18","清心夜市","",""],
["公開","7/18","若狭花火","",""],
["公開","7/19","浜坂花火","",""],
["公開","7/19","川夏旅館","",""],
["公開","7/24","大阪天神","",""],
["公開","7/24","香住まつり","",""],
["公開","7/25","大阪天神","",""],
["公開","7/25","岩美花火","",""],
["公開","7/26","日高まつり","",""],
["公開","7/28","全農京都 展示","",""],
["公開","8/1","柳まつり","",""],
["公開","8/1","柳まつり(大開)","",""],
["公開","8/2","柳まつり","",""],
["公開","8/2","熊野神社","",""],
["公開","8/3","熊野神社","",""],
["公開","8/6","びわこ花火","",""],
["公開","8/7","米子がいな祭","",""],
["公開","8/8","大阪茨木","",""],
["公開","8/9","久美浜","",""],
["公開","8/14","しゃんしゃん","",""],
["公開","8/15","千代川花火","",""],
["公開","8/16","宮津花火","",""],
["公開","8/16","黒田庄花火","",""],
["公開","8/17","瀬田花火","",""],
["公開","8/22","鳥取美萩野","",""],
["公開","8/22","蒲田神社","",""],
["公開","8/23","甲子園盆踊り","",""],
["公開","8/24","甲子園盆踊り","",""],
["公開","8/28","神戸田中盆踊り","",""],
["公開","8/29","神戸田中盆踊り","",""],
["公開","8/29","エルムプラザ","",""]
];

function getData(){
  const saved=localStorage.getItem(KEY);
  if(saved){try{return JSON.parse(saved)}catch(e){}}
  return {
    title:"2026年7・8月 イベント予定表（第三者配布版）",
    desc:"※イベント名・場所・備考は自由に編集できます。非公開にした行は印刷/PDFに出ません。",
    rows:sampleRows
  };
}

function saveData(){
  const rows=[...document.querySelectorAll('#tbody tr')].map(tr=>[
    tr.querySelector('.pub').value,
    tr.querySelector('.date').value,
    tr.querySelector('.event').value,
    tr.querySelector('.place').value,
    tr.querySelector('.note').value
  ]);
  localStorage.setItem(KEY,JSON.stringify({
    title:sheetTitle.value,
    desc:sheetDesc.value,
    rows
  }));
}

function render(){
  const data=getData();
  sheetTitle.value=data.title;
  sheetDesc.value=data.desc;
  tbody.innerHTML='';
  data.rows.forEach(r=>createRow(r));
}

function createRow(r=["公開","","","",""]){
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td data-label="公開"><select class="pub" onchange="rowStyle(this);saveData()"><option>公開</option><option>非公開</option></select></td>
    <td data-label="日付"><input class="date" value="${esc(r[1])}" oninput="saveData()"></td>
    <td data-label="イベント名"><input class="event" value="${esc(r[2])}" oninput="saveData()"></td>
    <td data-label="場所"><input class="place" value="${esc(r[3])}" oninput="saveData()"></td>
    <td data-label="備考"><textarea class="note" oninput="saveData()">${esc(r[4])}</textarea></td>
    <td class="noPrint" data-label="操作"><button class="red" onclick="this.closest('tr').remove();saveData()">削除</button></td>`;
  tbody.appendChild(tr);
  tr.querySelector('.pub').value=r[0]||'公開';
  rowStyle(tr.querySelector('.pub'));
}

function rowStyle(sel){
  const tr=sel.closest('tr');
  if(sel.value==='非公開') tr.classList.add('hiddenRow');
  else tr.classList.remove('hiddenRow');
}

function addRow(){
  createRow();
  saveData();
}

function resetSample(){
  if(!confirm('入力内容を初期データに戻す？'))return;
  localStorage.removeItem(KEY);
  render();
  saveData();
}

function esc(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
</script>
</body>
</html>
