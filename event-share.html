<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026年7・8月 予定表</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbf7ec;color:#191919;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:18px}
.header{background:#fffdf6;border:3px solid #c99b1a;border-radius:20px;padding:18px;margin-bottom:14px}
#title{width:100%;border:0;background:transparent;color:#9b6c00;font-size:34px;font-weight:900;outline:none}
.help{font-size:13px;color:#6b5a24;margin-top:4px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:12px;background:#c99718;color:white;font-weight:900;padding:13px 16px;font-size:15px}
button.gray{background:#666} button.red{background:#bd412d}
table{width:100%;border-collapse:collapse;background:#fff;border:2px solid #caa54a}
th,td{border:1px solid #caa54a;padding:8px;vertical-align:middle}
th{background:#f4dfa0;font-size:17px}
input,select,textarea{width:100%;font-size:16px;border:1.5px solid #dfc16c;border-radius:10px;padding:10px;background:#fff;outline:none}
textarea{min-height:46px;resize:vertical}
.hiddenRow{background:#eee}
.hiddenRow input,.hiddenRow textarea,.hiddenRow select{background:#f3f3f3;color:#777}
.col-pub{width:86px} .col-date{width:120px} .col-action{width:84px}
.printView{display:none}
@media(max-width:760px){
.wrap{padding:10px}
#title{font-size:28px}
table,thead,tbody,tr,th,td{display:block}
thead{display:none}
tr{border:2px solid #caa54a;border-radius:14px;margin:0 0 12px;overflow:hidden}
td{border:0;border-bottom:1px solid #ead28b}
td:before{content:attr(data-label);display:block;font-weight:900;color:#7b5600;margin-bottom:5px}
}
@page{size:A4 landscape;margin:8mm}
@media print{
body{background:white}
.wrap{max-width:none;padding:0}
.header{border:0;padding:0;margin:0 0 4mm}
#title{font-size:20pt;padding:0}
.controls,.help,.editTable{display:none!important}
.printView{display:block}
.printTable{width:100%;border-collapse:collapse;font-size:10pt}
.printTable th,.printTable td{border:1px solid #999;padding:3px 5px;line-height:1.15}
.printTable th{background:#eee!important}
.printTitle{font-size:20pt;font-weight:900;color:#8a6200;margin-bottom:4mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <input id="title" value="2026年7・8月 予定表" oninput="saveData()">
    <div class="help">※上の空欄は消しました。タイトルだけ編集できます。保存はこの端末に自動保存されます。</div>
  </div>

  <div class="controls">
    <button onclick="addRow()">＋ 行を追加</button>
    <button onclick="saveData();alert('保存しました')">保存</button>
    <button onclick="makePrint();window.print()">A4横1枚で印刷 / PDF保存</button>
    <button class="gray" onclick="resetData()">初期データに戻す</button>
  </div>

  <table class="editTable">
    <thead><tr><th class="col-pub">公開</th><th class="col-date">日付</th><th>イベント名</th><th>場所</th><th>備考</th><th class="col-action">操作</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <div id="printView" class="printView"></div>
</div>

<script>
const KEY='fujiwara_event_share_v3';
const sampleRows=[('公開', '7/4', 'サンドーム福井', '福井県越前市', ''), ('公開', '7/4', '清心夜市', '', ''), ('公開', '7/5', 'サンドーム福井', '', ''), ('公開', '7/5', 'JAたんご', '', ''), ('公開', '7/11', '清心夜市', '', ''), ('公開', '7/11', 'きちゃりーな', '', ''), ('公開', '7/12', 'きちゃりーな', '', ''), ('公開', '7/12', '神戸敏馬神社', '', ''), ('公開', '7/18', '清心夜市', '', ''), ('公開', '7/18', '若狭花火', '', ''), ('公開', '7/19', '浜坂花火', '', ''), ('公開', '7/19', '川夏旅館', '', ''), ('公開', '7/24', '大阪天神', '', ''), ('公開', '7/24', '香住まつり', '', ''), ('公開', '7/25', '大阪天神', '', ''), ('公開', '7/25', '岩美花火', '', ''), ('公開', '7/26', '日高まつり', '', ''), ('公開', '7/28', '全農京都 展示', '', ''), ('公開', '8/1', '柳まつり', '', ''), ('公開', '8/1', '柳まつり(大開)', '', ''), ('公開', '8/2', '柳まつり', '', ''), ('公開', '8/2', '熊野神社', '', ''), ('公開', '8/3', '熊野神社', '', ''), ('公開', '8/6', 'びわこ花火', '', ''), ('公開', '8/7', '米子がいな祭', '', ''), ('公開', '8/8', '大阪茨木', '', ''), ('公開', '8/9', '久美浜', '', ''), ('公開', '8/14', 'しゃんしゃん', '', ''), ('公開', '8/15', '千代川花火', '', ''), ('公開', '8/16', '宮津花火', '', ''), ('公開', '8/16', '黒田庄花火', '', ''), ('公開', '8/17', '瀬田花火', '', ''), ('公開', '8/22', '鳥取美萩野', '', ''), ('公開', '8/22', '蒲田神社', '', ''), ('公開', '8/23', '甲子園盆踊り', '', ''), ('公開', '8/24', '甲子園盆踊り', '', ''), ('公開', '8/28', '神戸田中盆踊り', '', ''), ('公開', '8/29', '神戸田中盆踊り', '', ''), ('公開', '8/29', 'エルムプラザ', '', '')];

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function getRows(){
 const saved=localStorage.getItem(KEY);
 if(saved){try{return JSON.parse(saved)}catch(e){}}
 return {title:'2026年7・8月 予定表',rows:sampleRows};
}

function saveData(){
 const rows=[...document.querySelectorAll('#tbody tr')].map(tr=>[
  tr.querySelector('.pub').value,
  tr.querySelector('.date').value,
  tr.querySelector('.event').value,
  tr.querySelector('.place').value,
  tr.querySelector('.note').value
 ]);
 localStorage.setItem(KEY,JSON.stringify({title:document.getElementById('title').value,rows}));
}

function render(){
 const data=getRows();
 document.getElementById('title').value=data.title || '2026年7・8月 予定表';
 tbody.innerHTML='';
 data.rows.forEach(r=>createRow(r));
 makePrint();
}

function createRow(r=['公開','','','','']){
 const tr=document.createElement('tr');
 tr.innerHTML=`<td data-label="公開"><select class="pub" onchange="styleRow(this);saveData();makePrint()"><option>公開</option><option>非公開</option></select></td>
 <td data-label="日付"><input class="date" value="${esc(r[1])}" oninput="saveData();makePrint()"></td>
 <td data-label="イベント名"><input class="event" value="${esc(r[2])}" oninput="saveData();makePrint()"></td>
 <td data-label="場所"><input class="place" value="${esc(r[3])}" oninput="saveData();makePrint()"></td>
 <td data-label="備考"><textarea class="note" oninput="saveData();makePrint()">${esc(r[4])}</textarea></td>
 <td data-label="操作"><button class="red" onclick="this.closest('tr').remove();saveData();makePrint()">削除</button></td>`;
 tbody.appendChild(tr);
 tr.querySelector('.pub').value=r[0]||'公開';
 styleRow(tr.querySelector('.pub'));
}

function styleRow(sel){
 const tr=sel.closest('tr');
 tr.classList.toggle('hiddenRow',sel.value==='非公開');
}

function addRow(){createRow();saveData();makePrint()}

function resetData(){
 if(!confirm('初期データに戻しますか？'))return;
 localStorage.removeItem(KEY);
 render();
 saveData();
}

function makePrint(){
 const rows=[...document.querySelectorAll('#tbody tr')].map(tr=>[
  tr.querySelector('.pub').value,
  tr.querySelector('.date').value,
  tr.querySelector('.event').value,
  tr.querySelector('.place').value,
  tr.querySelector('.note').value
 ]).filter(r=>r[0]==='公開' && (r[1]||r[2]||r[3]||r[4]));
 let body=rows.map(r=>`<tr><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`).join('');
 printView.innerHTML=`<div class="printTitle">${esc(document.getElementById('title').value)}</div>
 <table class="printTable"><thead><tr><th style="width:12%">日付</th><th style="width:34%">イベント名</th><th style="width:27%">場所</th><th style="width:27%">備考</th></tr></thead><tbody>${body}</tbody></table>`;
}

window.addEventListener('beforeunload',saveData);
render();
</script>
</body>
</html>
