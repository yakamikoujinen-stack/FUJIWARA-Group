<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>未反映支出チェック｜KING</title><style>:root{--navy:#17324d;--gold:#d6a21c;--red:#c43b3b;--green:#168a58;--line:#dfe6ee}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f5f8fc;color:#14213d}.wrap{max-width:1100px;margin:auto;padding:14px 12px 90px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 8px 24px rgba(20,40,70,.07)}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px}.head h1{margin:0;font-size:25px}.back{border:0;border-radius:12px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:950}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px;padding:14px}.field label{display:block;font-size:12px;font-weight:900;color:#667085;margin-bottom:5px}.field input{padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.kpi{padding:16px;text-align:center}.kpi small{font-weight:900;color:#667085}.kpi b{display:block;font-size:26px;margin-top:5px}.red{color:var(--red)}.panel{padding:14px;margin-top:12px}.row{display:grid;grid-template-columns:1.3fr .8fr .8fr .8fr 1.4fr;gap:8px;align-items:center;padding:12px 4px;border-bottom:1px solid #edf0f4}.row.headrow{font-size:12px;font-weight:950;background:#f7f9fc;border-radius:10px}.src{font-weight:950}.amt{font-weight:950;text-align:right}.input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit}.check{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900}.note{margin-top:12px;background:#fff8df;border:1px solid #ecd27c;border-radius:12px;padding:12px;font-size:12px;line-height:1.6;font-weight:800;color:#6d5411}.save{border:0;border-radius:12px;padding:12px 18px;background:var(--green);color:#fff;font-weight:950}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid #e3e8ef;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}@media(max-width:720px){.row{grid-template-columns:1fr 1fr}.row.headrow{display:none}.row>div:before{content:attr(data-label);display:block;font-size:10px;color:#667085;font-weight:900}.summary{grid-template-columns:1fr 1fr}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><main class="wrap"><section class="card head"><div><h1>🔎 未反映支出チェック</h1><div style="font-size:12px;color:#667085;font-weight:800;margin-top:4px">試作版｜KINGの総経費にはまだ加算しません</div></div><button class="back" onclick="location.href='king-money.html'">← お金管理</button></section><section class="card controls"><div class="field"><label>対象月</label><input id="month" type="month" onchange="load()"></div><button class="save" onclick="save()">💾 試算を保存</button></section><section class="summary"><div class="card kpi"><small>未反映支出 合計</small><b id="total" class="red">¥0</b></div><div class="card kpi"><small>確認済み項目</small><b id="checked">0 / 5</b></div></section><section class="card panel"><div class="row headrow"><div>項目</div><div>元アプリ</div><div>当月金額</div><div>KING反映</div><div>備考</div></div><div id="rows"></div><div class="note">⚠️ 安全のため試作版は自動で総経費へ足しません。各アプリのFirebase保存先を確定するまでは、金額を手入力して「どれだけ手持ち金との差が縮まるか」を確認します。二重計上を防ぐため、KING反映済みにチェックした項目は未反映合計から除外します。在庫は仕入額をそのまま経費にせず、現在庫金額を確認してから原価調整する想定です。</div></section></main><nav class="bottom"><button class="back" onclick="location.href='king.html'">👑 KINGへ</button><button class="save" onclick="save()">💾 保存</button></nav><script>const cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.database(),PATH='fujiwara/unreflected_expense_checks';const items=[['lpg','① LPG代金','LPG管理'],['private','② 私用の支払い','私用支払い'],['labor','③ イベント労務費','労務費'],['transport','④ 交通費（高速・燃料）','運行記録'],['inventory','⑤ 本社在庫調整','在庫管理']];const yen=v=>'¥'+(Number(v)||0).toLocaleString('ja-JP');function draw(data={}){rows.innerHTML=items.map(([id,name,src])=>{let x=data[id]||{};return `<div class="row" data-id="${id}"><div data-label="項目" class="src">${name}</div><div data-label="元アプリ">${src}</div><div data-label="当月金額"><input class="input amount" type="number" inputmode="numeric" min="0" value="${Number(x.amount)||0}" oninput="calc()"></div><div data-label="KING反映"><label class="check"><input class="reflected" type="checkbox" ${x.reflected?'checked':''} onchange="calc()">反映済</label></div><div data-label="備考"><input class="input memo" value="${String(x.memo||'').replace(/"/g,'&quot;')}" placeholder="確認メモ"></div></div>`}).join('');calc()}function calc(){let t=0,c=0;document.querySelectorAll('#rows .row').forEach(r=>{let a=Number(r.querySelector('.amount').value)||0,ok=r.querySelector('.reflected').checked;if(ok)c++;else t+=a});total.textContent=yen(t);checked.textContent=c+' / '+items.length}async function load(){let m=month.value;if(!m)return;try{let s=await db.ref(PATH+'/'+m).once('value');draw(s.val()||{})}catch(e){alert('読込失敗：'+e.message)}}async function save(){let m=month.value;if(!m)return;let data={};document.querySelectorAll('#rows .row').forEach(r=>data[r.dataset.id]={amount:Number(r.querySelector('.amount').value)||0,reflected:r.querySelector('.reflected').checked,memo:r.querySelector('.memo').value||'',updatedAt:new Date().toISOString()});try{await db.ref(PATH+'/'+m).set(data);alert('試算を保存しました')}catch(e){alert('保存失敗：'+e.message)}}let d=new Date();month.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');load();</script></body></html>
