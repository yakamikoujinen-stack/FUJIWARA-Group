<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6c344"><title>KING APP｜お金管理</title>
<style>
:root{--gold:#c59a1d;--gold2:#f7c928;--line:#dcc374;--text:#241d0d;--green:#168653;--red:#c43e3e;--blue:#1963ac;--card:#fffef9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#fff4c8,#fffdf7 38%,#fff);color:var(--text)}.wrap{max-width:1200px;margin:auto;padding:14px 14px 96px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 6px}h1{font-size:24px;margin:0;color:#6d5312}.back{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 18px;font-weight:950}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 12px}.kpi{background:var(--card);border:2px solid #e4cd88;border-radius:20px;padding:15px;text-align:center}.kpi small{font-weight:900;color:#80682c}.kpi b{display:block;font-size:27px;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;background:#fff;border:2px solid #e4cd88;border-radius:20px;padding:14px;margin-bottom:14px}.field label{display:block;font-weight:900;margin:0 0 5px}.field input,.field select{width:100%;border:1.5px solid #d4c078;border-radius:13px;padding:12px;background:#fff;font-size:16px}.office-entry{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,#f2f8f3,#fff);border:2px solid #9ab8a1;border-radius:18px;padding:14px 16px;margin-bottom:14px}.office-entry strong{display:block;font-size:18px;color:#42634b}.office-entry small{display:block;margin-top:3px;color:#66736a;font-weight:800}.office-entry button{border:0;border-radius:12px;background:#42634b;color:#fff;padding:12px 16px;font-weight:950;white-space:nowrap}.panel{background:#fff;border:2px solid #e4cd88;border-radius:20px;padding:14px;overflow:hidden}.table-wrap{overflow:auto}table{width:100%;min-width:920px;border-collapse:collapse}th,td{padding:14px 10px;border-bottom:1px solid #eadcae;text-align:right;white-space:nowrap}th{background:#fff4cb;font-weight:950;position:sticky;top:0}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.event-name{font-weight:950}.meta{display:block;font-size:11px;color:#786f61;margin-top:3px}.status-badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.ok{background:#e6f6ea;color:#19723d}.warn{background:#fff0d4;color:#9b6200}.notice{margin-top:12px;background:#fff7d7;border:1px solid #dfbf58;border-radius:14px;padding:12px;font-size:12px;font-weight:800;color:#6c5515}.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;background:rgba(255,255,255,.96);border-top:1px solid #eadcae;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.bottom button{flex:1;max-width:480px;border:1px solid #dfc367;border-radius:14px;padding:14px;font-size:16px;font-weight:950;background:white}.bottom .refresh{background:linear-gradient(135deg,#ffd02d,#f3aa00);border:0}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.kpi b{font-size:24px}.office-entry{align-items:flex-start}.office-entry button{padding:11px 12px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body>
<div class="wrap"><header><h1>♛ KING APP</h1><button class="back" onclick="location.href='king-money-center.html'">戻る</button></header>
<section class="kpis"><div class="kpi"><small>総売上</small><b id="kSales">¥0</b></div><div class="kpi"><small>総経費</small><b id="kExpense" class="red">¥0</b></div><div class="kpi"><small>総利益</small><b id="kProfit" class="green">¥0</b></div><div class="kpi"><small>総預金</small><b id="kDeposit" class="blue">¥0</b></div><div class="kpi"><small>手元残 合計</small><b id="kCash">¥0</b></div><div class="kpi"><small>未精算 合計</small><b id="kUnpaid" class="red">¥0</b></div><div class="kpi"><small>精算済</small><b id="kDone" class="green">0件</b></div><div class="kpi"><small>要確認</small><b id="kPending" class="red">0件</b></div></section>
<section class="filters"><div class="field"><label>月で絞り込み</label><input id="monthFilter" type="month" onchange="render()"></div><div class="field"><label>状態</label><select id="statusFilter" onchange="render()"><option value="">すべて</option><option value="done">精算済</option><option value="pending">要確認</option></select></div><div class="field"><label>検索</label><input id="searchFilter" placeholder="イベント名・メモ" oninput="render()"></div></section>
<section class="office-entry"><div><strong>🏢 事務所・会社経費</strong><small>電気代・光熱費・作業着・買掛・その他雑費を管理</small></div><button onclick="location.href='king-office-expense.html'">経費管理を開く ›</button></section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>日付</th><th>イベント</th><th>売上</th><th>経費</th><th>利益</th><th>預金</th><th>手元残</th><th>未精算</th><th>状態</th></tr></thead><tbody id="rows"></tbody></table></div><div class="notice">経費はメインアプリの「場所代＋仕入れ＋交通費＋その他経費＋労務費＋スタッフ支払」を日別に合計して自動反映します。メインアプリ本体は変更しません。</div></section></div>
<nav class="bottom"><button onclick="location.href='king.html'">♛ キングへ戻る</button><button class="refresh" onclick="load()">🔄 更新</button></nav>
<script>
const firebaseConfig={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const db=firebase.database();let events=[];const n=v=>Number(String(v??0).replace(/[^0-9.-]/g,''))||0;const yen=v=>'¥'+Math.round(n(v)).toLocaleString('ja-JP');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function arr(v){if(!v)return[];return Array.isArray(v)?v.filter(Boolean):Object.keys(v).map(k=>v[k]).filter(Boolean)}
function simpleSummary(simple){simple=simple||{};let sales=0;const items=simple.items||{};Object.keys(items).forEach(k=>sales+=n(items[k]));if(simple.salesTotal!=null)sales=n(simple.salesTotal);const ex=simple.expenses||{};const laborObj=ex.labor||{};const baseExpense=n(ex.basho)+n(ex.shiire)+n(ex.kotsu)+n(ex.other)+n(laborObj.total||ex.labor);const money=simple.money||{};const deposit=n(money.deposit),unpaid=n(money.unpaid);const settlement=simple.settlement||{};let staffPay=0;const sp=settlement.staffPayments||[];if(Array.isArray(sp))sp.forEach(x=>staffPay+=n((x&&x.amount)!=null?x.amount:(x&&x.rate)));else if(sp&&typeof sp==='object')Object.values(sp).forEach(x=>staffPay+=n((x&&x.amount)!=null?x.amount:(x&&x.rate)));const expense=baseExpense+staffPay;const profit=sales-expense;const cash=profit-deposit-unpaid;return{sales,expense,profit,deposit,cash,unpaid}}
function eventRows(ev){const out=[];const days=ev&&ev.sales&&ev.sales.days&&typeof ev.sales.days==='object'?ev.sales.days:null;if(days&&Object.keys(days).length){Object.keys(days).forEach(ds=>{const d=days[ds]||{},simple=d.simple||d,m=simpleSummary(simple);out.push({id:String(ev.id||'')+'_'+ds,date:ds,eventName:ev.name||'イベント',note:(simple.money&&simple.money.note)||simple.memo||'',updatedBy:simple.updatedBy||'',updatedAt:simple.updatedAt||'',...m})})}else{const simple=(ev.sales&&ev.sales.simple)||{};if(simple&&Object.keys(simple).length){const m=simpleSummary(simple);out.push({id:String(ev.id||''),date:simple.date||ev.date||'',eventName:ev.name||'イベント',note:(simple.money&&simple.money.note)||simple.memo||'',updatedBy:simple.updatedBy||'',updatedAt:simple.updatedAt||'',...m})}}return out}function allRows(){return events.flatMap(eventRows)}
function render(){const month=monthFilter.value,st=statusFilter.value,q=searchFilter.value.trim().toLowerCase();let list=allRows().filter(r=>{if(month&&!String(r.date||'').startsWith(month))return false;const done=n(r.unpaid)<=0&&(n(r.sales)>0||n(r.expense)>0||n(r.deposit)>0);if(st==='done'&&!done)return false;if(st==='pending'&&done)return false;if(q&&!(String(r.eventName)+' '+String(r.note)).toLowerCase().includes(q))return false;return true}).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));const totals=list.reduce((s,r)=>{s.sales+=n(r.sales);s.expense+=n(r.expense);s.profit+=n(r.profit);s.deposit+=n(r.deposit);s.cash+=n(r.cash);s.unpaid+=n(r.unpaid);const done=n(r.unpaid)<=0&&(n(r.sales)>0||n(r.expense)>0||n(r.deposit)>0);done?s.done++:s.pending++;return s},{sales:0,expense:0,profit:0,deposit:0,cash:0,unpaid:0,done:0,pending:0});kSales.textContent=yen(totals.sales);kExpense.textContent=yen(totals.expense);kProfit.textContent=yen(totals.profit);kDeposit.textContent=yen(totals.deposit);kCash.textContent=yen(totals.cash);kUnpaid.textContent=yen(totals.unpaid);kDone.textContent=totals.done+'件';kPending.textContent=totals.pending+'件';rows.innerHTML=list.length?list.map(r=>{const done=n(r.unpaid)<=0&&(n(r.sales)>0||n(r.expense)>0||n(r.deposit)>0);return `<tr><td>${esc(r.date)}</td><td><span class="event-name">${esc(r.eventName)}</span><span class="meta">${esc(r.updatedBy||'')} ${esc(r.updatedAt||'')}</span></td><td>${yen(r.sales)}</td><td>${yen(r.expense)}</td><td class="green"><b>${yen(r.profit)}</b></td><td>${yen(r.deposit)}</td><td>${yen(r.cash)}</td><td>${yen(r.unpaid)}</td><td><span class="status-badge ${done?'ok':'warn'}">${done?'精算済':'要確認'}</span></td></tr>`}).join(''):'<tr><td colspan="9" style="text-align:center;padding:30px">該当データがありません</td></tr>'}
async function load(){try{const snap=await db.ref('fujiwara/events').once('value');events=arr(snap.val());render()}catch(e){alert('読込に失敗しました：'+(e.message||e))}}(function(){const now=new Date();monthFilter.value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');load()})();
</script></body></html>
