<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>キングアプリ お金管理</title>
<style>
:root{--gold:#c99718;--bg:#fff8e8;--card:#fffdf7;--ink:#241900;--muted:#6d5a2b;--line:#dec98d;--green:#168a58;--red:#d64242;--blue:#1768c8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff8e8,#f4ead0);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#fff4d7,#ffe8a8,#fff4d7);border-bottom:2px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-weight:900;color:#8a6200}.back{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;text-decoration:none;color:#5b4310;font-weight:900}
main{max-width:1180px;margin:auto;padding:16px 12px 90px}h1{margin:8px 0 4px;font-size:28px}.note{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.kpi{background:var(--card);border:1.8px solid var(--line);border-radius:16px;padding:14px;text-align:center;box-shadow:0 3px 14px rgba(80,55,0,.08)}.kpi .label{font-size:12px;color:var(--muted);font-weight:900}.kpi .num{font-size:25px;font-weight:950;margin-top:4px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}
.card{background:var(--card);border:1.8px solid var(--line);border-radius:16px;padding:12px;margin-top:12px;box-shadow:0 3px 14px rgba(80,55,0,.08)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15px}label{display:block;font-size:11px;color:var(--muted);font-weight:900;margin-bottom:5px}
.table-wrap{overflow-x:auto}.money-table{width:100%;min-width:860px;border-collapse:collapse;background:#fff}.money-table th,.money-table td{border-bottom:1px solid #ead8a8;padding:10px 8px;text-align:left;font-size:13px}.money-table th{background:#fff3d6;color:#4d3a00;font-weight:950}.right{text-align:right!important;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.status{border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;white-space:nowrap}.done{background:#e7f8ee;color:#168a58}.warn{background:#fff4c2;color:#896000}.bad{background:#ffe7e1;color:#b43b25}.empty{text-align:center;color:var(--muted);padding:28px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);border-top:1px solid #eee2ca;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.btn{border:0;border-radius:12px;padding:13px;background:linear-gradient(90deg,#f6bd22,#eba300);font-weight:950;color:#1a1200;font-size:15px}.btn2{background:#fff;border:1.5px solid var(--line);color:#5b4310}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}h1{font-size:24px}.kpi .num{font-size:21px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
</head>
<body>
<header><div class="logo">♛ KING APP</div><a class="back" href="king.html">戻る</a></header>
<main>
<h1>💰 お金管理</h1>
<div class="note">メインアプリのリーダー入力を集計します。売上・経費・利益・預金・手元残・未精算が一目で分かります。</div>
<div class="kpis">
 <div class="kpi"><div class="label">総売上</div><div class="num" id="kSales">¥0</div></div>
 <div class="kpi"><div class="label">総経費</div><div class="num red" id="kExpense">¥0</div></div>
 <div class="kpi"><div class="label">総利益</div><div class="num green" id="kProfit">¥0</div></div>
 <div class="kpi"><div class="label">総預金</div><div class="num blue" id="kDeposit">¥0</div></div>
</div>
<div class="kpis">
 <div class="kpi"><div class="label">手元残 合計</div><div class="num" id="kCash">¥0</div></div>
 <div class="kpi"><div class="label">未精算 合計</div><div class="num red" id="kUnpaid">¥0</div></div>
 <div class="kpi"><div class="label">精算済</div><div class="num green" id="kDone">0件</div></div>
 <div class="kpi"><div class="label">要確認</div><div class="num red" id="kCheck">0件</div></div>
</div>
<section class="card">
 <div class="filters">
  <div><label>月で絞り込み</label><input type="month" id="monthFilter" onchange="render()"></div>
  <div><label>状態</label><select id="statusFilter" onchange="render()"><option value="all">すべて</option><option value="done">精算済</option><option value="check">要確認</option><option value="unpaid">未精算あり</option></select></div>
  <div><label>検索</label><input id="searchBox" placeholder="イベント名・メモ" oninput="render()"></div>
 </div>
</section>
<section class="card table-wrap">
 <table class="money-table"><thead><tr><th>日付</th><th>イベント</th><th class="right">売上</th><th class="right">経費</th><th class="right">利益</th><th class="right">預金</th><th class="right">手元残</th><th class="right">未精算</th><th>状態</th><th>メモ</th></tr></thead><tbody id="moneyBody"><tr><td colspan="10" class="empty">読み込み中...</td></tr></tbody></table>
</section>
</main>
<div class="bottom"><button class="btn btn2" onclick="location.href='king.html'">♛ キングへ戻る</button><button class="btn" onclick="render()">🔄 更新</button></div>
<script>
const config={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:8ff756d645bc0398956a94"};
if(typeof firebase!=="undefined"&&!firebase.apps.length)firebase.initializeApp(config);
let rows=[];
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function num(v){return Number(String(v||0).replace(/[^0-9.-]/g,''))||0}
function calcItems(items){let t=0;items=items||{};Object.keys(items).forEach(k=>t+=num(items[k]));return t}
function calcExpense(simple){simple=simple||{};let labor=0;if(simple.labor){Object.keys(simple.labor).forEach(k=>labor+=num(simple.labor[k]))}return num(simple.basho)+num(simple.shiire)+num(simple.kotsu)+num(simple.other)+labor}
function fromEvent(ev){let s=(ev.sales&&ev.sales.simple)||{};let money=s.money||{};let sales=num(ev.sales&&ev.sales.total)||calcItems(s.items);let expense=calcExpense(s);let profit=sales-expense;let deposit=num(money.deposit);let unpaid=num(money.unpaid);let cash=Math.max(profit-deposit-unpaid,0);return {id:String(ev.id||''),date:s.date||ev.date||'',eventName:ev.name||'',sales,expense,profit,deposit,cash,unpaid,note:money.note||s.memo||'',updatedBy:s.updatedBy||'',updatedAt:s.updatedAt||''}}
function statusOf(r){if(r.unpaid>0)return {key:'unpaid',label:'未精算あり',cls:'bad'};if(r.profit>0 && r.deposit===0)return {key:'check',label:'要確認',cls:'warn'};return {key:'done',label:'精算済',cls:'done'}}
function connect(){firebase.database().ref('fujiwara/events').on('value',snap=>{const v=snap.val()||[];const arr=Array.isArray(v)?v:Object.values(v);rows=arr.filter(Boolean).map(fromEvent).filter(r=>r.sales||r.expense||r.deposit||r.unpaid||r.note);render();});}
function filtered(){let a=rows.slice().sort((x,y)=>String(y.date).localeCompare(String(x.date)));let m=document.getElementById('monthFilter').value;if(m)a=a.filter(r=>String(r.date||'').startsWith(m));let st=document.getElementById('statusFilter').value;if(st!=='all')a=a.filter(r=>statusOf(r).key===st);let q=document.getElementById('searchBox').value.toLowerCase();if(q)a=a.filter(r=>(r.eventName+' '+r.note+' '+r.updatedBy).toLowerCase().includes(q));return a}
function render(){let a=filtered();let sums=a.reduce((o,r)=>{o.sales+=r.sales;o.expense+=r.expense;o.profit+=r.profit;o.deposit+=r.deposit;o.cash+=r.cash;o.unpaid+=r.unpaid;let st=statusOf(r).key;if(st==='done')o.done++;else o.check++;return o},{sales:0,expense:0,profit:0,deposit:0,cash:0,unpaid:0,done:0,check:0});
kSales.textContent=yen(sums.sales);kExpense.textContent=yen(sums.expense);kProfit.textContent=yen(sums.profit);kDeposit.textContent=yen(sums.deposit);kCash.textContent=yen(sums.cash);kUnpaid.textContent=yen(sums.unpaid);kDone.textContent=sums.done+'件';kCheck.textContent=sums.check+'件';
if(!a.length){moneyBody.innerHTML='<tr><td colspan="10" class="empty">お金管理データがまだありません。メインアプリの売上・経費で保存してください。</td></tr>';return}
moneyBody.innerHTML=a.map(r=>{let st=statusOf(r);return `<tr><td>${esc(r.date)}</td><td><b>${esc(r.eventName||'イベント未設定')}</b><br><small>${esc(r.updatedBy||'')} ${esc(r.updatedAt||'')}</small></td><td class="right">${yen(r.sales)}</td><td class="right">${yen(r.expense)}</td><td class="right" style="font-weight:900;color:${r.profit>=0?'var(--green)':'var(--red)'}">${yen(r.profit)}</td><td class="right">${yen(r.deposit)}</td><td class="right">${yen(r.cash)}</td><td class="right">${yen(r.unpaid)}</td><td><span class="status ${st.cls}">${st.label}</span></td><td>${esc(r.note)}</td></tr>`}).join('')}
connect();
</script>
</body>
</html>
