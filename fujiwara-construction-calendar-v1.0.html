<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUJIWARA 建設カレンダー v1.0</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7;color:#172033}header{background:#1f3a5f;color:#fff;text-align:center;padding:18px}main{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day,.head{background:#fff;border:1px solid #d6dde8;border-radius:10px;min-height:88px;padding:6px;font-size:13px}.head{min-height:auto;text-align:center;font-weight:bold;background:#1f3a5f;color:#fff}.num{font-weight:900}.job{margin-top:4px;background:#e8f1ff;border-left:4px solid #1f3a5f;border-radius:6px;padding:4px;font-size:12px}input,textarea,button{width:100%;font-size:16px;padding:10px;margin-top:8px;border-radius:10px;border:1px solid #ccd3dd}button{background:#1f3a5f;color:#fff;border:0;font-weight:bold}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{display:flex;gap:8px;align-items:center;justify-content:space-between}.small{font-size:12px;color:#666}
</style></head><body><header><h1>🏗 FUJIWARA 建設カレンダー v1.0</h1><p>現場予定・作業員・日報予定管理</p></header><main>
<div class="card nav"><button onclick="moveMonth(-1)">← 前月</button><h2 id="monthTitle"></h2><button onclick="moveMonth(1)">翌月 →</button></div>
<div class="card"><h3>現場予定を登録</h3><div class="row"><input id="date" type="date"><input id="site" placeholder="現場名"></div><input id="client" placeholder="元請・取引先"><div class="row"><input id="start" type="time"><input id="workers" placeholder="作業員"></div><textarea id="work" placeholder="作業内容・持ち物・注意事項"></textarea><button onclick="addJob()">予定を保存</button></div>
<div class="card"><div class="grid" id="calendarHead"></div><div class="grid" id="calendar"></div></div>
<div class="card"><h3>選択日の予定</h3><div id="selectedList">日付を選択してください</div></div>
</main><script>
let current=new Date();let selectedDate="";
function loadJobs(){return JSON.parse(localStorage.getItem("fks_construction_calendar")||"[]")}
function saveJobs(v){localStorage.setItem("fks_construction_calendar",JSON.stringify(v));localStorage.setItem("fks_last_saved",new Date().toLocaleString())}
function fmt(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+day}
function addJob(){if(!date.value||!site.value){alert("日付と現場名を入力してください");return}const jobs=loadJobs();jobs.push({id:Date.now(),date:date.value,site:site.value,client:client.value,start:start.value,workers:workers.value,work:work.value});saveJobs(jobs);site.value=client.value=start.value=workers.value=work.value="";render();alert("保存しました")}
function delJob(id){if(confirm("削除しますか？")){saveJobs(loadJobs().filter(x=>x.id!==id));render();showDay(selectedDate)}}
function moveMonth(n){current.setMonth(current.getMonth()+n);render()}
function showDay(ds){selectedDate=ds;const jobs=loadJobs().filter(x=>x.date===ds);selectedList.innerHTML=jobs.length?jobs.map(j=>'<div class="card"><b>'+j.site+'</b><br><span class="small">'+(j.start||"-")+' / '+(j.client||"-")+'</span><br>作業員：'+(j.workers||"-")+'<br>内容：'+(j.work||"-")+'<br><button onclick="delJob('+j.id+')">削除</button></div>').join(""):"予定なし"}
function render(){const y=current.getFullYear(),m=current.getMonth();monthTitle.textContent=y+"年 "+(m+1)+"月";calendarHead.innerHTML=["日","月","火","水","木","金","土"].map(x=>'<div class="head">'+x+'</div>').join("");const first=new Date(y,m,1),last=new Date(y,m+1,0);const jobs=loadJobs();let html="";for(let i=0;i<first.getDay();i++)html+="<div></div>";for(let d=1;d<=last.getDate();d++){const dt=new Date(y,m,d),ds=fmt(dt);const dayJobs=jobs.filter(x=>x.date===ds);html+='<div class="day" onclick="showDay(\''+ds+'\')"><div class="num">'+d+'</div>'+dayJobs.slice(0,3).map(j=>'<div class="job">'+(j.start||"")+" "+j.site+'</div>').join("")+(dayJobs.length>3?'<div class="small">他'+(dayJobs.length-3)+'件</div>':"")+'</div>'}calendar.innerHTML=html}
render();
</script></body></html>
