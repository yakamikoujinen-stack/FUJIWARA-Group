<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIYU Ver.2 - FUJIWARA Group</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif;background:linear-gradient(180deg,#fff7fb,#eef9ff,#fff8ec);color:#173052}.wrap{max-width:940px;margin:auto;padding:14px 14px 92px}.card{background:rgba(255,255,255,.93);border:1px solid #fff;border-radius:26px;box-shadow:0 12px 30px rgba(45,68,100,.13);margin-bottom:14px}.header{padding:18px;display:flex;gap:14px;align-items:center}.face{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;font-size:45px;background:#fff0f6;border:1px solid #ffd2df;flex:0 0 auto}h1{margin:0;color:#ef5f8c;font-size:28px}p{margin:7px 0 0;color:#66758b;font-weight:700;line-height:1.5}.back{margin-left:auto;border:0;border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,#f4c744,#d6a21c);font-weight:900}.dash,.quick{padding:14px}.dash h2,.quick h2{margin:0 0 10px;color:#0a51ad;font-size:18px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#fff;border-radius:18px;padding:12px;text-align:center;border:1px solid #edf2f7}.kpi b{display:block;font-size:25px;color:#ef5f8c}.kpi small{color:#66758b;font-weight:800}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.qbtn{border:0;border-radius:18px;background:#fff;padding:12px 8px;font-size:14px;font-weight:900;color:#173052;box-shadow:0 6px 14px rgba(70,90,120,.08)}.qbtn span{display:block;font-size:28px;margin-bottom:4px}.chat{overflow:hidden}.chat-head{padding:14px 16px;background:linear-gradient(90deg,#ffedf4,#eef8ff);border-bottom:1px solid #e9eef6;display:flex;justify-content:space-between;font-weight:900}.status{font-size:12px;color:#188653;background:#e8fff3;border:1px solid #c7f5df;border-radius:999px;padding:6px 10px}.messages{height:50vh;min-height:360px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:12px 14px;border-radius:20px;line-height:1.65;font-size:15px;white-space:pre-wrap;box-shadow:0 4px 12px rgba(70,90,120,.08)}.miyu{align-self:flex-start;background:#fff;border:1px solid #ffe0ec;border-top-left-radius:6px}.user{align-self:flex-end;background:linear-gradient(135deg,#67b7ff,#2f90f0);color:#fff;border-top-right-radius:6px}.meta{font-size:11px;color:#8390a3;margin-top:5px}.user .meta{color:rgba(255,255,255,.82)}.input-area{border-top:1px solid #e9eef6;padding:12px;display:grid;grid-template-columns:46px 1fr 74px;gap:8px;background:#fff}.input-area button,.input-area input{border-radius:16px;border:1px solid #dfe6f0;font-size:16px}.input-area input{padding:13px}.voice{background:#fff7fb;color:#ef5f8c;font-size:22px!important}.send{border:0!important;background:linear-gradient(135deg,#ff7fa8,#ef5f8c);color:#fff;font-weight:900}.clear{width:100%;border:1px solid #ffd2df;background:#fff;color:#ef5f8c;border-radius:14px;padding:11px;font-weight:900}.note{text-align:center;color:#66758b;font-size:12px;line-height:1.6}@media(max-width:700px){.header{align-items:flex-start}.back{font-size:12px;padding:10px}.quick-grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.messages{height:52vh;min-height:340px}.input-area{grid-template-columns:44px 1fr 62px}}
</style>
</head>
<body>
<main class="wrap">
<section class="card header"><div class="face">👩‍💼</div><div><h1>MIYU 秘書 Ver.2</h1><p>相棒の会社状況を見ながら返事する、FUJIWARA Group専属の相談窓口です。</p></div><button class="back" onclick="location.href='king.html'">👑 戻る</button></section>
<section class="card dash"><h2>今日の会社状況</h2><div class="kpis"><div class="kpi"><b id="kpiOffice">0</b><small>事務員 出勤中</small></div><div class="kpi"><b>3</b><small>今日の予定</small></div><div class="kpi"><b>¥258k</b><small>売上速報</small></div><div class="kpi"><b>3</b><small>注意在庫</small></div></div></section>
<section class="card quick"><h2>すぐ相談</h2><div class="quick-grid"><button class="qbtn" onclick="askQuick('今日の予定')"><span>📅</span>今日の予定</button><button class="qbtn" onclick="askQuick('明日の準備')"><span>🧺</span>明日の準備</button><button class="qbtn" onclick="askQuick('売上確認')"><span>💰</span>売上確認</button><button class="qbtn" onclick="askQuick('事務員の出勤')"><span>🌸</span>事務員の出勤</button><button class="qbtn" onclick="askQuick('建設日報')"><span>👷</span>建設日報</button><button class="qbtn" onclick="askQuick('在庫確認')"><span>📦</span>在庫確認</button></div></section>
<section class="card chat"><div class="chat-head"><span>💬 MIYU相談チャット</span><span class="status">● Ver.2 稼働中</span></div><div class="messages" id="messages"></div><div class="input-area"><button class="voice" onclick="alert('音声入力は次に追加するで')">🎤</button><input id="input" placeholder="例：事務員の出勤は？ 明日の準備は？" onkeydown="if(event.key==='Enter')sendMsg()"><button class="send" onclick="sendMsg()">送信</button></div></section>
<button class="clear" onclick="clearHistory()">会話履歴を消す</button><p class="note">※ Ver.2は端末内データ＋固定ダッシュボード回答です。次はFirebase共有と本AI連携。</p>
</main>
<script>
const STORE_KEY='miyu_chat_history_v2';
function nowText(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function getHistory(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){return[]}}
function saveHistory(arr){localStorage.setItem(STORE_KEY,JSON.stringify(arr.slice(-100)))}
function officeRows(){try{let a=JSON.parse(localStorage.getItem('office_timecard')||'[]');return Array.isArray(a)?a.filter(r=>r.date===todayKey()):[]}catch(e){return[]}}
function officeActive(){return officeRows().filter(r=>r.inTime&&!r.outTime)}
function updateKpi(){document.getElementById('kpiOffice').textContent=officeActive().length}
function addMessage(who,text,save=true){const box=document.getElementById('messages');const div=document.createElement('div');div.className='msg '+(who==='user'?'user':'miyu');div.innerHTML=escapeHtml(text)+'<div class="meta">'+(who==='user'?'相棒':'MIYU')+'・'+nowText()+'</div>';box.appendChild(div);box.scrollTop=box.scrollHeight;if(save){const arr=getHistory();arr.push({who,text,time:Date.now()});saveHistory(arr)}}
function loadHistory(){const arr=getHistory();if(arr.length){arr.forEach(x=>addMessage(x.who,x.text,false))}else addMessage('miyu','おはようございます、相棒😊\nMIYU Ver.2です。\n\n今日から少し会社の状況を見ながら返事します。\n「明日の準備」「事務員の出勤」「在庫確認」など聞いてください。',true)}
function askQuick(text){document.getElementById('input').value=text;sendMsg()}
function sendMsg(){const input=document.getElementById('input');const text=input.value.trim();if(!text)return;input.value='';addMessage('user',text,true);setTimeout(()=>addMessage('miyu',reply(text),true),300)}
function reply(text){const t=text.replace(/\s/g,'').toLowerCase();
if(t.includes('明日')||t.includes('準備'))return '明日の準備チェックです。\n\n✅ スタッフ配置確認\n✅ 牛串・イカ焼き・かき氷の材料確認\n✅ 氷・カップ・割り箸の補充\n✅ 車両の積み込み確認\n✅ 天気確認\n\n相棒への提案：出発前に「忘れ物チェック」をキングアプリに作るとかなり便利です。';
if(t.includes('今日')&&t.includes('予定'))return '今日の予定です。\n\n📅 A会場：10:00 からあげ・牛串・カステラ\n📅 B会場：11:00 牛串・いか焼き・とんかつ\n👷 建設：09:00 ○○様邸 外構工事\n\n次はメインアプリの実データから自動で読み取る形にします。';
if(t.includes('売上'))return '本日の売上速報です。\n\n💰 合計：258,750円\n🎪 イベント：198,750円\n👷 建設：60,000円\n\n今はトップ画面の表示値です。次はイベント売上データから自動集計します。';
if(t.includes('事務')||t.includes('出勤')||t.includes('タイムカード')){const rows=officeRows();if(!rows.length)return '今日の事務員タイムカードは、この端末にはまだありません。\n\n事務員さんの別端末入力をキングアプリへ反映するには、次にFirebase共有版へ進める必要があります。';const active=officeActive().length;return '今日の事務員タイムカードです。\n\n出勤中：'+active+'名\n\n'+rows.map(r=>`🌸 ${r.staff||'名前未入力'}：${r.outTime?'退勤済':r.inTime?'出勤中':'未出勤'}\n出勤 ${r.inTime||'-'} / 退勤 ${r.outTime||'-'} / 休憩 ${r.breakMin||0}分`).join('\n\n')}
if(t.includes('建設')||t.includes('日報'))return '建設アプリは確認できます。\n\n👷 construction.html\n・予定\n・日報\n・管理者ページ\n・Firebase共有\n\n次はMIYUから「今日の日報件数」「現場名」「作業員」を答えられるようにします。';
if(t.includes('在庫'))return '在庫の注意リストです。\n\n📦 牛串：残りわずか\n📦 氷：イベント前に必ず確認\n📦 カップ・割り箸：補充確認\n\n次はストッカー位置図と冷蔵庫管理をMIYUから確認できるようにします。';
if(t.includes('次')||t.includes('優先'))return '次に優先するならこれです。\n\n1️⃣ 事務員タイムカードをFirebase共有化\n2️⃣ MIYUに実データを読ませる\n3️⃣ 在庫ストッカー位置図を追加\n4️⃣ リーダールーム強化\n\n相棒にはまず①がおすすめです。';
return '相棒、内容は受け取りました。\n\n今のMIYU Ver.2では、\n📅 今日の予定\n🧺 明日の準備\n💰 売上確認\n🌸 事務員の出勤\n👷 建設日報\n📦 在庫確認\nに答えられます。'}
function clearHistory(){if(!confirm('会話履歴を消しますか？'))return;localStorage.removeItem(STORE_KEY);messages.innerHTML='';loadHistory()}
updateKpi();loadHistory();setInterval(updateKpi,10000);
</script>
</body>
</html>
