<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIYU 秘書 - FUJIWARA Group</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(180deg,#fff7fb,#eef9ff,#fff8ec);color:#173052}
.wrap{max-width:900px;margin:auto;padding:14px 14px 90px}
.header,.quick,.chat{background:rgba(255,255,255,.92);border:1px solid #fff;border-radius:26px;box-shadow:0 12px 30px rgba(45,68,100,.13);margin-bottom:14px}
.header{padding:18px;display:flex;gap:14px;align-items:center}
.face{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;font-size:45px;background:#fff0f6;border:1px solid #ffd2df}
h1{margin:0;color:#ef5f8c;font-size:28px}
p{margin:7px 0 0;color:#66758b;font-weight:700;line-height:1.5}
.back{margin-left:auto;border:0;border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,#f4c744,#d6a21c);font-weight:900}
.quick{padding:14px}.quick h2{margin:0 0 10px;color:#0a51ad;font-size:18px}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qbtn{border:0;border-radius:18px;background:#fff;padding:12px 8px;font-size:14px;font-weight:900;color:#173052;box-shadow:0 6px 14px rgba(70,90,120,.08)}
.qbtn span{display:block;font-size:28px;margin-bottom:4px}
.chat{overflow:hidden}.chat-head{padding:14px 16px;background:linear-gradient(90deg,#ffedf4,#eef8ff);border-bottom:1px solid #e9eef6;display:flex;justify-content:space-between;font-weight:900}
.status{font-size:12px;color:#188653;background:#e8fff3;border:1px solid #c7f5df;border-radius:999px;padding:6px 10px}
.messages{height:54vh;min-height:380px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:12px 14px;border-radius:20px;line-height:1.65;font-size:15px;white-space:pre-wrap;box-shadow:0 4px 12px rgba(70,90,120,.08)}
.miyu{align-self:flex-start;background:#fff;border:1px solid #ffe0ec;border-top-left-radius:6px}
.user{align-self:flex-end;background:linear-gradient(135deg,#67b7ff,#2f90f0);color:#fff;border-top-right-radius:6px}
.meta{font-size:11px;color:#8390a3;margin-top:5px}.user .meta{color:rgba(255,255,255,.82)}
.input-area{border-top:1px solid #e9eef6;padding:12px;display:grid;grid-template-columns:46px 1fr 74px;gap:8px;background:#fff}
.input-area button,.input-area input{border-radius:16px;border:1px solid #dfe6f0;font-size:16px}
.input-area input{padding:13px}.voice{background:#fff7fb;color:#ef5f8c;font-size:22px!important}.send{border:0!important;background:linear-gradient(135deg,#ff7fa8,#ef5f8c);color:#fff;font-weight:900}
.clear{width:100%;border:1px solid #ffd2df;background:#fff;color:#ef5f8c;border-radius:14px;padding:11px;font-weight:900}
.note{text-align:center;color:#66758b;font-size:12px;line-height:1.6}
@media(max-width:640px){.header{align-items:flex-start}.back{font-size:12px;padding:10px}.quick-grid{grid-template-columns:repeat(2,1fr)}.messages{height:56vh;min-height:350px}.input-area{grid-template-columns:44px 1fr 62px}}
</style>
</head>
<body>
<main class="wrap">
<section class="header">
  <div class="face">👩‍💼</div>
  <div>
    <h1>MIYU 秘書</h1>
    <p>FUJIWARA Group専属の相談窓口。予定・売上・事務・建設の確認を手伝います。</p>
  </div>
  <button class="back" onclick="location.href='king.html'">👑 戻る</button>
</section>

<section class="quick">
  <h2>すぐ相談</h2>
  <div class="quick-grid">
    <button class="qbtn" onclick="askQuick('今日の予定')"><span>📅</span>今日の予定</button>
    <button class="qbtn" onclick="askQuick('売上確認')"><span>💰</span>売上確認</button>
    <button class="qbtn" onclick="askQuick('事務員の出勤')"><span>🌸</span>事務員の出勤</button>
    <button class="qbtn" onclick="askQuick('建設日報')"><span>👷</span>建設日報</button>
    <button class="qbtn" onclick="askQuick('在庫確認')"><span>📦</span>在庫確認</button>
    <button class="qbtn" onclick="askQuick('使い方')"><span>❔</span>使い方</button>
  </div>
</section>

<section class="chat">
  <div class="chat-head"><span>💬 MIYU相談チャット</span><span class="status">● 準備OK</span></div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <button class="voice" onclick="alert('音声入力は次に追加するで')">🎤</button>
    <input id="input" placeholder="例：今日の予定は？" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send" onclick="sendMsg()">送信</button>
  </div>
</section>
<button class="clear" onclick="clearHistory()">会話履歴を消す</button>
<p class="note">※ Ver.1は簡易MIYUです。ChatGPT連携は次段階で追加します。</p>
</main>

<script>
const STORE_KEY="miyu_chat_history_v1";
function nowText(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function getHistory(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||"[]")}catch(e){return[]}}
function saveHistory(arr){localStorage.setItem(STORE_KEY,JSON.stringify(arr.slice(-80)))}
function addMessage(who,text,save=true){
  const box=document.getElementById("messages");
  const div=document.createElement("div");
  div.className="msg "+(who==="user"?"user":"miyu");
  div.innerHTML=escapeHtml(text)+'<div class="meta">'+(who==="user"?"相棒":"MIYU")+'・'+nowText()+'</div>';
  box.appendChild(div);box.scrollTop=box.scrollHeight;
  if(save){const arr=getHistory();arr.push({who,text,time:Date.now()});saveHistory(arr)}
}
function loadHistory(){
  const arr=getHistory();
  if(arr.length){arr.forEach(x=>addMessage(x.who,x.text,false))}
  else addMessage("miyu","おはようございます、相棒😊\nMIYUです。\n\n「今日の予定」「売上確認」「事務員の出勤」など聞いてください。",true)
}
function askQuick(text){document.getElementById("input").value=text;sendMsg()}
function sendMsg(){
  const input=document.getElementById("input");const text=input.value.trim();if(!text)return;
  input.value="";addMessage("user",text,true);setTimeout(()=>addMessage("miyu",reply(text),true),300)
}
function reply(text){
  const t=text.replace(/\s/g,"").toLowerCase();
  if(t.includes("今日")&&t.includes("予定"))return "今日の予定です。\n\n📅 A会場：10:00 からあげ・牛串・カステラ\n📅 B会場：11:00 牛串・いか焼き・とんかつ\n👷 建設：09:00 ○○様邸 外構工事\n\n※次にメインアプリの実データ連携を追加します。";
  if(t.includes("売上"))return "本日の売上速報です。\n\n💰 合計：258,750円\n🎪 イベント：198,750円\n👷 建設：60,000円\n\n※今はキングアプリ表示値です。";
  if(t.includes("事務")||t.includes("出勤")||t.includes("タイムカード")){
    let arr=[];try{arr=JSON.parse(localStorage.getItem("office_timecard")||"[]")}catch(e){arr=[]}
    const rows=arr.filter(r=>r.date===todayKey());
    if(!rows.length)return "今日の事務員タイムカードは、この端末にはまだありません。\n\n別端末の事務員さんの入力を共有するには、次にFirebase共有版へ変更が必要です。";
    return "今日の事務員タイムカードです。\n\n"+rows.map(r=>`🌸 ${r.staff||"名前未入力"}：${r.outTime?"退勤済":r.inTime?"出勤中":"未出勤"}\n出勤 ${r.inTime||"-"} / 退勤 ${r.outTime||"-"} / 休憩 ${r.breakMin||0}分`).join("\n\n");
  }
  if(t.includes("建設")||t.includes("日報"))return "建設アプリは construction.html で確認できます。\n\n次にMIYUが日報件数や現場名を直接答えられるようにします。";
  if(t.includes("在庫"))return "在庫確認ですね。\n\n📦 牛串：残りわずか\n📦 氷：イベント前に確認\n📦 カップ・割り箸：補充確認\n\n次に在庫データと連携します。";
  if(t.includes("使い方")||t.includes("何ができる"))return "MIYUで今できることです。\n\n📅 今日の予定\n💰 売上確認\n🌸 事務員の出勤確認\n👷 建設アプリ案内\n📦 在庫確認";
  return "相棒、内容は受け取りました。\n\n今のMIYU Ver.1では、\n「今日の予定」\n「売上確認」\n「事務員の出勤」\n「建設日報」\n「在庫確認」\nに答えられます。";
}
function clearHistory(){if(!confirm("会話履歴を消しますか？"))return;localStorage.removeItem(STORE_KEY);messages.innerHTML="";loadHistory()}
loadHistory();
</script>
</body>
</html>
