<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>繁夫・繁充 日当精算表</title><style>body{font-family:sans-serif;background:#fff9e8;margin:0;color:#292316}header{background:#f2c43d;padding:16px}main{padding:14px;max-width:1000px;margin:auto}.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,.form,.table{background:white;border:1px solid #d6b653;border-radius:12px;padding:12px}.card b{display:block;font-size:12px}.card strong{font-size:20px}.form{display:grid;grid-template-columns:1fr 2fr 1fr 1fr auto;gap:8px;margin:12px 0;align-items:end}input,select,button{font:inherit;padding:9px;width:100%;box-sizing:border-box}button{background:#c99b08;color:white;border:0;border-radius:8px;font-weight:bold}.table{overflow:auto;padding:0}table{width:100%;min-width:780px;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee0b5;text-align:right}th{background:#fff2c2}th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}.red{color:#c92525;font-weight:bold}.green{color:#18703d;font-weight:bold}.del{background:#fff0f0;color:#b22;border:1px solid #e5aaaa}.note{font-size:12px;color:#685e45}@media(max-width:700px){.sum{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.wide,.form button{grid-column:1/-1}}</style><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script></head><body><header><h2>💰 繁夫・繁充 日当精算表</h2><div>独立管理｜日当 1日 5,500円</div></header><main><div class="sum"><div class="card"><b>出勤日数</b><strong id="days">0日</strong></div><div class="card"><b>本来の日当合計</b><strong id="due">¥0</strong></div><div class="card"><b>支払済合計</b><strong id="paid">¥0</strong></div><div class="card"><b>未払い合計</b><strong id="unpaid" class="red">¥0</strong></div></div><div class="form"><div><label>日付</label><input id="date" type="date"></div><div class="wide"><label>イベント・現場名</label><input id="event"></div><div><label>名前</label><select id="person"><option>繁充</option><option>繁夫</option></select></div><div><label>支払済額</label><input id="pay" type="number" min="0" value="0"></div><button onclick="addRow()">＋追加</button></div><div class="table"><table><thead><tr><th>日付</th><th>イベント・現場</th><th>名前</th><th>日当</th><th>支払済</th><th>未払い</th><th>過払い</th><th>状態</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div style="margin:12px 0"><button onclick="importPast()" style="max-width:340px">📥 この端末の過去データを読み込む</button><div id="importMsg" class="note">KING・メインには書き戻しません。端末内に既に保存されている労務データを読み取り、繁夫／繁充だけをこの独立表へコピーします。</div></div><p class="note">繁夫・繁充は同じ精算対象として集計。1行＝1出勤日。この表からKING・メイン・Firebaseへの書き込みは行いません。</p></main><script>const RATE=5500,KEY="shigemitsu_standalone_v1";let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(data))data=[]}catch(e){data=[]}function yen(n){return "¥"+Number(n||0).toLocaleString("ja-JP")}function esc(s){let d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function addRow(){let d=document.getElementById("date").value,e=document.getElementById("event").value.trim(),n=document.getElementById("person").value,p=Math.max(0,Number(document.getElementById("pay").value)||0);if(!d){alert("日付を入力してください");return}data.push({id:Date.now(),date:d,event:e,name:n,paid:p});data.sort((a,b)=>a.date.localeCompare(b.date));save();document.getElementById("event").value="";document.getElementById("pay").value=0;render()}function del(id){if(confirm("この行を削除しますか？")){data=data.filter(x=>x.id!==id);save();render()}}async function importPast(){var msg=document.getElementById("importMsg");msg.textContent="Firebaseの過去データを読み込み中…";try{var config={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:5ec6b7e2a2165066956a94"};if(!firebase.apps.length)firebase.initializeApp(config);var snap=await firebase.database().ref("fujiwara/events").once("value");var raw=snap.val()||[];var events=Array.isArray(raw)?raw:Object.keys(raw).map(function(k){return raw[k]});var found=[];events.forEach(function(ev){if(!ev)return;var days=(ev.sales&&ev.sales.days)||{};var dayKeys=Object.keys(days);if(!dayKeys.length&&ev.sales&&ev.sales.simple){var d=(ev.sales.simple.date||ev.date||"");if(d)days[d]=ev.sales.simple;dayKeys=Object.keys(days)}dayKeys.forEach(function(ds){var rec=days[ds]||{},simple=rec.simple||rec,st=(simple&&simple.settlement)||{},ps=Array.isArray(st.staffPayments)?st.staffPayments:[];ps.forEach(function(p,i){var n=String(p.name||"").trim();if(n!=="繁充"&&n!=="繁夫")return;found.push({id:"fb_"+String(ev.id||"")+"_"+ds+"_"+i,date:ds,event:ev.name||"",name:n,paid:p.paid?Math.max(0,Number(p.amount)||0):0,sourceAmount:Math.max(0,Number(p.amount)||0),sourcePaid:!!p.paid})})})});var manual=data.filter(function(x){return String(x.id).indexOf("fb_")!==0&&String(x.id).indexOf("import_")!==0});data=manual.concat(found);data.sort(function(a,b){return String(a.date).localeCompare(String(b.date))});save();render();msg.textContent=found.length?found.length+"件の過去データをFirebaseから読み込みました。支払済チェックがある金額だけを支払済として計算しています。":"Firebaseには接続できましたが、繁夫／繁充名義の過去の支払データは見つかりませんでした。"}catch(e){console.error(e);msg.textContent="Firebaseの読み込みに失敗しました："+(e&&e.message?e.message:"接続エラー")}}
function setRateByIndex(i,v){if(!data[i])return;data[i].rate=Math.max(0,Number(v)||0);save();render()}
function render(){let pt=0,ut=0,dueTotal=0;document.getElementById("rows").innerHTML=data.map(function(x,i){let rate=x.rate===undefined?RATE:Math.max(0,Number(x.rate)||0),p=Number(x.paid)||0,u=Math.max(0,rate-p),o=Math.max(0,p-rate);dueTotal+=rate;pt+=p;ut+=u;let st=u?'<span class="red">未払い</span>':o?'<span class="green">過払い</span>':"精算済";return "<tr><td>"+x.date+"</td><td>"+esc(x.event||"—")+"</td><td>"+esc(x.name)+"</td><td><input type=number min=0 step=500 value="+rate+" onchange='setRateByIndex("+i+",this.value)' style='width:105px;padding:7px;text-align:right'></td><td>"+yen(p)+"</td><td class="+(u?"red":"")+">"+yen(u)+"</td><td class="+(o?"green":"")+">"+yen(o)+"</td><td>"+st+"</td><td><button class=del onclick=del("+x.id+")>削除</button></td></tr>"}).join("");document.getElementById("days").textContent=data.length+"日";document.getElementById("due").textContent=yen(dueTotal);document.getElementById("paid").textContent=yen(pt);document.getElementById("unpaid").textContent=yen(ut)}
render();</script></body></html>
