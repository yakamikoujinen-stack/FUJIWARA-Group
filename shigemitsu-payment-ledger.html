<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>繁夫・繁充 日当精算表</title><style>body{font-family:sans-serif;background:#fff9e8;margin:0;color:#292316}header{background:#f2c43d;padding:16px}main{padding:14px;max-width:1000px;margin:auto}.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,.form,.table{background:white;border:1px solid #d6b653;border-radius:12px;padding:12px}.card b{display:block;font-size:12px}.card strong{font-size:20px}.form{display:grid;grid-template-columns:1fr 2fr 1fr 1fr auto;gap:8px;margin:12px 0;align-items:end}input,select,button{font:inherit;padding:9px;width:100%;box-sizing:border-box}button{background:#c99b08;color:white;border:0;border-radius:8px;font-weight:bold}.table{overflow:auto;padding:0}table{width:100%;min-width:780px;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee0b5;text-align:right}th{background:#fff2c2}th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}.red{color:#c92525;font-weight:bold}.green{color:#18703d;font-weight:bold}.del{background:#fff0f0;color:#b22;border:1px solid #e5aaaa}.note{font-size:12px;color:#685e45}@media(max-width:700px){.sum{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.wide,.form button{grid-column:1/-1}}</style></head><body><header><h2>💰 繁夫・繁充 日当精算表</h2><div>独立管理｜日当 1日 5,500円</div></header><main><div class="sum"><div class="card"><b>出勤日数</b><strong id="days">0日</strong></div><div class="card"><b>本来の日当合計</b><strong id="due">¥0</strong></div><div class="card"><b>支払済合計</b><strong id="paid">¥0</strong></div><div class="card"><b>未払い合計</b><strong id="unpaid" class="red">¥0</strong></div></div><div class="form"><div><label>日付</label><input id="date" type="date"></div><div class="wide"><label>イベント・現場名</label><input id="event"></div><div><label>名前</label><select id="person"><option>繁充</option><option>繁夫</option></select></div><div><label>支払済額</label><input id="pay" type="number" min="0" value="0"></div><button onclick="addRow()">＋追加</button></div><div class="table"><table><thead><tr><th>日付</th><th>イベント・現場</th><th>名前</th><th>日当</th><th>支払済</th><th>未払い</th><th>過払い</th><th>状態</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div style="margin:12px 0"><button onclick="importPast()" style="max-width:340px">📥 この端末の過去データを読み込む</button><div id="importMsg" class="note">KING・メインには書き戻しません。端末内に既に保存されている労務データを読み取り、繁夫／繁充だけをこの独立表へコピーします。</div></div><p class="note">繁夫・繁充は同じ精算対象として集計。1行＝1出勤日。この表からKING・メイン・Firebaseへの書き込みは行いません。</p></main><script>const RATE=5500,KEY="shigemitsu_standalone_v1";let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(data))data=[]}catch(e){data=[]}function yen(n){return "¥"+Number(n||0).toLocaleString("ja-JP")}function esc(s){let d=document.createElement("div");d.textContent=String(s||"");return d.innerHTML}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function addRow(){let d=document.getElementById("date").value,e=document.getElementById("event").value.trim(),n=document.getElementById("person").value,p=Math.max(0,Number(document.getElementById("pay").value)||0);if(!d){alert("日付を入力してください");return}data.push({id:Date.now(),date:d,event:e,name:n,paid:p});data.sort((a,b)=>a.date.localeCompare(b.date));save();document.getElementById("event").value="";document.getElementById("pay").value=0;render()}function del(id){if(confirm("この行を削除しますか？")){data=data.filter(x=>x.id!==id);save();render()}}function importPast(){var src=[];try{var a=JSON.parse(localStorage.getItem("fg_labor_db_v1")||"null");if(a&&Array.isArray(a.events))src=a.events;else{var b=JSON.parse(localStorage.getItem("fujiwara_king_money_ledger")||"[]");if(Array.isArray(b))src=b}}catch(e){}var found=[];src.forEach(function(ev){var ps=Array.isArray(ev.payments)?ev.payments:[];ps.forEach(function(p){var n=String(p.name||"").trim();if(n!=="繁充"&&n!=="繁夫")return;var paid=p.paid?Math.max(0,Number(p.amount)||0):0;found.push({id:"import_"+String(ev.id||ev.eventId||"")+"_"+String(ev.date||ev.eventDate||"")+"_"+n,date:ev.date||ev.eventDate||"",event:ev.eventName||ev.name||"",name:n,paid:paid,sourceAmount:Math.max(0,Number(p.amount)||0),sourcePaid:!!p.paid})})});if(!found.length){document.getElementById("importMsg").textContent="この端末内では、繁夫／繁充の過去の労務データを見つけられませんでした。KINGを普段使っている同じ端末・ブラウザで開いてください。";return}var manual=data.filter(function(x){return String(x.id).indexOf("import_")!==0});data=manual.concat(found);data.sort(function(a,b){return String(a.date).localeCompare(String(b.date))});save();render();document.getElementById("importMsg").textContent=found.length+"件の過去データを読み込みました。支払済チェックのある金額だけを「支払済」として計算しています。"}
function render(){let pt=0,ut=0;document.getElementById("rows").innerHTML=data.map(x=>{let p=Number(x.paid)||0,u=Math.max(0,RATE-p),o=Math.max(0,p-RATE);pt+=p;ut+=u;let st=u?'<span class="red">未払い</span>':o?'<span class="green">過払い</span>':"精算済";return "<tr><td>"+x.date+"</td><td>"+esc(x.event||"—")+"</td><td>"+esc(x.name)+"</td><td>"+yen(RATE)+"</td><td>"+yen(p)+"</td><td class="+(u?"red":"")+">"+yen(u)+"</td><td class="+(o?"green":"")+">"+yen(o)+"</td><td>"+st+"</td><td><button class=del onclick=del("+x.id+")>削除</button></td></tr>"}).join("");document.getElementById("days").textContent=data.length+"日";document.getElementById("due").textContent=yen(data.length*RATE);document.getElementById("paid").textContent=yen(pt);document.getElementById("unpaid").textContent=yen(ut)}render();</script></body></html>
