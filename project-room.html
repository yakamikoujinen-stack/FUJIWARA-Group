<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>プロジェクト管理室 Ver1.1 - FUJIWARA Group</title>
<style>
:root{--ink:#13203a;--sub:#64748b;--line:#dbe4ef;--blue:#2563eb;--green:#16a34a;--gold:#d6a21c;--shadow:0 12px 30px rgba(15,23,42,.10)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(180deg,#eaf2ff,#f8fafc 45%,#fff8eb);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.96);color:#fff;padding:14px 16px}.head{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{font-size:21px;margin:0}.head small{display:block;color:#bfdbfe;font-weight:800;margin-bottom:3px}.back{background:linear-gradient(90deg,#d6a21c,#f3c64f);color:#2b2100;text-decoration:none;border-radius:999px;padding:9px 13px;font-weight:950;font-size:12px}
main{max-width:1100px;margin:auto;padding:16px 14px 80px}.hero{background:linear-gradient(135deg,#1e293b,#1d4ed8);color:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow)}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#dbeafe;line-height:1.65}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.sum{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:12px}.sum b{font-size:24px;display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,input,select,textarea{font:inherit}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.soft{background:#eaf0f7;color:#263245}.danger{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid #fff;border-radius:18px;padding:15px;box-shadow:var(--shadow)}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.title{font-weight:950;font-size:17px}.status{border-radius:999px;padding:5px 9px;font-size:11px;font-weight:950}.ok{background:#dcfce7;color:#166534}.work{background:#fef3c7;color:#92400e}.hold{background:#e2e8f0;color:#475569}.bad{background:#fee2e2;color:#991b1b}.meta{font-size:12px;color:var(--sub);line-height:1.65;margin-top:7px}.next{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}.next b{display:block;color:#075985;margin-bottom:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button,.actions a{border:0;text-decoration:none;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:900}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.show{display:flex}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.dialog h3{margin:0 0 14px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--sub);font-weight:850;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff}.field textarea{min-height:82px}.priority{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#0f172a;color:#fff;font-size:12px;font-weight:950;margin-right:6px}.consult-box{background:linear-gradient(135deg,#f5f3ff,#eff6ff);border:1px solid #c4b5fd;border-radius:14px;padding:12px;margin-top:10px}.consult-box b{display:block;color:#5b21b6;margin-bottom:5px}.consult-text{white-space:pre-wrap;font-size:12px;line-height:1.7;color:#334155}.chat-btn{background:#7c3aed;color:#fff}.copy-btn{background:#0f172a;color:#fff}
@media(max-width:720px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="head"><div><small>👑 FUJIWARA Group</small><h1>📂 プロジェクト管理室</h1></div><a class="back" href="king.html">👑 KINGへ戻る</a></div></header>
<main>
<section class="hero"><h2>すべてのアプリ開発の窓口</h2><p>状態・次にすること・相談チャット名・最終更新日を管理します。</p>
<div class="summary"><div class="sum"><small>登録</small><b id="countAll">0</b></div><div class="sum"><small>開発中</small><b id="countWork">0</b></div><div class="sum"><small>未完了</small><b id="countTodo">0</b></div><div class="sum"><small>要注意</small><b id="countBad">0</b></div></div></section>
<div class="card" style="margin-top:14px;border-left:6px solid #7c3aed">
  <b>💬 相談の始め方</b>
  <div class="meta">対象アプリの「相談開始」を押す → 相談文をコピー → ChatGPTを開く → 貼り付けて送信。</div>
</div>
<div class="toolbar"><button class="btn primary" onclick="addProject()">＋追加</button><button class="btn soft" onclick="exportProjects()">書き出す</button><label class="btn soft">読み込む<input hidden type="file" accept=".json" onchange="importProjects(event)"></label></div>
<div id="projectGrid" class="grid"></div>
</main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog">
<h3 id="dialogTitle">プロジェクト編集</h3><input type="hidden" id="editId">
<div class="field"><label>アプリ名</label><input id="name"></div><div class="field"><label>アイコン</label><input id="icon"></div><div class="field"><label>状態</label><select id="status"><option>運用中</option><option>開発中</option><option>保留</option><option>要注意</option></select></div>
<div class="field"><label>Version</label><input id="version"></div><div class="field"><label>優先順位</label><input id="priority" type="number" min="1"></div><div class="field"><label>次にすること</label><textarea id="next"></textarea></div><div class="field"><label>相談したチャット名</label><input id="chatName"></div><div class="field"><label>最後の相談内容</label><textarea id="lastConsult"></textarea></div><div class="field"><label>開発メモ</label><textarea id="memo"></textarea></div><div class="field"><label>アプリURL</label><input id="url"></div>
<div class="consult-box">
  <b>💬 相談文プレビュー</b>
  <div id="consultPreview" class="consult-text">内容を入力すると相談文が表示されます。</div>
</div>
<div class="actions"><button class="btn primary" onclick="saveProject()">保存</button><button class="btn soft" onclick="closeModal()">閉じる</button><button class="btn danger" id="deleteBtn" onclick="deleteProject()">削除</button></div>
</div></div>
<script>
const KEY='fujiwara_project_room_v1';
const defaults=[
{id:'main',icon:'🛡️',name:'メインアプリ',status:'運用中',version:'',priority:1,next:'追加したい内容を登録',chatName:'メインアプリ専用チャット',lastConsult:'',memo:'最優先',url:'index.html',updated:''},
{id:'construction',icon:'🏗️',name:'建設アプリ',status:'運用中',version:'',priority:2,next:'未完了内容を確認',chatName:'建設アプリ専用チャット',lastConsult:'',memo:'',url:'construction.html',updated:''},
{id:'office',icon:'👥',name:'事務員アプリ',status:'運用中',version:'',priority:3,next:'連動状態を確認',chatName:'事務員アプリ専用チャット',lastConsult:'',memo:'',url:'office-timecard.html',updated:''},
{id:'partner',icon:'🐩',name:'partner',status:'運用中',version:'',priority:4,next:'共有・損益を確認',chatName:'partner専用チャット',lastConsult:'',memo:'',url:'partner.html',updated:''},
{id:'partnermen',icon:'🦍🐷',name:'partner MEN',status:'運用中',version:'',priority:5,next:'ネタ共有を確認',chatName:'partner MEN専用チャット',lastConsult:'',memo:'',url:'partner-men.html',updated:''},
{id:'family',icon:'🏠',name:'家族アプリ',status:'保留',version:'',priority:6,next:'構想整理',chatName:'家族アプリ専用チャット',lastConsult:'',memo:'',url:'family.html',updated:''},
{id:'king',icon:'👑',name:'KINGアプリ',status:'開発中',version:'',priority:7,next:'社長窓口として育てる',chatName:'KING・開発室チャット',lastConsult:'プロジェクト管理室を追加',memo:'毎朝最初に開く',url:'king.html',updated:''},
{id:'dev',icon:'🛠️',name:'開発室',status:'運用中',version:'正式運用版1.0',priority:8,next:'開発時のみ使用',chatName:'KING・開発室チャット',lastConsult:'',memo:'修正前バックアップ必須',url:'system-management.html',updated:''}
];
let projects=load();function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)&&d.length?d:defaults}catch(e){return defaults}}function save(){localStorage.setItem(KEY,JSON.stringify(projects));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function now(){return new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function cls(s){return s==='運用中'?'ok':s==='開発中'?'work':s==='要注意'?'bad':'hold'}
function render(){projects.sort((a,b)=>(Number(a.priority)||99)-(Number(b.priority)||99));countAll.textContent=projects.length;countWork.textContent=projects.filter(x=>x.status==='開発中').length;countTodo.textContent=projects.filter(x=>x.next&&x.next.trim()).length;countBad.textContent=projects.filter(x=>x.status==='要注意').length;projectGrid.innerHTML=projects.map(p=>`<div class="card"><div class="topline"><div><div class="title"><span class="priority">${esc(p.priority||'-')}</span>${esc(p.icon)} ${esc(p.name)}</div><div class="meta">Version ${esc(p.version||'未記録')}<br>最終更新 ${esc(p.updated||'未記録')}</div></div><span class="status ${cls(p.status)}">${esc(p.status)}</span></div><div class="next"><b>📌 次にすること</b>${esc(p.next||'未登録')}</div><div class="meta"><b>💬 相談チャット：</b>${esc(p.chatName||'未登録')}<br><b>最後の相談：</b>${esc(p.lastConsult||'未登録')}<br><b>メモ：</b>${esc(p.memo||'なし')}</div><div class="actions"><button class="soft" onclick="editProject('${p.id}')">編集</button>${p.url?`<a class="success" href="${esc(p.url)}">アプリを開く</a>`:''}<button class="copy-btn" onclick="copyConsult('${p.id}')">相談文コピー</button><button class="chat-btn" onclick="startConsult('${p.id}')">💬 相談開始</button></div></div>`).join('')}
function openModal(){modal.classList.add('show');updateConsultPreview()}
function closeModal(){modal.classList.remove('show')}
function buildConsultText(p){
 return `相棒、${p.name}の続きを進めたい。\n\n【現在の状態】\n${p.status}\n\n【Version】\n${p.version||'未記録'}\n\n【前回の相談】\n${p.lastConsult||'未記録'}\n\n【次にすること】\n${p.next||'未登録'}\n\n【メモ】\n${p.memo||'なし'}\n\n既存機能を壊さず、修正前にバックアップを確認してから進めて。`;
}
function currentFormProject(){
 return {name:name.value.trim()||'このアプリ',status:status.value,version:version.value.trim(),lastConsult:lastConsult.value.trim(),next:next.value.trim(),memo:memo.value.trim()};
}
function updateConsultPreview(){if(typeof consultPreview!=='undefined')consultPreview.textContent=buildConsultText(currentFormProject())}
['name','status','version','lastConsult','next','memo'].forEach(id=>setTimeout(()=>document.getElementById(id)?.addEventListener('input',updateConsultPreview),0));function addProject(){dialogTitle.textContent='追加';editId.value='';name.value='';icon.value='📱';status.value='開発中';version.value='';priority.value=projects.length+1;next.value='';chatName.value='';lastConsult.value='';memo.value='';url.value='';deleteBtn.style.display='none';openModal()}
function editProject(id){const p=projects.find(x=>x.id===id);if(!p)return;dialogTitle.textContent='編集';editId.value=p.id;name.value=p.name||'';icon.value=p.icon||'';status.value=p.status||'開発中';version.value=p.version||'';priority.value=p.priority||99;next.value=p.next||'';chatName.value=p.chatName||'';lastConsult.value=p.lastConsult||'';memo.value=p.memo||'';url.value=p.url||'';deleteBtn.style.display='inline-block';openModal()}
function saveProject(){if(!name.value.trim())return alert('アプリ名を入力して');const id=editId.value||crypto.randomUUID();const p={id,name:name.value.trim(),icon:icon.value.trim()||'📱',status:status.value,version:version.value.trim(),priority:Number(priority.value)||99,next:next.value.trim(),chatName:chatName.value.trim(),lastConsult:lastConsult.value.trim(),memo:memo.value.trim(),url:url.value.trim(),updated:now(),lastConsultDate:(projects.find(x=>x.id===id)?.lastConsultDate||'')};const i=projects.findIndex(x=>x.id===id);if(i>=0)projects[i]=p;else projects.push(p);closeModal();save()}
function deleteProject(){const id=editId.value;if(!id||!confirm('削除する？'))return;projects=projects.filter(x=>x.id!==id);closeModal();save()}
function copyConsult(id){
 const p=projects.find(x=>x.id===id);if(!p)return;
 const s=buildConsultText(p);
 navigator.clipboard?.writeText(s).then(()=>alert('相談文をコピーした')).catch(()=>prompt('コピーして使って',s));
}
function startConsult(id){
 const p=projects.find(x=>x.id===id);if(!p)return;
 const s=buildConsultText(p);
 const done=()=>{if(confirm('相談文をコピーしました。ChatGPTを開く？'))window.open('https://chatgpt.com/','_blank')};
 if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(done).catch(()=>{prompt('この相談文をコピーして',s);window.open('https://chatgpt.com/','_blank')})}
 else{prompt('この相談文をコピーして',s);window.open('https://chatgpt.com/','_blank')}
}
function exportProjects(){const b=new Blob([JSON.stringify(projects,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fujiwara-project-room-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importProjects(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;projects=d;save();alert('読み込み完了')}catch(err){alert('読み込めないファイルです')}};r.readAsText(f)}
render();
</script></body></html>
