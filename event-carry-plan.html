<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>イベント別 持出し振分け｜FUJIWARA Group</title>
<style>
:root{--navy:#19334f;--blue:#276fa7;--gold:#e2ad3b;--line:#d8e3eb;--bg:#f4f8fc;--red:#b53131}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#203044;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:16px}
header{background:linear-gradient(115deg,#17334f,#316e9d);color:white;padding:20px max(16px,calc((100vw - 1040px)/2));}
h1{font-size:clamp(22px,4vw,30px);margin:0 0 4px}header p{margin:0;color:#e5f2ff} @media print{button,.toolbar,.hint,#connection{display:none!important}.card{box-shadow:none;break-inside:avoid}}
main{max-width:1040px;margin:16px auto 90px;padding:0 14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #19334f12}h2{font-size:20px;margin:0 0 12px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{font-weight:700;display:block;margin:0 0 5px;font-size:14px}input,select{width:100%;min-height:46px;border:1.5px solid #b9cada;border-radius:10px;padding:9px;background:white;color:inherit;font:inherit}input[type=checkbox]{width:23px;min-height:23px;vertical-align:middle}
button,.btn{border:0;border-radius:10px;background:var(--blue);color:white;font:inherit;font-weight:700;min-height:45px;padding:9px 15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.secondary{background:#e8f1f7;color:#17334f}.danger{background:#fff0f0;color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hint{background:#eef8ff;border-radius:10px;padding:10px;line-height:1.6;font-size:14px;color:#37536b}
.event{border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}.event h3{margin:0 0 8px;font-size:19px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#f9eabe;margin:4px;font-weight:700}.neta{border-left:4px solid var(--gold);padding:8px 10px;margin:12px 0;background:#fffdf5;border-radius:8px}.neta summary{font-weight:800;cursor:pointer}.item{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(85px,.55fr) minmax(70px,.6fr) minmax(100px,.75fr) auto;align-items:center;gap:8px;border-top:1px solid #eee;padding:9px 0}.item .stock{font-size:13px}.low{color:var(--red);font-weight:800}.ok{color:#197453}.status{padding:11px;border-radius:10px;background:#eef8ff;margin:10px 0}.status.error{background:#ffecec;color:var(--red)}.empty{color:#627386;padding:12px}small{color:#657587}.summary{background:#fff8e8;border-radius:10px;padding:12px;font-weight:700}
@media(max-width:660px){.fields{grid-template-columns:1fr}.item{grid-template-columns:minmax(0,1fr) 88px 72px;gap:5px}.item .stock{grid-column:1/3}.item .remove{grid-column:3;grid-row:2}h2{font-size:18px}}
</style></head>
<body>
<header><h1>📦 イベント別 持出し振分け</h1><p>メインの予定と在庫を見ながら、会場・出店ネタごとに割り振り</p></header>
<main>
<section class="card"><h2>① 日付とイベント</h2><div class="fields"><div><label for="date">日付</label><input id="date" type="date"></div><div><label for="editor">記入者</label><input id="editor" placeholder="例：藤原・文太"></div><div><label>画面</label><div class="toolbar"><a class="btn secondary" href="king.html">👑 キングへ</a><a class="btn secondary" href="manager-app.html">👤 担当者へ</a></div></div></div><div id="connection" class="status">メインアプリのデータを読み込んでいます…</div><div class="hint">メインに登録された日付のイベントを表示します。複数会場はそれぞれ別に編集できます。持出し数は計画で、保存しても倉庫の在庫数は減りません。</div></section>
<section class="card"><h2>② 会場ごとに出店ネタを選ぶ</h2><div id="events"></div></section>
<section class="card"><h2>③ 在庫を見て持出し数を決める</h2><div id="plans"></div><div id="summary" class="summary"></div><div class="toolbar"><button id="save" onclick="savePlan()">💾 振分けを共有保存</button><button class="secondary" onclick="print()">🖨 印刷</button></div><div id="saved" class="status">保存前</div></section>
</main>
<datalist id="all-items"></datalist>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const CONFIG={apiKey:'AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA',authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:5ec6b7e2a2165066956a94'};
const PATH='fujiwara/eventCarryPlansV1';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v.filter(Boolean):v&&typeof v==='object'?Object.values(v).filter(Boolean):[];
function eventList(v){return Object.entries(v||{}).filter(([,e])=>e&&typeof e==='object').map(([node,e])=>({...e,_carryId:String(e.id??e.eventId??node)}))}
function eventName(e){return String(e.name||e.title||'名称なし')}
function matchesCategory(a,b){const x=String(a||'').trim(),y=String(b||'').trim();return x===y||x.replace(/き$/,'')===y.replace(/き$/,'')}
const valid=n=>Number.isFinite(Number(n))&&Number(n)>=0?Number(n):0;
const key=v=>String(v??'').replace(/[.#$\[\]/]/g,'_');
let db,events=[],inv=[],allPlans={},draft={},dirty=false,loading=false,selectedDate='',ready=false;
function setStatus(id,message,error=false){$(id).textContent=message;$(id).classList.toggle('error',error)}
function dateLocal(){const d=new Date(),offset=d.getTimezoneOffset();return new Date(d.getTime()-offset*60000).toISOString().slice(0,10)}
function eventDates(e){const start=String(e.date||'').slice(0,10),end=String(e.endDate||e.dateEnd||'').slice(0,10);if(!start)return [];if(!end||end<start)return[start];let dates=[];let cursor=new Date(start+'T12:00:00');while(dates.length<31&&cursor.toISOString().slice(0,10)<=end){dates.push(cursor.toISOString().slice(0,10));cursor.setDate(cursor.getDate()+1)}return dates}
function onDate(){if(dirty&&!confirm('未保存の変更があります。日付を変えますか？')){$('date').value=selectedDate;return}selectedDate=$('date').value;draft={};dirty=false;render()}
function eventId(e){return String(e._carryId??e.id??e.eventId??'')}
function dayEvents(){return events.filter(e=>eventDates(e).includes(selectedDate)&&eventId(e))}
function inventoryItem(name){return inv.find(i=>String(i.name||'').trim()===String(name||'').trim())}
function netas(e){const names=[];const add=n=>{n=String(n||'').trim();if(n&&!names.includes(n))names.push(n)};
  String(e.itemsText||e.itemsName||e.menu||'').split(/[・、,／/\n]+/).forEach(add);
  arr(e.neta).forEach(add);
  arr(e.items).forEach(x=>{const item=inv.find(i=>String(i.id)===String(x));if(item)add(item.cat||item.category)});
  return names;
}
function planFor(e){const id=eventId(e);if(draft[id])return draft[id];const existing=allPlans[key(id)]?.days?.[selectedDate]||{};draft[id]={eventName:eventName(e),place:e.place||'',date:selectedDate,selected:Array.isArray(existing.selected)?[...existing.selected]:netas(e),rows:Array.isArray(existing.rows)?existing.rows.map(r=>({...r})):[],updatedAt:existing.updatedAt||0,updatedBy:existing.updatedBy||'',seeded:Array.isArray(existing.seeded)?[...existing.seeded]:[]};return draft[id]}
function mark(){dirty=true;setStatus('saved','未保存の変更があります')}
function render(){const list=dayEvents();$('events').innerHTML=list.length?list.map(e=>{const p=planFor(e),names=[...new Set([...netas(e),...p.selected])];return '<div class="event"><h3>'+esc(eventName(e))+' ｜ '+esc(e.place||'会場未登録')+'</h3>'+(names.length?names.map(n=>'<label class="pill"><input type="checkbox" '+(p.selected.includes(n)?'checked':'')+' onchange="toggleNeta('+JSON.stringify(eventId(e)).replaceAll('"','&quot;')+','+JSON.stringify(n).replaceAll('"','&quot;')+',this.checked)"> '+esc(n)+'</label>').join(''):'<p class="empty">メインに出店ネタがありません。下から追加できます。</p>')+'<div class="toolbar"><input style="max-width:250px" id="new-neta-'+esc(key(eventId(e)))+'" placeholder="ネタを追加（例：串焼き）"><button class="secondary" onclick="addNeta('+JSON.stringify(eventId(e)).replaceAll('"','&quot;')+')">＋ ネタ</button></div></div>'}).join(''):'<div class="empty">この日付のイベントはメインに登録されていません。</div>';renderPlans()}
function toggleNeta(id,n,on){const p=draft[id];p.selected=on?[...new Set([...p.selected,n])]:p.selected.filter(x=>x!==n);mark();render()}
function addNeta(id){const input=$('new-neta-'+key(id)),name=input.value.trim();if(!name)return;if(!draft[id].selected.includes(name))draft[id].selected.push(name);mark();render()}
function ensureRows(p,n){if(p.seeded.includes(n))return;p.seeded.push(n);inv.filter(i=>matchesCategory(i.cat||i.category,n)).forEach(i=>p.rows.push({neta:n,item:i.name,qty:0}));}
function renderPlans(){const list=dayEvents();list.forEach(e=>planFor(e).selected.forEach(n=>ensureRows(planFor(e),n)));$('all-items').innerHTML=inv.map(i=>'<option value="'+esc(i.name)+'"></option>').join('');
$('plans').innerHTML=list.map(e=>{const p=planFor(e),id=eventId(e);return '<div class="event"><h3>'+esc(eventName(e))+' ｜ '+esc(e.place||'会場未登録')+'</h3>'+(p.selected.length?p.selected.map(n=>{const rows=p.rows.filter(r=>r.neta===n);return '<details class="neta" open><summary>'+esc(n)+'　（'+rows.length+'品目）</summary>'+rows.map(r=>{const i=p.rows.indexOf(r),stock=inventoryItem(r.item);return '<div class="item"><input aria-label="品目" list="all-items" value="'+esc(r.item)+'" onchange="editRow('+JSON.stringify(id).replaceAll('"','&quot;')+','+i+',\'item\',this.value)"><input aria-label="持出し数" type="number" min="0" step="1" inputmode="numeric" value="'+esc(r.qty)+'" oninput="editRow('+JSON.stringify(id).replaceAll('"','&quot;')+','+i+',\'qty\',this.value)"><span>'+esc(stock?.unit||r.unit||'')+'</span><span class="stock">在庫 '+(stock?esc(stock.stock??stock.qty??stock.quantity??0):'未登録')+' '+esc(stock?.unit||r.unit||'')+'</span><button class="danger remove" aria-label="削除" onclick="removeRow('+JSON.stringify(id).replaceAll('"','&quot;')+','+i+')">×</button></div>'}).join('')+'<div class="toolbar"><button class="secondary" onclick="addRow('+JSON.stringify(id).replaceAll('"','&quot;')+','+JSON.stringify(n).replaceAll('"','&quot;')+')">＋ 品目追加</button></div></details>'}).join(''):'<div class="empty">出店ネタを選択してください。</div>')+'</div>'}).join('');summary()}
function editRow(id,i,field,value){const r=draft[id].rows[i];if(!r)return;r[field]=field==='qty'?value:value.trim();mark();summary()}
function addRow(id,n){draft[id].rows.push({neta:n,item:'',qty:0});mark();renderPlans()}
function removeRow(id,i){draft[id].rows.splice(i,1);mark();renderPlans()}
function summary(){let totals={};dayEvents().forEach(e=>{const p=planFor(e);p.rows.filter(r=>p.selected.includes(r.neta)&&r.item?.trim()).forEach(r=>{const item=r.item.trim();totals[item]=(totals[item]||0)+valid(r.qty)})});
const lines=Object.entries(totals).filter(([,v])=>v>0).map(([name,count])=>{const it=inventoryItem(name),stock=it?valid(it.stock??it.qty??it.quantity):null,over=stock!==null&&count>stock;return '<div class="'+(over?'low':'ok')+'">'+esc(name)+'：合計 '+count+esc(it?.unit||'')+' ／ 在庫 '+(stock===null?'未登録':stock+esc(it.unit||''))+(over?'　⚠ 在庫超過':'')+'</div>'});$('summary').innerHTML='<div>この日の全会場合計（入力中）</div>'+(lines.join('')||'<small>まだ数量が入力されていません。</small>')}
async function savePlan(){if(!ready||!dayEvents().length)return setStatus('saved','イベントを読み込んでから保存してください',true);const editor=$('editor').value.trim();if(!editor)return setStatus('saved','記入者の名前を入力してください',true);
const updates={};for(const e of dayEvents()){const id=eventId(e),p=planFor(e),rows=[];for(const r of p.rows){if(!p.selected.includes(r.neta)||!r.item.trim())continue;const qty=Number(r.qty);if(!Number.isFinite(qty)||qty<0||!Number.isInteger(qty))return setStatus('saved','持出し数は0以上の整数で入力してください',true);rows.push({neta:r.neta,item:r.item.trim(),qty,unit:inventoryItem(r.item)?.unit||r.unit||''})}updates[key(id)+'/days/'+selectedDate]={eventId:id,eventName:eventName(e),place:e.place||'',date:selectedDate,selected:p.selected,rows,seeded:p.seeded,updatedAt:firebase.database.ServerValue.TIMESTAMP,updatedBy:editor}}
const btn=$('save');btn.disabled=true;setStatus('saved','共有保存中…');try{const current=await db.ref(PATH).once('value');const live=current.val()||{};for(const e of dayEvents()){const id=eventId(e),latest=live[key(id)]?.days?.[selectedDate];if((latest?.updatedAt||0)!==(draft[id].updatedAt||0)){setStatus('saved','別の端末で更新されました。再読み込みして変更を確認してください',true);return}}await Promise.race([db.ref(PATH).update(updates),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),12000))]);dirty=false;localStorage.setItem('fujiwara_carry_editor',editor);
const fresh=await db.ref(PATH).once('value');allPlans=fresh.val()||{};draft={};render();
setStatus('saved','共有保存しました｜記入者 '+editor)}catch(err){setStatus('saved','共有保存できませんでした。通信を確認し、再度保存してください',true)}finally{btn.disabled=false}}
async function start(){selectedDate=new URLSearchParams(location.search).get('date')||dateLocal();$('date').value=selectedDate;$('date').addEventListener('change',onDate);$('editor').value=localStorage.getItem('fujiwara_carry_editor')||'';try{if(!firebase.apps.length)firebase.initializeApp(CONFIG);db=firebase.database();const snap=await Promise.race([db.ref('fujiwara').once('value'),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),10000))]);const data=snap.val()||{};events=eventList(data.events);inv=arr(data.invItems);ready=true;db.ref('fujiwara/events').on('value',s=>{events=eventList(s.val());if(!dirty)render();else summary()});db.ref('fujiwara/invItems').on('value',s=>{inv=arr(s.val());if(!dirty)render();else summary()});setStatus('connection','✅ メインと連動中｜イベント '+events.length+'件／在庫 '+inv.length+'件');db.ref(PATH).on('value',s=>{allPlans=s.val()||{};if(!dirty){draft={};render();const latest=dayEvents().map(e=>allPlans[key(eventId(e))]?.days?.[selectedDate]).filter(Boolean).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];if(latest)setStatus('saved','共有済み｜最終更新 '+new Date(latest.updatedAt).toLocaleString('ja-JP')+'｜'+(latest.updatedBy||''))}else setStatus('saved','編集中です。別端末の変更があれば保存時に確認します')},()=>setStatus('saved','共有データに接続できません',true));render()}catch(err){setStatus('connection','メインアプリに接続できません。通信を確認して再読み込みしてください',true)}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
start();
</script></body></html>
