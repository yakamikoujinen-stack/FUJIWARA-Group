<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>イベント別 持出し振分け｜FUJIWARA Group</title>
<style>
:root{--navy:#19334f;--blue:#276fa7;--gold:#e2ad3b;--line:#d8e3eb;--bg:#f4f8fc;--red:#b53131}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#203044;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:16px}
header{background:linear-gradient(115deg,#17334f,#316e9d);color:white;padding:20px max(16px,calc((100vw - 1040px)/2));}
h1{font-size:clamp(22px,4vw,30px);margin:0 0 4px}header p{margin:0;color:#e5f2ff} @media print{button,.toolbar,.hint,#connection{display:none!important}.card{box-shadow:none;break-inside:avoid}}
main{max-width:1040px;margin:16px auto 90px;padding:0 14px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #19334f12}h2{font-size:20px;margin:0 0 12px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{font-weight:700;display:block;margin:0 0 5px;font-size:14px}input,select{width:100%;min-height:46px;border:1.5px solid #b9cada;border-radius:10px;padding:9px;background:white;color:inherit;font:inherit}input[type=checkbox]{width:23px;min-height:23px;vertical-align:middle}
button,.btn{border:0;border-radius:10px;background:var(--blue);color:white;font:inherit;font-weight:700;min-height:45px;padding:9px 15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.secondary{background:#e8f1f7;color:#17334f}.danger{background:#fff0f0;color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hint{background:#eef8ff;border-radius:10px;padding:10px;line-height:1.6;font-size:14px;color:#37536b}
.event{border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}.event h3{margin:0 0 8px;font-size:19px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#f9eabe;margin:4px;font-weight:700}.neta{border-left:4px solid var(--gold);padding:8px 10px;margin:12px 0;background:#fffdf5;border-radius:8px}.neta summary{font-weight:800;cursor:pointer}.item{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(82px,.65fr) minmax(110px,.8fr) minmax(90px,.7fr) 42px;align-items:center;gap:8px;border-top:1px solid #eee;padding:9px 0}.item-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(82px,.65fr) minmax(110px,.8fr) minmax(90px,.7fr) 42px;gap:8px;font-size:13px;color:#50677d;font-weight:800;padding:8px 0}.stock{font-weight:800}.item input[type=number]{max-width:130px}.item .stock.low{background:#fff0f0;padding:7px;border-radius:8px}.item .carry{display:flex;align-items:center;gap:5px}.item .carry small{white-space:nowrap}.item .stock{font-size:13px}.low{color:var(--red);font-weight:800}.ok{color:#197453}.status{padding:11px;border-radius:10px;background:#eef8ff;margin:10px 0}.status.error{background:#ffecec;color:var(--red)}.empty{color:#627386;padding:12px}small{color:#657587}.summary{background:#fff8e8;border-radius:10px;padding:12px;font-weight:700}
@media(max-width:660px){.fields{grid-template-columns:1fr}.item,.item-head{grid-template-columns:minmax(0,1.2fr) minmax(65px,.55fr) minmax(78px,.7fr) minmax(62px,.55fr) 30px;gap:4px}.item input{min-width:0;padding:7px}.item input[type=number]{width:100%}.item .carry small{display:none}.item-head{font-size:11px}.item .stock{font-size:12px}.item .remove{padding:4px;min-height:38px}h2{font-size:18px}}
</style></head>
<body>
<header><h1>📦 イベント別 持出し振分け</h1><p>メインの在庫と主力ネタを参照して、品目ごとに持出しを決める</p></header>
<main>
<section class="card"><h2>① 日付とイベント</h2><div class="fields"><div><label for="date">日付</label><input id="date" type="date"></div><div><label for="editor">記入者</label><input id="editor" placeholder="例：藤原・文太"></div><div><label>画面</label><div class="toolbar"><a class="btn secondary" href="king.html">👑 キングへ</a><a class="btn secondary" href="manager-app.html">👤 担当者へ</a></div></div></div><div id="connection" class="status">メインアプリのデータを読み込んでいます…</div><div class="hint">主力ネタの品目を表示し、メインの在庫を参照します。例：牛串 → 在庫20本 → 持出し10本。持出し数は計画で、保存しても倉庫の在庫数は減りません。</div><div id="masterStatus" class="hint" style="margin-top:8px">主力ネタの品目を読み込んでいます…</div></section>
<section class="card"><h2>② 会場 → 出店ネタ → 品目</h2><div id="events"></div></section>
<section class="card"><h2>③ 全会場合計・保存</h2><div id="summary" class="summary"></div><div class="toolbar"><button id="save" onclick="savePlan()">💾 振分けを共有保存</button><button class="secondary" onclick="print()">🖨 印刷</button></div><div id="saved" class="status">保存前</div></section>
</main>
<datalist id="all-items"></datalist>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const CONFIG={apiKey:'AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA',authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:5ec6b7e2a2165066956a94'};
const PATH='fujiwara/eventCarryPlansV1';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v.filter(Boolean):v&&typeof v==='object'?Object.values(v).filter(Boolean):[];
function eventList(v){return Object.entries(v||{}).filter(([,e])=>e&&typeof e==='object').map(([node,e])=>({...e,_carryId:String(e.id??e.eventId??node)}))}
function eventName(e){return String(e.name||e.title||'名称なし')}
function norm(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/[\s　・･/／_－ー―—()（）]+/g,'')}
const alias={'串':['串','串焼き','串焼','牛串','牛たん串','たん串','豚タン串','ねぎま','鶏皮','皮','砂ずり','ぼんじり','ホルモン','焼鳥'],'かすてら':['かすてら','カステラ','ベビーカステラ'],'いか焼き':['いか焼き','イカ焼き','姿','ゲソ','下足']};
const standardItems={
 '焼きそば・ホルそば':['麺','豚肉'],'串':['牛串','牛たん串','豚タン串','ねぎま','鶏皮','砂ずり','ぼんじり','ホルモン'],
 'かき氷':['ブロック氷','フラワーカップ'],'チーズハットグ':['チーズハットグ'],
 'かまぼこ':['ネギ生姜','とり軟骨','ベーコンチーズ','たこネギ','えだまめ','ごぼう','かに'],
 'いか焼き':['姿','ゲソ'],
 'ポテト':['ポテト','のり塩','醤油マヨ','えび塩','カレー','コンソメ','チーズ','明太マヨ','ガーリック','バーベキュー'],
 'かすてら':['バイオレット','三温糖','上白糖','たまご'],
 'コットンキャンディ':['カップ','ざらめ(白)','ざらめ(ピンク)','ざらめ(青)','ざらめ(緑)','ざらめ(紫)','ざらめ(オレンジ)','ざらめ(黄)'],
 'だんご':['だんご(白)','だんご(草)','だんご(桜)','だんご(かぼちゃ)','みたらしあん'],
 '肉巻きおにぎり':['肉巻き'],'らーめん':['麺','焼豚','鶏ガラ','どんぶり'],
 'チョコバナナ':['バナナ','チョコレート(茶)','チョコレート(白)','カラースプレー'],
 'とんかつスティック':['豚肉'],'からあげ':['鶏肉'],'10円パン':['ミックス粉','三温糖','たまご']
};
function itemNorm(v){const n=norm(v);return n==='下足'?'ゲソ':n==='皮'?'鶏皮':n==='たん串'?'牛たん串':n}
function canonical(v){const n=norm(v);return Object.keys(alias).find(cat=>alias[cat].some(x=>norm(x)===n))||String(v||'').trim()}
function matchesCategory(a,b){return norm(canonical(a))===norm(canonical(b))}
function stockInfo(name){const matches=inv.filter(i=>itemNorm(i.name)===itemNorm(name)),units=[...new Set(matches.map(i=>String(i.unit||'').trim()))];return matches.length?{stock:units.length===1?matches.reduce((sum,i)=>sum+valid(i.stock??i.qty??i.quantity),0):null,unit:units.length===1?units[0]:'単位混在'}:{stock:null,unit:''}}
const valid=n=>Number.isFinite(Number(n))&&Number(n)>=0?Number(n):0;
const key=v=>String(v??'').replace(/[.#$\[\]/]/g,'_');
let db,events=[],inv=[],master={},allPlans={},draft={},dirty=false,loading=false,selectedDate='',ready=false;
function setStatus(id,message,error=false){$(id).textContent=message;$(id).classList.toggle('error',error)}
function dateLocal(){const d=new Date(),offset=d.getTimezoneOffset();return new Date(d.getTime()-offset*60000).toISOString().slice(0,10)}
function eventDates(e){const start=String(e.date||'').slice(0,10),end=String(e.endDate||e.dateEnd||'').slice(0,10);if(!start)return [];if(!end||end<start)return[start];let dates=[];let cursor=new Date(start+'T12:00:00');while(dates.length<31&&cursor.toISOString().slice(0,10)<=end){dates.push(cursor.toISOString().slice(0,10));cursor.setDate(cursor.getDate()+1)}return dates}
function onDate(){if(dirty&&!confirm('未保存の変更があります。日付を変えますか？')){$('date').value=selectedDate;return}selectedDate=$('date').value;draft={};dirty=false;render()}
function eventId(e){return String(e._carryId??e.id??e.eventId??'')}
function dayEvents(){return events.filter(e=>eventDates(e).includes(selectedDate)&&eventId(e))}
function inventoryItem(name){return inv.find(i=>itemNorm(i.name)===itemNorm(name))}
function masterRows(n){const entry=Object.entries(master).find(([cat])=>matchesCategory(cat,n));const rows=entry?arr(entry[1]):[];return rows.filter(r=>r&&r.name).sort((a,b)=>(Number(a.order)||999)-(Number(b.order)||999))}
function netas(e){const names=[],add=v=>{const n=canonical(v);if(n&&!names.some(x=>matchesCategory(x,n)))names.push(n)};
  String(e.itemsText||e.itemsName||e.menu||'').split(/[・、,，／/\n\s　]+/).forEach(add);
  arr(e.neta).forEach(add);
  arr(e.items).forEach(x=>{const item=inv.find(i=>String(i.id)===String(x));if(item)add(item.cat||item.category)});
  return names;
}
function planFor(e){const id=eventId(e);if(draft[id])return draft[id];const existing=allPlans[key(id)]?.days?.[selectedDate]||{};draft[id]={eventName:eventName(e),place:e.place||'',date:selectedDate,selected:Array.isArray(existing.selected)?[...new Set(existing.selected.map(canonical))]:netas(e),rows:Array.isArray(existing.rows)?existing.rows.map(r=>({...r,neta:canonical(r.neta)})):[],updatedAt:existing.updatedAt||0,updatedBy:existing.updatedBy||'',seeded:Array.isArray(existing.seeded)?[...new Set(existing.seeded.map(canonical))]:[]};return draft[id]}
function mark(){dirty=true;setStatus('saved','未保存の変更があります')}
function render(){const list=dayEvents();list.forEach(e=>planFor(e).selected.forEach(n=>ensureRows(planFor(e),n)));
 $('all-items').innerHTML=inv.map(i=>'<option value="'+esc(i.name)+'"></option>').join('');
 $('events').innerHTML=list.length?list.map(e=>{const p=planFor(e),id=eventId(e),names=[...new Set([...netas(e),...p.selected])];return '<div class="event"><h3>📍 '+esc(eventName(e))+(e.place?' ｜ '+esc(e.place):'')+'</h3><div class="hint">出店ネタを選ぶと、その下に品目が並びます。</div><div class="toolbar">'+(names.length?names.map(n=>'<label class="pill"><input type="checkbox" '+(p.selected.includes(n)?'checked':'')+' onchange="toggleNeta('+JSON.stringify(id).replaceAll('"','&quot;')+','+JSON.stringify(n).replaceAll('"','&quot;')+',this.checked)"> '+esc(n)+'</label>').join(''):'<span class="empty">メインに出店ネタがありません。</span>')+'</div><div class="toolbar"><input style="max-width:250px" id="new-neta-'+esc(key(id))+'" placeholder="ネタを追加（例：串焼き）"><button class="secondary" onclick="addNeta('+JSON.stringify(id).replaceAll('"','&quot;')+')">＋ ネタ</button></div>'+renderNetaTables(e)+'</div>'}).join(''):'<div class="empty">この日付のイベントはメインに登録されていません。</div>';summary()}
function dayTotals(){const out={};dayEvents().forEach(e=>{const p=planFor(e);p.rows.filter(r=>p.selected.includes(r.neta)&&r.item?.trim()).forEach(r=>{const k=itemNorm(r.item);if(!out[k])out[k]={item:r.item.trim(),count:0};out[k].count+=valid(r.qty)})});return out}
function shortageFor(name){const info=stockInfo(name),total=dayTotals()[itemNorm(name)]?.count||0;return info.stock===null?null:Math.max(0,Number((total-info.stock).toFixed(3)))}
function renderNetaTables(e){const p=planFor(e),id=eventId(e);
 return p.selected.length?p.selected.map(n=>{const rows=p.rows.filter(r=>r.neta===n);return '<details class="neta" open><summary>'+esc(n)+'　（'+rows.length+'品目）</summary><div class="item-head"><span>品目</span><span>在庫</span><span>持出数</span><span>不足数</span><span></span></div>'+rows.map(r=>{const i=p.rows.indexOf(r),info=stockInfo(r.item),unit=info.unit||r.unit||'',short=shortageFor(r.item);return '<div class="item"><input aria-label="品目" list="all-items" value="'+esc(r.item)+'" onchange="editRow('+JSON.stringify(id).replaceAll('"','&quot;')+','+i+',\'item\',this.value)"><span class="stock">'+(info.stock===null?(info.unit==='単位混在'?'単位混在':'未登録'):esc(info.stock)+esc(unit))+'</span><span class="carry"><input aria-label="'+esc(r.item)+'の持出し数" type="number" min="0" step="any" inputmode="decimal" value="'+esc(r.qty)+'" oninput="editRow('+JSON.stringify(id).replaceAll('"','&quot;')+','+i+',\'qty\',this.value)"><small>'+esc(unit)+'</small></span><span class="shortage '+(short>0?'low':'ok')+'" data-item="'+esc(itemNorm(r.item))+'">'+(short===null?'要確認':esc(short)+esc(unit))+'</span><button class="danger remove" aria-label="削除" onclick="removeRow('+JSON.stringify(id).replaceAll('"','&quot;')+','+i+')">×</button></div>'}).join('')+'<div class="toolbar"><button class="secondary" onclick="addRow('+JSON.stringify(id).replaceAll('"','&quot;')+','+JSON.stringify(n).replaceAll('"','&quot;')+')">＋ 品目追加</button></div></details>'}).join(''):'<div class="empty">出店ネタを選択してください。</div>'}
function refreshNumbers(){document.querySelectorAll('.shortage').forEach(el=>{const info=stockInfo(el.dataset.item),short=shortageFor(el.dataset.item);el.textContent=short===null?'要確認':short+info.unit;el.classList.toggle('low',short>0);el.classList.toggle('ok',short===0)});summary()}
function toggleNeta(id,n,on){const p=draft[id];p.selected=on?[...new Set([...p.selected,n])]:p.selected.filter(x=>x!==n);mark();render()}
function addNeta(id){const input=$('new-neta-'+key(id)),name=input.value.trim();if(!name)return;if(!draft[id].selected.includes(name))draft[id].selected.push(name);mark();render()}
function ensureRows(p,n){if(p.seeded.includes(n))return;p.seeded.push(n);
 const names=[...(standardItems[canonical(n)]||[]),...masterRows(n).map(r=>r.name),...inv.filter(i=>matchesCategory(i.cat||i.category,n)).map(i=>i.name)];
 const seen=new Set();names.forEach(name=>{const k=itemNorm(name);if(!k||seen.has(k)||p.rows.some(r=>r.neta===n&&itemNorm(r.item)===k))return;seen.add(k);p.rows.push({neta:n,item:name,qty:0})});
}
function editRow(id,i,field,value){const r=draft[id].rows[i];if(!r)return;r[field]=field==='qty'?value:value.trim();mark();if(field==='item')render();else refreshNumbers()}
function addRow(id,n){draft[id].rows.push({neta:n,item:'',qty:0});mark();render()}
function removeRow(id,i){draft[id].rows.splice(i,1);mark();render()}
function summary(){const lines=Object.values(dayTotals()).filter(x=>x.count>0).map(({item,count})=>{const info=stockInfo(item),short=shortageFor(item);return '<div class="'+(short>0?'low':'ok')+'">'+esc(item)+'：持出合計 '+esc(Number(count.toFixed(3)))+esc(info.unit)+' ／ 在庫 '+(info.stock===null?'未登録':esc(info.stock)+esc(info.unit))+' ／ 不足 '+(short===null?'要確認':esc(short)+esc(info.unit))+'</div>'});$('summary').innerHTML='<div>不足数は選択した日の全会場合計で計算します</div>'+(lines.join('')||'<small>まだ数量が入力されていません。</small>')}
async function savePlan(){if(!ready||!dayEvents().length)return setStatus('saved','イベントを読み込んでから保存してください',true);const editor=$('editor').value.trim();if(!editor)return setStatus('saved','記入者の名前を入力してください',true);
const updates={};for(const e of dayEvents()){const id=eventId(e),p=planFor(e),rows=[];for(const r of p.rows){if(!p.selected.includes(r.neta)||!r.item.trim())continue;const qty=Number(r.qty);if(r.qty===''||!Number.isFinite(qty)||qty<0||Math.round(qty*1000)!==qty*1000)return setStatus('saved','持出し数は0以上、小数第3位までで入力してください',true);rows.push({neta:r.neta,item:r.item.trim(),qty,unit:stockInfo(r.item).unit||r.unit||''})}updates[key(id)+'/days/'+selectedDate]={eventId:id,eventName:eventName(e),place:e.place||'',date:selectedDate,selected:p.selected,rows,seeded:p.seeded,updatedAt:firebase.database.ServerValue.TIMESTAMP,updatedBy:editor}}
const btn=$('save');btn.disabled=true;setStatus('saved','共有保存中…');try{const current=await db.ref(PATH).once('value');const live=current.val()||{};for(const e of dayEvents()){const id=eventId(e),latest=live[key(id)]?.days?.[selectedDate];if((latest?.updatedAt||0)!==(draft[id].updatedAt||0)){setStatus('saved','別の端末で更新されました。再読み込みして変更を確認してください',true);return}}await Promise.race([db.ref(PATH).update(updates),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),12000))]);dirty=false;localStorage.setItem('fujiwara_carry_editor',editor);
const fresh=await db.ref(PATH).once('value');allPlans=fresh.val()||{};draft={};render();
setStatus('saved','共有保存しました｜記入者 '+editor)}catch(err){setStatus('saved','共有保存できませんでした。通信を確認し、再度保存してください',true)}finally{btn.disabled=false}}
async function start(){selectedDate=new URLSearchParams(location.search).get('date')||dateLocal();$('date').value=selectedDate;$('date').addEventListener('change',onDate);$('editor').value=localStorage.getItem('fujiwara_carry_editor')||'';try{if(!firebase.apps.length)firebase.initializeApp(CONFIG);db=firebase.database();const [snap,masterSnap]=await Promise.all([Promise.race([db.ref('fujiwara').once('value'),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),10000))]),db.ref('fujiwara/mainNetaSalesSharedV1/customMaster').once('value').catch(()=>({val:()=>({})}))]);const data=snap.val()||{};events=eventList(data.events);inv=arr(data.invItems);master=masterSnap.val()||{};ready=true;$('masterStatus').textContent='✅ 主力ネタの品目 '+Object.values(master).reduce((n,rows)=>n+arr(rows).length,0)+'件を参照中';db.ref('fujiwara/mainNetaSalesSharedV1/customMaster').on('value',s=>{master=s.val()||{};$('masterStatus').textContent='✅ 主力ネタの品目 '+Object.values(master).reduce((n,rows)=>n+arr(rows).length,0)+'件を参照中';if(!dirty)render()});db.ref('fujiwara/events').on('value',s=>{events=eventList(s.val());if(!dirty)render();else summary()});db.ref('fujiwara/invItems').on('value',s=>{inv=arr(s.val());if(!dirty)render();else summary()});setStatus('connection','✅ メインと連動中｜イベント '+events.length+'件／在庫 '+inv.length+'件');db.ref(PATH).on('value',s=>{allPlans=s.val()||{};if(!dirty){draft={};render();const latest=dayEvents().map(e=>allPlans[key(eventId(e))]?.days?.[selectedDate]).filter(Boolean).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];if(latest)setStatus('saved','共有済み｜最終更新 '+new Date(latest.updatedAt).toLocaleString('ja-JP')+'｜'+(latest.updatedBy||''))}else setStatus('saved','編集中です。別端末の変更があれば保存時に確認します')},()=>setStatus('saved','共有データに接続できません',true));render()}catch(err){setStatus('connection','メインアプリに接続できません。通信を確認して再読み込みしてください',true)}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
start();
</script></body></html>
