<script>

const PATH='fujiwara/eventCarryPlansV1';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function eventName(e){return String(e.name||e.title||'名称なし')}

const alias={'焼きそば・ホルそば':['焼きそば・ホルそば','焼きそば','焼そば','ホルそば'],'串':['串','串焼き','串焼','牛串','牛たん串','たん串','豚タン串','ねぎま','鶏皮','皮','砂ずり','ぼんじり','ホルモン','焼鳥'],'かすてら':['かすてら','カステラ','ベビーカステラ'],'いか焼き':['いか焼き','イカ焼き','姿','ゲソ','下足']};

 '焼きそば・ホルそば':['麺','豚肉'],'串':['牛串','牛たん串','豚タン串','ねぎま','鶏皮','砂ずり','ぼんじり','ホルモン'],
 'かき氷':['ブロック氷','フラワーカップ'],'チーズハットグ':['チーズハットグ'],
 'かまぼこ':['ネギ生姜','とり軟骨','ベーコンチーズ','たこネギ','えだまめ','ごぼう','かに'],
 'いか焼き':['姿','ゲソ'],
 'ポテト':['ポテト','のり塩','醤油マヨ','えび塩','カレー','コンソメ','チーズ','明太マヨ','ガーリック','バーベキュー'],
 'かすてら':['バイオレット','三温糖','上白糖','たまご'],
 'コットンキャンディ':['カップ','ざらめ(白)','ざらめ(ピンク)','ざらめ(青)','ざらめ(緑)','ざらめ(紫)','ざらめ(オレンジ)','ざらめ(黄)'],
 'だんご':['だんご(白)','だんご(草)','だんご(桜)','だんご(かぼちゃ)','みたらしあん'],
 '肉巻きおにぎり':['肉巻き'],'らーめん':['麺','焼豚','鶏ガラ','どんぶり'],
 'チョコバナナ':['バナナ','チョコレート(茶)','チョコレート(白)','カラースプレー'],
 'とんかつスティック':['豚肉'],'からあげ':['鶏肉'],'10円パン':['ミックス粉','三温糖','たまご']
};
function itemNorm(v){const n=norm(v);return n==='下足'?'ゲソ':n==='皮'?'鶏皮':n==='たん串'?'牛たん串':n}
function canonical(v){const n=norm(v);return Object.keys(alias).find(cat=>alias[cat].some(x=>norm(x)===n))||String(v||'').trim()}
function matchesCategory(a,b){return norm(canonical(a))===norm(canonical(b))}
function isMainNeta(n){return Object.prototype.hasOwnProperty.call(standardItems,canonical(n))}
function isMainItem(n,item){return (standardItems[canonical(n)]||[]).some(x=>itemNorm(x)===itemNorm(item))}
function stockInfo(name){const matches=inv.filter(i=>itemNorm(i.name)===itemNorm(name)),units=[...new Set(matches.map(i=>String(i.unit||'').trim()))];return matches.length?{stock:units.length===1?matches.reduce((sum,i)=>sum+valid(i.stock??i.qty??i.quantity),0):null,unit:units.length===1?units[0]:'単位混在'}:{stock:null,unit:''}}
const valid=n=>Number.isFinite(Number(n))&&Number(n)>=0?Number(n):0;
const key=v=>String(v??'').replace(/[.#$\[\]/]/g,'_');
let db,events=[],inv=[],master={},allPlans={},draft={},dirty=false,mainNeedsSave=false,loading=false,selectedDate='',ready=false;
function setStatus(id,message,error=false){$(id).textContent=message;$(id).classList.toggle('error',error);if(id==='saved'){const inline=$('inlineStatus');if(inline){inline.textContent=message;inline.classList.toggle('error',error)}}}
function dateLocal(){const d=new Date(),offset=d.getTimezoneOffset();return new Date(d.getTime()-offset*60000).toISOString().slice(0,10)}
function eventDates(e){const start=String(e.date||'').slice(0,10),end=String(e.endDate||e.dateEnd||'').slice(0,10);if(!start)return [];if(!end||end<start)return[start];let dates=[];let cursor=new Date(start+'T12:00:00');while(dates.length<31&&cursor.toISOString().slice(0,10)<=end){dates.push(cursor.toISOString().slice(0,10));cursor.setDate(cursor.getDate()+1)}return dates}
function onDate(){if(dirty&&!confirm('未保存の変更があります。日付を変えますか？')){$('date').value=selectedDate;return}selectedDate=$('date').value;draft={};dirty=false;mainNeedsSave=false;render()}
function eventId(e){return String(e._carryId??e.id??e.eventId??'')}
function dayEvents(){return events.filter(e=>eventDates(e).includes(selectedDate)&&eventId(e))}
function inventoryItem(name){return inv.find(i=>itemNorm(i.name)===itemNorm(name))}
function masterRows(n){const entry=Object.entries(master).find(([cat])=>matchesCategory(cat,n));const rows=entry?arr(entry[1]):[];return rows.filter(r=>r&&r.name).sort((a,b)=>(Number(a.order)||999)-(Number(b.order)||999))}
function netas(e){const names=[],add=v=>{const n=canonical(v);if(isMainNeta(n)&&!names.some(x=>matchesCategory(x,n)))names.push(n)};
  String(e.itemsText||e.itemsName||e.menu||'').split(/[・、,，／/\n\s　]+/).forEach(add);
  arr(e.neta).forEach(add);
  arr(e.items).forEach(x=>{const item=inv.find(i=>String(i.id)===String(x));if(item)add(item.cat||item.category)});
  return names;
}
function planFor(e){const id=eventId(e);if(draft[id])return draft[id];const existing=allPlans[key(id)]?.days?.[selectedDate]||{};draft[id]={eventName:eventName(e),place:e.place||'',date:selectedDate,selected:Array.isArray(existing.selected)?[...new Set(existing.selected.map(canonical))].filter(isMainNeta):netas(e),hiddenSelected:Array.isArray(existing.selected)?existing.selected.filter(n=>!isMainNeta(n)):[],rows:Array.isArray(existing.rows)?existing.rows.map(r=>({...r,neta:canonical(r.neta)})):[],updatedAt:existing.updatedAt||0,updatedBy:existing.updatedBy||'',seeded:Array.isArray(existing.seeded)?[...new Set(existing.seeded.map(canonical))].filter(isMainNeta):[],hiddenSeeded:Array.isArray(existing.seeded)?existing.seeded.filter(n=>!isMainNeta(n)):[],priority:existing.priority||defaultPriority(e)};return draft[id]}
function defaultPriority(e){const rec=e.dayAssignments?.[selectedDate],staff=Array.isArray(rec?.staff)?rec.staff:(Array.isArray(e.staff)?e.staff:[]);const names=[...staff,e.manager,...arr(e.managers)].map(x=>typeof x==='string'?x:(x?.name||x?.staffName||''));return names.some(x=>String(x||'').includes('藤原'))?'main':'sub'}
function priorityOf(e){return planFor(e).priority}
function mainEvents(){return dayEvents().filter(e=>priorityOf(e)==='main')}
function savedMain(e){const rec=allPlans[key(eventId(e))]?.days?.[selectedDate];return rec?.priority==='main'&&rec?.savedStage==='main'&&!!rec.updatedAt}
function mainReady(){const list=mainEvents();return !!list.length&&!mainNeedsSave&&list.every(savedMain)}
function reservedMain(name){return dayEvents().filter(savedMain).reduce((sum,e)=>{const rec=allPlans[key(eventId(e))]?.days?.[selectedDate]||{};return sum+arr(rec.rows).filter(r=>arr(rec.selected).includes(r.neta)&&isMainItem(r.neta,r.item)&&itemNorm(r.item)===itemNorm(name)).reduce((n,r)=>n+valid(r.qty),0)},0)}
function availableInfo(name,stage){const info=stockInfo(name);return {...info,stock:info.stock===null?null:(stage==='sub'?Math.max(0,Number((info.stock-reservedMain(name)).toFixed(3))):info.stock)}}
function mark(stage){dirty=true;if(stage==='main'){mainNeedsSave=true;document.querySelectorAll('[data-priority="sub"] input, [data-priority="sub"] button, [data-priority="sub"] select').forEach(el=>el.disabled=true)}setStatus('saved',stage==='main'?'藤原の会場を再保存してから、ほかの会場を入力してください':'未保存の変更があります')}
function setPriority(id,value){const p=draft[id];if(!p||!['main','sub'].includes(value)||p.priority===value)return;p.priority=value;mainNeedsSave=true;mark('main');render()}
function render(){const list=dayEvents().slice().sort((a,b)=>(priorityOf(a)==='main'?0:1)-(priorityOf(b)==='main'?0:1));list.forEach(e=>planFor(e).selected.forEach(n=>ensureRows(planFor(e),n)));
 const readyForSub=mainReady(),save=$('save'),lastMainIndex=list.reduce((last,e,i)=>priorityOf(e)==='main'?i:last,-1);save.disabled=!mainEvents().length;save.textContent=readyForSub?'💾 サブ会場の持出しを共有保存':'💾 先に藤原の会場を共有保存';
 $('all-items').innerHTML=inv.map(i=>'<option value="'+esc(i.name)+'"></option>').join('');
 $('events').innerHTML=list.length?list.map((e,index)=>{const p=planFor(e),id=eventId(e),stage=p.priority,locked=stage==='sub'&&!readyForSub,unselected=Object.keys(standardItems).filter(n=>!p.selected.includes(n));return '<div class="event" data-priority="'+stage+'"><h3>📍 '+esc(eventName(e))+(e.place?' ｜ '+esc(e.place):'')+'　<span class="pill">'+(stage==='main'?'👑 藤原が行く・先に持出し':'📦 藤原は行かない・後から持出し')+'</span></h3><label>会場の順番</label><select aria-label="'+esc(eventName(e))+'のメイン・サブ" onchange="setPriority('+JSON.stringify(id).replaceAll('"','&quot;')+',this.value)"><option value="main" '+(stage==='main'?'selected':'')+'>藤原が行く（先に持出し）</option><option value="sub" '+(stage==='sub'?'selected':'')+'>藤原は行かない（後から持出し）</option></select>'+(locked?'<div class="hint">🔒 藤原が行く会場の持出しを保存すると、ここに残り在庫が反映され、入力できます。</div>':'<div class="hint">'+(stage==='main'?'現在庫を見て先に持出しを決めます。':'藤原の会場で保存した数量を差し引いた残り在庫を表示中です。')+'</div>')+'<div class="toolbar">'+(p.selected.length?p.selected.map(n=>'<label class="pill"><input type="checkbox" '+(locked?'disabled ':'')+'checked onchange="toggleNeta('+JSON.stringify(id).replaceAll('"','&quot;')+','+JSON.stringify(n).replaceAll('"','&quot;')+',this.checked)"> '+esc(n)+'</label>').join(''):'<span class="empty">主力ネタを追加してください。</span>')+'</div><div class="toolbar"><select id="new-neta-'+esc(key(id))+'" aria-label="追加する主力ネタ" '+(locked?'disabled':'')+'><option value="">主力ネタを選択</option>'+unselected.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select><button class="secondary" '+(locked?'disabled':'')+' onclick="addNeta('+JSON.stringify(id).replaceAll('"','&quot;')+')">＋ 主力ネタを追加</button></div>'+renderNetaTables(e,locked)+'</div>'+(index===lastMainIndex?'<div class="status" id="inlineSaveBlock">'+(readyForSub?'✅ 藤原の会場は保存済み。下の会場で残り在庫を見ながら入力できます。':'① 藤原の会場の入力が終わったら、ここで保存して次へ進んでください。')+'<div class="toolbar">'+(readyForSub?'':'<button type="button" onclick="savePlan()">💾 藤原の会場を保存してサブへ進む</button>')+'</div><div id="inlineStatus" class="note"></div></div>':'')}).join(''):'<div class="empty">この日付のイベントはメインに登録されていません。</div>';summary()}
function stageTotals(stage){const out={};dayEvents().filter(e=>priorityOf(e)===stage).forEach(e=>{const p=planFor(e);p.rows.filter(r=>p.selected.includes(r.neta)&&isMainItem(r.neta,r.item)).forEach(r=>{const k=itemNorm(r.item);if(!out[k])out[k]={item:r.item.trim(),count:0};out[k].count+=valid(r.qty)})});return out}
function shortageFor(name,stage){const info=availableInfo(name,stage),total=stageTotals(stage)[itemNorm(name)]?.count||0;return info.stock===null?null:Math.max(0,Number((total-info.stock).toFixed(3)))}
function renderNetaTables(e,locked){const p=planFor(e),id=eventId(e),stage=p.priority;
 return p.selected.length?p.selected.map(n=>{const rows=p.rows.filter(r=>r.neta===n&&isMainItem(n,r.item));return '<details class="neta" open><summary>'+esc(n)+'　（'+rows.length+'品目）</summary><div class="item-head"><span>主力品目</span><span>'+(stage==='sub'&&mainReady()?'残り在庫':'在庫')+'</span><span>持出数</span><span>不足数</span><span></span></div>'+rows.map(r=>{const i=p.rows.indexOf(r),info=stage==='sub'&&!mainReady()?stockInfo(r.item):availableInfo(r.item,stage),unit=info.unit||r.unit||'',short=stage==='sub'&&!mainReady()?null:shortageFor(r.item,stage);return '<div class="item"><strong>'+esc(r.item)+'</strong><span class="stock">'+(info.stock===null?(info.unit==='単位混在'?'単位混在':'未登録'):esc(info.stock)+esc(unit))+'</span><span class="carry"><input aria-label="'+esc(r.item)+'の持出し数" type="number" min="0" step="any" inputmode="decimal" value="'+esc(r.qty)+'" '+(locked?'disabled':'')+' oninput="editRow('+JSON.stringify(id).replaceAll('"','&quot;')+','+i+',\'qty\',this.value)"><small>'+esc(unit)+'</small></span><span class="shortage '+(short>0?'low':'ok')+'" data-stage="'+stage+'" data-item="'+esc(itemNorm(r.item))+'">'+(short===null?'要確認':esc(short)+esc(unit))+'</span><span></span></div>'}).join('')+'</details>'}).join(''):'<div class="empty">主力ネタを選択してください。</div>'}
function refreshNumbers(){document.querySelectorAll('.shortage').forEach(el=>{const stage=el.dataset.stage,info=availableInfo(el.dataset.item,stage),short=shortageFor(el.dataset.item,stage);el.textContent=short===null?'要確認':short+info.unit;el.classList.toggle('low',short>0);el.classList.toggle('ok',short===0)});$('save').textContent=mainReady()?'💾 サブ会場の持出しを共有保存':'💾 先に藤原の会場を共有保存';summary()}
function toggleNeta(id,n,on){const p=draft[id];if(p.priority==='sub'&&!mainReady())return;p.selected=on?[...new Set([...p.selected,n])]:p.selected.filter(x=>x!==n);mark(p.priority);render()}
function addNeta(id){const p=draft[id];if(p.priority==='sub'&&!mainReady())return;const input=$('new-neta-'+key(id)),name=input.value.trim();if(!isMainNeta(name))return;if(!p.selected.includes(name))p.selected.push(name);mark(p.priority);render()}
function ensureRows(p,n){if(p.seeded.includes(n))return;p.seeded.push(n);
 const names=standardItems[canonical(n)]||[];
 const seen=new Set();names.forEach(name=>{const k=itemNorm(name);if(!k||seen.has(k)||p.rows.some(r=>r.neta===n&&itemNorm(r.item)===k))return;seen.add(k);p.rows.push({neta:n,item:name,qty:0})});
}
function editRow(id,i,field,value){const r=draft[id].rows[i];if(!r)return;r[field]=field==='qty'?value:value.trim();mark(draft[id].priority);if(field==='item')render();else refreshNumbers()}
function addRow(id,n){draft[id].rows.push({neta:n,item:'',qty:0});mark();render()}
function removeRow(id,i){draft[id].rows.splice(i,1);mark();render()}
function summary(){const main=stageTotals('main'),sub=stageTotals('sub'),keys=[...new Set([...Object.keys(main),...Object.keys(sub)])];$('summary').innerHTML='<div>藤原の会場を保存 → 残り在庫でほかの会場を振り分け</div>'+(keys.length?keys.map(k=>{const item=main[k]?.item||sub[k]?.item,info=stockInfo(item),a=main[k]?.count||0,b=sub[k]?.count||0,remaining=info.stock===null?null:Math.max(0,Number((info.stock-(mainReady()?reservedMain(item):a)).toFixed(3))),short=info.stock===null?null:Math.max(0,Number((a+b-info.stock).toFixed(3)));return '<div class="'+(short>0?'low':'ok')+'">'+esc(item)+'：現在庫 '+(info.stock===null?'未登録':esc(info.stock)+esc(info.unit))+' ／ 藤原の会場 '+esc(Number(a.toFixed(3)))+esc(info.unit)+' ／ 残り '+(remaining===null?'要確認':esc(remaining)+esc(info.unit))+' ／ ほかの会場 '+esc(Number(b.toFixed(3)))+esc(info.unit)+(short>0?' ／ 不足 '+esc(short)+esc(info.unit):'')+'</div>'}).join(''):'<small>まだ数量が入力されていません。</small>')}
async function savePlan(){if(!ready||!dayEvents().length)return setStatus('saved','イベントを読み込んでから保存してください',true);
 const stage=mainReady()?'sub':'main',scope=dayEvents().filter(e=>priorityOf(e)===stage);if(!mainEvents().length)return setStatus('saved','藤原が行く会場を指定してください',true);if(!scope.length)return setStatus('saved','保存する会場がありません',true);
 const editor=$('editor').value.trim();if(!editor){setStatus('saved','記入者の名前を入力してください。画面上部の記入者欄に名前を入れてから保存してください。',true);$('editor').focus();$('editor').scrollIntoView?.({behavior:'smooth',block:'center'});return}
 const updates={};for(const e of scope){const id=eventId(e),p=planFor(e),rows=[];for(const r of p.rows){if(!(p.selected.includes(r.neta)||p.hiddenSelected.includes(r.neta))||!r.item.trim())continue;const qty=Number(r.qty);if(r.qty===''||!Number.isFinite(qty)||qty<0||Math.abs(Math.round(qty*1000)-qty*1000)>1e-7)return setStatus('saved','持出し数は0以上、小数第3位までで入力してください',true);rows.push({neta:r.neta,item:r.item.trim(),qty,unit:stockInfo(r.item).unit||r.unit||''})}updates[key(id)+'/days/'+selectedDate]={eventId:id,eventName:eventName(e),place:e.place||'',date:selectedDate,priority:stage,savedStage:stage,selected:[...p.selected,...p.hiddenSelected],rows,seeded:[...p.seeded,...p.hiddenSeeded],updatedAt:firebase.database.ServerValue.TIMESTAMP,updatedBy:editor}}
 const btn=$('save');btn.disabled=true;const inlineButton=$('inlineSaveBlock')?.querySelector('button');if(inlineButton)inlineButton.disabled=true;setStatus('saved','共有保存中…');try{const current=await db.ref(PATH).once('value'),live=current.val()||{};for(const e of scope){const id=eventId(e),latest=live[key(id)]?.days?.[selectedDate];if((latest?.updatedAt||0)!==(draft[id].updatedAt||0)){setStatus('saved','別の端末で更新されました。再読み込みして変更を確認してください',true);return}}
 if(stage==='main'){for(const e of dayEvents().filter(x=>priorityOf(x)==='sub')){const id=eventId(e),rec=live[key(id)]?.days?.[selectedDate];if(rec?.priority==='main'){if((rec.updatedAt||0)!==(draft[id].updatedAt||0)){setStatus('saved','別の端末で会場の分類が変わりました。再読み込みしてください',true);return}updates[key(id)+'/days/'+selectedDate+'/priority']='sub';updates[key(id)+'/days/'+selectedDate+'/savedStage']='pending';updates[key(id)+'/days/'+selectedDate+'/updatedAt']=firebase.database.ServerValue.TIMESTAMP}}}
 await Promise.race([db.ref(PATH).update(updates),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),12000))]);dirty=false;if(stage==='main')mainNeedsSave=false;localStorage.setItem('fujiwara_carry_editor',editor);const fresh=await db.ref(PATH).once('value');allPlans=fresh.val()||{};draft={};render();setStatus('saved',(stage==='main'?'藤原の会場を保存しました。ほかの会場には残り在庫を表示しています。':'ほかの会場を保存しました。')+'｜記入者 '+editor);if(stage==='main')setTimeout(()=>document.querySelector?.('[data-priority="sub"]')?.scrollIntoView?.({behavior:'smooth',block:'start'}),150)
 }catch(err){setStatus('saved','共有保存できませんでした。通信を確認し、再度保存してください',true)}finally{btn.disabled=false;const inline=$('inlineSaveBlock')?.querySelector('button');if(inline)inline.disabled=false}}
async function start(){selectedDate=new URLSearchParams(location.search).get('date')||dateLocal();$('date').value=selectedDate;$('date').addEventListener('change',onDate);$('editor').value=localStorage.getItem('fujiwara_carry_editor')||'';try{if(!firebase.apps.length)firebase.initializeApp(CONFIG);db=firebase.database();const [snap,masterSnap]=await Promise.all([Promise.race([db.ref('fujiwara').once('value'),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),10000))]),db.ref('fujiwara/mainNetaSalesSharedV1/customMaster').once('value').catch(()=>({val:()=>({})}))]);const data=snap.val()||{};events=eventList(data.events);inv=arr(data.invItems);master=masterSnap.val()||{};ready=true;$('masterStatus').textContent='✅ 主力ネタ16分類だけ表示｜サブネタは後で追加';db.ref('fujiwara/mainNetaSalesSharedV1/customMaster').on('value',s=>{master=s.val()||{};$('masterStatus').textContent='✅ 主力ネタ16分類だけ表示｜サブネタは後で追加';if(!dirty)render()});db.ref('fujiwara/events').on('value',s=>{events=eventList(s.val());if(!dirty)render();else summary()});db.ref('fujiwara/invItems').on('value',s=>{inv=arr(s.val());if(!dirty)render();else summary()});setStatus('connection','✅ メインと連動中｜イベント '+events.length+'件／在庫 '+inv.length+'件');db.ref(PATH).on('value',s=>{allPlans=s.val()||{};if(!dirty){draft={};render();const latest=dayEvents().map(e=>allPlans[key(eventId(e))]?.days?.[selectedDate]).filter(Boolean).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];if(latest)setStatus('saved','共有済み｜最終更新 '+new Date(latest.updatedAt).toLocaleString('ja-JP')+'｜'+(latest.updatedBy||''))}else setStatus('saved','編集中です。別端末の変更があれば保存時に確認します')},()=>setStatus('saved','共有データに接続できません',true));render()}catch(err){setStatus('connection','メインアプリに接続できません。通信を確認して再読み込みしてください',true)}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
start();
</script></body></html>
