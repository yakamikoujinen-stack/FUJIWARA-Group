<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"><meta name="apple-mobile-web-app-capable" content="yes"><title>FUJIWARA メインアプリ</title><style>
:root{--gold:#c79500;--gold2:#f6df8b;--bg:#fff7df;--card:#fffef8;--line:#d7b95b;--txt:#171717;--muted:#6b5b28;--red:#d33;--green:#188a4b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:linear-gradient(180deg,#fff8df,#f8edc9);color:var(--txt);padding-bottom:76px}header{height:58px;background:linear-gradient(90deg,#fff4bd,#ffe28a,#fff4bd);border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}.brand{font-weight:900;letter-spacing:2px;color:#9b6b00}.badge{border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:#fff9df;font-weight:800;color:#8a6100}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 18px rgba(130,90,0,.08)}h1,h2,h3{margin:.2em 0}.muted{color:var(--muted);font-size:13px}.btn{border:1.5px solid var(--line);background:#fffaf0;border-radius:12px;padding:12px 16px;font-weight:900;font-size:15px;cursor:pointer}.btn.gold{background:linear-gradient(135deg,#d39a00,#f4cf47);border:0;color:#211400}.btn.red{background:#fff1f1;border-color:#e6a4a4;color:#c22}.btn.full{width:100%}input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;background:#fff;color:var(--txt);font-size:16px;font-family:inherit}textarea{min-height:86px}label{font-size:13px;color:var(--muted);font-weight:800;display:block;margin:12px 0 6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{width:100%;max-width:420px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tab{padding:10px;border:1px solid var(--line);border-radius:12px;text-align:center;font-weight:900}.tab.active{background:var(--gold);color:white}.app{display:none}.nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(90deg,#fff4bd,#ffe28a,#fff4bd);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:20}.nav button{border:0;background:transparent;padding:9px 2px;font-weight:900;color:#62501d}.nav button.active{color:#0b63ce}.nav .ico{font-size:21px;display:block}.page{display:none}.page.active{display:block}.cal-head{display:flex;align-items:center;justify-content:space-between}.cal-title{font-size:24px;font-weight:900}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{text-align:center;font-weight:900;padding:5px}.day{min-height:92px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px;position:relative}.day.today{background:#fff0a8;border:3px solid #b8860b}.day.sel{outline:4px solid #8a6200}.num{font-size:26px;font-weight:900}.evchip{display:block;background:#fff7ce;border:1px solid #d8b34c;border-radius:5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;padding:1px 3px}.event{border:1.5px solid var(--line);border-radius:14px;padding:15px;margin:12px 0;background:#fff}.event h3{font-size:22px}.actions{display:flex;gap:8px;flex-wrap:wrap}.staffbox{display:flex;gap:8px;flex-wrap:wrap}.staffcheck{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff}.staffcheck input{width:auto;transform:scale(1.4);margin-right:8px}.secret,.familyShare{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}.secret input,.familyShare input{width:auto;transform:scale(1.5)}.notice{border-left:5px solid var(--gold);background:#fff;border-radius:12px;padding:13px;margin:10px 0;border:1px solid var(--line)}.warn{background:#fff0e6;border-color:#e8a1a1}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{border:1px solid #e1c978;padding:9px;text-align:left;font-size:13px}.table th{background:#fff6cf}.right{text-align:right}@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}.cal{gap:4px}.day{min-height:74px}.num{font-size:22px}.nav{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div id="login" class="login"><div class="card"><h1>FUJIWARA</h1><p class="muted">イベント管理メインアプリ</p><div class="tabs"><div class="tab active" data-role="leader">リーダー</div><div class="tab" data-role="staff">担当者</div><div class="tab" data-role="user">一般</div></div><label>名前</label><input id="loginName" placeholder="名前"><label id="pwLabel">パスワード</label><input id="loginPw" type="password" placeholder="リーダーのみ必須"><button class="btn gold full" onclick="loginApp()">ログイン</button><p class="muted">リーダー：1111 / 担当者・一般：名前のみ</p></div></div>
<div id="app" class="app"><header><div class="brand">FUJIWARA</div><div><span id="roleBadge" class="badge"></span> <button class="btn" onclick="logout()">ログアウト</button></div></header><main class="wrap">
<section id="page-home" class="page active"><h1 id="greeting">お知らせ</h1><div class="card"><h2>🔔 リーダーからのお知らせ</h2><div id="noticeList"></div></div><div class="card warn"><h3>⚠ 人員不足イベント</h3><div id="shortageList"></div></div></section>
<section id="page-calendar" class="page"><div class="card"><div class="cal-head"><button class="btn gold" onclick="moveMonth(-1)">‹ 前月</button><div id="monthLabel" class="cal-title"></div><button class="btn gold" onclick="moveMonth(1)">次月 ›</button></div><div class="cal" id="calendar"></div></div><div class="card"><h2>今月のイベント <button class="btn gold right" onclick="newEvent()">＋追加</button></h2><div id="eventList"></div></div></section>
<section id="page-attendance" class="page"><div class="card"><h2>👥 出勤一覧表</h2><div class="grid3"><select id="attMonth" onchange="renderAttendance()"></select><select id="attStatus" onchange="renderAttendance()"><option value="">すべて</option><option value="short">人員不足</option><option value="ok">人員OK</option></select><button class="btn" onclick="alert('Excel出力は次の段階でCSV対応')">Excel出力</button></div><div style="overflow:auto;margin-top:12px"><table class="table" id="attTable"></table></div></div></section>
<section id="page-inv" class="page"><div class="card"><h2>📦 在庫</h2><p class="muted">在庫管理はここから継続。</p></div></section><section id="page-sales" class="page"><div class="card"><h2>📊 売上・損益</h2><p class="muted">売上入力はここから継続。</p></div></section><section id="page-forgot" class="page"><div class="card"><h2>📝 忘れ物</h2><p class="muted">忘れ物リストを管理します。</p></div></section>
<section id="page-settings" class="page"><div class="card"><h2>⚙ 設定</h2><div id="leaderOnly"><h3>リーダー設定</h3><label>お知らせ入力</label><textarea id="noticeInput" placeholder="スタッフへ表示するお知らせ"></textarea><button class="btn gold" onclick="addNotice()">お知らせ追加</button><div class="grid2" style="margin-top:12px"><button class="btn" onclick="location.href='kensetsu.html?from=main'">🏗 建設アプリ</button><button class="btn" onclick="location.href='family.html?leader=1'">🏠 Family App</button></div></div></div></section>
</main><nav class="nav"><button class="active" onclick="showPage('calendar',this)"><span class="ico">📅</span>カレンダー</button><button onclick="showPage('inv',this)"><span class="ico">📦</span>在庫</button><button onclick="showPage('sales',this)"><span class="ico">📊</span>売上・損益</button><button onclick="showPage('attendance',this)"><span class="ico">👥</span>出勤一覧表</button><button onclick="showPage('forgot',this)"><span class="ico">📝</span>忘れ物</button><button onclick="showPage('settings',this)"><span class="ico">⚙️</span>設定</button></nav></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;align-items:flex-end;justify-content:center"><div class="card" style="width:100%;max-width:720px;max-height:92vh;overflow:auto;margin:0;border-radius:20px 20px 0 0"><h2>イベント登録・編集</h2><input type="hidden" id="evId"><div class="grid2"><div><label>開始日</label><input id="evStart" type="date"></div><div><label>終了日</label><input id="evEnd" type="date"></div></div><label>イベント名</label><input id="evName" placeholder="例：神鍋 道の駅"><label>発注先</label><select id="evClient"><option>ピスタチオ</option><option>A</option><option>B</option><option>両方</option></select><label>場所</label><input id="evPlace"><label>ステータス</label><select id="evStatus"><option>予定</option><option>開催中</option><option>終了</option></select><label>出店アイテム（自由入力）</label><textarea id="evItems"></textarea><label>当日体制（必要人数）</label><input id="evNeed" type="number" min="0"><label>担当スタッフ</label><div id="staffChecks" class="staffbox"></div><label class="secret"><input id="evSecret" type="checkbox"> 🔒 シークレットイベント</label><label class="familyShare"><input id="evFamily" type="checkbox"> 家族アプリで共有する（Family App）<br><span class="muted">チェックすると、家族アプリのカレンダーに表示されます。</span></label><label>メモ・備考</label><textarea id="evMemo"></textarea><div class="actions"><button class="btn gold" onclick="saveEvent()">保存する</button><button class="btn red" onclick="deleteEvent()">削除</button><button class="btn" onclick="closeModal()">閉じる</button></div></div></div>
<script>
const LS_EVENTS='fg_events_v7',LS_NOTICES='fg_notices_v7';const staffNames=['藤原','将','文太','繁充','まりみ','龍来','想良','理紗菜','まりん','拓海','ぱんた','スポット(バイト)','Lecoa’s','ゆな','緑笑だるまや'];let role='leader',user='',cur=new Date(),selectedDate=new Date().toISOString().slice(0,10);let events=JSON.parse(localStorage.getItem(LS_EVENTS)||'null')||seedEvents();let notices=JSON.parse(localStorage.getItem(LS_NOTICES)||'null')||[{time:'2026-06-25 18:59',text:'イベント担当者はリーダーが入力しています。出勤の可否は各自、入力してください'},{time:'今日',text:'6/14 Aゾーン・Bゾーンで同日出店です ⚠ 人員配置を確認してください'},{time:'昨日',text:'持出し数が確定しました ✅'}];
function seedEvents(){return [{id:1,start:'2026-06-13',end:'2026-06-14',name:'神鍋　道の駅',client:'ピスタチオ',place:'豊岡',status:'終了',items:'',need:6,staff:['藤原','文太'],secret:false,family:true,memo:''},{id:2,start:'2026-06-14',end:'2026-06-14',name:'神戸青木夜市',client:'A',place:'神戸市',status:'終了',items:'肉巻き　ヨーヨー',need:4,staff:['藤原','将','まりみ','想良'],secret:true,family:true,memo:''},{id:3,start:'2026-06-26',end:'2026-06-26',name:'三宮夜市',client:'A',place:'三宮',status:'予定',items:'',need:4,staff:['藤原','文太'],secret:false,family:false,memo:''}]}
function saveAll(){localStorage.setItem(LS_EVENTS,JSON.stringify(events));localStorage.setItem(LS_NOTICES,JSON.stringify(notices));syncFamily()}function syncFamily(){let f=events.filter(e=>e.family&&!e.secret).map(e=>({id:'main-'+e.id,date:e.start,end:e.end,title:e.name,place:e.place,items:e.items,type:'shared',color:'yellow',creator:'共有イベント'}));localStorage.setItem('family_shared_events_v1',JSON.stringify(f))}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');role=t.dataset.role;document.getElementById('pwLabel').style.display=role==='leader'?'block':'none';document.getElementById('loginPw').style.display=role==='leader'?'block':'none'});
function loginApp(){user=document.getElementById('loginName').value.trim()||'藤原';let pw=document.getElementById('loginPw').value;if(role==='leader'&&pw!=='1111'){alert('リーダーパスワードが違います');return}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('roleBadge').textContent=role==='leader'?'👑 リーダー':role==='staff'?'担当者':'一般';document.getElementById('greeting').textContent=(new Date().getHours()<17?'こんにちは':'こんばんは')+(new Date().getHours()>=17?' 🌙':' ☀️');if(role!=='leader')document.getElementById('leaderOnly').style.display='none';renderAll()}function logout(){location.reload()}function showPage(p,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn&&btn.classList.add('active');if(p==='attendance')renderAttendance()}
function renderAll(){renderCalendar();renderEvents();renderHome();setupAttMonth();syncFamily()}function renderHome(){document.getElementById('noticeList').innerHTML=notices.map(n=>`<div class="notice"><div class="muted">${n.time}</div>${esc(n.text)}</div>`).join('');let shorts=events.filter(e=>(+e.need||0)>e.staff.length&&!e.secret);document.getElementById('shortageList').innerHTML=shorts.length?shorts.map(e=>`<b>${esc(e.name)}</b>　あと${(+e.need||0)-e.staff.length}人<br>`).join(''):'人員不足イベントはありません'}
function renderCalendar(){let y=cur.getFullYear(),m=cur.getMonth();document.getElementById('monthLabel').textContent=`${y}年 ${m+1}月`;let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let html=['日','月','火','水','木','金','土'].map(d=>`<div class="dow">${d}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=fmt(d),same=d.getMonth()===m,today=ds===fmt(new Date()),sel=ds===selectedDate;let es=events.filter(e=>dateIn(ds,e.start,e.end)&&(!e.secret||role==='leader'));html+=`<div class="day ${today?'today':''} ${sel?'sel':''}" onclick="selectedDate='${ds}';renderAll()"><div class="num" style="${same?'':'opacity:.35'}">${d.getDate()}</div>${es.slice(0,3).map(e=>`<span class="evchip">${e.family?'🟡 ':''}${e.secret?'🔒 ':''}${esc(e.name)}</span>`).join('')}</div>`}document.getElementById('calendar').innerHTML=html}
function renderEvents(){let ym=cur.toISOString().slice(0,7);let list=events.filter(e=>e.start.slice(0,7)===ym||e.end.slice(0,7)===ym);document.getElementById('eventList').innerHTML=list.map(e=>`<div class="event"><h3>${e.secret?'🔒 ':''}${esc(e.name)}</h3><p>📅 ${e.start}${e.end&&e.end!==e.start?' ～ '+e.end:''}　📍 ${esc(e.place)}</p><p>👥 担当 ${e.staff.join('・')||'なし'}</p><p>出勤回答：⭕0 △0 ❌0</p><p>${e.family?'🟡 Family共有':''}</p><div class="actions"><button class="btn" onclick="editEvent(${e.id})">✏️ 編集</button><button class="btn" onclick="changeStatus(${e.id})">🔄 状態変更</button><button class="btn" onclick="alert('売上入力は継続実装')">📊 売上入力</button></div></div>`).join('')||'<p class="muted">イベントなし</p>'}
function newEvent(){openModal({id:'',start:selectedDate,end:selectedDate,name:'',client:'ピスタチオ',place:'',status:'予定',items:'',need:'',staff:[],secret:false,family:false,memo:''})}function editEvent(id){openModal(events.find(e=>e.id===id))}function openModal(e){document.getElementById('modal').style.display='flex';evId.value=e.id||'';evStart.value=e.start||selectedDate;evEnd.value=e.end||e.start||selectedDate;evName.value=e.name||'';evClient.value=e.client||'ピスタチオ';evPlace.value=e.place||'';evStatus.value=e.status||'予定';evItems.value=e.items||'';evNeed.value=e.need||'';evMemo.value=e.memo||'';evSecret.checked=!!e.secret;evFamily.checked=!!e.family;staffChecks.innerHTML=staffNames.map(s=>`<label class="staffcheck"><input type="checkbox" value="${esc(s)}" ${e.staff&&e.staff.includes(s)?'checked':''}>${esc(s)}</label>`).join('')}function closeModal(){modal.style.display='none'}
function saveEvent(){let id=evId.value;let e={id:id?+id:Date.now(),start:evStart.value,end:evEnd.value||evStart.value,name:evName.value||'無題イベント',client:evClient.value,place:evPlace.value,status:evStatus.value,items:evItems.value,need:+evNeed.value||0,staff:[...document.querySelectorAll('#staffChecks input:checked')].map(x=>x.value),secret:evSecret.checked,family:evFamily.checked,memo:evMemo.value};if(id)events=events.map(x=>x.id===+id?e:x);else events.push(e);saveAll();closeModal();renderAll();alert('保存しました')}function deleteEvent(){let id=+evId.value;if(id&&confirm('削除しますか？')){events=events.filter(e=>e.id!==id);saveAll();closeModal();renderAll()}}function changeStatus(id){let e=events.find(x=>x.id===id);e.status=e.status==='予定'?'開催中':e.status==='開催中'?'終了':'予定';saveAll();renderAll()}
function addNotice(){let t=noticeInput.value.trim();if(!t)return;notices.unshift({time:new Date().toLocaleString('ja-JP'),text:t});noticeInput.value='';saveAll();renderHome()}function moveMonth(n){cur.setMonth(cur.getMonth()+n);renderAll()}function setupAttMonth(){if(attMonth.options.length)return;for(let i=-1;i<3;i++){let d=new Date();d.setMonth(d.getMonth()+i);let ym=d.toISOString().slice(0,7);attMonth.innerHTML+=`<option value="${ym}">${ym}</option>`}}function renderAttendance(){let ym=attMonth.value||new Date().toISOString().slice(0,7),filter=attStatus.value;let rows=events.filter(e=>e.start.slice(0,7)===ym&&!e.secret).filter(e=>filter==='short'?(+e.need||0)>e.staff.length:filter==='ok'?(+e.need||0)<=e.staff.length:true);attTable.innerHTML='<tr><th>日付</th><th>イベント名</th><th>発注先</th><th>場所</th><th>担当スタッフ</th><th>必要人数</th><th>出勤</th><th>未定</th><th>不可</th></tr>'+rows.map(e=>`<tr><td>${e.start}</td><td>${esc(e.name)}</td><td>${esc(e.client)}</td><td>${esc(e.place)}</td><td>${e.staff.join('・')}</td><td>${e.need||0}</td><td style="color:green">0</td><td style="color:#c79500">${Math.max((+e.need||0)-e.staff.length,0)}</td><td style="color:red">0</td></tr>`).join('')}
function dateIn(d,s,e){return d>=s&&d<=(e||s)}function fmt(d){return d.toISOString().slice(0,10)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
