<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主力ネタ・サブネタ｜担当者閲覧</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f3f8fc;color:#17324d}.wrap{max-width:900px;margin:auto;padding:16px}.head{display:flex;gap:12px;align-items:center}.back{border:0;background:#17324d;color:#fff;border-radius:12px;padding:11px 14px;font-weight:900}.info{background:#fff8df;border:1px solid #f0d57b;border-radius:14px;padding:12px;margin:14px 0;font-weight:800;line-height:1.6}.section{background:#fff;border-radius:18px;margin:12px 0;padding:14px;box-shadow:0 8px 22px #17324d18}.title{font-size:20px;font-weight:950;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.item{border:1px solid #bed5e8;background:#f8fcff;border-radius:14px;padding:10px;font-weight:800}.main{background:#fff8dc;border-color:#efd681}.name{font-weight:950;font-size:16px}.stock{font-size:12px;color:#24602f;margin-top:5px}.meta{font-size:10px;color:#66788a;margin-top:3px}.status{font-size:12px;color:#66788a;font-weight:800;margin:5px 0}.badge{font-size:10px;border-radius:999px;padding:3px 7px;display:inline-block;margin-bottom:5px;background:#dff0ff}.main .badge{background:#ffe7a2}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><div class="wrap"><div class="head"><button class="back" onclick="location.href='manager-app.html'">‹ 担当者へ戻る</button><h2>🍳 主力ネタ・サブネタ</h2></div><div class="info">閲覧専用。<b>主力ネタはKING管理</b>、<b>サブネタは在庫管理の主力ネタ以外の品目</b>を自動表示します。在庫の編集は今まで通り担当者アプリの在庫管理で行います。</div><div id="status" class="status">読込中...</div><div id="invstatus" class="status"></div><div class="section"><div class="title">🟥 主力ネタ</div><div id="mainList" class="grid"></div></div><div class="section"><div class="title">🟦 サブネタ <span id="subCount" style="font-size:12px;color:#66788a"></span></div><div id="subList" class="grid"></div></div></div><script>var cfg={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:5ec6b7e2a2165066956a94"};if(!firebase.apps.length)firebase.initializeApp(cfg);var db=firebase.database(),master=[],inv=[];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[c]))}function key(s){return String(s||'').normalize('NFKC').replace(/[\s　・]/g,'').replace(/[（）]/g,c=>c==='（'?'(':')').toLowerCase()}function draw(){var mains=new Set(master.map(x=>key(x.name)));document.getElementById('mainList').innerHTML=master.map((m,i)=>'<div class="item main"><span class="badge">主力ネタ</span><div class="name">'+(i+1)+'. '+esc(m.name)+'</div></div>').join('');var map={};inv.forEach(function(x){if(!x||!x.name||mains.has(key(x.name)))return;var k=key(x.name);if(!map[k])map[k]={name:x.name,stock:0,units:new Set(),locs:new Set()};map[k].stock+=Number(x.stock)||0;if(x.unit)map[k].units.add(x.unit);if(x.loc)map[k].locs.add(x.loc)});var subs=Object.values(map);document.getElementById('subCount').textContent='在庫管理から '+subs.length+'品目';document.getElementById('subList').innerHTML=subs.map(function(x){var u=[...x.units],l=[...x.locs];return '<div class="item"><span class="badge">サブネタ</span><div class="name">'+esc(x.name)+'</div><div class="stock">📦 現在庫 <b>'+x.stock+'</b>'+(u.length===1?' '+esc(u[0]):'')+'</div>'+(l.length?'<div class="meta">📍 '+l.map(esc).join('・')+'</div>':'')+'</div>'}).join('')||'<div class="meta">在庫管理にサブネタ品目がありません。</div>'}db.ref('fujiwara/netaMaster').on('value',function(s){var v=s.val(),a=v&&(v.items||v);a=Array.isArray(a)?a:Object.values(a||{}).filter(Boolean);master=a.map(x=>({id:x.id,name:x.name||String(x)}));document.getElementById('status').textContent='✓ KING主力ネタ共有中　'+master.length+'種類';draw()});db.ref('fujiwara/invItems').on('value',function(s){var v=s.val();inv=Array.isArray(v)?v.filter(Boolean):Object.values(v||{}).filter(Boolean);document.getElementById('invstatus').textContent='✓ 在庫管理とリアルタイム連携中　'+inv.length+'品目';draw()});</script></body></html>
