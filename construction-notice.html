<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>建設 伝達事項</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7;color:#172033}header{background:#1f3a5f;color:white;text-align:center;padding:18px}main{max-width:900px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}input,textarea,button,select{width:100%;font-size:16px;padding:11px;margin-top:8px;border-radius:10px;border:1px solid #ccd3dd}button{background:#1f3a5f;color:white;border:0;font-weight:bold}.green{background:#0a7a2f}.red{background:#b00020}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{display:inline-flex;align-items:center;gap:6px;background:#e8f1ff;color:#1f3a5f;padding:6px 10px;border-radius:999px;margin:4px;font-weight:bold}.done{background:#e9f9ef;color:#0a7a2f}.notyet{background:#fff4db;color:#b7791f}.box{white-space:pre-wrap;background:#f3f6fb;border-radius:12px;padding:12px;border:1px solid #dde5f0}.small{font-size:12px;color:#666}@media(max-width:720px){.row{grid-template-columns:1fr}}
</style></head><body><header><h1>📢 建設 伝達事項</h1><p>LINE既読に頼らない確認管理</p></header><main>
<section class="card"><h2>今日の伝達事項を作成</h2><div class="row"><input id="noticeDate" type="date"><select id="importance"><option>通常</option><option>重要</option><option>緊急</option></select></div><input id="title" placeholder="件名"><textarea id="body" rows="6" placeholder="伝達事項を入力"></textarea><button class="green" onclick="saveNotice()">伝達事項を保存</button></section>
<section class="card"><h2>スタッフ確認</h2><div class="row"><input id="staffName" placeholder="スタッフ名"><button onclick="addStaff()">スタッフ追加</button></div><div id="staffList"></div></section>
<section class="card"><h2>本日の伝達事項</h2><div id="noticeView">未登録</div><button class="green" onclick="confirmMe()">この端末で確認しました</button></section>
<section class="card"><h2>確認状況</h2><div id="statusView"></div></section>
<section class="card"><h2>LINE送信用</h2><p class="small">LINEには短文だけ送って、詳細はアプリで確認。</p><div id="lineText" class="box"></div><button onclick="copyLineText()">LINE文面をコピー</button></section>
<section class="card"><h2>履歴</h2><div id="historyView"></div></section>
</main><script>
function get(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
function set(k,v){localStorage.setItem(k,JSON.stringify(v));localStorage.setItem("fks_last_saved",new Date().toLocaleString())}
function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function staff(){return get("fks_construction_notice_staff",["藤原","山田","田中"])}
function notices(){return get("fks_construction_notices",[])}
function currentNotice(){let d=noticeDate.value||today();return notices().find(n=>n.date===d)||null}
function saveNotice(){if(!noticeDate.value||!title.value||!body.value){alert("日付・件名・本文を入力");return}let arr=notices().filter(n=>n.date!==noticeDate.value);arr.unshift({id:Date.now(),date:noticeDate.value,importance:importance.value,title:title.value,body:body.value,confirmed:[],created:new Date().toLocaleString()});set("fks_construction_notices",arr);render();alert("保存しました")}
function addStaff(){let name=staffName.value.trim();if(!name){alert("スタッフ名を入力");return}let arr=staff();if(!arr.includes(name))arr.push(name);set("fks_construction_notice_staff",arr);staffName.value="";render()}
function delStaff(name){if(confirm(name+" を削除？")){set("fks_construction_notice_staff",staff().filter(x=>x!==name));render()}}
function toggleConfirm(name){let n=currentNotice();if(!n){alert("先に伝達事項を保存");return}let arr=notices(),i=arr.findIndex(x=>x.id===n.id),c=arr[i].confirmed||[];arr[i].confirmed=c.includes(name)?c.filter(x=>x!==name):c.concat(name);set("fks_construction_notices",arr);render()}
function confirmMe(){let name=prompt("確認したスタッフ名を入力");if(!name)return;let arr=staff();if(!arr.includes(name)){arr.push(name);set("fks_construction_notice_staff",arr)}let n=currentNotice();if(!n){alert("先に伝達事項を保存");return}let all=notices(),i=all.findIndex(x=>x.id===n.id);if(!all[i].confirmed.includes(name))all[i].confirmed.push(name);set("fks_construction_notices",all);render();alert(name+" さん確認済み")}
function copyLineText(){navigator.clipboard.writeText(lineText.textContent).then(()=>alert("コピーしました")).catch(()=>alert("長押しコピーしてください"))}
function render(){let n=currentNotice(),confirmed=n?(n.confirmed||[]):[];staffList.innerHTML=staff().map(s=>`<span class="pill ${confirmed.includes(s)?"done":"notyet"}">${s}<button onclick="toggleConfirm('${s}')" style="width:auto;margin:0;padding:2px 7px;border-radius:999px;background:#1f3a5f">${confirmed.includes(s)?"済":"未"}</button><button onclick="delStaff('${s}')" class="red" style="width:auto;margin:0;padding:2px 7px;border-radius:999px">×</button></span>`).join("");noticeView.innerHTML=n?`<h3>${n.importance==="緊急"?"🔴":n.importance==="重要"?"🟡":"🔵"} ${n.title}</h3><p class="small">${n.date} / ${n.importance} / ${n.created}</p><div class="box">${n.body}</div>`:"未登録";let st=staff(),yet=st.filter(x=>!confirmed.includes(x));statusView.innerHTML=n?`確認済み：${confirmed.length}人 / 未確認：${yet.length}人<br><b>確認済み</b><br>${confirmed.map(x=>`<span class="pill done">${x}</span>`).join("")||"なし"}<br><b>未確認</b><br>${yet.map(x=>`<span class="pill notyet">${x}</span>`).join("")||"なし"}`:"伝達事項なし";lineText.textContent=n?`【藤原建設】${n.date} の伝達事項を更新しました。\n重要度：${n.importance}\n建設アプリを開いて確認ボタンを押してください。`:"【藤原建設】本日の伝達事項を更新しました。建設アプリを確認してください。";historyView.innerHTML=notices().slice(0,10).map(n=>`<div class="card"><b>${n.date} ${n.title}</b><br><span class="small">${n.importance} / 確認済み ${(n.confirmed||[]).length}人</span></div>`).join("")||"履歴なし"}
noticeDate.value=today();noticeDate.onchange=render;render();
</script></body></html>
