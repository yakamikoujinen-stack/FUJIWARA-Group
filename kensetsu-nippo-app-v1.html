<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FUJIWARA GROUP 建設日報 v1.0</title>
<style>
:root{--bg:#f7f1df;--card:#fffdf6;--card2:#fff3d6;--main:#b8860b;--main2:#d6a634;--text:#1f1600;--muted:#6d5a2b;--line:#dec98d;--red:#d64242;--green:#168a58;--shadow:0 4px 18px rgba(80,55,0,.14);--r:13px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Helvetica Neue',sans-serif;background:linear-gradient(180deg,#fff8e8,#f4ead0);color:var(--text);min-height:100vh}input,select,textarea{width:100%;padding:12px 13px;border:1.6px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-size:15px;font-family:inherit}textarea{min-height:86px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}.fg{margin-bottom:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:900;font-size:14px;font-family:inherit;cursor:pointer}.btn-main{background:linear-gradient(135deg,var(--main),var(--main2));color:#1a1200}.btn-ghost{background:#fffaf0;border:1.5px solid var(--line);color:var(--muted)}.btn-danger{background:#fff1f1;border:1.5px solid #e7aaa8;color:var(--red)}.btn-green{background:#eaf9f1;border:1.5px solid #a9dec2;color:var(--green)}.btn-full{width:100%}.btn-sm{padding:8px 10px;font-size:12px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.login-card{width:100%;max-width:420px;background:var(--card);border:2px solid rgba(184,134,11,.42);border-radius:20px;box-shadow:var(--shadow);padding:26px 20px}.brand{text-align:center;margin-bottom:22px}.brand h1{font-size:26px;letter-spacing:1px}.brand p{color:var(--muted);font-size:12px;margin-top:6px}.app{display:none;min-height:100vh;padding-bottom:72px}.top{position:sticky;top:0;z-index:10;height:56px;background:linear-gradient(90deg,#fff4d7,#ffe8a8,#fff4d7);border-bottom:2px solid rgba(184,134,11,.45);display:flex;align-items:center;justify-content:space-between;padding:0 13px}.top-title{font-weight:900}.badge{font-size:11px;background:#fffaf0;border:1px solid var(--line);border-radius:20px;padding:4px 9px;color:var(--muted)}.page{display:none;padding:14px}.page.active{display:block}.title{font-size:23px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin:3px 0 14px}.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}.notice{border-left:5px solid var(--main);font-size:13px;line-height:1.7}.notice small{display:block;color:var(--muted);font-size:11px}.nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(90deg,#fff4d7,#ffe8a8,#fff4d7);border-top:2px solid rgba(184,134,11,.45);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}.nav button{flex:1;border:0;background:transparent;color:#5f512e;font-size:10px;padding:8px 2px 6px;font-family:inherit}.nav .ico{font-size:22px;display:block}.nav button.active{color:#8a5d00;font-weight:900}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cal-month{font-size:18px;font-weight:900}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:12px;color:#4d3a00;font-weight:900;padding:4px}.day{min-height:82px;background:#fffdfa;border:1.5px solid #d8bf75;border-radius:10px;padding:5px 3px;box-shadow:0 2px 8px rgba(80,55,0,.08);cursor:pointer}.day.other{opacity:.35}.day.today{background:#fff0a8;border:3px solid var(--main)}.day.selected{background:#ffdf80;border:3px solid #6f4b00}.date{font-size:20px;font-weight:900}.mini{font-size:9px;background:#fff7cf;border:1px solid rgba(120,80,0,.25);border-radius:6px;padding:2px;margin-top:2px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;border-left:5px solid var(--main);cursor:pointer}.entry h3{font-size:16px}.meta{font-size:12px;color:var(--muted);line-height:1.7;margin-top:4px}.pill{font-size:11px;border-radius:20px;padding:3px 8px;background:#fff3d6;border:1px solid var(--line);white-space:nowrap}.table-wrap{overflow-x:auto}.tbl{width:100%;min-width:680px;border-collapse:collapse;background:#fff}.tbl th,.tbl td{border:1px solid var(--line);padding:9px 8px;font-size:13px;text-align:left}.tbl th{background:#fff3d6;color:#5d4300}.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:flex-end}.modal-bg.open{display:flex}.modal{width:100%;max-height:92vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px;border-top:2px solid var(--line)}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-title{font-size:18px;font-weight:900}.close{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fffaf0}.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.locked{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed #d8bf75;border-radius:13px;background:#fffdf6}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#fff8e8;border:1px solid var(--line);border-radius:22px;padding:10px 18px;box-shadow:var(--shadow);font-size:13px;opacity:0;transition:.25s;z-index:99;white-space:nowrap}.toast.show{opacity:1}@media(min-width:800px){.page{max-width:980px;margin:0 auto}.modal{max-width:700px;margin:0 auto}.day{min-height:105px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="brand"><h1>FUJIWARA GROUP</h1><p>建設作業日報 v1.0</p></div><div class="fg"><label>会社選択</label><select id="loginCompany"><option>藤原一工業合同会社</option><option>リコー工業合同会社</option><option>株式会社ミライソ</option></select></div><div class="fg"><label>ユーザー区分</label><select id="loginRole"><option value="admin">管理者</option><option value="leader">現場責任者</option><option value="worker">作業員</option></select></div><div class="fg"><label>名前</label><input id="loginName" placeholder="例：藤原 明広"></div><div class="fg"><label>パスワード</label><input id="loginPw" type="password" placeholder="初期：1234"></div><button class="btn btn-main btn-full" onclick="loginApp()">ログイン</button><p style="font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.7">初期パスワードは 1234<br>保存データはこの端末内に残ります</p></div></div>
<div id="app" class="app"><div class="top"><div><div class="top-title" id="topCompany"></div><div style="font-size:10px;color:var(--muted)" id="topUser"></div></div><span class="badge" id="roleBadge"></span></div><main><section id="home" class="page active"><div class="title">ホーム</div><div class="sub">建設日報・月末請求集計</div><div class="card notice"><small>イベント業務からの連絡事項</small><div id="noticeList"></div></div><div class="card"><b>今日の予定</b><div id="todayList" style="margin-top:10px"></div></div><div class="card"><b>簡単メニュー</b><div class="row-actions"><button class="btn btn-main" onclick="openDiary()">＋ 日報入力</button><button class="btn btn-green" onclick="go('summary')">月末集計</button><button class="btn btn-ghost" onclick="exportCSV()">CSV出力</button></div></div></section><section id="calendar" class="page"><div class="title">カレンダー</div><div class="sub">日付を押して日報入力</div><div class="cal-head"><button class="btn btn-ghost btn-sm" onclick="moveMonth(-1)">前月</button><div class="cal-month" id="calMonth"></div><button class="btn btn-ghost btn-sm" onclick="moveMonth(1)">翌月</button></div><div class="cal-grid" id="calGrid"></div><div style="margin-top:14px" id="selectedEntries"></div></section><section id="diary" class="page"><div class="title">日報一覧</div><div class="sub">保存済み作業日報</div><button class="btn btn-main btn-full" onclick="openDiary()">＋ 新規日報</button><div id="entryList" style="margin-top:12px"></div></section><section id="summary" class="page"><div class="title">月末集計</div><div class="sub">請求用の人数・現場・スタッフ集計</div><div class="grid2"><div class="fg"><label>対象月</label><input id="sumMonth" type="month" onchange="renderSummary()"></div><div class="fg"><label>会社</label><select id="sumCompany" onchange="renderSummary()"><option>現在の会社のみ</option><option>全会社</option></select></div></div><div id="summaryBox"></div></section><section id="settings" class="page"><div class="title">設定</div><div class="sub">管理者のみ</div><div id="settingsBox"></div></section></main><nav class="nav"><button onclick="go('home')" class="active"><span class="ico">🏠</span>ホーム</button><button onclick="go('calendar')"><span class="ico">📅</span>カレンダー</button><button onclick="go('diary')"><span class="ico">📝</span>日報</button><button onclick="go('summary')"><span class="ico">📊</span>集計</button><button onclick="go('settings')"><span class="ico">⚙️</span>設定</button></nav></div>
<div id="modalBg" class="modal-bg"><div class="modal"><div class="modal-top"><div class="modal-title" id="modalTitle">日報入力</div><button class="close" onclick="closeModal()">×</button></div><input type="hidden" id="editId"><div class="grid2"><div class="fg"><label>日付</label><input id="fDate" type="date"></div><div class="fg"><label>天候</label><select id="fWeather"><option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option><option>その他</option></select></div></div><div class="fg"><label>取引先名</label><input id="fClient" placeholder="例：○○建設"></div><div class="fg"><label>工事場所・現場名</label><input id="fSite" placeholder="例：○○市 △△現場"></div><div class="grid2"><div class="fg"><label>担当者</label><input id="fLeader" placeholder="例：藤原"></div><div class="fg"><label>作業人数</label><input id="fCount" type="number" min="0" step="0.5" placeholder="例：3"></div></div><div class="fg"><label>作業員名</label><input id="fWorkers" placeholder="例：A、B、C"></div><div class="fg"><label>主な作業内容</label><textarea id="fWork" placeholder="例：型枠解体、片付け、搬入など"></textarea></div><div class="fg"><label>メモ</label><textarea id="fMemo" placeholder="注意点・残工事など"></textarea></div><div class="fg"><label>写真メモ</label><input id="fPhoto" placeholder="写真名や保管場所を記入"></div><div class="row-actions"><button class="btn btn-main" onclick="saveDiary()">保存</button><button class="btn btn-danger" id="deleteBtn" onclick="deleteDiary()" style="display:none">削除</button><button class="btn btn-ghost" onclick="closeModal()">閉じる</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const KEY='fujiwara_kensetsu_nippo_v1';let state={user:null,company:'藤原一工業合同会社',role:'admin',month:new Date(),selected:fmtDate(new Date()),entries:[],notices:['イベント業務より：応援依頼や集合時間の変更はこちらに表示します。','売上・在庫・経費は建設アプリには表示しません。']};
function load(){const s=localStorage.getItem(KEY);if(s){try{Object.assign(state,JSON.parse(s))}catch(e){}} if(!state.entries)state.entries=[]}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function today(){return fmtDate(new Date())}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function loginApp(){const pw=document.getElementById('loginPw').value;if(pw && pw!=='1234'){toast('パスワードが違います');return}state.company=document.getElementById('loginCompany').value;state.role=document.getElementById('loginRole').value;state.user=document.getElementById('loginName').value||'未設定';save();document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';initApp()}
function initApp(){document.getElementById('topCompany').textContent=state.company;document.getElementById('topUser').textContent=state.user;document.getElementById('roleBadge').textContent=roleName();document.getElementById('sumMonth').value=new Date().toISOString().slice(0,7);renderAll()}function roleName(){return state.role==='admin'?'管理者':state.role==='leader'?'現場責任者':'作業員'}function canEdit(){return state.role==='admin'||state.role==='leader'}
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));[...document.querySelectorAll('.nav button')].find(b=>b.getAttribute('onclick').includes(id)).classList.add('active');renderAll()}
function renderAll(){renderHome();renderCalendar();renderEntries();renderSummary();renderSettings()}function renderHome(){document.getElementById('noticeList').innerHTML=state.notices.map(n=>'<div>・'+esc(n)+'</div>').join('');const list=state.entries.filter(e=>e.company===state.company&&e.date===today());document.getElementById('todayList').innerHTML=list.length?list.map(entryHtml).join(''):'<div class="meta">今日の登録はありません</div>'}
function renderCalendar(){const m=new Date(state.month),y=m.getFullYear(),mo=m.getMonth();document.getElementById('calMonth').textContent=y+'年 '+(mo+1)+'月';const first=new Date(y,mo,1),start=new Date(y,mo,1-first.getDay());let html=['日','月','火','水','木','金','土'].map(d=>'<div class="dow">'+d+'</div>').join('');for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=fmtDate(d);const cnt=state.entries.filter(e=>e.company===state.company&&e.date===ds).length;const minis=state.entries.filter(e=>e.company===state.company&&e.date===ds).slice(0,2).map(e=>'<div class="mini">'+esc(e.site||e.client||'日報')+'</div>').join('');html+=`<div class="day ${d.getMonth()!==mo?'other':''} ${ds===today()?'today':''} ${ds===state.selected?'selected':''}" onclick="selectDate('${ds}')"><div class="date">${d.getDate()}</div>${cnt?'<div class="mini">'+cnt+'件</div>':''}${minis}</div>`}document.getElementById('calGrid').innerHTML=html;renderSelected()}function moveMonth(n){state.month=new Date(state.month);state.month.setMonth(state.month.getMonth()+n);save();renderCalendar()}function selectDate(ds){state.selected=ds;save();renderCalendar()}function renderSelected(){const list=state.entries.filter(e=>e.company===state.company&&e.date===state.selected);document.getElementById('selectedEntries').innerHTML='<div class="card"><b>'+state.selected+'</b><div class="row-actions"><button class="btn btn-main btn-sm" onclick="openDiary(\''+state.selected+'\')">＋この日の日報</button></div></div>'+(list.length?list.map(entryHtml).join(''):'<div class="card meta">この日の登録はありません</div>')}
function renderEntries(){const list=state.entries.filter(e=>e.company===state.company).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('entryList').innerHTML=list.length?list.map(entryHtml).join(''):'<div class="card meta">日報はまだありません</div>'}function entryHtml(e){return `<div class="card entry" onclick="editDiary('${e.id}')"><div><h3>${esc(e.site||'現場未入力')}</h3><div class="meta">${e.date} / ${esc(e.weather)}<br>取引先：${esc(e.client||'-')}<br>担当：${esc(e.leader||'-')} / 人数：${esc(e.count||'0')}</div></div><span class="pill">${esc(e.company)}</span></div>`}
function openDiary(date){if(!canEdit()){toast('作業員は入力できません');return}document.getElementById('modalTitle').textContent='日報入力';document.getElementById('editId').value='';document.getElementById('deleteBtn').style.display='none';['fClient','fSite','fLeader','fCount','fWorkers','fWork','fMemo','fPhoto'].forEach(id=>document.getElementById(id).value='');document.getElementById('fDate').value=date||state.selected||today();document.getElementById('fWeather').value='晴れ';document.getElementById('modalBg').classList.add('open')}function editDiary(id){const e=state.entries.find(x=>x.id===id);if(!e)return;document.getElementById('modalTitle').textContent='日報修正';document.getElementById('editId').value=e.id;document.getElementById('fDate').value=e.date;document.getElementById('fWeather').value=e.weather;document.getElementById('fClient').value=e.client;document.getElementById('fSite').value=e.site;document.getElementById('fLeader').value=e.leader;document.getElementById('fCount').value=e.count;document.getElementById('fWorkers').value=e.workers;document.getElementById('fWork').value=e.work;document.getElementById('fMemo').value=e.memo;document.getElementById('fPhoto').value=e.photo||'';document.getElementById('deleteBtn').style.display=canEdit()?'inline-block':'none';document.getElementById('modalBg').classList.add('open')}function closeModal(){document.getElementById('modalBg').classList.remove('open')}
function saveDiary(){if(!canEdit()){toast('権限がありません');return}const id=document.getElementById('editId').value||String(Date.now());const e={id,company:state.company,date:fDate.value,weather:fWeather.value,client:fClient.value,site:fSite.value,leader:fLeader.value,count:fCount.value,workers:fWorkers.value,work:fWork.value,memo:fMemo.value,photo:fPhoto.value};if(!e.date){toast('日付を入れてください');return}const i=state.entries.findIndex(x=>x.id===id);if(i>=0)state.entries[i]=e;else state.entries.push(e);state.selected=e.date;save();closeModal();renderAll();toast('保存しました')}function deleteDiary(){if(!canEdit())return;const id=editId.value;state.entries=state.entries.filter(e=>e.id!==id);save();closeModal();renderAll();toast('削除しました')}
function renderSummary(){const ym=document.getElementById('sumMonth')?.value||new Date().toISOString().slice(0,7);const all=document.getElementById('sumCompany')?.value==='全会社';const list=state.entries.filter(e=>e.date&&e.date.startsWith(ym)&&(all||e.company===state.company));let total=list.reduce((s,e)=>s+(parseFloat(e.count)||0),0);let bySite={},byClient={},byWorker={};list.forEach(e=>{bySite[e.site||'未入力']=(bySite[e.site||'未入力']||0)+(parseFloat(e.count)||0);byClient[e.client||'未入力']=(byClient[e.client||'未入力']||0)+(parseFloat(e.count)||0);(e.workers||'').split(/[、,\s]+/).filter(Boolean).forEach(w=>byWorker[w]=(byWorker[w]||0)+1)});document.getElementById('summaryBox').innerHTML=`<div class="card"><b>合計人工</b><div style="font-size:32px;font-weight:900">${total}</div><div class="meta">登録件数：${list.length}件</div><div class="row-actions"><button class="btn btn-ghost btn-sm" onclick="exportCSV()">CSV出力</button><button class="btn btn-green btn-sm" onclick="window.print()">印刷/PDF</button></div></div>${table('現場別集計',bySite)}${table('取引先別集計',byClient)}${table('スタッフ別 出勤回数',byWorker)}`}function table(title,obj){const rows=Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')||'<tr><td colspan="2">なし</td></tr>';return `<div class="card"><b>${title}</b><div class="table-wrap" style="margin-top:10px"><table class="tbl"><tr><th>項目</th><th>数量</th></tr>${rows}</table></div></div>`}
function renderSettings(){const box=document.getElementById('settingsBox');if(state.role!=='admin'){box.innerHTML='<div class="locked">設定は管理者のみ表示できます</div>';return}box.innerHTML='<div class="card"><b>会社</b><p class="meta">藤原一工業合同会社 / リコー工業合同会社 / 株式会社ミライソ</p></div><div class="card"><b>連絡事項</b><textarea id="noticeEdit">'+state.notices.join('\n')+'</textarea><button class="btn btn-main btn-full" style="margin-top:10px" onclick="saveNotices()">連絡事項を保存</button></div><div class="card"><button class="btn btn-danger btn-full" onclick="clearData()">全データ削除</button></div>'}function saveNotices(){state.notices=document.getElementById('noticeEdit').value.split('\n').filter(Boolean);save();renderAll();toast('保存しました')}function clearData(){if(confirm('全データを削除しますか？')){state.entries=[];save();renderAll()}}
function exportCSV(){const rows=[['会社','日付','天候','取引先','現場','担当者','人数','作業員','作業内容','メモ','写真メモ']].concat(state.entries.filter(e=>e.company===state.company).map(e=>[e.company,e.date,e.weather,e.client,e.site,e.leader,e.count,e.workers,e.work,e.memo,e.photo]));const csv=rows.map(r=>r.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='建設日報_'+state.company+'.csv';a.click()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();
</script>
</body>
</html>
