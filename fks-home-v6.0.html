<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FKS Home v6.0</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7;color:#172033}header{background:#14213d;color:#fff;text-align:center;padding:18px}.wrap{max-width:1100px;margin:auto;padding:16px}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.box,.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0002}.num{font-size:23px;font-weight:800}a{text-decoration:none;color:#14213d;font-weight:800}.small{font-size:13px;color:#666}.ai{border-left:6px solid #14213d}textarea{width:100%;height:100px;font-size:16px;border-radius:10px;padding:10px}button{background:#14213d;color:#fff;border:0;border-radius:10px;padding:10px 18px;margin-top:8px}.warn{color:#b00020;font-weight:bold}.good{color:#0a7a2f;font-weight:bold}
</style></head><body><header><h1>👑 FUJIWARA KING SYSTEM</h1><p>Home v6.0 - 請求・支払・資金繰り統合</p></header><div class="wrap">
<section class="stats"><div class="box"><h3>💰 売上</h3><div class="num" id="sales">¥0</div></div><div class="box"><h3>💸 経費</h3><div class="num" id="expense">¥0</div></div><div class="box"><h3>📈 利益</h3><div class="num" id="profit">¥0</div></div><div class="box"><h3>🏦 現預金</h3><div class="num" id="cash">¥0</div></div><div class="box"><h3>📄 未入金</h3><div class="num" id="unpaidInvoice">¥0</div></div><div class="box"><h3>💸 未払い</h3><div class="num" id="unpaidPayment">¥0</div></div><div class="box"><h3>🔮 予測残高</h3><div class="num" id="forecast">¥0</div></div></section>
<section class="card ai" style="margin-top:16px"><h3>🤖 AI秘書</h3><div id="aiText"></div></section>
<section class="grid" style="margin-top:16px"><div class="card"><a href="fks-accounting-v2.0.html">💰 Accounting v2</a><div class="small">売上・経費・現預金</div></div><div class="card"><a href="fks-invoice-v1.0.html">📄 Invoice</a><div class="small">請求・入金</div></div><div class="card"><a href="fks-payment-v1.0.html">💸 Payment</a><div class="small">支払予定</div></div><div class="card"><a href="fks-cashflow-v1.0.html">🏦 Cashflow</a><div class="small">資金繰り</div></div><div class="card"><a href="fks-event-v2.0.html">🎪 Event v2</a></div><div class="card"><a href="fks-construction-v2.0.html">🏗 Construction v2</a></div><div class="card"><a href="fks-staff-v1.0.html">👷 Staff</a></div><div class="card"><a href="fks-family-v1.0.html">👨‍👩‍👧 Family</a></div><div class="card"><a href="fks-real-family-v1.0.html">🔒 Real Family</a></div><div class="card"><a href="fks-ai-secretary-v1.0.html">🤖 AI Secretary</a></div></section>
<section class="card" style="margin-top:16px"><h3>📝 社長メモ</h3><textarea id="memo"></textarea><button onclick="saveMemo()">保存</button><button onclick="load()">更新</button></section></div>
<script>
function yen(n){return "¥"+Number(n||0).toLocaleString()}function getJSON(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
function load(){const acc=getJSON("fks_accounting",{sales:0,expense:0,cash:0}),evt=getJSON("fks_event",{sales:0,expense:0,profit:0}),inv=getJSON("fks_invoices",[]),pay=getJSON("fks_payments",[]),con=getJSON("fks_construction_report",null);const s=Number(acc.sales||0)+Number(evt.sales||0),e=Number(acc.expense||0)+Number(evt.expense||0),p=s-e+Number(evt.profit||0),c=Number(acc.cash||0),ui=inv.filter(x=>!x.paid).reduce((a,x)=>a+Number(x.amount||0),0),up=pay.filter(x=>!x.done).reduce((a,x)=>a+Number(x.amount||0),0),f=c+ui-up;sales.textContent=yen(s);expense.textContent=yen(e);profit.textContent=yen(p);cash.textContent=yen(c);unpaidInvoice.textContent=yen(ui);unpaidPayment.textContent=yen(up);forecast.textContent=yen(f);memo.value=localStorage.getItem("fks_ceo_memo")||"";let msg=[];if(ui>0)msg.push("未入金が "+yen(ui)+" あります。");if(up>0)msg.push("未払いが "+yen(up)+" あります。");if(f<0)msg.push("<span class='warn'>予測残高がマイナスです。</span>");if(!con)msg.push("建設日報が未入力です。");if(p>0)msg.push("<span class='good'>今月利益はプラスです。</span>");if(!msg.length)msg.push("大きな警告はありません。");aiText.innerHTML=msg.map(x=>"・"+x).join("<br>")}
function saveMemo(){localStorage.setItem("fks_ceo_memo",memo.value);alert("保存しました")}window.onload=load;
</script></body></html>
