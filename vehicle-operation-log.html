<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>運行記録 v1.0｜FUJIWARA Group</title>
<style>
:root{--navy:#17324d;--blue:#2f6fa7;--gold:#e0ac2d;--green:#218a57;--red:#c84545;--bg:#eef6fb;--card:#fff;--line:#d7e3ec;--text:#1c2733;--muted:#66798b;--shadow:0 10px 27px rgba(18,46,72,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,#f7fbff,#edf5fa);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;padding-bottom:90px}
button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--navy),#2c6799);color:#fff;padding:15px 14px;box-shadow:var(--shadow)}
.head{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:23px;margin:0}.sub{font-size:12px;color:#dcecff;margin-top:4px}.back{border:0;border-radius:12px;padding:10px 13px;background:rgba(255,255,255,.16);color:#fff;font-weight:900}
.wrap{max-width:1050px;margin:auto;padding:13px}.notice{border:1.5px solid #e2c466;background:#fff6d7;color:#6e5200;border-radius:14px;padding:11px 13px;margin-bottom:11px;font-size:13px;font-weight:800;line-height:1.6}.notice.ok{background:#e8f7ef;border-color:#95d0ae;color:#176b45}.notice.err{background:#ffe8ea;border-color:#e3a7ae;color:#9b2934}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;font-weight:900;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1.5px solid #cbd8e3;border-radius:11px;padding:11px 12px;background:#fff;color:var(--text);font-size:16px}.field textarea{min-height:80px;resize:vertical}.span2{grid-column:span 2}.span3{grid-column:span 3}.calc{background:#eef7ff!important;font-weight:950;color:#174b73!important}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900}.primary{background:var(--navy);color:#fff}.green{background:#e7f7ee;color:var(--green);border:1px solid #9ed2b4}.ghost{background:#eef3f7;color:#334b5f}.danger{background:#fde8e8;color:var(--red)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.sum{background:#f7fbfe;border:1px solid var(--line);border-radius:14px;padding:12px}.sum .k{font-size:11px;color:var(--muted);font-weight:800}.sum .v{font-size:22px;font-weight:950;margin-top:4px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:1150px;background:#fff}th,td{padding:9px 8px;border-bottom:1px solid #e5edf3;text-align:left;font-size:12px;white-space:nowrap}th{background:#eef5fa;color:#27445e;position:sticky;top:0;z-index:1}td.num{text-align:right;font-variant-numeric:tabular-nums}.mini{border:0;border-radius:9px;padding:7px 9px;font-weight:900}.edit{background:#e8f2fb;color:#225b87}.empty{text-align:center;color:var(--muted);padding:24px}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 9px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}.footer button{flex:1}
@media(max-width:780px){.grid{grid-template-columns:1fr 1fr}.span3{grid-column:span 2}.summary{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.grid2{grid-template-columns:1fr}.span2,.span3{grid-column:span 1}}
</style>
</head>
<body>
<header><div class="head"><div><h1>🚐 運行記録 v1.0</h1><div class="sub">車両・走行距離・高速料金・給油を記録</div></div><button class="back" onclick="goBack()">← 担当者アプリ</button></div></header>
<div class="wrap">
<div id="sync" class="notice">Firebaseの運行記録を読み込んでいます…</div>
<section class="card"><h2>① 運行記録を入力</h2>
<div class="grid">
<div class="field"><label>日付</label><input type="date" id="date"></div><div class="field"><label>車両名</label><input id="vehicle" placeholder="例：ハイエース"></div><div class="field"><label>運転者</label><input id="driver" placeholder="例：将"></div>
<div class="field"><label>出発時走行距離（km）</label><input id="startKm" type="number" inputmode="decimal" min="0" oninput="calcDistance()"></div><div class="field"><label>帰社時走行距離（km）</label><input id="endKm" type="number" inputmode="decimal" min="0" oninput="calcDistance()"></div><div class="field"><label>今回走行距離（自動）</label><input id="distance" class="calc" readonly></div>
<div class="field span2"><label>行先</label><input id="destination" placeholder="例：大阪茨木 ダイエー"></div><div class="field"><label>高速料金（円）</label><input id="toll" type="number" inputmode="numeric" min="0" value="0"></div>
<div class="field"><label>給油量（L）</label><input id="fuelLiters" type="number" inputmode="decimal" min="0" step="0.01" value="0"></div><div class="field"><label>給油金額（円）</label><input id="fuelAmount" type="number" inputmode="numeric" min="0" value="0"></div><div class="field"><label>給油場所</label><input id="fuelPlace" placeholder="例：ENEOS"></div>
<div class="field span3"><label>備考</label><textarea id="memo" placeholder="渋滞・車両異常・立寄先など"></textarea></div>
</div>
<div class="toolbar"><button class="btn primary" onclick="saveRecord()">💾 Firebaseへ保存</button><button class="btn ghost" onclick="clearForm()">新規入力</button><button class="btn danger" id="deleteBtn" onclick="deleteEditing()" disabled>削除</button></div></section>

<section class="card"><h2>② 月間集計</h2><div class="grid2"><div class="field"><label>表示月</label><input type="month" id="filterMonth" onchange="render()"></div><div class="field"><label>車両・行先・運転者を検索</label><input id="search" placeholder="検索" oninput="render()"></div></div>
<div class="summary" style="margin-top:11px"><div class="sum"><div class="k">運行件数</div><div class="v" id="sumCount">0</div></div><div class="sum"><div class="k">走行距離合計</div><div class="v" id="sumDistance">0 km</div></div><div class="sum"><div class="k">高速料金合計</div><div class="v" id="sumToll">¥0</div></div><div class="sum"><div class="k">給油金額合計</div><div class="v" id="sumFuel">¥0</div></div></div></section>

<section class="card"><h2>③ 運行履歴</h2><div class="toolbar" style="margin:0 0 10px"><button class="btn green" onclick="reload()">🔄 最新データ再読込</button></div><div class="tablewrap"><table><thead><tr><th>日付</th><th>車両</th><th>運転者</th><th>行先</th><th>出発km</th><th>帰社km</th><th>走行km</th><th>高速料金</th><th>給油量</th><th>給油金額</th><th>給油場所</th><th>備考</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</div>
<div class="footer"><button class="btn ghost" onclick="goBack()">担当者アプリへ戻る</button><button class="btn primary" onclick="document.querySelector('section.card').scrollIntoView({behavior:'smooth'})">＋ 新規入力</button></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA",authDomain:"fujiwara-group-3a600.firebaseapp.com",databaseURL:"https://fujiwara-group-3a600-default-rtdb.firebaseio.com",projectId:"fujiwara-group-3a600",storageBucket:"fujiwara-group-3a600.firebasestorage.app",messagingSenderId:"709887362301",appId:"1:709887362301:web:5ec6b7e2a2165066956a94"};
if(!firebase.apps.length)firebase.initializeApp(CFG);const db=firebase.database();const PATH="fujiwara/vehicleOperationLogs";let records=[],editingId="";const $=id=>document.getElementById(id);const n=v=>Number(v)||0;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const yen=v=>"¥"+n(v).toLocaleString("ja-JP");const safeKey=s=>String(s||Date.now()).replace(/[.#$\[\]\/]/g,"_");
function toArray(v){if(Array.isArray(v))return v.map((x,i)=>x?({...x,id:String(x.id??i)}):null).filter(Boolean);if(v&&typeof v==="object")return Object.entries(v).map(([k,x])=>x?({...x,id:String(x.id??k)}):null).filter(Boolean);return []}
function init(){const now=new Date();date.value=now.toISOString().slice(0,10);filterMonth.value=now.toISOString().slice(0,7);reload()}
function calcDistance(){const start=n(startKm.value),end=n(endKm.value);distance.value=end>=start&&start>0?Math.round((end-start)*10)/10:""}
async function reload(){sync.className="notice";sync.textContent="Firebaseの運行記録を読み込んでいます…";try{const snap=await db.ref(PATH).once("value");records=toArray(snap.val());sync.className="notice ok";sync.textContent="✅ 運行記録を読み込みました。"+records.length+"件";render()}catch(e){console.error(e);sync.className="notice err";sync.textContent="⚠️ 運行記録を読み込めませんでした。通信またはFirebaseルールを確認してください。"}}
function formData(){const start=n(startKm.value),end=n(endKm.value);return{id:editingId||safeKey("run_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)),date:date.value,vehicle:vehicle.value.trim(),driver:driver.value.trim(),startKm:start,endKm:end,distance:end>=start?Math.max(Math.round((end-start)*10)/10,0):0,destination:destination.value.trim(),toll:n(toll.value),fuelLiters:n(fuelLiters.value),fuelAmount:n(fuelAmount.value),fuelPlace:fuelPlace.value.trim(),memo:memo.value.trim(),updatedAt:firebase.database.ServerValue.TIMESTAMP}}
async function saveRecord(){const d=formData();if(!d.date)return alert("日付を入力してください");if(!d.vehicle)return alert("車両名を入力してください");if(!d.driver)return alert("運転者を入力してください");if(!d.destination)return alert("行先を入力してください");if(d.endKm&&d.endKm<d.startKm)return alert("帰社時走行距離が出発時走行距離より小さくなっています");try{await db.ref(PATH+"/"+safeKey(d.id)).set(d);alert("運行記録を保存しました");clearForm();await reload()}catch(e){console.error(e);alert("保存できませんでした。Firebaseルールを確認してください")}}
function clearForm(){editingId="";const today=new Date().toISOString().slice(0,10);date.value=today;vehicle.value=driver.value=destination.value=fuelPlace.value=memo.value="";startKm.value=endKm.value=distance.value="";toll.value=fuelLiters.value=fuelAmount.value=0;deleteBtn.disabled=true}
function filtered(){const month=filterMonth.value,q=search.value.trim().toLowerCase();return records.filter(r=>(!month||String(r.date||"").startsWith(month))&&(!q||[r.vehicle,r.driver,r.destination,r.fuelPlace,r.memo].join(" ").toLowerCase().includes(q))).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||Number(b.updatedAt||0)-Number(a.updatedAt||0))}
function render(){const list=filtered();sumCount.textContent=list.length;sumDistance.textContent=(Math.round(list.reduce((s,r)=>s+n(r.distance),0)*10)/10).toLocaleString("ja-JP")+" km";sumToll.textContent=yen(list.reduce((s,r)=>s+n(r.toll),0));sumFuel.textContent=yen(list.reduce((s,r)=>s+n(r.fuelAmount),0));tbody.innerHTML=list.length?list.map(r=>`<tr><td>${esc(r.date||"")}</td><td>${esc(r.vehicle||"")}</td><td>${esc(r.driver||"")}</td><td>${esc(r.destination||"")}</td><td class="num">${n(r.startKm).toLocaleString("ja-JP")}</td><td class="num">${n(r.endKm).toLocaleString("ja-JP")}</td><td class="num"><b>${n(r.distance).toLocaleString("ja-JP")}</b></td><td class="num">${yen(r.toll)}</td><td class="num">${n(r.fuelLiters).toLocaleString("ja-JP")} L</td><td class="num">${yen(r.fuelAmount)}</td><td>${esc(r.fuelPlace||"")}</td><td>${esc(r.memo||"")}</td><td><button class="mini edit" onclick="editRecord('${esc(r.id)}')">編集</button></td></tr>`).join(""):'<tr><td colspan="13" class="empty">運行記録はまだありません</td></tr>'}
function editRecord(id){const r=records.find(x=>String(x.id)===String(id));if(!r)return;editingId=String(r.id);date.value=r.date||"";vehicle.value=r.vehicle||"";driver.value=r.driver||"";startKm.value=n(r.startKm)||"";endKm.value=n(r.endKm)||"";distance.value=n(r.distance)||"";destination.value=r.destination||"";toll.value=n(r.toll);fuelLiters.value=n(r.fuelLiters);fuelAmount.value=n(r.fuelAmount);fuelPlace.value=r.fuelPlace||"";memo.value=r.memo||"";deleteBtn.disabled=false;document.querySelector("section.card").scrollIntoView({behavior:"smooth"})}
async function deleteEditing(){if(!editingId)return;const r=records.find(x=>String(x.id)===String(editingId));if(!r)return;if(!confirm("この運行記録を削除しますか？"))return;try{await db.ref("fujiwara/vehicleOperationTrash/"+safeKey(editingId+"_"+Date.now())).set({...r,deletedAt:firebase.database.ServerValue.TIMESTAMP});await db.ref(PATH+"/"+safeKey(editingId)).remove();clearForm();await reload();alert("削除しました。バックアップは残しています")}catch(e){console.error(e);alert("削除できませんでした")}}
function goBack(){location.href="manager-app.html"}init();
</script></body></html>
