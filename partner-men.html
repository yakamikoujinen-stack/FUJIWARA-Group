x;font-size:12px;font-weight:900;background:var(--pink);color:#1f4f78}.btn.light{background:#f7fbff;color:var(--main);border:1px solid var(--line)}.btn.red{background:#ffe1e7;color:#981b36}.btn.full{width:100%;margin-top:10px}.calendar-wrap{overflow-x:auto;scroll-snap-type:x mandatory;display:flex;gap:12px}.month{min-width:100%;scroll-snap-align:start}.month-title{text-align:center;font-weight:900;font-size:18px;margin:6px 0 10px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{text-align:center;font-size:12px;color:var(--muted);font-weight:900}.day{min-height:76px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:7px;text-align:left;color:var(--ink);overflow:hidden}.day.today{outline:2px solid var(--gold)}.day.has{background:#eef7ff}.day.selected{background:var(--main);color:#fff}.num{font-weight:900}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#d993a0;margin-right:2px}.dayTitle{display:block;margin-top:3px;font-size:10px;font-weight:900;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day.selected .dayTitle{color:#fff}.planTitle{opacity:.9}.event{border:1px solid var(--line);border-radius:22px;padding:14px;margin:12px 0;background:#fff}.event h3{margin:0 0 8px;font-size:20px}.kv{display:grid;grid-template-columns:92px 1fr;gap:8px;color:#315f86}.calc{display:none}.calc.open{display:block}.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.calc-grid label{font-size:13px;color:#315f86;font-weight:900}.calc-grid input{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;font-size:18px}.total{font-size:26px;font-weight:900}.profit{color:var(--green)}.loss{color:var(--red)}.form input,.form textarea,.form select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;font-size:16px;margin:6px 0 10px}.form textarea{min-height:80px}.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sumBox{background:#fff;border:1p </style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
(function(){
  var p=new URLSearchParams(location.search);

  // 下請けが partner.html を単独で開いた時は、メインの存在を一切出さない。
  var fromMain=p.get('from')==='main';
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.getElementById('backMainBtn');
    var f=document.getElementById('footerMainBtn');
    var nav=document.getElementById('footerNav');
    if(fromMain){
      if(b) b.style.display='block';
      if(f) f.style.display='block';
      if(nav) nav.classList.add('fromMain');
    }else{
      if(b) b.remove();
      if(f) f.remove();
      if(nav) nav.classList.remove('fromMain');
    }
  });
})();
</script>
</head><body><header><div class="logo"><div class="mark">🦍</div><div><h1>partner MEN</h1><div class="sub">FUJIWARA Group</div></div></div><div class="rolebar"><button class="active">partner</button></div><button id="backMainBtn" class="back-main" style="display:none" onclick="location.href='index.html'">← メインアプリに戻る</button></header><main>
<section id="calendarSec" class="card page activePage"><div class="between"><b>🦍 スライド式カレンダー</b><span class="muted"></span></div><div class="calendar-wrap" id="calendar"></div></section>

<section id="yearSec" class="card page"><div class="between"><b>⭕ 年間 月別集計</b><select id="yearPick" onchange="renderSummaries()" style="padding:9px;border-radius:12px;border:1px solid var(--line)"></select></div><div id="yearSummary"></div></section>

<script>
const STORE_KEY='partner_men_events_v1';const PLAN_KEY='partner_men_personal_plans_v1';const FB_PATH='fujiwara/partner_men_shared_events';const CENTER_FB_PATH='fujiwara/share_center/partner_men/events';let selectedDate=new Date().toISOString().slice(0,10),events=[],plans=[],firebaseReady=false;const moneyKeys=['sales','fee','cost','labor','other'];
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}function uid(){return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function normalizeEvent(x,src){const d=x.date||x.eventDate||x.day||x.startDate||x.start;if(!d)return null;const de=x.dateEnd||x.endDate||x.toDate||x.end||'';return{id:x.id||('main_'+(x.mainId||uid())),mainId:x.mainId||String(x.id||'').replace(/^main_/,''),date:String(d).slice(0,10),dateEnd:de?String(de).slice(0,10):'',title:x.title||x.name||x.eventName||'イベント',place:x.place||x.location||'',itemsText:x.itemsText||x.itemsName||x.menu||'',sales:+(x.sales||0),fee:+(x.fee||x.placeFee||0),cost:+(x.cost||x.expense||0),labor:+(x.labor||0),other:+(x.other||0),secret:!!x.secret,src}}
function dateInEvent(e,ds){const st=e.date, en=(e.dateEnd&&e.dateEnd>=st)?e.dateEnd:st;return ds>=st && ds<=en}function dateRangeText(e){return e.dateEnd&&e.dateEnd>e.date?e.date+' 〜 '+e.dateEnd:e.date}
function initFirebase(){try{if(!window.firebase)return false;const cfg={apiKey:'AIzaSyBVu9pdWuJVrCdE8khbzIm3kfenPP4swOA',authDomain:'fujiwara-group-3a600.firebaseapp.com',databaseURL:'https://fujiwara-group-3a600-default-rtdb.firebaseio.com',projectId:'fujiwara-group-3a600',storageBucket:'fujiwara-group-3a600.firebasestorage.app',messagingSenderId:'709887362301',appId:'1:709887362301:web:8ff756d645bc0398956a94'};if(!firebase.apps.length)firebase.initializeApp(cfg);firebaseReady=true;return true}catch(e){firebaseReady=false;return false}}
function fbRef(id){try{if(!firebaseReady)return null;let r=firebase.database().ref(FB_PATH);return id?r.child(String(id).replace(/[.#$\[\]/]/g,'_')):r}catch(e){return null}}function centerRef(id){try{if(!firebaseReady)return null;let r=firebase.database().ref(CENTER_FB_PATH);return id?r.child(String(id).replace(/[.#$\[\]/]/g,'_')):r}catch(e){return null}}
function loadLocal(){try{plans=JSON.parse(localStorage.getItem(PLAN_KEY)||'[]')}catch(e){plans=[]}try{events=JSON.parse(localStorage.getItem(STORE_KEY)||'[]').map(x=>normalizeEvent(x,'local')).filter(Boolean).filter(e=>!e.secret)}catch(e){events=[]}}
function loadEvents(){loadLocal();if(initFirebase()){const mergeSnap=(snap,src)=>{const v=snap.val()||{};const incoming=Object.keys(v).map(k=>normalizeEvent(v[k],src)).filter(Boolean).filter(e=>!e.secret);const map={};(events||[]).concat(incoming).forEach(e=>{const k=String(e.mainId||e.id);map[k]=Object.assign({},map[k]||{},e)});events=Object.values(map);localStorage.setItem(STORE_KEY,JSON.stringify(events));renderAll();};const r=fbRef();if(r)r.on('value',snap=>mergeSnap(snap,'firebase'));const c=centerRef();if(c)c.on('value',snap=>mergeSnap(snap,'share_center'));}}
function saveOwn(){localStorage.setItem(STORE_KEY,JSON.stringify(events))}function savePlans(){localStorage.setItem(PLAN_KEY,JSON.stringify(plans))}
function buildMonth(base,off){const d=new Date(base.getFullYear(),base.getMonth()+off,1),y=d.getFullYear(),m=d.getMonth(),first=d.getDay(),last=new Date(y,m+1,0).getDate();let h=`<div class="month"><div class="month-title">${y}年 ${m+1}月</div><div class="grid">`;['日','月','火','水','木','金','土'].forEach(w=>h+=`<div class="dow">${w}</div>`);for(let i=0;i<first;i++)h+='<div></div>';for(let day=1;day<=last;day++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,dayEvents=events.filter(e=>dateInEvent(e,ds)),dayPlans=plans.filter(p=>p.date===ds),cnt=dayEvents.length+dayPlans.length,today=new Date().toISOString().slice(0,10)===ds;let names=dayEvents.slice(0,2).map(e=>`<span class="dayTitle">🦍 ${esc(e.title).replace(/^🦍\s*/, '').replace(/^🐩\s*/, '').replace(/^🦍\s*/, '').replace(/^🐷\s*/, '')}</span>`).join('');if(dayEvents.length<2)names+=dayPlans.slice(0,2-dayEvents.length).map(p=>`<span class="dayTitle planTitle">📝 ${esc(p.title)}</span>`).join('');h+=`<button class="day ${cnt?'has':''} ${today?'today':''} ${selectedDate===ds?'selected':''}" onclick="selectDate('${ds}')"><div class="num">${day}</div>${cnt?'<div>'+Array(Math.min(cnt,4)).fill('<span class="dot"></span>').join('')+'</div>'+names:''}</button>`}return h+'</div></div>'}
function renderCalendar(){calendar.innerHTML='';for(let i=-1;i<=4;i++)calendar.innerHTML+=buildMonth(new Date(),i)}function selectDate(ds){selectedDate=ds;renderCalendar();renderEvents();go('eventsSec')}function todaySelect(){selectDate(new Date().toISOString().slice(0,10))}
function profit(e){return +e.sales-+e.fee-+e.cost-+e.labor-+e.other}function expense(e){return +e.fee+ +e.cost+ +e.labor+ +e.other}
function renderEvents(){selectedTitle.textContent=selectedDate+' の予定・イベント';let ds=events.filter(e=>dateInEvent(e,selectedDate));let ps=plans.filter(p=>p.date===selectedDate);let html='';if(!ds.length){html+='<div class="muted" style="padding:10px 4px">この日の共有イベントはありません。</div>'}else{html+=ds.map(e=>`<div class="event"><div class="between"><h3>${esc(e.title)}</h3><span class="pill">共有</span></div><div class="kv"><b>イベント名</b><span>${esc(e.title||'イベント')}</span><b>場所</b><span>${esc(e.place||'未入力')}</span><b>ネタ</b><span>${esc(e.itemsText||'未入力')}</span><b>日程</b><span>${esc(dateRangeText(e))}</span></div><button class="btn full" onclick="toggleCalc('${e.id}')">損益計算書を記入</button><div class="calc" id="calc_${e.id}"><hr><div class="calc-grid">${input(e,'sales','売上')}${input(e,'fee','場所代')}${input(e,'cost','仕入・材料')}${input(e,'labor','人件費')}${input(e,'other','その他')}<div><label>利益</label><div class="total ${profit(e)>=0?'profit':'loss'}" id="profit_${e.id}">${yen(profit(e))}</div></div></div></div></div>`).join('')}
eventList.innerHTML=html;if(ps.length){personalList.innerHTML='<div class="miniTitle">📝 自分の予定</div>'+ps.map(p=>`<div class="event personal"><div class="between"><h3>${esc(p.title)}</h3><button class="btn red" onclick="deletePersonalPlan('${p.id}')">削除</button></div><div class="kv"><b>時間</b><span>${esc(p.time||'未入力')}</span><b>メモ</b><span>${esc(p.memo||'')}</span></div></div>`).join('')}else{personalList.innerHTML=''} }
function addPersonalPlan(){const title=(pTitle.value||'自分の予定').trim();plans.push({id:uid(),date:selectedDate,title,time:pTime.value,memo:pMemo.value});savePlans();pTitle.value=pTime.value=pMemo.value='';renderAll()}
function deletePersonalPlan(id){if(!confirm('この予定を削除しますか？'))return;plans=plans.filter(p=>p.id!==id);savePlans();renderAll()}
function input(e,k,l){return `<div><label>${l}</label><input type="number" inputmode="numeric" value="${e[k]||0}" oninput="updateMoney('${e.id}','${k}',this.value)"></div>`}
function toggleCalc(id){document.getElementById('calc_'+id).classList.toggle('open')}
function updateMoney(id,k,v){const e=events.find(x=>x.id===id);if(!e)return;e[k]=Number(v||0);e.updatedAt=Date.now();saveOwn();const key=e.mainId||String(e.id||'').replace(/^main_/,'');const payload={sales:+e.sales||0,fee:+e.fee||0,cost:+e.cost||0,labor:+e.labor||0,other:+e.other||0,updatedAt:e.updatedAt};const r=fbRef(key);if(r)r.update(payload);const c=centerRef(key);if(c)c.update(payload);const p=document.getElementById('profit_'+id);if(p){p.textContent=yen(profit(e));p.className='total '+(profit(e)>=0?'profit':'loss')}renderSummaries()}
function addEvent(){const e={id:uid(),date:fDate.value||selectedDate,title:fTitle.value||'イベント',place:fPlace.value,client:fClient.value,detail:fDetail.value,sales:0,fee:0,cost:0,labor:0,other:0,secret:false};events.push(e);saveOwn();selectedDate=e.date;fTitle.value=fPlace.value=fClient.value=fDetail.value='';renderAll();alert('登録しました')}
function deleteEvent(id){if(!confirm('削除しますか？'))return;events=events.filter(e=>e.id!==id);saveOwn();renderAll()}
function sum(list){return list.reduce((a,e)=>(moneyKeys.forEach(k=>a[k]+=+e[k]||0),a.profit+=profit(e),a),{sales:0,fee:0,cost:0,labor:0,other:0,profit:0})}
function boxes(s){return `<div class="summaryGrid"><div class="sumBox"><b>売上</b><span>${yen(s.sales)}</span></div><div class="sumBox"><b>経費合計</b><span>${yen(s.fee+s.cost+s.labor+s.other)}</span></div><div class="sumBox"><b>仕入</b><span>${yen(s.cost)}</span></div><div class="sumBox"><b>場所代</b><span>${yen(s.fee)}</span></div><div class="sumBox"><b>人件費</b><span>${yen(s.labor)}</span></div><div class="sumBox"><b>その他</b><span>${yen(s.other)}</span></div><div class="sumBox"><b>利益</b><span class="${s.profit>=0?'profit':'loss'}">${yen(s.profit)}</span></div></div>`}
function renderSummaries(){if(!monthPick.value)monthPick.value=selectedDate.slice(0,7);let mlist=events.filter(e=>e.date.slice(0,7)===monthPick.value),ms=sum(mlist);monthSummary.innerHTML=boxes(ms)+`<table class="table"><tr><th>日付</th><th>イベント</th><th>売上</th><th>利益</th></tr>${mlist.map(e=>`<tr><td>${e.date.slice(5)}</td><td>${esc(e.title)}</td><td>${yen(e.sales)}</td><td>${yen(profit(e))}</td></tr>`).join('')}</table>`;let y=yearPick.value||new Date().getFullYear();let rows='';for(let i=1;i<=12;i++){let ym=y+'-'+String(i).padStart(2,'0'),ss=sum(events.filter(e=>e.date.slice(0,7)===ym));rows+=`<tr><td>${i}月</td><td>${yen(ss.sales)}</td><td>${yen(ss.fee+ss.cost+ss.labor+ss.other)}</td><td>${yen(ss.profit)}</td></tr>`}yearSummary.innerHTML=`<table class="table"><tr><th>月</th><th>売上</th><th>経費</th><th>利益</th></tr>${rows}</table>`}
function setupYears(){let y=new Date().getFullYear();yearPick.innerHTML='';for(let i=y-2;i<=y+2;i++)yearPick.innerHTML+=`<option ${i==y?'selected':''}>${i}</option>`;monthPick.value=selectedDate.slice(0,7)}
function go(id,btn){document.querySelectorAll('.page').forEach(s=>s.classList.remove('activePage'));document.getElementById(id).classList.add('activePage');window.scrollTo({top:0,behavior:'smooth'});if(btn){document.querySelectorAll('.footerNav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}}function renderAll(){renderCalendar();renderEvents();renderSummaries()}loadEvents();setupYears();renderAll();
</script></body></html>
