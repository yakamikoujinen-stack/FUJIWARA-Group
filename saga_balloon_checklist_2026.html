 "note": "", "done": false}];const KEY='fujiwara_saga_balloon_checklist_2026_v1';
const GROUPS=[...new Set(BASE.map(x=>x.section))];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:structuredClone(BASE)}catch(e){return structuredClone(BASE)}}let items=load();
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('保存できません。CSVやバックアップを保存してください。')}}
function edit(id,key,val){let r=items.find(x=>x.id===id);if(r){r[key]=val;save();if(key==='done')render();else updateStats()}}
function updateStats(){const checked=items.filter(x=>x.done).length;const total=items.length;document.getElementById('stats').textContent=`準備完了 ${checked} / ${total} 項目（${Math.round(checked/Math.max(total,1)*100)}%）`;document.getElementById('bar').style.width=(checked/Math.max(total,1)*100)+'%'}
function render(){document.querySelector('#newsection').innerHTML=GROUPS.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');document.querySelector('#sections').innerHTML=GROUPS.map(g=>{const its=items.filter(x=>x.section===g),done=its.filter(x=>x.done).length;return `<section class="section"><div class="section-head"><h2>${esc(g)}</h2><span class="muted">${done}/${its.length} 完了</span></div><div class="tablewrap"><table><thead><tr><th>✅</th><th>品名・確認内容</th><th>数量</th><th>備考</th><th class="no-print">削除</th></tr></thead><tbody>${its.map(x=>`<tr class="${x.done?'checked':''}"><td><input aria-label="完了チェック" type="checkbox" ${x.done?'checked':''} onchange='edit(${JSON.stringify(x.id)},"done",this.checked)'></td><td><input aria-label="品名" class="itemname" type="text" value="${esc(x.name)}" oninput='edit(${JSON.stringify(x.id)},"name",this.value)'></td><td><input aria-label="数量" type="text" value="${esc(x.qty)}" placeholder="数量・単位" oninput='edit(${JSON.stringify(x.id)},"qty",this.value)'></td><td><input aria-label="備考" type="text" value="${esc(x.note)}" placeholder="備考・担当など" oninput='edit(${JSON.stringify(x.id)},"note",this.value)'></td><td class="no-print"><button class="delbtn" onclick='removeItem(${JSON.stringify(x.id)})'>削除</button></td></tr>`).join('')}</tbody></table></div><div class="hint no-print">この分類へ追加する場合は、上の「追加項目」から選択してください。</div></section>`}).join('');updateStats()}
function addItem(){const name=document.querySelector('#newname').value.trim();if(!name){alert('追加項目名を入力してください');return}items.push({id:'added-'+Date.now()+'-'+Math.random().toString(36).slice(2),section:document.querySelector('#newsection').value,name,qty:document.querySelector('#newqty').value,note:document.querySelector('#newnote').value,done:false});save();render();for(let s of ['#newname','#newqty','#newnote'])document.querySelector(s).value='';alert('項目を追加しました')}
function removeItem(id){if(!confirm('この項目を削除しますか？'))return;items=items.filter(x=>x.id!==id);save();render()}
function resetChecklist(){if(!confirm('チェック・数量・備考・追加項目をすべて初期化します。よろしいですか？'))return;items=structuredClone(BASE);save();render()}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function exportCSV(){const q=x=>'"'+String(x??'').replaceAll('"','""')+'"';let lines=[['分類','完了','項目名','数量','備考'],...items.map(x=>[x.section,x.done?'済':'未',x.name,x.qty,x.note])];download('佐賀バルーン_出店チェックリスト.csv','\ufeff'+lines.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backupJSON(){download('佐賀バルーン_出店チェックリスト_バックアップ.json',JSON.stringify({version:1,items},null,2),'application/json')}
function restoreJSON(ev){let f=ev.target.files?.[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!Array.isArray(j.items)||!j.items.every(x=>typeof x.id==='string'&&typeof x.section==='string'&&typeof x.name==='string'))throw Error();if(!confirm('現在の入力内容をバックアップで上書きしますか？'))return;items=j.items;save();render();alert('復元しました')}catch(e){alert('バックアップの形式が正しくありません')}finally{ev.target.value=''}})}
render();
