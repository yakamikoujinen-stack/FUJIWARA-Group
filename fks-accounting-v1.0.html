<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FKS Accounting v1.0</title>
<style>
:root{--bg:#07111f;--card:#101d31;--card2:#152640;--text:#eef5ff;--muted:#a9b8d0;--gold:#f4c95d;--green:#35d07f;--red:#ff6b6b;--blue:#5da9ff;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(160deg,#06101d,#0d1f38 55%,#111827);color:var(--text);padding:16px;padding-bottom:90px}header{position:sticky;top:0;z-index:5;background:rgba(7,17,31,.88);backdrop-filter:blur(10px);margin:-16px -16px 16px;padding:18px 16px;border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0;color:var(--gold)}.sub{color:var(--muted);font-size:13px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:rgba(16,29,49,.94);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 12px 28px rgba(0,0,0,.22)}.card h2{margin:0 0 10px;font-size:16px}.big{font-size:24px;font-weight:800}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.muted{color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#0b1628;color:var(--text);padding:12px;font-size:16px}button{border:0;border-radius:14px;padding:12px 14px;font-weight:800;font-size:15px;color:#07111f;background:var(--gold);width:100%;margin-top:10px}.btn2{background:#203653;color:var(--text);border:1px solid var(--line)}.btnred{background:#5b1e2a;color:white}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.tab{background:#12233b;color:var(--text);padding:11px 6px;border-radius:14px;text-align:center;font-size:13px;border:1px solid var(--line)}.tab.active{background:var(--gold);color:#07111f;font-weight:800}.page{display:none}.page.active{display:block}.row{display:flex;gap:8px}.row>*{flex:1}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:600}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#203653;font-size:12px}.fixed{position:fixed;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(7,17,31,.92);border:1px solid var(--line);border-radius:18px;padding:8px;backdrop-filter:blur(10px)}.nav{padding:10px 4px;text-align:center;border-radius:12px;font-size:12px;color:var(--muted)}.nav.active{background:var(--gold);color:#07111f;font-weight:800}.full{grid-column:1/-1}.ai{line-height:1.65;background:linear-gradient(135deg,rgba(244,201,93,.14),rgba(93,169,255,.10));border:1px solid rgba(244,201,93,.25)}@media(min-width:760px){body{max-width:980px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fixed{max-width:980px;margin:auto}}
</style>
</head>
<body>
<header><h1>👑 FKS Accounting v1.0</h1><div class="sub">FUJIWARA KING SYSTEM｜会計・売上・経費・利益管理</div></header>
<div class="tabs"><div class="tab active" onclick="showPage('dash',this)">📊 概要</div><div class="tab" onclick="showPage('input',this)">✍️ 入力</div><div class="tab" onclick="showPage('list',this)">📋 一覧</div><div class="tab" onclick="showPage('setting',this)">⚙️ 設定</div></div>
<section id="dash" class="page active">
 <div class="grid">
  <div class="card"><h2>今月売上</h2><div class="big" id="salesTotal">¥0</div></div>
  <div class="card"><h2>今月経費</h2><div class="big red" id="expenseTotal">¥0</div></div>
  <div class="card"><h2>今月利益</h2><div class="big green" id="profitTotal">¥0</div></div>
  <div class="card"><h2>利益率</h2><div class="big gold" id="profitRate">0%</div></div>
  <div class="card full ai"><h2>🤖 AI秘書コメント</h2><div id="aiComment">データを入力すると、ここに経営コメントを表示します。</div></div>
  <div class="card full"><h2>🏦 現預金メモ</h2><div class="row"><div><span class="muted">現金</span><div class="big" id="cashView">¥0</div></div><div><span class="muted">銀行</span><div class="big" id="bankView">¥0</div></div></div></div>
 </div>
</section>
<section id="input" class="page">
 <div class="card"><h2>✍️ 売上・経費入力</h2>
  <div class="formgrid">
   <div><label>日付</label><input id="date" type="date"></div>
   <div><label>区分</label><select id="type"><option value="sales">売上</option><option value="expense">経費</option></select></div>
   <div><label>事業</label><select id="biz"><option>建設</option><option>イベント</option><option>メイン</option><option>その他</option></select></div>
   <div><label>項目</label><input id="item" placeholder="例：○○現場売上、材料費、燃料代"></div>
   <div><label>金額</label><input id="amount" type="number" inputmode="numeric" placeholder="例：120000"></div>
   <div><label>支払/入金方法</label><select id="method"><option>現金</option><option>銀行</option><option>売掛</option><option>買掛</option><option>その他</option></select></div>
   <div class="full"><label>メモ</label><textarea id="memo" rows="3" placeholder="必要ならメモ"></textarea></div>
  </div>
  <button onclick="addRecord()">登録する</button><button class="btn2" onclick="clearForm()">入力クリア</button>
 </div>
</section>
<section id="list" class="page">
 <div class="card"><h2>📋 登録一覧</h2><table><thead><tr><th>日付</th><th>区分</th><th>事業</th><th>項目</th><th>金額</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
</section>
<section id="setting" class="page">
 <div class="card"><h2>⚙️ 資金設定</h2><label>現金残高</label><input id="cash" type="number" inputmode="numeric"><label>銀行残高</label><input id="bank" type="number" inputmode="numeric"><button onclick="saveMoney()">保存</button></div>
 <div class="card" style="margin-top:12px"><h2>🧹 データ管理</h2><button class="btnred" onclick="resetAll()">全データ削除</button></div>
</section>
<nav class="fixed"><div class="nav active" onclick="showPageById('dash')">📊<br>概要</div><div class="nav" onclick="showPageById('input')">✍️<br>入力</div><div class="nav" onclick="showPageById('list')">📋<br>一覧</div><div class="nav" onclick="showPageById('setting')">⚙️<br>設定</div></nav>
<script>
const KEY='fks_accounting_v1_records'; const MONEY='fks_accounting_v1_money';
let records=JSON.parse(localStorage.getItem(KEY)||'[]'); let money=JSON.parse(localStorage.getItem(MONEY)||'{"cash":0,"bank":0}');
document.getElementById('date').valueAsDate=new Date(); document.getElementById('cash').value=money.cash||0; document.getElementById('bank').value=money.bank||0;
function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function save(){localStorage.setItem(KEY,JSON.stringify(records)); render()}
function addRecord(){const r={id:Date.now(),date:date.value,type:type.value,biz:biz.value,item:item.value.trim(),amount:Number(amount.value||0),method:method.value,memo:memo.value.trim()}; if(!r.date||!r.item||!r.amount){alert('日付・項目・金額を入れてください');return} records.unshift(r); localStorage.setItem(KEY,JSON.stringify(records)); clearForm(); render(); showPageById('dash')}
function clearForm(){item.value=''; amount.value=''; memo.value=''; date.valueAsDate=new Date()}
function delRecord(id){if(confirm('この明細を削除しますか？')){records=records.filter(r=>r.id!==id); save()}}
function saveMoney(){money={cash:Number(cash.value||0),bank:Number(bank.value||0)}; localStorage.setItem(MONEY,JSON.stringify(money)); render(); alert('保存しました')}
function resetAll(){if(confirm('本当に全データを削除しますか？')){records=[];localStorage.removeItem(KEY);render()}}
function thisMonth(r){const d=new Date(r.date), n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()}
function render(){const month=records.filter(thisMonth); const sales=month.filter(r=>r.type==='sales').reduce((s,r)=>s+r.amount,0); const exp=month.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0); const profit=sales-exp; salesTotal.textContent=yen(sales); expenseTotal.textContent=yen(exp); profitTotal.textContent=yen(profit); profitTotal.className='big '+(profit>=0?'green':'red'); profitRate.textContent=sales?Math.round(profit/sales*100)+'%':'0%'; cashView.textContent=yen(money.cash); bankView.textContent=yen(money.bank); tbody.innerHTML=records.map(r=>`<tr><td>${r.date}</td><td><span class="pill">${r.type==='sales'?'売上':'経費'}</span></td><td>${r.biz}</td><td>${escapeHtml(r.item)}</td><td class="${r.type==='sales'?'green':'red'}">${yen(r.amount)}</td><td><button class="btn2" style="padding:6px;margin:0" onclick="delRecord(${r.id})">削除</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">まだ登録がありません</td></tr>'; aiComment.textContent=makeAI(sales,exp,profit)}
function makeAI(s,e,p){if(!records.length)return 'まずは売上・経費を入力してください。利益と資金の流れを見える化できます。'; if(s===0)return '今月は売上登録がまだありません。入金予定や請求漏れを確認してください。'; const rate=p/s*100; if(p<0)return '今月は赤字です。大きい経費を確認して、不要な支出を止めましょう。'; if(rate>=30)return '利益率は良好です。この調子で高利益の仕事を増やすと資金が貯まりやすくなります。'; if(rate>=10)return '利益は出ています。材料費・人件費・燃料費を確認するとさらに改善できます。'; return '利益率が低めです。売上単価、原価、移動費を見直してください。'}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showPage(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); if(el)el.classList.add('active'); document.querySelectorAll('.nav').forEach((n,i)=>n.classList.toggle('active',['dash','input','list','setting'][i]===id))}
function showPageById(id){showPage(id,document.querySelectorAll('.tab')[['dash','input','list','setting'].indexOf(id)])}
render();
</script>
</body>
</html>
