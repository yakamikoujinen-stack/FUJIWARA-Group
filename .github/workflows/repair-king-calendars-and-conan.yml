name: Repair KING calendars and Conan subcontract card
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-king-calendars-and-conan.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safely ensure required KING cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('king.html')
          s=p.read_text(encoding='utf-8')

          client='<a class="hub-card calendar-fixed" href="king-client-schedule.html?v=20260908-1235"><div><div class="hub-top"><div class="hub-icon">📅</div><div class="hub-title">取引先名別カレンダー</div></div><div class="hub-desc">メイン＋建設の予定を取引先名別・色分けで月間確認</div></div><div class="hub-open">カレンダーを見る ›</div></a>'
          staff='<a class="hub-card calendar-fixed" href="king-staff-schedule.html?v=20260911"><div><div class="hub-top"><div class="hub-icon">👥</div><div class="hub-title">配置スタッフスケジュール</div></div><div class="hub-desc">月間予定を配置スタッフ付きで確認・スタッフ名や取引先で絞り込み</div></div><div class="hub-open">スケジュールを見る ›</div></a>'
          docs='<a class="hub-card docs-fixed" href="king-documents-center.html?v=20260908-1235"><div><div class="hub-top"><div class="hub-icon">🧾</div><div class="hub-title">見積・請求書</div></div><div class="hub-desc">見積書・請求書の作成と管理</div></div><div class="hub-open">開く ›</div></a>'
          conan_import='<a class="hub-card conan-fixed" href="conan-event-import.html"><div><div class="hub-top"><div class="hub-icon">📋</div><div class="hub-title">コナン予定取込</div></div><div class="hub-desc">コナンプロデュースから届いた予定を貼り付けて一覧表に変換・保存</div></div><div class="hub-open">開く ›</div></a>'
          conan_split='<a class="hub-card conan-fixed" href="family-conan-contract-dev.html"><div><div class="hub-top"><div class="hub-icon">🤝</div><div class="hub-title">コナン請負振分</div></div><div class="hub-desc">メインイベントのネタをFUJIWARA Group・まゆみ・龍来・想良・FUJIWARAスタッフへ振り分け</div></div><div class="hub-open">振分管理を開く ›</div></a>'

          # Keep existing client calendar and staff schedule together before documents.
          if 'king-client-schedule.html' not in s:
              if docs not in s: raise SystemExit('documents anchor missing')
              s=s.replace(docs, client+docs, 1)
          if 'king-staff-schedule.html' not in s:
              if docs not in s: raise SystemExit('documents anchor missing')
              s=s.replace(docs, staff+docs, 1)
          else:
              s=s.replace('king-staff-schedule.html?v=20260909','king-staff-schedule.html?v=20260911')

          # Add Conan subcontract card without touching existing cards.
          if 'family-conan-contract-dev.html' not in s:
              if conan_import not in s: raise SystemExit('Conan import anchor missing')
              s=s.replace(conan_import, conan_import+conan_split, 1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only KING change
        run: |
          if git diff --quiet -- king.html; then echo 'No change needed'; exit 0; fi
          git config user.name "FUJIWARA safe patch"
          git config user.email "actions@users.noreply.github.com"
          git add king.html
          git commit -m "Keep KING calendars and add Conan subcontract card"
          git push
