name: Add staff schedule to KING

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-staff-schedule-to-king.yml'
      - 'king.html'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add staff schedule card safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('king.html')
          s=p.read_text(encoding='utf-8')
          href='king-staff-schedule.html'
          if href in s:
              print('Staff schedule card already exists')
          else:
              anchor='<a class="hub-card calendar-fixed" href="king-client-schedule.html?v=20260908-1235"><div><div class="hub-top"><div class="hub-icon">📅</div><div class="hub-title">取引先名別カレンダー</div></div><div class="hub-desc">メイン＋建設の予定を取引先名別・色分けで月間確認</div></div><div class="hub-open">カレンダーを見る ›</div></a>'
              card='\n<a class="hub-card calendar-fixed" href="king-staff-schedule.html?v=20260909"><div><div class="hub-top"><div class="hub-icon">👥</div><div class="hub-title">配置スタッフスケジュール</div></div><div class="hub-desc">月間予定を配置スタッフ付きで確認・スタッフ名や取引先で絞り込み</div></div><div class="hub-open">スケジュールを見る ›</div></a>'
              if anchor not in s:
                  raise SystemExit('Anchor card not found; aborting without changes')
              s=s.replace(anchor,anchor+card,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- king.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "FUJIWARA safe patch"
          git config user.email "actions@users.noreply.github.com"
          git add king.html
          git commit -m "Add staff assignment schedule to KING home"
          git push
