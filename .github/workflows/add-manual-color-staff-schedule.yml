name: Add manual color selection to staff schedule
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-manual-color-staff-schedule.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch manual color selection safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('king-staff-schedule.html')
          s=p.read_text(encoding='utf-8')

          # 1) Select styling
          old='.field input,.field textarea{width:100%;border:1px solid #ccd7e4;border-radius:10px;padding:11px;font:inherit}'
          new='.field input,.field textarea,.field select{width:100%;border:1px solid #ccd7e4;border-radius:10px;padding:11px;font:inherit;background:#fff;color:#102043}'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('field style anchor missing')

          # 2) Add color selector only to manual-entry modal
          anchor='<div class="field"><label>配置スタッフ（「・」または「、」区切り）</label><input id="manualStaff" placeholder="例：藤原・文太・将"></div>'
          color_field='''<div class="field"><label>色分け</label><select id="manualColor"><option value="green">🟢 緑</option><option value="red">🔴 赤</option><option value="yellow">🟡 黄</option><option value="blue">🔵 青</option><option value="purple">🟣 紫</option><option value="orange">🟠 オレンジ</option><option value="gray">⚫ グレー</option></select></div>'''
          if 'id="manualColor"' not in s:
              if anchor not in s: raise SystemExit('manual staff anchor missing')
              s=s.replace(anchor,anchor+color_field,1)

          # 3) Add color palette helper
          marker="function buildRows(){"
          helper="function manualCol(k){const m={green:['#edfdf3','#168653'],red:['#fff0f0','#e04b4b'],yellow:['#fff8df','#d49a13'],blue:['#eef7ff','#3182ce'],purple:['#f6efff','#8b5cc7'],orange:['#fff3e8','#d9782d'],gray:['#f1f3f5','#6b7280']};return m[k]||m.green}"
          if 'function manualCol(' not in s:
              if marker not in s: raise SystemExit('buildRows anchor missing')
              s=s.replace(marker,helper+marker,1)

          # 4) Carry saved manual color into rendered row
          oldrow="staff:namesFrom(x.staff),manual:true})"
          newrow="staff:namesFrom(x.staff),manual:true,color:x.color||'green'})"
          if oldrow in s:
              s=s.replace(oldrow,newrow,1)
          elif newrow not in s:
              raise SystemExit('manual row anchor missing')

          # 5) Use selected color only for manual rows
          oldrender="let c=col(r.client),staff=r.staff.length?"
          newrender="let c=r.manual?manualCol(r.color):col(r.client),staff=r.staff.length?"
          if oldrender in s:
              s=s.replace(oldrender,newrender,1)
          elif newrender not in s:
              raise SystemExit('render color anchor missing')

          # 6) Default new manual entries to green
          oldopen="manualStaff.value='';deleteBtn.style.display='none';"
          newopen="manualStaff.value='';manualColor.value='green';deleteBtn.style.display='none';"
          if oldopen in s:
              s=s.replace(oldopen,newopen,1)
          elif newopen not in s:
              raise SystemExit('openManual anchor missing')

          # 7) Load saved color while editing existing manual entries
          oldedit="manualStaff.value=Array.isArray(x.staff)?x.staff.join('・'):(x.staff||'');deleteBtn.style.display='block';"
          newedit="manualStaff.value=Array.isArray(x.staff)?x.staff.join('・'):(x.staff||'');manualColor.value=x.color||'green';deleteBtn.style.display='block';"
          if oldedit in s:
              s=s.replace(oldedit,newedit,1)
          elif newedit not in s:
              raise SystemExit('editManual anchor missing')

          # 8) Save selected color to existing separate manual schedule Firebase path
          oldsave="staff:namesFrom(manualStaff.value),updatedAt:new Date().toISOString()"
          newsave="staff:namesFrom(manualStaff.value),color:manualColor.value||'green',updatedAt:new Date().toISOString()"
          if oldsave in s:
              s=s.replace(oldsave,newsave,1)
          elif newsave not in s:
              raise SystemExit('saveManual anchor missing')

          # 9) Clarify legend; no source data changes
          oldlegend='手入力の「その他予定」は緑色で表示し、タップすると編集・削除できます。'
          newlegend='手入力の「その他予定」は色を選択でき、タップすると編集・削除できます。'
          if oldlegend in s:
              s=s.replace(oldlegend,newlegend,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only staff schedule
        run: |
          if git diff --quiet -- king-staff-schedule.html; then echo 'No change needed'; exit 0; fi
          git config user.name 'FUJIWARA safe patch'
          git config user.email 'actions@users.noreply.github.com'
          git add king-staff-schedule.html
          git commit -m 'Add manual color selection to staff schedule'
          git push origin main
