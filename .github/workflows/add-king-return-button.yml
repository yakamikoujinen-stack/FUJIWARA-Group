name: Restrict KING return button to leaders

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-king-return-button.yml'

permissions:
  contents: write

jobs:
  patch-main-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Show KING return button only to leader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.king-return-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;'
          new='.king-return-btn{display:none;align-items:center;justify-content:center;gap:5px;'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('KING button CSS anchor not found; refusing to modify')
          anchor="  badge.className = 'role-badge ' + cls[role];"
          line="\n  var kingReturnBtn = document.querySelector('.king-return-btn');\n  if (kingReturnBtn) kingReturnBtn.style.display = (role === 'leader') ? 'inline-flex' : 'none';"
          if 'kingReturnBtn.style.display' not in s:
              if anchor not in s:
                  raise SystemExit('initApp role anchor not found; refusing to modify')
              s=s.replace(anchor,anchor+line,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit leader-only visibility change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change to commit.'
            exit 0
          fi
          git config user.name 'FUJIWARA App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Show KING return button only for leader'
          git push origin main
# rerun 2026-08-31 19:00 JST
