name: Add KING return button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-king-return-button.yml'

permissions:
  contents: write

jobs:
  patch-main-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add KING return button without changing existing app logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'class="king-return-btn"' in s:
              print('KING return button already exists; no change needed.')
              raise SystemExit(0)

          css_anchor = '.main-content{flex:1;padding-bottom:66px;}'
          css = '''.king-return-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:34px;padding:0 11px;border:1.5px solid var(--gold);border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200;text-decoration:none;font-size:11px;font-weight:900;white-space:nowrap;box-shadow:0 2px 10px rgba(200,168,75,.22);}\n.king-return-btn:active{transform:scale(.97);}\n@media(max-width:520px){.king-return-btn{height:34px;padding:0 9px;font-size:10px}.king-return-btn .king-return-label{display:none}.king-return-btn .king-return-short{display:inline}}\n@media(min-width:521px){.king-return-btn .king-return-short{display:none}}\n'''
          if css_anchor not in s:
              raise SystemExit('CSS anchor not found; refusing to modify index.html')
          s = s.replace(css_anchor, css + css_anchor, 1)

          html_anchor = '      <button class="btn btn-icon btn-ghost" onclick="openNoticeModal()" style="font-size:17px">🔔</button>'
          button = '      <a class="king-return-btn" href="king.html" aria-label="KINGアプリへ戻る">👑 <span class="king-return-label">KINGへ戻る</span><span class="king-return-short">KING</span></a>\n'
          if html_anchor not in s:
              raise SystemExit('Header anchor not found; refusing to modify index.html')
          s = s.replace(html_anchor, button + html_anchor, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched main app
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change to commit.'
            exit 0
          fi
          git config user.name 'FUJIWARA App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add KING return button to main app'
          git push origin main
