name: Add annual toggle to KING money dashboard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-annual-toggle-king-money.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch king-money safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('king-money.html')
          s=p.read_text(encoding='utf-8')
          if 'id="periodModeMonth"' in s:
              print('Already installed')
              raise SystemExit(0)

          css='.period-switch{display:flex;gap:8px;margin:0 0 10px}.period-btn{border:1.5px solid #d4c078;background:#fff;color:#6d5312;border-radius:12px;padding:10px 16px;font-weight:950}.period-btn.active{background:#17324d;color:#fff;border-color:#17324d}.year-field{display:none}.year-field.show{display:block}'
          s=s.replace('</style>',css+'</style>',1)

          anchor='<section class="filters"><div class="field"><label>月で絞り込み</label><input id="monthFilter" type="month" onchange="render()"></div>'
          repl='''<div class="period-switch"><button id="periodModeMonth" class="period-btn active" type="button" onclick="setPeriodMode('month')">月間</button><button id="periodModeYear" class="period-btn" type="button" onclick="setPeriodMode('year')">年間</button></div><section class="filters"><div class="field" id="monthField"><label>月で絞り込み</label><input id="monthFilter" type="month" onchange="render()"></div><div class="field year-field" id="yearField"><label>年で絞り込み</label><select id="yearFilter" onchange="render()"></select></div>'''
          if anchor not in s: raise SystemExit('filters anchor not found')
          s=s.replace(anchor,repl,1)

          # Company allocation helper: make it accept either YYYY-MM or YYYY prefix.
          s=s.replace('function companyTotalsForMonth(month){','function companyTotalsForPeriod(period){',1)
          s=s.replace('if(month&&d&&d!==month)return;','if(period&&d&&!String(d).startsWith(period))return;',1)
          s=s.replace('companyTotalsForMonth(month)','companyTotalsForPeriod(period)')

          # Office expense helper already supports startsWith; rename arg only for clarity.
          s=s.replace("function officeExpenseTotal(month){return officeExpenses.filter(r=>!month||String(r.date||'').startsWith(month)).reduce((s,r)=>s+n(r.amount),0)}",
                      "function officeExpenseTotal(period){return officeExpenses.filter(r=>!period||String(r.date||'').startsWith(period)).reduce((s,r)=>s+n(r.amount),0)}",1)

          # Add mode helpers immediately before render.
          marker='function render(){const month=monthFilter.value,st=statusFilter.value,q=searchFilter.value.trim().toLowerCase();'
          helper='''let periodMode='month';
function buildYearFilter(){const ys=[...new Set(allRows().map(r=>String(r.date||'').slice(0,4)).filter(Boolean))];const now=String(new Date().getFullYear());if(!ys.includes(now))ys.push(now);ys.sort().reverse();yearFilter.innerHTML=ys.map(y=>`<option value="${y}">${y}年</option>`).join('');yearFilter.value=now;}
function setPeriodMode(mode){periodMode=mode;const monthly=mode==='month';periodModeMonth.classList.toggle('active',monthly);periodModeYear.classList.toggle('active',!monthly);monthField.style.display=monthly?'block':'none';yearField.classList.toggle('show',!monthly);render();}
function render(){const period=periodMode==='month'?monthFilter.value:yearFilter.value,st=statusFilter.value,q=searchFilter.value.trim().toLowerCase();'''
          if marker not in s: raise SystemExit('render marker not found')
          s=s.replace(marker,helper,1)

          s=s.replace("if(month&&!String(r.date||'').startsWith(month))return false;","if(period&&!String(r.date||'').startsWith(period))return false;",1)
          s=s.replace('officeExpenseTotal(month)','officeExpenseTotal(period)')
          s=s.replace("(month?month.replace('-','年')+'月':'全期間')+'の事務所経費 '","(periodMode==='month'?(period?period.replace('-','年')+'月':'全期間'):(period?period+'年':'全期間'))+'の事務所経費 '",1)

          # Any remaining company summary month argument in render should use period.
          s=s.replace('renderCompanyKpis(month,', 'renderCompanyKpis(period,')
          s=s.replace('renderCompanySummary(month,', 'renderCompanySummary(period,')
          s=s.replace('updateCompanyKpis(month,', 'updateCompanyKpis(period,')

          # Build year options after loading current Firebase data.
          needle='events=arr(eventSnap.val());officeExpenses=arr(officeSnap.val());'
          if needle in s and 'buildYearFilter();render()' not in s:
              s=s.replace(needle,needle+'buildYearFilter();',1)
          elif 'buildYearFilter();' not in s:
              raise SystemExit('load anchor not found')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- king-money.html; then echo no-change; exit 0; fi
          git config user.name 'FUJIWARA App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add king-money.html
          git commit -m 'Add monthly annual toggle to KING money summary'
          git push origin main
# rerun 2026-09-02 JST
