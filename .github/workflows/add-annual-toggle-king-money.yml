name: Add annual toggle to KING money dashboard
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-annual-toggle-king-money.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch king-money safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('king-money.html')
          s=p.read_text(encoding='utf-8')
          if 'id="periodModeMonth"' in s:
              print('Annual toggle already installed')
              raise SystemExit(0)

          # CSS additions only.
          css_anchor='.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;background:#fff;border:2px solid #e4cd88;border-radius:20px;padding:14px;margin-bottom:14px}'
          css_new='.period-switch{display:flex;gap:8px;margin:0 0 10px}.period-btn{border:1.5px solid #d4c078;background:#fff;color:#6d5312;border-radius:12px;padding:10px 16px;font-weight:950}.period-btn.active{background:#17324d;color:#fff;border-color:#17324d}.year-wrap{display:none}.year-wrap.show{display:block}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;background:#fff;border:2px solid #e4cd88;border-radius:20px;padding:14px;margin-bottom:14px}'
          if css_anchor not in s:
              raise SystemExit('filters css anchor not found')
          s=s.replace(css_anchor,css_new,1)

          # Add month/year switch above existing filters.
          html_anchor='<section class="filters"><div class="field"><label>月で絞り込み</label><input id="monthFilter" type="month" onchange="render()"></div>'
          html_new='''<div class="period-switch"><button id="periodModeMonth" class="period-btn active" type="button" onclick="setPeriodMode('month')">月間</button><button id="periodModeYear" class="period-btn" type="button" onclick="setPeriodMode('year')">年間</button></div><section class="filters"><div class="field" id="monthField"><label>月で絞り込み</label><input id="monthFilter" type="month" onchange="render()"></div><div class="field year-wrap" id="yearField"><label>年で絞り込み</label><select id="yearFilter" onchange="render()"></select></div>'''
          if html_anchor not in s:
              raise SystemExit('filters html anchor not found')
          s=s.replace(html_anchor,html_new,1)

          # State/helpers before render.
          js_anchor='function officeExpenseTotal(month){return officeExpenses.filter(r=>!month||String(r.date||\'\').startsWith(month)).reduce((s,r)=>s+n(r.amount),0)}\nfunction render(){'
          js_new='''function officeExpenseTotal(period){return officeExpenses.filter(r=>!period||String(r.date||'').startsWith(period)).reduce((s,r)=>s+n(r.amount),0)}
let periodMode='month';
function buildYearFilter(){const years=[...new Set(allRows().map(r=>String(r.date||'').slice(0,4)).filter(Boolean))];const now=String(new Date().getFullYear());if(!years.includes(now))years.push(now);years.sort().reverse();yearFilter.innerHTML=years.map(y=>`<option value="${y}">${y}年</option>`).join('');yearFilter.value=now;}
function setPeriodMode(mode){periodMode=mode;const monthly=mode==='month';periodModeMonth.classList.toggle('active',monthly);periodModeYear.classList.toggle('active',!monthly);monthField.style.display=monthly?'block':'none';yearField.classList.toggle('show',!monthly);render();}
function render(){'''
          if js_anchor not in s:
              raise SystemExit('render anchor not found')
          s=s.replace(js_anchor,js_new,1)

          # Replace month-only filtering with period filtering.
          old="function render(){const month=monthFilter.value,st=statusFilter.value,q=searchFilter.value.trim().toLowerCase();let list=allRows().filter(r=>{if(month&&!String(r.date||'').startsWith(month))return false;"
          new="function render(){const period=periodMode==='month'?monthFilter.value:yearFilter.value,st=statusFilter.value,q=searchFilter.value.trim().toLowerCase();let list=allRows().filter(r=>{if(period&&!String(r.date||'').startsWith(period))return false;"
          if old not in s:
              raise SystemExit('month filter logic not found')
          s=s.replace(old,new,1)

          # Office totals and labels use selected period.
          s=s.replace('const officeTotal=officeExpenseTotal(month),fieldProfit=', 'const officeTotal=officeExpenseTotal(period),fieldProfit=',1)
          s=s.replace("officeMonthTotal.textContent=(month?month.replace('-','年')+'月':'全期間')+'の事務所経費 '+yen(officeTotal);", "officeMonthTotal.textContent=(periodMode==='month'?(period?period.replace('-','年')+'月':'全期間'):(period?period+'年':'全期間'))+'の事務所経費 '+yen(officeTotal);",1)

          # Ensure year selector is built after data load, preserving existing load paths.
          s=s.replace('events=arr(eventSnap.val());officeExpenses=arr(officeSnap.val());render()', 'events=arr(eventSnap.val());officeExpenses=arr(officeSnap.val());buildYearFilter();render()',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- king-money.html; then exit 0; fi
          git config user.name 'FUJIWARA App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add king-money.html
          git commit -m 'Add monthly and annual toggle to KING money dashboard'
          git push origin main
