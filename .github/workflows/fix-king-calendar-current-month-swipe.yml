name: Fix KING calendar month display, swipe and compact window
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-king-calendar-current-month-swipe.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch KING calendar only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('king.html')
          s=p.read_text(encoding='utf-8')

          # Swipe: keep vertical page scroll, detect horizontal only.
          s=s.replace('.kcs-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid #dbe3ed;border-top:1px solid #dbe3ed}',
                      '.kcs-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid #dbe3ed;border-top:1px solid #dbe3ed;touch-action:pan-y}')

          # Compact card styling.
          css_anchor='.kcs-note{margin-top:9px;font-size:11px;color:#647188;font-weight:750}'
          compact_css='''.kcs-note{margin-top:9px;font-size:11px;color:#647188;font-weight:750}.kcs-toggle{border:0;border-radius:12px;background:#123b66;color:#fff;padding:10px 16px;font-weight:950;white-space:nowrap}.kcs-body{display:none;margin-top:10px}.king-construction-schedule.open .kcs-body{display:block}.king-construction-schedule:not(.open){padding:16px 18px}.king-construction-schedule:not(.open) .kcs-head{border-bottom:0;padding-bottom:0}.king-construction-schedule:not(.open) .kcs-head h2{font-size:20px}'''
          if css_anchor in s and '.kcs-toggle{' not in s:
              s=s.replace(css_anchor,compact_css,1)

          # Replace existing schedule block with a compact card that opens on demand.
          start=s.find('<section class="king-construction-schedule">')
          if start<0: raise SystemExit('schedule section start not found')
          end=s.find('</section></section>',start)
          if end<0: raise SystemExit('schedule section end not found')
          end += len('</section>')
          block='''<section class="king-construction-schedule" id="kingScheduleCard"><div class="kcs-head"><div><h2>📅 取引先名別 月間スケジュール表</h2><span class="hub-note">メイン＋建設から自動表示</span></div><button class="kcs-toggle" id="kcsToggle" onclick="toggleKingSchedule()">開く ›</button></div><div class="kcs-body" id="kcsBody"><div class="kcs-controls"><button onclick="moveKingConstructionMonth(-1)">‹ 前月</button><div class="kcs-month" id="kcsMonthTitle"></div><button onclick="moveKingConstructionMonth(1)">次月 ›</button><button onclick="resetKingConstructionMonth()">今月</button></div><select id="kcsClientFilter" class="kcs-filter" onchange="renderKingConstructionSchedule()"><option value="">すべての取引先</option></select><div class="kcs-grid" id="kcsCalendar"></div><div class="kcs-note">取引先ごとに色分け。左右スワイプでも前月・次月へ移動できます。前後月の予定はその月を開いた時だけ表示します。</div></div></section>'''
          s=s[:start]+block+s[end:]

          # Only render events for the displayed month. Adjacent month cells stay blank.
          old="var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),rr=rows.filter(function(r){return r.date===ds});html+='<div class=\"kcs-day '+(d.getMonth()===m?'':'kcs-out')+'\"><div class=\"kcs-num\">'+d.getDate()+'</div>'+rr.map(function(r){var col=kcsColor(r.client);return '<div class=\"kcs-entry\" style=\"--client-bg:'+col[0]+';--client-border:'+col[1]+'\"><b>'+kcsEsc(r.client)+'</b> <small>['+(r.src==='main'?'メイン':'建設')+']</small><br>'+kcsEsc(r.title)+(r.place?'<br>📍'+kcsEsc(r.place):'')+'</div>'}).join('')+'</div>'"
          new="var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),inMonth=d.getMonth()===m,rr=inMonth?rows.filter(function(r){return r.date===ds}):[];html+='<div class=\"kcs-day '+(inMonth?'':'kcs-out')+'\"><div class=\"kcs-num\">'+(inMonth?d.getDate():'')+'</div>'+rr.map(function(r){var col=kcsColor(r.client);return '<div class=\"kcs-entry\" style=\"--client-bg:'+col[0]+';--client-border:'+col[1]+'\"><b>'+kcsEsc(r.client)+'</b> <small>['+(r.src==='main'?'メイン':'建設')+']</small><br>'+kcsEsc(r.title)+(r.place?'<br>📍'+kcsEsc(r.place):'')+'</div>'}).join('')+'</div>'"
          if old in s:
              s=s.replace(old,new,1)
          elif 'inMonth=d.getMonth()===m' not in s:
              raise SystemExit('calendar render anchor not found')

          # Toggle + swipe handlers.
          anchor='renderKingConstructionSchedule();\n</script>'
          extra='''renderKingConstructionSchedule();
function toggleKingSchedule(){var card=document.getElementById('kingScheduleCard'),btn=document.getElementById('kcsToggle');if(!card)return;card.classList.toggle('open');if(btn)btn.textContent=card.classList.contains('open')?'閉じる ×':'開く ›';if(card.classList.contains('open'))renderKingConstructionSchedule()}
(function(){var el=document.getElementById('kcsCalendar');if(!el)return;var sx=0,sy=0;el.addEventListener('touchstart',function(e){var t=e.changedTouches&&e.changedTouches[0];if(!t)return;sx=t.clientX;sy=t.clientY},{passive:true});el.addEventListener('touchend',function(e){var t=e.changedTouches&&e.changedTouches[0];if(!t)return;var dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>=60&&Math.abs(dx)>Math.abs(dy)*1.2)moveKingConstructionMonth(dx<0?1:-1)},{passive:true})})();
</script>'''
          if 'function toggleKingSchedule()' not in s:
              if anchor not in s: raise SystemExit('script end anchor not found')
              s=s.replace(anchor,extra,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit KING fix
        shell: bash
        run: |
          if git diff --quiet -- king.html; then echo 'No change'; exit 0; fi
          git config user.name 'FUJIWARA App Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add king.html
          git commit -m 'Make KING monthly schedule compact, month-only and swipeable'
          git push origin main
