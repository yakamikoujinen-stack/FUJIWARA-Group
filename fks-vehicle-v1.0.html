<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FKS Vehicle v1.0</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef2f7;color:#172033}header{background:#1f3a5f;color:#fff;text-align:center;padding:18px}main{max-width:1050px;margin:auto;padding:16px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}input,select,textarea,button{width:100%;font-size:16px;padding:10px;margin-top:8px;border-radius:10px;border:1px solid #ccd3dd}button{background:#1f3a5f;color:#fff;border:0;font-weight:bold}.btn2{background:#888}.item{border-bottom:1px solid #eee;padding:10px 0}.warn{color:#b00020;font-weight:bold}.ok{color:#0a7a2f;font-weight:bold}a{color:#1f3a5f;font-weight:bold;text-decoration:none}.big{font-size:26px;font-weight:900}
</style></head><body><header><h1>🚗 FKS Vehicle v1.0</h1><p>車両・車検・保険・点検管理</p></header><main>
<div class="card"><a href="fks-portal-v1.0.html">← FKS Portalへ戻る</a></div>
<div class="grid"><div class="card"><h3>車両台数</h3><div id="count" class="big">0</div></div><div class="card"><h3>車検注意</h3><div id="inspectionWarn" class="big">0</div></div><div class="card"><h3>保険注意</h3><div id="insuranceWarn" class="big">0</div></div></div>
<div class="card"><h3>車両登録</h3><input id="name" placeholder="車両名"><input id="number" placeholder="ナンバー"><select id="type"><option>軽トラ</option><option>普通車</option><option>トラック</option><option>営業車</option><option>重機</option><option>その他</option></select><div class="grid"><input id="inspection" type="date"><input id="insurance" type="date"></div><div class="grid"><input id="oil" type="date"><input id="tire" type="date"></div><textarea id="memo" placeholder="メモ・修理履歴"></textarea><button onclick="addVehicle()">車両保存</button></div>
<div class="card"><h3>車両一覧</h3><div id="list">登録なし</div><button class="btn2" onclick="clearAll()">全削除</button></div></main>
<script>
function load(){return JSON.parse(localStorage.getItem("fks_vehicles")||"[]")}function save(v){localStorage.setItem("fks_vehicles",JSON.stringify(v))}
function daysUntil(s){if(!s)return null;let t=new Date();t.setHours(0,0,0,0);let d=new Date(s);d.setHours(0,0,0,0);return Math.ceil((d-t)/(86400000))}
function st(s){let d=daysUntil(s);if(d===null)return "<span class='warn'>未登録</span>";if(d<0)return "<span class='warn'>期限切れ</span>";if(d<=30)return "<span class='warn'>あと"+d+"日</span>";return "<span class='ok'>OK（あと"+d+"日）</span>"}
function addVehicle(){if(!name.value){alert("車両名を入力してください");return}let a=load();a.push({id:Date.now(),name:name.value,number:number.value,type:type.value,inspection:inspection.value,insurance:insurance.value,oil:oil.value,tire:tire.value,memo:memo.value});save(a);name.value="";number.value="";inspection.value="";insurance.value="";oil.value="";tire.value="";memo.value="";render();alert("保存しました")}
function del(id){if(confirm("削除しますか？")){save(load().filter(x=>x.id!==id));render()}}function clearAll(){if(confirm("全削除しますか？")){save([]);render()}}
function render(){let a=load();count.textContent=a.length;inspectionWarn.textContent=a.filter(x=>{let d=daysUntil(x.inspection);return d===null||d<=30}).length;insuranceWarn.textContent=a.filter(x=>{let d=daysUntil(x.insurance);return d===null||d<=30}).length;list.innerHTML=a.length?a.slice().reverse().map(v=>`<div class="item"><b>${v.name}</b>（${v.type||"-"}）<br>ナンバー：${v.number||"-"}<br>車検：${v.inspection||"未登録"} ${st(v.inspection)}<br>保険：${v.insurance||"未登録"} ${st(v.insurance)}<br>オイル交換：${v.oil||"未登録"}<br>タイヤ交換：${v.tire||"未登録"}<br>メモ：${v.memo||"-"}<br><button onclick="del(${v.id})">削除</button></div>`).join(""):"登録なし"}
render();
</script></body></html>
